<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クレーン全景・上端表示の確認</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#e4e8ee;font-family:Arial,'Yu Gothic',Meiryo,sans-serif;color:#19354a}header{max-width:850px;margin:0 auto 20px}h1{font-size:21px;margin:0 0 8px}header p{font-size:13px;line-height:1.7;margin:0}.comparison{display:flex;gap:24px;justify-content:center;align-items:flex-start}.column{width:393px;max-width:100%}.label{font-size:13px;font-weight:700;margin-bottom:10px}.phone{--page:#f4f6f9;--fg:#1a1d22;--muted:#5a6472;--line:#d6dbe3;--card:#fff;background:var(--page);color:var(--fg);width:100%;position:relative;border-radius:34px;overflow:hidden;border:1px solid #c8d0da;box-shadow:0 12px 40px #17283e1a;min-height:560px}.dark{--page:#0c0e12;--fg:#eef1f6;--muted:#9aa4b4;--line:#2a303c;--card:#191d25}.status{height:59px;position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 28px 5px;font-size:13px;font-weight:700;color:white;pointer-events:none}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#030405;border-radius:20px}.before .status{color:var(--fg)}.before .visual{margin-top:59px}.visual{position:relative;line-height:0}.visual>img{width:100%;height:auto;display:block}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(#0000002e,transparent 50%,var(--page))}.copy{position:absolute;bottom:16px;left:16px;right:16px;color:white;z-index:1;line-height:1.4;text-shadow:0 1px 8px #000b}.copy small{font-size:10px;font-weight:600;letter-spacing:2px;color:#b97b08;display:block;margin-bottom:4px}.dark .copy small{color:#ffcb5b}.copy strong{font-size:20px;font-weight:900;display:block;margin-bottom:4px}.copy p{font-size:12px;color:#ffffffd9;margin:0}.below{padding:16px;display:grid;gap:13px}.count{display:flex;align-items:center;gap:14px;padding:15px;background:linear-gradient(90deg,#f6a425,#ffcb5b);border-radius:16px;color:#241703}.cal{width:46px;height:46px;display:grid;place-items:center;background:#ffffff47;border-radius:12px;font-size:22px;flex-shrink:0}.count small{font-size:12px;font-weight:700}.count strong{display:block;font-size:32px;line-height:1.25}.count span{font-size:13px;margin-left:5px}.count p{font-size:11px;margin:3px 0 0}.score{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}.score h2{font-size:15px;margin:0 0 12px}.score p{font-size:12px;line-height:1.7;margin:0;color:var(--muted)}.tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;color:var(--muted);line-height:1.7}.tab{display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:14px 4px 24px;font-size:11px;color:var(--muted)}.tab span:first-child{color:#b97b08}footer{font-size:12px;line-height:1.7;color:#516479;max-width:850px;margin:18px auto}button{min-height:44px;padding:0 16px;background:#19354a;color:white;border:0;border-radius:8px;margin:15px 0 0}.se .status{height:20px;font-size:10px;padding:0 20px}.se .island{display:none}.se.before .visual{margin-top:20px}@media(max-width:860px){.comparison{flex-wrap:wrap}}
</style>
<header><h1>同じ夕景のまま、先端とスマホ上端まで。</h1><p>画像と配置の確認用プレビュー。iOS実機画面ではありません。下部は既存ホームを省略して示しています。</p><button id="theme">ライト／ダークを切り替え</button></header>
<main class="comparison"></main><footer>左：修正前。元画像の上端でクレーンが切れており、ステータスバー部分に背景色が残る。<br>右：上方向を描き足した4:3画像。画像全体を表示し、その空をスマホ上端まで続ける。</footer>
<script>
const hero='../../../CraneExam/Assets.xcassets/Hero.imageset/hero-full-top.png';
function phone(before){return `<section class="column"><div class="label">${before?'修正前':'修正後'}</div><article class="phone ${before?'before':'after'}"><div class="status"><span>9:41</span><div class="island"></div><span>▮▮ ▰</span></div><div class="visual"><img src="${before?'original-hero.jpg':hero}" alt="${before?'上端で切れたクレーン':'先端まで見えるクレーン'}"><div class="copy"><small>KNOWLEDGE BUILDS TOMORROW</small><strong>クレーン・デリック運転士 試験対策</strong><p>確かな知識で、安全な現場をつくる。</p></div></div><div class="below"><div class="count"><div class="cal">▦</div><div><small>試験まで</small><strong>24<span>日</span></strong><p>試験日はサンプルです</p></div></div><div class="score"><h2>分野別の実力</h2><p>成績・学習カードなど、これ以降のホームの構成は変更していません。</p></div></div><nav class="tab"><span>ホーム</span><span>教材</span><span>用語</span><span>模試・成績</span><span>設定</span></nav></article></section>`}
document.querySelector('.comparison').innerHTML=phone(true)+phone(false);
theme.addEventListener('click',()=>document.querySelectorAll('.phone').forEach(e=>e.classList.toggle('dark')));
</script></html>
