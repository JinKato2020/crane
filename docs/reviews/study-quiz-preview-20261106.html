、空洞の円柱の体積を引きます。外半径をR、内半径をrとすると、「R²×π×高さ − r²×π×高さ」をまとめて、**(R²−r²)×π×高さ** です。", "text": "パイプ は、外側の円柱の体積から、空洞の円柱の体積を引きます。外半径をR、内半径をrとすると、「R²×π×高さ − r²×π×高さ」をまとめて、(R²−r²)×π×高さ です。", "terms": [], "block": "4-2-6a84541367a6"}, {"id": "4-2/16/text", "raw": "**球** の体積は「半径³×π×4÷3」。半径³は、半径を3回掛けることです。", "text": "球 の体積は「半径³×π×4÷3」。半径³は、半径を3回掛けることです。", "terms": [], "block": "4-2-e77a1a635e07"}, {"id": "4-2/17/text", "raw": "**円錐** の体積は「半径²×π×高さ÷3」。図の薄い円柱と比べると、底面と高さが同じ円錐は、体積が円柱の**1/3** になります。", "text": "円錐 の体積は「半径²×π×高さ÷3」。図の薄い円柱と比べると、底面と高さが同じ円錐は、体積が円柱の1/3 になります。", "terms": [], "block": "4-2-88a7ff9192db"}, {"id": "4-2/19/items:0", "raw": "**例題1（鋼の直方体）**：1m × 0.5m × 0.2m の鋼のかたまりの質量は？", "text": "例題1（鋼の直方体）：1m × 0.5m × 0.2m の鋼のかたまりの質量は？", "terms": [], "block": "4-2-0e0779be35a6"}, {"id": "4-2/20/text", "raw": "→ **体積** = 1 × 0.5 × 0.2 = 0.1m³", "text": "→ 体積 = 1 × 0.5 × 0.2 = 0.1m³", "terms": [], "block": "4-2-2a9a5a300af0"}, {"id": "4-2/21/text", "raw": "→ 鋼は7.8t/m³なので、質量 = 0.1 × 7.8 = **0.78t ＝ 780kg**", "text": "→ 鋼は7.8t/m³なので、質量 = 0.1 × 7.8 = 0.78t ＝ 780kg", "terms": [], "block": "4-2-12909b4e4b36"}, {"id": "4-2/23/items:0", "raw": "**例題2（コンクリート円柱）**：直径1m・高さ4mのコンクリート円柱の質量は？", "text": "例題2（コンクリート円柱）：直径1m・高さ4mのコンクリート円柱の質量は？", "terms": [], "block": "4-2-3eedec82804a"}, {"id": "4-2/24/text", "raw": "→ 半径は直径の半分なので0.5m。体積 = 0.5 × 0.5 × 3.14 × 4 = **3.14m³**", "text": "→ 半径は直径の半分なので0.5m。体積 = 0.5 × 0.5 × 3.14 × 4 = 3.14m³", "terms": [], "block": "4-2-62df6e628c13"}, {"id": "4-2/25/text", "raw": "→ コンクリートは2.3t/m³なので、質量 = 2.3 × 3.14 ≒ **7.22t**（この荷は4-6のつり角度の例題でも使います）", "text": "→ コンクリートは2.3t/m³なので、質量 = 2.3 × 3.14 ≒ 7.22t（この荷は4-6のつり角度の例題でも使います）", "terms": [], "block": "4-2-9e28358ab888"}, {"id": "4-2/28/text", "raw": "同じ材料で縦・横・高さを全部k倍にすると、体積と質量は **k³倍**。全部2倍なら8倍、全部4倍なら64倍、全部1/2なら1/8です。", "text": "同じ材料で縦・横・高さを全部k倍にすると、体積と質量は k³倍。全部2倍なら8倍、全部4倍なら64倍、全部1/2なら1/8です。", "terms": [], "block": "4-2-5867c03e2704"}, {"id": "4-2/29/text", "raw": "円柱の高さを変えず、直径だけk倍にすると、底面積がk²倍になるため、質量も **k²倍**。直径だけ3倍なら9倍です。", "text": "円柱の高さを変えず、直径だけk倍にすると、底面積がk²倍になるため、質量も k²倍。直径だけ3倍なら9倍です。", "terms": [], "block": "4-2-53f823059739"}], "candidates": [{"id": "4-2/1/text#6", "fieldID": "4-2/1/text", "block": "4-2-b6e915549a54", "answer": "体積〔m³〕×密度〔t/m³〕", "category": "key", "prompt": "［式？］", "start": 6, "end": 21, "context": "質量〔t〕＝体積〔m³〕×密度〔t/m³〕", "start16": 6, "end16": 21}, {"id": "4-2/3/text#0", "fieldID": "4-2/3/text", "block": "4-2-98e5ddeb4bfa", "answer": "密度", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "密度は、単位体積あたりの質量です。鋼の7.8t/m³なら、「1m³で7.8t」。体積が半分なら質量も半分になります。", "start16": 0, "end16": 2}, {"id": "4-2/3/text#19", "fieldID": "4-2/3/text", "block": "4-2-98e5ddeb4bfa", "answer": "7.8t/m³", "category": "num", "prompt": "［数値？］", "start": 19, "end": 26, "context": "密度は、単位体積あたりの質量です。鋼の7.8t/m³なら、「1m³で7.8t」。体積が半分なら質量も半分になります。", "start16": 19, "end16": 26}, {"id": "4-2/4/text#0", "fieldID": "4-2/4/text", "block": "4-2-f445d41a8a8d", "answer": "比重", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "比重 は、同じ体積の水に対して何倍の質量があるかを示す、単位のない数です。4℃の純水を基準にすると、密度をt/m³で表した数値とほぼ同じです。鋼なら密度は約7.8t/m³＝7800kg/m³、比重は約7.8です。", "start16": 0, "end16": 2}], "rounds": {"all": [["4-2/3/text#0", "4-2/4/text#0", "4-2/1/text#6", "4-2/3/text#19"], ["4-2/4/text#0", "4-2/1/text#6", "4-2/3/text#19", "4-2/3/text#0"], ["4-2/1/text#6", "4-2/3/text#19", "4-2/3/text#0", "4-2/4/text#0"], ["4-2/3/text#19", "4-2/3/text#0", "4-2/4/text#0", "4-2/1/text#6"]], "key": [["4-2/3/text#0", "4-2/4/text#0", "4-2/1/text#6"], ["4-2/4/text#0", "4-2/1/text#6", "4-2/3/text#0"], ["4-2/1/text#6", "4-2/3/text#0", "4-2/4/text#0"]], "num": [["4-2/3/text#19"]]}}, {"id": "4-3", "title": "重心と安定", "blocks": [{"type": "p", "text": "**重心** は、物の各部分に働く重力を1つにまとめたとき、その力が働くと考える点です。荷を水平につるときも、倒れにくさを考えるときも、この点を見ます。", "style": "lead", "id": "4-3-bdc50c106835"}, {"type": "sub", "text": "1．重心は、重さの中心", "id": "4-3-31a8871ec6ce"}, {"type": "p", "text": "重心は1つの点です。形や**質量**の分布が変わらなければ、置き方を変えても物に対する位置は同じです。重い部品が片側に付けば、重心もその側へ寄ります。輪の中心のように、物のない空間に重心がくることもあります。", "id": "4-3-5620e2f25b55", "quizTerms": ["重心"]}, {"type": "img", "asset": "4-3_supplement_f51_20261023", "labels": [], "legend": [], "caption": "別々の位置からつり、各回の鉛直線を板に記す。板の向きをそろえて重ねた2本の線の交点が重心G。", "id": "4-3-82e1ac60b9ab", "style": "figure", "_previewFile": "4-3_supplement_f51_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "2．荷は、重心の真上からつる", "id": "4-3-778fad89e38a"}, {"type": "img", "asset": "4-3_lifting_centroid_schematic", "caption": "左側に重い物が入った同じ箱を比較。左は重い側へ傾く様子、右はロープの長さも調整して水平に保った模式図。", "id": "4-3-d0020175342d", "style": "figure", "_previewFile": "4-3_lifting_centroid_schematic.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "箱の左側に重い物が入っていると、**重心は箱の真ん中より左へ寄ります**。見た目の中心に合わせて同じ長さのロープでつると、荷が傾きます。右のように **重心の真上にフックを合わせ、ロープの長さや掛け方も調整する** と、荷を水平に保ちやすくなります。", "id": "4-3-8ae2c3cf1d61", "quizTerms": ["真上"]}, {"type": "ul", "items": ["① 荷の形・**質量**の分布から重心を見積もり、フックをその真上に合わせて玉掛けする。", "② ゆっくり地切りし、荷の姿勢と玉掛けの状態を確認する。", "③ 傾いた場合は荷を安全に下ろす。**重心**の見積もり、玉掛け位置、ロープの長さと掛かり方を確認して調整し、再度地切りする。"], "id": "4-3-9b28a498af27"}, {"type": "p", "text": "**フック・つり荷の重心・重力の向き**を1本の鉛直線で考えると、傾く理由が見えます。支える点より下に重心が来る向きへ回ろうとします。", "id": "4-3-58d20a9f535f", "style": "tip"}, {"type": "sub", "text": "支点と重心の上下関係", "id": "4-3-8980c538737b"}, {"type": "img", "asset": "4-3_supplement_f52_20261023", "labels": [], "legend": [], "caption": "棒を自由に回れる支点Oで支える例。Gは重心。OとGの位置によって、少し傾けた後の動きが変わる。", "id": "4-3-3b00e566044a", "style": "figure", "_previewFile": "4-3_supplement_f52_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "3．よく出る形の重心", "id": "4-3-cdd7b8f166a8"}, {"type": "img", "asset": "4-3_centroid_clear", "caption": "赤い点Gが重心。形と質量の分布が一様な場合。円錐は断面を使った模式図。", "id": "4-3-6a6803afab84", "style": "figure", "_previewFile": "4-3_centroid_clear.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "三角形板は底辺から高さの1/3。円柱は高さの1/2。中実の円錐・四角錐は底面から高さの1/4です。**どこから測るか** をそろえて覚えます。", "id": "4-3-ebc572cebfad"}, {"type": "ul", "items": ["**三角形板**：頂点と対辺の中点を結んだ3本の線（中線）の交点。", "**平行四辺形板**：対角線の交点。", "**台形板**：対角線で2つの三角形に分け、それぞれの重心を結ぶ直線と、上底・下底の中点を結ぶ直線の交点。"], "id": "4-3-24410159858d"}, {"type": "svg", "file": "4-3_supplement_f53_20261023.svg", "caption": "材質・厚さが一様な板、または密度が一様な中実の四角錐の場合。不規則な四角形では2つの三角形の面積と重心から求める。", "id": "4-3-be5c9d58ad5c", "style": "figure", "_previewFile": "4-3_supplement_f53_20261023.svg"}, {"type": "sub", "id": "lesson-symmetry-cg", "text": "重心は、質量分布の対称性でも分かる"}, {"type": "p", "text": "**対称面の両側で質量が対称に分布していれば、重心はその対称面上にあります。** 同じ重さを左右に置くと中央でつり合う考え方です。", "id": "4-3-725b2b05eb08"}, {"type": "p", "text": "外形が対称でも、片側に重い部品がある場合は質量分布が対称ではありません。形だけでなく、どこにどれだけの質量があるかを見ます。", "id": "4-3-5700874599f8"}, {"type": "sub", "text": "4．安定：重心の真下を見る", "id": "4-3-4f0e65005dc5"}, {"type": "img", "asset": "4-3_stability_concept21", "caption": "支点を基準に、重心を通る鉛直線が内側にあれば戻す向き、外側なら倒す向きのモーメントになる。", "id": "4-3-3821a58f80f2", "style": "figure", "_previewFile": "4-3_stability_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "少し傾けても、重心の真下が支点より内側なら、**重力**は元に戻す向きに働きます。外側まで傾けると、重力は倒す向きに働きます。", "id": "4-3-aacd5f5679d2"}, {"type": "p", "text": "**重心が低く、底面が広いほど安定する**", "emphasis": true, "id": "4-3-ca4c587fe78d", "quizTerms": ["広い"]}, {"type": "p", "text": "同じ箱でも、立てるより横に寝かせるほうが重心が低く、底面が広くなります。風などの外力があるときは、その**力のモーメント**も合わせて考えます。", "id": "4-3-eeaba920f77c", "quizTerms": ["モーメント"]}, {"type": "img", "asset": "4-3_supplement_f54_20261023", "labels": [], "legend": [], "caption": "左は質量・底面幅を同じにして重心高さを比較。右は質量・重心高さを同じにして底面幅を比較した模式図。", "id": "4-3-1da48b25944a", "style": "figure", "_previewFile": "4-3_supplement_f54_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "id": "lesson-tipping-angle", "text": "転倒し始める角度を求める"}, {"type": "p", "text": "一様な箱を底面の端Pを支点に傾け、滑らずに転倒する場合です。**重心から下ろした鉛直線がPを通る瞬間が限界** になります。", "id": "4-3-a69e6161f2c6"}, {"type": "p", "text": "**tanθ＝底面幅の半分÷重心の高さ**。θは、最初の直立姿勢から傾けた角です。重心が中央にある箱では、重心高さは全高の半分です。", "id": "4-3-b5532f5b6d5c"}, {"type": "p", "text": "幅0.60m・高さ1.60mの一様な箱なら、tanθ＝0.30÷0.80＝**0.375**。tanは直角三角形の向かいの辺÷隣の辺。高さと幅を逆に割らないようにします。外力・滑り・拘束などがある場合は、その条件も考慮します。", "id": "4-3-ef9995520a86"}, {"id": "4-3-rev26-tipping", "type": "svg", "file": "4-3_tipping_triangle_20261106.svg", "caption": "一様な箱を右へゆっくり傾ける。転倒し始める境目では、重心Gが支点Pの真上に来る。", "style": "figure", "_previewFile": "4-3_tipping_triangle_20261106.svg"}, {"id": "4-3-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-3-rev26-centroid-q", "type": "p", "text": "**確認：** 左側が重い荷を、形の中央の真上からつりました。必ず水平になる？", "style": "question"}, {"id": "4-3-rev26-centroid-a", "type": "p", "text": "**なりません。** 重心は重い側へ寄ります。水平に保つには、形の中央ではなく**重心の真上**でつります。", "style": "answer"}, {"id": "4-3-rev26-stability-q", "type": "p", "text": "**確認：** 同じ幅の箱で、重心が低い箱と高い箱では、どちらが倒れにくい？", "style": "question"}, {"id": "4-3-rev26-stability-a", "type": "p", "text": "**重心が低い箱。** 傾けても、重心から下ろした鉛直線が底面の内側に残りやすくなります。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-3/2/text", "raw": "重心は1つの点です。形や**質量**の分布が変わらなければ、置き方を変えても物に対する位置は同じです。重い部品が片側に付けば、重心もその側へ寄ります。輪の中心のように、物のない空間に重心がくることもあります。", "text": "重心は1つの点です。形や質量の分布が変わらなければ、置き方を変えても物に対する位置は同じです。重い部品が片側に付けば、重心もその側へ寄ります。輪の中心のように、物のない空間に重心がくることもあります。", "terms": ["重心"], "block": "4-3-5620e2f25b55"}, {"id": "4-3/6/text", "raw": "箱の左側に重い物が入っていると、**重心は箱の真ん中より左へ寄ります**。見た目の中心に合わせて同じ長さのロープでつると、荷が傾きます。右のように **重心の真上にフックを合わせ、ロープの長さや掛け方も調整する** と、荷を水平に保ちやすくなります。", "text": "箱の左側に重い物が入っていると、重心は箱の真ん中より左へ寄ります。見た目の中心に合わせて同じ長さのロープでつると、荷が傾きます。右のように 重心の真上にフックを合わせ、ロープの長さや掛け方も調整する と、荷を水平に保ちやすくなります。", "terms": ["真上"], "block": "4-3-8ae2c3cf1d61"}, {"id": "4-3/7/items:0", "raw": "① 荷の形・**質量**の分布から重心を見積もり、フックをその真上に合わせて玉掛けする。", "text": "① 荷の形・質量の分布から重心を見積もり、フックをその真上に合わせて玉掛けする。", "terms": [], "block": "4-3-9b28a498af27"}, {"id": "4-3/7/items:1", "raw": "② ゆっくり地切りし、荷の姿勢と玉掛けの状態を確認する。", "text": "② ゆっくり地切りし、荷の姿勢と玉掛けの状態を確認する。", "terms": [], "block": "4-3-9b28a498af27"}, {"id": "4-3/7/items:2", "raw": "③ 傾いた場合は荷を安全に下ろす。**重心**の見積もり、玉掛け位置、ロープの長さと掛かり方を確認して調整し、再度地切りする。", "text": "③ 傾いた場合は荷を安全に下ろす。重心の見積もり、玉掛け位置、ロープの長さと掛かり方を確認して調整し、再度地切りする。", "terms": [], "block": "4-3-9b28a498af27"}, {"id": "4-3/8/text", "raw": "**フック・つり荷の重心・重力の向き**を1本の鉛直線で考えると、傾く理由が見えます。支える点より下に重心が来る向きへ回ろうとします。", "text": "フック・つり荷の重心・重力の向きを1本の鉛直線で考えると、傾く理由が見えます。支える点より下に重心が来る向きへ回ろうとします。", "terms": [], "block": "4-3-58d20a9f535f"}, {"id": "4-3/13/text", "raw": "三角形板は底辺から高さの1/3。円柱は高さの1/2。中実の円錐・四角錐は底面から高さの1/4です。**どこから測るか** をそろえて覚えます。", "text": "三角形板は底辺から高さの1/3。円柱は高さの1/2。中実の円錐・四角錐は底面から高さの1/4です。どこから測るか をそろえて覚えます。", "terms": [], "block": "4-3-ebc572cebfad"}, {"id": "4-3/14/items:0", "raw": "**三角形板**：頂点と対辺の中点を結んだ3本の線（中線）の交点。", "text": "三角形板：頂点と対辺の中点を結んだ3本の線（中線）の交点。", "terms": [], "block": "4-3-24410159858d"}, {"id": "4-3/14/items:1", "raw": "**平行四辺形板**：対角線の交点。", "text": "平行四辺形板：対角線の交点。", "terms": [], "block": "4-3-24410159858d"}, {"id": "4-3/14/items:2", "raw": "**台形板**：対角線で2つの三角形に分け、それぞれの重心を結ぶ直線と、上底・下底の中点を結ぶ直線の交点。", "text": "台形板：対角線で2つの三角形に分け、それぞれの重心を結ぶ直線と、上底・下底の中点を結ぶ直線の交点。", "terms": [], "block": "4-3-24410159858d"}, {"id": "4-3/17/text", "raw": "**対称面の両側で質量が対称に分布していれば、重心はその対称面上にあります。** 同じ重さを左右に置くと中央でつり合う考え方です。", "text": "対称面の両側で質量が対称に分布していれば、重心はその対称面上にあります。 同じ重さを左右に置くと中央でつり合う考え方です。", "terms": [], "block": "4-3-725b2b05eb08"}, {"id": "4-3/18/text", "raw": "外形が対称でも、片側に重い部品がある場合は質量分布が対称ではありません。形だけでなく、どこにどれだけの質量があるかを見ます。", "text": "外形が対称でも、片側に重い部品がある場合は質量分布が対称ではありません。形だけでなく、どこにどれだけの質量があるかを見ます。", "terms": [], "block": "4-3-5700874599f8"}, {"id": "4-3/21/text", "raw": "少し傾けても、重心の真下が支点より内側なら、**重力**は元に戻す向きに働きます。外側まで傾けると、重力は倒す向きに働きます。", "text": "少し傾けても、重心の真下が支点より内側なら、重力は元に戻す向きに働きます。外側まで傾けると、重力は倒す向きに働きます。", "terms": [], "block": "4-3-aacd5f5679d2"}, {"id": "4-3/22/text", "raw": "**重心が低く、底面が広いほど安定する**", "text": "重心が低く、底面が広いほど安定する", "terms": ["広い"], "block": "4-3-ca4c587fe78d"}, {"id": "4-3/23/text", "raw": "同じ箱でも、立てるより横に寝かせるほうが重心が低く、底面が広くなります。風などの外力があるときは、その**力のモーメント**も合わせて考えます。", "text": "同じ箱でも、立てるより横に寝かせるほうが重心が低く、底面が広くなります。風などの外力があるときは、その力のモーメントも合わせて考えます。", "terms": ["モーメント"], "block": "4-3-eeaba920f77c"}, {"id": "4-3/26/text", "raw": "一様な箱を底面の端Pを支点に傾け、滑らずに転倒する場合です。**重心から下ろした鉛直線がPを通る瞬間が限界** になります。", "text": "一様な箱を底面の端Pを支点に傾け、滑らずに転倒する場合です。重心から下ろした鉛直線がPを通る瞬間が限界 になります。", "terms": [], "block": "4-3-a69e6161f2c6"}, {"id": "4-3/27/text", "raw": "**tanθ＝底面幅の半分÷重心の高さ**。θは、最初の直立姿勢から傾けた角です。重心が中央にある箱では、重心高さは全高の半分です。", "text": "tanθ＝底面幅の半分÷重心の高さ。θは、最初の直立姿勢から傾けた角です。重心が中央にある箱では、重心高さは全高の半分です。", "terms": [], "block": "4-3-b5532f5b6d5c"}, {"id": "4-3/28/text", "raw": "幅0.60m・高さ1.60mの一様な箱なら、tanθ＝0.30÷0.80＝**0.375**。tanは直角三角形の向かいの辺÷隣の辺。高さと幅を逆に割らないようにします。外力・滑り・拘束などがある場合は、その条件も考慮します。", "text": "幅0.60m・高さ1.60mの一様な箱なら、tanθ＝0.30÷0.80＝0.375。tanは直角三角形の向かいの辺÷隣の辺。高さと幅を逆に割らないようにします。外力・滑り・拘束などがある場合は、その条件も考慮します。", "terms": [], "block": "4-3-ef9995520a86"}], "candidates": [{"id": "4-3/2/text#0", "fieldID": "4-3/2/text", "block": "4-3-5620e2f25b55", "answer": "重心", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "重心は1つの点です。形や質量の分布が変わらなければ、置き方を変えても物に対する位置は同じです。重い部品が片側に付けば、重心もその側へ寄ります。輪の中心のように、物のない空間に重心がくることもあります。", "start16": 0, "end16": 2}, {"id": "4-3/6/text#73", "fieldID": "4-3/6/text", "block": "4-3-8ae2c3cf1d61", "answer": "真上", "category": "key", "prompt": "［用語？］", "start": 73, "end": 75, "context": "箱の左側に重い物が入っていると、重心は箱の真ん中より左へ寄ります。見た目の中心に合わせて同じ長さのロープでつると、荷が傾きます。右のように 重心の真上にフックを合わせ、ロープの長さや掛け方も調整する と、荷を水平に保ちやすくなります。", "start16": 73, "end16": 75}, {"id": "4-3/22/text#9", "fieldID": "4-3/22/text", "block": "4-3-ca4c587fe78d", "answer": "広い", "category": "key", "prompt": "［用語？］", "start": 9, "end": 11, "context": "重心が低く、底面が広いほど安定する", "start16": 9, "end16": 11}, {"id": "4-3/23/text#53", "fieldID": "4-3/23/text", "block": "4-3-eeaba920f77c", "answer": "モーメント", "category": "key", "prompt": "［用語？］", "start": 53, "end": 58, "context": "同じ箱でも、立てるより横に寝かせるほうが重心が低く、底面が広くなります。風などの外力があるときは、その力のモーメントも合わせて考えます。", "start16": 53, "end16": 58}], "rounds": {"all": [["4-3/6/text#73", "4-3/2/text#0", "4-3/23/text#53", "4-3/22/text#9"], ["4-3/2/text#0", "4-3/23/text#53", "4-3/22/text#9", "4-3/6/text#73"], ["4-3/23/text#53", "4-3/22/text#9", "4-3/6/text#73", "4-3/2/text#0"], ["4-3/22/text#9", "4-3/6/text#73", "4-3/2/text#0", "4-3/23/text#53"]], "key": [["4-3/6/text#73", "4-3/2/text#0", "4-3/23/text#53", "4-3/22/text#9"], ["4-3/2/text#0", "4-3/23/text#53", "4-3/22/text#9", "4-3/6/text#73"], ["4-3/23/text#53", "4-3/22/text#9", "4-3/6/text#73", "4-3/2/text#0"], ["4-3/22/text#9", "4-3/6/text#73", "4-3/2/text#0", "4-3/23/text#53"]], "num": [[]]}}, {"id": "4-4", "title": "速度・加速度と摩擦", "blocks": [{"type": "p", "text": "速さ・**加速度**は物の動き、摩擦はすべりを妨げる力を表します。数字を入れる前に、物が進む向きと力の向きを図で確かめます。", "style": "lead", "id": "4-4-b74707dd8fc9"}, {"type": "sub", "text": "1．速さ・速度・加速度", "id": "4-4-22a53d27a95c"}, {"type": "img", "asset": "4-4_speed_velocity_acceleration_trolley", "caption": "同じ台車で3つの意味を比べる。右の例は、同じ向きへ一定の加速度で速くなる場合。", "id": "4-4-953f572633fb", "style": "figure", "_previewFile": "4-4_speed_velocity_acceleration_trolley.png", "_width": 2172, "_height": 724}, {"type": "p", "text": "**速さ** は、どれくらい速く進むかです。台車が1秒で2m進むなら、速さは **2m/s**。", "id": "4-4-18f28747d903", "quizTerms": ["速さ"]}, {"type": "p", "text": "**速度** は、速さに **向き** を加えたものです。右へ2m/sと左へ2m/sは、速さは同じでも速度が違います。", "id": "4-4-40d6f9568ba0"}, {"type": "p", "text": "**加速度**は、1秒ごとに速度がどれだけ変わるか。**加速度＝（終わりの速度−初めの速度）÷時間**。単位m/s²は「1秒ごとに、速度が何m/s変わるか」を表します。", "id": "4-4-d61acac5cfa2"}, {"id": "4-4-rev26-relative-motion", "type": "p", "text": "**動いているかは、何を基準に見るかで変わります。** 走行中のクレーンの運転席に座る人は、運転席から見れば止まり、地面から見れば動いています。", "style": "tip"}, {"type": "p", "text": "**平均加速度＝(4−2)÷2＝1m/s²**", "emphasis": true, "id": "4-4-cd7fa35bf418"}, {"type": "p", "text": "加速度が一定なら、この **1m/s²** は「1秒ごとに、速度が1m/sずつ増える」という意味です。速さのm/sに、さらに「1秒あたり」が付いてm/s²になります。", "id": "4-4-eb7ed8fc41a7"}, {"type": "p", "text": "**速さ＝距離÷時間**", "emphasis": true, "id": "4-4-06c043092a02"}, {"type": "p", "text": "正負は、最初に決めた正方向で考えます。例えば右を正にすると、右向きに速くなるときの**加速度**は正、右向きに進みながら減速するときは負です。", "id": "4-4-c8d17b7b9cd9"}, {"type": "ul", "items": ["**例題1（旋回するジブ先端の速さ）**：旋回中心からジブ先端までの水平距離が10mで、ジブが一定の速さで1分間に1回転するとき、先端の速さは？ π＝3.14とします。"], "id": "4-4-c4ae50ae4d6b"}, {"type": "p", "text": "→ 先端が1回転で進む距離 ＝ 直径 × 3.14 ＝ (10 × 2) × 3.14 = 62.8m", "id": "4-4-fd07b089e7b1"}, {"type": "p", "text": "→ 時間は1分 ＝ 60秒", "id": "4-4-94c4d7d0b9b2"}, {"type": "p", "text": "→ 速さ = 62.8 ÷ 60 ≒ **1.05m/s**", "id": "4-4-4b0a2c1e2533"}, {"type": "sub", "id": "lesson-constant-acceleration-distance", "text": "加速・減速中は、平均の速度で距離を出す"}, {"type": "p", "text": "一直線上で加速度が一定なら、速度は同じ割合で変わります。**平均速度＝（初めの速度＋終わりの速度）÷2**。両端の速度の中間を使います。", "id": "4-4-8b260de523d0"}, {"type": "p", "text": "**移動距離＝平均の速さ×時間**。同じ向きに動き続ける場合は、上の平均速度の大きさを使えます。向きが途中で変わる場合は、区間を分けます。", "id": "4-4-e3e2f3075589"}, {"type": "p", "text": "**例：** 静止から3秒で1.5m/sまで一定の加速度で速くなる場合、平均の速さ＝（0＋1.5）÷2＝0.75m/s。移動距離は0.75×3＝**2.25m**。1.2m/sから4秒で止まる場合も、（1.2＋0）÷2×4＝**2.4m**です。", "id": "4-4-2e2397572c59"}, {"type": "sub", "text": "2．合成速度：斜めの距離から考える", "id": "4-4-a33caafb4d9f"}, {"type": "img", "asset": "4-4_velocity_pythagoras", "caption": "走行40m/minと横行30m/minの合成。直角三角形の斜辺が合成速度。荷振れは無視する。", "id": "4-4-3cfb078641f2", "style": "figure", "_previewFile": "4-4_velocity_pythagoras.png", "_width": 1700, "_height": 1100}, {"type": "p", "text": "直角三角形では、**横の長さ²＋縦の長さ²＝斜めの長さ²** が成り立ちます。これが **ピタゴラスの定理（三平方の定理）** です。速度の矢印も同じ方法で考えられます。", "id": "4-4-eca5cf973c77", "quizTerms": ["三平方の定理"]}, {"type": "p", "text": "40²は40×40、30²は30×30です。合計すると2500。50×50＝2500なので、斜めの合成速度は **50m/min**。この計算を「√2500＝50」と書きます。", "id": "4-4-38444ced0d3c"}, {"type": "p", "text": "3：4：5と、その倍の6：8：10はよく使う直角三角形です。", "id": "4-4-c7c0ffa7c5a6"}, {"type": "ul", "items": ["**例題2（距離でも同じ）**：走行と横行を直角方向に同時に一定の速さで行います。同じ10秒間に走行方向へ4m、横行方向へ3m進むとき、荷の進む距離は？ 荷振れは無視します。"], "id": "4-4-97dc78df4b92"}, {"type": "p", "text": "→ 4² ＋ 3² ＝ 16 ＋ 9 ＝ 25 → √25 ＝ 5 → 10秒あたり **5m**。", "id": "4-4-c793d763ea3d"}, {"type": "sub", "text": "3．慣性と、円運動する荷", "id": "4-4-3ef504c8a675"}, {"type": "img", "asset": "3-6_soft_start_daily", "caption": "急な加速と、ゆるやかな加速。左では水が台車に対して後ろ側へ偏る。矢印は加速の向きを示す模式図。", "id": "4-4-808331d88f3f", "style": "figure", "_previewFile": "3-6_soft_start_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "止まっていた台車を急に右へ動かすと、水や荷は **それまでの静止状態を保とうとします**。そのため、台車から見ると後ろへ取り残されるように動きます。これが慣性の身近な例です。", "id": "4-4-a1fd41b594ff", "quizTerms": ["慣性"]}, {"type": "p", "text": "**合力F＝質量m×加速度a。** 速度を変えるには、つり合いから余る力が必要です。同じ質量なら、急に速度を変えるほど大きな力が必要になります。", "id": "4-4-94583dccfcd4"}, {"id": "4-4-rev26-force-mass-accel", "type": "table", "headers": ["式の記号", "意味"], "rows": [["F：合力〔N〕", "働く力をすべて合わせた、動きを変える力"], ["m：質量〔kg〕", "動かす物の量"], ["a：加速度〔m/s²〕", "速度が変わるペース"]], "quizTerms": ["速度", "加速度"]}, {"type": "img", "asset": "4-4_carousel_inertia", "caption": "回転ブランコの模式図。真上から見た赤矢印は、ロープの力のうち中心へ向かう水平方向の分力。青矢印は進む向き。", "id": "4-4-2cf180eb8f6f", "style": "figure", "_previewFile": "4-4_carousel_inertia.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "遊園地の **回転ブランコ** を思い浮かべます。真上から見ると、座席は、その瞬間の進む向きへまっすぐ進もうとします。こうした運動を保とうとする性質が **慣性** です。力の合計が0なら、物は静止や等速直線運動を続けます。", "id": "4-4-6275c7eb1ad7"}, {"type": "p", "text": "でも座席は、ロープによって中心側へ引かれています。そのため進む向きが少しずつ変わり、円を描きます。この **中心へ向かう合力が向心力** です。上から見た図では、中心へ引く力と、座席が進む向きは直角になっています。", "id": "4-4-762e041e8a65", "quizTerms": ["向心力"]}, {"type": "p", "text": "乗っている人には、外へ引かれるように感じられます。座席と一緒に回る立場で使う、この外向きの見かけの力が **遠心力** です。地上から見ると向心力で円運動を説明し、一緒に回る立場では遠心力を使って説明します。向心力と遠心力は、作用・反作用の組ではありません。", "id": "4-4-772950ebff31", "quizTerms": ["遠心力"]}, {"type": "p", "text": "遠心力の大きさは「質量×速さ²÷半径」。同じ半径なら、**質量が2倍で2倍、速さが2倍で4倍** になります。", "id": "4-4-1f716fc064e6"}, {"id": "4-4-rev26-slew-radius", "type": "p", "text": "**旋回中の荷が外側へ振れると、実際の作業半径が大きくなります。** 同じ荷でもクレーンを倒そうとするモーメントが増えるため、急な旋回に注意します。", "style": "tip"}, {"id": "4-4-rev26-tangent", "type": "p", "text": "円運動の途中で、内向きに引く力がなくなると、物は**その瞬間に進んでいた向き（円の接線方向）**へ進みます。円の中心から真外へ飛び出す向きとは違います。"}, {"type": "p", "text": "クレーンの荷も同じです。急に動かしたり止めたりすると、荷はそれまでの動きを保とうとするため、荷振れやロープの**張力**増加につながります。", "id": "4-4-7cadd1146046"}, {"type": "sub", "id": "lesson-vertical-acceleration", "text": "加速する荷――重さと張力の差が、加速させる"}, {"id": "4-4-rev26-vertical-acceleration", "type": "svg", "file": "4-4_tension_acceleration_20261106.svg", "caption": "同じ荷で、下向きの重力は同じ。速度の向きではなく、加速度の向きで張力が変わる。", "style": "figure", "_previewFile": "4-4_tension_acceleration_20261106.svg"}, {"id": "4-4-rev26-vertical-cases", "type": "table", "headers": ["加速度を見る", "動きとロープの負担"], "rows": [["**上向きの加速度**", "巻上げ中の加速／巻下げ中の減速 → **張力は重量より大きい**"], ["**加速度0**", "静止／一定速度 → **張力＝重量**"], ["**下向きの加速度**", "巻下げ中の加速／巻上げ中の減速 → **張力は重量より小さい**"]]}, {"type": "p", "text": "荷に働くのは、上向きの張力Tと下向きの重力mgです。上向きを正にすると、**T−mg＝ma**。二つの力の差が、荷を加速させます。", "id": "4-4-ac46807af3be"}, {"type": "p", "text": "**T＝m(g＋a)**。aは上向きを正とした加速度です。上向き加速なら静止時より張力が大きく、下向き加速なら小さくなります。移動方向ではなく、加速度の向きで判断します。", "id": "4-4-1cfa81930619"}, {"type": "p", "text": "質量2000kgを上向き0.5m/s²で加速すると、T＝2000×(9.8＋0.5)＝**20.6kN**。張力18.6kNなら、a＝18600÷2000−9.8＝**−0.5m/s²** で、下向きの加速度です。", "id": "4-4-5dd31c0ae76d"}, {"type": "p", "text": "**動滑車を等しい張力の2本で支えるなら、2F＝m(g＋a)**。支持される荷・枠・滑車の質量を含め、理想条件で計算します。質量2000kg・上向き加速度0.4m/s²なら、自由端の力Fは**10.2kN** です。", "id": "4-4-add9a77a321c"}, {"type": "sub", "id": "lesson-centripetal-acceleration", "text": "同じ速さで回っても、加速度はある"}, {"type": "p", "text": "**速度には向きがあります。** 円運動では速さが一定でも向きが変わり続けるので、加速度は0ではありません。", "id": "4-4-06d0bb681eb3"}, {"type": "p", "text": "**向心加速度a＝v²÷r、向心力F＝mv²÷r**。速さv・半径rのとき、中心向きに働きます。「等速円運動」と「速度が一定の直線運動」を区別します。", "id": "4-4-5b906a9f86bf"}, {"type": "sub", "text": "4．摩擦：すべりを防ぐ力", "id": "4-4-ed5380ed8a33"}, {"type": "img", "asset": "4-4_friction_daily", "caption": "同じ箱を水平なロープで引く模式図。赤は引く力、青は床から箱に働く摩擦力。", "id": "4-4-b66671ebf2d6", "style": "figure", "_previewFile": "4-4_friction_daily.png", "_width": 1942, "_height": 809}, {"type": "p", "text": "**静止摩擦力**は、滑り出そうとする動きを妨げます。水平な床で静止している間は、横に引く力と同じ大きさです。引く力が0なら摩擦力も0。引く力に合わせて増えますが、限界があります。", "id": "4-4-a5d8eef0ed84"}, {"type": "p", "text": "**静止摩擦力は、いつも最大ではありません。** 引く力に合わせて増えますが、限界があります。この動き出す直前の上限が **最大静止摩擦力** です。", "id": "4-4-822a3c5ebff7"}, {"type": "img", "asset": "4-4_friction_transition", "caption": "引く力を少しずつ増やしたときの摩擦力。静止中は斜めに増え、滑り始めると小さくなり、その後は横ばいになる。", "id": "4-4-56aeb81dd0e3", "style": "figure", "_previewFile": "4-4_friction_transition.png", "_width": 1400, "_height": 880}, {"type": "p", "text": "滑り出した後は**動摩擦力**になります。この章の計算では、同じ接触面・同じ押し付ける力なら一定と扱います。速さや、横に引く力が変わっても、その値は変わりません。", "id": "4-4-8531c6f60644"}, {"type": "p", "text": "摩擦は大きさの順も問われます。**止まっているものを動かし始める直前が最も大きく(最大静止摩擦力)、滑っている間はそれより小さく(動摩擦力)**なります。さらに、ころがして動かす**転がり摩擦は、滑らせる滑り摩擦よりはるかに小さく**なります。", "id": "4-4-2dde804e3569", "quizTerms": ["転がり摩擦", "滑り摩擦"]}, {"type": "p", "text": "車輪やころを使うのは、この**転がり摩擦**の小ささを利用するためです。", "id": "4-4-86f88df72d72"}, {"type": "p", "text": "**なるほど：滑った後にさらに強く引くと、摩擦力ではなく、箱を加速させる力の差が大きくなる。** 引く力が動摩擦力と同じなら等速、動摩擦力より大きければ速くなります。", "id": "4-4-a580fd81129e"}, {"id": "4-4-100b9413542a", "type": "table", "headers": ["摩擦の種類", "求め方"], "rows": [["止まっている間の**静止摩擦力**", "動かそうとする力とつり合う。上限まで変わる"], ["**最大静止摩擦力**", "静止摩擦係数μₛ×垂直抗力N"], ["滑っている間の**動摩擦力**", "動摩擦係数μₖ×垂直抗力N"]], "quizTerms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"]}, {"type": "p", "text": "**垂直抗力N**は、面が物を垂直に押し返す力です。水平な床に置き、ほかに上下の力がなければ、N＝重量mg。斜めに引く場合などは、先に上下の力のつり合いを考えます。", "id": "4-4-161a0f10bce8"}, {"type": "p", "text": "乾いた固体の基本モデルでは、摩擦係数と垂直抗力が同じなら、見かけの接触面積を変えても**最大静止摩擦力**は同じです。", "id": "4-4-6d175733dff1", "quizTerms": ["摩擦係数"]}, {"type": "sub", "text": "計算例：摩擦係数を使う", "id": "4-4-4550a9aff6be"}, {"type": "ul", "items": ["**例題3（係数から質量を逆算）**：水平な床の物を水平方向にゆっくり引きます。動き出す直前の引く力が980N、静止摩擦係数μ＝0.4のとき、物の質量は？ ほかに上下方向の力は働かないものとします。"], "id": "4-4-bcd0a9526b1a"}, {"type": "img", "asset": "4-4_friction_example3", "caption": "動き出す直前は、引く力980Nと最大静止摩擦力が等しい。上下では重量と垂直抗力がつり合う。", "id": "4-4-3aeb4484837c", "style": "figure", "_previewFile": "4-4_friction_example3.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "→ 垂直力 Fw ＝ Fmax ÷ μ ＝ 980 ÷ 0.4 ＝ 2450N", "id": "4-4-d0675f1d8322"}, {"type": "p", "text": "→ 質量 ＝ 2450 ÷ 9.8 ＝ **250kg**", "id": "4-4-e29869ba288b"}, {"type": "ul", "items": ["**例題4（動き出す力）**：水平な床の質量100kgの物を水平方向にゆっくり引きます。静止摩擦係数μ＝0.4のとき、動き出す直前の引く力は？ ほかに上下方向の力は働かないものとします。"], "id": "4-4-933125f19e43"}, {"type": "img", "asset": "4-4_friction_example4", "caption": "100kgの重量は980N。床からの垂直抗力も980Nとなり、動き出す直前の引く力を求められる。", "id": "4-4-f2582599e55d", "style": "figure", "_previewFile": "4-4_friction_example4.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "→ Fw ＝ 100 × 9.8 ＝ 980N → Fmax ＝ 0.4 × 980 ＝ **392N**", "id": "4-4-93cf2acde727"}, {"type": "ul", "items": ["**例題5（ブレーキ）**：質量3tの荷を、ロープでドラムから直接つり下げて静止させます。ロープ張力とシューの摩擦力は、ドラム中心からそれぞれの作用線までの垂直距離が等しいものとします。\n\nシュー1個で支え、**静止摩擦係数**μ＝0.6のとき、シューがドラムを押す最小の垂直力Fは？ 自重や摩擦以外の損失は無視します。"], "id": "4-4-5a3e0605050f"}, {"type": "img", "asset": "4-4_brake_example5", "caption": "ドラムに働く力を示す模式図。シューを押す力Fと、回転を止める摩擦力μFを分けて見る。", "id": "4-4-16577941187e", "style": "figure", "_previewFile": "4-4_brake_example5.png", "_width": 1500, "_height": 1150}, {"type": "p", "text": "→ 荷の重量W＝3×9.8＝29.4kN。等しい腕の長さをrとすると、**モーメント**のつり合いはW×r＝μF×r。rを消して、0.6×F＝29.4kN。", "id": "4-4-ad10508c4971"}, {"type": "p", "text": "→ F ＝ 29.4 ÷ 0.6 ＝ **49kN**", "id": "4-4-58096bd7eb09"}, {"id": "4-4-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-4-rev26-accel-q", "type": "p", "text": "**確認：** 速度が2m/sから5m/sへ、3秒間に一定の割合で増えました。加速度と移動距離は？", "style": "question"}, {"id": "4-4-rev26-accel-a", "type": "p", "text": "**加速度1m/s²、距離10.5m。** （5−2）÷3＝1。平均の速さ（2＋5）÷2＝3.5m/sに3秒を掛けます。", "style": "answer"}, {"id": "4-4-rev26-friction-q", "type": "p", "text": "**確認：** 最大静止摩擦力が40Nの物を、水平に10Nで引いても動きません。今の摩擦力は？", "style": "question"}, {"id": "4-4-rev26-friction-a", "type": "p", "text": "**10N。** 静止摩擦力は、引く力とつり合う値です。40Nは滑り出す直前の最大値です。", "style": "answer"}, {"id": "4-4-rev26-deceleration-q", "type": "p", "text": "**確認：** 巻下げ中の荷を減速させるとき、ロープの張力は荷の重量より大きい？ 小さい？", "style": "question"}, {"id": "4-4-rev26-deceleration-a", "type": "p", "text": "**大きい。** 下向きの速度を小さくする加速度は上向き。上へ引く力が重力を上回る必要があります。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-4/3/text", "raw": "**速さ** は、どれくらい速く進むかです。台車が1秒で2m進むなら、速さは **2m/s**。", "text": "速さ は、どれくらい速く進むかです。台車が1秒で2m進むなら、速さは 2m/s。", "terms": ["速さ"], "block": "4-4-18f28747d903"}, {"id": "4-4/4/text", "raw": "**速度** は、速さに **向き** を加えたものです。右へ2m/sと左へ2m/sは、速さは同じでも速度が違います。", "text": "速度 は、速さに 向き を加えたものです。右へ2m/sと左へ2m/sは、速さは同じでも速度が違います。", "terms": [], "block": "4-4-40d6f9568ba0"}, {"id": "4-4/5/text", "raw": "**加速度**は、1秒ごとに速度がどれだけ変わるか。**加速度＝（終わりの速度−初めの速度）÷時間**。単位m/s²は「1秒ごとに、速度が何m/s変わるか」を表します。", "text": "加速度は、1秒ごとに速度がどれだけ変わるか。加速度＝（終わりの速度−初めの速度）÷時間。単位m/s²は「1秒ごとに、速度が何m/s変わるか」を表します。", "terms": [], "block": "4-4-d61acac5cfa2"}, {"id": "4-4/6/text", "raw": "**動いているかは、何を基準に見るかで変わります。** 走行中のクレーンの運転席に座る人は、運転席から見れば止まり、地面から見れば動いています。", "text": "動いているかは、何を基準に見るかで変わります。 走行中のクレーンの運転席に座る人は、運転席から見れば止まり、地面から見れば動いています。", "terms": [], "block": "4-4-rev26-relative-motion"}, {"id": "4-4/7/text", "raw": "**平均加速度＝(4−2)÷2＝1m/s²**", "text": "平均加速度＝(4−2)÷2＝1m/s²", "terms": [], "block": "4-4-cd7fa35bf418"}, {"id": "4-4/8/text", "raw": "加速度が一定なら、この **1m/s²** は「1秒ごとに、速度が1m/sずつ増える」という意味です。速さのm/sに、さらに「1秒あたり」が付いてm/s²になります。", "text": "加速度が一定なら、この 1m/s² は「1秒ごとに、速度が1m/sずつ増える」という意味です。速さのm/sに、さらに「1秒あたり」が付いてm/s²になります。", "terms": [], "block": "4-4-eb7ed8fc41a7"}, {"id": "4-4/9/text", "raw": "**速さ＝距離÷時間**", "text": "速さ＝距離÷時間", "terms": [], "block": "4-4-06c043092a02"}, {"id": "4-4/10/text", "raw": "正負は、最初に決めた正方向で考えます。例えば右を正にすると、右向きに速くなるときの**加速度**は正、右向きに進みながら減速するときは負です。", "text": "正負は、最初に決めた正方向で考えます。例えば右を正にすると、右向きに速くなるときの加速度は正、右向きに進みながら減速するときは負です。", "terms": [], "block": "4-4-c8d17b7b9cd9"}, {"id": "4-4/11/items:0", "raw": "**例題1（旋回するジブ先端の速さ）**：旋回中心からジブ先端までの水平距離が10mで、ジブが一定の速さで1分間に1回転するとき、先端の速さは？ π＝3.14とします。", "text": "例題1（旋回するジブ先端の速さ）：旋回中心からジブ先端までの水平距離が10mで、ジブが一定の速さで1分間に1回転するとき、先端の速さは？ π＝3.14とします。", "terms": [], "block": "4-4-c4ae50ae4d6b"}, {"id": "4-4/12/text", "raw": "→ 先端が1回転で進む距離 ＝ 直径 × 3.14 ＝ (10 × 2) × 3.14 = 62.8m", "text": "→ 先端が1回転で進む距離 ＝ 直径 × 3.14 ＝ (10 × 2) × 3.14 = 62.8m", "terms": [], "block": "4-4-fd07b089e7b1"}, {"id": "4-4/13/text", "raw": "→ 時間は1分 ＝ 60秒", "text": "→ 時間は1分 ＝ 60秒", "terms": [], "block": "4-4-94c4d7d0b9b2"}, {"id": "4-4/14/text", "raw": "→ 速さ = 62.8 ÷ 60 ≒ **1.05m/s**", "text": "→ 速さ = 62.8 ÷ 60 ≒ 1.05m/s", "terms": [], "block": "4-4-4b0a2c1e2533"}, {"id": "4-4/16/text", "raw": "一直線上で加速度が一定なら、速度は同じ割合で変わります。**平均速度＝（初めの速度＋終わりの速度）÷2**。両端の速度の中間を使います。", "text": "一直線上で加速度が一定なら、速度は同じ割合で変わります。平均速度＝（初めの速度＋終わりの速度）÷2。両端の速度の中間を使います。", "terms": [], "block": "4-4-8b260de523d0"}, {"id": "4-4/17/text", "raw": "**移動距離＝平均の速さ×時間**。同じ向きに動き続ける場合は、上の平均速度の大きさを使えます。向きが途中で変わる場合は、区間を分けます。", "text": "移動距離＝平均の速さ×時間。同じ向きに動き続ける場合は、上の平均速度の大きさを使えます。向きが途中で変わる場合は、区間を分けます。", "terms": [], "block": "4-4-e3e2f3075589"}, {"id": "4-4/18/text", "raw": "**例：** 静止から3秒で1.5m/sまで一定の加速度で速くなる場合、平均の速さ＝（0＋1.5）÷2＝0.75m/s。移動距離は0.75×3＝**2.25m**。1.2m/sから4秒で止まる場合も、（1.2＋0）÷2×4＝**2.4m**です。", "text": "例： 静止から3秒で1.5m/sまで一定の加速度で速くなる場合、平均の速さ＝（0＋1.5）÷2＝0.75m/s。移動距離は0.75×3＝2.25m。1.2m/sから4秒で止まる場合も、（1.2＋0）÷2×4＝2.4mです。", "terms": [], "block": "4-4-2e2397572c59"}, {"id": "4-4/21/text", "raw": "直角三角形では、**横の長さ²＋縦の長さ²＝斜めの長さ²** が成り立ちます。これが **ピタゴラスの定理（三平方の定理）** です。速度の矢印も同じ方法で考えられます。", "text": "直角三角形では、横の長さ²＋縦の長さ²＝斜めの長さ² が成り立ちます。これが ピタゴラスの定理（三平方の定理） です。速度の矢印も同じ方法で考えられます。", "terms": ["三平方の定理"], "block": "4-4-eca5cf973c77"}, {"id": "4-4/22/text", "raw": "40²は40×40、30²は30×30です。合計すると2500。50×50＝2500なので、斜めの合成速度は **50m/min**。この計算を「√2500＝50」と書きます。", "text": "40²は40×40、30²は30×30です。合計すると2500。50×50＝2500なので、斜めの合成速度は 50m/min。この計算を「√2500＝50」と書きます。", "terms": [], "block": "4-4-38444ced0d3c"}, {"id": "4-4/23/text", "raw": "3：4：5と、その倍の6：8：10はよく使う直角三角形です。", "text": "3：4：5と、その倍の6：8：10はよく使う直角三角形です。", "terms": [], "block": "4-4-c7c0ffa7c5a6"}, {"id": "4-4/24/items:0", "raw": "**例題2（距離でも同じ）**：走行と横行を直角方向に同時に一定の速さで行います。同じ10秒間に走行方向へ4m、横行方向へ3m進むとき、荷の進む距離は？ 荷振れは無視します。", "text": "例題2（距離でも同じ）：走行と横行を直角方向に同時に一定の速さで行います。同じ10秒間に走行方向へ4m、横行方向へ3m進むとき、荷の進む距離は？ 荷振れは無視します。", "terms": [], "block": "4-4-97dc78df4b92"}, {"id": "4-4/25/text", "raw": "→ 4² ＋ 3² ＝ 16 ＋ 9 ＝ 25 → √25 ＝ 5 → 10秒あたり **5m**。", "text": "→ 4² ＋ 3² ＝ 16 ＋ 9 ＝ 25 → √25 ＝ 5 → 10秒あたり 5m。", "terms": [], "block": "4-4-c793d763ea3d"}, {"id": "4-4/28/text", "raw": "止まっていた台車を急に右へ動かすと、水や荷は **それまでの静止状態を保とうとします**。そのため、台車から見ると後ろへ取り残されるように動きます。これが慣性の身近な例です。", "text": "止まっていた台車を急に右へ動かすと、水や荷は それまでの静止状態を保とうとします。そのため、台車から見ると後ろへ取り残されるように動きます。これが慣性の身近な例です。", "terms": ["慣性"], "block": "4-4-a1fd41b594ff"}, {"id": "4-4/29/text", "raw": "**合力F＝質量m×加速度a。** 速度を変えるには、つり合いから余る力が必要です。同じ質量なら、急に速度を変えるほど大きな力が必要になります。", "text": "合力F＝質量m×加速度a。 速度を変えるには、つり合いから余る力が必要です。同じ質量なら、急に速度を変えるほど大きな力が必要になります。", "terms": [], "block": "4-4-94583dccfcd4"}, {"id": "4-4/30/rows:0:0", "raw": "F：合力〔N〕", "text": "F：合力〔N〕", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/30/rows:0:1", "raw": "働く力をすべて合わせた、動きを変える力", "text": "働く力をすべて合わせた、動きを変える力", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/30/rows:1:0", "raw": "m：質量〔kg〕", "text": "m：質量〔kg〕", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/30/rows:1:1", "raw": "動かす物の量", "text": "動かす物の量", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/30/rows:2:0", "raw": "a：加速度〔m/s²〕", "text": "a：加速度〔m/s²〕", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/30/rows:2:1", "raw": "速度が変わるペース", "text": "速度が変わるペース", "terms": ["速度", "加速度"], "block": "4-4-rev26-force-mass-accel"}, {"id": "4-4/32/text", "raw": "遊園地の **回転ブランコ** を思い浮かべます。真上から見ると、座席は、その瞬間の進む向きへまっすぐ進もうとします。こうした運動を保とうとする性質が **慣性** です。力の合計が0なら、物は静止や等速直線運動を続けます。", "text": "遊園地の 回転ブランコ を思い浮かべます。真上から見ると、座席は、その瞬間の進む向きへまっすぐ進もうとします。こうした運動を保とうとする性質が 慣性 です。力の合計が0なら、物は静止や等速直線運動を続けます。", "terms": [], "block": "4-4-6275c7eb1ad7"}, {"id": "4-4/33/text", "raw": "でも座席は、ロープによって中心側へ引かれています。そのため進む向きが少しずつ変わり、円を描きます。この **中心へ向かう合力が向心力** です。上から見た図では、中心へ引く力と、座席が進む向きは直角になっています。", "text": "でも座席は、ロープによって中心側へ引かれています。そのため進む向きが少しずつ変わり、円を描きます。この 中心へ向かう合力が向心力 です。上から見た図では、中心へ引く力と、座席が進む向きは直角になっています。", "terms": ["向心力"], "block": "4-4-762e041e8a65"}, {"id": "4-4/34/text", "raw": "乗っている人には、外へ引かれるように感じられます。座席と一緒に回る立場で使う、この外向きの見かけの力が **遠心力** です。地上から見ると向心力で円運動を説明し、一緒に回る立場では遠心力を使って説明します。向心力と遠心力は、作用・反作用の組ではありません。", "text": "乗っている人には、外へ引かれるように感じられます。座席と一緒に回る立場で使う、この外向きの見かけの力が 遠心力 です。地上から見ると向心力で円運動を説明し、一緒に回る立場では遠心力を使って説明します。向心力と遠心力は、作用・反作用の組ではありません。", "terms": ["遠心力"], "block": "4-4-772950ebff31"}, {"id": "4-4/35/text", "raw": "遠心力の大きさは「質量×速さ²÷半径」。同じ半径なら、**質量が2倍で2倍、速さが2倍で4倍** になります。", "text": "遠心力の大きさは「質量×速さ²÷半径」。同じ半径なら、質量が2倍で2倍、速さが2倍で4倍 になります。", "terms": [], "block": "4-4-1f716fc064e6"}, {"id": "4-4/36/text", "raw": "**旋回中の荷が外側へ振れると、実際の作業半径が大きくなります。** 同じ荷でもクレーンを倒そうとするモーメントが増えるため、急な旋回に注意します。", "text": "旋回中の荷が外側へ振れると、実際の作業半径が大きくなります。 同じ荷でもクレーンを倒そうとするモーメントが増えるため、急な旋回に注意します。", "terms": [], "block": "4-4-rev26-slew-radius"}, {"id": "4-4/37/text", "raw": "円運動の途中で、内向きに引く力がなくなると、物は**その瞬間に進んでいた向き（円の接線方向）**へ進みます。円の中心から真外へ飛び出す向きとは違います。", "text": "円運動の途中で、内向きに引く力がなくなると、物はその瞬間に進んでいた向き（円の接線方向）へ進みます。円の中心から真外へ飛び出す向きとは違います。", "terms": [], "block": "4-4-rev26-tangent"}, {"id": "4-4/38/text", "raw": "クレーンの荷も同じです。急に動かしたり止めたりすると、荷はそれまでの動きを保とうとするため、荷振れやロープの**張力**増加につながります。", "text": "クレーンの荷も同じです。急に動かしたり止めたりすると、荷はそれまでの動きを保とうとするため、荷振れやロープの張力増加につながります。", "terms": [], "block": "4-4-7cadd1146046"}, {"id": "4-4/41/rows:0:0", "raw": "**上向きの加速度**", "text": "上向きの加速度", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/41/rows:0:1", "raw": "巻上げ中の加速／巻下げ中の減速 → **張力は重量より大きい**", "text": "巻上げ中の加速／巻下げ中の減速 → 張力は重量より大きい", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/41/rows:1:0", "raw": "**加速度0**", "text": "加速度0", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/41/rows:1:1", "raw": "静止／一定速度 → **張力＝重量**", "text": "静止／一定速度 → 張力＝重量", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/41/rows:2:0", "raw": "**下向きの加速度**", "text": "下向きの加速度", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/41/rows:2:1", "raw": "巻下げ中の加速／巻上げ中の減速 → **張力は重量より小さい**", "text": "巻下げ中の加速／巻上げ中の減速 → 張力は重量より小さい", "terms": [], "block": "4-4-rev26-vertical-cases"}, {"id": "4-4/42/text", "raw": "荷に働くのは、上向きの張力Tと下向きの重力mgです。上向きを正にすると、**T−mg＝ma**。二つの力の差が、荷を加速させます。", "text": "荷に働くのは、上向きの張力Tと下向きの重力mgです。上向きを正にすると、T−mg＝ma。二つの力の差が、荷を加速させます。", "terms": [], "block": "4-4-ac46807af3be"}, {"id": "4-4/43/text", "raw": "**T＝m(g＋a)**。aは上向きを正とした加速度です。上向き加速なら静止時より張力が大きく、下向き加速なら小さくなります。移動方向ではなく、加速度の向きで判断します。", "text": "T＝m(g＋a)。aは上向きを正とした加速度です。上向き加速なら静止時より張力が大きく、下向き加速なら小さくなります。移動方向ではなく、加速度の向きで判断します。", "terms": [], "block": "4-4-1cfa81930619"}, {"id": "4-4/44/text", "raw": "質量2000kgを上向き0.5m/s²で加速すると、T＝2000×(9.8＋0.5)＝**20.6kN**。張力18.6kNなら、a＝18600÷2000−9.8＝**−0.5m/s²** で、下向きの加速度です。", "text": "質量2000kgを上向き0.5m/s²で加速すると、T＝2000×(9.8＋0.5)＝20.6kN。張力18.6kNなら、a＝18600÷2000−9.8＝−0.5m/s² で、下向きの加速度です。", "terms": [], "block": "4-4-5dd31c0ae76d"}, {"id": "4-4/45/text", "raw": "**動滑車を等しい張力の2本で支えるなら、2F＝m(g＋a)**。支持される荷・枠・滑車の質量を含め、理想条件で計算します。質量2000kg・上向き加速度0.4m/s²なら、自由端の力Fは**10.2kN** です。", "text": "動滑車を等しい張力の2本で支えるなら、2F＝m(g＋a)。支持される荷・枠・滑車の質量を含め、理想条件で計算します。質量2000kg・上向き加速度0.4m/s²なら、自由端の力Fは10.2kN です。", "terms": [], "block": "4-4-add9a77a321c"}, {"id": "4-4/47/text", "raw": "**速度には向きがあります。** 円運動では速さが一定でも向きが変わり続けるので、加速度は0ではありません。", "text": "速度には向きがあります。 円運動では速さが一定でも向きが変わり続けるので、加速度は0ではありません。", "terms": [], "block": "4-4-06d0bb681eb3"}, {"id": "4-4/48/text", "raw": "**向心加速度a＝v²÷r、向心力F＝mv²÷r**。速さv・半径rのとき、中心向きに働きます。「等速円運動」と「速度が一定の直線運動」を区別します。", "text": "向心加速度a＝v²÷r、向心力F＝mv²÷r。速さv・半径rのとき、中心向きに働きます。「等速円運動」と「速度が一定の直線運動」を区別します。", "terms": [], "block": "4-4-5b906a9f86bf"}, {"id": "4-4/51/text", "raw": "**静止摩擦力**は、滑り出そうとする動きを妨げます。水平な床で静止している間は、横に引く力と同じ大きさです。引く力が0なら摩擦力も0。引く力に合わせて増えますが、限界があります。", "text": "静止摩擦力は、滑り出そうとする動きを妨げます。水平な床で静止している間は、横に引く力と同じ大きさです。引く力が0なら摩擦力も0。引く力に合わせて増えますが、限界があります。", "terms": [], "block": "4-4-a5d8eef0ed84"}, {"id": "4-4/52/text", "raw": "**静止摩擦力は、いつも最大ではありません。** 引く力に合わせて増えますが、限界があります。この動き出す直前の上限が **最大静止摩擦力** です。", "text": "静止摩擦力は、いつも最大ではありません。 引く力に合わせて増えますが、限界があります。この動き出す直前の上限が 最大静止摩擦力 です。", "terms": [], "block": "4-4-822a3c5ebff7"}, {"id": "4-4/54/text", "raw": "滑り出した後は**動摩擦力**になります。この章の計算では、同じ接触面・同じ押し付ける力なら一定と扱います。速さや、横に引く力が変わっても、その値は変わりません。", "text": "滑り出した後は動摩擦力になります。この章の計算では、同じ接触面・同じ押し付ける力なら一定と扱います。速さや、横に引く力が変わっても、その値は変わりません。", "terms": [], "block": "4-4-8531c6f60644"}, {"id": "4-4/55/text", "raw": "摩擦は大きさの順も問われます。**止まっているものを動かし始める直前が最も大きく(最大静止摩擦力)、滑っている間はそれより小さく(動摩擦力)**なります。さらに、ころがして動かす**転がり摩擦は、滑らせる滑り摩擦よりはるかに小さく**なります。", "text": "摩擦は大きさの順も問われます。止まっているものを動かし始める直前が最も大きく(最大静止摩擦力)、滑っている間はそれより小さく(動摩擦力)なります。さらに、ころがして動かす転がり摩擦は、滑らせる滑り摩擦よりはるかに小さくなります。", "terms": ["転がり摩擦", "滑り摩擦"], "block": "4-4-2dde804e3569"}, {"id": "4-4/56/text", "raw": "車輪やころを使うのは、この**転がり摩擦**の小ささを利用するためです。", "text": "車輪やころを使うのは、この転がり摩擦の小ささを利用するためです。", "terms": [], "block": "4-4-86f88df72d72"}, {"id": "4-4/57/text", "raw": "**なるほど：滑った後にさらに強く引くと、摩擦力ではなく、箱を加速させる力の差が大きくなる。** 引く力が動摩擦力と同じなら等速、動摩擦力より大きければ速くなります。", "text": "なるほど：滑った後にさらに強く引くと、摩擦力ではなく、箱を加速させる力の差が大きくなる。 引く力が動摩擦力と同じなら等速、動摩擦力より大きければ速くなります。", "terms": [], "block": "4-4-a580fd81129e"}, {"id": "4-4/58/rows:0:0", "raw": "止まっている間の**静止摩擦力**", "text": "止まっている間の静止摩擦力", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/58/rows:0:1", "raw": "動かそうとする力とつり合う。上限まで変わる", "text": "動かそうとする力とつり合う。上限まで変わる", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/58/rows:1:0", "raw": "**最大静止摩擦力**", "text": "最大静止摩擦力", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/58/rows:1:1", "raw": "静止摩擦係数μₛ×垂直抗力N", "text": "静止摩擦係数μₛ×垂直抗力N", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/58/rows:2:0", "raw": "滑っている間の**動摩擦力**", "text": "滑っている間の動摩擦力", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/58/rows:2:1", "raw": "動摩擦係数μₖ×垂直抗力N", "text": "動摩擦係数μₖ×垂直抗力N", "terms": ["静止摩擦力", "最大静止摩擦力", "動摩擦力", "垂直抗力"], "block": "4-4-100b9413542a"}, {"id": "4-4/59/text", "raw": "**垂直抗力N**は、面が物を垂直に押し返す力です。水平な床に置き、ほかに上下の力がなければ、N＝重量mg。斜めに引く場合などは、先に上下の力のつり合いを考えます。", "text": "垂直抗力Nは、面が物を垂直に押し返す力です。水平な床に置き、ほかに上下の力がなければ、N＝重量mg。斜めに引く場合などは、先に上下の力のつり合いを考えます。", "terms": [], "block": "4-4-161a0f10bce8"}, {"id": "4-4/60/text", "raw": "乾いた固体の基本モデルでは、摩擦係数と垂直抗力が同じなら、見かけの接触面積を変えても**最大静止摩擦力**は同じです。", "text": "乾いた固体の基本モデルでは、摩擦係数と垂直抗力が同じなら、見かけの接触面積を変えても最大静止摩擦力は同じです。", "terms": ["摩擦係数"], "block": "4-4-6d175733dff1"}, {"id": "4-4/62/items:0", "raw": "**例題3（係数から質量を逆算）**：水平な床の物を水平方向にゆっくり引きます。動き出す直前の引く力が980N、静止摩擦係数μ＝0.4のとき、物の質量は？ ほかに上下方向の力は働かないものとします。", "text": "例題3（係数から質量を逆算）：水平な床の物を水平方向にゆっくり引きます。動き出す直前の引く力が980N、静止摩擦係数μ＝0.4のとき、物の質量は？ ほかに上下方向の力は働かないものとします。", "terms": [], "block": "4-4-bcd0a9526b1a"}, {"id": "4-4/64/text", "raw": "→ 垂直力 Fw ＝ Fmax ÷ μ ＝ 980 ÷ 0.4 ＝ 2450N", "text": "→ 垂直力 Fw ＝ Fmax ÷ μ ＝ 980 ÷ 0.4 ＝ 2450N", "terms": [], "block": "4-4-d0675f1d8322"}, {"id": "4-4/65/text", "raw": "→ 質量 ＝ 2450 ÷ 9.8 ＝ **250kg**", "text": "→ 質量 ＝ 2450 ÷ 9.8 ＝ 250kg", "terms": [], "block": "4-4-e29869ba288b"}, {"id": "4-4/66/items:0", "raw": "**例題4（動き出す力）**：水平な床の質量100kgの物を水平方向にゆっくり引きます。静止摩擦係数μ＝0.4のとき、動き出す直前の引く力は？ ほかに上下方向の力は働かないものとします。", "text": "例題4（動き出す力）：水平な床の質量100kgの物を水平方向にゆっくり引きます。静止摩擦係数μ＝0.4のとき、動き出す直前の引く力は？ ほかに上下方向の力は働かないものとします。", "terms": [], "block": "4-4-933125f19e43"}, {"id": "4-4/68/text", "raw": "→ Fw ＝ 100 × 9.8 ＝ 980N → Fmax ＝ 0.4 × 980 ＝ **392N**", "text": "→ Fw ＝ 100 × 9.8 ＝ 980N → Fmax ＝ 0.4 × 980 ＝ 392N", "terms": [], "block": "4-4-93cf2acde727"}, {"id": "4-4/69/items:0", "raw": "**例題5（ブレーキ）**：質量3tの荷を、ロープでドラムから直接つり下げて静止させます。ロープ張力とシューの摩擦力は、ドラム中心からそれぞれの作用線までの垂直距離が等しいものとします。\n\nシュー1個で支え、**静止摩擦係数**μ＝0.6のとき、シューがドラムを押す最小の垂直力Fは？ 自重や摩擦以外の損失は無視します。", "text": "例題5（ブレーキ）：質量3tの荷を、ロープでドラムから直接つり下げて静止させます。ロープ張力とシューの摩擦力は、ドラム中心からそれぞれの作用線までの垂直距離が等しいものとします。\n\nシュー1個で支え、静止摩擦係数μ＝0.6のとき、シューがドラムを押す最小の垂直力Fは？ 自重や摩擦以外の損失は無視します。", "terms": [], "block": "4-4-5a3e0605050f"}, {"id": "4-4/71/text", "raw": "→ 荷の重量W＝3×9.8＝29.4kN。等しい腕の長さをrとすると、**モーメント**のつり合いはW×r＝μF×r。rを消して、0.6×F＝29.4kN。", "text": "→ 荷の重量W＝3×9.8＝29.4kN。等しい腕の長さをrとすると、モーメントのつり合いはW×r＝μF×r。rを消して、0.6×F＝29.4kN。", "terms": [], "block": "4-4-ad10508c4971"}, {"id": "4-4/72/text", "raw": "→ F ＝ 29.4 ÷ 0.6 ＝ **49kN**", "text": "→ F ＝ 29.4 ÷ 0.6 ＝ 49kN", "terms": [], "block": "4-4-58096bd7eb09"}], "candidates": [{"id": "4-4/3/text#0", "fieldID": "4-4/3/text", "block": "4-4-18f28747d903", "answer": "速さ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "速さ は、どれくらい速く進むかです。台車が1秒で2m進むなら、速さは 2m/s。", "start16": 0, "end16": 2}, {"id": "4-4/21/text#48", "fieldID": "4-4/21/text", "block": "4-4-eca5cf973c77", "answer": "三平方の定理", "category": "key", "prompt": "［用語？］", "start": 48, "end": 54, "context": "直角三角形では、横の長さ²＋縦の長さ²＝斜めの長さ² が成り立ちます。これが ピタゴラスの定理（三平方の定理） です。速度の矢印も同じ方法で考えられます。", "start16": 48, "end16": 54}, {"id": "4-4/28/text#73", "fieldID": "4-4/28/text", "block": "4-4-a1fd41b594ff", "answer": "慣性", "category": "key", "prompt": "［用語？］", "start": 73, "end": 75, "context": "止まっていた台車を急に右へ動かすと、水や荷は それまでの静止状態を保とうとします。そのため、台車から見ると後ろへ取り残されるように動きます。これが慣性の身近な例です。", "start16": 73, "end16": 75}, {"id": "4-4/30/rows:2:0#2", "fieldID": "4-4/30/rows:2:0", "block": "4-4-rev26-force-mass-accel", "answer": "加速度", "category": "key", "prompt": "［用語？］", "start": 2, "end": 5, "context": "a：加速度〔m/s²〕", "start16": 2, "end16": 5}, {"id": "4-4/30/rows:2:1#0", "fieldID": "4-4/30/rows:2:1", "block": "4-4-rev26-force-mass-accel", "answer": "速度", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "速度が変わるペース", "start16": 0, "end16": 2}, {"id": "4-4/33/text#61", "fieldID": "4-4/33/text", "block": "4-4-762e041e8a65", "answer": "向心力", "category": "key", "prompt": "［用語？］", "start": 61, "end": 64, "context": "でも座席は、ロープによって中心側へ引かれています。そのため進む向きが少しずつ変わり、円を描きます。この 中心へ向かう合力が向心力 です。上から見た図では、中心へ引く力と、座席が進む向きは直角になっています。", "start16": 61, "end16": 64}, {"id": "4-4/34/text#52", "fieldID": "4-4/34/text", "block": "4-4-772950ebff31", "answer": "遠心力", "category": "key", "prompt": "［用語？］", "start": 52, "end": 55, "context": "乗っている人には、外へ引かれるように感じられます。座席と一緒に回る立場で使う、この外向きの見かけの力が 遠心力 です。地上から見ると向心力で円運動を説明し、一緒に回る立場では遠心力を使って説明します。向心力と遠心力は、作用・反作用の組ではありません。", "start16": 52, "end16": 55}, {"id": "4-4/55/text#85", "fieldID": "4-4/55/text", "block": "4-4-2dde804e3569", "answer": "転がり摩擦", "category": "key", "prompt": "［用語？］", "start": 85, "end": 90, "context": "摩擦は大きさの順も問われます。止まっているものを動かし始める直前が最も大きく(最大静止摩擦力)、滑っている間はそれより小さく(動摩擦力)なります。さらに、ころがして動かす転がり摩擦は、滑らせる滑り摩擦よりはるかに小さくなります。", "start16": 85, "end16": 90}, {"id": "4-4/55/text#96", "fieldID": "4-4/55/text", "block": "4-4-2dde804e3569", "answer": "滑り摩擦", "category": "key", "prompt": "［用語？］", "start": 96, "end": 100, "context": "摩擦は大きさの順も問われます。止まっているものを動かし始める直前が最も大きく(最大静止摩擦力)、滑っている間はそれより小さく(動摩擦力)なります。さらに、ころがして動かす転がり摩擦は、滑らせる滑り摩擦よりはるかに小さくなります。", "start16": 96, "end16": 100}, {"id": "4-4/58/rows:0:0#8", "fieldID": "4-4/58/rows:0:0", "block": "4-4-100b9413542a", "answer": "静止摩擦力", "category": "key", "prompt": "［用語？］", "start": 8, "end": 13, "context": "止まっている間の静止摩擦力", "start16": 8, "end16": 13}, {"id": "4-4/58/rows:1:0#0", "fieldID": "4-4/58/rows:1:0", "block": "4-4-100b9413542a", "answer": "最大静止摩擦力", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "最大静止摩擦力", "start16": 0, "end16": 7}, {"id": "4-4/58/rows:1:1#9", "fieldID": "4-4/58/rows:1:1", "block": "4-4-100b9413542a", "answer": "垂直抗力", "category": "key", "prompt": "［用語？］", "start": 9, "end": 13, "context": "静止摩擦係数μₛ×垂直抗力N", "start16": 9, "end16": 13}, {"id": "4-4/58/rows:2:0#7", "fieldID": "4-4/58/rows:2:0", "block": "4-4-100b9413542a", "answer": "動摩擦力", "category": "key", "prompt": "［用語？］", "start": 7, "end": 11, "context": "滑っている間の動摩擦力", "start16": 7, "end16": 11}, {"id": "4-4/60/text#14", "fieldID": "4-4/60/text", "block": "4-4-6d175733dff1", "answer": "摩擦係数", "category": "key", "prompt": "［用語？］", "start": 14, "end": 18, "context": "乾いた固体の基本モデルでは、摩擦係数と垂直抗力が同じなら、見かけの接触面積を変えても最大静止摩擦力は同じです。", "start16": 14, "end16": 18}], "rounds": {"all": [["4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96", "4-4/58/rows:2:0#7", "4-4/33/text#61", "4-4/30/ro 0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48"], ["4-4/33/text#61", "4-4/30/rows:2:0#2", "4-4/34/text#52", "4-4/28/text#73", "4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85"], ["4-4/30/rows:2:0#2", "4-4/34/text#52", "4-4/28/text#73", "4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96"], ["4-4/34/text#52", "4-4/30/rows:2:1#0", "4-4/28/text#73", "4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96"], ["4-4/30/rows:2:1#0", "4-4/28/text#73", "4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96", "4-4/58/rows:2:0#7"], ["4-4/28/text#73", "4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96", "4-4/58/rows:2:0#7", "4-4/33/text#61"], ["4-4/58/rows:0:0#8", "4-4/3/text#0", "4-4/60/text#14", "4-4/58/rows:1:1#9", "4-4/21/text#48", "4-4/55/text#85", "4-4/55/text#96", "4-4/58/rows:2:0#7", "4-4/33/text#61", "4-4/30/rows:2:0#2"]], "num": [[]]}}, {"id": "4-5", "title": "荷重の種類と応力", "blocks": [{"type": "p", "text": "物にかかる力を **荷重**、材料内部の単位面積あたりの負担を **応力** といいます。まず力のかけ方を見てから、材料が受ける負担を比べます。", "style": "lead", "id": "4-5-bd4c85160a7e"}, {"type": "sub", "text": "1．荷重の種類：材料をどう変形させるか", "id": "4-5-1a81529f1b96"}, {"type": "img", "asset": "4-5_load_types_clear", "caption": "矢印は力のかけ方を示す。実物の変形を分かりやすくした模式図。", "id": "4-5-de789542c0fe", "style": "figure", "_previewFile": "4-5_load_types_clear.png", "_width": 1500, "_height": 1500}, {"id": "4-5-e4ed2d497877", "type": "table", "headers": ["荷重のかけ方", "クレーンの例"], "rows": [["**引張**：引き延ばす", "荷をつったワイヤロープ"], ["**圧縮**：押しつぶす", "車輪から荷重を受ける走行レール"], ["**せん断**：ずらして切る", "2枚の鋼板を締めるボルト"], ["**曲げ**：曲がらせる", "ガーダ・ジブ・シーブを通るロープ"], ["**ねじり**：ねじる", "電動機や巻上げドラムの軸"]]}, {"type": "p", "text": "1つの部品が複数の荷重を受けることもあります。例えばフックには引張と曲げ、ドラム軸には**ねじり**と曲げがかかります。", "id": "4-5-868d7345215e"}, {"type": "sub", "text": "2．時間や場所による分類", "id": "4-5-69a1531413f3"}, {"type": "img", "asset": "4-5_loadtime_concept21", "caption": "荷重の大きさが一定か、増減するか、向きも変わるかを見る。衝撃荷重は短い時間に大きな力がかかる場合。", "id": "4-5-5256b536e1dd", "style": "figure", "_previewFile": "4-5_loadtime_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**静荷重** は大きさ・向きが変わらない荷重です。**動荷重** は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "id": "4-5-4c6fac337bfa", "quizTerms": ["衝撃荷重", "静荷重", "動荷重", "繰返し荷重"]}, {"type": "p", "text": "**片振り**は向きが同じで大きさが変化、**両振り**は向きも交互に変化する繰返し荷重です。衝撃荷重は、**たるんだロープを急に巻き上げるとき**や、巻下げ中の急制動などで生じます。", "id": "4-5-97313e01e9a0", "quizTerms": ["片振り", "両振り"]}, {"type": "img", "asset": "4-5_distribution_concept21", "caption": "集中荷重は狭い範囲、分布荷重は広い範囲で力を受ける。図は力のかかる場所の違いを表す。", "id": "4-5-2aec9f2647c3", "style": "figure", "_previewFile": "4-5_distribution_concept21.png", "_width": 1774, "_height": 887}, {"id": "4-5-rev26-load-location", "type": "table", "headers": ["力がかかる場所", "身近な見方"], "rows": [["**集中荷重**", "狭い場所に集中する。例：はりの1か所につった荷"], ["**分布荷重**", "広い範囲に分かれてかかる。例：はり自身の重さ"]]}, {"type": "p", "text": "**疲労破壊** は、繰返しの負担で材料が壊れることです。針金を何度も曲げると折れるように、1回なら耐えられる小さな力でも、繰り返すうちに壊れることがあります。傷や腐食も疲労を進める原因になります。", "id": "4-5-2034f0d78929", "quizTerms": ["疲労破壊"]}, {"type": "sub", "text": "3．応力：同じ力を、どれだけの面積で受けるか", "id": "4-5-7eeb777a13fc"}, {"type": "img", "asset": "4-5_stress_concept21", "caption": "同じ1000Nでも、断面積50mm²なら20MPa、100mm²なら10MPa。細い部分ほど、断面積あたりの負担が大きい。", "id": "4-5-3f92cd39f828", "style": "figure", "_previewFile": "4-5_stress_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "荷重に抵抗する材料内部の力が **内力** です。この力を断面積で割った、単位面積あたりの値が **応力**。同じ力なら、断面積が小さいほど応力は大きくなります。", "id": "4-5-4d88b7e13585", "quizTerms": ["内力"]}, {"type": "p", "text": "**平均応力〔N/mm²〕＝力〔N〕÷断面積〔mm²〕**", "emphasis": true, "id": "4-5-9af3be94528e", "quizTerms": ["力〔N〕÷断面積〔mm²〕"]}, {"type": "p", "text": "**1N/mm²＝1MPa**（メガパスカル）。まっすぐ引く・押すときの平均応力は力÷断面積です。平均せん断応力も、力をせん断される面積で割って求めます。曲げ・ねじりは別の計算になります。", "id": "4-5-9cc4ada2ed89"}, {"type": "p", "text": "**円の断面積＝半径²×π＝直径²×π÷4**", "emphasis": true, "id": "4-5-8cf61220ee67"}, {"type": "ul", "items": ["**例題1（直径から面積）**：直径1cmの丸棒の断面積は？"], "id": "4-5-6a9627c938a9"}, {"type": "p", "text": "→ 直径1cm ＝ 10mm、半径は5mm。A ＝ 5² × 3.14 ＝ **78.5mm²**。直径をそのまま半径の場所に入れないよう注意。", "id": "4-5-a837794f2ced"}, {"type": "ul", "items": ["**例題1の続き（質量から応力まで一気に）**：直径1cmの丸棒1本に、質量100kgの荷を鉛直につり下げて静止させます。棒の自重を無視すると、平均引張応力はいくらですか？"], "id": "4-5-00d7b852cc3a"}, {"type": "p", "text": "→ 力 F ＝ 100 × 9.8 ＝ 980N。断面積 A ＝ 78.5mm²（上の例題1）。σ ＝ 980 ÷ 78.5 ≒ **12.5N/mm²**。kg→N→断面積mm²→N/mm² と単位をつないで解くのが、本番の計算の形です。", "id": "4-5-645197c1e1f2"}, {"type": "sub", "text": "4．ひずみ：もとの長さに対して、どれだけ伸びたか", "id": "4-5-475270b6e24c"}, {"type": "img", "asset": "4-5_strain_concept21", "caption": "ひずみは、伸びた長さをもとの長さで割った割合。1000mmに対して1mm伸びると、1÷1000＝0.001。図の伸びは見やすく拡大している。", "id": "4-5-2d78c121e8d5", "style": "figure", "_previewFile": "4-5_strain_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "同じ1mmの伸びでも、短い棒と長い棒では、伸びた割合が違います。そこで、**伸びた長さを、もとの長さで割った値** を **ひずみ** といいます。", "id": "4-5-9b6ae32d9e69"}, {"type": "p", "text": "図では、もとの長さ1000mmに対し、伸びは1mmなので、ひずみは **1÷1000＝0.001** です。長さの単位をそろえて割るため、ひずみに単位はありません。", "id": "4-5-0da4745f9ce3"}, {"type": "sub", "text": "5．応力ひずみ曲線：戻る範囲と、変形が残る範囲", "id": "4-5-cbd237f08508"}, {"type": "img", "asset": "4-5_stress_curve_clear", "caption": "軟鋼の応力ひずみ曲線。縦が応力、横がひずみ。", "id": "4-5-aa6896ab45a5", "style": "figure", "_previewFile": "4-5_stress_curve_clear.png", "_width": 1500, "_height": 1040}, {"id": "4-5-d05a10945252", "type": "table", "headers": ["曲線で読む言葉", "意味"], "rows": [["**比例限度**", "応力とひずみが比例する範囲の限界"], ["**引張強さ**", "最大荷重を、もとの断面積で割った値"], ["**破断点**", "材料が切れる点"], ["弾性限度", "力を除けば元に戻る範囲の限界"], ["降伏点", "力をあまり増やさなくても大きく変形し始める点"]], "quizTerms": ["応力", "ひずみ", "比例限度"]}, {"type": "p", "text": "書籍の基本図では、**A：比例限度 → B：引張強さ → C：破断点**の位置と意味を押さえます。力を除くと元に戻る性質が**弾性**、変形が残ることが**塑性変形**です。", "id": "4-5-68517a8266db", "style": "tip", "quizTerms": ["塑性変形", "弾性"]}, {"type": "svg", "file": "4-5_supplement_f55_20261023.svg", "caption": "軟鋼と、明瞭な降伏がない材料の曲線の模式比較。軸の縮尺・数値は示していない。", "id": "4-5-b07316703cf9", "style": "figure", "_previewFile": "4-5_supplement_f55_20261023.svg"}, {"type": "p", "text": "**許容応力** は、安全を考えて使用を認める応力の上限です。材料の強さに余裕を持たせ、通常の使用で比例限度に達しないように設計します。", "id": "4-5-d08e3227501e", "quizTerms": ["許容応力"]}, {"id": "4-5-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-5-rev26-stress-q", "type": "p", "text": "**確認：** 同じ力を受ける棒で、断面積だけを2倍にすると、平均応力は？", "style": "question"}, {"id": "4-5-rev26-stress-a", "type": "p", "text": "**1/2。** 応力＝力÷断面積。同じ負担を、2倍の面積で分けて受け持ちます。", "style": "answer"}, {"id": "4-5-rev26-strain-q", "type": "p", "text": "**確認：** 長さ2,000mmの棒が2mm伸びました。ひずみは？", "style": "question"}, {"id": "4-5-rev26-strain-a", "type": "p", "text": "**0.001。** 2÷2,000＝0.001。伸びた長さ÷もとの長さで、単位はありません。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-5/3/rows:0:0", "raw": "**引張**：引き延ばす", "text": "引張：引き延ばす", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:0:1", "raw": "荷をつったワイヤロープ", "text": "荷をつったワイヤロープ", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:1:0", "raw": "**圧縮**：押しつぶす", "text": "圧縮：押しつぶす", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:1:1", "raw": "車輪から荷重を受ける走行レール", "text": "車輪から荷重を受ける走行レール", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:2:0", "raw": "**せん断**：ずらして切る", "text": "せん断：ずらして切る", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:2:1", "raw": "2枚の鋼板を締めるボルト", "text": "2枚の鋼板を締めるボルト", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:3:0", "raw": "**曲げ**：曲がらせる", "text": "曲げ：曲がらせる", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:3:1", "raw": "ガーダ・ジブ・シーブを通るロープ", "text": "ガーダ・ジブ・シーブを通るロープ", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:4:0", "raw": "**ねじり**：ねじる", "text": "ねじり：ねじる", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/3/rows:4:1", "raw": "電動機や巻上げドラムの軸", "text": "電動機や巻上げドラムの軸", "terms": [], "block": "4-5-e4ed2d497877"}, {"id": "4-5/4/text", "raw": "1つの部品が複数の荷重を受けることもあります。例えばフックには引張と曲げ、ドラム軸には**ねじり**と曲げがかかります。", "text": "1つの部品が複数の荷重を受けることもあります。例えばフックには引張と曲げ、ドラム軸にはねじりと曲げがかかります。", "terms": [], "block": "4-5-868d7345215e"}, {"id": "4-5/7/text", "raw": "**静荷重** は大きさ・向きが変わらない荷重です。**動荷重** は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "text": "静荷重 は大きさ・向きが変わらない荷重です。動荷重 は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "terms": ["衝撃荷重", "静荷重", "動荷重", "繰返し荷重"], "block": "4-5-4c6fac337bfa"}, {"id": "4-5/8/text", "raw": "**片振り**は向きが同じで大きさが変化、**両振り**は向きも交互に変化する繰返し荷重です。衝撃荷重は、**たるんだロープを急に巻き上げるとき**や、巻下げ中の急制動などで生じます。", "text": "片振りは向きが同じで大きさが変化、両振りは向きも交互に変化する繰返し荷重です。衝撃荷重は、たるんだロープを急に巻き上げるときや、巻下げ中の急制動などで生じます。", "terms": ["片振り", "両振り"], "block": "4-5-97313e01e9a0"}, {"id": "4-5/10/rows:0:0", "raw": "**集中荷重**", "text": "集中荷重", "terms": [], "block": "4-5-rev26-load-location"}, {"id": "4-5/10/rows:0:1", "raw": "狭い場所に集中する。例：はりの1か所につった荷", "text": "狭い場所に集中する。例：はりの1か所につった荷", "terms": [], "block": "4-5-rev26-load-location"}, {"id": "4-5/10/rows:1:0", "raw": "**分布荷重**", "text": "分布荷重", "terms": [], "block": "4-5-rev26-load-location"}, {"id": "4-5/10/rows:1:1", "raw": "広い範囲に分かれてかかる。例：はり自身の重さ", "text": "広い範囲に分かれてかかる。例：はり自身の重さ", "terms": [], "block": "4-5-rev26-load-location"}, {"id": "4-5/11/text", "raw": "**疲労破壊** は、繰返しの負担で材料が壊れることです。針金を何度も曲げると折れるように、1回なら耐えられる小さな力でも、繰り返すうちに壊れることがあります。傷や腐食も疲労を進める原因になります。", "text": "疲労破壊 は、繰返しの負担で材料が壊れることです。針金を何度も曲げると折れるように、1回なら耐えられる小さな力でも、繰り返すうちに壊れることがあります。傷や腐食も疲労を進める原因になります。", "terms": ["疲労破壊"], "block": "4-5-2034f0d78929"}, {"id": "4-5/14/text", "raw": "荷重に抵抗する材料内部の力が **内力** です。この力を断面積で割った、単位面積あたりの値が **応力**。同じ力なら、断面積が小さいほど応力は大きくなります。", "text": "荷重に抵抗する材料内部の力が 内力 です。この力を断面積で割った、単位面積あたりの値が 応力。同じ力なら、断面積が小さいほど応力は大きくなります。", "terms": ["内力"], "block": "4-5-4d88b7e13585"}, {"id": "4-5/15/text", "raw": "**平均応力〔N/mm²〕＝力〔N〕÷断面積〔mm²〕**", "text": "平均応力〔N/mm²〕＝力〔N〕÷断面積〔mm²〕", "terms": ["力〔N〕÷断面積〔mm²〕"], "block": "4-5-9af3be94528e"}, {"id": "4-5/16/text", "raw": "**1N/mm²＝1MPa**（メガパスカル）。まっすぐ引く・押すときの平均応力は力÷断面積です。平均せん断応力も、力をせん断される面積で割って求めます。曲げ・ねじりは別の計算になります。", "text": "1N/mm²＝1MPa（メガパスカル）。まっすぐ引く・押すときの平均応力は力÷断面積です。平均せん断応力も、力をせん断される面積で割って求めます。曲げ・ねじりは別の計算になります。", "terms": [], "block": "4-5-9cc4ada2ed89"}, {"id": "4-5/17/text", "raw": "**円の断面積＝半径²×π＝直径²×π÷4**", "text": "円の断面積＝半径²×π＝直径²×π÷4", "terms": [], "block": "4-5-8cf61220ee67"}, {"id": "4-5/18/items:0", "raw": "**例題1（直径から面積）**：直径1cmの丸棒の断面積は？", "text": "例題1（直径から面積）：直径1cmの丸棒の断面積は？", "terms": [], "block": "4-5-6a9627c938a9"}, {"id": "4-5/19/text", "raw": "→ 直径1cm ＝ 10mm、半径は5mm。A ＝ 5² × 3.14 ＝ **78.5mm²**。直径をそのまま半径の場所に入れないよう注意。", "text": "→ 直径1cm ＝ 10mm、半径は5mm。A ＝ 5² × 3.14 ＝ 78.5mm²。直径をそのまま半径の場所に入れないよう注意。", "terms": [], "block": "4-5-a837794f2ced"}, {"id": "4-5/20/items:0", "raw": "**例題1の続き（質量から応力まで一気に）**：直径1cmの丸棒1本に、質量100kgの荷を鉛直につり下げて静止させます。棒の自重を無視すると、平均引張応力はいくらですか？", "text": "例題1の続き（質量から応力まで一気に）：直径1cmの丸棒1本に、質量100kgの荷を鉛直につり下げて静止させます。棒の自重を無視すると、平均引張応力はいくらですか？", "terms": [], "block": "4-5-00d7b852cc3a"}, {"id": "4-5/21/text", "raw": "→ 力 F ＝ 100 × 9.8 ＝ 980N。断面積 A ＝ 78.5mm²（上の例題1）。σ ＝ 980 ÷ 78.5 ≒ **12.5N/mm²**。kg→N→断面積mm²→N/mm² と単位をつないで解くのが、本番の計算の形です。", "text": "→ 力 F ＝ 100 × 9.8 ＝ 980N。断面積 A ＝ 78.5mm²（上の例題1）。σ ＝ 980 ÷ 78.5 ≒ 12.5N/mm²。kg→N→断面積mm²→N/mm² と単位をつないで解くのが、本番の計算の形です。", "terms": [], "block": "4-5-645197c1e1f2"}, {"id": "4-5/24/text", "raw": "同じ1mmの伸びでも、短い棒と長い棒では、伸びた割合が違います。そこで、**伸びた長さを、もとの長さで割った値** を **ひずみ** といいます。", "text": "同じ1mmの伸びでも、短い棒と長い棒では、伸びた割合が違います。そこで、伸びた長さを、もとの長さで割った値 を ひずみ といいます。", "terms": [], "block": "4-5-9b6ae32d9e69"}, {"id": "4-5/25/text", "raw": "図では、もとの長さ1000mmに対し、伸びは1mmなので、ひずみは **1÷1000＝0.001** です。長さの単位をそろえて割るため、ひずみに単位はありません。", "text": "図では、もとの長さ1000mmに対し、伸びは1mmなので、ひずみは 1÷1000＝0.001 です。長さの単位をそろえて割るため、ひずみに単位はありません。", "terms": [], "block": "4-5-0da4745f9ce3"}, {"id": "4-5/28/rows:0:0", "raw": "**比例限度**", "text": "比例限度", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:0:1", "raw": "応力とひずみが比例する範囲の限界", "text": "応力とひずみが比例する範囲の限界", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:1:0", "raw": "**引張強さ**", "text": "引張強さ", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:1:1", "raw": "最大荷重を、もとの断面積で割った値", "text": "最大荷重を、もとの断面積で割った値", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:2:0", "raw": "**破断点**", "text": "破断点", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:2:1", "raw": "材料が切れる点", "text": "材料が切れる点", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:3:0", "raw": "弾性限度", "text": "弾性限度", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:3:1", "raw": "力を除けば元に戻る範囲の限界", "text": "力を除けば元に戻る範囲の限界", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:4:0", "raw": "降伏点", "text": "降伏点", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/28/rows:4:1", "raw": "力をあまり増やさなくても大きく変形し始める点", "text": "力をあまり増やさなくても大きく変形し始める点", "terms": ["応力", "ひずみ", "比例限度"], "block": "4-5-d05a10945252"}, {"id": "4-5/29/text", "raw": "書籍の基本図では、**A：比例限度 → B：引張強さ → C：破断点**の位置と意味を押さえます。力を除くと元に戻る性質が**弾性**、変形が残ることが**塑性変形**です。", "text": "書籍の基本図では、A：比例限度 → B：引張強さ → C：破断点の位置と意味を押さえます。力を除くと元に戻る性質が弾性、変形が残ることが塑性変形です。", "terms": ["塑性変形", "弾性"], "block": "4-5-68517a8266db"}, {"id": "4-5/31/text", "raw": "**許容応力** は、安全を考えて使用を認める応力の上限です。材料の強さに余裕を持たせ、通常の使用で比例限度に達しないように設計します。", "text": "許容応力 は、安全を考えて使用を認める応力の上限です。材料の強さに余裕を持たせ、通常の使用で比例限度に達しないように設計します。", "terms": ["許容応力"], "block": "4-5-d08e3227501e"}], "candidates": [{"id": "4-5/7/text#0", "fieldID": "4-5/7/text", "block": "4-5-4c6fac337bfa", "answer": "静荷重", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "静荷重 は大きさ・向きが変わらない荷重です。動荷重 は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "start16": 0, "end16": 3}, {"id": "4-5/7/text#22", "fieldID": "4-5/7/text", "block": "4-5-4c6fac337bfa", "answer": "動荷重", "category": "key", "prompt": "［用語？］", "start": 22, "end": 25, "context": "静荷重 は大きさ・向きが変わらない荷重です。動荷重 は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "start16": 22, "end16": 25}, {"id": "4-5/7/text#41", "fieldID": "4-5/7/text", "block": "4-5-4c6fac337bfa", "answer": "繰返し荷重", "category": "key", "prompt": "［用語？］", "start": 41, "end": 46, "context": "静荷重 は大きさ・向きが変わらない荷重です。動荷重 は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "start16": 41, "end16": 46}, {"id": "4-5/7/text#47", "fieldID": "4-5/7/text", "block": "4-5-4c6fac337bfa", "answer": "衝撃荷重", "category": "key", "prompt": "［用語？］", "start": 47, "end": 51, "context": "静荷重 は大きさ・向きが変わらない荷重です。動荷重 は大きさや向きが変わる荷重で、繰返し荷重や衝撃荷重を含みます。", "start16": 47, "end16": 51}, {"id": "4-5/8/text#0", "fieldID": "4-5/8/text", "block": "4-5-97313e01e9a0", "answer": "片振り", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "片振りは向きが同じで大きさが変化、両振りは向きも交互に変化する繰返し荷重です。衝撃荷重は、たるんだロープを急に巻き上げるときや、巻下げ中の急制動などで生じます。", "start16": 0, "end16": 3}, {"id": "4-5/8/text#17", "fieldID": "4-5/8/text", "block": "4-5-97313e01e9a0", "answer": "両振り", "category": "key", "prompt": "［用語？］", "start": 17, "end": 20, "context": "片振りは向きが同じで大きさが変化、両振りは向きも交互に変化する繰返し荷重です。衝撃荷重は、たるんだロープを急に巻き上げるときや、巻下げ中の急制動などで生じます。", "start16": 17, "end16": 20}, {"id": "4-5/11/text#0", "fieldID": "4-5/11/text", "block": "4-5-2034f0d78929", "answer": "疲労破壊", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "疲労破壊 は、繰返しの負担で材料が壊れることです。針金を何度も曲げると折れるように、1回なら耐えられる小さな力でも、繰り返すうちに壊れることがあります。傷や腐食も疲労を進める原因になります。", "start16": 0, "end16": 4}, {"id": "4-5/14/text#15", "fieldID": "4-5/14/text", "block": "4-5-4d88b7e13585", "answer": "内力", "category": "key", "prompt": "［用語？］", "start": 15, "end": 17, "context": "荷重に抵抗する材料内部の力が 内力 です。この力を断面積で割った、単位面積あたりの値が 応力。同じ力なら、断面積が小さいほど応力は大きくなります。", "start16": 15, "end16": 17}, {"id": "4-5/15/text#12", "fieldID": "4-5/15/text", "block": "4-5-9af3be94528e", "answer": "力〔N〕÷断面積〔mm²〕", "category": "key", "prompt": "［式？］", "start": 12, "end": 25, "context": "平均応力〔N/mm²〕＝力〔N〕÷断面積〔mm²〕", "start16": 12, "end16": 25}, {"id": "4-5/28/rows:0:0#0", "fieldID": "4-5/28/rows:0:0", "block": "4-5-d05a10945252", "answer": "比例限度", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "比例限度", "start16": 0, "end16": 4}, {"id": "4-5/28/rows:0:1#0", "fieldID": "4-5/28/rows:0:1", "block": "4-5-d05a10945252", "answer": "応力", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "応力とひずみが比例する範囲の限界", "start16": 0, "end16": 2}, {"id": "4-5/28/rows:0:1#3", "fieldID": "4-5/28/rows:0:1", "block": "4-5-d05a10945252", "answer": "ひずみ", "category": "key", "prompt": "［用語？］", "start": 3, "end": 6, "context": "応力とひずみが比例する範囲の限界", "start16": 3, "end16": 6}, {"id": "4-5/29/text#57", "fieldID": "4-5/29/text", "block": "4-5-68517a8266db", "answer": "弾性", "category": "key", "prompt": "［用語？］", "start": 57, "end": 59, "context": "書籍の基本図では、A：比例限度 → B：引張強さ → C：破断点の位置と意味を押さえます。力を除くと元に戻る性質が弾性、変形が残ることが塑性変形です。", "start16": 57, "end16": 59}, {"id": "4-5/29/text#68", "fieldID": "4-5/29/text", "block": "4-5-68517a8266db", "answer": "塑性変形", "category": "key", "prompt": "［用語？］", "start": 68, "end": 72, "context": "書籍の基本図では、A：比例限度 → B：引張強さ → C：破断点の位置と意味を押さえます。力を除くと元に戻る性質が弾性、変形が残ることが塑性変形です。", "start16": 68, "end16": 72}, {"id": "4-5/31/text#0", "fieldID": "4-5/31/text", "block": "4-5-d08e3227501e", "answer": "許容応力", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "許容応力 は、安全を考えて使用を認める応力の上限です。材料の強さに余裕を持たせ、通常の使用で比例限度に達しないように設計します。", "start16": 0, "end16": 4}], "rounds": {"all": [["4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22", "4-5/29/text#57", "4-5/29/text#68", "4-5/31/text#0"], ["4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22", "4-5/29/text#57", "4-5/29/text#68", "4-5/31/text#0", "4-5/15/text#12"], ["4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22", "4- "4-5/14/text#15"], ["4-5/7/text#41", "4-5/29/text#57", "4-5/29/text#68", "4-5/31/text#0", "4-5/15/text#12", "4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15"], ["4-5/29/text#57", "4-5/29/text#68", "4-5/31/text#0", "4-5/15/text#12", "4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17"], ["4-5/29/text#68", "4-5/31/text#0", "4-5/15/text#12", "4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22"], ["4-5/31/text#0", "4-5/15/text#12", "4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22", "4-5/29/text#57"], ["4-5/15/text#12", "4-5/8/text#0", "4-5/7/text#0", "4-5/28/rows:0:0#0", "4-5/11/text#0", "4-5/14/text#15", "4-5/8/text#17", "4-5/7/text#22", "4-5/29/text#57", "4-5/29/text#68"]], "num": [[]]}}, {"id": "4-6", "title": "つり角度と張力・モード係数", "blocks": [{"type": "p", "text": "荷を静止させて左右対称につる場合を考えます。ロープの開きと**張力**の関係から、必要なロープの強さを求めます。", "style": "lead", "id": "4-6-4596f70ceeef"}, {"type": "sub", "text": "1．荷を支える力を、上向きと横向きに分ける", "id": "4-6-736e75654309"}, {"type": "p", "text": "ロープが荷を引く力を **張力** といいます。斜めの張力を上向きと横向きの力で表すのが **力の分解**、それぞれが **分力**（鉛直成分・水平成分）です。10kNの荷を左右対称に支えるなら、上向きの分力は左右5kNずつ必要です。", "id": "4-6-c120d4e0573e", "quizTerms": ["分力"]}, {"type": "img", "asset": "4-6_sling_support_easy", "caption": "同じ重量の荷を、異なる開きでつった比較", "labels": [], "legend": [], "id": "4-6-07b9772a277e", "style": "figure", "_previewFile": "4-6_sling_support_easy.png", "_width": 1536, "_height": 1024}, {"type": "p", "text": "開きが大きいほど、張力のうち横向きに働く割合が大きくなります。同じ上向き5kNを保つには、斜めの張力を大きくする必要があります。増えるのは **各ロープの張力** で、左右2本の張力を合わせた合力は、横がつり合って上向き10kNのままです。", "id": "4-6-33122205cc7c", "quizTerms": ["合力"]}, {"type": "sub", "text": "2．張力係数は「上向きの分力を1とした、張力の倍率」", "id": "4-6-97f37b8cd3f7"}, {"type": "p", "text": "縦と横の**分力**を合わせた力が、斜めの張力です。矢印で長方形を作ると、その対角線に当たります。分解と合成は逆の操作です。", "id": "4-6-68b45d27f53c"}, {"type": "img", "asset": "4-6_tension_coefficient_ratio", "caption": "同じ縮尺で比較。縦5kNに対して斜め6.25kNなら1.25倍、斜め10kNなら2倍", "labels": [], "legend": [], "id": "4-6-3863feb77086", "style": "figure", "_previewFile": "4-6_tension_coefficient_ratio.png", "_width": 1700, "_height": 960}, {"type": "p", "text": "**張力係数は、上向きの分力を1としたときの張力の倍率** です。図の右では、上向き5kNに対して張力10kNなので2倍。係数に単位はありません。", "id": "4-6-b5247bcd0bcc", "quizTerms": ["張力係数"]}, {"type": "sub", "text": "3．つり角度を読み、表の係数で張力を求める", "id": "4-6-61243ee14f65"}, {"type": "p", "text": "表は、**2本のロープの間の角度** で読みます。3本・4本つりでは、問題の図がどの角度を示しているか確認します。", "id": "4-6-82825af67c66"}, {"type": "table", "headers": ["つり角度 α", "張力係数"], "rows": [["0°", "1.00"], ["30°", "1.04"], ["60°", "1.16"], ["90°", "1.41"], ["120°", "2.00"]], "id": "4-6-aabca1e52703", "quizTerms": ["1.16", "1.41", "2.00"]}, {"type": "p", "text": "代表値を覚え、問題に係数の指定があればその値を使います。120°は原理の比較用です。実作業のつり角度はガイドラインで原則90°以内とされています。", "id": "4-6-3b433aa3d07d"}, {"type": "p", "text": "**1本の張力＝荷の重量÷本数×張力係数**", "emphasis": true, "id": "4-6-e538d0040b3f"}, {"type": "p", "text": "各ロープの傾きが等しく、均等に分担する場合に使います。**質量**kgに9.8を掛けると重量N、質量tに掛けると重量kNになります。", "id": "4-6-d4ba3f2a4d69"}, {"type": "ul", "items": ["**例題1（張力係数で計算）**：直径1m・高さ4m、密度2.3t/m³のコンクリート円柱を、左右対称の2本のロープでつり角度60°でつります。π＝3.14、張力係数は表の1.16を使うと、1本の張力は？"], "id": "4-6-aead93d7dfdc"}, {"type": "svg", "file": "4-6_supplement_f56_20261023.svg", "caption": "例題1。密度2.3 t/m³の円柱を、左右対称・均等分担でつる。直径を半分にして半径から体積を求める。", "id": "4-6-2883cf0725ff", "style": "figure", "_previewFile": "4-6_supplement_f56_20261023.svg"}, {"type": "p", "text": "→ 半径0.5mなので、体積＝0.5²×3.14×4＝3.14m³。**質量**＝3.14×2.3＝7.222t。", "id": "4-6-93629bfc9a99"}, {"type": "p", "text": "→ 荷の重量＝7.222×9.8＝70.7756kN。まず2本で分けて70.7756÷2＝35.3878kN。次に角度の分を増やし、35.3878×1.16＝41.049848kN≒**41.0kN**。途中では丸めず、最後に小数第1位まで丸めます。", "id": "4-6-fc5d65a7e622"}, {"type": "sub", "text": "4．安全係数は「使う力に対して、切断荷重が何倍あるか」", "id": "4-6-ad07a5137e9d"}, {"type": "p", "text": "**安全係数**は、使用時の最大の力に対して切断荷重が何倍あるかを表します。玉掛け用ワイヤロープには6以上が必要です。", "id": "4-6-96272ddac25e", "quizTerms": ["安全係数", "切断荷重"]}, {"type": "p", "text": "**最大10kNで使う → 切断荷重60kN以上のロープを選ぶ**", "emphasis": true, "id": "4-6-a0a669fe2909"}, {"type": "p", "text": "この例では60÷10＝6が**安全係数**です。切断荷重は、引張試験でロープが切れるときの荷重の値です。", "id": "4-6-0e635f5efbc6"}, {"type": "table", "headers": ["つり具", "安全係数"], "rows": [["玉掛け用ワイヤロープ", "6以上"], ["玉掛け用フック・シャックル", "5以上"], ["玉掛け用つりチェーン（要件を満たすもの）", "4以上"], ["玉掛け用つりチェーン（要件を満たさないもの）", "5以上"]], "id": "4-6-a4a337086c3a", "quizTerms": ["6以上"]}, {"type": "p", "text": "**必要な切断荷重＝1本の張力×安全係数**", "emphasis": true, "id": "4-6-c282f09bd0a5"}, {"type": "ul", "items": ["**例題2（必要な切断荷重を求める）**：質量36tの荷を4本のロープでつる。各ロープに均等に荷重がかかり、各ロープと鉛直線の角は45°（対称な対向ロープのなす角90°）とする。張力係数は表の1.41、安全係数は6を使用する。"], "id": "4-6-daaba0f9b8c7"}, {"type": "svg", "file": "4-6_supplement_f57_20261023.svg", "caption": "例題2。図は向かい合う2本を含む断面。奥にも2本あり、合計4本で均等分担する条件。", "id": "4-6-f1b897e61f33", "style": "figure", "_previewFile": "4-6_supplement_f57_20261023.svg"}, {"type": "p", "text": "→ 1本の**張力**＝（36÷4）×9.8×1.41＝124.362kN。", "id": "4-6-c36f9054b614"}, {"type": "p", "text": "**② 必要な切断荷重：** 124.362×6＝**746.172kN**。下の表から、この値以上の切断荷重をもつ最小の直径を選びます。", "id": "4-6-5a5c33c840d6"}, {"id": "4-6-rev26-rope-options", "type": "table", "headers": ["問題で与えられた直径", "切断荷重"], "rows": [["32mm", "544kN"], ["36mm", "688kN"], ["**40mm**", "**850kN**"], ["44mm", "1,030kN"], ["48mm", "1,220kN"]]}, {"id": "4-6-rev26-rope-answer", "type": "p", "text": "**③ 答え：40mm。** 36mmの688kNでは不足。次の40mmは850kNで、必要な746.172kN以上です。"}, {"type": "sub", "text": "基本安全荷重：1本を鉛直に使うとき、何tまで使えるか", "id": "4-6-7c14c0b2e1ff"}, {"type": "p", "text": "ロープ1本を鉛直にまっすぐ使う場合の使用限度を、質量で表したものが **基本安全荷重** です。切断荷重58.8kN、安全係数6なら、使用する力の上限は58.8÷6＝9.8kN。地球上で質量1tに対応するので、基本安全荷重は1tです。", "id": "4-6-73460e227c52", "quizTerms": ["基本安全荷重"]}, {"type": "p", "text": "切断荷重がkNで与えられた場合は、「切断荷重÷安全係数÷9.8」で**基本安全荷重**〔t〕に換算します。", "id": "4-6-c70319191bc7"}, {"type": "sub", "text": "5．モード係数で、そのつり方でつれる質量を求める", "id": "4-6-04a28acb3df3"}, {"type": "p", "text": "**モード係数は、ロープ1本でつれる質量を基準にした、そのつり方でつれる質量の倍率** です。図では、基本安全荷重1tの同じロープを使って比べます。", "id": "4-6-0e52c513ca98", "quizTerms": ["モード係数"]}, {"type": "img", "asset": "4-6_mode_factor_easy", "caption": "1本つり・2本の鉛直つり・つり角度90°の2本つりの比較（荷重を均等に負担する場合。係数は下表による）", "id": "4-6-5cdab154d1c4", "style": "figure", "_previewFile": "4-6_mode_factor_easy.png", "_width": 1800, "_height": 1080}, {"type": "table", "headers": ["つり角度", "2本", "3本", "4本"], "rows": [["0°（鉛直）", "2.0", "3.0", "4.0"], ["0°超〜\n30°以下", "1.9", "2.8", "3.8"], ["30°超〜\n60°以下", "1.7", "2.5", "3.4"], ["60°超〜\n90°以下", "1.4", "2.1", "2.8"], ["90°超〜\n120°以下", "1.0", "1.5", "2.0"]], "id": "4-6-c370458a07a8", "style": "matrix"}, {"type": "p", "text": "2本・45°なら係数**1.7**。30°ちょうどは「0°超〜30°以下」、60°ちょうどは「30°超〜60°以下」の**行**を使います。", "id": "4-6-ea90261bb7fd"}, {"type": "p", "text": "**つれる質量＝ロープ1本の基本安全荷重×モード係数**", "emphasis": true, "id": "4-6-201659a4f385"}, {"type": "p", "text": "逆に必要なロープ1本の**基本安全荷重**は、「つり荷の質量÷モード係数」で求めます。", "id": "4-6-0adeb060e190"}, {"id": "4-6-42dfd1e85e44", "type": "p", "text": "**4本掛けでも、原則は3本掛けのモード係数を使います。** ロープの長さなどが少し違うだけで、均等に荷重がかかりにくいためです。4本に均等に荷重がかかる場合は、4本掛けの係数を使えます。例題2は均等分担が指定されています。", "style": "caution"}, {"type": "sub", "text": "補足：張力係数とcosのつながり", "id": "4-6-b8f95a59de8c"}, {"type": "p", "text": "書籍には**cosを使う計算例**もあります。cos（コサイン）は辺の比。鉛直線からの角βでは、**cosβ＝上向きの分力÷張力**です。例えばcos35°＝0.82なら、斜めの力の82％が上向きに働きます。", "id": "4-6-0c597c1d08a8"}, {"type": "p", "text": "**張力係数＝1÷cosβ**", "emphasis": true, "id": "4-6-6407b7675d84"}, {"type": "p", "text": "**必要な上向きの力÷cosβ＝張力。** 張力係数は、この割り算を掛け算にするための値です。cosβ＝0.5なら張力係数は2、cosβ＝0.82なら約1.22になります。", "id": "4-6-9e21170da6d0"}, {"id": "4-6-rev26-cos35", "type": "svg", "file": "4-6_cos35_20261106.svg", "caption": "左右対称な2本でつる場合。ロープ間70°なら、片側のロープと鉛直線の間は35°。", "style": "figure", "_previewFile": "4-6_cos35_20261106.svg"}, {"id": "4-6-rev26-book-cos-example", "type": "p", "text": "**書籍の例題：** 例題1と同じコンクリート円柱を、つり角度**70°**でつります。cos35°＝0.82として、1本の張力を求めましょう。"}, {"id": "4-6-rev26-cos-steps", "type": "table", "headers": ["手順", "途中では丸めず、最後に小数第1位まで"], "rows": [["① 荷の重量", "7.222t×9.8＝**70.7756kN**"], ["② 1本の上向き分力", "70.7756÷2＝**35.3878kN**"], ["③ 1本の張力", "35.3878÷0.82≒**43.2kN**"]]}, {"id": "4-6-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-6-rev26-tension-q", "type": "p", "text": "**確認：** 重量10kNの荷を左右対称の2本で静止させます。張力係数1.41なら、1本の張力と2本を合わせた上向きの合力は？", "style": "question"}, {"id": "4-6-rev26-tension-a", "type": "p", "text": "**1本の張力7.05kN、上向きの合力10kN。** 10÷2×1.41＝7.05。横の分力は互いに打ち消し、上向きは5kNずつです。", "style": "answer"}, {"id": "4-6-rev26-mode-q", "type": "p", "text": "**確認：** 基本安全荷重1tのロープで、均等分担の2本つり・つり角度60°。モード係数表では何tまで？", "style": "question"}, {"id": "4-6-rev26-mode-a", "type": "p", "text": "**1.7t。** 60°は「30°超〜60°以下」の行。1t×1.7＝1.7tです。", "style": "answer"}, {"id": "4-6-rev26-factor-q", "type": "p", "text": "**確認：** 使用時の最大張力20kN、安全係数6。必要な切断荷重は？", "style": "question"}, {"id": "4-6-rev26-factor-a", "type": "p", "text": "**120kN以上。** 使用する力20kNに6を掛けます。張力係数・モード係数・安全係数は、何を比べる数字かで使い分けます。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-6/2/text", "raw": "ロープが荷を引く力を **張力** といいます。斜めの張力を上向きと横向きの力で表すのが **力の分解**、それぞれが **分力**（鉛直成分・水平成分）です。10kNの荷を左右対称に支えるなら、上向きの分力は左右5kNずつ必要です。", "text": "ロープが荷を引く力を 張力 といいます。斜めの張力を上向きと横向きの力で表すのが 力の分解、それぞれが 分力（鉛直成分・水平成分）です。10kNの荷を左右対称に支えるなら、上向きの分力は左右5kNずつ必要です。", "terms": ["分力"], "block": "4-6-c120d4e0573e"}, {"id": "4-6/4/text", "raw": "開きが大きいほど、張力のうち横向きに働く割合が大きくなります。同じ上向き5kNを保つには、斜めの張力を大きくする必要があります。増えるのは **各ロープの張力** で、左右2本の張力を合わせた合力は、横がつり合って上向き10kNのままです。", "text": "開きが大きいほど、張力のうち横向きに働く割合が大きくなります。同じ上向き5kNを保つには、斜めの張力を大きくする必要があります。増えるのは 各ロープの張力 で、左右2本の張力を合わせた合力は、横がつり合って上向き10kNのままです。", "terms": ["合力"], "block": "4-6-33122205cc7c"}, {"id": "4-6/6/text", "raw": "縦と横の**分力**を合わせた力が、斜めの張力です。矢印で長方形を作ると、その対角線に当たります。分解と合成は逆の操作です。", "text": "縦と横の分力を合わせた力が、斜めの張力です。矢印で長方形を作ると、その対角線に当たります。分解と合成は逆の操作です。", "terms": [], "block": "4-6-68b45d27f53c"}, {"id": "4-6/8/text", "raw": "**張力係数は、上向きの分力を1としたときの張力の倍率** です。図の右では、上向き5kNに対して張力10kNなので2倍。係数に単位はありません。", "text": "張力係数は、上向きの分力を1としたときの張力の倍率 です。図の右では、上向き5kNに対して張力10kNなので2倍。係数に単位はありません。", "terms": ["張力係数"], "block": "4-6-b5247bcd0bcc"}, {"id": "4-6/10/text", "raw": "表は、**2本のロープの間の角度** で読みます。3本・4本つりでは、問題の図がどの角度を示しているか確認します。", "text": "表は、2本のロープの間の角度 で読みます。3本・4本つりでは、問題の図がどの角度を示しているか確認します。", "terms": [], "block": "4-6-82825af67c66"}, {"id": "4-6/11/rows:0:0", "raw": "0°", "text": "0°", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:0:1", "raw": "1.00", "text": "1.00", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:1:0", "raw": "30°", "text": "30°", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:1:1", "raw": "1.04", "text": "1.04", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:2:0", "raw": "60°", "text": "60°", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:2:1", "raw": "1.16", "text": "1.16", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:3:0", "raw": "90°", "text": "90°", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:3:1", "raw": "1.41", "text": "1.41", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:4:0", "raw": "120°", "text": "120°", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/11/rows:4:1", "raw": "2.00", "text": "2.00", "terms": ["1.16", "1.41", "2.00"], "block": "4-6-aabca1e52703"}, {"id": "4-6/12/text", "raw": "代表値を覚え、問題に係数の指定があればその値を使います。120°は原理の比較用です。実作業のつり角度はガイドラインで原則90°以内とされています。", "text": "代表値を覚え、問題に係数の指定があればその値を使います。120°は原理の比較用です。実作業のつり角度はガイドラインで原則90°以内とされています。", "terms": [], "block": "4-6-3b433aa3d07d"}, {"id": "4-6/13/text", "raw": "**1本の張力＝荷の重量÷本数×張力係数**", "text": "1本の張力＝荷の重量÷本数×張力係数", "terms": [], "block": "4-6-e538d0040b3f"}, {"id": "4-6/14/text", "raw": "各ロープの傾きが等しく、均等に分担する場合に使います。**質量**kgに9.8を掛けると重量N、質量tに掛けると重量kNになります。", "text": "各ロープの傾きが等しく、均等に分担する場合に使います。質量kgに9.8を掛けると重量N、質量tに掛けると重量kNになります。", "terms": [], "block": "4-6-d4ba3f2a4d69"}, {"id": "4-6/15/items:0", "raw": "**例題1（張力係数で計算）**：直径1m・高さ4m、密度2.3t/m³のコンクリート円柱を、左右対称の2本のロープでつり角度60°でつります。π＝3.14、張力係数は表の1.16を使うと、1本の張力は？", "text": "例題1（張力係数で計算）：直径1m・高さ4m、密度2.3t/m³のコンクリート円柱を、左右対称の2本のロープでつり角度60°でつります。π＝3.14、張力係数は表の1.16を使うと、1本の張力は？", "terms": [], "block": "4-6-aead93d7dfdc"}, {"id": "4-6/17/text", "raw": "→ 半径0.5mなので、体積＝0.5²×3.14×4＝3.14m³。**質量**＝3.14×2.3＝7.222t。", "text": "→ 半径0.5mなので、体積＝0.5²×3.14×4＝3.14m³。質量＝3.14×2.3＝7.222t。", "terms": [], "block": "4-6-93629bfc9a99"}, {"id": "4-6/18/text", "raw": "→ 荷の重量＝7.222×9.8＝70.7756kN。まず2本で分けて70.7756÷2＝35.3878kN。次に角度の分を増やし、35.3878×1.16＝41.049848kN≒**41.0kN**。途中では丸めず、最後に小数第1位まで丸めます。", "text": "→ 荷の重量＝7.222×9.8＝70.7756kN。まず2本で分けて70.7756÷2＝35.3878kN。次に角度の分を増やし、35.3878×1.16＝41.049848kN≒41.0kN。途中では丸めず、最後に小数第1位まで丸めます。", "terms": [], "block": "4-6-fc5d65a7e622"}, {"id": "4-6/20/text", "raw": "**安全係数**は、使用時の最大の力に対して切断荷重が何倍あるかを表します。玉掛け用ワイヤロープには6以上が必要です。", "text": "安全係数は、使用時の最大の力に対して切断荷重が何倍あるかを表します。玉掛け用ワイヤロープには6以上が必要です。", "terms": ["安全係数", "切断荷重"], "block": "4-6-96272ddac25e"}, {"id": "4-6/21/text", "raw": "**最大10kNで使う → 切断荷重60kN以上のロープを選ぶ**", "text": "最大10kNで使う → 切断荷重60kN以上のロープを選ぶ", "terms": [], "block": "4-6-a0a669fe2909"}, {"id": "4-6/22/text", "raw": "この例では60÷10＝6が**安全係数**です。切断荷重は、引張試験でロープが切れるときの荷重の値です。", "text": "この例では60÷10＝6が安全係数です。切断荷重は、引張試験でロープが切れるときの荷重の値です。", "terms": [], "block": "4-6-0e635f5efbc6"}, {"id": "4-6/23/rows:0:0", "raw": "玉掛け用ワイヤロープ", "text": "玉掛け用ワイヤロープ", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:0:1", "raw": "6以上", "text": "6以上", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:1:0", "raw": "玉掛け用フック・シャックル", "text": "玉掛け用フック・シャックル", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:1:1", "raw": "5以上", "text": "5以上", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:2:0", "raw": "玉掛け用つりチェーン（要件を満たすもの）", "text": "玉掛け用つりチェーン（要件を満たすもの）", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:2:1", "raw": "4以上", "text": "4以上", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:3:0", "raw": "玉掛け用つりチェーン（要件を満たさないもの）", "text": "玉掛け用つりチェーン（要件を満たさないもの）", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/23/rows:3:1", "raw": "5以上", "text": "5以上", "terms": ["6以上"], "block": "4-6-a4a337086c3a"}, {"id": "4-6/24/text", "raw": "**必要な切断荷重＝1本の張力×安全係数**", "text": "必要な切断荷重＝1本の張力×安全係数", "terms": [], "block": "4-6-c282f09bd0a5"}, {"id": "4-6/25/items:0", "raw": "**例題2（必要な切断荷重を求める）**：質量36tの荷を4本のロープでつる。各ロープに均等に荷重がかかり、各ロープと鉛直線の角は45°（対称な対向ロープのなす角90°）とする。張力係数は表の1.41、安全係数は6を使用する。", "text": "例題2（必要な切断荷重を求める）：質量36tの荷を4本のロープでつる。各ロープに均等に荷重がかかり、各ロープと鉛直線の角は45°（対称な対向ロープのなす角90°）とする。張力係数は表の1.41、安全係数は6を使用する。", "terms": [], "block": "4-6-daaba0f9b8c7"}, {"id": "4-6/27/text", "raw": "→ 1本の**張力**＝（36÷4）×9.8×1.41＝124.362kN。", "text": "→ 1本の張力＝（36÷4）×9.8×1.41＝124.362kN。", "terms": [], "block": "4-6-c36f9054b614"}, {"id": "4-6/28/text", "raw": "**② 必要な切断荷重：** 124.362×6＝**746.172kN**。下の表から、この値以上の切断荷重をもつ最小の直径を選びます。", "text": "② 必要な切断荷重： 124.362×6＝746.172kN。下の表から、この値以上の切断荷重をもつ最小の直径を選びます。", "terms": [], "block": "4-6-5a5c33c840d6"}, {"id": "4-6/29/rows:0:0", "raw": "32mm", "text": "32mm", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:0:1", "raw": "544kN", "text": "544kN", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:1:0", "raw": "36mm", "text": "36mm", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:1:1", "raw": "688kN", "text": "688kN", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:2:0", "raw": "**40mm**", "text": "40mm", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:2:1", "raw": "**850kN**", "text": "850kN", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:3:0", "raw": "44mm", "text": "44mm", "terms": [], "block": "4-6-rev26-rope-options"}, {"id": "4-6/29/rows:3:1",
