/rows:0:0#0", "1-9/63/text#35", "1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84"], ["1-9/27/text#12", "1-9/21/rows:3:0#0", "1-9/21/rows:0:0#0", "1-9/63/text#35", "1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84", "1-9/2/text#39"], ["1-9/21/rows:3:0#0", "1-9/21/rows:0:0#0", "1-9/63/text#35", "1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84", "1-9/2/text#39", "1-9/2/text#56"], ["1-9/21/rows:0:0#0", "1-9/63/text#35", "1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84", "1-9/2/text#39", "1-9/2/text#56", "1-9/21/rows:2:0#0"], ["1-9/63/text#35", "1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84", "1-9/2/text#39", "1-9/2/text#56", "1-9/21/rows:2:0#0", "1-9/47/text#39"], ["1-9/63/text#11", "1-9/21/rows:1:1#16", "1-9/36/text#8", "1-9/36/text#0", "1-9/52/text#84", "1-9/2/text#39", "1-9/2/text#56", "1-9/21/rows:2:0#0", "1-9/47/text#39", "1-9/37/text#0"]], "num": [[]]}}, {"title": "ドラムとシーブ――巻き取る円筒と、案内する滑車", "blocks": [{"type": "p", "style": "lead", "text": "**ドラムはロープを巻き取る。シーブはロープを案内する。** 似た丸い部品でも仕事が違います。", "id": "1-13-2c3c91afc64a"}, {"type": "sub", "text": "ドラムとシーブの違い", "id": "1-13-85611a1f04e7"}, {"type": "p", "text": "**ドラム**は、ワイヤロープを巻き取る円筒です。電動機から減速機を介して回転し、ロープを巻き取ったり払い出したりします。シーブは、外周に溝のある滑車です。ロープを溝に沿わせ、ロープの向きを変えたり、複数本のロープで荷を支える配置を作ったりします。", "id": "1-13-0bf552d6dfa9", "quizTerms": ["ドラム", "シーブ"]}, {"type": "p", "text": "どちらも丸い部品ですが、**ドラム**はロープを蓄えるように巻き取り、シーブは通るロープを案内します。シーブをすべて「ロープを巻き取る部品」と考えないようにしてください。", "id": "1-13-345e2ed62f40"}, {"type": "sub", "id": "lesson-drum-speed", "text": "ドラムの回転を、ロープの速さに直す"}, {"type": "p", "text": "ドラムが1回転すると、ロープは円周分だけ巻き取られます。ロープの中心位置で測る有効径をD〔m〕、1分間の回転数をnとすると、**巻取り速度〔m/min〕＝π×D×n**。", "id": "1-13-fdcebfe7bb80"}, {"type": "p", "text": "毎分1200回転のモーターを減速比40でつなぐと、ドラムは1200÷40＝**毎分30回転**。D＝0.4mなら、3.14×0.4×30＝**37.68m/min** です。", "id": "1-13-8343ac8b5114"}, {"type": "p", "text": "理想的な連続ロープで荷を支える部分が4本なら、荷の上昇速度は37.68÷4＝**9.42m/min**。回転数→円周→支持本数の順で計算します。回転数が同じなら、有効径が1.2倍になると巻取り速度も1.2倍です。", "id": "1-13-e23ab0934c27"}, {"type": "svg", "file": "1-6_drum_equalizer.svg", "caption": "左：ドラムに残す捨巻き／中央：エコライザシーブ／右：Dとdの測り方。", "id": "1-13-b8a5976e6f0c", "style": "figure", "_previewFile": "1-6_drum_equalizer.svg"}, {"type": "sub", "text": "D／d――大きい円に巻くほど曲げが緩やかになる", "id": "1-13-1c4c85ab80b1"}, {"type": "p", "text": "針金を小さい鉛筆に巻く場合と、大きい缶に巻く場合を比べると、小さい鉛筆の方がきつく曲がります。ワイヤロープも、小さい径の**ドラム**やシーブを通るほど、強く曲げられます。繰り返し曲げると、素線の疲労や損傷に関係します。", "id": "1-13-dea8bf911a98"}, {"type": "p", "text": "ドラムやシーブの**ピッチ円直径**をD、ロープ径をdとし、D÷dの比でその関係を表します。ピッチ円は、ロープの中心が通る円です。ドラムなら最初の巻層にあるロープの中心から、反対側のロープの中心までを測った直径です。ドラム本体の外径とは違います。", "id": "1-13-8967aad28458", "quizTerms": ["ピッチ円直径"]}, {"type": "p", "text": "同じ太さのロープでも、小さい**ドラム**ではロープがきつく曲がり、大きいドラムでは緩やかに曲がります。同じロープ径dなら、ドラムのピッチ径Dが大きくなるほどD／dも大きくなり、曲げによる負担は小さくなる方向です。", "id": "1-13-cacc71eea4a2"}, {"type": "svg", "file": "1-13_supplement_f22_20261023.svg", "caption": "Dはロープの中心が通るピッチ円の直径、dはロープ径。同じdなら、Dが大きいほど曲がりが緩やか。", "id": "1-13-27db75f80b9b", "style": "figure", "_previewFile": "1-13_supplement_f22_20261023.svg"}, {"type": "p", "text": "必要な最小のD／dは、装置の等級やロープの区分などで変わります。**ドラム**14～56、シーブ16～63という教材上の範囲は、一つの機械に自由に選んでよい値ではありません。理解の中心は「Dの測定位置」と「D／dが大きいほど、同じ条件で曲げが緩やかになる関係」です。", "id": "1-13-1d979a4faf7a"}, {"type": "sub", "text": "捨巻き――最後の取付部だけに荷を受けさせない", "id": "1-13-0d17883358e9"}, {"type": "p", "text": "ロープの端は**ドラム**に固定されています。しかし、荷をつったままロープを全部払い出すと、端の固定部分に大きな張力が直接掛かってしまいます。", "id": "1-13-a82e018fa589"}, {"type": "p", "text": "そこで、フックを最も下まで下げ、ロープを最大に払い出したときでも、ドラムに**2巻以上**のロープを残します。この残りの巻きを「捨巻き」といいます。「捨てるロープ」ではなく、最後まで残しておく巻きです。", "id": "1-13-ccb9b53285fd", "quizTerms": ["2巻以上", "捨巻き"]}, {"type": "p", "text": "上の図の左側が捨巻きです。**ドラムに残った巻きの摩擦**が張力を受け持ち、ロープ取付部だけに力が集中するのを軽減します。", "id": "1-13-ee9111be3e1e"}, {"type": "p", "text": "覚える数字は「**2巻以上**」、確認する状態は「最大払い出し時」です。普段の位置で2巻見えていても、最下限まで下げたときに残らなければ、条件を満たしていることにはなりません。", "id": "1-13-5de15238d615"}, {"type": "sub", "text": "エコライザシーブ――左右の張力をつり合わせる", "id": "1-13-437b3a015f0f"}, {"type": "p", "text": "複数のロープ部分で**フックブロック**を支える配置では、左右で受け持つ張力が偏らないようにする必要があります。「張力」は、ロープが引っ張られているときに、そのロープに作用する力です。", "id": "1-13-8180b86656e4", "quizTerms": ["フックブロック"]}, {"type": "p", "text": "**エコライザシーブ**は、左右のロープの張力をつり合わせる役割を持つシーブです。", "id": "1-13-dde581eb0f90", "quizTerms": ["エコライザシーブ"]}, {"type": "p", "text": "上の図の中央上部が**エコライザシーブ**です。下側のシーブとフックは荷と一緒に動きますが、エコライザシーブは左右の張力をつり合わせ、通常の巻上げではほとんど回転しません。", "id": "1-13-233a2530bd7c"}, {"type": "p", "text": "「滑車は全部、荷を上げるたびに大きく回転する」と考えると間違えます。ドラムは巻取り、一般のシーブは案内、**エコライザシーブ**は張力のつり合い、と役割を分けましょう。ほとんど回転しないから点検不要、という意味でもありません。", "id": "1-13-903708c97f6d"}, {"type": "sub", "text": "車輪――回す車輪と、付いてくる車輪", "id": "1-13-e589630eccaa"}, {"type": "p", "text": "走行や横行には、レール上を転がる車輪を使います。電動機などから動力を受けて回る車輪を「**駆動輪**」または「動輪」、直接は駆動されず、機体の移動に伴って転がる車輪を「遊動輪」または「従輪」と呼びます。", "id": "1-13-20faeb5b6434", "quizTerms": ["駆動輪", "遊動輪"]}, {"type": "p", "text": "どちらも荷重を支えて転がりますが、機体を動かす回転を与えられるかが違います。「従輪は動かない車輪」という意味ではありません。回転する動きと、**動力**を受けて駆動されることを分けて考えましょう。", "id": "1-13-37531af64ecc"}, {"type": "sub", "id": "lesson-wheel-flange", "text": "車輪のフランジと、ガーダのキャンバ"}, {"type": "p", "text": "**車輪のフランジは、外周にあるつば状の縁。** 車輪がレールから外れるのを防ぐための部分です。", "id": "1-13-37f1cacf711f", "quizTerms": ["フランジ"]}, {"type": "p", "text": "**キャンバは、ガーダにあらかじめ付ける上向きのそり。** 「車輪の縁」と「桁の反り」で、場所も働きも違います。", "id": "1-13-0caf08f158d4"}], "id": "1-13", "chapter": 1, "fields": [{"id": "1-13/2/text", "raw": "**ドラム**は、ワイヤロープを巻き取る円筒です。電動機から減速機を介して回転し、ロープを巻き取ったり払い出したりします。シーブは、外周に溝のある滑車です。ロープを溝に沿わせ、ロープの向きを変えたり、複数本のロープで荷を支える配置を作ったりします。", "text": "ドラムは、ワイヤロープを巻き取る円筒です。電動機から減速機を介して回転し、ロープを巻き取ったり払い出したりします。シーブは、外周に溝のある滑車です。ロープを溝に沿わせ、ロープの向きを変えたり、複数本のロープで荷を支える配置を作ったりします。", "terms": ["ドラム", "シーブ"], "block": "1-13-0bf552d6dfa9"}, {"id": "1-13/3/text", "raw": "どちらも丸い部品ですが、**ドラム**はロープを蓄えるように巻き取り、シーブは通るロープを案内します。シーブをすべて「ロープを巻き取る部品」と考えないようにしてください。", "text": "どちらも丸い部品ですが、ドラムはロープを蓄えるように巻き取り、シーブは通るロープを案内します。シーブをすべて「ロープを巻き取る部品」と考えないようにしてください。", "terms": [], "block": "1-13-345e2ed62f40"}, {"id": "1-13/5/text", "raw": "ドラムが1回転すると、ロープは円周分だけ巻き取られます。ロープの中心位置で測る有効径をD〔m〕、1分間の回転数をnとすると、**巻取り速度〔m/min〕＝π×D×n**。", "text": "ドラムが1回転すると、ロープは円周分だけ巻き取られます。ロープの中心位置で測る有効径をD〔m〕、1分間の回転数をnとすると、巻取り速度〔m/min〕＝π×D×n。", "terms": [], "block": "1-13-fdcebfe7bb80"}, {"id": "1-13/6/text", "raw": "毎分1200回転のモーターを減速比40でつなぐと、ドラムは1200÷40＝**毎分30回転**。D＝0.4mなら、3.14×0.4×30＝**37.68m/min** です。", "text": "毎分1200回転のモーターを減速比40でつなぐと、ドラムは1200÷40＝毎分30回転。D＝0.4mなら、3.14×0.4×30＝37.68m/min です。", "terms": [], "block": "1-13-8343ac8b5114"}, {"id": "1-13/7/text", "raw": "理想的な連続ロープで荷を支える部分が4本なら、荷の上昇速度は37.68÷4＝**9.42m/min**。回転数→円周→支持本数の順で計算します。回転数が同じなら、有効径が1.2倍になると巻取り速度も1.2倍です。", "text": "理想的な連続ロープで荷を支える部分が4本なら、荷の上昇速度は37.68÷4＝9.42m/min。回転数→円周→支持本数の順で計算します。回転数が同じなら、有効径が1.2倍になると巻取り速度も1.2倍です。", "terms": [], "block": "1-13-e23ab0934c27"}, {"id": "1-13/10/text", "raw": "針金を小さい鉛筆に巻く場合と、大きい缶に巻く場合を比べると、小さい鉛筆の方がきつく曲がります。ワイヤロープも、小さい径の**ドラム**やシーブを通るほど、強く曲げられます。繰り返し曲げると、素線の疲労や損傷に関係します。", "text": "針金を小さい鉛筆に巻く場合と、大きい缶に巻く場合を比べると、小さい鉛筆の方がきつく曲がります。ワイヤロープも、小さい径のドラムやシーブを通るほど、強く曲げられます。繰り返し曲げると、素線の疲労や損傷に関係します。", "terms": [], "block": "1-13-dea8bf911a98"}, {"id": "1-13/11/text", "raw": "ドラムやシーブの**ピッチ円直径**をD、ロープ径をdとし、D÷dの比でその関係を表します。ピッチ円は、ロープの中心が通る円です。ドラムなら最初の巻層にあるロープの中心から、反対側のロープの中心までを測った直径です。ドラム本体の外径とは違います。", "text": "ドラムやシーブのピッチ円直径をD、ロープ径をdとし、D÷dの比でその関係を表します。ピッチ円は、ロープの中心が通る円です。ドラムなら最初の巻層にあるロープの中心から、反対側のロープの中心までを測った直径です。ドラム本体の外径とは違います。", "terms": ["ピッチ円直径"], "block": "1-13-8967aad28458"}, {"id": "1-13/12/text", "raw": "同じ太さのロープでも、小さい**ドラム**ではロープがきつく曲がり、大きいドラムでは緩やかに曲がります。同じロープ径dなら、ドラムのピッチ径Dが大きくなるほどD／dも大きくなり、曲げによる負担は小さくなる方向です。", "text": "同じ太さのロープでも、小さいドラムではロープがきつく曲がり、大きいドラムでは緩やかに曲がります。同じロープ径dなら、ドラムのピッチ径Dが大きくなるほどD／dも大きくなり、曲げによる負担は小さくなる方向です。", "terms": [], "block": "1-13-cacc71eea4a2"}, {"id": "1-13/14/text", "raw": "必要な最小のD／dは、装置の等級やロープの区分などで変わります。**ドラム**14～56、シーブ16～63という教材上の範囲は、一つの機械に自由に選んでよい値ではありません。理解の中心は「Dの測定位置」と「D／dが大きいほど、同じ条件で曲げが緩やかになる関係」です。", "text": "必要な最小のD／dは、装置の等級やロープの区分などで変わります。ドラム14～56、シーブ16～63という教材上の範囲は、一つの機械に自由に選んでよい値ではありません。理解の中心は「Dの測定位置」と「D／dが大きいほど、同じ条件で曲げが緩やかになる関係」です。", "terms": [], "block": "1-13-1d979a4faf7a"}, {"id": "1-13/16/text", "raw": "ロープの端は**ドラム**に固定されています。しかし、荷をつったままロープを全部払い出すと、端の固定部分に大きな張力が直接掛かってしまいます。", "text": "ロープの端はドラムに固定されています。しかし、荷をつったままロープを全部払い出すと、端の固定部分に大きな張力が直接掛かってしまいます。", "terms": [], "block": "1-13-a82e018fa589"}, {"id": "1-13/17/text", "raw": "そこで、フックを最も下まで下げ、ロープを最大に払い出したときでも、ドラムに**2巻以上**のロープを残します。この残りの巻きを「捨巻き」といいます。「捨てるロープ」ではなく、最後まで残しておく巻きです。", "text": "そこで、フックを最も下まで下げ、ロープを最大に払い出したときでも、ドラムに2巻以上のロープを残します。この残りの巻きを「捨巻き」といいます。「捨てるロープ」ではなく、最後まで残しておく巻きです。", "terms": ["2巻以上", "捨巻き"], "block": "1-13-ccb9b53285fd"}, {"id": "1-13/18/text", "raw": "上の図の左側が捨巻きです。**ドラムに残った巻きの摩擦**が張力を受け持ち、ロープ取付部だけに力が集中するのを軽減します。", "text": "上の図の左側が捨巻きです。ドラムに残った巻きの摩擦が張力を受け持ち、ロープ取付部だけに力が集中するのを軽減します。", "terms": [], "block": "1-13-ee9111be3e1e"}, {"id": "1-13/19/text", "raw": "覚える数字は「**2巻以上**」、確認する状態は「最大払い出し時」です。普段の位置で2巻見えていても、最下限まで下げたときに残らなければ、条件を満たしていることにはなりません。", "text": "覚える数字は「2巻以上」、確認する状態は「最大払い出し時」です。普段の位置で2巻見えていても、最下限まで下げたときに残らなければ、条件を満たしていることにはなりません。", "terms": [], "block": "1-13-5de15238d615"}, {"id": "1-13/21/text", "raw": "複数のロープ部分で**フックブロック**を支える配置では、左右で受け持つ張力が偏らないようにする必要があります。「張力」は、ロープが引っ張られているときに、そのロープに作用する力です。", "text": "複数のロープ部分でフックブロックを支える配置では、左右で受け持つ張力が偏らないようにする必要があります。「張力」は、ロープが引っ張られているときに、そのロープに作用する力です。", "terms": ["フックブロック"], "block": "1-13-8180b86656e4"}, {"id": "1-13/22/text", "raw": "**エコライザシーブ**は、左右のロープの張力をつり合わせる役割を持つシーブです。", "text": "エコライザシーブは、左右のロープの張力をつり合わせる役割を持つシーブです。", "terms": ["エコライザシーブ"], "block": "1-13-dde581eb0f90"}, {"id": "1-13/23/text", "raw": "上の図の中央上部が**エコライザシーブ**です。下側のシーブとフックは荷と一緒に動きますが、エコライザシーブは左右の張力をつり合わせ、通常の巻上げではほとんど回転しません。", "text": "上の図の中央上部がエコライザシーブです。下側のシーブとフックは荷と一緒に動きますが、エコライザシーブは左右の張力をつり合わせ、通常の巻上げではほとんど回転しません。", "terms": [], "block": "1-13-233a2530bd7c"}, {"id": "1-13/24/text", "raw": "「滑車は全部、荷を上げるたびに大きく回転する」と考えると間違えます。ドラムは巻取り、一般のシーブは案内、**エコライザシーブ**は張力のつり合い、と役割を分けましょう。ほとんど回転しないから点検不要、という意味でもありません。", "text": "「滑車は全部、荷を上げるたびに大きく回転する」と考えると間違えます。ドラムは巻取り、一般のシーブは案内、エコライザシーブは張力のつり合い、と役割を分けましょう。ほとんど回転しないから点検不要、という意味でもありません。", "terms": [], "block": "1-13-903708c97f6d"}, {"id": "1-13/26/text", "raw": "走行や横行には、レール上を転がる車輪を使います。電動機などから動力を受けて回る車輪を「**駆動輪**」または「動輪」、直接は駆動されず、機体の移動に伴って転がる車輪を「遊動輪」または「従輪」と呼びます。", "text": "走行や横行には、レール上を転がる車輪を使います。電動機などから動力を受けて回る車輪を「駆動輪」または「動輪」、直接は駆動されず、機体の移動に伴って転がる車輪を「遊動輪」または「従輪」と呼びます。", "terms": ["駆動輪", "遊動輪"], "block": "1-13-20faeb5b6434"}, {"id": "1-13/27/text", "raw": "どちらも荷重を支えて転がりますが、機体を動かす回転を与えられるかが違います。「従輪は動かない車輪」という意味ではありません。回転する動きと、**動力**を受けて駆動されることを分けて考えましょう。", "text": "どちらも荷重を支えて転がりますが、機体を動かす回転を与えられるかが違います。「従輪は動かない車輪」という意味ではありません。回転する動きと、動力を受けて駆動されることを分けて考えましょう。", "terms": [], "block": "1-13-37531af64ecc"}, {"id": "1-13/29/text", "raw": "**車輪のフランジは、外周にあるつば状の縁。** 車輪がレールから外れるのを防ぐための部分です。", "text": "車輪のフランジは、外周にあるつば状の縁。 車輪がレールから外れるのを防ぐための部分です。", "terms": ["フランジ"], "block": "1-13-37f1cacf711f"}, {"id": "1-13/30/text", "raw": "**キャンバは、ガーダにあらかじめ付ける上向きのそり。** 「車輪の縁」と「桁の反り」で、場所も働きも違います。", "text": "キャンバは、ガーダにあらかじめ付ける上向きのそり。 「車輪の縁」と「桁の反り」で、場所も働きも違います。", "terms": [], "block": "1-13-0caf08f158d4"}], "candidates": [{"id": "1-13/2/text#0", "fieldID": "1-13/2/text", "block": "1-13-0bf552d6dfa9", "answer": "ドラム", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "ドラムは、ワイヤロープを巻き取る円筒です。電動機から減速機を介して回転し、ロープを巻き取ったり払い出したりします。シーブは、外周に溝のある滑車です。ロープを溝に沿わせ、ロープの向きを変えたり、複数本のロープで荷を支える配置を作ったりします。", "start16": 0, "end16": 3}, {"id": "1-13/2/text#57", "fieldID": "1-13/2/text", "block": "1-13-0bf552d6dfa9", "answer": "シーブ", "category": "key", "prompt": "［用語？］", "start": 57, "end": 60, "context": "ドラムは、ワイヤロープを巻き取る円筒です。電動機から減速機を介して回転し、ロープを巻き取ったり払い出したりします。シーブは、外周に溝のある滑車です。ロープを溝に沿わせ、ロープの向きを変えたり、複数本のロープで荷を支える配置を作ったりします。", "start16": 57, "end16": 60}, {"id": "1-13/11/text#8", "fieldID": "1-13/11/text", "block": "1-13-8967aad28458", "answer": "ピッチ円直径", "category": "key", "prompt": "［用語？］", "start": 8, "end": 14, "context": "ドラムやシーブのピッチ円直径をD、ロープ径をdとし、D÷dの比でその関係を表します。ピッチ円は、ロープの中心が通る円です。ドラムなら最初の巻層にあるロープの中心から、反対側のロープの中心までを測った直径です。ドラム本体の外径とは違います。", "start16": 8, "end16": 14}, {"id": "1-13/17/text#37", "fieldID": "1-13/17/text", "block": "1-13-ccb9b53285fd", "answer": "2巻以上", "category": "num", "prompt": "［数値？］", "start": 37, "end": 41, "context": "そこで、フックを最も下まで下げ、ロープを最大に払い出したときでも、ドラムに2巻以上のロープを残します。この残りの巻きを「捨巻き」といいます。「捨てるロープ」ではなく、最後まで残しておく巻きです。", "start16": 37, "end16": 41}, {"id": "1-13/17/text#60", "fieldID": "1-13/17/text", "block": "1-13-ccb9b53285fd", "answer": "捨巻き", "category": "key", "prompt": "［用語？］", "start": 60, "end": 63, "context": "そこで、フックを最も下まで下げ、ロープを最大に払い出したときでも、ドラムに2巻以上のロープを残します。この残りの巻きを「捨巻き」といいます。「捨てるロープ」ではなく、最後まで残しておく巻きです。", "start16": 60, "end16": 63}, {"id": "1-13/21/text#9", "fieldID": "1-13/21/text", "block": "1-13-8180b86656e4", "answer": "フックブロック", "category": "key", "prompt": "［用語？］", "start": 9, "end": 16, "context": "複数のロープ部分でフックブロックを支える配置では、左右で受け持つ張力が偏らないようにする必要があります。「張力」は、ロープが引っ張られているときに、そのロープに作用する力です。", "start16": 9, "end16": 16}, {"id": "1-13/22/text#0", "fieldID": "1-13/22/text", "block": "1-13-dde581eb0f90", "answer": "エコライザシーブ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 8, "context": "エコライザシーブは、左右のロープの張力をつり合わせる役割を持つシーブです。", "start16": 0, "end16": 8}, {"id": "1-13/26/text#43", "fieldID": "1-13/26/text", "block": "1-13-20faeb5b6434", "answer": "駆動輪", "category": "key", "prompt": "［用語？］", "start": 43, "end": 46, "context": "走行や横行には、レール上を転がる車輪を使います。電動機などから動力を受けて回る車輪を「駆動輪」または「動輪」、直接は駆動されず、機体の移動に伴って転がる車輪を「遊動輪」または「従輪」と呼びます。", "start16": 43, "end16": 46}, {"id": "1-13/26/text#80", "fieldID": "1-13/26/text", "block": "1-13-20faeb5b6434", "answer": "遊動輪", "category": "key", "prompt": "［用語？］", "start": 80, "end": 83, "context": "走行や横行には、レール上を転がる車輪を使います。電動機などから動力を受けて回る車輪を「駆動輪」または「動輪」、直接は駆動されず、機体の移動に伴って転がる車輪を「遊動輪」または「従輪」と呼びます。", "start16": 80, "end16": 83}, {"id": "1-13/29/text#3", "fieldID": "1-13/29/text", "block": "1-13-37f1cacf711f", "answer": "フランジ", "category": "key", "prompt": "［用語？］", "start": 3, "end": 7, "context": "車輪のフランジは、外周にあるつば状の縁。 車輪がレールから外れるのを防ぐための部分です。", "start16": 3, "end16": 7}], "rounds": {"all": [["1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43"], ["1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37"], ["1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60"], ["1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57"], ["1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0"], ["1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3"], ["1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0"], ["1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8"], ["1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9"], ["1-13/26/text#43", "1-13/17/text#37", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80"]], "key": [["1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43"], ["1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60"], ["1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57"], ["1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0"], ["1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3"], ["1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0"], ["1-13/21/text#9", "1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8"], ["1-13/26/text#80", "1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9"], ["1-13/26/text#43", "1-13/17/text#60", "1-13/2/text#57", "1-13/22/text#0", "1-13/29/text#3", "1-13/2/text#0", "1-13/11/text#8", "1-13/21/text#9", "1-13/26/text#80"]], "num": [["1-13/17/text#37"]]}}, {"title": "ワイヤロープ――細い鋼線を二段階でより合わせる", "blocks": [{"type": "p", "style": "lead", "text": "**細い素線 → 束にしたストランド → ワイヤロープ。** 二段階でより合わせた構造です。", "id": "1-7-987bf7bcf7ff"}, {"type": "sub", "text": "素線・ストランド・心綱", "id": "1-7-63df20dced35"}, {"type": "p", "text": "ワイヤロープは、一本の太い鋼の棒ではありません。細い鋼線を数多く組み合わせることで、強さと曲がりやすさを持たせています。", "id": "1-7-5e166e244670"}, {"type": "p", "text": "まず、細い鋼線一本を「素線」といいます。複数の素線をより合わせて作る束が「**ストランド**」、または「子なわ」です。さらに複数のストランドを、中心の「心綱」のまわりにより合わせて、一本のワイヤロープを作ります。", "id": "1-7-2b16cdc7e587", "quizTerms": ["心綱"]}, {"type": "p", "text": "糸を集めて束を作り、その束をさらに集めて太いひもを作る、という二段階の構造です。素線、**ストランド**、ロープを同じものとして読まないようにしましょう。", "id": "1-7-9d4b94df4520"}, {"type": "img", "asset": "1-7_wire_structure_readable21", "caption": "ワイヤ構造。心綱はストランドを支え、柔軟性や潤滑に関わる。構成・心綱の材質は製品で異なる", "legend": [], "labels": [], "id": "1-7-24f3fd555f0a", "style": "figure", "_previewFile": "1-7_wire_structure_readable21.png", "_width": 2000, "_height": 1450}, {"type": "p", "text": "「6×37」は、37本の素線で構成した**ストランド**が6本ある構成を表します。構成記号の最初の数字と、後ろの数字は数えている対象が違います。", "id": "1-7-5e957a7d280b"}, {"type": "p", "text": "ストランドの素線の組み方には種類があります。**フィラー形**は、内層と外層の素線の間にできるすき間へ、細い**フィラー線**を詰めて充填率を高めた構造です(6×Fi(29)などと表します)。フィラー線は細くてロープの強度を受け持たないため、強度計算や素線切断の数え方には含めません。", "id": "1-7-a1f1104c18f8", "quizTerms": ["フィラー線"]}, {"type": "p", "text": "クレーンのワイヤロープにはこの**フィラー形**が多く使われます。", "id": "1-7-bd222d54eaef"}, {"type": "img", "asset": "1-7_supplement_f14_20261023", "labels": [], "legend": [], "caption": "赤い細線がフィラ線。右の赤いストランドが1回転して、同じ側に戻るまでの長さが「1より」。断線率ではフィラ線を除く。", "id": "1-7-04b937d68d00", "style": "figure", "_previewFile": "1-7_supplement_f14_20261023.png", "_width": 1470, "_height": 1070}, {"type": "p", "text": "心綱には、繊維心やロープ心などがあります。中心で**ストランド**を支え、形を保つ役割があります。繊維心は潤滑油を保持する働きも持ちます。心の材質によって性質は違うため、すべての心綱が同じ量の油を蓄えると考える必要はありません。", "id": "1-7-c1dfc4ee6f53", "quizTerms": ["繊維心"]}, {"type": "p", "text": "同じ程度の大きさのロープを比べる場合、細い**素線**を多く使う構成は、一般に柔軟性を得やすくなります。ただし、太さ、構成、心綱などでも性能は変わります。「本数が多ければ、どんな性能もよくなる」という意味ではありません。", "id": "1-7-12940d18b47d"}, {"type": "sub", "text": "普通よりとラングより", "id": "1-7-31dc4e90db34"}, {"type": "p", "text": "ロープを作る際には、素線をよって**ストランド**を作る段階と、ストランドをよってロープを作る段階があります。この二段階で、より方向が反対か同じかによって名称が変わります。", "id": "1-7-be41fe5ae856"}, {"type": "img", "asset": "1-7_supplement_f13_20261023", "labels": [], "legend": [], "caption": "Zより・Sよりはロープのより方向。普通より・ラングよりは、素線とストランドのより方向の組合せで区別する。", "id": "1-7-896c2a7b7543", "style": "figure", "_previewFile": "1-7_supplement_f13_20261023.png", "_width": 1472, "_height": 1069}, {"type": "p", "text": "図の大きなまとまりがストランド、その中の細い線が素線です。普通よりでは、ストランドを作る素線のより方向と、ロープを作るストランドのより方向が反対です。**ラングより**では、二つの方向が同じです。", "id": "1-7-c7c4ad7d1bc5"}, {"type": "p", "text": "「普通よりだから右、**ラングより**だから左」ではありません。普通・ラングは二段階の方向関係を表す分類です。一方、Zより・Sよりは、よりの方向自体を区別する分類です。分類の目的が違うため、普通Z、普通S、ラングZ、ラングSという組合せがあります。", "id": "1-7-b1964986ab9d"}, {"type": "p", "text": "クレーンでは一般に普通Zよりが使われます。ただし、個々の機械に使うロープは、その機械に指定された構成・より方を確認します。", "id": "1-7-143ac604f1ff"}, {"type": "p", "text": "より方の性質も押さえます。普通よりはよりが締まり、形くずれやキンクを生じにくく扱いやすい方です。**ラングより**は表面に現れる素線が長く、一般に摩耗や繰返し曲げに強い一方、自転性が大きくキンクに注意します。構成・材質・使用条件で性能は変わるため、指定されたロープを使用します。", "id": "1-7-b118ca465cdd"}, {"id": "1-7-rev26-lay", "type": "table", "headers": ["より方", "2段階のより方向"], "rows": [["**普通より**", "素線とストランドが反対方向"], ["**ラングより**", "素線とストランドが同方向"]], "quizTerms": ["ストランド", "素線", "ラングより", "普通より"]}, {"type": "sub", "text": "ロープ径の測り方", "id": "1-7-660871b40295"}, {"type": "p", "text": "ロープの断面には、**ストランド**の山と谷があります。谷を挟んで測ると、外側の大きさより小さい値になってしまいます。直径は、断面の外側の山を包む円の直径として考えます。", "id": "1-7-0209b73850dd"}, {"type": "svg", "file": "1-7_rope_diameter.svg", "caption": "ロープ径の測定", "id": "1-7-6b8854da4b88", "style": "figure", "_previewFile": "1-7_rope_diameter.svg"}, {"type": "p", "text": "左の図では、測定器の面を外側の山に当てています。右の図では、谷側に当てたため小さく読んでしまいます。まず正しい接触位置を確認し、それから数値を読みます。", "id": "1-7-045a20383aa7"}, {"type": "p", "text": "教材では、同じ断面を3方向から測って平均する方法を扱います。例えば、①12.1 mm、②12.2 mm、③12.0 mmなら、**実測直径**は（12.1＋12.2＋12.0）÷3＝12.1 mmです。", "id": "1-7-c517338e61f0", "quizTerms": ["実測直径"]}, {"type": "p", "text": "製品の呼び寸法としての「**公称直径**」と、実際に測った「実測直径」は区別します。問題文がどちらを尋ねているかに注意してください。", "id": "1-7-d19bc3a9c251", "quizTerms": ["公称直径"]}, {"type": "sub", "text": "端を加工すると、使える強さが変わる", "id": "1-7-48c33e31c196"}, {"type": "p", "text": "ロープは、そのままではフックや**ドラム**に確実につなげられません。端に輪を作ったり、金具へ固定したりする「末端処理」を行います。ただし、加工部分には力が集中するなどの理由で、元のロープの強さを全部生かせない場合があります。", "id": "1-7-2347b70f63a4"}, {"type": "p", "text": "その目安が「**末端加工効率**」です。元のロープの切断荷重を100％として、加工した部分を含む強さを比較します。切断荷重100 kN、効率80％なら、加工後の強さの目安は80 kNです。これは、80 kNまで安全に作業できるという意味ではありません。", "id": "1-7-234f08e2fe20", "quizTerms": ["末端加工効率"]}, {"type": "p", "text": "安全に使える荷重を判断するには、さらに**安全係数**などを考慮します。", "id": "1-7-813abafcd86b"}, {"type": "p", "text": "ソケット止めは、ソケットという金具の中へロープの端を固定する方法です。圧縮止めは、金属の筒などを圧縮して固定します。**アイスプライス**は、ストランドを編み込んで輪を作る方法です。クリップ止めは、折り返したロープをクリップで締め付けます。", "id": "1-7-5871ff8477bc"}, {"type": "p", "text": "**くさび止め**は、ソケットとくさびの間にロープを挟んで固定します。", "id": "1-7-cc6cfb14ef2f"}, {"type": "svg", "file": "1-7_end_fittings.svg", "caption": "末端処理5方式。金属の筒、編込み、クリップ、くさびの形を見分ける。", "id": "1-7-3301873fe87c", "style": "figure", "_previewFile": "1-7_end_fittings.svg"}, {"id": "1-7-6a78a6453c9d", "type": "table", "headers": ["末端処理", "見分ける形・効率の代表値"], "rows": [["**ソケット止め**", "開いた素線を筒の中で合金などにより固定：**100％**"], ["**圧縮止め**", "折り返した部分を金属のスリーブで圧着：**95％**"], ["**アイスプライス**", "端のストランドを本体へ編み込む：**70～95％**"], ["**クリップ止め**", "折り返したロープをクリップで固定：**80～85％**"], ["**くさび止め**", "ソケット内でロープをくさびに巻いて固定：**65～70％**"]], "quizTerms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"]}, {"id": "1-7-rev26-efficiency", "type": "p", "text": "効率は、加工前のロープの強さをどれだけ生かせるかの目安です。表は試験で扱う代表値として、形と結び付けて覚えます。"}, {"type": "sub", "id": "lesson-socket-thimble", "text": "ソケット止めと、アイを守るシンブル"}, {"type": "p", "text": "**合金詰めソケット止め** は、端の素線を開いてソケット内へ配置し、合金で固定する方法です。折り返したロープを外から締めるクリップ止めとは、形も固定方法も違います。", "id": "1-7-68ff7fee7bff"}, {"type": "p", "text": "**シンブルは、アイ（輪）の内側に沿わせる溝付きの金具。** ロープが金具に当たってつぶれたり、摩耗したりするのを抑えます。輪の形を守る役であり、シンブルだけでロープ端を固定するものではありません。", "id": "1-7-5e182aa5cd23", "quizTerms": ["シンブル"]}, {"type": "sub", "text": "ワイヤクリップの向き", "id": "1-7-7249850200a8"}, {"type": "p", "text": "ロープを折り返して輪を作ると、荷重を受ける長い側と、折り返した端の短い側が並びます。長い側が本体側、短い側が端末側です。", "id": "1-7-1c6a9823637c"}, {"type": "p", "text": "クリップには、U字形のボルトと、ロープを受ける台があります。受け台は「**サドル**」と呼びます。クレーンの骨組みのサドルと同じ名称ですが、ここではクリップの部品です。", "id": "1-7-14991b942380", "quizTerms": ["サドル"]}, {"type": "p", "text": "**受け台（サドル）は本体側、Uボルトは端末側**にそろえます。本体側は荷を支える長い側、端末側は折り返した短い側です。複数のクリップを交互に裏返しません。", "id": "1-7-53c70b423e67", "style": "tip"}, {"type": "p", "text": "荷重を受ける本体側を受け台で支え、Uボルトを当てる側を端末側にする、と役割で覚えてください。個数、間隔、締付け**トルク**は指定に従い、均等に十分締め付けます。一度荷重が掛かると、ロープがなじんで締付け状態が変わるため、指定に従って増締めします。", "id": "1-7-29c290e49ce0"}, {"type": "sub", "text": "玉掛け用ワイヤロープの安全係数", "id": "1-7-ceb45bbc0cbe"}, {"type": "p", "text": "「**安全係数**」は、切断荷重を、そのロープに掛かる最大荷重で割った値です。切れる強さに対して、実際の負担をどれだけ小さくして使うかを表します。玉掛け用ワイヤロープでは6以上が必要です。", "id": "1-7-bfc71dc10961"}, {"type": "p", "text": "切断荷重60 kNのロープに最大10 kNが掛かる例なら、**安全係数**は60÷10＝6です。荷を2本でつる場合でも、角度によって一本あたりの張力が変わるため、荷の重さを単純に2で割るだけでは判断できないことがあります。詳しい張力計算は力学の章で学びます。", "id": "1-7-3300b70d3a6c"}, {"type": "p", "text": "ここでの6以上は玉掛け用のワイヤロープの基準です。クレーンの**巻上げ**用など、別の用途のすべてのロープへ同じ基準を当てはめないでください。", "id": "1-7-114f200b9863"}], "id": "1-7", "chapter": 1, "fields": [{"id": "1-7/2/text", "raw": "ワイヤロープは、一本の太い鋼の棒ではありません。細い鋼線を数多く組み合わせることで、強さと曲がりやすさを持たせています。", "text": "ワイヤロープは、一本の太い鋼の棒ではありません。細い鋼線を数多く組み合わせることで、強さと曲がりやすさを持たせています。", "terms": [], "block": "1-7-5e166e244670"}, {"id": "1-7/3/text", "raw": "まず、細い鋼線一本を「素線」といいます。複数の素線をより合わせて作る束が「**ストランド**」、または「子なわ」です。さらに複数のストランドを、中心の「心綱」のまわりにより合わせて、一本のワイヤロープを作ります。", "text": "まず、細い鋼線一本を「素線」といいます。複数の素線をより合わせて作る束が「ストランド」、または「子なわ」です。さらに複数のストランドを、中心の「心綱」のまわりにより合わせて、一本のワイヤロープを作ります。", "terms": ["心綱"], "block": "1-7-2b16cdc7e587"}, {"id": "1-7/4/text", "raw": "糸を集めて束を作り、その束をさらに集めて太いひもを作る、という二段階の構造です。素線、**ストランド**、ロープを同じものとして読まないようにしましょう。", "text": "糸を集めて束を作り、その束をさらに集めて太いひもを作る、という二段階の構造です。素線、ストランド、ロープを同じものとして読まないようにしましょう。", "terms": [], "block": "1-7-9d4b94df4520"}, {"id": "1-7/6/text", "raw": "「6×37」は、37本の素線で構成した**ストランド**が6本ある構成を表します。構成記号の最初の数字と、後ろの数字は数えている対象が違います。", "text": "「6×37」は、37本の素線で構成したストランドが6本ある構成を表します。構成記号の最初の数字と、後ろの数字は数えている対象が違います。", "terms": [], "block": "1-7-5e957a7d280b"}, {"id": "1-7/7/text", "raw": "ストランドの素線の組み方には種類があります。**フィラー形**は、内層と外層の素線の間にできるすき間へ、細い**フィラー線**を詰めて充填率を高めた構造です(6×Fi(29)などと表します)。フィラー線は細くてロープの強度を受け持たないため、強度計算や素線切断の数え方には含めません。", "text": "ストランドの素線の組み方には種類があります。フィラー形は、内層と外層の素線の間にできるすき間へ、細いフィラー線を詰めて充填率を高めた構造です(6×Fi(29)などと表します)。フィラー線は細くてロープの強度を受け持たないため、強度計算や素線切断の数え方には含めません。", "terms": ["フィラー線"], "block": "1-7-a1f1104c18f8"}, {"id": "1-7/8/text", "raw": "クレーンのワイヤロープにはこの**フィラー形**が多く使われます。", "text": "クレーンのワイヤロープにはこのフィラー形が多く使われます。", "terms": [], "block": "1-7-bd222d54eaef"}, {"id": "1-7/10/text", "raw": "心綱には、繊維心やロープ心などがあります。中心で**ストランド**を支え、形を保つ役割があります。繊維心は潤滑油を保持する働きも持ちます。心の材質によって性質は違うため、すべての心綱が同じ量の油を蓄えると考える必要はありません。", "text": "心綱には、繊維心やロープ心などがあります。中心でストランドを支え、形を保つ役割があります。繊維心は潤滑油を保持する働きも持ちます。心の材質によって性質は違うため、すべての心綱が同じ量の油を蓄えると考える必要はありません。", "terms": ["繊維心"], "block": "1-7-c1dfc4ee6f53"}, {"id": "1-7/11/text", "raw": "同じ程度の大きさのロープを比べる場合、細い**素線**を多く使う構成は、一般に柔軟性を得やすくなります。ただし、太さ、構成、心綱などでも性能は変わります。「本数が多ければ、どんな性能もよくなる」という意味ではありません。", "text": "同じ程度の大きさのロープを比べる場合、細い素線を多く使う構成は、一般に柔軟性を得やすくなります。ただし、太さ、構成、心綱などでも性能は変わります。「本数が多ければ、どんな性能もよくなる」という意味ではありません。", "terms": [], "block": "1-7-12940d18b47d"}, {"id": "1-7/13/text", "raw": "ロープを作る際には、素線をよって**ストランド**を作る段階と、ストランドをよってロープを作る段階があります。この二段階で、より方向が反対か同じかによって名称が変わります。", "text": "ロープを作る際には、素線をよってストランドを作る段階と、ストランドをよってロープを作る段階があります。この二段階で、より方向が反対か同じかによって名称が変わります。", "terms": [], "block": "1-7-be41fe5ae856"}, {"id": "1-7/15/text", "raw": "図の大きなまとまりがストランド、その中の細い線が素線です。普通よりでは、ストランドを作る素線のより方向と、ロープを作るストランドのより方向が反対です。**ラングより**では、二つの方向が同じです。", "text": "図の大きなまとまりがストランド、その中の細い線が素線です。普通よりでは、ストランドを作る素線のより方向と、ロープを作るストランドのより方向が反対です。ラングよりでは、二つの方向が同じです。", "terms": [], "block": "1-7-c7c4ad7d1bc5"}, {"id": "1-7/16/text", "raw": "「普通よりだから右、**ラングより**だから左」ではありません。普通・ラングは二段階の方向関係を表す分類です。一方、Zより・Sよりは、よりの方向自体を区別する分類です。分類の目的が違うため、普通Z、普通S、ラングZ、ラングSという組合せがあります。", "text": "「普通よりだから右、ラングよりだから左」ではありません。普通・ラングは二段階の方向関係を表す分類です。一方、Zより・Sよりは、よりの方向自体を区別する分類です。分類の目的が違うため、普通Z、普通S、ラングZ、ラングSという組合せがあります。", "terms": [], "block": "1-7-b1964986ab9d"}, {"id": "1-7/17/text", "raw": "クレーンでは一般に普通Zよりが使われます。ただし、個々の機械に使うロープは、その機械に指定された構成・より方を確認します。", "text": "クレーンでは一般に普通Zよりが使われます。ただし、個々の機械に使うロープは、その機械に指定された構成・より方を確認します。", "terms": [], "block": "1-7-143ac604f1ff"}, {"id": "1-7/18/text", "raw": "より方の性質も押さえます。普通よりはよりが締まり、形くずれやキンクを生じにくく扱いやすい方です。**ラングより**は表面に現れる素線が長く、一般に摩耗や繰返し曲げに強い一方、自転性が大きくキンクに注意します。構成・材質・使用条件で性能は変わるため、指定されたロープを使用します。", "text": "より方の性質も押さえます。普通よりはよりが締まり、形くずれやキンクを生じにくく扱いやすい方です。ラングよりは表面に現れる素線が長く、一般に摩耗や繰返し曲げに強い一方、自転性が大きくキンクに注意します。構成・材質・使用条件で性能は変わるため、指定されたロープを使用します。", "terms": [], "block": "1-7-b118ca465cdd"}, {"id": "1-7/19/rows:0:0", "raw": "**普通より**", "text": "普通より", "terms": ["ストランド", "素線", "ラングより", "普通より"], "block": "1-7-rev26-lay"}, {"id": "1-7/19/rows:0:1", "raw": "素線とストランドが反対方向", "text": "素線とストランドが反対方向", "terms": ["ストランド", "素線", "ラングより", "普通より"], "block": "1-7-rev26-lay"}, {"id": "1-7/19/rows:1:0", "raw": "**ラングより**", "text": "ラングより", "terms": ["ストランド", "素線", "ラングより", "普通より"], "block": "1-7-rev26-lay"}, {"id": "1-7/19/rows:1:1", "raw": "素線とストランドが同方向", "text": "素線とストランドが同方向", "terms": ["ストランド", "素線", "ラングより", "普通より"], "block": "1-7-rev26-lay"}, {"id": "1-7/21/text", "raw": "ロープの断面には、**ストランド**の山と谷があります。谷を挟んで測ると、外側の大きさより小さい値になってしまいます。直径は、断面の外側の山を包む円の直径として考えます。", "text": "ロープの断面には、ストランドの山と谷があります。谷を挟んで測ると、外側の大きさより小さい値になってしまいます。直径は、断面の外側の山を包む円の直径として考えます。", "terms": [], "block": "1-7-0209b73850dd"}, {"id": "1-7/23/text", "raw": "左の図では、測定器の面を外側の山に当てています。右の図では、谷側に当てたため小さく読んでしまいます。まず正しい接触位置を確認し、それから数値を読みます。", "text": "左の図では、測定器の面を外側の山に当てています。右の図では、谷側に当てたため小さく読んでしまいます。まず正しい接触位置を確認し、それから数値を読みます。", "terms": [], "block": "1-7-045a20383aa7"}, {"id": "1-7/24/text", "raw": "教材では、同じ断面を3方向から測って平均する方法を扱います。例えば、①12.1 mm、②12.2 mm、③12.0 mmなら、**実測直径**は（12.1＋12.2＋12.0）÷3＝12.1 mmです。", "text": "教材では、同じ断面を3方向から測って平均する方法を扱います。例えば、①12.1 mm、②12.2 mm、③12.0 mmなら、実測直径は（12.1＋12.2＋12.0）÷3＝12.1 mmです。", "terms": ["実測直径"], "block": "1-7-c517338e61f0"}, {"id": "1-7/25/text", "raw": "製品の呼び寸法としての「**公称直径**」と、実際に測った「実測直径」は区別します。問題文がどちらを尋ねているかに注意してください。", "text": "製品の呼び寸法としての「公称直径」と、実際に測った「実測直径」は区別します。問題文がどちらを尋ねているかに注意してください。", "terms": ["公称直径"], "block": "1-7-d19bc3a9c251"}, {"id": "1-7/27/text", "raw": "ロープは、そのままではフックや**ドラム**に確実につなげられません。端に輪を作ったり、金具へ固定したりする「末端処理」を行います。ただし、加工部分には力が集中するなどの理由で、元のロープの強さを全部生かせない場合があります。", "text": "ロープは、そのままではフックやドラムに確実につなげられません。端に輪を作ったり、金具へ固定したりする「末端処理」を行います。ただし、加工部分には力が集中するなどの理由で、元のロープの強さを全部生かせない場合があります。", "terms": [], "block": "1-7-2347b70f63a4"}, {"id": "1-7/28/text", "raw": "その目安が「**末端加工効率**」です。元のロープの切断荷重を100％として、加工した部分を含む強さを比較します。切断荷重100 kN、効率80％なら、加工後の強さの目安は80 kNです。これは、80 kNまで安全に作業できるという意味ではありません。", "text": "その目安が「末端加工効率」です。元のロープの切断荷重を100％として、加工した部分を含む強さを比較します。切断荷重100 kN、効率80％なら、加工後の強さの目安は80 kNです。これは、80 kNまで安全に作業できるという意味ではありません。", "terms": ["末端加工効率"], "block": "1-7-234f08e2fe20"}, {"id": "1-7/29/text", "raw": "安全に使える荷重を判断するには、さらに**安全係数**などを考慮します。", "text": "安全に使える荷重を判断するには、さらに安全係数などを考慮します。", "terms": [], "block": "1-7-813abafcd86b"}, {"id": "1-7/30/text", "raw": "ソケット止めは、ソケットという金具の中へロープの端を固定する方法です。圧縮止めは、金属の筒などを圧縮して固定します。**アイスプライス**は、ストランドを編み込んで輪を作る方法です。クリップ止めは、折り返したロープをクリップで締め付けます。", "text": "ソケット止めは、ソケットという金具の中へロープの端を固定する方法です。圧縮止めは、金属の筒などを圧縮して固定します。アイスプライスは、ストランドを編み込んで輪を作る方法です。クリップ止めは、折り返したロープをクリップで締め付けます。", "terms": [], "block": "1-7-5871ff8477bc"}, {"id": "1-7/31/text", "raw": "**くさび止め**は、ソケットとくさびの間にロープを挟んで固定します。", "text": "くさび止めは、ソケットとくさびの間にロープを挟んで固定します。", "terms": [], "block": "1-7-cc6cfb14ef2f"}, {"id": "1-7/33/rows:0:0", "raw": "**ソケット止め**", "text": "ソケット止め", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:0:1", "raw": "開いた素線を筒の中で合金などにより固定：**100％**", "text": "開いた素線を筒の中で合金などにより固定：100％", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:1:0", "raw": "**圧縮止め**", "text": "圧縮止め", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:1:1", "raw": "折り返した部分を金属のスリーブで圧着：**95％**", "text": "折り返した部分を金属のスリーブで圧着：95％", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:2:0", "raw": "**アイスプライス**", "text": "アイスプライス", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:2:1", "raw": "端のストランドを本体へ編み込む：**70～95％**", "text": "端のストランドを本体へ編み込む：70～95％", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:3:0", "raw": "**クリップ止め**", "text": "クリップ止め", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:3:1", "raw": "折り返したロープをクリップで固定：**80～85％**", "text": "折り返したロープをクリップで固定：80～85％", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:4:0", "raw": "**くさび止め**", "text": "くさび止め", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/33/rows:4:1", "raw": "ソケット内でロープをくさびに巻いて固定：**65～70％**", "text": "ソケット内でロープをくさびに巻いて固定：65～70％", "terms": ["アイスプライス", "ソケット止め", "クリップ止め", "くさび止め"], "block": "1-7-6a78a6453c9d"}, {"id": "1-7/34/text", "raw": "効率は、加工前のロープの強さをどれだけ生かせるかの目安です。表は試験で扱う代表値として、形と結び付けて覚えます。", "text": "効率は、加工前のロープの強さをどれだけ生かせるかの目安です。表は試験で扱う代表値として、形と結び付けて覚えます。", "terms": [], "block": "1-7-rev26-efficiency"}, {"id": "1-7/36/text", "raw": "**合金詰めソケット止め** は、端の素線を開いてソケット内へ配置し、合金で固定する方法です。折り返したロープを外から締めるクリップ止めとは、形も固定方法も違います。", "text": "合金詰めソケット止め は、端の素線を開いてソケット内へ配置し、合金で固定する方法です。折り返したロープを外から締めるクリップ止めとは、形も固定方法も違います。", "terms": [], "block": "1-7-68ff7fee7bff"}, {"id": "1-7/37/text", "raw": "**シンブルは、アイ（輪）の内側に沿わせる溝付きの金具。** ロープが金具に当たってつぶれたり、摩耗したりするのを抑えます。輪の形を守る役であり、シンブルだけでロープ端を固定するものではありません。", "text": "シンブルは、アイ（輪）の内側に沿わせる溝付きの金具。 ロープが金具に当たってつぶれたり、摩耗したりするのを抑えます。輪の形を守る役であり、シンブルだけでロープ端を固定するものではありません。", "terms": ["シンブル"], "block": "1-7-5e182aa5cd23"}, {"id": "1-7/39/text", "raw": "ロープを折り返して輪を作ると、荷重を受ける長い側と、折り返した端の短い側が並びます。長い側が本体側、短い側が端末側です。", "text": "ロープを折り返して輪を作ると、荷重を受ける長い側と、折り返した端の短い側が並びます。長い側が本体側、短い側が端末側です。", "terms": [], "block": "1-7-1c6a9823637c"}, {"id": "1-7/40/text", "raw": "クリップには、U字形のボルトと、ロープを受ける台があります。受け台は「**サドル**」と呼びます。クレーンの骨組みのサドルと同じ名称ですが、ここではクリップの部品です。", "text": "クリップには、U字形のボルトと、ロープを受ける台があります。受け台は「サドル」と呼びます。クレーンの骨組みのサドルと同じ名称ですが、ここではクリップの部品です。", "terms": ["サドル"], "block": "1-7-14991b942380"}, {"id": "1-7/41/text", "raw": "**受け台（サドル）は本体側、Uボルトは端末側**にそろえます。本体側は荷を支える長い側、端末側は折り返した短い側です。複数のクリップを交互に裏返しません。", "text": "受け台（サドル）は本体側、Uボルトは端末側にそろえます。本体側は荷を支える長い側、端末側は折り返した短い側です。複数のクリップを交互に裏返しません。", "terms": [], "block": "1-7-53c70b423e67"}, {"id": "1-7/42/text", "raw": "荷重を受ける本体側を受け台で支え、Uボルトを当てる側を端末側にする、と役割で覚えてください。個数、間隔、締付け**トルク**は指定に従い、均等に十分締め付けます。一度荷重が掛かると、ロープがなじんで締付け状態が変わるため、指定に従って増締めします。", "text": "荷重を受ける本体側を受け台で支え、Uボルトを当てる側を端末側にする、と役割で覚えてください。個数、間隔、締付けトルクは指定に従い、均等に十分締め付けます。一度荷重が掛かると、ロープがなじんで締付け状態が変わるため、指定に従って増締めします。", "terms": [], "block": "1-7-29c290e49ce0"}, {"id": "1-7/44/text", "raw": "「**安全係数**」は、切断荷重を、そのロープに掛かる最大荷重で割った値です。切れる強さに対して、実際の負担をどれだけ小さくして使うかを表します。玉掛け用ワイヤロープでは6以上が必要です。", "text": "「安全係数」は、切断荷重を、そのロープに掛かる最大荷重で割った値です。切れる強さに対して、実際の負担をどれだけ小さくして使うかを表します。玉掛け用ワイヤロープでは6以上が必要です。", "terms": [], "block": "1-7-bfc71dc10961"}, {"id": "1-7/45/text", "raw": "切断荷重60 kNのロープに最大10 kNが掛かる例なら、**安全係数**は60÷10＝6です。荷を2本でつる場合でも、角度によって一本あたりの張力が変わるため、荷の重さを単純に2で割るだけでは判断できないことがあります。詳しい張力計算は力学の章で学びます。", "text": "切断荷重60 kNのロープに最大10 kNが掛かる例なら、安全係数は60÷10＝6です。荷を2本でつる場合でも、角度によって一本あたりの張力が変わるため、荷の重さを単純に2で割るだけでは判断できないことがあります。詳しい張力計算は力学の章で学びます。", "terms": [], "block": "1-7-3300b70d3a6c"}, {"id": "1-7/46/text", "raw": "ここでの6以上は玉掛け用のワイヤロープの基準です。クレーンの**巻上げ**用など、別の用途のすべてのロープへ同じ基準を当てはめないでください。", "text": "ここでの6以上は玉掛け用のワイヤロープの基準です。クレーンの巻上げ用など、別の用途のすべてのロープへ同じ基準を当てはめないでください。", "terms": [], "block": "1-7-114f200b9863"}], "candidates": [{"id": "1-7/3/text#72", "fieldID": "1-7/3/text", "block": "1-7-2b16cdc7e587", "answer": "心綱", "category": "key", "prompt": "［用語？］", "start": 72, "end": 74, "context": "まず、細い鋼線一本を「素線」といいます。複数の素線をより合わせて作る束が「ストランド」、または「子なわ」です。さらに複数のストランドを、中心の「心綱」のまわりにより合わせて、一本のワイヤロープを作ります。", "start16": 72, "end16": 74}, {"id": "1-7/7/text#50", "fieldID": "1-7/7/text", "block": "1-7-a1f1104c18f8", "answer": "フィラー線", "category": "key", "prompt": "［用語？］", "start": 50, "end": 55, "context": "ストランドの素線の組み方には種類があります。フィラー形は、内層と外層の素線の間にできるすき間へ、細いフィラー線を詰めて充填率を高めた構造です(6×Fi(29)などと表します)。フィラー線は細くてロープの強度を受け持たないため、強度計算や素線切断の数え方には含めません。", "start16": 50, "end16": 55}, {"id": "1-7/10/text#5", "fieldID": "1-7/10/text", "block": "1-7-c1dfc4ee6f53", "answer": "繊維心", "category": "key", "prompt": "［用語？］", "start": 5, "end": 8, "context": "心綱には、繊維心やロープ心などがあります。中心でストランドを支え、形を保つ役割があります。繊維心は潤滑油を保持する働きも持ちます。心の材質によって性質は違うため、すべての心綱が同じ量の油を蓄えると考える必要はありません。", "start16": 5, "end16": 8}, {"id": "1-7/19/rows:0:0#0", "fieldID": "1-7/19/rows:0:0", "block": "1-7-rev26-lay", "answer": "普通より", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "普通より", "start16": 0, "end16": 4}, {"id": "1-7/19/rows:0:1#0", "fieldID": "1-7/19/rows:0:1", "block": "1-7-rev26-lay", "answer": "素線", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "素線とストランドが反対方向", "start16": 0, "end16": 2}, {"id": "1-7/19/rows:0:1#3", "fieldID": "1-7/19/rows:0:1", "block": "1-7-rev26-lay", "answer": "ストランド", "category": "key", "prompt": "［用語？］", "start": 3, "end": 8, "context": "素線とストランドが反対方向", "start16": 3, "end16": 8}, {"id": "1-7/19/rows:1:0#0", "fieldID": "1-7/19/rows:1:0", "block": "1-7-rev26-lay", "answer": "ラングより", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "ラングより", "start16": 0, "end16": 5}, {"id": "1-7/24/text#63", "fieldID": "1-7/24/text", "block": "1-7-c517338e61f0", "answer": "実測直径", "category": "key", "prompt": "［用語？］", "start": 63, "end": 67, "context": "教材では、同じ断面を3方向から測って平均する方法を扱います。例えば、①12.1 mm、②12.2 mm、③12.0 mmなら、実測直径は（12.1＋12.2＋12.0）÷3＝12.1 mmです。", "start16": 63, "end16": 67}, {"id": "1-7/25/text#12", "fieldID": "1-7/25/text", "block": "1-7-d19bc3a9c251", "answer": "公称直径", "category": "key", "prompt": "［用語？］", "start": 12, "end": 16, "context": "製品の呼び寸法としての「公称直径」と、実際に測った「実測直径」は区別します。問題文がどちらを尋ねているかに注意してください。", "start16": 12, "end16": 16}, {"id": "1-7/28/text#6", "fieldID": "1-7/28/text", "block": "1-7-234f08e2fe20", "answer": "末端加工効率", "category": "key", "prompt": "［用語？］", "start": 6, "end": 12, "context": "その目安が「末端加工効率」です。元のロープの切断荷重を100％として、加工した部分を含む強さを比較します。切断荷重100 kN、効率80％なら、加工後の強さの目安は80 kNです。これは、80 kNまで安全に作業できるという意味ではありません。", "start16": 6, "end16": 12}, {"id": "1-7/33/rows:0:0#0", "fieldID": "1-7/33/rows:0:0", "block": "1-7-6a78a6453c9d", "answer": "ソケット止め", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "ソケット止め", "start16": 0, "end16": 6}, {"id": "1-7/33/rows:2:0#0", "fieldID": "1-7/33/rows:2:0", "block": "1-7-6a78a6453c9d", "answer": "アイスプライス", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "アイスプライス", "start16": 0, "end16": 7}, {"id": "1-7/33/rows:3:0#0", "fieldID": "1-7/33/rows:3:0", "block": "1-7-6a78a6453c9d", "answer": "クリップ止め", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "クリップ止め", "start16": 0, "end16": 6}, {"id": "1-7/33/rows:4:0#0", "fieldID": "1-7/33/rows:4:0", "block": "1-7-6a78a6453c9d", "answer": "くさび止め", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "くさび止め", "start16": 0, "end16": 5}, {"id": "1-7/37/text#0", "fieldID": "1-7/37/text", "block": "1-7-5e182aa5cd23", "answer": "シンブル", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "シンブルは、アイ（輪）の内側に沿わせる溝付きの金具。 ロープが金具に当たってつぶれたり、摩耗したりするのを抑えます。輪の形を守る役であり、シンブルだけでロープ端を固定するものではありません。", "start16": 0, "end16": 4}, {"id": "1-7/40/text#35", "fieldID": "1-7/40/text", "block": "1-7-14991b942380", "answer": "サドル", "category": "key", "prompt": "［用語？］", "start": 35, "end": 38, "context": "クリップには、U字形のボルトと、ロープを受ける台があります。受け台は「サドル」と呼びます。クレーンの骨組みのサドルと同じ名称ですが、ここではクリップの部品です。", "start16": 35, "end16": 38}], "rounds": {"all": [["1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0", "1-7/19/rows:0:1#3", "1-7/33/rows:4:0#0", "1-7/24/text#63", "1-7/33/rows:3:0#0"], ["1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0", "1-7/19/rows:0:1#3", "1-7/33/rows:4:0#0", "1-7/24/text#63", "1-7/33/rows:3:0#0", "1-7/3/text#72"], ["1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2: -7/33/rows:4:0#0", "1-7/24/text#63", "1-7/33/rows:3:0#0", "1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0"], ["1-7/33/rows:4:0#0", "1-7/19/rows:0:0#0", "1-7/24/text#63", "1-7/33/rows:3:0#0", "1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0"], ["1-7/19/rows:0:0#0", "1-7/24/text#63", "1-7/33/rows:3:0#0", "1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5"], ["1-7/24/text#63", "1-7/33/rows:3:0#0", "1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0"], ["1-7/33/rows:3:0#0", "1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35"], ["1-7/3/text#72", "1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0"], ["1-7/25/text#12", "1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0", "1-7/19/rows:0:1#3"], ["1-7/33/rows:0:0#0", "1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0", "1-7/19/rows:0:1#3", "1-7/33/rows:4:0#0"], ["1-7/7/text#50", "1-7/28/text#6", "1-7/19/rows:1:0#0", "1-7/10/text#5", "1-7/37/text#0", "1-7/40/text#35", "1-7/33/rows:2:0#0", "1-7/19/rows:0:1#3", "1-7/33/rows:4:0#0", "1-7/24/text#63"]], "num": [[]]}}, {"title": "荷をつかむつり具――荷の形や材質に合わせる", "blocks": [{"type": "p", "style": "lead", "text": "フック、つかみ具、電磁石などを、**荷の形や材質に合わせて使い分ける** のがつり具です。", "id": "1-8-63cc363eeb6e"}, {"type": "sub", "text": "フックブロックと外れ止め", "id": "1-8-283950bce865"}, {"type": "p", "text": "**フックブロック**は、シーブやフックなどを組み合わせたつり具です。ロープがシーブを通り、下のフックで荷をつります。フック本体は一般に鍛造で作ります。鍛造とは、金属を打ったり押したりして形を作る方法です。ブロック全体が一個の鍛造品という意味ではありません。", "id": "1-8-5178dfcc2685"}, {"type": "img", "asset": "1-8_hook_slings_readable21", "caption": "つり具の種類。マグネットは磁性体、バキューム式は表面状態など、各つり具の使用条件を確認する", "legend": [], "labels": [], "id": "1-8-b265630e613b", "style": "figure", "_previewFile": "1-8_hook_slings_readable21.png", "_width": 2000, "_height": 1450}, {"type": "svg", "file": "1-8_hook_latch.svg", "caption": "フックの外れ止め", "id": "1-8-341d78dad5e5", "style": "figure", "_previewFile": "1-8_hook_latch.svg"}, {"type": "p", "text": "図では、まずフック本体を見てください。荷の力を支えるのはこの本体です。次に、フックの入口(開口部)にある**外れ止め**を見ます。これが、玉掛け用ロープなどが入口から外れるのを防ぎます。", "id": "1-8-0b8cce763cd9", "quizTerms": ["外れ止め"]}, {"type": "p", "text": "**外れ止め**は、入口を閉じるための部品です。荷重を支えるためのつり位置ではありません。外れ止めにロープを掛けて荷を支えさせるのではなく、フックの正しい位置で荷を受けます。", "id": "1-8-6a9b649ae62b"}, {"type": "p", "text": "**スプリング式**はばねの力で閉じ、ウエイト式は重りの自重で閉じます。外れ止め装置を備えたクレーンで荷をつる際は、その装置を使い、正常に機能することを確認します。装置の取付けに関する条件と、備えた装置の使用義務は分けて読みます。", "id": "1-8-8b43df8be165"}, {"type": "sub", "text": "グラブバケット", "id": "1-8-85f5c3040393"}, {"type": "p", "text": "**グラブバケット**は、砂、砂利、石炭などのばら物をつかむつり具です。口を開いた状態で材料に下ろし、閉じてすくい取ります。箱をフックでつるのとは違い、荷そのものをバケットの中へ取り込みます。", "id": "1-8-082bca21e4a8", "quizTerms": ["グラブバケット"]}, {"type": "sub", "id": "lesson-grab-ropes", "text": "グラブの2本のロープと、コンテナのロック"}, {"type": "p", "text": "複索式のグラブでは、**支持ロープがバケットを支え、開閉ロープが口を動かします**。支持ロープを止め、開閉ロープを巻き取ると閉じ、巻き戻すと開きます。両方を同時に操作すると、開閉状態を保ったまま上げ下げできます。電動油圧式もあります。", "id": "1-8-b0643ccd4ef9", "quizTerms": ["支持ロープ", "開閉ロープ"]}, {"type": "p", "text": "グラブは**ばら物をすくう**、スプレッダは**コンテナの四隅をロックする**。荷のつかみ方を見分けましょう。", "id": "1-8-2c7292a2d469", "quizTerms": ["スプレッダ"]}, {"type": "sub", "text": "リフティングマグネット", "id": "1-8-03dbf73bd29f"}, {"type": "p", "text": "**リフティングマグネット**は、電磁石の力で鋼材や屑鉄などを吸着するつり具です。電磁石は、電気を流すことで磁力を生み出します。ここで扱う一般的なリフティングマグネットでは、直流電源を使います。", "id": "1-8-bd8194d72f58", "quizTerms": ["リフティングマグネット"]}, {"type": "p", "text": "電気が切れると、荷を保持する磁力を失うおそれがあります。このため、停電時に一定時間保持できるよう、**停電保護装置**を備えるものがあります。保護装置があっても、無期限に保持できるわけではありません。", "id": "1-8-9150997704f3", "quizTerms": ["停電保護装置"]}, {"type": "p", "text": "吸着できるかは荷の材質や温度などで変わります。鉄鋼に適したつり具であって、すべての金属を同じように吸着できるわけではありません。鋼が高温になると吸着力が低下することにも注意します。", "id": "1-8-6659edebc0b8"}, {"type": "sub", "text": "バキューム式つり具", "id": "1-8-db3114cce679"}, {"type": "p", "text": "**バキューム式**は、吸盤内の圧力を周囲より低くし、外側の空気の圧力で吸盤を荷に押し付けて保持する方式です。吸盤を窓ガラスに付ける仕組みに似ています。", "id": "1-8-0204be78c419", "quizTerms": ["バキューム式"]}, {"type": "p", "text": "ガラス板や金属板など、表面が滑らかで空気が漏れにくい荷に向きます。凹凸、穴、汚れなどで空気が漏れると、必要な吸着力を保てない場合があります。「板なら何でも同じようにつれる」とは考えず、表面状態と用具の適用条件を確認します。", "id": "1-8-7ff24e0f332f"}, {"type": "sub", "text": "スプレッダ", "id": "1-8-27af1ba65138"}, {"type": "p", "text": "**スプレッダ**はコンテナ専用のつり具です。四隅の隅金具にツイストロックを差し込んで回し、ロックしてつり上げます。", "id": "1-8-7ba9d095690a"}, {"type": "sub", "text": "フックの数――片フックと両フック", "id": "1-8-8194eeca7818"}, {"type": "p", "text": "フックには、つり手が1つの「**片フック**」と、2つの「両フック」があります。小さい容量のクレーンでは片フックが多く、大きい容量のものでは、荷重をバランスよく受けるために両フックが使われます。", "id": "1-8-115eba51ba90"}, {"type": "img", "asset": "1-8_supplement_f15_20261023", "labels": [], "legend": [], "caption": "片側に掛ける形と、左右の両側に掛ける形がある。", "id": "1-8-c448346b36ec", "style": "figure", "_previewFile": "1-8_supplement_f15_20261023.png", "_width": 1470, "_height": 1070}, {"type": "sub", "text": "製鋼工場のつり具――クロー", "id": "1-8-7f51d923d463"}, {"type": "p", "text": "**クロー**は、製鋼工場で、熱い鋼片やレールのような細長い荷をつかんで運ぶための専用のつり具です。", "id": "1-8-437afba9a7e6", "quizTerms": ["クロー"]}, {"type": "img", "asset": "1-8_supplement_f16_20261023", "labels": [], "legend": [], "caption": "クローは、鋼材をつかんで持ち上げるつり具。", "id": "1-8-96fd1449750c", "style": "figure", "_previewFile": "1-8_supplement_f16_20261023.png", "_width": 1470, "_height": 1070}], "id": "1-8", "chapter": 1, "fields": [{"id": "1-8/2/text", "raw": "**フックブロック**は、シーブやフックなどを組み合わせたつり具です。ロープがシーブを通り、下のフックで荷をつります。フック本体は一般に鍛造で作ります。鍛造とは、金属を打ったり押したりして形を作る方法です。ブロック全体が一個の鍛造品という意味ではありません。", "text": "フックブロックは、シーブやフックなどを組み合わせたつり具です。ロープがシーブを通り、下のフックで荷をつります。フック本体は一般に鍛造で作ります。鍛造とは、金属を打ったり押したりして形を作る
