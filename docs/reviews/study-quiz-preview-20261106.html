art16": 3, "end16": 11}], "rounds": {"all": [["2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0", "2-0/16/items:0#3"], ["2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0", "2-0/16/items:0#3", "2-0/4/rows:2:1#3"], ["2-0/9/rows:0:0#0", "2-0/16/items:0#3", "2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0"], ["2-0/16/items:0#3", "2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0"]], "key": [["2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0", "2-0/16/items:0#3"], ["2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0", "2-0/16/items:0#3", "2-0/4/rows:2:1#3"], ["2-0/9/rows:0:0#0", "2-0/16/items:0#3", "2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0"], ["2-0/16/items:0#3", "2-0/4/rows:2:1#3", "2-0/9/rows:1:0#0", "2-0/9/rows:0:0#0"]], "num": [[]]}}, {"id": "2-1", "title": "クレーンを作る・据え付けるときの決まり", "blocks": [{"type": "p", "style": "lead", "text": "最初に **つり上げ荷重3t以上（スタッカー式1t以上）** かを確認。次に、**作るとき** と **据え付けるとき** の手続きを分けます。", "id": "2-1-2976edc52f87"}, {"type": "p", "text": "**製造＝作ること。設置＝使う場所へ据え付けること。** 製造許可は「作ってよいか」の確認、設置届は「据え付け工事の計画」の届出です。時期と提出先も分けて覚えます。", "id": "2-1-9de55c70c093"}, {"type": "img", "asset": "2-1_procedure_concept21", "caption": "作る人の製造許可と、設置する人の届出を分け、設置後の検査へ進む。", "id": "2-1-5a7367a2d013", "style": "figure", "_previewFile": "2-1_procedure_concept21.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "製造許可・設置届・設置報告書の区分", "id": "2-1-aed7b9894ffb"}, {"id": "2-1-0303d9c43f42", "type": "table", "headers": ["つり上げ荷重", "設置するときの書類"], "rows": [["一般：**3t以上**\nスタッカー式：**1t以上**", "**設置届**／工事開始の**30日前まで**"], ["一般：**0.5t以上3t未満**\nスタッカー式：**0.5t以上1t未満**", "**設置報告書**／**あらかじめ**"]], "quizTerms": ["3t以上", "1t以上", "30日前まで", "0.5t以上3t未満", "0.5t以上1t未満", "設置報告書"]}, {"type": "sub", "text": "製造許可", "id": "2-1-eb337800cabe"}, {"type": "p", "text": "つり上げ荷重**3t以上（スタッカー式1t以上）**のクレーンを作る人は、あらかじめ**都道府県労働局長の許可**を受けます。すでに許可されたものと型式が同じ「許可型式クレーン」は不要です。", "id": "2-1-5ec4c7e87cc5", "quizTerms": ["都道府県労働局長"]}, {"type": "p", "text": "申請には、**組立図**、製造過程の**検査設備の概要**、**主任設計者・工作責任者の氏名経歴の概要**などを添えます。設計に関する書類は、次のように分けます。", "id": "2-1-8423dcb106ba"}, {"id": "2-1-cf90b47ec0ef", "type": "table", "headers": ["設計を審査する方法", "設計に関する添付書類"], "rows": [["原則：登録設計審査等機関が審査", "その機関の**設計審査の結果を記載した書類**"], ["労働局長が全部・一部を自ら審査", "上の書類に代えて、**強度計算の基準**など審査に必要な書面"]]}, {"type": "p", "text": "登録設計審査等機関への設計審査申請は、製造許可とは別の手続きです。合格すると**設計審査結果証明書**が交付されます。（安全規則3条・3条の2）", "id": "2-1-421e3607ecb1"}, {"type": "sub", "text": "設置届", "id": "2-1-757d4290d2ea"}, {"type": "p", "text": "対象は**3t以上（スタッカー式1t以上）**。設置する人が、工事開始の**30日前まで**に、**所轄の労働基準監督署長**へ届け出ます。認定を受けた事業者は不要です。", "id": "2-1-7b357a24ac52", "quizTerms": ["所轄の労働基準監督署長"]}, {"id": "2-1-572ca588477c", "type": "table", "headers": ["設置届の添付書類", "確かめる内容"], "rows": [["**明細書・組立図・強度計算書**", "どんなクレーンを設置するか"], ["**据付け場所の書面**", "周囲の状況、基礎の概要、走行クレーンの走行範囲"]]}, {"type": "sub", "text": "設置報告書", "id": "2-1-4d415413567b"}, {"type": "p", "text": "対象は**0.5t以上3t未満（スタッカー式0.5t以上1t未満）**。**あらかじめ所轄署長**へ提出し、設置したときに荷重試験・安定度試験を行います。転倒のおそれがないものは荷重試験のみ。認定事業者は報告不要です。", "id": "2-1-70c2c71fcf20"}, {"type": "p", "text": "**製造許可は「局長」、設置の届出は「署長」。** 作る前の許可と、据え付け工事前の届出を区別します。", "id": "2-1-fa8e8e005059", "style": "tip"}, {"type": "sub", "text": "落成検査 ―― 据え付けたクレーンを使う前の検査", "id": "2-1-69c116aaaaea"}, {"type": "p", "text": "「落成」は設置工事ができあがること。**落成検査**では、使い始める前に各部分の構造・機能と、荷をつったときの状態を確かめます。", "id": "2-1-9404807c8800"}, {"id": "2-1-6e5f97aef1a7", "type": "table", "headers": ["落成検査で確認すること", "対象・方法"], "rows": [["受ける人・検査する人", "**3t以上（スタッカー式1t以上）**を設置した人が、**所轄署長**の検査を受ける。署長が不要と認めたものは除く"], ["**荷重試験**", "定格荷重の**1.25倍**で、つり上げ・走行・旋回・横行などを行う。定格荷重**200t超は＋50t**"], ["**安定度試験**", "定格荷重の**1.27倍**を、最も不利な条件で地切りする。逸走防止装置・レールクランプ等は作用させない"], ["安定度試験を行わないもの", "天井・橋形など、**転倒のおそれがない**クレーン"]], "quizTerms": ["1.25倍", "1.27倍"]}, {"id": "2-1-rev26-completion-application", "type": "p", "text": "落成検査申請書を所轄署長へ提出します。設置届を省略できる認定事業者の場合は、明細書・組立図・強度計算書など、検査に必要な書面も添えます。"}, {"type": "p", "text": "**定格荷重10tの例：荷重試験は12.5t、安定度試験は12.7t。** 前者は荷を動かして機能を確かめ、後者は倒れないかを確かめます。", "id": "2-1-adc87bacbc6d", "style": "tip"}, {"id": "2-1-rev26-inspection-prep", "type": "sub", "text": "検査を受ける人が用意するもの"}, {"id": "2-1-rev26-inspection-prep-table", "type": "table", "headers": ["場面・対象", "覚える条件"], "rows": [["準備と立会い", "検査を受ける人が**試験用の荷・玉掛用具**を準備し、検査に立ち会う"], ["検査に必要な作業", "署長は、安全装置の分解、塗装の一部除去、リベットの抜出し、部材への穴あけ、ロープの一部切断などを命じることができる"]]}, {"id": "2-1-rev26-inspection-prep-other", "type": "p", "text": "準備・立会い等の定めは、**性能・変更・使用再開検査**にも準用されます。性能検査では、安定度試験用の荷の準備は含みません。"}, {"type": "p", "text": "**仮荷重試験**は、製造許可を受けた人が、製造段階で任意に受ける試験です。行うのは**都道府県労働局長**。合格すると仮荷重試験成績表が交付されます。", "id": "2-1-2acb3095dbec"}, {"type": "p", "text": "落成検査前**1年以内**に仮荷重試験を受けていれば、**所轄署長**が落成検査の一部を省略できる場合があります。", "id": "2-1-26523e22d27e", "quizTerms": ["1年以内"]}, {"type": "sub", "text": "クレーン検査証", "id": "2-1-633a4b625607"}, {"type": "p", "text": "検査証は、検査に合格したクレーンであることを示す書類です。**落成検査に合格したとき**、または**署長が検査不要と認めたとき**に、申請者へ交付されます。", "id": "2-1-3cf573f02f12"}, {"id": "2-1-3641eea0032a", "type": "table", "headers": ["場面", "検査証の扱い"], "rows": [["初回の有効期間", "**2年**。落成検査の結果により短くなる場合がある"], ["なくした・壊した", "所轄署長に**再交付**を申請"], ["設置している者が変わった", "異動後**10日以内**に所轄署長へ**書替え**を申請"], ["クレーンを譲る・貸す", "**検査証と一緒に**譲渡・貸与する"]], "quizTerms": ["2年", "再交付", "10日以内", "書替え"]}, {"type": "sub", "text": "建設物等との間隔", "id": "2-1-4549a3060282"}, {"type": "p", "text": "頭上と通り道には余裕を持たせ、乗り移る所のすき間は小さくします。**どこを測るか**を図で確認しましょう。", "id": "2-1-2fe4dea20552"}, {"type": "svg", "file": "2-1_clearance_elevation.svg", "caption": "頭上の間隔。0.4mと1.8mは、測り始める位置が違う。", "id": "2-1-d7376d2c9b3f", "style": "figure", "_previewFile": "2-1_clearance_elevation.svg"}, {"type": "svg", "file": "2-1_clearance_plan.svg", "caption": "歩道幅は0.6m以上、乗り移る所のすき間は0.3m以下。例外は表で確認。", "id": "2-1-d060caab0c8d", "style": "figure", "_previewFile": "2-1_clearance_plan.svg"}, {"id": "2-1-d88042194658", "type": "table", "headers": ["測る場所", "間隔と例外"], "rows": [["走行クレーンの最高部 → 上方の物\n（集電装置は除く）", "**0.4m以上**。ガーダがないもの・ガーダに歩道がないものは除く"], ["ガーダ歩道の床 → 上方の物", "**1.8m以上**。歩道から**1.5m以上**の高さに所定の天がいを付ける場合は例外"], ["走行・旋回クレーンと建設物の間の歩道幅", "**0.6m以上**。柱に接する部分は**0.4m以上**にできる"], ["運転室・運転台の端 → 歩道の端\n（歩道どうしの接続部も同じ）", "**0.3m以下**。墜落のおそれがない場合は例外"]], "quizTerms": ["0.4m以上", "1.8m以上", "1.5m以上", "0.6m以上", "0.3m以下"]}, {"type": "p", "text": "**0.3mだけ「以下」。** 頭上や通路は広く、乗り移るすき間は狭く、と考えると方向を覚えられます。", "id": "2-1-4b5ef724e46f", "style": "tip"}, {"type": "p", "text": "0.4m＝40cm、1.8m＝180cm、0.6m＝60cm、0.3m＝30cm。図は寸法の位置を示す模式図です。", "id": "2-1-e27fa5b05c34"}, {"id": "2-1-35bc0a8436c6", "type": "point", "items": ["**製造は局長／設置は署長。**", "**設置届30日前／設置者異動後の書替え10日以内。**", "荷重試験**1.25倍**、安定度試験**1.27倍**。"]}, {"id": "2-1-rev26-deadline-q", "type": "p", "text": "**確認：** つり上げ荷重3tの一般クレーンを設置する。設置報告書？ 設置届？ いつまで？", "style": "question"}, {"id": "2-1-rev26-deadline-a", "type": "p", "text": "**設置届。工事開始の30日前までに、所轄署長へ。** 3tちょうどは「3t以上」です。", "style": "answer"}], "chapter": 2, "fields": [{"id": "2-1/1/text", "raw": "**製造＝作ること。設置＝使う場所へ据え付けること。** 製造許可は「作ってよいか」の確認、設置届は「据え付け工事の計画」の届出です。時期と提出先も分けて覚えます。", "text": "製造＝作ること。設置＝使う場所へ据え付けること。 製造許可は「作ってよいか」の確認、設置届は「据え付け工事の計画」の届出です。時期と提出先も分けて覚えます。", "terms": [], "block": "2-1-9de55c70c093"}, {"id": "2-1/4/rows:0:0", "raw": "一般：**3t以上**\nスタッカー式：**1t以上**", "text": "一般：3t以上\nスタッカー式：1t以上", "terms": ["3t以上", "1t以上", "30日前まで", "0.5t以上3t未満", "0.5t以上1t未満", "設置報告書"], "block": "2-1-0303d9c43f42"}, {"id": "2-1/4/rows:0:1", "raw": "**設置届**／工事開始の**30日前まで**", "text": "設置届／工事開始の30日前まで", "terms": ["3t以上", "1t以上", "30日前まで", "0.5t以上3t未満", "0.5t以上1t未満", "設置報告書"], "block": "2-1-0303d9c43f42"}, {"id": "2-1/4/rows:1:0", "raw": "一般：**0.5t以上3t未満**\nスタッカー式：**0.5t以上1t未満**", "text": "一般：0.5t以上3t未満\nスタッカー式：0.5t以上1t未満", "terms": ["3t以上", "1t以上", "30日前まで", "0.5t以上3t未満", "0.5t以上1t未満", "設置報告書"], "block": "2-1-0303d9c43f42"}, {"id": "2-1/4/rows:1:1", "raw": "**設置報告書**／**あらかじめ**", "text": "設置報告書／あらかじめ", "terms": ["3t以上", "1t以上", "30日前まで", "0.5t以上3t未満", "0.5t以上1t未満", "設置報告書"], "block": "2-1-0303d9c43f42"}, {"id": "2-1/6/text", "raw": "つり上げ荷重**3t以上（スタッカー式1t以上）**のクレーンを作る人は、あらかじめ**都道府県労働局長の許可**を受けます。すでに許可されたものと型式が同じ「許可型式クレーン」は不要です。", "text": "つり上げ荷重3t以上（スタッカー式1t以上）のクレーンを作る人は、あらかじめ都道府県労働局長の許可を受けます。すでに許可されたものと型式が同じ「許可型式クレーン」は不要です。", "terms": ["都道府県労働局長"], "block": "2-1-5ec4c7e87cc5"}, {"id": "2-1/7/text", "raw": "申請には、**組立図**、製造過程の**検査設備の概要**、**主任設計者・工作責任者の氏名経歴の概要**などを添えます。設計に関する書類は、次のように分けます。", "text": "申請には、組立図、製造過程の検査設備の概要、主任設計者・工作責任者の氏名経歴の概要などを添えます。設計に関する書類は、次のように分けます。", "terms": [], "block": "2-1-8423dcb106ba"}, {"id": "2-1/8/rows:0:0", "raw": "原則：登録設計審査等機関が審査", "text": "原則：登録設計審査等機関が審査", "terms": [], "block": "2-1-cf90b47ec0ef"}, {"id": "2-1/8/rows:0:1", "raw": "その機関の**設計審査の結果を記載した書類**", "text": "その機関の設計審査の結果を記載した書類", "terms": [], "block": "2-1-cf90b47ec0ef"}, {"id": "2-1/8/rows:1:0", "raw": "労働局長が全部・一部を自ら審査", "text": "労働局長が全部・一部を自ら審査", "terms": [], "block": "2-1-cf90b47ec0ef"}, {"id": "2-1/8/rows:1:1", "raw": "上の書類に代えて、**強度計算の基準**など審査に必要な書面", "text": "上の書類に代えて、強度計算の基準など審査に必要な書面", "terms": [], "block": "2-1-cf90b47ec0ef"}, {"id": "2-1/9/text", "raw": "登録設計審査等機関への設計審査申請は、製造許可とは別の手続きです。合格すると**設計審査結果証明書**が交付されます。（安全規則3条・3条の2）", "text": "登録設計審査等機関への設計審査申請は、製造許可とは別の手続きです。合格すると設計審査結果証明書が交付されます。（安全規則3条・3条の2）", "terms": [], "block": "2-1-421e3607ecb1"}, {"id": "2-1/11/text", "raw": "対象は**3t以上（スタッカー式1t以上）**。設置する人が、工事開始の**30日前まで**に、**所轄の労働基準監督署長**へ届け出ます。認定を受けた事業者は不要です。", "text": "対象は3t以上（スタッカー式1t以上）。設置する人が、工事開始の30日前までに、所轄の労働基準監督署長へ届け出ます。認定を受けた事業者は不要です。", "terms": ["所轄の労働基準監督署長"], "block": "2-1-7b357a24ac52"}, {"id": "2-1/12/rows:0:0", "raw": "**明細書・組立図・強度計算書**", "text": "明細書・組立図・強度計算書", "terms": [], "block": "2-1-572ca588477c"}, {"id": "2-1/12/rows:0:1", "raw": "どんなクレーンを設置するか", "text": "どんなクレーンを設置するか", "terms": [], "block": "2-1-572ca588477c"}, {"id": "2-1/12/rows:1:0", "raw": "**据付け場所の書面**", "text": "据付け場所の書面", "terms": [], "block": "2-1-572ca588477c"}, {"id": "2-1/12/rows:1:1", "raw": "周囲の状況、基礎の概要、走行クレーンの走行範囲", "text": "周囲の状況、基礎の概要、走行クレーンの走行範囲", "terms": [], "block": "2-1-572ca588477c"}, {"id": "2-1/14/text", "raw": "対象は**0.5t以上3t未満（スタッカー式0.5t以上1t未満）**。**あらかじめ所轄署長**へ提出し、設置したときに荷重試験・安定度試験を行います。転倒のおそれがないものは荷重試験のみ。認定事業者は報告不要です。", "text": "対象は0.5t以上3t未満（スタッカー式0.5t以上1t未満）。あらかじめ所轄署長へ提出し、設置したときに荷重試験・安定度試験を行います。転倒のおそれがないものは荷重試験のみ。認定事業者は報告不要です。", "terms": [], "block": "2-1-70c2c71fcf20"}, {"id": "2-1/15/text", "raw": "**製造許可は「局長」、設置の届出は「署長」。** 作る前の許可と、据え付け工事前の届出を区別します。", "text": "製造許可は「局長」、設置の届出は「署長」。 作る前の許可と、据え付け工事前の届出を区別します。", "terms": [], "block": "2-1-fa8e8e005059"}, {"id": "2-1/17/text", "raw": "「落成」は設置工事ができあがること。**落成検査**では、使い始める前に各部分の構造・機能と、荷をつったときの状態を確かめます。", "text": "「落成」は設置工事ができあがること。落成検査では、使い始める前に各部分の構造・機能と、荷をつったときの状態を確かめます。", "terms": [], "block": "2-1-9404807c8800"}, {"id": "2-1/18/rows:0:0", "raw": "受ける人・検査する人", "text": "受ける人・検査する人", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:0:1", "raw": "**3t以上（スタッカー式1t以上）**を設置した人が、**所轄署長**の検査を受ける。署長が不要と認めたものは除く", "text": "3t以上（スタッカー式1t以上）を設置した人が、所轄署長の検査を受ける。署長が不要と認めたものは除く", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:1:0", "raw": "**荷重試験**", "text": "荷重試験", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:1:1", "raw": "定格荷重の**1.25倍**で、つり上げ・走行・旋回・横行などを行う。定格荷重**200t超は＋50t**", "text": "定格荷重の1.25倍で、つり上げ・走行・旋回・横行などを行う。定格荷重200t超は＋50t", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:2:0", "raw": "**安定度試験**", "text": "安定度試験", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:2:1", "raw": "定格荷重の**1.27倍**を、最も不利な条件で地切りする。逸走防止装置・レールクランプ等は作用させない", "text": "定格荷重の1.27倍を、最も不利な条件で地切りする。逸走防止装置・レールクランプ等は作用させない", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:3:0", "raw": "安定度試験を行わないもの", "text": "安定度試験を行わないもの", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/18/rows:3:1", "raw": "天井・橋形など、**転倒のおそれがない**クレーン", "text": "天井・橋形など、転倒のおそれがないクレーン", "terms": ["1.25倍", "1.27倍"], "block": "2-1-6e5f97aef1a7"}, {"id": "2-1/19/text", "raw": "落成検査申請書を所轄署長へ提出します。設置届を省略できる認定事業者の場合は、明細書・組立図・強度計算書など、検査に必要な書面も添えます。", "text": "落成検査申請書を所轄署長へ提出します。設置届を省略できる認定事業者の場合は、明細書・組立図・強度計算書など、検査に必要な書面も添えます。", "terms": [], "block": "2-1-rev26-completion-application"}, {"id": "2-1/20/text", "raw": "**定格荷重10tの例：荷重試験は12.5t、安定度試験は12.7t。** 前者は荷を動かして機能を確かめ、後者は倒れないかを確かめます。", "text": "定格荷重10tの例：荷重試験は12.5t、安定度試験は12.7t。 前者は荷を動かして機能を確かめ、後者は倒れないかを確かめます。", "terms": [], "block": "2-1-adc87bacbc6d"}, {"id": "2-1/22/rows:0:0", "raw": "準備と立会い", "text": "準備と立会い", "terms": [], "block": "2-1-rev26-inspection-prep-table"}, {"id": "2-1/22/rows:0:1", "raw": "検査を受ける人が**試験用の荷・玉掛用具**を準備し、検査に立ち会う", "text": "検査を受ける人が試験用の荷・玉掛用具を準備し、検査に立ち会う", "terms": [], "block": "2-1-rev26-inspection-prep-table"}, {"id": "2-1/22/rows:1:0", "raw": "検査に必要な作業", "text": "検査に必要な作業", "terms": [], "block": "2-1-rev26-inspection-prep-table"}, {"id": "2-1/22/rows:1:1", "raw": "署長は、安全装置の分解、塗装の一部除去、リベットの抜出し、部材への穴あけ、ロープの一部切断などを命じることができる", "text": "署長は、安全装置の分解、塗装の一部除去、リベットの抜出し、部材への穴あけ、ロープの一部切断などを命じることができる", "terms": [], "block": "2-1-rev26-inspection-prep-table"}, {"id": "2-1/23/text", "raw": "準備・立会い等の定めは、**性能・変更・使用再開検査**にも準用されます。性能検査では、安定度試験用の荷の準備は含みません。", "text": "準備・立会い等の定めは、性能・変更・使用再開検査にも準用されます。性能検査では、安定度試験用の荷の準備は含みません。", "terms": [], "block": "2-1-rev26-inspection-prep-other"}, {"id": "2-1/24/text", "raw": "**仮荷重試験**は、製造許可を受けた人が、製造段階で任意に受ける試験です。行うのは**都道府県労働局長**。合格すると仮荷重試験成績表が交付されます。", "text": "仮荷重試験は、製造許可を受けた人が、製造段階で任意に受ける試験です。行うのは都道府県労働局長。合格すると仮荷重試験成績表が交付されます。", "terms": [], "block": "2-1-2acb3095dbec"}, {"id": "2-1/25/text", "raw": "落成検査前**1年以内**に仮荷重試験を受けていれば、**所轄署長**が落成検査の一部を省略できる場合があります。", "text": "落成検査前1年以内に仮荷重試験を受けていれば、所轄署長が落成検査の一部を省略できる場合があります。", "terms": ["1年以内"], "block": "2-1-26523e22d27e"}, {"id": "2-1/27/text", "raw": "検査証は、検査に合格したクレーンであることを示す書類です。**落成検査に合格したとき**、または**署長が検査不要と認めたとき**に、申請者へ交付されます。", "text": "検査証は、検査に合格したクレーンであることを示す書類です。落成検査に合格したとき、または署長が検査不要と認めたときに、申請者へ交付されます。", "terms": [], "block": "2-1-3cf573f02f12"}, {"id": "2-1/28/rows:0:0", "raw": "初回の有効期間", "text": "初回の有効期間", "terms": ["2年", "再交付", "10日以内", "書替え"], "block": "2-1-3641eea0032a"}, {"id": "2-1/28/rows:0:1", "raw": "**2年**。落成検査の結果により短くなる場合がある", "text": "2年。落成検査の結果により短くなる場合がある", "t 1/18/rows:2:1#5", "2-1/18/rows:1:1#5"]]}}, {"id": "2-2", "title": "使うとき・働くときの決まり", "blocks": [{"type": "p", "style": "lead", "text": "**巻き上げすぎない・積みすぎない・危険な場所に入らない。** 使う場面を思い浮かべて、守るルールを覚えます。", "id": "2-2-a568ced9d4cd"}, {"type": "sub", "text": "使用の制限と検査証の備付け", "id": "2-2-d906e75ec353"}, {"id": "2-2-f7f4f8ff0a1c", "type": "table", "headers": ["使うときの基本", "守ること"], "rows": [["構造", "構造にかかわる部分が**クレーン構造規格に適合**していること"], ["検査証", "3t以上（スタッカー式1t以上）は**作業場所に備え付ける**。譲渡・貸与も検査証と一緒"], ["負荷条件", "設計の基準とされた**荷重を受ける回数・荷の重さ**に留意する"]], "quizTerms": ["作業場所に備え付ける"]}, {"type": "sub", "text": "巻過ぎの防止(最頻出)", "id": "2-2-442c37a70adc"}, {"type": "p", "text": "**巻過ぎ**は、フックを上げすぎて上部の部品にぶつけること。ロープの切断や荷の落下を防ぐため、停止後にも必要なすき間を残します。", "id": "2-2-7e1f22281173"}, {"id": "2-2-78f5f8c98d1f", "type": "table", "headers": ["巻過防止装置", "残す間隔"], "rows": [["一般", "**0.25m以上（25cm以上）**"], ["**直働式**", "**0.05m以上（5cm以上）**"]], "quizTerms": ["0.25m以上", "0.05m以上"]}, {"type": "p", "text": "測るのは、**つり具や巻上げ用シーブの上面**から、接触のおそれがある**上部の物の下面**まで。傾斜したジブは、測る相手から除きます。", "id": "2-2-89d1a995dea1"}, {"type": "svg", "file": "2-2_overwind_gap.svg", "caption": "フック側の上面と、接触しそうな上部の物の下面との間隔を見る。縮尺は一定ではない。", "id": "2-2-7f3dc9d073bf", "style": "figure", "_previewFile": "2-2_overwind_gap.svg"}, {"type": "p", "text": "巻過防止装置を備えないものでは、巻上げ用**ワイヤロープに標識**を付ける、**警報装置**を設けるなどの措置を取ります。", "id": "2-2-b88be1a66ac9"}, {"type": "sub", "text": "安全弁の調整", "id": "2-2-712589af2553"}, {"type": "p", "text": "水圧・油圧を動力に使うクレーンの安全弁は、**定格荷重相当の荷をかけたときの圧力以下**で作用するよう調整します。ジブクレーンでは**最大の定格荷重**を用います。", "id": "2-2-526100bc0bfb", "quizTerms": ["最大の定格荷重"]}, {"type": "p", "text": "法令の過負荷の特例や荷重試験・安定度試験で、定格荷重を超える荷をかけるときは、それに応じた圧力に調整する扱いがあります。", "id": "2-2-ab2cd57611f5"}, {"type": "sub", "text": "安全装置等の有効保持(頻出)", "id": "2-2-be4fab784a6b"}, {"type": "p", "text": "安全装置は、危険を自動で防ぐ仕組み。**効く状態を保つこと** が基本です。", "id": "2-2-0ebbc92074a8"}, {"id": "2-2-2424adf1e510", "type": "table", "headers": ["だれが・いつ", "行うこと"], "rows": [["事業者", "安全装置・覆い・囲いを**有効な状態に保つ**"], ["一時的に外す必要がある労働者", "**あらかじめ事業者の許可**を受ける"], ["外す必要がなくなったら", "労働者は**直ちに元に戻す**"], ["不具合を見つけたら", "労働者は速やかに申し出る。事業者は速やかに措置する"], ["外れ止め装置のあるクレーンでつる", "**外れ止め装置を使う**"]], "quizTerms": ["あらかじめ事業者の許可", "直ちに元に戻す"]}, {"type": "sub", "text": "過負荷の制限", "id": "2-2-acfc853eb546"}, {"type": "p", "text": "原則は**定格荷重を超えて使わない**こと。やむを得ない事由で、原則によることが著しく困難な場合だけ、次の特例があります。", "id": "2-2-b720c09bfab0"}, {"id": "2-2-9f3ec3b2ffd1", "type": "table", "headers": ["特例を使う順序", "必要な措置"], "rows": [["① 事前の報告", "所轄署長へ**クレーン特例報告書**を提出"], ["② 事前の試験", "**荷重試験**を行い、異常がないことを確認"], ["③ 作業時", "指揮者を指名し、その者の**直接の指揮**のもとで作動"]], "quizTerms": ["クレーン特例報告書"]}, {"type": "p", "text": "特例の上限は、**荷重試験でかけた荷重まで**。試験と使用の結果は、記録して**3年間保存**します。", "id": "2-2-74eda1dbe2f3", "quizTerms": ["3年間保存"]}, {"type": "sub", "text": "傾斜角の制限・定格荷重の表示・運転の合図", "id": "2-2-24b955133262"}, {"id": "2-2-5b7a520ac280", "type": "table", "headers": ["項目", "決まり"], "rows": [["ジブの傾斜角", "**明細書の範囲内**。3t未満は**製造者の指定範囲内**"], ["定格荷重の表示", "**運転者と玉掛けをする者**が、常時知ることができるようにする"], ["運転の合図", "事業者が**一定の合図を定め、合図者を指名**。合図者が行い、作業者は従う。運転者だけで作業する場合は除く"]], "quizTerms": ["運転者と玉掛けをする者"]}, {"type": "sub", "text": "搭乗の制限", "id": "2-2-cc3fd42c443c"}, {"type": "p", "text": "原則として、クレーンで人を運んだり、つり上げて作業させたりすることは禁止。**作業の性質上やむを得ない場合、または安全な作業の遂行に必要な場合**に、専用の搭乗設備を設ける特例があります。", "id": "2-2-e2b2da25a541"}, {"id": "2-2-da9a2f057260", "type": "table", "headers": ["搭乗させる場合", "必要な措置"], "rows": [["設備", "**転位・脱落を防止**する"], ["人", "要求性能墜落制止用器具等を使用させる。請負人には、使用が必要であることを周知する"], ["下ろし方", "**動力下降**による"]], "quizTerms": ["動力下降"]}, {"type": "sub", "text": "立入禁止(つり荷の下)", "id": "2-2-8747b08ac135"}, {"type": "p", "text": "次の方法でつっているときは、見やすい箇所への禁止表示などにより、**つり荷の下への立入りを禁止**します。", "id": "2-2-45501f15c961"}, {"id": "2-2-f4190fa9d3dd", "type": "table", "headers": ["つり方・下ろし方", "禁止の対象となる条件"], "rows": [["**ハッカー**", "個数を問わない"], ["**つりクランプ**", "**1個だけ**で玉掛け"], ["ロープ・チェーン・ベルト", "**1か所だけ**で玉掛け。荷の穴・アイボルトにロープ等を通す方法は除く"], ["複数の荷", "結束・箱入れなどで**固定されていない**ものを一度につる"], ["磁力・陰圧で吸着", "リフティングマグネット、バキューム式など"], ["**動力下降以外**で下ろす", "荷の下に加え、**つり具の下**も立入禁止"]], "quizTerms": ["つり具の下"]}, {"type": "svg", "file": "2-2_no_entry_patterns.svg", "caption": "玉掛け方法と、立入りを禁止する条件を対応させる。", "id": "2-2-90a4aadde09f", "style": "figure", "_previewFile": "2-2_no_entry_patterns.svg"}, {"type": "p", "text": "**ケーブルクレーンのロープの内角側**にも注意。シーブや取付部が壊れると、張ったロープが内角側へ跳ねるため、危険のおそれのある箇所への立入りを禁止します。", "id": "2-2-7ebfc1543f70", "quizTerms": ["ケーブルクレーンのロープの内角側"]}, {"id": "2-2-rev26-inner-angle", "type": "svg", "file": "2-2_inner_angle_20261106.svg", "caption": "上から見た概念図。シーブで折れ曲がるロープの、角の内側を見る。", "style": "figure", "_previewFile": "2-2_inner_angle_20261106.svg"}, {"type": "sub", "text": "並置クレーンの修理等・運転禁止", "id": "2-2-3086318de701"}, {"id": "2-2-a6b27242fef7", "type": "table", "headers": ["作業する場所", "危険を防ぐ措置"], "rows": [["同じランウェイのクレーンを修理・点検する／接触のおそれがある場所で作業する", "**監視人・ストッパー**などにより、他のクレーンとの衝突・接触を防ぐ"], ["天井クレーンのガーダ上、橋形のガーダ・カンチレバー・脚上などで点検する", "**運転を禁止し、操作部分に表示**する"], ["上の運転禁止の例外", "**作業指揮者**を定め、作業者と運転者の**連絡・合図方法**を定めて行わせる"]], "quizTerms": ["作業指揮者"]}, {"type": "sub", "text": "強風時の決まり・運転位置からの離脱の禁止", "id": "2-2-3b2e1a771fd7"}, {"type": "p", "text": "**逸走**は、風などでクレーン本体が意図せず走り出すこと。風への対策は、目的で分けます。", "id": "2-2-16fdf29940da"}, {"id": "2-2-c3e92d39fb3c", "type": "table", "headers": ["場面", "取る措置"], "rows": [["屋外の走行クレーン：瞬間風速**30m/s超の風のおそれ**", "逸走防止装置を作用させるなど、**逸走を防止**"], ["強風で作業に危険が予想される", "**作業中止**。危険の有無で判断する"], ["中止後、ジブ損壊のおそれがある", "**ジブの位置を固定**するなどの措置"], ["**荷をつったまま**のとき", "運転者は運転位置を**離れない**。事業者も離れさせない"]], "quizTerms": ["30m/s超の風のおそれ", "ジブの位置を固定", "離れない"]}, {"type": "sub", "text": "組立て等の作業", "id": "2-2-6a64390f3ce3"}, {"type": "p", "text": "組立て・解体は**作業指揮者の指揮**のもとで行い、強風・大雨・大雪などで危険が予想されるときは作業を行わせません。", "id": "2-2-1e766ed53de4"}, {"type": "p", "text": "組立て・解体では、関係者以外の立入りを禁止し、**禁止の表示も行います**。表示以外の方法で立入りを防ぐ場合も同じです。", "id": "2-2-42292d60ad3b"}, {"id": "2-2-7f251365c579", "type": "table", "headers": ["作業指揮者の役割", "行うこと"], "rows": [["作業計画", "作業方法・労働者の配置を決め、指揮する"], ["材料・道具", "欠点や機能を点検し、**不良品を取り除く**"], ["保護具", "保護帽・墜落制止用器具等の**使用状況を監視**する"]]}, {"id": "2-2-88d5578a09c4", "type": "point", "items": ["巻過ぎの間隔は**0.25m以上／直働式0.05m以上**。", "安全装置を外すなら**事前に許可、不要になれば直ちに復旧**。", "風は**逸走防止・作業中止・ジブ損壊防止**を分ける。"]}, {"id": "2-2-rev26-wind-q", "type": "p", "text": "**確認：** 瞬間風速が30m/s以下でも、強風で作業に危険が予想される。作業は続けられる？", "style": "question"}, {"id": "2-2-rev26-wind-a", "type": "p", "text": "**中止します。** 強風時の作業中止は、危険が予想されるかで判断します。30m/s超のおそれは、屋外走行クレーンの逸走防止措置の条件です。", "style": "answer"}], "chapter": 2, "fields": [{"id": "2-2/2/rows:0:0", "raw": "構造", "text": "構造", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/2/rows:0:1", "raw": "構造にかかわる部分が**クレーン構造規格に適合**していること", "text": "構造にかかわる部分がクレーン構造規格に適合していること", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/2/rows:1:0", "raw": "検査証", "text": "検査証", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/2/rows:1:1", "raw": "3t以上（スタッカー式1t以上）は**作業場所に備え付ける**。譲渡・貸与も検査証と一緒", "text": "3t以上（スタッカー式1t以上）は作業場所に備え付ける。譲渡・貸与も検査証と一緒", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/2/rows:2:0", "raw": "負荷条件", "text": "負荷条件", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/2/rows:2:1", "raw": "設計の基準とされた**荷重を受ける回数・荷の重さ**に留意する", "text": "設計の基準とされた荷重を受ける回数・荷の重さに留意する", "terms": ["作業場所に備え付ける"], "block": "2-2-f7f4f8ff0a1c"}, {"id": "2-2/4/text", "raw": "**巻過ぎ**は、フックを上げすぎて上部の部品にぶつけること。ロープの切断や荷の落下を防ぐため、停止後にも必要なすき間を残します。", "text": "巻過ぎは、フックを上げすぎて上部の部品にぶつけること。ロープの切断や荷の落下を防ぐため、停止後にも必要なすき間を残します。", "terms": [], "block": "2-2-7e1f22281173"}, {"id": "2-2/5/rows:0:0", "raw": "一般", "text": "一般", "terms": ["0.25m以上", "0.05m以上"], "block": "2-2-78f5f8c98d1f"}, {"id": "2-2/5/rows:0:1", "raw": "**0.25m以上（25cm以上）**", "text": "0.25m以上（25cm以上）", "terms": ["0.25m以上", "0.05m以上"], "block": "2-2-78f5f8c98d1f"}, {"id": "2-2/5/rows:1:0", "raw": "**直働式**", "text": "直働式", "terms": ["0.25m以上", "0.05m以上"], "block": "2-2-78f5f8c98d1f"}, {"id": "2-2/5/rows:1:1", "raw": "**0.05m以上（5cm以上）**", "text": "0.05m以上（5cm以上）", "terms": ["0.25m以上", "0.05m以上"], "block": "2-2-78f5f8c98d1f"}, {"id": "2-2/6/text", "raw": "測るのは、**つり具や巻上げ用シーブの上面**から、接触のおそれがある**上部の物の下面**まで。傾斜したジブは、測る相手から除きます。", "text": "測るのは、つり具や巻上げ用シーブの上面から、接触のおそれがある上部の物の下面まで。傾斜したジブは、測る相手から除きます。", "terms": [], "block": "2-2-89d1a995dea1"}, {"id": "2-2/8/text", "raw": "巻過防止装置を備えないものでは、巻上げ用**ワイヤロープに標識**を付ける、**警報装置**を設けるなどの措置を取ります。", "text": "巻過防止装置を備えないものでは、巻上げ用ワイヤロープに標識を付ける、警報装置を設けるなどの措置を取ります。", "terms": [], "block": "2-2-b88be1a66ac9"}, {"id": "2-2/10/text", "raw": "水圧・油圧を動力に使うクレーンの安全弁は、**定格荷重相当の荷をかけたときの圧力以下**で作用するよう調整します。ジブクレーンでは**最大の定格荷重**を用います。", "text": "水圧・油圧を動力に使うクレーンの安全弁は、定格荷重相当の荷をかけたときの圧力以下で作用するよう調整します。ジブクレーンでは最大の定格荷重を用います。", "terms": ["最大の定格荷重"], "block": "2-2-526100bc0bfb"}, {"id": "2-2/11/text", "raw": "法令の過負荷の特例や荷重試験・安定度試験で、定格荷重を超える荷をかけるときは、それに応じた圧力に調整する扱いがあります。", "text": "法令の過負荷の特例や荷重試験・安定度試験で、定格荷重を超える荷をかけるときは、それに応じた圧力に調整する扱いがあります。", "terms": [], "block": "2-2-ab2cd57611f5"}, {"id": "2-2/13/text", "raw": "安全装置は、危険を自動で防ぐ仕組み。**効く状態を保つこと** が基本です。", "text": "安全装置は、危険を自動で防ぐ仕組み。効く状態を保つこと が基本です。", "terms": [], "block": "2-2-0ebbc92074a8"}, {"id": "2-2/14/rows:0:0", "raw": "事業者", "text": "事業者", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:0:1", "raw": "安全装置・覆い・囲いを**有効な状態に保つ**", "text": "安全装置・覆い・囲いを有効な状態に保つ", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:1:0", "raw": "一時的に外す必要がある労働者", "text": "一時的に外す必要がある労働者", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:1:1", "raw": "**あらかじめ事業者の許可**を受ける", "text": "あらかじめ事業者の許可を受ける", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:2:0", "raw": "外す必要がなくなったら", "text": "外す必要がなくなったら", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:2:1", "raw": "労働者は**直ちに元に戻す**", "text": "労働者は直ちに元に戻す", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:3:0", "raw": "不具合を見つけたら", "text": "不具合を見つけたら", "terms": ["あらかじめ事業者の許可", "直ちに元に戻す"], "block": "2-2-2424adf1e510"}, {"id": "2-2/14/rows:3:1 s:3:1#9"], ["2-2/28/text#0", "2-2/14/rows:2:1#4", "2-2/31/rows:2:1#0", "2-2/17/rows:0:1#5", "2-2/34/rows:2:1#0", "2-2/26/rows:5:1#7", "2-2/2/rows:1:1#17", "2-2/10/text#61", "2-2/34/rows:3:1#9", "2-2/14/rows:1:1#0"], ["2-2/14/rows:2:1#4", "2-2/31/rows:2:1#0", "2-2/17/rows:0:1#5", "2-2/34/rows:2:1#0", "2-2/26/rows:5:1#7", "2-2/2/rows:1:1#17", "2-2/10/text#61", "2-2/34/rows:3:1#9", "2-2/14/rows:1:1#0", "2-2/20/rows:1:1#0"], ["2-2/31/rows:2:1#0", "2-2/17/rows:0:1#5", "2-2/34/rows:2:1#0", "2-2/26/rows:5:1#7", "2-2/2/rows:1:1#17", "2-2/10/text#61", "2-2/34/rows:3:1#9", "2-2/14/rows:1:1#0", "2-2/20/rows:1:1#0", "2-2/23/rows:2:1#0"], ["2-2/17/rows:0:1#5", "2-2/34/rows:2:1#0", "2-2/26/rows:5:1#7", "2-2/2/rows:1:1#17", "2-2/10/text#61", "2-2/34/rows:3:1#9", "2-2/14/rows:1:1#0", "2-2/20/rows:1:1#0", "2-2/23/rows:2:1#0", "2-2/28/text#0"], ["2-2/34/rows:2:1#0", "2-2/26/rows:5:1#7", "2-2/2/rows:1:1#17", "2-2/10/text#61", "2-2/34/rows:3:1#9", "2-2/14/rows:1:1#0", "2-2/20/rows:1:1#0", "2-2/23/rows:2:1#0", "2-2/28/text#0", "2-2/14/rows:2:1#4"]], "num": [["2-2/18/text#34", "2-2/5/rows:0:1#0", "2-2/34/rows:0:0#14", "2-2/5/rows:1:1#0"], ["2-2/5/rows:0:1#0", "2-2/34/rows:0:0#14", "2-2/5/rows:1:1#0", "2-2/18/text#34"], ["2-2/34/rows:0:0#14", "2-2/5/rows:1:1#0", "2-2/18/text#34", "2-2/5/rows:0:1#0"], ["2-2/5/rows:1:1#0", "2-2/18/text#34", "2-2/5/rows:0:1#0", "2-2/34/rows:0:0#14"]]}}, {"id": "2-3", "title": "定期的な検査と点検", "blocks": [{"type": "p", "style": "lead", "text": "**作業開始前 → 月次 → 年次** の順に整理。検査・点検は、周期と記録の保存期間をセットで覚えます。", "id": "2-3-4b5464b55cb5"}, {"type": "p", "text": "自転車でも、乗る前のブレーキ確認と、時間をかけた整備は役割が違います。クレーンも、**今日使えるかの点検**と、**定期的な詳しい検査**を組み合わせます。", "id": "2-3-30a1cb9230fc"}, {"type": "img", "asset": "inspection_concept21", "caption": "使う前の確認と、月次・年次の検査を重ねて行う。", "id": "2-3-ff3b9aa4cb8c", "style": "figure", "_previewFile": "inspection_concept21.png", "_width": 1774, "_height": 887}, {"id": "2-3-69987f68f3cd", "type": "table", "headers": ["いつ", "何を確かめる"], "rows": [["**作業開始前**", "その日の運転に必要な機能・通り道・ロープの状態"], ["**1か月以内ごと**", "安全装置・つり具・電気部品などの状態"], ["**1年以内ごと**", "各部分を検査し、**定格荷重・定格速度**で荷重試験"]], "quizTerms": ["作業開始前", "1か月以内ごと", "1年以内ごと", "定格荷重", "定格速度"]}, {"type": "sub", "text": "年次自主検査", "id": "2-3-695b732dee88"}, {"type": "p", "text": "**1年以内ごとに1回**、定期に自主検査を行います。荷重試験は、**定格荷重に相当する荷**をつり、**定格速度**で作動させます。", "id": "2-3-d5eefc3c5e32"}, {"id": "2-3-b0aca9095eef", "type": "table", "headers": ["年次の荷重試験を省略できる場合", "条件"], "rows": [["前の2か月以内", "自主検査日前**2か月以内**に、性能検査の荷重試験を行った"], ["後の2か月以内", "自主検査日後**2か月以内**に、検査証の有効期間が満了する"], ["試験が著しく困難", "発電所・変電所等に設置され、署長が荷重試験不要と認めた"]], "quizTerms": ["2か月以内"]}, {"id": "2-3-rev26-annual-exception", "type": "svg", "file": "2-3_annual_exception_20261106.svg", "caption": "前は「性能検査の荷重試験」、後は「検査証の満了日」。どちらかに当てはまれば、年次の荷重試験を省略できる。", "style": "figure", "_previewFile": "2-3_annual_exception_20261106.svg"}, {"id": "2-3-rev26-annual-exception-scope", "type": "p", "text": "この表で省略できるのは**荷重試験**です。年次自主検査の他の点検は行います。", "style": "tip"}, {"type": "p", "text": "**1年を超えて使わない期間**は、年次自主検査の対象外です。**再び使い始めるとき**に自主検査を行います。", "id": "2-3-556d6aaa3e7a", "quizTerms": ["再び使い始めるとき"]}, {"type": "sub", "text": "月次自主検査", "id": "2-3-454c618d29a6"}, {"id": "2-3-cf59810f6503", "type": "table", "headers": ["月次：1か月以内ごとに1回", "検査するもの"], "rows": [["安全・制御", "巻過防止等の安全装置、過負荷警報等の警報装置、ブレーキ・クラッチ"], ["ロープ・チェーン", "ワイヤロープ・つりチェーンの損傷"], ["つり具", "フック・グラブバケット等の損傷"], ["電気部品", "配線・集電装置・配電盤・開閉器・コントローラ"]]}, {"type": "p", "text": "**1か月を超えて使わない期間**は月次検査の対象外で、再使用時に検査します。**ケーブルクレーン**では、メイン・レール・ガイロープの緊結部と、ウインチの据付け状態も検査します。", "id": "2-3-3a10e259917a"}, {"type": "sub", "text": "作業開始前の点検", "id": "2-3-d17e8b66b3dd"}, {"id": "2-3-8d6941dd6252", "type": "table", "headers": ["その日の作業開始前", "点検するもの"], "rows": [["機能", "巻過防止装置・ブレーキ・クラッチ・コントローラ"], ["レール", "ランウェイ上、トロリが横行するレールの状態"], ["ロープの通り道", "ワイヤロープが通っている箇所の状態"]]}, {"type": "sub", "text": "暴風後・地震後の点検", "id": "2-3-4c34e7b2b899"}, {"id": "2-3-254e5861ebdd", "type": "table", "headers": ["自然現象の後", "作業前に点検する対象"], "rows": [["瞬間風速**30m/sを超える**風", "**屋外**に設置されたクレーン"], ["**中震以上（震度4以上）**の地震", "**屋内・屋外どちらも**"]], "quizTerms": ["30m/sを超える", "中震以上（震度4以上）", "屋内・屋外どちらも"]}, {"type": "img", "asset": "2-3_storm_concept21", "caption": "暴風・地震の後は、作業を再開する前に各部分の異常を確かめる。", "id": "2-3-2ce0795b6403", "style": "figure", "_previewFile": "2-3_storm_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "風の**前**には逸走を防止し、風の**後**には異常を点検します。同じ「30m/s超」でも、行う時期と内容が違います。", "id": "2-3-fcb87966a66b", "style": "tip"}, {"type": "p", "text": "検査・点検の結果は**3年間保存**します。この保存規定の対象から、**作業開始前の点検は除かれます**。異常があれば**直ちに補修**します。", "id": "2-3-e835bf64c9a6", "quizTerms": ["3年間保存", "直ちに補修"]}, {"id": "2-3-2f877f3af66e", "type": "point", "items": ["周期は**1年以内ごと・1か月以内ごと・作業開始前**。", "年次の荷重試験は**定格荷重・定格速度**。", "記録は**3年間**。作業開始前の点検は、この保存規定の対象外。"]}, {"id": "2-3-rev26-rated-q", "type": "p", "text": "**確認：** 定格荷重10tのクレーン。年次自主検査の荷重試験は、10t？ 12.5t？", "style": "question"}, {"id": "2-3-rev26-rated-a", "type": "p", "text": "**10t。定格速度で作動させます。** 12.5tは、落成検査などで行う1.25倍の荷重試験の値です。", "style": "answer"}], "chapter": 2, "fields": [{"id": "2-3/1/text", "raw": "自転車でも、乗る前のブレーキ確認と、時間をかけた整備は役割が違います。クレーンも、**今日使えるかの点検**と、**定期的な詳しい検査**を組み合わせます。", "text": "自転車でも、乗る前のブレーキ確認と、時間をかけた整備は役割が違います。クレーンも、今日使えるかの点検と、定期的な詳しい検査を組み合わせます。", "terms": [], "block": "2-3-30a1cb9230fc"}, {"id": "2-3/3/rows:0:0", "raw": "**作業開始前**", "text": "作業開始前", "terms": ["作業開始前", "1か月以内ごと", "1年以内ごと", "定格荷重", "定格速度"], "block": "2-3-69987f68f3cd"}, {"id": "2-3/3/rows:0:1", "raw": "その日の運転に必要な機能・通り道・ロープの状態", "text": "その日の運転に必要な機能・通り道・ロープの状態", "terms": ["作業開始前", "1か月以内ごと", "1年以内ごと", "定格荷重", "定格速度"], "block": "2-3-69987f68f3cd"}, {"id": "2-3/3/rows:1:0", "raw": "**1か月以内ごと**", "text": "1か月以内ごと", "terms": ["作業開始前", "1か月以内ごと", "1年以内ごと", "定格荷重", "定格速度"], "block": "2-3-69987f68f3cd"}, {"id": "2-3/3/rows:1:1", "raw": "安全装置・つり具・電気部品などの状態", "text": "安全装置・つり具・電気部品などの状態", "terms": ["作業開始前", "1か月以内ごと", "1年以内ごと", "定格荷重", "定格速度"], "block": "2-3-69987f68f3cd"}, {"id": "2-3/3/rows:2:0", "raw": "**1年以内ごと**", "text": "1年以内ごと", "terms": ["作業開始前", "1か月以内ご 速度**で荷重試験を行います。安定度試験は行いません。", "id": "2-4-1a44c7bb80d9"}, {"id": "2-4-6812485f3ce8", "type": "table", "headers": ["検査", "行う場面"], "rows": [["**落成検査**", "据え付け後、使い始める前"], ["**変更検査**", "構造部分を変更した後"], ["**使用再開検査**", "検査証の有効期間を越える休止の後、再び使うとき"], ["**性能検査**", "検査証の有効期間を更新するとき"]]}, {"type": "p", "text": "**10tの例：性能検査は10t、落成等の荷重試験は12.5t。** 「更新」と「新設・変更・再開」を分けると、倍率を選びやすくなります。", "id": "2-4-6ff3cda7afbb", "style": "tip"}, {"type": "sub", "text": "性能検査(検査証の更新)", "id": "2-4-8f37b804d565"}, {"id": "2-4-b371510f6fad", "type": "table", "headers": ["性能検査", "内容"], "rows": [["行う機関", "**登録性能検査機関**"], ["検査の内容", "構造・機能の点検と、**定格荷重・定格速度**による荷重試験"], ["更新する有効期間", "原則**2年**。結果により**2年未満**、または**2年を超え3年以内**にできる"]], "quizTerms": ["登録性能検査機関", "定格荷重", "定格速度", "2年未満", "2年を超え3年以内"]}, {"type": "sub", "text": "変更の手続き(変更届・変更検査)", "id": "2-4-31fb7d7bb3cd"}, {"id": "2-4-1a8388befabf", "type": "table", "headers": ["変更する部分", "必要な手続き"], "rows": [["構造部分\n（ガーダ・ジブ・脚・塔等）", "**変更届＋変更検査**。署長が検査不要と認めたものは除く"], ["原動機・ブレーキ・つり上げ機構・ロープ／チェーン・つり具", "**変更届**の対象"]], "quizTerms": ["変更届＋変更検査"]}, {"id": "2-4-rev26-change-scope", "type": "p", "text": "対象は**3t以上（スタッカー式1t以上）**。工事開始の**30日前まで**に、変更届へ**検査証・変更部分の図面**を添えて所轄署長へ提出します。ワイヤロープ・つりチェーンの図面は除きます。", "quizTerms": ["30日前まで"]}, {"id": "2-4-rev26-change-endorsement", "type": "p", "text": "構造部分の変更検査に合格すると、検査証に**検査期日・変更部分・検査結果**が裏書されます。「裏書」は、検査した内容を証書に記入することです。"}, {"type": "sub", "text": "休止・使用再開・検査証の返還", "id": "2-4-f6ccf91c77b9"}, {"id": "2-4-575a58d6cec3", "type": "table", "headers": ["場面", "手続き"], "rows": [["検査証が切れた後まで休止する", "**有効期間中**に所轄署長へ報告。認定事業者は不要"], ["上の休止後に再び使う", "所轄署長の**使用再開検査**を受ける。合格後、検査証に**検査期日・検査結果**を裏書"], ["使用を廃止／3t未満（スタッカー式1t未満）に変更", "**遅滞なく検査証を所轄署長へ返還**"]], "quizTerms": ["有効期間中", "所轄署長へ返還"]}, {"id": "2-4-rev26-restart-difference", "type": "p", "text": "検査証が切れる休止は、この節の使用再開検査で扱います。使わなかった期間に応じて行う年次・月次の自主検査は、前の節で確認できます。"}, {"id": "2-4-rev26-inspection-link", "type": "p", "text": "定期自主検査：長く使わなかった後の検査", "style": "reference", "file": "2-3"}, {"id": "2-4-e1327655cf1f", "type": えて所轄署長へ提出します。ワイヤロープ・つりチェーンの図面は除きます。", "text": "対象は3t以上（スタッカー式1t以上）。工事開始の30日前までに、変更届へ検査証・変更部分の図面を添えて所轄署長へ提出します。ワイヤロープ・つりチェーンの図面は除きます。", "terms": ["30日前まで"], "block": "2-4-rev26-change-scope"}, {"id": "2-4/13/text", "raw": "構造部分の変更検査に合格すると、検査証に**検査期日・変更部分・検査結果**が裏書されます。「裏書」は、検査した内容を証書に記入することです。", "text": "構造部分の変更検査に合格すると、検査証に検査期日・変更部分・検査結果が裏書されます。「裏書」は、検査した内容を証書に記入することです。", "terms": [], "block": "2-4-rev26-change-endorsement"}, {"id": "2-4/15/rows:0:0", "raw": "検査証が切れた後まで休止する", "text": "検査証が切れた後まで休止する", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/15/rows:0:1", "raw": "**有効期間中**に所轄署長へ報告。認定事業者は不要", "text": "有効期間中に所轄署長へ報告。認定事業者は不要", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/15/rows:1:0", "raw": "上の休止後に再び使う", "text": "上の休止後に再び使う", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/15/rows:1:1", "raw": "所轄署長の**使用再開検査**を受ける。合格後、検査証に**検査期日・検査結果**を裏書", "text": "所轄署長の使用再開検査を受ける。合格後、検査証に検査期日・検査結果を裏書", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/15/rows:2:0", "raw": "使用を廃止／3t未満（スタッカー式1t未満）に変更", "text": "使用を廃止／3t未満（スタッカー式1t未満）に変更", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/15/rows:2:1", "raw": "**遅滞なく検査証を所轄署長へ返還**", "text": "遅滞なく検査証を所轄署長へ返還", "terms": ["有効期間中", "所轄署長へ返還"], "block": "2-4-575a58d6cec3"}, {"id": "2-4/16/text", "raw": "検査証が切れる休止は、この節の使用再開検査で扱います。使わなかった期間に応じて行う年次・月次の自主検査は、前の節で確認できます。", "text": "検査証が切れる休止は、この節の使用再開検査で扱います。使わなかった期間に応じて行う年次・月次の自主検査は、前の節で確認できます。", "terms": [], "block": "2-4-rev26-restart-difference"}, {"id": "2-4/18/items:0", "raw": "更新の**性能検査は定格荷重**。落成・変更・使用再開の荷重試験は**1.25倍**。", "text": "更新の性能検査は定格荷重。落成・変更・使用再開の荷重試験は1.25倍。", "terms": [], "block": "2-4-e1327655cf1f"}, {"id": "2-4/18/items:1", "raw": "**変更届の対象は広く、変更検査は構造部分**。", "text": "変更届の対象は広く、変更検査は構造部分。", "terms": [], "block": "2-4-e1327655cf1f"}, {"id": "2-4/18/items:2", "raw": "検査証の返還は**使用廃止・対象荷重未満への変更**。", "text": "検査証の返還は使用廃止・対象荷重未満への変更。", "terms": [], "block": "2-4-e1327655cf1f"}], "candidates": [{"id": "2-4/3/text#24", "fieldID": "2-4/3/text", "block": "2-4-872db8fa581b", "answer": "1.25倍", "category": "num", "prompt": "［数値？］", "start": 24, "end": 29, "context": "落成・変更・使用再開検査の荷重試験は、定格荷重の1.25倍。定格荷重が200tを超える場合は、定格荷重に50tを足した荷重です。", "start16": 24, "end16": 29}, {"id": "2-4/4/text#13", "fieldID": "2-4/4/text", "block": "2-4-31640706eb31", "answer": "1.27倍", "category": "num", "prompt": "［数値？］", "start": 13, "end": 18, "context": "これらの検査の安定度試験は1.27倍。天井・橋形など転倒のおそれがないものでは、安定度試験を行いません。", "start16": 13, "end16": 18}, {"id": "2-4/9/rows:0:1#0", "fieldID": "2-4/9/rows:0:1", "block": "2-4-b371510f6fad", "answer": "登録性能検査機関", "category": "key", "prompt": "［用語？］", "start": 0, "end": 8, "context": "登録性能検査機関", "start16": 0, "end16": 8}, {"id": "2-4/9/rows:1:1#10", "fieldID": "2-4/9/rows:1:1", "block": "2-4-b371510f6fad", "answer": "定格荷重", "category": "key", "prompt": "［用語？］", "start": 10, "end": 14, "context": "構造・機能の点検と、定格荷重・定格速度による荷重試験", "start16": 10, "end16": 14}, {"id": "2-4/9/rows:1:1#15", "fieldID": "2-4/9/rows:1:1", "block": "2-4-b371510f6fad", "answer": "定格速度", "category": "key", "prompt": "［用語？］", "start": 15, "end": 19, "context": "構造・機能の点検と、定格荷重・定格速度による荷重試験", "start16": 15, "end16": 19}, {"id": "2-4/9/rows:2:1#10", "fieldID": "2-4/9/rows:2:1", "block": "2-4-b371510f6fad", "answer": "2年未満", "category": "num", "prompt": "［数値？］", "start": 10, "end": 14, "context": "原則2年。結果により2年未満、または2年を超え3年以内にできる", "start16": 10, "end16": 14}, {"id": "2-4/9/rows:2:1#18", "fieldID": "2-4/9/rows:2:1", "block": "2-4-b371510f6fad", "answer": "2年を超え3年以内", "category": "num", "prompt": "［数値？］", "start": 18, "end": 27, "context": "原則2年。結果により2年未満、または2年を超え3年以内にできる", "start16": 18, "end16": 27}, {"id": "2-4/11/rows:0:1#0", "fieldID": "2-4/11/rows:0:1", "block": "2-4-1a8388befabf", "answer": "変更届＋変更検査", "category": "key", "prompt": "［用語？］", "start": 0, "end": 8, "context": "変更届＋変更検査。署長が検査不要と認めたものは除く", "start16": 0, "end16": 8}, {"id": "2-4/12/text#25", "f ["2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/12/text#25", "2-4/11/rows:0:1#0", "2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18"], ["2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/12/text#25", "2-4/11/rows:0:1#0", "2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18", "2-4/15/rows:2:1#8"], ["2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/12/text#25", "2-4/11/rows:0:1#0", "2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0"], ["2-4/9/rows:1:1#10", "2-4/15/rows:0:1#0", "2-4/12/text#25", "2-4/11/rows:0:1#0", "2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0"]], "key": [["2-4/15/rows:0:1#0", "2-4/11/rows:0:1#0", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15"], ["2-4/11/rows:0:1#0", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0"], ["2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/11/rows:0:1#0"], ["2-4/9/rows:0:1#0", "2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/11/rows:0:1#0", "2-4/15/rows:2:1#8"], ["2-4/9/rows:1:1#15", "2-4/15/rows:0:1#0", "2-4/11/rows:0:1#0", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0"], ["2-4/9/rows:1:1#10", "2-4/15/rows:0:1#0", "2-4/11/rows:0:1#0", "2-4/15/rows:2:1#8", "2-4/9/rows:0:1#0"]], "num": [["2-4/12/text#25", "2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18"], ["2-4/3/text#24", "2-4/4/text#13", "2-4/9/rows:2:1#18", "2-4/12/text#25"], ["2-4/4/text#13", "2-4/9/rows:2:1#18", "2-4/12/text#25", "2-4/3/text#24"], ["2-4/9/rows:2:1#18", "2-4/12/text#25", "2-4/3/text#24", "2-4/4/text#13"], ["2-4/9/rows:2:1#10", "2-4/12/text#25", "2-4/3/text#24", "2-4/4/text#13"]]}}, {"id": "2-5", "title": "玉掛用具の安全基準", "blocks": [{"type": "p", "style": "lead", "text": "玉掛用具は、**必要な強さがあるか** と **傷んでいないか** を確認。安全係数と使用禁止の基準を分けて覚えます。", "id": "2-5-47d3ab1c5e5f"}, {"type": "sub", "text": "安全係数(切断荷重÷最大荷重)", "id": "2-5-7a6042ae1ab8"}, {"type": "p", "text": "安全係数は、**切断荷重÷その用具にかかる最大荷重**。切れる強さに対して、どれだけ余裕を持って使うかを表します。切断荷重60kN、最大荷重10kNなら、60÷10＝**6**です。", "id": "2-5-048bfe8fc88f"}, {"type": "img", "asset": "2-6_safety_concept21", "caption": "使用時の最大の力を1とすると、切断荷重が6なら安全係数6。", "id": "2-5-1ad141e4d4c0", "style": "figure", "_previewFile": "2-6_safety_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "計算する二つの荷重は、kNなど**同じ単位**にそろえます。", "id": "2-5-413e2dbb90e5"}, {"type": "table", "headers": ["用具", "必要な安全係数"], "rows": [["玉掛け用ワイヤロープ", "**6以上**"], ["玉掛け用つりチェーン", "所定の要件をすべて満たすものは **4以上**、それ以外は **5以上**"], ["玉掛け用フック・シャックル", "**5以上**"]], "id": "2-5-048ae38b3a53", "quizTerms": ["6以上", "4以上", "5以上"]}, {"id": "2-5-8dd76f1977f1", "type": "table", "headers": ["安全係数4以上とするチェーン", "すべて必要な材料の条件"], "rows": [["① 小さな伸びで耐える", "切断荷重の**1/2**で引っ張ったとき、伸び**0.5％以下**"], ["② 強さと伸び", "引張強さが**400N/mm²以上**で、下表の伸びを満たす"]], "quizTerms": ["0.5％以下", "400N/mm²以上"]}, {"type": "p", "text": "この要件をすべて満たすチェーンは**安全係数4以上**、それ以外は**5以上**です。", "id": "2-5-537eb6d8a127"}, {"type": "table", "headers": ["引張強さ(N/mm²)", "必要な伸び(%)"], "rows": [["400以上630未満", "20%以上"], ["630以上1000未満", "17%以上"], ["1000以上", "15%以上"]], "id": "2-5-fd094ac8e656"}, {"type": "p", "text": "上の表は**材料を試験したときの性質**。これから学ぶ「伸び5％超・直径減少10％超」は、**使って傷んだチェーン**の基準です。", "style": "tip", "id": "2-5-50bd4d26a9d2"}, {"type": "sub", "text": "不適格な玉掛用具(使用禁止・最頻出)", "id": "2-5-fddb8d370e8e"}, {"type": "p", "text": "ここからは **使用禁止の基準** です。用具ごとに、数字と傷み方を結びつけて覚えましょう。", "id": "2-5-b77c41903060"}, {"type": "p", "text": "**不適格なワイヤロープ**(次のいずれかに当たるものは使用禁止)", "id": "2-5-2e4b2c48bcdf"}, {"id": "2-5-846a8b2798d3", "type": "table", "headers": ["ワイヤロープの傷み", "使用禁止の基準"], "rows": [["素線の断線", "**1よりの間**で、素線数の**10％以上**。フィラ線を除く"], ["直径の減少", "公称径の**7％を超える**"], ["ねじれ・くせ", "**キンク**したもの"], ["形・さび", "**著しい形くずれ・著しい腐食**"]], "quizTerms": ["1よりの間", "10％以上", "7％を超える", "キンク"]}, {"type": "svg", "file": "2-6_wire_reject.svg", "caption": "断線は10％以上、直径減少は7％超。フィラ線は断線率の計算に含めない。", "id": "2-5-82052de1679b", "style": "figure", "_previewFile": "2-6_wire_reject.svg"}, {"type": "img", "asset": "1-7_supplement_f14_20261023", "labels": [], "legend": [], "caption": "赤い細線がフィラ線。右の赤いストランドが1回転して、同じ側に戻るまでの長さが「1より」。断線率ではフィラ線を除く。", "id": "2-5-04b937d68d00", "style": "figure", "_previewFile": "1-7_supplement_f14_20261023.png", "_width": 1470, "_height": 1070}, {"type": "p", "text": "**例：フィラ線を除いた素線数が222本**のロープ。断線率は、フィラ線を除いた断線数を、222本で割って求めます。", "id": "2-5-2967bafb2f3c"}, {"type": "p", "text": "222×10％＝22.2本なので、1より間で**23本以上**切れていれば使用禁止。公称径10mmなら、7％減は9.3mmなので、**9.3mm未満**が直径減少の禁止基準に当たります。", "id": "2-5-5a170b859d0c"}, {"type": "p", "text": "**キンク**は、輪になったロープを引き締めて生じる、元に戻らないねじれや形くずれ。断線や直径減少の数値とは別に、使用禁止です。", "id": "2-5-c53a7f9eae2a"}, {"type": "img", "asset": "2-5_supplement_f35_20261023", "labels": [], "legend": [], "caption": "できた輪を無理に引き締めると、元に戻らない形くずれ（キンク）が生じる。", "id": "2-5-6507a2bb6267", "style": "figure", "_previewFile": "2-5_supplement_f35_20261023.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**そのほかの用具の使用禁止基準**", "id": "2-5-5cc6dbb6b58c"}, {"type": "table", "headers": ["用具", "使用禁止になる基準"], "rows": [["つりチェーン", "伸びが製造時の長さの **5%を超える** もの、リンクの断面の直径の減少が製造時の直径の **10%を超える** もの、き裂があるもの"], ["フック・シャックル・リング等の金具", "変形しているもの、き裂があるもの"], ["繊維ロープ・繊維ベルト", "ストランドが切断しているもの、著しい損傷または腐食があるもの"]], "id": "2-5-7362134016f1", "quizTerms": ["5%を超える", "10%を超える"]}, {"type": "svg", "file": "2-6_chain_reject.svg", "caption": "伸びは長さの5％超、摩耗はリンクを作る金属の直径の10％超。", "id": "2-5-63b3dfa05c36", "style": "figure", "_previewFile": "2-6_chain_reject.svg"}, {"type": "p", "text": "**リンク**は、チェーンの輪の一つ一つ。伸びはチェーンの長さ、摩耗は輪を作る金属の太さを測ります。", "id": "2-5-aa31e44bafe1"}, {"type": "p", "text": "**チェーンはき裂、フック等の金具は変形・き裂**があれば使用禁止です。長さや直径の数値とは、別の判定項目です。", "id": "2-5-1be3488c7c23"}, {"type": "img", "asset": "2-5_supplement_f34_20261023", "labels": [], "legend": [], "caption": "シャックルは本体とピンで用具などをつなぐ。使用形態は製品の指定に従う。", "id": "2-5-25452c371b01", "style": "figure", "_previewFile": "2-5_supplement_f34_20261023.png", "_width": 1472, "_height": 1068}, {"id": "2-5-761d7e61d040", "type": "p", "text": "**確認：** 製造時1mのチェーンが1.05mになった。「伸び5％を超える」に当たる？", "style": "question"}, {"id": "2-5-rev26-chain-boundary-a", "type": "p", "text": "**この伸びの基準には当たりません。** 5％ちょうどで、「5％を超える」には含まれないためです。き裂やリンク径の減少も別に確認します。", "style": "answer"}, {"type": "sub", "text": "リングの具備等・使用範囲の制限・作業開始前の点検", "id": "2-5-541b1055c9c3"}, {"id": "2-5-22a158a38a77", "type": "table", "headers": ["用具・場面", "必要な条件"], "rows": [["両端のあるロープ・チェーン", "両端に**フック・シャックル・リング・アイ**のいずれかを備える。エンドレスは除く"], ["アイ（輪）の作り方", "**アイスプライス・圧縮止め**、または同等以上の強さを保つ方法"], ["吸着式・チェーンブロック等", "定められた**使用荷重等の範囲内**で使う"], ["つりクランプ", "使用荷重の範囲内で、**用途に合う方法**で使う"], ["その日の作業開始前", "玉掛用具の異常を点検。異常があれば**直ちに補修**"]], "quizTerms": ["アイスプライス・圧縮止め"]}, {"id": "2-5-71e4c0b34017", "type": "table", "headers": ["アイスプライス", "編込みの回数"], "rows": [["基本の組合せ", "**全ストランド3回以上** → 各ストランドの素線を半数にして**2回以上**"], ["別の組合せ", "**全ストランド4回以上** → 各ストランドの素線を半数にして**1回以上**"]], "quizTerms": ["全ストランド3回以上", "2回以上", "全ストランド4回以上", "1回以上"]}, {"type": "p", "text": "「半数」にするのは、**各ストランドを作る素線**です。ストランドの本数を半分にする、という意味ではありません。", "id": "2-5-6c5eea2786be", "style": "tip"}, {"id": "2-5-75e85e5b4880", "type": "point", "items": ["安全係数は、ワイヤ**6以上**、フック・シャックル**5以上**、チェーンは要件により**4以上／5以上**。", "ワイヤは**断線10％以上・直径減少7％超**。", "チェーンは**伸び5％超・リンク径減少10％超・き裂**。"]}], "chapter": 2, "fields": [{"id": "2-5/2/text", "raw": "安全係数は、**切断荷重÷その用具にかかる最大荷重**。切れる強さに対して、どれだけ余裕を持って使うかを表します。切断荷重60kN、最大荷重10kNなら、60÷10＝**6**です。", "text": "安全係数は、切断荷重÷その用具にかかる最大荷重。切れる強さに対して、どれだけ余裕を持って使うかを表します。切断荷重60kN、最大荷重10kNなら、60÷10＝6です。", "terms": [], "block": "2-5-048bfe8fc88f"}, {"id": "2-5/4/text", "raw": "計算する二つの荷重は、kNなど**同じ単位**にそろえます。", "text": "計算する二つの荷重は、kNなど同じ単位にそろえます。", "terms": [], "block": "2-5-413e2dbb90e5"}, {"id": "2-5/5/rows:0:0", "raw": "玉掛け用ワイヤロープ", "text": "玉掛け用ワイヤロープ", "terms": ["6以上", "4以上", "5以上"], "block": "2-5-048ae38b3a53"}, {"id": "2-5/5/rows:0:1", "raw": "**6以上**", "text": "6以上", "terms": ["6以上", "4以上", "5以上"], "block": "2-5-048ae38b3a53"}, {"id": "2-5/5/rows:1:0", "raw": "玉掛け用つりチェーン", "text": "玉掛け用つりチェーン", "terms": **床上操作式**", "床上で運転し、**荷の移動とともに移動**。5t以上でも技能講習で運転できる"], ["**床上運転式**", "床上で運転し、**クレーンの走行とともに移動**。床上運転式限定免許の対象"], ["**無線操作式**", "5t未満は特別の教育。5t以上は上表の免許。**床上操作式技能講習・床上運転式限定免許の対象外**"]], "quizTerms": ["荷の移動とともに移動", "クレーンの走行とともに移動"]}, {"id": "2-6-rev26-control-motion", "type": "p", "text": "**横行**はトロリが動くこと、**走行**はクレーン全体が動くこと。床上操作式は荷について歩き、床上運転式はクレーン全体の走行について歩く、と見分けます。", "style": "tip"}, {"id": "2-6-rev26-license-route", "type": "sub", "text": "クレーン限定免許を受ける主な道筋"}, {"id": "2-6-rev26-license-route-table", "type": "table", "headers": ["場面・対象", "覚える条件"], "rows": [["学科に合格した人", "クレーンを用いた**実技試験に合格**、または学科試験日から**1年以内に実技教習を修了**"], ["床上運転式限定免許のある人", "クレーンの**実技試験に合格**、または**実技教習を修了**"]]}, {"id": "2-6-rev26-license-scope", "type": "p", "text": "クレーン限定免許で扱える機械は**クレーン**です。デリックや移動式クレーンは、別の資格で扱います。"}, {"type": "sub", "text": "免許の欠格・携帯・取消し(頻出)", "id": "2-6-a08e03300c9c"}, {"id": "2-6-72c28462b176", "type": "table", "headers": ["免許の扱い", "条件・手続き"], "rows": [["**欠格**（免許を与えない）", "**満18歳未満**、所定の取消しから**1年未経過**"], ["**携帯**", "免許が必要な業務に従事するときに持つ"], ["**再交付／書替え**", "業務に就いている・就こうとする人が、**滅失・損傷／氏名変更**のときに受ける"], ["再交付・書替えの申請先", "免許を交付した局長、または**住所を管轄する局長**"], ["**取消し・停止**", "局長が取消し、または**6か月以内**の効力停止を行う場合がある"], ["取消しを受けた後", "**遅滞なく、取消しをした局長へ返還**"]], "quizTerms": ["満18歳未満", "1年未経過", "携帯", "住所を管轄する局長", "6か月以内"]}, {"id": "2-6-rev26-license-cancel", "type": "p", "text": "取消し・停止の理由には、故意・重大な過失による重大事故、法令・免許条件の違反、試験等の不正、免許証の他人への譲渡・貸与、本人の取消申請などがあります。"}, {"id": "2-6-rev26-license-health", "type": "p", "text": "心身の障害により業務を適正に行えない場合の取消し・停止には別の定めがあり、上表の**「取消後1年」「停止6か月以内」**は一律には当てはまりません。"}, {"id": "2-6-rev26-license-return", "type": "p", "text": "本人の取消申請は、交付した局長または住所を管轄する局長へ。免許証に他の免許も記載されていれば、返還後、取消事項を抹消し、残る免許について再交付されます。"}, {"type": "sub", "text": "玉掛け業務の資格", "id": "2-6-8a6716015772"}, {"type": "p", "text": "**運転は5t、玉掛けは1t** が大きな境目。どちらも、荷物の重さではなく **機械のつり上げ荷重** で判断します。", "id": "2-6-44f820643dd7"}, {"id": "2-6-dec9af2ee3ab", "type": "table", "headers": ["機械のつり上げ荷重", "玉掛けに必要な資格"], "rows": [["**1t以上**", "**玉掛け技能講習**の修了等（普通職 2-6/15/rows:1:0#0", "2-6/15/rows:3:1#13", "2-6/9/rows:0:1#7", "2-6/1/text#18", "2-6/5/rows:2:1#7", "2-6/5/rows:1:1#10", "2-6/21/rows:0:1#0"], ["2-6/9/rows:1:1#7", "2-6/15/rows:1:0#0", "2-6/15/rows:3:1#13", "2-6/9/rows:0:1#7", "2-6/1/text#18", "2-6/5/rows:2:1#7", "2-6/5/rows:1:1#10", "2-6/21/rows:0:1#0", "2-6/5/rows:4:1#0"], ["2-6/15/rows:1:0#0", "2-6/15/rows:3:1#13", "2-6/9/rows:0:1#7", "2-6/1/text#18", "2-6/5/rows:2:1#7", "2-6/5/rows:1:1#10", "2-6/21/rows:0:1#0", "2-6/5/rows:4:1#0", "2-6/9/rows:1:1#7"]], "num": [["2-6/15/rows:0:1#0", "2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0"], ["2-6/15/rows:0:1#15", "2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0"], ["2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0", "2-6/15/rows:0:1#0"], ["2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0", "2-6/15/rows:0:1#0", "2-6/21/rows:0:0#0"], ["2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0", "2-6/15/rows:0:1#0", "2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0"], ["2-6/5/rows:0:0#3", "2-6/21/rows:1:0#0", "2-6/15/rows:0:1#0", "2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10"], ["2-6/21/rows:1:0#0", "2-6/15/rows:0:1#0", "2-6/21/rows:0:0#0", "2-6/5/rows:4:0#0", "2-6/15/rows:4:1#10", "2-6/5/rows:0:0#3"]]}}, {"id": "3-1", "title": "電気の基礎――電流・電圧・抵抗", "blocks": [{"type": "p", "style": "lead", "text": "**電流＝流れる量、電圧＝流そうとする差、抵抗＝流れにくさ。** まずこの3つを、水道の流れにたとえて考えます。", "id": "3-1-1cb0f3014032"}, {"type": "sub", "text": "電流とは何か――電子の流れ", "id": "3-1-b011aabd706e"}, {"type": "img", "asset": "3-1_current_wire_daily", "caption": "電池とランプをつないだ導線。拡大した金属内では、電子の移動と、約束で決めた電流の向きが逆になる。", "id": "3-1-2db29ee23149", "style": "figure", "_previewFile": "3-1_current_wire_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "金属の導線には、動ける **自由電子** があります。電子は、物質の中にある電気を帯びた小さな粒子です。電池でランプをつなぐと、導線中の電子が動いて電流が流れます。電流の大きさの単位は **アンペア（A）** です。", "id": "3-1-0eaac6eed0a6", "quizTerms": ["自由電子"]}, {"type": "p", "text": "電流の向きは、**プラス極からマイナス極へ**と決めています。金属中の電子が移動する向きは、その逆です。", "id": "3-1-6abe98d7d82a"}, {"type": "sub", "text": "電圧――水位の差にあたる「電気の押す力」", "id": "3-1-536eff167b91"}, {"type": "p", "text": "水が高い水位から低い水位へ流れるように、電気は **電位の差** があると流れます。この差が **電圧**、単位は **ボルト（V）**。電位が高い側を＋、低い側を−とし、電流は外部回路で＋から−へ流れる約束です。", "id": "3-1-ec8e47248e71"}, {"type": "p", "text": "水は高い水面から低い水面へ流れます。水面の高さの差にあたるのが、電気では**電圧**です。電圧は2点の間で考えます。", "id": "3-1-fcae2a2a79c1"}, {"type": "sub", "text": "抵抗――流れにくさ", "id": "3-1-2163e059bc25"}, {"type": "p", "text": "**抵抗** は、電流の流れにくさです。単位は **オーム（Ω）**。同じ水位差で細い管ほど水が流れにくいように、同じ電圧なら抵抗が大きいほど電流が小さくなります。", "id": "3-1-f61f96b524a2"}, {"type": "img", "asset": "3-1_wire_shapes_daily", "caption": "同じ材料・同じ温度の電線で比較。形は長さや太さの違いをつかむ模式図で、計算には本文の比を使う。", "id": "3-1-27a550f36656", "style": "figure", "_previewFile": "3-1_wire_shapes_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "同じ材質の電線では、抵抗は**長さに比例し、断面積に反比例**します。長い道ほど通りにくく、太い道ほど通りやすい、と考えましょう。", "id": "3-1-31bbf25cffcd"}, {"type": "p", "text": "**長さを2倍にすると抵抗は2倍。直径を2倍にすると抵抗は1/4。** 円の面積は直径の2乗に比例するので、直径2倍では断面積が4倍になります。", "id": "3-1-cc205d6c892d", "style": "tip"}, {"type": "sub", "text": "温度による抵抗の変化", "id": "3-1-308fa0f85948"}, {"type": "p", "text": "金属は、温度が上がると内部の原子の振動が激しくなり、電子の流れを妨げやすくなるため、抵抗が増えます。**半導体** は、温度などの条件で電気の通りやすさが変わる材料です。基本的な性質として、温度が上がると抵抗が減る傾向を学びます。", "id": "3-1-2d78dcbb3e48", "quizTerms": ["半導体"]}, {"type": "p", "text": "抵抗の増減を答えるときは、**材質・長さ・太さ・温度のうち、何が変わったか**を先に確認します。", "id": "3-1-941fd7edbb23"}, {"type": "sub", "text": "直流と交流――向きが一定か、周期的に変わるか", "id": "3-1-85937840267d"}, {"type": "img", "asset": "3-1_dc_ac_devices_daily", "caption": "電池は直流、家庭のコンセントは交流の例。交流の反対向きの矢印は、別々の瞬間の向きを示す。", "id": "3-1-13a38df60121", "style": "figure", "_previewFile": "3-1_dc_ac_devices_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "電池のランプと、コンセントにつなぐ照明を思い浮かべます。**直流は同じ向きに、交流は交互に向きを変えながら電流が流れます。** どちらも機器へエネルギーを届けられます。下の波形で、この違いを時間の変化として確かめます。", "id": "3-1-6e7d9dc87411", "quizTerms": ["直流", "交流"]}, {"type": "img", "asset": "3-1_dc_ac_schematic", "caption": "縦は電流、横は時間。0線の上下で、流れる向きが反対になる。", "id": "3-1-45654c8de316", "style": "figure", "_previewFile": "3-1_dc_ac_schematic.png", "_width": 1500, "_height": 1360}, {"type": "p", "text": "**直流（DC）** は、同じ向きに流れる電流です。乾電池やバッテリーが代表例です。**交流（AC）** は、大きさと向きが周期的に変わる電流です。", "id": "3-1-8d655924b70c"}, {"type": "p", "text": "交流を直流に変えることが **整流**。整流しただけでは、通常は大きさに波が残ります。向きは同じで大きさが変わる、この直流を **脈流** といいます。", "id": "3-1-afe0d11c1bc2", "quizTerms": ["整流", "脈流"]}, {"type": "p", "text": "**直流は一方向、交流は向きが交互に変わる。** 大きさが変わっても、流れる向きが一方向なら直流です。", "id": "3-1-c5243bc32bc1", "style": "tip"}, {"type": "sub", "id": "lesson-rectify-smooth", "text": "整流・脈流・平滑――向きと大きさを分ける"}, {"type": "p", "text": "**整流は、交流を一方向に流れる電流へ変えること。** 全波整流では、逆向きに流れていた半周期も同じ向きにそろえます。", "id": "3-1-d7a177207807", "quizTerms": ["全波整流"]}, {"type": "p", "text": "整流した直後は、一方向でも大きさが脈打つ**脈流**になります。", "id": "3-1-1cd4c91bd027"}, {"type": "p", "text": "**平滑化**は、そのでこぼこをならすこと。コンデンサーなどに電気をためて補い、直流をなめらかにします。", "id": "3-1-9621d251e138", "quizTerms": ["平滑化"]}, {"id": "3-1-rev26-rectify-smooth", "type": "svg", "file": "3-1_rectify_smooth_20261106.svg", "caption": "交流 → 整流 → 平滑化。横軸は時間、縦軸は電圧。形の違いを見る模式図。", "style": "figure", "_previewFile": "3-1_rectify_smooth_20261106.svg"}, {"type": "sub", "id": "lesson-transformer-ratio", "text": "変圧器――巻数の比で電圧が変わる"}, {"type": "p", "text": "**変圧器は、交流の電圧を上げ下げする装置。** 同じ電力を送るなら、電圧を高くして電流を小さくすると、電線で失われる熱を減らせます。送るときは高い電圧、使う場所では必要な電圧へ変えられることが、交流の利点です。", "id": "3-1-81838599ca6a", "quizTerms": ["変圧器"]}, {"type": "p", "text": "**変圧器**は、変化する磁界を介して、一次側から二次側へ電気を伝え、交流の電圧を変えます。一定の直流では磁界の変化が続かないため、この働きが続きません。", "id": "3-1-f455e60544f9"}, {"type": "p", "text": "**二次電圧 ÷ 一次電圧 ＝ 二次巻数 ÷ 一次巻数。** コイルの巻数が少ない側は低い電圧、多い側は高い電圧になります。", "id": "3-1-96831540ffd9", "quizTerms": ["二次巻数 ÷ 一次巻数"]}, {"type": "p", "text": "**例：一次200V・1,000回巻き、二次200回巻き。** 巻数は200÷1,000＝1/5なので、二次電圧も200×1/5＝**40V**です。", "id": "3-1-6a8630c0c259"}, {"type": "sub", "text": "単相交流と三相交流", "id": "3-1-b57dab0ecd68"}, {"type": "img", "asset": "3-1_three_phase_turns_daily", "caption": "三相の「タイミングのずれ」を、等間隔に並んだ3人が順番に働く様子にたとえる。電動機内部の構造図ではない。", "id": "3-1-cd638a0e4ece", "style": "figure", "_previewFile": "3-1_three_phase_turns_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "回転遊具の周りで、3人が順番に押す場面を考えます。**1人目・2人目・3人目の出番が、順にやって来る** のがポイントです。三相交流も、同じ形の3つの波のタイミングがずれています。実際の波は次の図で見ます。", "id": "3-1-f5940dac987b"}, {"type": "img", "asset": "3-1_three_phase_schematic", "caption": "左は1つの波、右は同じ振幅・周波数で1/3周期ずつずれた3つの波。", "id": "3-1-b89dac4e10c7", "style": "figure", "_previewFile": "3-1_three_phase_schematic.png", "_width": 1500, "_height": 1040}, {"type": "p", "text": "**単相交流** は1つの波で表され、**三相交流** は3つの単相交流を一定の間隔でずらしたものです。この章の基本回路では、単相2線式・三相3線式で考えます。", "id": "3-1-532c30cb04f0", "quizTerms": ["三相", "単相"]}, {"type": "p", "text": "**イメージのコツ：3つの波の山が、順番にやって来る。** この波のタイミングを **位相** と呼びます。三相のずれは1周期の1/3（120°）です。クレーンの三相誘導電動機は、この三相交流を使います。工場の動力用には一般に200V級・400V級が使われます。", "id": "3-1-1d6e33899fea"}, {"type": "sub", "text": "周波数", "id": "3-1-7f331fa14adf"}, {"type": "img", "asset": "3-1_blink_frequency_daily", "caption": "ランプが点灯して消える1組を1回と数えるたとえ。同じ1秒間に2組なら2Hz、3組なら3Hz。", "id": "3-1-bbc9d5cb2ecd", "style": "figure", "_previewFile": "3-1_blink_frequency_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**周波数は、同じ時間に何回くり返すか。** 点滅ランプなら「点く→消える」で1回、交流の波なら「山→谷」で1周期です。回数を数える考え方は同じです。", "id": "3-1-2dc1876cdde0", "quizTerms": ["周波数"]}, {"type": "img", "asset": "3-1_frequency_schematic", "caption": "山と谷で1組。図では、同じ1秒間に2回・3回くり返す波を比較している。", "id": "3-1-cc879cee25bd", "style": "figure", "_previewFile": "3-1_frequency_schematic.png", "_width": 1500, "_height": 1040}, {"type": "p", "text": "**周波数** は、1秒間に波を何回くり返すかを表し、単位は **ヘルツ（Hz）** です。図の2Hzなら1秒に2回、3Hzなら3回。50Hzは1秒に50回、60Hzは60回です。", "id": "3-1-ed0d49714c6e", "quizTerms": ["ヘルツ"]}, {"type": "p", "text": "**50Hz＝1秒に50周期、60Hz＝1秒に60周期。** 0から始まり、プラス側・マイナス側を通って同じ状態へ戻るまでを1周期と数えます。", "id": "3-1-774ff4297dd7"}, {"type": "sub", "id": "lesson-period-frequency", "text": "周波数から、1回分の時間を求める"}, {"type": "p", "text": "**周期T〔秒〕＝1÷周波数f〔Hz〕**。1秒に50回くり返す50Hzなら、1回は1÷50＝**0.02秒** です。", "id": "3-1-f17ce882b5b1"}, {"type": "p", "text": "50Hzでは1周期が**0.02秒**。プラスの山から次のマイナスの谷までは半周期の**0.01秒**です。電流の向きは1周期に2回変わるので、1秒間に100回変わります。", "id": "3-1-c09e48cdaf69"}, {"id": "3-1-rev26-rms-heading", "type": "sub", "text": "交流100Vは、どの値？"}, {"type": "p", "text": "家庭の交流「100V」は**実効値**です。同じ抵抗で、直流100Vと同じ発熱になる大きさを表します。波のいちばん高い値とは区別します。", "id": "3-1-976df8627fd8", "quizTerms": ["実効値"]}, {"type": "p", "text": "正弦波では、**最大値＝実効値×√2**。実効値100Vなら、最大値は約**141V**です。", "id": "3-1-d98b18efa235", "quizTerms": ["√2"]}, {"id": "3-1-rev26-wire-size-q", "type": "p", "text": "**確認：** 同じ材質・温度で、電線の長さを2倍、直径を2倍にすると抵抗は何倍？", "style": "question"}, {"id": "3-1-rev26-wire-size-a", "type": "p", "text": "**1/2倍。** 長さで2倍、断面積が4倍になることで1/4倍。合わせて2÷4＝1/2です。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-1/3/text", "raw": "金属の導線には、動ける **自由電子** があります。電子は、物質の中にある電気を帯びた小さな粒子です。電池でランプをつなぐと、導線中の電子が動いて電流が流れます。電流の大きさの単位は **アンペア（A）** です。", "text": "金属の導線には、動ける 自由電子 があります。電子は、物質の中にある電気を帯びた小さな粒子です。電池でランプをつなぐと、導線中の電子が動いて電流が流れます。電流の大きさの単位は アンペア（A） です。", "terms": ["自由電子"], "block": "3-1-0eaac6eed0a6"}, {"id": "3-1/4/text", "raw": "電流の向きは、**プラス極からマイナス極へ**と決めています。金属中の電子が移動する向きは、その逆です。", "text": "電流の向きは、プラス極からマイナス極へと決めています。金属中の電子が移動する向きは、その逆です。", "terms": [], "block": "3-1-6abe98d7d82a"}, {"id": "3-1/6/text", "raw": "水が高い水位から低い水位へ流れるように、電気は **電位の差** があると流れます。この差が **電圧**、単位は **ボルト（V）**。電位が高い側を＋、低い側を−とし、電流は外部回路で＋から−へ流れる約束です。", "text": "水が高い水位から低い水位へ流れるように、電気は 電位の差 があると流れます。この差が 電圧、単位は ボルト（V）。電位が高い側を＋、低い側を−とし、電流は外部回路で＋から−へ流れる約束です。", "terms": [], "block": "3-1-ec8e47248e71"}, {"id": "3-1/7/text", "raw": "水は高い水面から低い水面へ流れます。水面の高さの差にあたるのが、電気では**電圧**です。電圧は2点の間で考えます。", "text": "水は高い水面から低い水面へ流れます。水面の高さの差にあたるのが、電気では電圧です。電圧は2点の間で考えます。", "terms": [], "block": "3-1-fcae2a2a79c1"}, {"id": "3-1/9/text", "raw": "**抵抗** は、電流の流れにくさです。単位は **オーム（Ω）**。同じ水位差で細い管ほど水が流れにくいように、同じ電圧なら抵抗が大きいほど電流が小さくなります。", "text": "抵抗 は、電流の流れにくさです。単位は オーム（Ω）。同じ水位差で細い管ほど水が流れにくいように、同じ電圧なら抵抗が大きいほど電流が小さくなります。", "terms": [], "block": "3-1-f61f96b524a2"}, {"id": "3-1/11/text", "raw": "同じ材質の電線では、抵抗は**長さに比例し、断面積に反比例**します。長い道ほど通りにくく、太い道ほど通りやすい、と考えましょう。", "text": "同じ材質の電線では、抵抗は長さに比例し、断面積に反比例します。長い道ほど通りにくく、太い道ほど通りやすい、と考えましょう。", "terms": [], "block": "3-1-31bbf25cffcd"}, {"id": "3-1/12/text", "raw": "**長さを2倍にすると抵抗は2倍。直径を2倍にすると抵抗は1/4。** 円の面積は直径の2乗に比例するので、直径2倍では断面積が4倍になります。", "text": "長さを2倍にすると抵抗は2倍。直径を2倍にすると抵抗は1/4。 円の面積は直径の2乗に比例するので、直径2倍では断面積が4倍になります。", "terms": [], "block": "3-1-cc205d6c892d"}, {"id": "3-1/14/text", "raw": "金属は、温度が上がると内部の原子の振動が激しくなり、電子の流れを妨げやすくなるため、抵抗が増えます。**半導体** は、温度などの条件で電気の通りやすさが変わる材料です。基本的な性質として、温度が上がると抵抗が減る傾向を学びます。", "text": "金属は、温度が上がると内部の原子の振動が激しくなり、電子の流れを妨げやすくなるため、抵抗が増えます。半導体 は、温度などの条件で電気の通りやすさが変わる材料です。基本的な性質として、温度が上がると抵抗が減る傾向を学びます。", "terms": ["半導体"], "block": "3-1-2d78dcbb3e48"}, {"id": "3-1/15/text", "raw": "抵抗の増減を答えるときは、**材質・長さ・太さ・温度のうち、何が変わったか**を先に確認します。", "text": "抵抗の増減を答えるときは、材質・長さ・太さ・温度のうち、何が変わったかを先に確認します。", "terms": [], "block": "3-1-941fd7edbb23"}, {"id": "3-1/18/text", "raw": "電池のランプと、コンセントにつなぐ照明を思い浮かべます。**直流は同じ向きに、交流は交互に向きを変えながら電流が流れます。** どちらも機器へエネルギーを届けられます。下の波形で、この違いを時間の変化として確かめます。", "text": "電池のランプと、コンセントにつなぐ照明を思い浮かべます。直流は同じ向きに、交流は交互に向きを変えながら電流が流れます。 どちらも機器へエネルギーを届けられます。下の波形で、この違いを時間の変化として確かめます。", "terms": ["直流", "交流"], "block": "3-1-6e7d9dc87411"}, {"id": "3-1/20/text", "raw": "**直流（DC）** は、同じ向きに流れる電流です。乾電池やバッテリーが代表例です。**交流（AC）** は、大きさと向きが周期的に変わる電流です。", "text": "直流（DC） は、同じ向きに流れる電流です。乾電池やバッテリーが代表例です。交流（AC） は、大きさと向きが周期的に変わる電流です。", "terms": [], "block": "3-1-8d655924b70c"}, {"id": "3-1/21/text", "raw": "交流を直流に変えることが **整流**。整流しただけでは、通常は大きさに波が残ります。向きは同じで大きさが変わる、この直流を **脈流** といいます。", "text": "交流を直流に変えることが 整流。整流しただけでは、通常は大きさに波が残ります。向きは同じで大きさが変わる、この直流を 脈流 といいます。", "terms": ["整流", "脈流"], "block": "3-1-afe0d11c1bc2"}, {"id": "3-1/22/text", "raw": "**直流は一方向、交流は向きが交互に変わる。** 大きさが変わっても、流れる向きが一方向なら直流です。", "text": "直流は一方向、交流は向きが交互に変わる。 大きさが変わっても、流れる向きが一方向なら直流です。", "terms": [], "block": "3-1-c5243bc32bc1"}, {"id": "3-1/24/text", "raw": "**整流は、交流を一方向に流れる電流へ変えること。** 全波整流では、逆向きに流れていた半周期も同じ向きにそろえます。", "text": "整流は、交流を一方向に流れる電流へ変えること。 全波整流では、逆向きに流れていた半周期も同じ向きにそろえます。", "terms": ["全波整流"], "block": "3-1-d7a177207807"}, {"id": "3-1/25/text", "raw": "整流した直後は、一方向でも大きさが脈打つ**脈流**になります。", "text": "整流した直後は、一方向でも大きさが脈打つ脈流になります。", "terms": [], "block": "3-1-1cd4c91bd027"}, {"id": "3-1/26/text", "raw": "**平滑化**は、そのでこぼこをならすこと。コンデンサーなどに電気をためて補い、直流をなめらかにします。", "text": "平滑化は、そのでこぼこをならすこと。コンデンサーなどに電気をためて補い、直流をなめらかにします。", "terms": ["平滑化"], "block": "3-1-9621d251e138"}, {"id": "3-1/29/text", "raw": "**変圧器は、交流の電圧を上げ下げする装置。** 同じ電力を送るなら、電圧を高くして電流を小さくすると、電線で失われる熱を減らせます。送るときは高い電圧、使う場所では必要な電圧へ変えられることが、交流の利点です。", "text": "変圧器は、交流の電圧を上げ下げする装置。 同じ電力を送るなら、電圧を高くして電流を小さくすると、電線で失われる熱を減らせます。送るときは高い電圧、使う場所では必要な電圧へ変えられることが、交流の利点です。", "terms": ["変圧器"], "block": "3-1-81838599ca6a"}, {"id": "3-1/30/text", "raw": "**変圧器**は、変化する磁界を介して、一次側から二次側へ電気を伝え、交流の電圧を変えます。一定の直流では磁界の変化が続かないため、この働きが続きません。", "text": "変圧器は、変化する磁界を介して、一次側から二次側へ電気を伝え、交流の電圧を変えます。一定の直流では磁界の変化が続かないため、この働きが続きません。", "terms": [], "block": "3-1-f455e60544f9"}, {"id": "3-1/31/text", "raw": "**二次電圧 ÷ 一次電圧 ＝ 二次巻数 ÷ 一次巻数。** コイルの巻数が少ない側は低い電圧、多い側は高い電圧になります。", "text": "二次電圧 ÷ 一次電圧 ＝ 二次巻数 ÷ 一次巻数。 コイルの巻数が少ない側は低い電圧、多い側は高い電圧になります。", "terms": ["二次巻数 ÷ 一次巻数"], "block": "3-1-96831540ffd9"}, {"id": "3-1/32/text", "raw": "**例：一次200V・1,000回巻き、二次200回巻き。** 巻数は200÷1,000＝1/5なので、二次電圧も200×1/5＝**40V**です。", "text": "例：一次200V・1,000回巻き、二次200回巻き。 巻数は200÷1,000＝1/5なので、二次電圧も200×1/5＝40Vです。", "terms": [], "block": "3-1-6a8630c0c259"}, {"id": "3-1/35/text", "raw": "回転遊具の周りで、3人が順番に押す場面を考えます。**1人目・2人目・3人目の出番が、順にやって来る** のがポイントです。三相交流も、同じ形の3つの波のタイミングがずれています。実際の波は次の図で見ます。", "text": "回転遊具の周りで、3人が順番に押す場面を考えます。1人目・2人目・3人目の出番が、順にやって来る のがポイントです。三相交流も、同じ形の3つの波のタイミングがずれています。実際の波は次の図で見ます。", "terms": [], "block": "3-1-f5940dac987b"}, {"id": "3-1/37/text", "raw": "**単相交流** は1つの波で表され、**三相交流** は3つの単相交流を一定の間隔でずらしたものです。この章の基本回路では、単相2線式・三相3線式で考えます。", "text": "単相交流 は1つの波で表され、三相交流 は3つの単相交流を一定の間隔でずらしたものです。この章の基本回路では、単相2線式・三相3線式で考えます。", "terms": ["三相", "単相"], "block": "3-1-532c30cb04f0"}, {"id": "3-1/38/text", "raw": "**イメージのコツ：3つの波の山が、順番にやって来る。** この波のタイミングを **位相** と呼びます。三相のずれは1周期の1/3（120°）です。クレーンの三相誘導電動機は、この三相交流を使います。工場の動力用には一般に200V級・400V級が使われます。", "text": "イメージのコツ：3つの波の山が、順番にやって来る。 この波のタイミングを 位相 と呼びます。三相のずれは1周期の1/3（120°）です。クレーンの三相誘導電動機は、この三相交流を使います。工場の動力用には一般に200V級・400V級が使われます。", "terms": [], "block": "3-1-1d6e33899fea"}, {"id": "3-1/41/text", "raw": "**周波数は、同じ時間に何回くり返すか。** 点滅ランプなら「点く→消える」で1回、交流の波なら「山→谷」で1周期です。回数を数える考え方は同じです。", "text": "周波数は、同じ時間に何回くり返すか。 点滅ランプなら「点く→消える」で1回、交流の波なら「山→谷」で1周期です。回数を数える考え方は同じです。", "terms": ["周波数"], "block": "3-1-2dc1876cdde0"}, {"id": "3-1/43/text", "raw": "**周波数** は、1秒間に波を何回くり返すかを表し、単位は **ヘルツ（Hz）** です。図の2Hzなら1秒に2回、3Hzなら3回。50Hzは1秒に50回、60Hzは60回です。", "text": "周波数 は、1秒間に波を何回くり返すかを表し、単位は ヘルツ（Hz） です。図の2Hzなら1秒に2回、3Hzなら3回。50Hzは1秒に50回、60Hzは60回です。", "terms": ["ヘルツ"], "block": "3-1-ed0d49714c6e"}, {"id": "3-1/44/text", "raw": "**50Hz＝1秒に50周期、60Hz＝1秒に60周期。** 0から始まり、プラス側・マイナス側を通って同じ状態へ戻るまでを1周期と数えます。", "text": "50Hz＝1秒に50周期、60Hz＝1秒に60周期。 0から始まり、プラス側・マイナス側を通って同じ状態へ戻るまでを1周期と数えます。", "terms": [], "block": "3-1-774ff4297dd7"}, {"id": "3-1/46/text", "raw": "**周期T〔秒〕＝1÷周波数f〔Hz〕**。1秒に50回くり返す50Hzなら、1回は1÷50＝**0.02秒** です。", "text": "周期T〔秒〕＝1÷周波数f〔Hz〕。1秒に50回くり返す50Hzなら、1回は1÷50＝0.02秒 です。", "terms": [], "block": "3-1-f17ce882b5b1"}, {"id": "3-1/47/text", "raw": "50Hzでは1周期が**0.02秒**。プラスの山から次のマイナスの谷までは半周期の**0.01秒**です。電流の向きは1周期に2回変わるので、1秒間に100回変わります。", "text": "50Hzでは1周期が0.02秒。プラスの山から次のマイナスの谷までは半周期の0.01秒です。電流の向きは1周期に2回変わるので、1秒間に100回変わります。", "terms": [], "block": "3-1-c09e48cdaf69"}, {"id": "3-1/49/text", "raw": "家庭の交流「100V」は**実効値**です。同じ抵抗で、直流100Vと同じ発熱になる大きさを表します。波のいちばん高い値とは区別します。", "text": "家庭の交流「100V」は実効値です。同じ抵抗で、直流100Vと同じ発熱になる大きさを表します。波のいちばん高い値とは区別します。", "terms": ["実効値"], "block": "3-1-976df8627fd8"}, {"id": "3-1/50/text", "raw": "正弦波では、**最大値＝実効値×√2**。実効値100Vなら、最大値は約**141V**です。", "text": "正弦波では、最大値＝実効値×√2。実効値100Vなら、最大値は約141Vです。", "terms": ["√2"], "block": "3-1-d98b18efa235"}], "candidates": [{"id": "3-1/3/text#12", "fieldID": "3-1/3/text", "block": "3-1-0eaac6eed0a6", "answer": "自由電子", "category": "key", "prompt": "［用語？］", "start": 12, "end": 16, "context": "金属の導線には、動ける 自由電子 があります。電子は、物質の中にある電気を帯びた小さな粒子です。電池でランプをつなぐと、導線中の電子が動いて電流が流れます。電流の大きさの単位は アンペア（A） です。", "start16": 12, "end16": 16}, {"id": "3-1/14/text#50", "fieldID": "3-1/14/text", "block": "3-1-2d78dcbb3e48", "answer": "半導体", "category": "key", "prompt": "［用語？］", "start": 50, "end": 53, "context": "金属は、温度が上がると内部の原子の振動が激しくなり、電子の流れを妨げやすくなるため、抵抗が増えます。半導体 は、温度などの条件で電気の通りやすさが変わる材料です。基本的な性質として、温度が上がると抵抗が減る傾向を学びます。", "start16": 50, "end16": 53}, {"id": "3-1/18/text#28", "fieldID": "3-1/18/text", "block": "3-1-6e7d9dc87411", "answer": "直流", "category": "key", "prompt": "［用語？］", "start": 28, "end": 30, "context": "電池のランプと、コンセントにつなぐ照明を思い浮かべます。直流は同じ向きに、交流は交互に向きを変えながら電流が流れます。 どちらも機器へエネルギーを届けられます。下の波形で、この違いを時間の変化として確かめます。", "start16": 28, "end16": 30}, {"id": "3-1/18/text#37", "fieldID": "3-1/18/text", "block": "3-1-6e7d9dc87411", "answer": "交流", "category": "key", "prompt": "［用語？］", "start": 37, "end": 39, "context": "電池のランプと、コンセントにつなぐ照明を思い浮かべます。直流は同じ向きに、交流は交互に向きを変えながら電流が流れます。 どちらも機器へエネルギーを届けられます。下の波形で、この違いを時間の変化として確かめます。", "start16": 37, "end16": 39}, {"id": "3-1/21/text#13", "fieldID": "3-1/21/text", "block": "3-1-afe0d11c1bc2", "answer": "整流", "category": "key", "prompt": "［用語？］", "start": 13, "end": 15, "context": "交流を直流に変えることが 整流。整流しただけでは、通常は大きさに波が残ります。向きは同じで大きさが変わる、この直流を 脈流 といいます。", "start16": 13, "end16": 15}, {"id": "3-1/21/text#59", "fieldID": "3-1/21/text", "block": "3-1-afe0d11c1bc2", "answer": "脈流", "category": "key", "prompt": "［用語？］", "start": 59, "end": 61, "context": "交流を直流に変えることが 整流。整流しただけでは、通常は大きさに波が残ります。向きは同じで大きさが変わる、この直流を 脈流 といいます。", "start16": 59, "end16": 61}, {"id": "3-1/24/text#24", "fieldID": "3-1/24/text", "block": "3-1-d7a177207807", "answer": "全波整流", "category": "key", "prompt": "［用語？］", "start": 24, "end": 28, "context": "整流は、交流を一方向に流れる電流へ変えること。 全波整流では、逆向きに流れていた半周期も同じ向きにそろえます。", "start16": 24, "end16": 28}, {"id": "3-1/26/text#0", "fieldID": "3-1/26/text", "block": "3-1-9621d251e138", "answer": "平滑化", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "平滑化は、そのでこぼこをならすこと。コンデンサーなどに電気をためて補い、直流をなめらかにします。", "start16": 0, "end16": 3}, {"id": "3-1/29/text#0", "fieldID": "3-1/29/text", "block": "3-1-81838599ca6a", "answer": "変圧器", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "変圧器は、交流の電圧を上げ下げする装置。 同じ電力を送るなら、電圧を高くして電流を小さくすると、電線で失われる熱を減らせます。送るときは高い電圧、使う場所では必要な電圧へ変えられることが、交流の利点です。", "start16": 0, "end16": 3}, {"id": "3-1/31/text#14", "fieldID": "3-1/31/text", "block": "3-1-96831540ffd9", "answer": "二次巻数 ÷ 一次巻数", "category": "key", "prompt": "［式？］", "start": 14, "end": 25, "context": "二次電圧 ÷ 一次電圧 ＝ 二次巻数 ÷ 一次巻数。 コイルの巻数が少ない側は低い電圧、多い側は高い電圧になります。", "start16": 14, "end16": 25}, {"id": "3-1/37/text#55", "fieldID": "3-1/37/text", "block": "3-1-532c30cb04f0", "answer": "単相", "category": "key", "prompt": "［用語？］", "start": 55, "end": 57, "context": "単相交流 は1つの波で表され、三相交流 は3つの単相交流を一定の間隔でずらしたものです。この章の基本回路では、単相2線式・三相3線式で考えます。", "start16": 55, "end16": 57}, {"id": "3-1/37/text#61", "fieldID": "3-1/37/text", "block": "3-1-532c30cb04f0", "answer": "三相", "category": "key", "prompt": "［用語？］", "start": 61, "end": 63, "context": "単相交流 は1つの波で表され、三相交流 は3つの単相交流を一定の間隔でずらしたものです。この章の基本回路では、単相2線式・三相3線式で考えます。", "start16": 61, "end16": 63}, {"id": "3-1/41/text#0", "fieldID": "3-1/41/text", "block": "3-1-2dc1876cdde0", "answer": "周波数", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "周波数は、同じ時間に何回くり返すか。 点滅ランプなら「点く→消える」で1回、交流の波なら「山→谷」で1周期です。回数を数える考え方は同じです。", "start16": 0, "end16": 3}, {"id": "3-1/43/text#27", "fieldID": "3-1/43/text", "block": "3-1-ed0d49714c6e", "answer": "ヘルツ", "category": "key", "prompt": "［用語？］", "start": 27, "end": 30, "context": "周波数 は、1秒間に波を何回くり返すかを表し、単位は ヘルツ（Hz） です。図の2Hzなら1秒に2回、3Hzなら3回。50Hzは1秒に50回、60Hzは60回です。", "start16": 27, "end16": 30}, {"id": "3-1/49/text#12", "fieldID": "3-1/49/text", "block": "3-1-976df8627fd8", "answer": "実効値", "category": "key", "prompt": "［用語？］", "start": 12, "end": 15, "context": "家庭の交流「100V」は実効値です。同じ抵抗で、直流100Vと同じ発熱になる大きさを表します。波のいちばん高い値とは区別します。", "start16": 12, "end16": 15}, {"id": "3-1/50/text#14", "fieldID": "3-1/50/text", "block": "3-1-d98b18efa235", "answer": "√2", "category": "num", "prompt": "［数値？］", "start": 14, "end": 16, "context": "正弦波では、最大値＝実効値×√2。実効値100Vなら、最大値は約141Vです。", "start16": 14, "end16": 16}], "rounds": {"all": [["3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55"], ["3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61"], ["3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12"], ["3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/50/text#14"], ["3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/50/text#14", "3-1/14/text#50"], ["3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/50/text#14", "3-1/14/text#50", "3-1/18/text#37"], ["3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/50/text#14", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28"], ["3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/50/text#14", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-
