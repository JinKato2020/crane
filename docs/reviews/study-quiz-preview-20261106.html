3/rows:2:0#6"], ["3-7/43/rows:0:0#0", "3-7/25/text#87", "3-7/37/text#28", "3-7/37/text#64", "3-7/55/rows:0:0#0", "3-7/38/text#22", "3-7/26/text#95", "3-7/43/rows:1:0#0", "3-7/43/rows:2:0#6", "3-7/50/text#34"]], "num": [[]]}}, {"id": "4-0", "title": "はじめに ― 質量と、地球が引く力を知る", "blocks": [{"type": "p", "style": "lead", "text": "力学は、**荷を支える・動かす・止める**しくみを考える科目です。最初に「質量に重力が働くと、下向きの力になる」をつかみましょう。", "id": "4-0-923d08d8ed6c"}, {"type": "sub", "text": "荷は、いつも地球に下向きに引かれている", "id": "4-0-59e75c5fdb38"}, {"type": "p", "text": "床に置いた箱にも、つり下げた荷にも、地球が下向きに引く **重力** が働いています。普段は意識しませんが、クレーンはこの力に逆らって荷を持ち上げています。", "id": "4-0-a163dd8d92d6"}, {"type": "p", "text": "**質量m** は物質の量で、単位はkg・tです。その物に働く **重力の大きさF（重量）** は、質量に **重力加速度g** を掛けると求められます。", "id": "4-0-000e0da79662", "quizTerms": ["重力加速度"]}, {"type": "p", "text": "**重力の大きさ F〔N〕＝質量 m〔kg〕×重力加速度 g〔m/s²〕**", "emphasis": true, "id": "4-0-bfc0ae439a03"}, {"type": "p", "text": "地球上では **g≒9.8m/s²**。質量100kgの荷なら、100×9.8＝**980N** の力で下へ引かれています。kgで与えられた荷を、力のNに直すときに使う計算です。", "id": "4-0-4b3c68ff349a", "quizTerms": ["9.8m/s²"]}, {"type": "p", "text": "gは、自由に落ちる物の速度がどれだけ増えるかを表します。空気の抵抗を無視すると、地球上では下向きの速度が1秒ごとに約**9.8m/s**ずつ増えます。床の上で動かない箱も、床が上向きに支えているため止まっているので、重力は働いています。", "id": "4-0-b50defe9d421"}, {"type": "img", "asset": "4-0_earth_moon_schematic", "caption": "同じ100kgの荷を地表面と月面に置いた模式図。重量は地表面で980N、月面で約162N。", "id": "4-0-4d3cc26e0e3e", "style": "figure", "_previewFile": "4-0_earth_moon_schematic.png", "_width": 1881, "_height": 836}, {"type": "p", "text": "月面のgは約1.62m/s²なので、同じ100kgの荷の重量は約162N。**質量は同じでも、重力加速度が違うと重量が変わる** と分かります。", "id": "4-0-6fa267aea219"}, {"type": "sub", "text": "単位をそろえる：kg・tから、N・kNへ", "id": "4-0-3e6951244dfc"}, {"id": "4-0-fa042576bca1", "type": "table", "headers": ["表すもの", "単位と換算"], "rows": [["**質量**：物そのものの量", "kg・t／**1t＝1,000kg**"], ["**力・重量**：押す、引く力", "N・kN／**1kN＝1,000N**"], ["地球上で質量を重量にする", "kg×9.8 → **N**／t×9.8 → **kN**"]], "quizTerms": ["質量", "重量"]}, {"type": "p", "text": "**荷重** は物や部材に加わる外力の総称です。重量のほかに、ロープの張力や風の力なども含みます。", "id": "4-0-7b3f71b089e5"}, {"type": "sub", "text": "この章の学び方", "id": "4-0-33ad0b867922"}, {"type": "p", "text": "力学は、力を受けた物がどう動き、どう支えられるかを考える分野です。この章では、**図で状況をつかむ → 単位をそろえる → 式で求める** の順に学びます。", "id": "4-0-7b065cd16c69"}, {"type": "sub", "text": "計算は、この順に進める", "id": "4-0-16814cbd9517"}, {"type": "ul", "items": ["図で、力の向き・長さ・**支点**を確かめる。", "分かっている数と、求めるものを書き出す。", "単位をそろえて式に入れ、最後に答えの単位を確かめる。"], "id": "4-0-cb404c9ecaa7"}, {"type": "p", "text": "クレーン限定の学科試験では、この科目「クレーンの運転のために必要な力学に関する知識」は **10問・20点（1問2点）** です。合格するには、各科目で配点の40％以上（この科目なら8点＝4問）を取り、さらに全科目の合計で60％以上を取る必要があります。", "id": "4-0-b1155bea8001"}, {"type": "p", "text": "4問だけを狙うと、一つの計算ミスで基準を割ってしまいます。計算の型を広くおさえて、**安定**して6問前後取れる状態を目指しましょう。", "id": "4-0-b9598bd1e41d"}, {"type": "p", "text": "図では矢印の向き・長さ・作用する場所を見ます。計算では**「質量」と「力」の単位を区別**すると、公式を選びやすくなります。", "id": "4-0-d6579e119b04", "style": "tip"}, {"id": "4-0-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-0-rev26-weight-q", "type": "p", "text": "**確認：** 地球上で質量1tの荷に働く重力は何kN？ 月へ運ぶと質量も変わる？", "style": "question"}, {"id": "4-0-rev26-weight-a", "type": "p", "text": "**9.8kN。質量は月でも1tのまま。** 変わるのは重力加速度と、それによって生じる重量です。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-0/2/text", "raw": "床に置いた箱にも、つり下げた荷にも、地球が下向きに引く **重力** が働いています。普段は意識しませんが、クレーンはこの力に逆らって荷を持ち上げています。", "text": "床に置いた箱にも、つり下げた荷にも、地球が下向きに引く 重力 が働いています。普段は意識しませんが、クレーンはこの力に逆らって荷を持ち上げています。", "terms": [], "block": "4-0-a163dd8d92d6"}, {"id": "4-0/3/text", "raw": "**質量m** は物質の量で、単位はkg・tです。その物に働く **重力の大きさF（重量）** は、質量に **重力加速度g** を掛けると求められます。", "text": "質量m は物質の量で、単位はkg・tです。その物に働く 重力の大きさF（重量） は、質量に 重力加速度g を掛けると求められます。", "terms": ["重力加速度"], "block": "4-0-000e0da79662"}, {"id": "4-0/4/text", "raw": "**重力の大きさ F〔N〕＝質量 m〔kg〕×重力加速度 g〔m/s²〕**", "text": "重力の大きさ F〔N〕＝質量 m〔kg〕×重力加速度 g〔m/s²〕", "terms": [], "block": "4-0-bfc0ae439a03"}, {"id": "4-0/5/text", "raw": "地球上では **g≒9.8m/s²**。質量100kgの荷なら、100×9.8＝**980N** の力で下へ引かれています。kgで与えられた荷を、力のNに直すときに使う計算です。", "text": "地球上では g≒9.8m/s²。質量100kgの荷なら、100×9.8＝980N の力で下へ引かれています。kgで与えられた荷を、力のNに直すときに使う計算です。", "terms": ["9.8m/s²"], "block": "4-0-4b3c68ff349a"}, {"id": "4-0/6/text", "raw": "gは、自由に落ちる物の速度がどれだけ増えるかを表します。空気の抵抗を無視すると、地球上では下向きの速度が1秒ごとに約**9.8m/s**ずつ増えます。床の上で動かない箱も、床が上向きに支えているため止まっているので、重力は働いています。", "text": "gは、自由に落ちる物の速度がどれだけ増えるかを表します。空気の抵抗を無視すると、地球上では下向きの速度が1秒ごとに約9.8m/sずつ増えます。床の上で動かない箱も、床が上向きに支えているため止まっているので、重力は働いています。", "terms": [], "block": "4-0-b50defe9d421"}, {"id": "4-0/8/text", "raw": "月面のgは約1.62m/s²なので、同じ100kgの荷の重量は約162N。**質量は同じでも、重力加速度が違うと重量が変わる** と分かります。", "text": "月面のgは約1.62m/s²なので、同じ100kgの荷の重量は約162N。質量は同じでも、重力加速度が違うと重量が変わる と分かります。", "terms": [], "block": "4-0-6fa267aea219"}, {"id": "4-0/10/rows:0:0", "raw": "**質量**：物そのものの量", "text": "質量：物そのものの量", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/10/rows:0:1", "raw": "kg・t／**1t＝1,000kg**", "text": "kg・t／1t＝1,000kg", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/10/rows:1:0", "raw": "**力・重量**：押す、引く力", "text": "力・重量：押す、引く力", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/10/rows:1:1", "raw": "N・kN／**1kN＝1,000N**", "text": "N・kN／1kN＝1,000N", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/10/rows:2:0", "raw": "地球上で質量を重量にする", "text": "地球上で質量を重量にする", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/10/rows:2:1", "raw": "kg×9.8 → **N**／t×9.8 → **kN**", "text": "kg×9.8 → N／t×9.8 → kN", "terms": ["質量", "重量"], "block": "4-0-fa042576bca1"}, {"id": "4-0/11/text", "raw": "**荷重** は物や部材に加わる外力の総称です。重量のほかに、ロープの張力や風の力なども含みます。", "text": "荷重 は物や部材に加わる外力の総称です。重量のほかに、ロープの張力や風の力なども含みます。", "terms": [], "block": "4-0-7b3f71b089e5"}, {"id": "4-0/13/text", "raw": "力学は、力を受けた物がどう動き、どう支えられるかを考える分野です。この章では、**図で状況をつかむ → 単位をそろえる → 式で求める** の順に学びます。", "text": "力学は、力を受けた物がどう動き、どう支えられるかを考える分野です。この章では、図で状況をつかむ → 単位をそろえる → 式で求める の順に学びます。", "terms": [], "block": "4-0-7b065cd16c69"}, {"id": "4-0/15/items:0", "raw": "図で、力の向き・長さ・**支点**を確かめる。", "text": "図で、力の向き・長さ・支点を確かめる。", "terms": [], "block": "4-0-cb404c9ecaa7"}, {"id": "4-0/15/items:1", "raw": "分かっている数と、求めるものを書き出す。", "text": "分かっている数と、求めるものを書き出す。", "terms": [], "block": "4-0-cb404c9ecaa7"}, {"id": "4-0/15/items:2", "raw": "単位をそろえて式に入れ、最後に答えの単位を確かめる。", "text": "単位をそろえて式に入れ、最後に答えの単位を確かめる。", "terms": [], "block": "4-0-cb404c9ecaa7"}, {"id": "4-0/16/text", "raw": "クレーン限定の学科試験では、この科目「クレーンの運転のために必要な力学に関する知識」は **10問・20点（1問2点）** です。合格するには、各科目で配点の40％以上（この科目なら8点＝4問）を取り、さらに全科目の合計で60％以上を取る必要があります。", "text": "クレーン限定の学科試験では、この科目「クレーンの運転のために必要な力学に関する知識」は 10問・20点（1問2点） です。合格するには、各科目で配点の40％以上（この科目なら8点＝4問）を取り、さらに全科目の合計で60％以上を取る必要があります。", "terms": [], "block": "4-0-b1155bea8001"}, {"id": "4-0/17/text", "raw": "4問だけを狙うと、一つの計算ミスで基準を割ってしまいます。計算の型を広くおさえて、**安定**して6問前後取れる状態を目指しましょう。", "text": "4問だけを狙うと、一つの計算ミスで基準を割ってしまいます。計算の型を広くおさえて、安定して6問前後取れる状態を目指しましょう。", "terms": [], "block": "4-0-b9598bd1e41d"}, {"id": "4-0/18/text", "raw": "図では矢印の向き・長さ・作用する場所を見ます。計算では**「質量」と「力」の単位を区別**すると、公式を選びやすくなります。", "text": "図では矢印の向き・長さ・作用する場所を見ます。計算では「質量」と「力」の単位を区別すると、公式を選びやすくなります。", "terms": [], "block": "4-0-d6579e119b04"}], "candidates": [{"id": "4-0/3/text#46", "fieldID": "4-0/3/text", "block": "4-0-000e0da79662", "answer": "重力加速度", "category": "key", "prompt": "［用語？］", "start": 46, "end": 51, "context": "質量m は物質の量で、単位はkg・tです。その物に働く 重力の大きさF（重量） は、質量に 重力加速度g を掛けると求められます。", "start16": 46, "end16": 51}, {"id": "4-0/5/text#8", "fieldID": "4-0/5/text", "block": "4-0-4b3c68ff349a", "answer": "9.8m/s²", "category": "num", "prompt": "［数値？］", "start": 8, "end": 15, "context": "地球上では g≒9.8m/s²。質量100kgの荷なら、100×9.8＝980N の力で下へ引かれています。kgで与えられた荷を、力のNに直すときに使う計算です。", "start16": 8, "end16": 15}, {"id": "4-0/10/rows:0:0#0", "fieldID": "4-0/10/rows:0:0", "block": "4-0-fa042576bca1", "answer": "質量", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "質量：物そのものの量", "start16": 0, "end16": 2}, {"id": "4-0/10/rows:1:0#2", "fieldID": "4-0/10/rows:1:0", "block": "4-0-fa042576bca1", "answer": "重量", "category": "key", "prompt": "［用語？］", "start": 2, "end": 4, "context": "力・重量：押す、引く力", "start16": 2, "end16": 4}], "rounds": {"all": [["4-0/3/text#46", "4-0/5/text#8", "4-0/10/rows:1:0#2", "4-0/10/rows:0:0#0"], ["4-0/5/text#8", "4-0/10/rows:1:0#2", "4-0/10/rows:0:0#0", "4-0/3/text#46"], ["4-0/10/rows:1:0#2", "4-0/10/rows:0:0#0", "4-0/3/text#46", "4-0/5/text#8"], ["4-0/10/rows:0:0#0", "4-0/3/text#46", "4-0/5/text#8", "4-0/10/rows:1:0#2"]], "key": [["4-0/3/text#46", "4-0/10/rows:1:0#2", "4-0/10/rows:0:0#0"], ["4-0/10/rows:1:0#2", "4-0/10/rows:0:0#0", "4-0/3/text#46"], ["4-0/10/rows:0:0#0", "4-0/3/text#46", "4-0/10/rows:1:0#2"]], "num": [["4-0/5/text#8"]]}}, {"id": "4-1", "title": "力・モーメント・力の合成", "blocks": [{"type": "p", "text": "力は**矢印**で考えます。向きと大きさを合わせるのが合成、分けるのが分解。物を回す働きは、力だけでなく**支点からの距離**にも注目します。", "style": "lead", "id": "4-1-4474a3bf4edf"}, {"type": "sub", "text": "1．力の三要素：大きさ・向き・作用点", "id": "4-1-a0897f14853a"}, {"type": "img", "asset": "4-1_force_elements_door", "caption": "同じドアを押す場面で、力の大きさ・向き・作用点を比べる。矢印は力のかけ方を示す模式表現。", "id": "4-1-151cd5a51990", "style": "figure", "_previewFile": "4-1_force_elements_door.png", "_width": 1838, "_height": 856}, {"id": "4-1-f6000e508ed6", "type": "table", "headers": ["力の3要素", "ドアを押す例"], "rows": [["**大きさ**", "どれだけ強く押すか → 矢印の長さ"], ["**向き**", "どちらへ押すか → 矢印の向き"], ["**作用点**", "どこを押すか → 矢印の始点"]], "quizTerms": ["作用点"]}, {"type": "p", "text": "図で力を表すときは、矢印の **長さで大きさ、矢先で向き、根元で作用点** を示します。矢印を延長した直線が **作用線** です。", "id": "4-1-b8ffa7a8c303", "quizTerms": ["作用線"]}, {"type": "p", "text": "形が変わらない剛体として全体の運動を考えるとき、作用線の上で力の**作用点**を移しても、力の働きは変わりません。", "id": "4-1-1f90393f2bf6"}, {"type": "sub", "text": "2．合力と分力：まとめる・分ける", "id": "4-1-96248b905ae8"}, {"type": "img", "asset": "4-1_force_vector_clear", "caption": "青の横4N・縦3Nを合わせると赤の5N。同じ縮尺で描いている。", "id": "4-1-1b22358b5b8d", "style": "figure", "_previewFile": "4-1_force_vector_clear.png", "_width": 1500, "_height": 980}, {"type": "p", "text": "2つ以上の力を1つにまとめることが **力の合成**、まとめた力が **合力** です。図では横4Nと縦3Nが、斜め5Nの力と同じ働きをします。", "id": "4-1-290d23c3893c", "quizTerms": ["合力"]}, {"type": "p", "text": "反対に、斜めの力を縦・横などに分けることが **力の分解**、分けた力が **分力** です。図の赤5Nは、横4Nと縦3Nに分けて考えられます。4-6のロープの張力も、この方法で読み解きます。", "id": "4-1-a73bfa8e4eae", "quizTerms": ["分力"]}, {"type": "p", "text": "向きの異なる2つの力は、同じ作用点から矢印を描きます。その2辺で **平行四辺形** を作ると、作用点から向かいの頂点へ引いた対角線が合力です。図は、2つの力が直角の場合です。", "id": "4-1-cd97abd475d8", "quizTerms": ["平行四辺形"]}, {"type": "p", "text": "一直線上の力なら、**同じ向きは足し算、反対向きは大きい力から小さい力を引く** と求められます。向きは大きい力と同じです。大きさが等しく反対向きなら合力は0になります。", "id": "4-1-eeff963adb77"}, {"type": "svg", "file": "4-1_supplement_f49_20261023.svg", "caption": "同じ縮尺の矢印で比較。同方向は3＋2＝5 N、反対方向は5−2＝3 N。", "id": "4-1-30da4f99f376", "style": "figure", "_previewFile": "4-1_supplement_f49_20261023.svg"}, {"type": "p", "text": "3つ以上の力も、2つずつ合成していけば求められます。1点に働く力がつり合っているとき、**合力**は0です。", "id": "4-1-62482611e1fe"}, {"type": "svg", "file": "4-1_supplement_f48_20261023.svg", "caption": "1点に働く3つの力の合成例。矢印を平行移動して順につなぎ、最初から最後へ結ぶ。", "id": "4-1-f6128bf6d5f4", "style": "figure", "_previewFile": "4-1_supplement_f48_20261023.svg"}, {"type": "sub", "text": "3．作用・反作用：どの物に働く力かを見る", "id": "4-1-86a764ffff8f"}, {"type": "img", "asset": "4-1_action_concept21", "caption": "作用・反作用は別々の物体に働く一対の力。つり合いは、同じ物体に働く力を合わせて考える。", "id": "4-1-38f2831fbfe9", "style": "figure", "_previewFile": "4-1_action_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "AがBを押すと、BもAを同じ大きさの反対向きの力で押します。これが **作用・反作用** です。片方はBに、もう片方はAに働きます。", "id": "4-1-d7f245981458", "quizTerms": ["作用・反作用"]}, {"type": "p", "text": "一方、荷に働く「ロープが上へ引く力」と「下向きの重力」は、どちらも同じ荷に働きます。静止している荷では、この2つが **つり合い** ます。", "id": "4-1-8485b96c72fc"}, {"type": "sub", "text": "4．モーメント：物を回そうとする働き", "id": "4-1-c4a7d4b0308e"}, {"type": "img", "asset": "4-1_spanner_schematic", "caption": "短いスパナと長いスパナを直角に押す模式図。50×0.2＝25×0.4＝10N・m。", "id": "4-1-a431da47b177", "style": "figure", "_previewFile": "4-1_spanner_schematic.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**力のモーメント** は、物を回そうとする働きです。図では、短いスパナは50N、長いスパナは25Nで、同じ回す働きが得られます。**支点から押す位置までの距離が2倍なら、力は半分ですむ** という関係です。", "id": "4-1-f84115b32ccf", "quizTerms": ["力のモーメント"]}, {"type": "p", "text": "**モーメント〔N・m〕＝力〔N〕×腕の長さ〔m〕**", "emphasis": true, "id": "4-1-69f0986d9ee7", "quizTerms": ["力〔N〕×腕の長さ〔m〕"]}, {"type": "p", "text": "腕の長さは、支点から **力の作用線までの垂直距離** です。図では横の棒に下向きの力をかけているため、支点から押す位置までの水平距離を使えます。", "id": "4-1-15115f8f8723"}, {"type": "ul", "items": ["**例題1**：10Nの力を、腕の長さ0.3mで加えると、モーメント = 10 × 0.3 = **3N・m**。"], "id": "4-1-b3ec7fd699cf"}, {"type": "p", "text": "ジブクレーンも、同じ荷を遠くにつるほど、転倒させようとするモーメントが大きくなります。**作業半径が大きいほど、つれる質量は小さくなる** と結びつけます。", "id": "4-1-38dcff5af097"}, {"type": "img", "asset": "4-1_supplement_f50_20261023", "labels": [], "legend": [], "caption": "同じ1 kNでも、作業半径2 mでは2 kN・m、4 mでは4 kN・m。荷だけによるモーメントの比較例。", "id": "4-1-8b1e0f2da67c", "style": "figure", "_previewFile": "4-1_supplement_f50_20261023.png", "_width": 1774, "_height": 887}, {"type": "ul", "items": ["**例題2**：質量300kgの荷を、支点Oから2m（A点）と5m（B点）につるときの、支点まわりのモーメントは？ 距離2m・5mは、支点Oから荷の重力の作用線までの水平距離とします。"], "id": "4-1-4f779aae2899"}, {"type": "p", "text": "→ まず荷の**重量**を求めます。W＝300×9.8＝2940N。", "id": "4-1-237f0d5bec88"}, {"type": "p", "text": "→ A点：M₁＝2940×2＝5880N・m＝**5.88kN・m**。", "id": "4-1-591d1d4689c6"}, {"type": "p", "text": "→ B点：M₂＝2940×5＝14700N・m＝**14.7kN・m**。", "id": "4-1-503b3d9d51c6"}, {"type": "sub", "text": "5．つり合い：力も、回す働きもそろえる", "id": "4-1-84ac14a240d7"}, {"type": "p", "text": "物が静止しているときは、**左右の力が等しい、上下の力が等しい、左回りと右回りのモーメントが等しい** の3条件を満たしています。", "id": "4-1-61d9a1ae1dcb"}, {"type": "p", "text": "水平な天秤では、左右の「重さ×支点からの距離」を等しくします。棒などの自重を無視し、両側に同じ9.8が掛かる場合は、**質量**のままで比べられます。", "id": "4-1-9e706e41a1ae"}, {"type": "p", "text": "**水平天秤：左の質量×左の距離＝右の質量×右の距離**", "emphasis": true, "id": "4-1-2de858f36bc2"}, {"type": "ul", "items": ["**例題3（天秤）**：棒とつり具の自重を無視します。支点から左へ2mに質量mの荷、右へ2.5mに質量50kgの荷を下げて水平につり合うとき、質量mと、天秤を支える力Fは？"], "id": "4-1-a7ea4c150fa7"}, {"type": "img", "asset": "4-1_balance_example3", "caption": "左2m・右2.5mを同じ縮尺で描いた天秤。棒とつり具の重さは無視する。", "id": "4-1-8b76e42215ae", "style": "figure", "_previewFile": "4-1_balance_example3.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "→ m×9.8×2＝50×9.8×2.5。両辺の9.8を消すと、m＝50×2.5÷2＝**62.5kg**。", "id": "4-1-7f75b6d848bf"}, {"type": "p", "text": "→ 支える力は、下向きの重さの合計：F = (62.5 + 50) × 9.8 = 112.5 × 9.8 = **1102.5N**", "id": "4-1-84737a155fd3"}, {"type": "sub", "id": "lesson-couple", "text": "合力が0でも、回す働きは残る――偶力"}, {"type": "p", "text": "**大きさが等しく、反対向きで、作用線が離れた二力を偶力といいます。** ハンドルの左右を逆向きに押して回す場面を思い浮かべます。", "id": "4-1-14d26ac7560f", "quizTerms": ["偶力"]}, {"type": "p", "text": "足し合わせた力は0でも、回す働きは残ります。だから静止する剛体には、**合力が0、合モーメントも0** の両方が必要です。二力が同じ作用線上なら、回す働きも打ち消し合います。", "id": "4-1-0f1cb9932433"}, {"id": "4-1-rev26-couple", "type": "svg", "file": "4-1_couple_20261106.svg", "caption": "ハンドルの両側へ、同じ大きさで逆向きの平行な力を加える。2つの力は、どちらも同じ向きに回そうとする。", "style": "figure", "_previewFile": "4-1_couple_20261106.svg"}, {"type": "sub", "text": "6．梁を両端で支える：モーメントから求める", "id": "4-1-e2fa8ed9f9bb"}, {"type": "ul", "items": ["**例題4（両端支持の梁＝天井クレーン）**：スパン10mのガーダに、質量10tの荷をかける。荷の中心が左支点Aから7m、右支点Bから3mのとき、A・Bが支える力は？ ガーダ・トロリ・つり具の自重は無視し、荷による力だけを求めます。"], "id": "4-1-8afc6272d87b"}, {"type": "img", "asset": "4-1_beam_moments_example4", "caption": "R_A・R_Bは各支点が梁を上へ支える力。梁・トロリ・つり具の自重を無視する。", "id": "4-1-07698e8464bd", "style": "figure", "_previewFile": "4-1_beam_moments_example4.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "荷の重量は10×9.8＝**98kN**。A・Bが支える力を、それぞれR_A・R_Bとします。支点を1つずつ選ぶと、未知の力を1つずつ求められます。", "id": "4-1-2b6b1ac70682"}, {"type": "sub", "text": "① Aのまわり：Bの支える力を求める", "id": "4-1-2fe9d5414bd7"}, {"type": "p", "text": "Aを回転の中心とすると、荷の98kNは右回り、Bの支える力R_Bは左回りに働きます。腕の長さは、荷まで7m、Bまで10mです。A自身が支える力は、Aからの距離が0なので、Aまわりの**モーメント**も0になります。", "id": "4-1-c1a4c6c8a2c7"}, {"type": "p", "text": "**R_B × 10 ＝ 98 × 7**", "emphasis": true, "id": "4-1-44f5599d3e14"}, {"type": "p", "text": "→ R_B＝98×7÷10＝**68.6kN**。", "id": "4-1-9deddae07074"}, {"type": "sub", "text": "② Bのまわり：Aの支える力を求める", "id": "4-1-4e338f427281"}, {"type": "p", "text": "Bを回転の中心とすると、荷の98kNは左回り、Aの支える力R_Aは右回りに働きます。腕の長さは、荷まで3m、Aまで10mです。", "id": "4-1-d7baf21cf7fa"}, {"type": "p", "text": "**R_A × 10 ＝ 98 × 3**", "emphasis": true, "id": "4-1-12402b1a8c7f"}, {"type": "p", "text": "→ R_A＝98×3÷10＝**29.4kN**。", "id": "4-1-d71f1c352a53"}, {"type": "p", "text": "上下の力でも確かめると、29.4＋68.6＝**98kN**。2つの支点が支える力の合計が、荷の重量と一致します。", "id": "4-1-efa6ec4ce803"}, {"type": "sub", "text": "③ 結果から分かること：近い支点ほど大きく支える", "id": "4-1-6a6ff9258b14"}, {"type": "p", "text": "今度は荷の位置を回転の中心にすると、荷の力の腕は0です。A・Bの支える力のモーメントがつり合うので、**R_A×7＝R_B×3** になります。", "id": "4-1-2054a7b49f31"}, {"type": "p", "text": "**荷から支点までの距離 A：B＝7：3 → 支える力 R_A：R_B＝3：7**", "emphasis": true, "id": "4-1-5bca2d0be9b4"}, {"type": "p", "text": "距離と力を掛けた値が等しいので、**腕が短い側ほど、支える力が大きい** と分かります。この関係が反比例です。荷まで3mと近いBは68.6kN、7mと遠いAは29.4kNを支えます。", "id": "4-1-5670a5c903f8"}, {"type": "p", "text": "この関係は、梁などの自重を無視し、2つの**支点**の間に1つの荷を置いた場合のものです。", "id": "4-1-056eead70a91"}, {"type": "sub", "id": "lesson-beam-bending", "text": "荷の位置と、梁の曲がりやすさ"}, {"type": "p", "text": "両端で支えたはりに1つの集中荷重Pがかかる場合、**荷の真下で曲げモーメントが最大**になります。左支点から荷までをa、荷から右支点までをbとします。", "id": "4-1-dc17fefd1529"}, {"type": "p", "text": "**最大曲げモーメント＝P×a×b÷（a＋b）。** 同じ荷・同じ支点間距離なら、荷が中央にあるときに最大になります。", "id": "4-1-0f0ceef2daea"}, {"type": "p", "text": "全長8m・荷重40kNなら、端から2mでは40×2×6÷8＝**60kN・m**。中央では40×4×4÷8＝**80kN・m** です。", "id": "4-1-f415f6a0e86a"}, {"type": "p", "text": "**同じ梁・同じ荷重なら、中央に荷をかけると最大のたわみも最も大きくなります。** 物差しの両端を支え、中央を押す場面を思い浮かべましょう。支持方法や荷重の条件が違う場合にまで広げないことが大切です。", "id": "4-1-fdd63fe6f2f5"}, {"type": "sub", "text": "練習：荷が3つある天秤・半径の違う滑車", "id": "4-1-2bf3ec27fbbf"}, {"id": "4-1-d49cae5f5a36", "type": "p", "text": "**例題5：** AからCまで70cmの棒を、Aから35cmの支点Oで支えます。Aには30kg、Cには10kg、Oから右へ20cmのBには質量pの荷。棒の質量を無視すると、つり合うpはいくら？"}, {"id": "4-1-ae2cf6e70f5f", "type": "svg", "file": "4-1_balance_example5_20261106.svg", "caption": "70cmは棒のA〜Cの全長。右端Cの腕は70−35＝35cm。支点Oから測り直す。", "style": "figure", "_previewFile": "4-1_balance_example5_20261106.svg"}, {"type": "p", "text": "**① 左回り：** 30×35＝1,050。どの荷にも同じ重力加速度がかかるので、つり合いの比較では省略できます。", "id": "4-1-c325dd97933b"}, {"type": "p", "text": "**② 右回り：** p×20＋10×（70−35）＝20p＋350。右端の腕は**35cm**です。", "id": "4-1-a49602fcd644"}, {"type": "p", "text": "**③ 左回り＝右回り：** 1,050＝20p＋350。p＝（1,050−350）÷20＝**35kg**。", "id": "4-1-e3ef30af1bd0"}, {"type": "ul", "items": ["**例題6（段付き滑車＝てこ）**：一体で回る半径ちがいの滑車があり、半径50cm側に質量4tの荷、半径80cm側に力Fをかけて支える。Fは？（これもモーメントのつり合いです） 2本のロープはそれぞれ円周に接する向きに力を加え、互いに逆向きのモーメントを生じるものとします。\n\n軸の摩擦は無視します。"], "id": "4-1-cb9949a4f2b1"}, {"type": "img", "asset": "4-1_stepped_pulley_example6", "caption": "一体で回る2つの滑車を正面から示す模式図。半径50cm側につり荷、80cm側に別のロープで力Fをかける。", "id": "4-1-bc89c8ea0bff", "style": "figure", "_previewFile": "4-1_stepped_pulley_example6.png", "_width": 1500, "_height": 1150}, {"type": "p", "text": "→ 荷の重量W＝4×9.8＝39.2kN。モーメントのつり合いより、39.2×0.50＝F×0.80。F＝39.2×0.50÷0.80＝**24.5kN**。", "id": "4-1-ef0c2e1d76ea"}, {"type": "sub", "id": "lesson-force-direction", "text": "tanとsin――力の矢印の向きを読む"}, {"type": "p", "text": "sin・cos・tanは、**直角三角形の辺どうしの長さの比**です。角度が同じなら、三角形を大きくしても比は変わりません。まず次の5・12・13の図で読みます。", "id": "4-1-77cdd412cca4"}, {"id": "4-1-rev26-trig-ratios", "type": "svg", "file": "4-1_trig_ratios_20261106.svg", "caption": "θは横の辺と斜辺の間の角。どこから測った角かを先に見る。", "style": "figure", "_previewFile": "4-1_trig_ratios_20261106.svg"}, {"id": "4-1-rev26-trig-table", "type": "table", "headers": ["角度θについて", "図の辺を使った比"], "rows": [["sinθ（サイン）", "向かい側の辺÷斜辺＝**5/13**"], ["cosθ（コサイン）", "隣の辺÷斜辺＝**12/13**"], ["tanθ（タンジェント）", "向かい側の辺÷隣の辺＝**5/12**"]]}, {"type": "p", "text": "図を拡大しても、例えば10・24・26ならtanθ＝10÷24＝5/12。**角度が同じなら辺の比も同じ**です。", "id": "4-1-01a9550f070d"}, {"type": "p", "text": "玉掛けでは、**鉛直線から測る角β**を使うことがあります。この場合、鉛直の辺が角に隣り合うので、**上向きの分力＝張力×cosβ**。横向きの分力は張力×sinβです。", "id": "4-1-b7996f7b782b"}, {"type": "p", "text": "鉛直から60°で張力39.2kN、cos60°＝0.5、sin60°＝0.866なら、鉛直成分19.6kN、水平成分約**33.95kN**。左右対称の二本づりでは、水平成分は反対向きで打ち消し合います。", "id": "4-1-db87178d757a"}, {"type": "sub", "id": "lesson-force-oblique", "text": "直角でない二つの力を合成する"}, {"type": "p", "text": "二つの力P・Qが同じ点に働き、その間の角をθとします。**合力R²＝P²＋Q²＋2PQcosθ**。直角ならcos90°＝0なので、三平方の式に戻ります。", "id": "4-1-002f4f980d4b"}, {"type": "p", "text": "P＝Q＝10kN、θ＝120°、cos120°＝−0.5なら、R²＝100＋100−100＝100。合力は **10kN** です。等しい二力の合力は、二つの力の間の角を二等分する向きになります。", "id": "4-1-a08777693574"}, {"type": "p", "text": "ここでは**2つの力の大きさを一定**にして、間の角度だけを変えています。開きが大きいほど、合力は小さくなります。玉掛けで「同じ荷を支える」ときは逆に、上向きの合力を一定に保つため、各ロープの張力を増やす必要があります。", "id": "4-1-e4b84316456c", "style": "tip"}, {"id": "4-1-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-1-rev26-moment-q", "type": "p", "text": "**確認：** ボルトを回す力のモーメントを同じにして、力の向きも変えず、スパナの腕を2倍にすると、必要な力は？", "style": "question"}, {"id": "4-1-rev26-moment-a", "type": "p", "text": "**1/2。** モーメント＝力×腕の長さ。同じ回す働きを、半分の力で得られます。", "style": "answer"}, {"id": "4-1-rev26-reaction-q", "type": "p", "text": "**確認：** 10mのはりに、左支点から7m・右支点から3mの位置で98kNの荷。左右の支点反力は？", "style": "question"}, {"id": "4-1-rev26-reaction-a", "type": "p", "text": "**左29.4kN、右68.6kN。** 左支点回りで右反力×10＝98×7。右支点回りで左反力×10＝98×3。荷に近い右支点の負担が大きく、合計は98kNです。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-1/3/rows:0:0", "raw": "**大きさ**", "text": "大きさ", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/3/rows:0:1", "raw": "どれだけ強く押すか → 矢印の長さ", "text": "どれだけ強く押すか → 矢印の長さ", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/3/rows:1:0", "raw": "**向き**", "text": "向き", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/3/rows:1:1", "raw": "どちらへ押すか → 矢印の向き", "text": "どちらへ押すか → 矢印の向き", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/3/rows:2:0", "raw": "**作用点**", "text": "作用点", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/3/rows:2:1", "raw": "どこを押すか → 矢印の始点", "text": "どこを押すか → 矢印の始点", "terms": ["作用点"], "block": "4-1-f6000e508ed6"}, {"id": "4-1/4/text", "raw": "図で力を表すときは、矢印の **長さで大きさ、矢先で向き、根元で作用点** を示します。矢印を延長した直線が **作用線** です。", "text": "図で力を表すときは、矢印の 長さで大きさ、矢先で向き、根元で作用点 を示します。矢印を延長した直線が 作用線 です。", "terms": ["作用線"], "block": "4-1-b8ffa7a8c303"}, {"id": "4-1/5/text", "raw": "形が変わらない剛体として全体の運動を考えるとき、作用線の上で力の**作用点**を移しても、力の働きは変わりません。", "text": "形が変わらない剛体として全体の運動を考えるとき、作用線の上で力の作用点を移しても、力の働きは変わりません。", "terms": [], "block": "4-1-1f90393f2bf6"}, {"id": "4-1/8/text", "raw": "2つ以上の力を1つにまとめることが **力の合成**、まとめた力が **合力** です。図では横4Nと縦3Nが、斜め5Nの力と同じ働きをします。", "text": "2つ以上の力を1つにまとめることが 力の合成、まとめた力が 合力 です。図では横4Nと縦3Nが、斜め5Nの力と同じ働きをします。", "terms": ["合力"], "block": "4-1-290d23c3893c"}, {"id": "4-1/9/text", "raw": "反対に、斜めの力を縦・横などに分けることが **力の分解**、分けた力が **分力** です。図の赤5Nは、横4Nと縦3Nに分けて考えられます。4-6のロープの張力も、この方法で読み解きます。", "text": "反対に、斜めの力を縦・横などに分けることが 力の分解、分けた力が 分力 です。図の赤5Nは、横4Nと縦3Nに分けて考えられます。4-6のロープの張力も、この方法で読み解きます。", "terms": ["分力"], "block": "4-1-a73bfa8e4eae"}, {"id": "4-1/10/text", "raw": "向きの異なる2つの力は、同じ作用点から矢印を描きます。その2辺で **平行四辺形** を作ると、作用点から向かいの頂点へ引いた対角線が合力です。図は、2つの力が直角の場合です。", "text": "向きの異なる2つの力は、同じ作用点から矢印を描きます。その2辺で 平行四辺形 を作ると、作用点から向かいの頂点へ引いた対角線が合力です。図は、2つの力が直角の場合です。", "terms": ["平行四辺形"], "block": "4-1-cd97abd475d8"}, {"id": "4-1/11/text", "raw": "一直線上の力なら、**同じ向きは足し算、反対向きは大きい力から小さい力を引く** と求められます。向きは大きい力と同じです。大きさが等しく反対向きなら合力は0になります。", "text": "一直線上の力なら、同じ向きは足し算、反対向きは大きい力から小さい力を引く と求められます。向きは大きい力と同じです。大きさが等しく反対向きなら合力は0になります。", "terms": [], "block": "4-1-eeff963adb77"}, {"id": "4-1/13/text", "raw": "3つ以上の力も、2つずつ合成していけば求められます。1点に働く力がつり合っているとき、**合力**は0です。", "text": "3つ以上の力も、2つずつ合成していけば求められます。1点に働く力がつり合っているとき、合力は0です。", "terms": [], "block": "4-1-62482611e1fe"}, {"id": "4-1/17/text", "raw": "AがBを押すと、BもAを同じ大きさの反対向きの力で押します。これが **作用・反作用** です。片方はBに、もう片方はAに働きます。", "text": "AがBを押すと、BもAを同じ大きさの反対向きの力で押します。これが 作用・反作用 です。片方はBに、もう片方はAに働きます。", "terms": ["作用・反作用"], "block": "4-1-d7f245981458"}, {"id": "4-1/18/text", "raw": "一方、荷に働く「ロープが上へ引く力」と「下向きの重力」は、どちらも同じ荷に働きます。静止している荷では、この2つが **つり合い** ます。", "text": "一方、荷に働く「ロープが上へ引く力」と「下向きの重力」は、どちらも同じ荷に働きます。静止している荷では、この2つが つり合い ます。", "terms": [], "block": "4-1-8485b96c72fc"}, {"id": "4-1/21/text", "raw": "**力のモーメント** は、物を回そうとする働きです。図では、短いスパナは50N、長いスパナは25Nで、同じ回す働きが得られます。**支点から押す位置までの距離が2倍なら、力は半分ですむ** という関係です。", "text": "力のモーメント は、物を回そうとする働きです。図では、短いスパナは50N、長いスパナは25Nで、同じ回す働きが得られます。支点から押す位置までの距離が2倍なら、力は半分ですむ という関係です。", "terms": ["力のモーメント"], "block": "4-1-f84115b32ccf"}, {"id": "4-1/22/text", "raw": "**モーメント〔N・m〕＝力〔N〕×腕の長さ〔m〕**", "text": "モーメント〔N・m〕＝力〔N〕×腕の長さ〔m〕", "terms": ["力〔N〕×腕の長さ〔m〕"], "block": "4-1-69f0986d9ee7"}, {"id": "4-1/23/text", "raw": "腕の長さは、支点から **力の作用線までの垂直距離** です。図では横の棒に下向きの力をかけているため、支点から押す位置までの水平距離を使えます。", "text": "腕の長さは、支点から 力の作用線までの垂直距離 です。図では横の棒に下向きの力をかけているため、支点から押す位置までの水平距離を使えます。", "terms": [], "block": "4-1-15115f8f8723"}, {"id": "4-1/24/items:0", "raw": "**例題1**：10Nの力を、腕の長さ0.3mで加えると、モーメント = 10 × 0.3 = **3N・m**。", "text": "例題1：10Nの力を、腕の長さ0.3mで加えると、モーメント = 10 × 0.3 = 3N・m。", "terms": [], "block": "4-1-b3ec7fd699cf"}, {"id": "4-1/25/text", "raw": "ジブクレーンも、同じ荷を遠くにつるほど、転倒させようとするモーメントが大きくなります。**作業半径が大きいほど、つれる質量は小さくなる** と結びつけます。", "text": "ジブクレーンも、同じ荷を遠くにつるほど、転倒させようとするモーメントが大きくなります。作業半径が大きいほど、つれる質量は小さくなる と結びつけます。", "terms": [], "block": "4-1-38dcff5af097"}, {"id": "4-1/27/items:0", "raw": "**例題2**：質量300kgの荷を、支点Oから2m（A点）と5m（B点）につるときの、支点まわりのモーメントは？ 距離2m・5mは、支点Oから荷の重力の作用線までの水平距離とします。", "text": "例題2：質量300kgの荷を、支点Oから2m（A点）と5m（B点）につるときの、支点まわりのモーメントは？ 距離2m・5mは、支点Oから荷の重力の作用線までの水平距離とします。", "terms": [], "block": "4-1-4f779aae2899"}, {"id": "4-1/28/text", "raw": "→ まず荷の**重量**を求めます。W＝300×9.8＝2940N。", "text": "→ まず荷の重量を求めます。W＝300×9.8＝2940N。", "terms": [], "block": "4-1-237f0d5bec88"}, {"id": "4-1/29/text", "raw": "→ A点：M₁＝2940×2＝5880N・m＝**5.88kN・m**。", "text": "→ A点：M₁＝2940×2＝5880N・m＝5.88kN・m。", "terms": [], "block": "4-1-591d1d4689c6"}, {"id": "4-1/30/text", "raw": "→ B点：M₂＝2940×5＝14700N・m＝**14.7kN・m**。", "text": "→ B点：M₂＝2940×5＝14700N・m＝14.7kN・m。", "terms": [], "block": "4-1-503b3d9d51c6"}, {"id": "4-1/32/text", "raw": "物が静止しているときは、**左右の力が等しい、上下の力が等しい、左回りと右回りのモーメントが等しい** の3条件を満たしています。", "text": "物が静止しているときは、左右の力が等しい、上下の力が等しい、左回りと右回りのモーメントが等しい の3条件を満たしています。", "terms": [], "block": "4-1-61d9a1ae1dcb"}, {"id": "4-1/33/text", "raw": "水平な天秤では、左右の「重さ×支点からの距離」を等しくします。棒などの自重を無視し、両側に同じ9.8が掛かる場合は、**質量**のままで比べられます。", "text": "水平な天秤では、左右の「重さ×支点からの距離」を等しくします。棒などの自重を無視し、両側に同じ9.8が掛かる場合は、質量のままで比べられます。", "terms": [], "block": "4-1-9e706e41a1ae"}, {"id": "4-1/34/text", "raw": "**水平天秤：左の質量×左の距離＝右の質量×右の距離**", "text": "水平天秤：左の質量×左の距離＝右の質量×右の距離", "terms": [], "block": "4-1-2de858f36bc2"}, {"id": "4-1/35/items:0", "raw": "**例題3（天秤）**：棒とつり具の自重を無視します。支点から左へ2mに質量mの荷、右へ2.5mに質量50kgの荷を下げて水平につり合うとき、質量mと、天秤を支える力Fは？", "text": "例題3（天秤）：棒とつり具の自重を無視します。支点から左へ2mに質量mの荷、右へ2.5mに質量50kgの荷を下げて水平につり合うとき、質量mと、天秤を支える力Fは？", "terms": [], "block": "4-1-a7ea4c150fa7"}, {"id": "4-1/37/text", "raw": "→ m×9.8×2＝50×9.8×2.5。両辺の9.8を消すと、m＝50×2.5÷2＝**62.5kg**。", "text": "→ m×9.8×2＝50×9.8×2.5。両辺の9.8を消すと、m＝50×2.5÷2＝62.5kg。", "terms": [], "block": "4-1-7f75b6d848bf"}, {"id": "4-1/38/text", "raw": "→ 支える力は、下向きの重さの合計：F = (62.5 + 50) × 9.8 = 112.5 × 9.8 = **1102.5N**", "text": "→ 支える力は、下向きの重さの合計：F = (62.5 + 50) × 9.8 = 112.5 × 9.8 = 1102.5N", "terms": [], "block": "4-1-84737a155fd3"}, {"id": "4-1/40/text", "raw": "**大きさが等しく、反対向きで、作用線が離れた二力を偶力といいます。** ハンドルの左右を逆向きに押して回す場面を思い浮かべます。", "text": "大きさが等しく、反対向きで、作用線が離れた二力を偶力といいます。 ハンドルの左右を逆向きに押して回す場面を思い浮かべます。", "terms": ["偶力"], "block": "4-1-14d26ac7560f"}, {"id": "4-1/41/text", "raw": "足し合わせた力は0でも、回す働きは残ります。だから静止する剛体には、**合力が0、合モーメントも0** の両方が必要です。二力が同じ作用線上なら、回す働きも打ち消し合います。", "text": "足し合わせた力は0でも、回す働きは残ります。だから静止する剛体には、合力が0、合モーメントも0 の両方が必要です。二力が同じ作用線上なら、回す働きも打ち消し合います。", "terms": [], "block": "4-1-0f1cb9932433"}, {"id": "4-1/44/items:0", "raw": "**例題4（両端支持の梁＝天井クレーン）**：スパン10mのガーダに、質量10tの荷をかける。荷の中心が左支点Aから7m、右支点Bから3mのとき、A・Bが支える力は？ ガーダ・トロリ・つり具の自重は無視し、荷による力だけを求めます。", "text": "例題4（両端支持の梁＝天井クレーン）：スパン10mのガーダに、質量10tの荷をかける。荷の中心が左支点Aから7m、右支点Bから3mのとき、A・Bが支える力は？ ガーダ・トロリ・つり具の自重は無視し、荷による力だけを求めます。", "terms": [], "block": "4-1-8afc6272d87b"}, {"id": "4-1/46/text", "raw": "荷の重量は10×9.8＝**98kN**。A・Bが支える力を、それぞれR_A・R_Bとします。支点を1つずつ選ぶと、未知の力を1つずつ求められます。", "text": "荷の重量は10×9.8＝98kN。A・Bが支える力を、それぞれR_A・R_Bとします。支点を1つずつ選ぶと、未知の力を1つずつ求められます。", "terms": [], "block": "4-1-2b6b1ac70682"}, {"id": "4-1/48/text", "raw": "Aを回転の中心とすると、荷の98kNは右回り、Bの支える力R_Bは左回りに働きます。腕の長さは、荷まで7m、Bまで10mです。A自身が支える力は、Aからの距離が0なので、Aまわりの**モーメント**も0になります。", "text": "Aを回転の中心とすると、荷の98kNは右回り、Bの支える力R_Bは左回りに働きます。腕の長さは、荷まで7m、Bまで10mです。A自身が支える力は、Aからの距離が0なので、Aまわりのモーメントも0になります。", "terms": [], "block": "4-1-c1a4c6c8a2c7"}, {"id": "4-1/49/text", "raw": "**R_B × 10 ＝ 98 × 7**", "text": "R_B × 10 ＝ 98 × 7", "terms": [], "block": "4-1-44f5599d3e14"}, {"id": "4-1/50/text", "raw": "→ R_B＝98×7÷10＝**68.6kN**。", "text": "→ R_B＝98×7÷10＝68.6kN。", "terms": [], "block": "4-1-9deddae07074"}, {"id": "4-1/52/text", "raw": "Bを回転の中心とすると、荷の98kNは左回り、Aの支える力R_Aは右回りに働きます。腕の長さは、荷まで3m、Aまで10mです。", "text": "Bを回転の中心とすると、荷の98kNは左回り、Aの支える力R_Aは右回りに働きます。腕の長さは、荷まで3m、Aまで10mです。", "terms": [], "block": "4-1-d7baf21cf7fa"}, {"id": "4-1/53/text", "raw": "**R_A × 10 ＝ 98 × 3**", "text": "R_A × 10 ＝ 98 × 3", "terms": [], "block": "4-1-12402b1a8c7f"}, {"id": "4-1/54/text", "raw": "→ R_A＝98×3÷10＝**29.4kN**。", "text": "→ R_A＝98×3÷10＝29.4kN。", "terms": [], "block": "4-1-d71f1c352a53"}, {"id": "4-1/55/text", "raw": "上下の力でも確かめると、29.4＋68.6＝**98kN**。2つの支点が支える力の合計が、荷の重量と一致します。", "text": "上下の力でも確かめると、29.4＋68.6＝98kN。2つの支点が支える力の合計が、荷の重量と一致します。", "terms": [], "block": "4-1-efa6ec4ce803"}, {"id": "4-1/57/text", "raw": "今度は荷の位置を回転の中心にすると、荷の力の腕は0です。A・Bの支える力のモーメントがつり合うので、**R_A×7＝R_B×3** になります。", "text": "今度は荷の位置を回転の中心にすると、荷の力の腕は0です。A・Bの支える力のモーメントがつり合うので、R_A×7＝R_B×3 になります。", "terms": [], "block": "4-1-2054a7b49f31"}, {"id": "4-1/58/text", "raw": "**荷から支点までの距離 A：B＝7：3 → 支える力 R_A：R_B＝3：7**", "text": "荷から支点までの距離 A：B＝7：3 → 支える力 R_A：R_B＝3：7", "terms": [], "block": "4-1-5bca2d0be9b4"}, {"id": "4-1/59/text", "raw": "距離と力を掛けた値が等しいので、**腕が短い側ほど、支える力が大きい** と分かります。この関係が反比例です。荷まで3mと近いBは68.6kN、7mと遠いAは29.4kNを支えます。", "text": "距離と力を掛けた値が等しいので、腕が短い側ほど、支える力が大きい と分かります。この関係が反比例です。荷まで3mと近いBは68.6kN、7mと遠いAは29.4kNを支えます。", "terms": [], "block": "4-1-5670a5c903f8"}, {"id": "4-1/60/text", "raw": "この関係は、梁などの自重を無視し、2つの**支点**の間に1つの荷を置いた場合のものです。", "text": "この関係は、梁などの自重を無視し、2つの支点の間に1つの荷を置いた場合のものです。", "terms": [], "block": "4-1-056eead70a91"}, {"id": "4-1/62/text", "raw": "両端で支えたはりに1つの集中荷重Pがかかる場合、**荷の真下で曲げモーメントが最大**になります。左支点から荷までをa、荷から右支点までをbとします。", "text": "両端で支えたはりに1つの集中荷重Pがかかる場合、荷の真下で曲げモーメントが最大になります。左支点から荷までをa、荷から右支点までをbとします。", "terms": [], "block": "4-1-dc17fefd1529"}, {"id": "4-1/63/text", "raw": "**最大曲げモーメント＝P×a×b÷（a＋b）。** 同じ荷・同じ支点間距離なら、荷が中央にあるときに最大になります。", "text": "最大曲げモーメント＝P×a×b÷（a＋b）。 同じ荷・同じ支点間距離なら、荷が中央にあるときに最大になります。", "terms": [], "block": "4-1-0f0ceef2daea"}, {"id": "4-1/64/text", "raw": "全長8m・荷重40kNなら、端から2mでは40×2×6÷8＝**60kN・m**。中央では40×4×4÷8＝**80kN・m** です。", "text": "全長8m・荷重40kNなら、端から2mでは40×2×6÷8＝60kN・m。中央では40×4×4÷8＝80kN・m です。", "terms": [], "block": "4-1-f415f6a0e86a"}, {"id": "4-1/65/text", "raw": "**同じ梁・同じ荷重なら、中央に荷をかけると最大のたわみも最も大きくなります。** 物差しの両端を支え、中央を押す場面を思い浮かべましょう。支持方法や荷重の条件が違う場合にまで広げないことが大切です。", "text": "同じ梁・同じ荷重なら、中央に荷をかけると最大のたわみも最も大きくなります。 物差しの両端を支え、中央を押す場面を思い浮かべましょう。支持方法や荷重の条件が違う場合にまで広げないことが大切です。", "terms": [], "block": "4-1-fdd63fe6f2f5"}, {"id": "4-1/67/text", "raw": "**例題5：** AからCまで70cmの棒を、Aから35cmの支点Oで支えます。Aには30kg、Cには10kg、Oから右へ20cmのBには質量pの荷。棒の質量を無視すると、つり合うpはいくら？", "text": "例題5： AからCまで70cmの棒を、Aから35cmの支点Oで支えます。Aには30kg、Cには10kg、Oから右へ20cmのBには質量pの荷。棒の質量を無視すると、つり合うpはいくら？", "terms": [], "block": "4-1-d49cae5f5a36"}, {"id": "4-1/69/text", "raw": "**① 左回り：** 30×35＝1,050。どの荷にも同じ重力加速度がかかるので、つり合いの比較では省略できます。", "text": "① 左回り： 30×35＝1,050。どの荷にも同じ重力加速度がかかるので、つり合いの比較では省略できます。", "terms": [], "block": "4-1-c325dd97933b"}, {"id": "4-1/70/text", "raw": "**② 右回り：** p×20＋10×（70−35）＝20p＋350。右端の腕は**35cm**です。", "text": "② 右回り： p×20＋10×（70−35）＝20p＋350。右端の腕は35cmです。", "terms": [], "block": "4-1-a49602fcd644"}, {"id": "4-1/71/text", "raw": "**③ 左回り＝右回り：** 1,050＝20p＋350。p＝（1,050−350）÷20＝**35kg**。", "text": "③ 左回り＝右回り： 1,050＝20p＋350。p＝（1,050−350）÷20＝35kg。", "terms": [], "block": "4-1-e3ef30af1bd0"}, {"id": "4-1/72/items:0", "raw": "**例題6（段付き滑車＝てこ）**：一体で回る半径ちがいの滑車があり、半径50cm側に質量4tの荷、半径80cm側に力Fをかけて支える。Fは？（これもモーメントのつり合いです） 2本のロープはそれぞれ円周に接する向きに力を加え、互いに逆向きのモーメントを生じるものとします。\n\n軸の摩擦は無視します。", "text": "例題6（段付き滑車＝てこ）：一体で回る半径ちがいの滑車があり、半径50cm側に質量4tの荷、半径80cm側に力Fをかけて支える。Fは？（これもモーメントのつり合いです） 2本のロープはそれぞれ円周に接する向きに力を加え、互いに逆向きのモーメントを生じるものとします。\n\n軸の摩擦は無視します。", "terms": [], "block": "4-1-cb9949a4f2b1"}, {"id": "4-1/74/text", "raw": "→ 荷の重量W＝4×9.8＝39.2kN。モーメントのつり合いより、39.2×0.50＝F×0.80。F＝39.2×0.50÷0.80＝**24.5kN**。", "text": "→ 荷の重量W＝4×9.8＝39.2kN。モーメントのつり合いより、39.2×0.50＝F×0.80。F＝39.2×0.50÷0.80＝24.5kN。", "terms": [], "block": "4-1-ef0c2e1d76ea"}, {"id": "4-1/76/text", "raw": "sin・cos・tanは、**直角三角形の辺どうしの長さの比**です。角度が同じなら、三角形を大きくしても比は変わりません。まず次の5・12・13の図で読みます。", "text": "sin・cos・tanは、直角三角形の辺どうしの長さの比です。角度が同じなら、三角形を大きくしても比は変わりません。まず次の5・12・13の図で読みます。", "terms": [], "block": "4-1-77cdd412cca4"}, {"id": "4-1/78/rows:0:0", "raw": "sinθ（サイン）", "text": "sinθ（サイン）", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/78/rows:0:1", "raw": "向かい側の辺÷斜辺＝**5/13**", "text": "向かい側の辺÷斜辺＝5/13", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/78/rows:1:0", "raw": "cosθ（コサイン）", "text": "cosθ（コサイン）", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/78/rows:1:1", "raw": "隣の辺÷斜辺＝**12/13**", "text": "隣の辺÷斜辺＝12/13", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/78/rows:2:0", "raw": "tanθ（タンジェント）", "text": "tanθ（タンジェント）", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/78/rows:2:1", "raw": "向かい側の辺÷隣の辺＝**5/12**", "text": "向かい側の辺÷隣の辺＝5/12", "terms": [], "block": "4-1-rev26-trig-table"}, {"id": "4-1/79/text", "raw": "図を拡大しても、例えば10・24・26ならtanθ＝10÷24＝5/12。**角度が同じなら辺の比も同じ**です。", "text": "図を拡大しても、例えば10・24・26ならtanθ＝10÷24＝5/12。角度が同じなら辺の比も同じです。", "terms": [], "block": "4-1-01a9550f070d"}, {"id": "4-1/80/text", "raw": "玉掛けでは、**鉛直線から測る角β**を使うことがあります。この場合、鉛直の辺が角に隣り合うので、**上向きの分力＝張力×cosβ**。横向きの分力は張力×sinβです。", "text": "玉掛けでは、鉛直線から測る角βを使うことがあります。この場合、鉛直の辺が角に隣り合うので、上向きの分力＝張力×cosβ。横向きの分力は張力×sinβです。", "terms": [], "block": "4-1-b7996f7b782b"}, {"id": "4-1/81/text", "raw": "鉛直から60°で張力39.2kN、cos60°＝0.5、sin60°＝0.866なら、鉛直成分19.6kN、水平成分約**33.95kN**。左右対称の二本づりでは、水平成分は反対向きで打ち消し合います。", "text": "鉛直から60°で張力39.2kN、cos60°＝0.5、sin60°＝0.866なら、鉛直成分19.6kN、水平成分約33.95kN。左右対称の二本づりでは、水平成分は反対向きで打ち消し合います。", "terms": [], "block": "4-1-db87178d757a"}, {"id": "4-1/83/text", "raw": "二つの力P・Qが同じ点に働き、その間の角をθとします。**合力R²＝P²＋Q²＋2PQcosθ**。直角ならcos90°＝0なので、三平方の式に戻ります。", "text": "二つの力P・Qが同じ点に働き、その間の角をθとします。合力R²＝P²＋Q²＋2PQcosθ。直角ならcos90°＝0なので、三平方の式に戻ります。", "terms": [], "block": "4-1-002f4f980d4b"}, {"id": "4-1/84/text", "raw": "P＝Q＝10kN、θ＝120°、cos120°＝−0.5なら、R²＝100＋100−100＝100。合力は **10kN** です。等しい二力の合力は、二つの力の間の角を二等分する向きになります。", "text": "P＝Q＝10kN、θ＝120°、cos120°＝−0.5なら、R²＝100＋100−100＝100。合力は 10kN です。等しい二力の合力は、二つの力の間の角を二等分する向きになります。", "terms": [], "block": "4-1-a08777693574"}, {"id": "4-1/85/text", "raw": "ここでは**2つの力の大きさを一定**にして、間の角度だけを変えています。開きが大きいほど、合力は小さくなります。玉掛けで「同じ荷を支える」ときは逆に、上向きの合力を一定に保つため、各ロープの張力を増やす必要があります。", "text": "ここでは2つの力の大きさを一定にして、間の角度だけを変えています。開きが大きいほど、合力は小さくなります。玉掛けで「同じ荷を支える」ときは逆に、上向きの合力を一定に保つため、各ロープの張力を増やす必要があります。", "terms": [], "block": "4-1-e4b84316456c"}], "candidates": [{"id": "4-1/3/rows:2:0#0", "fieldID": "4-1/3/rows:2:0", "block": "4-1-f6000e508ed6", "answer": "作用点", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "作用点", "start16": 0, "end16": 3}, {"id": "4-1/4/text#51", "fieldID": "4-1/4/text", "block": "4-1-b8ffa7a8c303", "answer": "作用線", "category": "key", "prompt": "［用語？］", "start": 51, "end": 54, "context": "図で力を表すときは、矢印の 長さで大きさ、矢先で向き、根元で作用点 を示します。矢印を延長した直線が 作用線 です。", "start16": 51, "end16": 54}, {"id": "4-1/8/text#30", "fieldID": "4-1/8/text", "block": "4-1-290d23c3893c", "answer": "合力", "category": "key", "prompt": "［用語？］", "start": 30, "end": 32, "context": "2つ以上の力を1つにまとめることが 力の合成、まとめた力が 合力 です。図では横4Nと縦3Nが、斜め5Nの力と同じ働きをします。", "start16": 30, "end16": 32}, {"id": "4-1/9/text#33", "fieldID": "4-1/9/text", "block": "4-1-a73bfa8e4eae", "answer": "分力", "category": "key", "prompt": "［用語？］", "start": 33, "end": 35, "context": "反対に、斜めの力を縦・横などに分けることが 力の分解、分けた力が 分力 です。図の赤5Nは、横4Nと縦3Nに分けて考えられます。4-6のロープの張力も、この方法で読み解きます。", "start16": 33, "end16": 35}, {"id": "4-1/10/text#33", "fieldID": "4-1/10/text", "block": "4-1-cd97abd475d8", "answer": "平行四辺形", "category": "key", "prompt": "［用語？］", "start": 33, "end": 38, "context": "向きの異なる2つの力は、同じ作用点から矢印を描きます。その2辺で 平行四辺形 を作ると、作用点から向かいの頂点へ引いた対角線が合力です。図は、2つの力が直角の場合です。", "start16": 33, "end16": 38}, {"id": "4-1/17/text#34", "fieldID": "4-1/17/text", "block": "4-1-d7f245981458", "answer": "作用・反作用", "category": "key", "prompt": "［用語？］", "start": 34, "end": 40, "context": "AがBを押すと、BもAを同じ大きさの反対向きの力で押します。これが 作用・反作用 です。片方はBに、もう片方はAに働きます。", "start16": 34, "end16": 40}, {"id": "4-1/21/text#0", "fieldID": "4-1/21/text", "block": "4-1-f84115b32ccf", "answer": "力のモーメント", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "力のモーメント は、物を回そうとする働きです。図では、短いスパナは50N、長いスパナは25Nで、同じ回す働きが得られます。支点から押す位置までの距離が2倍なら、力は半分ですむ という関係です。", "start16": 0, "end16": 7}, {"id": "4-1/22/text#11", "fieldID": "4-1/22/text", "block": "4-1-69f0986d9ee7", "answer": "力〔N〕×腕の長さ〔m〕", "category": "key", "prompt": "［式？］", "start": 11, "end": 23, "context": "モーメント〔N・m〕＝力〔N〕×腕の長さ〔m〕", "start16": 11, "end16": 23}, {"id": "4-1/40/text#24", "fieldID": "4-1/40/text", "block": "4-1-14d26ac7560f", "answer": "偶力", "category": "key", "prompt": "［用語？］", "start": 24, "end": 26, "context": "大きさが等しく、反対向きで、作用線が離れた二力を偶力といいます。 ハンドルの左右を逆向きに押して回す場面を思い浮かべます。", "start16": 24, "end16": 26}], "rounds": {"all": [["4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24"], ["4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51"], ["4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0"], ["4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0"], ["4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34"], ["4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33"], ["4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30"], ["4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33"], ["4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11"]], "key": [["4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24"], ["4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51"], ["4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0"], ["4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0"], ["4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34"], ["4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33"], ["4-1/9/text#33", "4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30"], ["4-1/22/text#11", "4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33"], ["4-1/40/text#24", "4-1/4/text#51", "4-1/21/text#0", "4-1/3/rows:2:0#0", "4-1/17/text#34", "4-1/10/text#33", "4-1/8/text#30", "4-1/9/text#33", "4-1/22/text#11"]], "num": [[]]}}, {"id": "4-2", "title": "質量・比重・体積の計算", "blocks": [{"type": "p", "text": "荷の質量は、**どれだけの体積があるか** と、**その材料は1m³で何tか** から求めます。まず形から体積を出し、材料の密度を掛けます。", "style": "lead", "id": "4-2-c66cd53ed21b"}, {"type": "p", "text": "**質量〔t〕＝体積〔m³〕×密度〔t/m³〕**", "emphasis": true, "id": "4-2-b6e915549a54", "quizTerms": ["体積〔m³〕×密度〔t/m³〕"]}, {"type": "sub", "text": "1．密度と比重", "id": "4-2-d7137db1a572"}, {"type": "p", "text": "**密度**は、単位体積あたりの質量です。鋼の7.8t/m³なら、「1m³で7.8t」。体積が半分なら質量も半分になります。", "id": "4-2-98e5ddeb4bfa", "quizTerms": ["密度", "7.8t/m³"]}, {"type": "p", "text": "**比重** は、同じ体積の水に対して何倍の質量があるかを示す、単位のない数です。4℃の純水を基準にすると、密度をt/m³で表した数値とほぼ同じです。鋼なら密度は約7.8t/m³＝7800kg/m³、比重は約7.8です。", "id": "4-2-f445d41a8a8d", "quizTerms": ["比重"]}, {"type": "table", "headers": ["材料", "1m³あたりの質量（t・代表値）"], "rows": [["鉛", "11.4"], ["銅", "8.9"], ["鋼（鉄）", "7.8"], ["鋳鉄", "7.2"], ["アルミニウム", "2.7"], ["コンクリート", "2.3"], ["土", "2.0"], ["砂利", "1.9"], ["砂", "1.9"], ["水", "1.0"], ["石炭粉", "1.0"], ["かし（樫）", "0.9"], ["石炭塊", "0.8"], ["けやき", "0.7"], ["コークス", "0.5"], ["すぎ（杉）", "0.4"], ["ひのき", "0.4"], ["きり（桐）", "0.3"]], "id": "4-2-07f245404721"}, {"type": "p", "text": "まずは**鋼7.8・コンクリート2.3・水1.0**を押さえ、問題に指定があればその値を使います。土や砂などは隙間を含めた代表値です。", "id": "4-2-b8c2c5a9eb8c", "style": "tip"}, {"type": "p", "text": "中が詰まった一様な物なら、比重が1より大きいと水に沈みます。空洞のある物は全体の平均**密度**で決まり、鉄の船も浮くことができます。", "id": "4-2-808e99867ab9"}, {"type": "sub", "text": "2．形から体積を求める", "id": "4-2-944ffa4704d1"}, {"type": "img", "asset": "4-2_volume_shapes_clear", "caption": "a・b・h・L・rは寸法を表す。rは円の中心から縁までの半径。π＝3.14とする。", "id": "4-2-96422802e053", "style": "figure", "_previewFile": "4-2_volume_shapes_clear.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "直方体は縦×横×高さ。三角柱は、三角形の面積「底辺×高さ÷2」に柱の長さを掛けます。円柱は、円の面積「半径²×π」に高さを掛けます。", "id": "4-2-73015c7ba516"}, {"type": "p", "text": "長さはすべてmへそろえると、**体積**がm³になります。例えば50cmは0.5m、20cmは0.2mです。", "id": "4-2-7b6f9dc7cec0"}, {"type": "sub", "text": "中空・丸い形の体積", "id": "4-2-b909ffedc256"}, {"type": "img", "asset": "4-2_pipe_volume_clear", "caption": "Rは外半径、rは空洞の内半径。空洞を除いた断面積に、高さを掛ける。", "id": "4-2-5f8a576dddf8", "style": "figure", "_previewFile": "4-2_pipe_volume_clear.png", "_width": 1500, "_height": 1000}, {"type": "p", "text": "**パイプ** は、外側の円柱の体積から、空洞の円柱の体積を引きます。外半径をR、内半径をrとすると、「R²×π×高さ − r²×π×高さ」をまとめて、**(R²−r²)×π×高さ** です。", "id": "4-2-6a84541367a6"}, {"type": "img", "asset": "4-2_sphere_cone_volume_clear", "caption": "球のrは中心から表面までの距離。円錐のrは底面の半径、hは底面から頂点までの垂直な高さ。", "id": "4-2-fcb0f34453fe", "style": "figure", "_previewFile": "4-2_sphere_cone_volume_clear.png", "_width": 1600, "_height": 1050}, {"type": "p", "text": "**球** の体積は「半径³×π×4÷3」。半径³は、半径を3回掛けることです。", "id": "4-2-e77a1a635e07"}, {"type": "p", "text": "**円錐** の体積は「半径²×π×高さ÷3」。図の薄い円柱と比べると、底面と高さが同じ円錐は、体積が円柱の**1/3** になります。", "id": "4-2-88a7ff9192db"}, {"type": "sub", "text": "計算例：鋼の直方体", "id": "4-2-8d72ed6c44f6"}, {"type": "ul", "items": ["**例題1（鋼の直方体）**：1m × 0.5m × 0.2m の鋼のかたまりの質量は？"], "id": "4-2-0e0779be35a6"}, {"type": "p", "text": "→ **体積** = 1 × 0.5 × 0.2 = 0.1m³", "id": "4-2-2a9a5a300af0"}, {"type": "p", "text": "→ 鋼は7.8t/m³なので、質量 = 0.1 × 7.8 = **0.78t ＝ 780kg**", "id": "4-2-12909b4e4b36"}, {"type": "sub", "text": "計算例：コンクリートの円柱", "id": "4-2-d8d522a14760"}, {"type": "ul", "items": ["**例題2（コンクリート円柱）**：直径1m・高さ4mのコンクリート円柱の質量は？"], "id": "4-2-3eedec82804a"}, {"type": "p", "text": "→ 半径は直径の半分なので0.5m。体積 = 0.5 × 0.5 × 3.14 × 4 = **3.14m³**", "id": "4-2-62df6e628c13"}, {"type": "p", "text": "→ コンクリートは2.3t/m³なので、質量 = 2.3 × 3.14 ≒ **7.22t**（この荷は4-6のつり角度の例題でも使います）", "id": "4-2-9e28358ab888"}, {"type": "sub", "text": "3．寸法を変えると、質量は何倍か", "id": "4-2-6486f723e2f9"}, {"type": "img", "asset": "4-2_scale_clear", "caption": "1辺を全部2倍にした立方体。小さい立方体8個分になる。", "id": "4-2-70811d291cf8", "style": "figure", "_previewFile": "4-2_scale_clear.png", "_width": 1500, "_height": 870}, {"type": "p", "text": "同じ材料で縦・横・高さを全部k倍にすると、体積と質量は **k³倍**。全部2倍なら8倍、全部4倍なら64倍、全部1/2なら1/8です。", "id": "4-2-5867c03e2704"}, {"type": "p", "text": "円柱の高さを変えず、直径だけk倍にすると、底面積がk²倍になるため、質量も **k²倍**。直径だけ3倍なら9倍です。", "id": "4-2-53f823059739"}, {"id": "4-2-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-2-rev26-scale-q", "type": "p", "text": "**確認：** 同じ材質の円柱で、高さを変えずに直径を2倍にすると、質量は何倍？", "style": "question"}, {"id": "4-2-rev26-scale-a", "type": "p", "text": "**4倍。** 半径も2倍になるため底面積は2²＝4倍。高さは同じなので体積・質量も4倍です。", "style": "answer"}, {"id": "4-2-rev26-pipe-q", "type": "p", "text": "**確認：** 外半径0.1m・内半径0.08m・長さ1mの鋼管。材料の体積と質量は？ π＝3.14、密度7.8t/m³。", "style": "question"}, {"id": "4-2-rev26-pipe-a", "type": "p", "text": "**体積0.011304m³、質量約88.2kg。** （0.1²−0.08²）×3.14×1＝0.011304。これに7.8を掛けると0.0881712t＝88.1712kgです。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-2/1/text", "raw": "**質量〔t〕＝体積〔m³〕×密度〔t/m³〕**", "text": "質量〔t〕＝体積〔m³〕×密度〔t/m³〕", "terms": ["体積〔m³〕×密度〔t/m³〕"], "block": "4-2-b6e915549a54"}, {"id": "4-2/3/text", "raw": "**密度**は、単位体積あたりの質量です。鋼の7.8t/m³なら、「1m³で7.8t」。体積が半分なら質量も半分になります。", "text": "密度は、単位体積あたりの質量です。鋼の7.8t/m³なら、「1m³で7.8t」。体積が半分なら質量も半分になります。", "terms": ["密度", "7.8t/m³"], "block": "4-2-98e5ddeb4bfa"}, {"id": "4-2/4/text", "raw": "**比重** は、同じ体積の水に対して何倍の質量があるかを示す、単位のない数です。4℃の純水を基準にすると、密度をt/m³で表した数値とほぼ同じです。鋼なら密度は約7.8t/m³＝7800kg/m³、比重は約7.8です。", "text": "比重 は、同じ体積の水に対して何倍の質量があるかを示す、単位のない数です。4℃の純水を基準にすると、密度をt/m³で表した数値とほぼ同じです。鋼なら密度は約7.8t/m³＝7800kg/m³、比重は約7.8です。", "terms": ["比重"], "block": "4-2-f445d41a8a8d"}, {"id": "4-2/5/rows:0:0", "raw": "鉛", "text": "鉛", "terms": [], "block": "4-2-07f245404721"}, {"id": "4-2/5/rows:0:1", "raw": "11.4", "text": "11.4", "terms": [], "block": "4-2-07f245404721"}, {"id": "4-2/5/rows:1:0", "raw": "銅", "text": "銅", "terms": [], "block": "4-2-07f245404721"}, {"id": "4-2/5/rows:1:1", "raw": "8.9", "text": "8.9", "terms": [], "block": "4-2-07f245404721"}, {"id": "4-2/5/rows:2:0", "ra
