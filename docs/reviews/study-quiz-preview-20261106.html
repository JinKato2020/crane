原則は3本掛けのモード係数を使います。 ロープの長さなどが少し違うだけで、均等に荷重がかかりにくいためです。4本に均等に荷重がかかる場合は、4本掛けの係数を使えます。例題2は均等分担が指定されています。", "terms": [], "block": "4-6-42dfd1e85e44"}, {"id": "4-6/43/text", "raw": "書籍には**cosを使う計算例**もあります。cos（コサイン）は辺の比。鉛直線からの角βでは、**cosβ＝上向きの分力÷張力**です。例えばcos35°＝0.82なら、斜めの力の82％が上向きに働きます。", "text": "書籍にはcosを使う計算例もあります。cos（コサイン）は辺の比。鉛直線からの角βでは、cosβ＝上向きの分力÷張力です。例えばcos35°＝0.82なら、斜めの力の82％が上向きに働きます。", "terms": [], "block": "4-6-0c597c1d08a8"}, {"id": "4-6/44/text", "raw": "**張力係数＝1÷cosβ**", "text": "張力係数＝1÷cosβ", "terms": [], "block": "4-6-6407b7675d84"}, {"id": "4-6/45/text", "raw": "**必要な上向きの力÷cosβ＝張力。** 張力係数は、この割り算を掛け算にするための値です。cosβ＝0.5なら張力係数は2、cosβ＝0.82なら約1.22になります。", "text": "必要な上向きの力÷cosβ＝張力。 張力係数は、この割り算を掛け算にするための値です。cosβ＝0.5なら張力係数は2、cosβ＝0.82なら約1.22になります。", "terms": [], "block": "4-6-9e21170da6d0"}, {"id": "4-6/47/text", "raw": "**書籍の例題：** 例題1と同じコンクリート円柱を、つり角度**70°**でつります。cos35°＝0.82として、1本の張力を求めましょう。", "text": "書籍の例題： 例題1と同じコンクリート円柱を、つり角度70°でつります。cos35°＝0.82として、1本の張力を求めましょう。", "terms": [], "block": "4-6-rev26-book-cos-example"}, {"id": "4-6/48/rows:0:0", "raw": "① 荷の重量", "text": "① 荷の重量", "terms": [], "block": "4-6-rev26-cos-steps"}, {"id": "4-6/48/rows:0:1", "raw": "7.222t×9.8＝**70.7756kN**", "text": "7.222t×9.8＝70.7756kN", "terms": [], "block": "4-6-rev26-cos-steps"}, {"id": "4-6/48/rows:1:0", "raw": "② 1本の上向き分力", "text": "② 1本の上向き分力", "terms": [], "block": "4-6-rev26-cos-steps"}, {"id": "4-6/48/rows:1:1", "raw": "70.7756÷2＝**35.3878kN**", "text": "70.7756÷2＝35.3878kN", "terms": [], "block": "4-6-rev26-cos-steps"}, {"id": "4-6/48/rows:2:0", "raw": "③ 1本の張力", "text": "③ 1本の張力", "terms": [], "block": "4-6-rev26-cos-steps"}, {"id": "4-6/48/rows:2:1", "raw": "35.3878÷0.82≒**43.2kN**", "text": "35.3878÷0.82≒43.2kN", "terms": [], "block": "4-6-rev26-cos-steps"}], "candidates": [{"id": "4-6/2/text#52", "fieldID": "4-6/2/text", "block": "4-6-c120d4e0573e", "answer": "分力", "category": "key", "prompt": "［用語？］", "start": 52, "end": 54, "context": "ロープが荷を引く力を 張力 といいます。斜めの張力を上向きと横向きの力で表すのが 力の分解、それぞれが 分力（鉛直成分・水平成分）です。10kNの荷を左右対称に支えるなら、上向きの分力は左右5kNずつ必要です。", "start16": 52, "end16": 54}, {"id": "4-6/4/text#92", "fieldID": "4-6/4/text", "block": "4-6-33122205cc7c", "answer": "合力", "category": "key", "prompt": "［用語？］", "start": 92, "end": 94, "context": "開きが大きいほど、張力のうち横向きに働く割合が大きくなります。同じ上向き5kNを保つには、斜めの張力を大きくする必要があります。増えるのは 各ロープの張力 で、左右2本の張力を合わせた合力は、横がつり合って上向き10kNのままです。", "start16": 92, "end16": 94}, {"id": "4-6/8/text#0", "fieldID": "4-6/8/text", "block": "4-6-b5247bcd0bcc", "answer": "張力係数", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "張力係数は、上向きの分力を1としたときの張力の倍率 です。図の右では、上向き5kNに対して張力10kNなので2倍。係数に単位はありません。", "start16": 0, "end16": 4}, {"id": "4-6/11/rows:2:1#0", "fieldID": "4-6/11/rows:2:1", "block": "4-6-aabca1e52703", "answer": "1.16", "category": "num", "prompt": "［数値？］", "start": 0, "end": 4, "context": "1.16", "start16": 0, "end16": 4}, {"id": "4-6/11/rows:3:1#0", "fieldID": "4-6/11/rows:3:1", "block": "4-6-aabca1e52703", "answer": "1.41", "category": "num", "prompt": "［数値？］", "start": 0, "end": 4, "context": "1.41", "start16": 0, "end16": 4}, {"id": "4-6/11/rows:4:1#0", "fieldID": "4-6/11/rows:4:1", "block": "4-6-aabca1e52703", "answer": "2.00", "category": "num", "prompt": "［数値？］", "start": 0, "end": 4, "context": "2.00", "start16": 0, "end16": 4}, {"id": "4-6/20/text#0", "fieldID": "4-6/20/text", "block": "4-6-96272ddac25e", "answer": "安全係数", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "安全係数は、使用時の最大の力に対して切断荷重が何倍あるかを表します。玉掛け用ワイヤロープには6以上が必要です。", "start16": 0, "end16": 4}, {"id": "4-6/20/text#18", "fieldID": "4-6/20/text", "block": "4-6-96272ddac25e", "answer": "切断荷重", "category": "key", "prompt": "［用語？］", "start": 18, "end": 22, "context": "安全係数は、使用時の最大の力に対して切断荷重が何倍あるかを表します。玉掛け用ワイヤロープには6以上が必要です。", "start16": 18, "end16": 22}, {"id": "4-6/23/rows:0:1#0", "fieldID": "4-6/23/rows:0:1", "block": "4-6-a4a337086c3a", "answer": "6以上", "category": "num", "prompt": "［数値？］", "start": 0, "end": 3, "context": "6以上", "start16": 0, "end16": 3}, {"id": "4-6/32/text#34", "fieldID": "4-6/32/text", "block": "4-6-73460e227c52", "answer": "基本安全荷重", "category": "key", "prompt": "［用語？］", "start": 34, "end": 40, "context": "ロープ1本を鉛直にまっすぐ使う場合の使用限度を、質量で表したものが 基本安全荷重 です。切断荷重58.8kN、安全係数6なら、使用する力の上限は58.8÷6＝9.8kN。地球上で質量1tに対応するので、基本安全荷重は1tです。", "start16": 34, "end16": 40}, {"id": "4-6/35/text#0", "fieldID": "4-6/35/text", "block": "4-6-0e52c513ca98", "answer": "モード係数", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "モード係数は、ロープ1本でつれる質量を基準にした、そのつり方でつれる質量の倍率 です。図では、基本安全荷重1tの同じロープを使って比べます。", "start16": 0, "end16": 5}], "rounds": {"all": [["4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34"], ["4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0"], ["4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0"], ["4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92"], ["4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52"], ["4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0"], ["4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0"], ["4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0"], ["4-6/8/text#0", "4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0"], ["4-6/32/text#34", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18"], ["4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/4/text#92", "4-6/2/text#52", "4-6/11/rows:4:1#0", "4-6/35/text#0", "4-6/20/text#0", "4-6/11/rows:3:1#0", "4-6/20/text#18", "4-6/8/text#0"]], "key": [["4-6/4/text#92", "4-6/2/text#52", "4-6/35/text#0", "4-6/20/text#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34"], ["4-6/2/text#52", "4-6/35/text#0", "4-6/20/text#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/4/text#92"], ["4-6/35/text#0", "4-6/20/text#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/4/text#92", "4-6/2/text#52"], ["4-6/20/text#0", "4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/4/text#92", "4-6/2/text#52", "4-6/35/text#0"], ["4-6/20/text#18", "4-6/8/text#0", "4-6/32/text#34", "4-6/4/text#92", "4-6/2/text#52", "4-6/35/text#0", "4-6/20/text#0"], ["4-6/8/text#0", "4-6/32/text#34", "4-6/4/text#92", "4-6/2/text#52", "4-6/35/text#0", "4-6/20/text#0", "4-6/20/text#18"], ["4-6/32/text#34", "4-6/4/text#92", "4-6/2/text#52", "4-6/35/text#0", "4-6/20/text#0", "4-6/20/text#18", "4-6/8/text#0"]], "num": [["4-6/23/rows:0:1#0", "4-6/11/rows:4:1#0", "4-6/11/rows:3:1#0", "4-6/11/rows:2:1#0"], ["4-6/11/rows:4:1#0", "4-6/11/rows:3:1#0", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0"], ["4-6/11/rows:3:1#0", "4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/11/rows:4:1#0"], ["4-6/11/rows:2:1#0", "4-6/23/rows:0:1#0", "4-6/11/rows:4:1#0", "4-6/11/rows:3:1#0"]]}}, {"id": "4-7", "title": "滑車装置のしくみ", "blocks": [{"type": "p", "text": "滑車は、ロープをかけて使う車輪です。**固定されているか、荷と一緒に動くか** に注目すると、働きの違いが分かります。ここでは荷をゆっくり一定の速さで上げ、摩擦とロープ・滑車の重さは無視します。", "style": "lead", "id": "4-7-ed9b6a7f19f7"}, {"type": "sub", "text": "1．定滑車と動滑車：100Nの荷で比べる", "id": "4-7-990f3b827392"}, {"type": "img", "asset": "4-7_fixed_moving_clear", "caption": "青い線は1本の連続したロープ。灰色の棒は滑車を取り付ける支え。図のロープの支持部分は鉛直。", "id": "4-7-3c9a29b7ba0c", "style": "figure", "_previewFile": "4-7_fixed_moving_clear.png", "_width": 1600, "_height": 1050}, {"type": "p", "text": "**定滑車**は、軸の位置が動かない滑車。引く力の向きを変えますが、力の大きさは変わりません。天井クレーンのトロリなどに付いています。", "id": "4-7-bb7ec8897a58", "quizTerms": ["定滑車"]}, {"type": "p", "text": "**動滑車**は、荷と一緒に軸が動く滑車。フックブロックなどに使われます。2本のロープで支えれば、引く力は荷の重量の**1/2**です。", "id": "4-7-fc1f2307ef2c", "quizTerms": ["動滑車"]}, {"type": "sub", "text": "2．力を小さくするほど、ロープを長く引く", "id": "4-7-31e7f3a99b02"}, {"type": "p", "text": "動滑車を1m上げると、左右のロープ部分がそれぞれ1mずつ短くなります。その分を手元へ引き出すので、引く長さは合計2mです。**力が半分になる代わりに、引く長さは2倍** になります。", "id": "4-7-99fda347f896", "quizTerms": ["2倍", "半分"]}, {"id": "4-7-rev26-pulley-direction", "type": "p", "text": "動滑車だけなら、荷を上げるためにロープの端も上へ引きます。図のように上に**定滑車を加えると、下へ引いて荷を上げられます**。力を減らす役と、向きを変える役を分けて見ましょう。", "style": "tip"}, {"type": "sub", "text": "3．組合せ滑車：荷を直接支える部分を数える", "id": "4-7-dc9015edb24f"}, {"type": "img", "asset": "4-7_compound_clear", "caption": "下の2個の動滑車と荷は一緒に動く。①〜④は、そのまとまりを上向きに支えるロープ部分。", "id": "4-7-008aec46a2e1", "style": "figure", "_previewFile": "4-7_compound_clear.png", "_width": 1500, "_height": 1100}, {"type": "p", "text": "図の青い線は、つながった1本のロープです。そのため**張力**はどこでも同じです。荷を直接支える4本で100Nを分けると、1本25N。手元で引く力も25Nになります。", "id": "4-7-db1733b0ce72"}, {"type": "p", "text": "数えるのは、**荷と動滑車を直接支える部分** です。右端の手元へ下がる部分は数えません。滑車の個数だけで決めず、図のロープをたどって数えます。", "id": "4-7-50bc04f2427e"}, {"type": "p", "text": "**引く力〔N〕＝荷の重量〔N〕÷支える本数**", "emphasis": true, "id": "4-7-f36e7384c6c3", "quizTerms": ["荷の重量〔N〕÷支える本数"]}, {"type": "p", "text": "**引く長さ＝荷を上げる高さ×支える本数**", "emphasis": true, "id": "4-7-6896422d9fe4", "quizTerms": ["荷を上げる高さ×支える本数"]}, {"type": "p", "text": "**質量**〔kg〕が与えられたら、まず「質量×9.8」で重量〔N〕に直します。", "id": "4-7-c4e1169bb65f"}, {"type": "sub", "text": "計算例：支える本数が6本・8本の場合", "id": "4-7-5be8779887de"}, {"type": "ul", "items": ["質量100kgを6本で支える：100×9.8÷6≒**163.3N**。荷を1m上げるには6m引きます。", "質量200kgを8本で支える：200×9.8÷8＝**245N**。"], "id": "4-7-efb0976d966a"}, {"type": "svg", "file": "4-7_supplement_f58_20261023.svg", "caption": "下の滑車と荷を一つのまとまりとして、上へ支えるロープ部分を数える。右端の引く部分は支持本数に含めない。", "id": "4-7-5c243da9892d", "style": "figure", "_previewFile": "4-7_supplement_f58_20261023.svg"}, {"type": "sub", "text": "4．段階式：別のロープにつなぐと、さらに半分", "id": "4-7-321da012f92e"}, {"type": "img", "asset": "4-7_cascade_clear", "caption": "AとBは別のロープ。Aの右端は上の動滑車の軸側に取り付けられ、50Nの荷重をかける。", "id": "4-7-2a626ada387f", "style": "figure", "_previewFile": "4-7_cascade_clear.png", "_width": 1500, "_height": 1100}, {"type": "p", "text": "**Aのロープの右端は、Bの滑車の軸に付いています。Bに巻かれたロープとは別です。** Aを支える2本に100Nが分かれるので、右端の50NはBの軸へ下向きにかかり、Bにとっての荷重になります。", "id": "4-7-c74f0dfdb7f6"}, {"type": "p", "text": "その50NをロープBの左右2本が25Nずつ支えます。", "id": "4-7-a5b701a56a98"}, {"type": "p", "text": "この掛け方では、**下から順に2で割る** と求められます。3段で質量300kgなら、300×9.8÷2÷2÷2＝**367.5N**。段数をkとすると、引く力は「荷の重量÷2ᵏ」です。", "id": "4-7-77b4c22ed7e7"}, {"type": "p", "text": "**組合せ滑車**は「1本のロープの支える部分を数える」、段階式は「別のロープへ移るたびに半分」。ロープのつながりを見分けます。", "id": "4-7-87f2d78b2084", "quizTerms": ["組合せ滑車"]}, {"type": "sub", "text": "5．仕事：力と距離を掛けて考える", "id": "4-7-15f1159f28c3"}, {"type": "img", "asset": "4-7_work_clear", "caption": "縦が力、横が動かす距離。同じ面積は同じ仕事を表す。", "id": "4-7-3051a02a3295", "style": "figure", "_previewFile": "4-7_work_clear.png", "_width": 1500, "_height": 950}, {"type": "p", "text": "100Nで1m引く場合も、50Nで2m引く場合も、**仕事**は100Jです。滑車を使うと引く力は小さくなりますが、その分だけ長く引くので、仕事は同じです。", "id": "4-7-08fb9480e430", "quizTerms": ["仕事"]}, {"type": "p", "text": "**仕事〔J〕＝力〔N〕×その力の向きに動かした距離〔m〕**", "emphasis": true, "id": "4-7-73cadb2e8a85"}, {"type": "sub", "text": "6．動力：同じ仕事を、何秒でするか", "id": "4-7-f1a735e8d021"}, {"type": "p", "text": "**動力** は、1秒あたりにする仕事です。同じ荷を同じ高さまで上げるなら、短い時間で上げるほど大きな動力が必要です。", "id": "4-7-f7d88855e1cf"}, {"type": "p", "text": "**動力〔W〕＝仕事〔J〕÷時間〔s〕**", "emphasis": true, "id": "4-7-14ca0b4d90ac", "quizTerms": ["仕事〔J〕÷時間〔s〕"]}, {"type": "p", "text": "例：質量100kgの荷を10秒で2m上げると、重量は100×9.8＝980N、仕事は980×2＝1960J。動力は1960÷10＝**196W** です。", "id": "4-7-83b00943028c"}, {"type": "p", "text": "一定の力・**速さ**で同じ向きに動かす場合は「動力＝力×速さ」でも求められます。この例では速さ2÷10＝0.2m/sなので、980×0.2＝196Wです。", "id": "4-7-52647ddf9136"}, {"type": "sub", "id": "lesson-mechanical-efficiency", "text": "損失があるとき――必要な入力は大きくなる"}, {"type": "p", "text": "**効率η＝有効な出力÷入力**。効率75％なら、入力のうち75％が荷を上げる仕事に使われるので、必要な入力は出力を0.75で割ります。", "id": "4-7-b719f81c4ec3", "quizTerms": ["有効な出力÷入力", "効率"]}, {"type": "p", "text": "質量2000kgを毎秒0.3mで上げると、荷へ伝わる動力は2000×9.8×0.3＝**5.88kW**。巻上機構の効率75％なら、必要なモーター軸出力は5.88÷0.75＝**7.84kW**。電気入力を求める場合は、モーター自身の効率も別に考えます。", "id": "4-7-f2bdc9b75770"}, {"id": "4-7-rev26-efficiency", "type": "svg", "file": "4-7_efficiency_20261106.svg", "caption": "巻上げ機構へ入る動力のうち、75％が荷を持ち上げる仕事になる。ここで求めるのは、電動機の軸に必要な動力。", "style": "figure", "_previewFile": "4-7_efficiency_20261106.svg"}, {"type": "p", "text": "質量1200kgを0.5m上げる仕事は5880J。滑車装置の効率80％なら入力仕事は5880÷0.8＝**7350J**。自由端を2m引くなら、平均の引く力は7350÷2＝**3675N** です。摩擦がある装置で、全てのロープ部分の張力が等しいとは仮定しません。", "id": "4-7-849f22a5c173"}, {"id": "4-7-rev26-practice-heading", "type": "sub", "text": "確認問題：答えを見る前に考える"}, {"id": "4-7-rev26-pulley-q", "type": "p", "text": "**確認：** 動滑車を支えるロープが4本。摩擦や滑車の重さを無視し、800Nの荷を0.5m上げるには、何Nで何m引く？", "style": "question"}, {"id": "4-7-rev26-pulley-a", "type": "p", "text": "**200Nで2m。** 力は800÷4、距離は0.5×4。仕事は200×2＝800×0.5＝400Jで同じです。", "style": "answer"}, {"id": "4-7-rev26-cascade-q", "type": "p", "text": "**確認：** 階段式で、Aを支えるロープの張力が50N。その端がBの軸に付いているとき、Bを支えるロープ1本の張力は？ 滑車の重さは無視します。", "style": "question"}, {"id": "4-7-rev26-cascade-a", "type": "p", "text": "**25N。** Bの軸に下向き50Nがかかり、Bに巻かれた別のロープ2本が25Nずつで支えます。", "style": "answer"}, {"id": "4-7-rev26-power-q", "type": "p", "text": "**確認：** 荷へ伝える動力6kW、巻上げ機構の効率75％。機構へ入れる動力は？", "style": "question"}, {"id": "4-7-rev26-power-a", "type": "p", "text": "**8kW。** 6÷0.75＝8。取り出す仕事より、損失の分だけ大きな入力が必要です。", "style": "answer"}], "chapter": 4, "fields": [{"id": "4-7/3/text", "raw": "**定滑車**は、軸の位置が動かない滑車。引く力の向きを変えますが、力の大きさは変わりません。天井クレーンのトロリなどに付いています。", "text": "定滑車は、軸の位置が動かない滑車。引く力の向きを変えますが、力の大きさは変わりません。天井クレーンのトロリなどに付いています。", "terms": ["定滑車"], "block": "4-7-bb7ec8897a58"}, {"id": "4-7/4/text", "raw": "**動滑車**は、荷と一緒に軸が動く滑車。フックブロックなどに使われます。2本のロープで支えれば、引く力は荷の重量の**1/2**です。", "text": "動滑車は、荷と一緒に軸が動く滑車。フックブロックなどに使われます。2本のロープで支えれば、引く力は荷の重量の1/2です。", "terms": ["動滑車"], "block": "4-7-fc1f2307ef2c"}, {"id": "4-7/6/text", "raw": "動滑車を1m上げると、左右のロープ部分がそれぞれ1mずつ短くなります。その分を手元へ引き出すので、引く長さは合計2mです。**力が半分になる代わりに、引く長さは2倍** になります。", "text": "動滑車を1m上げると、左右のロープ部分がそれぞれ1mずつ短くなります。その分を手元へ引き出すので、引く長さは合計2mです。力が半分になる代わりに、引く長さは2倍 になります。", "terms": ["2倍", "半分"], "block": "4-7-99fda347f896"}, {"id": "4-7/7/text", "raw": "動滑車だけなら、荷を上げるためにロープの端も上へ引きます。図のように上に**定滑車を加えると、下へ引いて荷を上げられます**。力を減らす役と、向きを変える役を分けて見ましょう。", "text": "動滑車だけなら、荷を上げるためにロープの端も上へ引きます。図のように上に定滑車を加えると、下へ引いて荷を上げられます。力を減らす役と、向きを変える役を分けて見ましょう。", "terms": [], "block": "4-7-rev26-pulley-direction"}, {"id": "4-7/10/text", "raw": "図の青い線は、つながった1本のロープです。そのため**張力**はどこでも同じです。荷を直接支える4本で100Nを分けると、1本25N。手元で引く力も25Nになります。", "text": "図の青い線は、つながった1本のロープです。そのため張力はどこでも同じです。荷を直接支える4本で100Nを分けると、1本25N。手元で引く力も25Nになります。", "terms": [], "block": "4-7-db1733b0ce72"}, {"id": "4-7/11/text", "raw": "数えるのは、**荷と動滑車を直接支える部分** です。右端の手元へ下がる部分は数えません。滑車の個数だけで決めず、図のロープをたどって数えます。", "text": "数えるのは、荷と動滑車を直接支える部分 です。右端の手元へ下がる部分は数えません。滑車の個数だけで決めず、図のロープをたどって数えます。", "terms": [], "block": "4-7-50bc04f2427e"}, {"id": "4-7/12/text", "raw": "**引く力〔N〕＝荷の重量〔N〕÷支える本数**", "text": "引く力〔N〕＝荷の重量〔N〕÷支える本数", "terms": ["荷の重量〔N〕÷支える本数"], "block": "4-7-f36e7384c6c3"}, {"id": "4-7/13/text", "raw": "**引く長さ＝荷を上げる高さ×支える本数**", "text": "引く長さ＝荷を上げる高さ×支える本数", "terms": ["荷を上げる高さ×支える本数"], "block": "4-7-6896422d9fe4"}, {"id": "4-7/14/text", "raw": "**質量**〔kg〕が与えられたら、まず「質量×9.8」で重量〔N〕に直します。", "text": "質量〔kg〕が与えられたら、まず「質量×9.8」で重量〔N〕に直します。", "terms": [], "block": "4-7-c4e1169bb65f"}, {"id": "4-7/16/items:0", "raw": "質量100kgを6本で支える：100×9.8÷6≒**163.3N**。荷を1m上げるには6m引きます。", "text": "質量100kgを6本で支える：100×9.8÷6≒163.3N。荷を1m上げるには6m引きます。", "terms": [], "block": "4-7-efb0976d966a"}, {"id": "4-7/16/items:1", "raw": "質量200kgを8本で支える：200×9.8÷8＝**245N**。", "text": "質量200kgを8本で支える：200×9.8÷8＝245N。", "terms": [], "block": "4-7-efb0976d966a"}, {"id": "4-7/20/text", "raw": "**Aのロープの右端は、Bの滑車の軸に付いています。Bに巻かれたロープとは別です。** Aを支える2本に100Nが分かれるので、右端の50NはBの軸へ下向きにかかり、Bにとっての荷重になります。", "text": "Aのロープの右端は、Bの滑車の軸に付いています。Bに巻かれたロープとは別です。 Aを支える2本に100Nが分かれるので、右端の50NはBの軸へ下向きにかかり、Bにとっての荷重になります。", "terms": [], "block": "4-7-c74f0dfdb7f6"}, {"id": "4-7/21/text", "raw": "その50NをロープBの左右2本が25Nずつ支えます。", "text": "その50NをロープBの左右2本が25Nずつ支えます。", "terms": [], "block": "4-7-a5b701a56a98"}, {"id": "4-7/22/text", "raw": "この掛け方では、**下から順に2で割る** と求められます。3段で質量300kgなら、300×9.8÷2÷2÷2＝**367.5N**。段数をkとすると、引く力は「荷の重量÷2ᵏ」です。", "text": "この掛け方では、下から順に2で割る と求められます。3段で質量300kgなら、300×9.8÷2÷2÷2＝367.5N。段数をkとすると、引く力は「荷の重量÷2ᵏ」です。", "terms": [], "block": "4-7-77b4c22ed7e7"}, {"id": "4-7/23/text", "raw": "**組合せ滑車**は「1本のロープの支える部分を数える」、段階式は「別のロープへ移るたびに半分」。ロープのつながりを見分けます。", "text": "組合せ滑車は「1本のロープの支える部分を数える」、段階式は「別のロープへ移るたびに半分」。ロープのつながりを見分けます。", "terms": ["組合せ滑車"], "block": "4-7-87f2d78b2084"}, {"id": "4-7/26/text", "raw": "100Nで1m引く場合も、50Nで2m引く場合も、**仕事**は100Jです。滑車を使うと引く力は小さくなりますが、その分だけ長く引くので、仕事は同じです。", "text": "100Nで1m引く場合も、50Nで2m引く場合も、仕事は100Jです。滑車を使うと引く力は小さくなりますが、その分だけ長く引くので、仕事は同じです。", "terms": ["仕事"], "block": "4-7-08fb9480e430"}, {"id": "4-7/27/text", "raw": "**仕事〔J〕＝力〔N〕×その力の向きに動かした距離〔m〕**", "text": "仕事〔J〕＝力〔N〕×その力の向きに動かした距離〔m〕", "terms": [], "block": "4-7-73cadb2e8a85"}, {"id": "4-7/29/text", "raw": "**動力** は、1秒あたりにする仕事です。同じ荷を同じ高さまで上げるなら、短い時間で上げるほど大きな動力が必要です。", "text": "動力 は、1秒あたりにする仕事です。同じ荷を同じ高さまで上げるなら、短い時間で上げるほど大きな動力が必要です。", "terms": [], "block": "4-7-f7d88855e1cf"}, {"id": "4-7/30/text", "raw": "**動力〔W〕＝仕事〔J〕÷時間〔s〕**", "text": "動力〔W〕＝仕事〔J〕÷時間〔s〕", "terms": ["仕事〔J〕÷時間〔s〕"], "block": "4-7-14ca0b4d90ac"}, {"id": "4-7/31/text", "raw": "例：質量100kgの荷を10秒で2m上げると、重量は100×9.8＝980N、仕事は980×2＝1960J。動力は1960÷10＝**196W** です。", "text": "例：質量100kgの荷を10秒で2m上げると、重量は100×9.8＝980N、仕事は980×2＝1960J。動力は1960÷10＝196W です。", "terms": [], "block": "4-7-83b00943028c"}, {"id": "4-7/32/text", "raw": "一定の力・**速さ**で同じ向きに動かす場合は「動力＝力×速さ」でも求められます。この例では速さ2÷10＝0.2m/sなので、980×0.2＝196Wです。", "text": "一定の力・速さで同じ向きに動かす場合は「動力＝力×速さ」でも求められます。この例では速さ2÷10＝0.2m/sなので、980×0.2＝196Wです。", "terms": [], "block": "4-7-52647ddf9136"}, {"id": "4-7/34/text", "raw": "**効率η＝有効な出力÷入力**。効率75％なら、入力のうち75％が荷を上げる仕事に使われるので、必要な入力は出力を0.75で割ります。", "text": "効率η＝有効な出力÷入力。効率75％なら、入力のうち75％が荷を上げる仕事に使われるので、必要な入力は出力を0.75で割ります。", "terms": ["有効な出力÷入力", "効率"], "block": "4-7-b719f81c4ec3"}, {"id": "4-7/35/text", "raw": "質量2000kgを毎秒0.3mで上げると、荷へ伝わる動力は2000×9.8×0.3＝**5.88kW**。巻上機構の効率75％なら、必要なモーター軸出力は5.88÷0.75＝**7.84kW**。電気入力を求める場合は、モーター自身の効率も別に考えます。", "text": "質量2000kgを毎秒0.3mで上げると、荷へ伝わる動力は2000×9.8×0.3＝5.88kW。巻上機構の効率75％なら、必要なモーター軸出力は5.88÷0.75＝7.84kW。電気入力を求める場合は、モーター自身の効率も別に考えます。", "terms": [], "block": "4-7-f2bdc9b75770"}, {"id": "4-7/37/text", "raw": "質量1200kgを0.5m上げる仕事は5880J。滑車装置の効率80％なら入力仕事は5880÷0.8＝**7350J**。自由端を2m引くなら、平均の引く力は7350÷2＝**3675N** です。摩擦がある装置で、全てのロープ部分の張力が等しいとは仮定しません。", "text": "質量1200kgを0.5m上げる仕事は5880J。滑車装置の効率80％なら入力仕事は5880÷0.8＝7350J。自由端を2m引くなら、平均の引く力は7350÷2＝3675N です。摩擦がある装置で、全てのロープ部分の張力が等しいとは仮定しません。", "terms": [], "block": "4-7-849f22a5c173"}], "candidates": [{"id": "4-7/3/text#0", "fieldID": "4-7/3/text", "block": "4-7-bb7ec8897a58", "answer": "定滑車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "定滑車は、軸の位置が動かない滑車。引く力の向きを変えますが、力の大きさは変わりません。天井クレーンのトロリなどに付いています。", "start16": 0, "end16": 3}, {"id": "4-7/4/text#0", "fieldID": "4-7/4/text", "block": "4-7-fc1f2307ef2c", "answer": "動滑車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "動滑車は、荷と一緒に軸が動く滑車。フックブロックなどに使われます。2本のロープで支えれば、引く力は荷の重量の1/2です。", "start16": 0, "end16": 3}, {"id": "4-7/6/text#63", "fieldID": "4-7/6/text", "block": "4-7-99 const params=new URLSearchParams(location.search);
let current=sections.find(s=>s.id===(params.get('section')||'2-1'))||sections[0];
let on=params.get('quiz')!=='off', category=params.get('cat')||'all', round=0, revealed=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(i,name)=>current.id+'/'+i+'/'+name;
const text=(raw,id,cl='')=>'<div class="text '+cl+'"'+(id?' data-field="'+esc(id)+'"':'')+' data-raw="'+esc(raw)+'">'+rich(raw)+'</div>';
function rich(raw){return esc(raw).replace(/\*\*(.*?)\*\*/gs,'<strong>$1</strong>')}
function chosen(){return current.rounds[category]?.[round%current.rounds[category].length]||[]}
function selected(){const ids=chosen();return current.candidates.filter(b=>ids.includes(b.id))}
function render(){
 $('title').textContent=current.title;
 $('quiz').innerHTML='<div class="card quiz-card"><div class="toggle-row"><div><strong>暗記クイズ</strong><div class="sub muted">本文の空欄を、頭の中で答える</div></div><label class="switch-label"><input id="quizToggle" type="checkbox" role="switch" class="switch" aria-label="暗記クイズ" '+(on?'checked':'')+'></label></div>'+
 (on?((current.candidates.some(b=>b.category==='num')&&current.candidates.some(b=>b.category==='key'))?'<div class="category"><span class="sub muted">出題する内容</span><select id="category" aria-label="出題する内容"><option value="all">すべて</option><option value="key">用語・式</option><option value="num">数値</option></select></div>':'')+
 '<p class="sub">空欄をタップすると答えを確認できます。もう一度タップで隠せます。</p><p class="hint">1回に最大10か所。見出しや図はヒントに使えます。</p>':'')+'</div>';
 if($('category')) $('category').value=category;
 $('content').innerHTML=current.blocks.map((b,i)=>{
  if(b.type==='sub')return '<h2>'+rich(b.text)+'</h2>';
  if(b.type==='p'){
   if(b.style==='answer')return '<details><summary>答えと理由を見る</summary>'+text(b.text)+'</details>';
   if(b.style==='reference')return '<div class="card muted">'+rich(b.text)+'</div>';
   let name=['question','lead'].includes(b.style)?null:field(i,'text');
   if(['lead','tip','caution'].includes(b.style))return '<div class="card '+b.style+'"><div class="tag">'+({lead:'まず、これだけ',tip:'なるほど',caution:'取り違え注意'}[b.style])+'</div>'+text(b.text,name)+'</div>';
   return text(b.text,name,'paragraph');
  }
  if(['ul','point'].includes(b.type))return '<div class="'+(b.type==='point'?'card point':'')+'">'+(b.type==='point'?'<div class="tag">ここを覚える</div>':'')+'<ul>'+b.items.map((t,j)=>'<li>'+text(t,field(i,'items:'+j))+'</li>').join('')+'</ul></div>';
  if(b.type==='table'){
   if(b.style==='numbers')return b.rows.map((r,j)=>'<div class="card number">'+text(r[0],null,'label')+text(r.slice(1).join(' ／ '),field(i,'rows:'+j+':value'),'value')+'</div>').join('');
   if(b.headers.length<=2||b.style==='matrix')return '<table><thead><tr>'+b.headers.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map((r,j)=>'<tr>'+r.map((v,k)=>'<td data-label="'+esc(b.headers[k])+'">'+text(v,field(i,'rows:'+j+':'+k))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
   return b.rows.map((r,j)=>'<div class="card">'+text(r[0],field(i,'rows:'+j+':0'))+r.slice(1).map((v,k)=>'<div class="hint">'+rich(b.headers[k+1])+'</div>'+text(v,field(i,'rows:'+j+':'+(k+1)))).join('')+'</div>').join('');
  }
  if(['img','svg'].includes(b.type)){
   let file=b._previewFile;
   return '<figure class="figure" style="margin:18px 0"><img width="\'+(b._width||1536)+\'" height="\'+(b._height||1024)+\'" loading="lazy" src="../../CraneExam/Resources/images/'+encodeURIComponent(file)+'" alt="'+esc(b.caption||'教材の図')+'">'+(b.caption?'<small>図：'+esc(b.caption)+'</small>':'')+'</figure>';
  }
  return '';
 }).join('');
 paint();
}
function paint(){
 document.querySelectorAll('[data-field]').forEach(node=>{
  const id=node.dataset.field, source=current.fields.find(f=>f.id===id);
  if(!on||!source){node.innerHTML=rich(node.dataset.raw);return;}
  const blanks=selected().filter(b=>b.fieldID===id).sort((a,b)=>a.start16-b.start16);
  if(!blanks.length){node.innerHTML=rich(node.dataset.raw);return;}
  let pos=0,out='';
  blanks.forEach(b=>{
   out+=esc(source.text.slice(pos,b.start16));
   const yes=revealed.has(b.id), label=yes?b.answer:b.prompt;
   out+='<button class="blank '+(yes?'revealed':'')+'" data-answer="'+esc(b.id)+'" aria-pressed="'+yes+'" aria-label="'+esc(label+(yes?'。タップで隠す':'。タップで答えを表示'))+'">'+esc(label)+'</button>';
   pos=b.end16;
  });
  node.innerHTML=out+esc(source.text.slice(pos));
 });

 document.querySelector('main').style.paddingBottom=(on?$('toolbar').offsetHeight+24:32)+'px';

}

document.addEventListener('change',e=>{

 if(e.target.id==='category'){category=e.target.value;round=0;revealed.clear();paint()}
 if(e.target.id==='quizToggle'){on=e.target.checked;revealed.clear();render()}
 if(e.target.id==='dark'){document.body.classList.toggle('dark',e.target.checked);paint()}
 if(e.target.id==='large'){document.body.classList.toggle('large',e.target.checked);paint()}
});
document.addEventListener('click',e=>{
 const answer=e.target.closest('[data-answer]');
 if(answer){let id=answer.dataset.answer;revealed.has(id)?revealed.delete(id):revealed.add(id);paint()}
 if(e.target.id==='answers'){revealed=revealed.size===chosen().length?new Set():new Set(chosen());paint()}
 if(e.target.id==='end'){on=false;revealed.clear();render()}
 if(e.target.id==='next'){
  const before=[...chosen()].sort().join('|');
  for(let i=0;i<current.candidates.length;i++){round++;if([...chosen()].sort().join('|')!==before)break;}
  revealed.clear();paint();
 }
 if(e.target.id==='jump')document.querySelector('.blank')?.scrollIntoView({block:'center',behavior:'instant'});
});
if(params.get('theme')==='dark'){$('dark').checked=true;document.body.classList.add('dark')}
if(params.get('large')==='1'){$('large').checked=true;document.body.classList.add('large')}
window.addEventListener('resize',paint);
render();
</script></body></html>
