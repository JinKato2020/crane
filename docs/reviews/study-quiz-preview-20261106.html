ws:1:0#0", "1-5/3/text#84", "1-5/13/text#0"], ["1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1"], ["1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0"], ["1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13"], ["1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88"], ["1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1"], ["1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30"], ["1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0"], ["1-5/3/text#84", "1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32"], ["1-5/13/text#0", "1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19"], ["1-5/31/text#1", "1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0"], ["1-5/5/rows:0:0#0", "1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84"]], "num": [[]]}}, {"title": "作動装置――電動機の回転を荷の動きへ変える", "blocks": [{"type": "p", "style": "lead", "text": "モーターの回転を、歯車やドラムへ伝えて荷を動かします。**力が伝わる順番** を見るのがコツです。", "id": "1-6-31f9183de858"}, {"type": "sub", "text": "巻上装置の力の伝わり方", "id": "1-6-59cf53f8ce2d"}, {"type": "p", "text": "電動機が回転しても、そのままでは荷をつり上げるのに適した速度や回す力にならないことがあります。そこで、回転を**減速機**へ伝え、回転数を下げてドラムを回します。ドラムがロープを巻き取ると、フックが上がります。", "id": "1-6-a51709b8b32b", "quizTerms": ["減速機"]}, {"type": "p", "text": "力の流れは、「電動機→**減速機**→ドラム→ワイヤロープ→フックなどのつり具→荷」です。部品名が分からなくなったら、この流れのどの位置にあるかへ戻りましょう。", "id": "1-6-6d3af652522d"}, {"type": "img", "asset": "1-6_hoist_system_readable21", "caption": "巻上装置。電動機 → 制動用ブレーキ → 減速機 → ドラム → ワイヤロープ → フック 制動用ブレーキは荷を保持し、巻上げ・巻下げを停止させる。図は代表的な配置", "legend": [], "labels": [], "id": "1-6-d3f28d81f227", "style": "figure", "_previewFile": "1-6_hoist_system_readable21.png", "_width": 2000, "_height": 1750}, {"type": "p", "text": "「**トルク**」は、軸を回そうとする働きです。電動機の速い回転をゆっくりした回転へ変えると、損失を無視した場合、出力側で大きなトルクを得られます。自転車を低いギアにすると速く進めない代わりに坂を上りやすくなるように、速さと回す働きを交換する、と考えると理解しやすくなります。", "id": "1-6-81f09c6018d6", "quizTerms": ["トルク"]}, {"type": "p", "text": "巻上装置には、荷を保持する**ブレーキ**も必要です。電動機を止めたとしても、荷の重さでドラムが逆に回れば荷が下がってしまいます。ブレーキが回転を止めて保持することで、フックを空中の位置にとどめます。", "id": "1-6-94c8797f0a09", "quizTerms": ["保持"]}, {"type": "p", "text": "**制動用ブレーキ**は動きを止め、荷を保持します。**速度制御用ブレーキ**は、荷を下ろす速さを調整します。「止めておく」と「速さを整える」を区別しましょう。", "id": "1-6-e6bde1b91926", "quizTerms": ["制動用ブレーキ", "速度制御用ブレーキ"]}, {"type": "sub", "text": "主巻と補巻", "id": "1-6-633eac74bd94"}, {"type": "p", "text": "一台のクレーンに、大きな荷を扱う巻上装置と、小さな荷を扱う巻上装置を備えることがあります。大きな能力のものを「**主巻**」、補助的なものを「補巻」と呼びます。", "id": "1-6-79c25c9ce983", "quizTerms": ["主巻", "補巻"]}, {"type": "p", "text": "一般に、主巻は大きな**定格荷重**で低速、補巻は小さな定格荷重で高速です。重い荷を扱うときは主巻、軽い荷を効率よく動かすときは補巻、と使い分ける場面を考えてください。具体的な能力や速度は、その機械の仕様で確認します。", "id": "1-6-4cfe5c860a99"}, {"type": "sub", "text": "走行装置とほかの装置", "id": "1-6-875acbbe8668"}, {"type": "p", "text": "走行装置は、クレーン全体を**走行レール**に沿って動かします。1電動機式では、一台の電動機から長い走行軸を通して、左右のサドルへ動力を伝えます。2電動機式では、左右のサドルをそれぞれの電動機で動かします。4電動機式もあり、大型機などに使われます。", "id": "1-6-9339df24f907", "quizTerms": ["1電動機式", "2電動機式"]}, {"type": "img", "asset": "1-6_travel_drive_readable21", "caption": "走行装置の電動機配置", "legend": [], "labels": [], "id": "1-6-2d8f3fb83e0b", "style": "figure", "_previewFile": "1-6_travel_drive_readable21.png", "_width": 2000, "_height": 1450}, {"type": "p", "text": "横行装置は**トロリ**を動かし、起伏装置はジブの角度を変え、旋回装置は旋回体の向きを変えます。引込装置は、荷をほぼ水平に移動させます。名称の違いは、どの運動を担当するかの違いです。", "id": "1-6-882ce4430003"}, {"type": "img", "asset": "1-6_supplement_f11_20261023", "labels": [], "legend": [], "caption": "モーターの回転が車輪へ伝わり、トロリが動く。", "id": "1-6-e6e0c822e7c8", "style": "figure", "_previewFile": "1-6_supplement_f11_20261023.png", "_width": 1473, "_height": 1068}, {"type": "p", "text": "左右の走行がそろわないと、クレーンはまっすぐ進まず斜めになろうとします。この問題を抑えるのが、後で学ぶ**斜行防止装置**です。", "id": "1-6-ef00a9cbec70", "quizTerms": ["斜行防止装置"]}, {"type": "img", "asset": "1-6_supplement_f12_20261023", "labels": [], "legend": [], "caption": "起伏ロープを巻き取り・繰り出し、ジブの角度を変える。", "id": "1-6-19cc6a9b5ded", "style": "figure", "_previewFile": "1-6_supplement_f12_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "旋回装置――どうやって向きを変えるのか", "id": "1-6-9386be2836f0"}, {"type": "svg", "file": "1-6_slewing.svg", "caption": "旋回装置(センターポスト方式)。外歯かみ合いの原理を示す模式図。実際の駆動装置・支持構造は機種により異なる", "id": "1-6-424358a9b14a", "style": "figure", "_previewFile": "1-6_slewing.svg"}, {"type": "p", "text": "ジブクレーンなどが向きを変える（旋回する）ための装置です。電動機・減速装置・固定歯車・ピニオン（小歯車）などでできています。代表的なしくみに「**センターポスト方式**」と「旋回環（せんかいかん）方式」があります。", "id": "1-6-1590e94a72f4", "quizTerms": ["ピニオン"]}, {"type": "p", "text": "**センターポスト方式**では、動かない側（非旋回体）の支持台に固定歯車とローラパス（円形のレール）があり、回る側（旋回体）に電動機・減速装置・ピニオン・ローラがあります。ピニオンを回すと、ピニオンが固定歯車の外周に沿って回り、旋回体が中心の柱（センターポスト）を軸にして旋回します。", "id": "1-6-866557805187"}, {"type": "p", "text": "「固定された歯車のまわりを、小歯車が歩いて回る」とイメージすると分かりやすいです。", "id": "1-6-044c3fd008cb"}], "id": "1-6", "chapter": 1, "fields": [{"id": "1-6/2/text", "raw": "電動機が回転しても、そのままでは荷をつり上げるのに適した速度や回す力にならないことがあります。そこで、回転を**減速機**へ伝え、回転数を下げてドラムを回します。ドラムがロープを巻き取ると、フックが上がります。", "text": "電動機が回転しても、そのままでは荷をつり上げるのに適した速度や回す力にならないことがあります。そこで、回転を減速機へ伝え、回転数を下げてドラムを回します。ドラムがロープを巻き取ると、フックが上がります。", "terms": ["減速機"], "block": "1-6-a51709b8b32b"}, {"id": "1-6/3/text", "raw": "力の流れは、「電動機→**減速機**→ドラム→ワイヤロープ→フックなどのつり具→荷」です。部品名が分からなくなったら、この流れのどの位置にあるかへ戻りましょう。", "text": "力の流れは、「電動機→減速機→ドラム→ワイヤロープ→フックなどのつり具→荷」です。部品名が分からなくなったら、この流れのどの位置にあるかへ戻りましょう。", "terms": [], "block": "1-6-6d3af652522d"}, {"id": "1-6/5/text", "raw": "「**トルク**」は、軸を回そうとする働きです。電動機の速い回転をゆっくりした回転へ変えると、損失を無視した場合、出力側で大きなトルクを得られます。自転車を低いギアにすると速く進めない代わりに坂を上りやすくなるように、速さと回す働きを交換する、と考えると理解しやすくなります。", "text": "「トルク」は、軸を回そうとする働きです。電動機の速い回転をゆっくりした回転へ変えると、損失を無視した場合、出力側で大きなトルクを得られます。自転車を低いギアにすると速く進めない代わりに坂を上りやすくなるように、速さと回す働きを交換する、と考えると理解しやすくなります。", "terms": ["トルク"], "block": "1-6-81f09c6018d6"}, {"id": "1-6/6/text", "raw": "巻上装置には、荷を保持する**ブレーキ**も必要です。電動機を止めたとしても、荷の重さでドラムが逆に回れば荷が下がってしまいます。ブレーキが回転を止めて保持することで、フックを空中の位置にとどめます。", "text": "巻上装置には、荷を保持するブレーキも必要です。電動機を止めたとしても、荷の重さでドラムが逆に回れば荷が下がってしまいます。ブレーキが回転を止めて保持することで、フックを空中の位置にとどめます。", "terms": ["保持"], "block": "1-6-94c8797f0a09"}, {"id": "1-6/7/text", "raw": "**制動用ブレーキ**は動きを止め、荷を保持します。**速度制御用ブレーキ**は、荷を下ろす速さを調整します。「止めておく」と「速さを整える」を区別しましょう。", "text": "制動用ブレーキは動きを止め、荷を保持します。速度制御用ブレーキは、荷を下ろす速さを調整します。「止めておく」と「速さを整える」を区別しましょう。", "terms": ["制動用ブレーキ", "速度制御用ブレーキ"], "block": "1-6-e6bde1b91926"}, {"id": "1-6/9/text", "raw": "一台のクレーンに、大きな荷を扱う巻上装置と、小さな荷を扱う巻上装置を備えることがあります。大きな能力のものを「**主巻**」、補助的なものを「補巻」と呼びます。", "text": "一台のクレーンに、大きな荷を扱う巻上装置と、小さな荷を扱う巻上装置を備えることがあります。大きな能力のものを「主巻」、補助的なものを「補巻」と呼びます。", "terms": ["主巻", "補巻"], "block": "1-6-79c25c9ce983"}, {"id": "1-6/10/text", "raw": "一般に、主巻は大きな**定格荷重**で低速、補巻は小さな定格荷重で高速です。重い荷を扱うときは主巻、軽い荷を効率よく動かすときは補巻、と使い分ける場面を考えてください。具体的な能力や速度は、その機械の仕様で確認します。", "text": "一般に、主巻は大きな定格荷重で低速、補巻は小さな定格荷重で高速です。重い荷を扱うときは主巻、軽い荷を効率よく動かすときは補巻、と使い分ける場面を考えてください。具体的な能力や速度は、その機械の仕様で確認します。", "terms": [], "block": "1-6-4cfe5c860a99"}, {"id": "1-6/12/text", "raw": "走行装置は、クレーン全体を**走行レール**に沿って動かします。1電動機式では、一台の電動機から長い走行軸を通して、左右のサドルへ動力を伝えます。2電動機式では、左右のサドルをそれぞれの電動機で動かします。4電動機式もあり、大型機などに使われます。", "text": "走行装置は、クレーン全体を走行レールに沿って動かします。1電動機式では、一台の電動機から長い走行軸を通して、左右のサドルへ動力を伝えます。2電動機式では、左右のサドルをそれぞれの電動機で動かします。4電動機式もあり、大型機などに使われます。", "terms": ["1電動機式", "2電動機式"], "block": "1-6-9339df24f907"}, {"id": "1-6/14/text", "raw": "横行装置は**トロリ**を動かし、起伏装置はジブの角度を変え、旋回装置は旋回体の向きを変えます。引込装置は、荷をほぼ水平に移動させます。名称の違いは、どの運動を担当するかの違いです。", "text": "横行装置はトロリを動かし、起伏装置はジブの角度を変え、旋回装置は旋回体の向きを変えます。引込装置は、荷をほぼ水平に移動させます。名称の違いは、どの運動を担当するかの違いです。", "terms": [], "block": "1-6-882ce4430003"}, {"id": "1-6/16/text", "raw": "左右の走行がそろわないと、クレーンはまっすぐ進まず斜めになろうとします。この問題を抑えるのが、後で学ぶ**斜行防止装置**です。", "text": "左右の走行がそろわないと、クレーンはまっすぐ進まず斜めになろうとします。この問題を抑えるのが、後で学ぶ斜行防止装置です。", "terms": ["斜行防止装置"], "block": "1-6-ef00a9cbec70"}, {"id": "1-6/20/text", "raw": "ジブクレーンなどが向きを変える（旋回する）ための装置です。電動機・減速装置・固定歯車・ピニオン（小歯車）などでできています。代表的なしくみに「**センターポスト方式**」と「旋回環（せんかいかん）方式」があります。", "text": "ジブクレーンなどが向きを変える（旋回する）ための装置です。電動機・減速装置・固定歯車・ピニオン（小歯車）などでできています。代表的なしくみに「センターポスト方式」と「旋回環（せんかいかん）方式」があります。", "terms": ["ピニオン"], "block": "1-6-1590e94a72f4"}, {"id": "1-6/21/text", "raw": "**センターポスト方式**では、動かない側（非旋回体）の支持台に固定歯車とローラパス（円形のレール）があり、回る側（旋回体）に電動機・減速装置・ピニオン・ローラがあります。ピニオンを回すと、ピニオンが固定歯車の外周に沿って回り、旋回体が中心の柱（センターポスト）を軸にして旋回します。", "text": "センターポスト方式では、動かない側（非旋回体）の支持台に固定歯車とローラパス（円形のレール）があり、回る側（旋回体）に電動機・減速装置・ピニオン・ローラがあります。ピニオンを回すと、ピニオンが固定歯車の外周に沿って回り、旋回体が中心の柱（センターポスト）を軸にして旋回します。", "terms": [], "block": "1-6-866557805187"}, {"id": "1-6/22/text", "raw": "「固定された歯車のまわりを、小歯車が歩いて回る」とイメージすると分かりやすいです。", "text": "「固定された歯車のまわりを、小歯車が歩いて回る」とイメージすると分かりやすいです。", "terms": [], "block": "1-6-044c3fd008cb"}], "candidates": [{"id": "1-6/2/text#54", "fieldID": "1-6/2/text", "block": "1-6-a51709b8b32b", "answer": "減速機", "category": "key", "prompt": "［用語？］", "start": 54, "end": 57, "context": "電動機が回転しても、そのままでは荷をつり上げるのに適した速度や回す力にならないことがあります。そこで、回転を減速機へ伝え、回転数を下げてドラムを回します。ドラムがロープを巻き取ると、フックが上がります。", "start16": 54, "end16": 57}, {"id": "1-6/5/text#1", "fieldID": "1-6/5/text", "block": "1-6-81f09c6018d6", "answer": "トルク", "category": "key", "prompt": "［用語？］", "start": 1, "end": 4, "context": "「トルク」は、軸を回そうとする働きです。電動機の速い回転をゆっくりした回転へ変えると、損失を無視した場合、出力側で大きなトルクを得られます。自転車を低いギアにすると速く進めない代わりに坂を上りやすくなるように、速さと回す働きを交換する、と考えると理解しやすくなります。", "start16": 1, "end16": 4}, {"id": "1-6/6/text#9", "fieldID": "1-6/6/text", "block": "1-6-94c8797f0a09", "answer": "保持", "category": "key", "prompt": "［用語？］", "start": 9, "end": 11, "context": "巻上装置には、荷を保持するブレーキも必要です。電動機を止めたとしても、荷の重さでドラムが逆に回れば荷が下がってしまいます。ブレーキが回転を止めて保持することで、フックを空中の位置にとどめます。", "start16": 9, "end16": 11}, {"id": "1-6/7/text#0", "fieldID": "1-6/7/text", "block": "1-6-e6bde1b91926", "answer": "制動用ブレーキ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "制動用ブレーキは動きを止め、荷を保持します。速度制御用ブレーキは、荷を下ろす速さを調整します。「止めておく」と「速さを整える」を区別しましょう。", "start16": 0, "end16": 7}, {"id": "1-6/7/text#22", "fieldID": "1-6/7/text", "block": "1-6-e6bde1b91926", "answer": "速度制御用ブレーキ", "category": "key", "prompt": "［用語？］", "start": 22, "end": 31, "context": "制動用ブレーキは動きを止め、荷を保持します。速度制御用ブレーキは、荷を下ろす速さを調整します。「止めておく」と「速さを整える」を区別しましょう。", "start16": 22, "end16": 31}, {"id": "1-6/9/text#55", "fieldID": "1-6/9/text", "block": "1-6-79c25c9ce983", "answer": "主巻", "category": "key", "prompt": "［用語？］", "start": 55, "end": 57, "context": "一台のクレーンに、大きな荷を扱う巻上装置と、小さな荷を扱う巻上装置を備えることがあります。大きな能力のものを「主巻」、補助的なものを「補巻」と呼びます。", "start16": 55, "end16": 57}, {"id": "1-6/9/text#67", "fieldID": "1-6/9/text", "block": "1-6-79c25c9ce983", "answer": "補巻", "category": "key", "prompt": "［用語？］", "start": 67, "end": 69, "context": "一台のクレーンに、大きな荷を扱う巻上装置と、小さな荷を扱う巻上装置を備えることがあります。大きな能力のものを「主巻」、補助的なものを「補巻」と呼びます。", "start16": 67, "end16": 69}, {"id": "1-6/12/text#28", "fieldID": "1-6/12/text", "block": "1-6-9339df24f907", "answer": "1電動機式", "category": "num", "prompt": "［数値？］", "start": 28, "end": 33, "context": "走行装置は、クレーン全体を走行レールに沿って動かします。1電動機式では、一台の電動機から長い走行軸を通して、左右のサドルへ動力を伝えます。2電動機式では、左右のサドルをそれぞれの電動機で動かします。4電動機式もあり、大型機などに使われます。", "start16": 28, "end16": 33}, {"id": "1-6/12/text#69", "fieldID": "1-6/12/text", "block": "1-6-9339df24f907", "answer": "2電動機式", "category": "num", "prompt": "［数値？］", "start": 69, "end": 74, "context": "走行装置は、クレーン全体を走行レールに沿って動かします。1電動機式では、一台の電動機から長い走行軸を通して、左右のサドルへ動力を伝えます。2電動機式では、左右のサドルをそれぞれの電動機で動かします。4電動機式もあり、大型機などに使われます。", "start16": 69, "end16": 74}, {"id": "1-6/16/text#51", "fieldID": "1-6/16/text", "block": "1-6-ef00a9cbec70", "answer": "斜行防止装置", "category": "key", "prompt": "［用語？］", "start": 51, "end": 57, "context": "左右の走行がそろわないと、クレーンはまっすぐ進まず斜めになろうとします。この問題を抑えるのが、後で学ぶ斜行防止装置です。", "start16": 51, "end16": 57}, {"id": "1-6/20/text#43", "fieldID": "1-6/20/text", "block": "1-6-1590e94a72f4", "answer": "ピニオン", "category": "key", "prompt": "［用語？］", "start": 43, "end": 47, "context": "ジブクレーンなどが向きを変える（旋回する）ための装置です。電動機・減速装置・固定歯車・ピニオン（小歯車）などでできています。代表的なしくみに「センターポスト方式」と「旋回環（せんかいかん）方式」があります。", "start16": 43, "end16": 47}], "rounds": {"all": [["1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69"], ["1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0"], ["1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54"], ["1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9"], ["1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51"], ["1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55"], ["1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67"], ["1-6/7/text#22", "1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1"], ["1-6/12/text#28", "1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43"], ["1-6/12/text#69", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22"], ["1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/12/text#28"]], "key": [["1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0"], ["1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54"], ["1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9"], ["1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51"], ["1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55"], ["1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67"], ["1-6/20/text#43", "1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1"], ["1-6/7/text#22", "1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43"], ["1-6/7/text#0", "1-6/2/text#54", "1-6/6/text#9", "1-6/16/text#51", "1-6/9/text#55", "1-6/9/text#67", "1-6/5/text#1", "1-6/20/text#43", "1-6/7/text#22"]], "num": [["1-6/12/text#28", "1-6/12/text#69"], ["1-6/12/text#69", "1-6/12/text#28"]]}}, {"title": "歯車・軸・軸受・ボルト――回転を伝えて支える部品", "blocks": [{"type": "p", "style": "lead", "text": "**歯車は回転を伝え、軸は回り、軸受は軸を支える。** 部品の名前と役目を結びつけます。", "id": "1-9-62091ada1b8e"}, {"type": "sub", "text": "駆動歯車と従動歯車", "id": "1-9-8ac5d94f7fdc"}, {"type": "p", "text": "歯車は、歯をかみ合わせて回転を別の軸へ伝える部品です。電動機側から回す歯車を「**駆動歯車**」、それに回される歯車を「従動歯車」または「被動歯車」といいます。「駆動」は動かす側、「従動」は動かされる側です。", "id": "1-9-2bf5a78ff490", "quizTerms": ["駆動歯車", "従動歯車"]}, {"type": "svg", "file": "1-9_gears.svg", "caption": "歯車の種類とかみ合い", "id": "1-9-53b0d10d2abe", "style": "figure", "_previewFile": "1-9_gears.svg"}, {"type": "p", "text": "例として、歯数30の**駆動歯車**が歯数60の従動歯車を回す場合を考えます。小さい歯車が一回転して30枚分の歯を送っても、大きい歯車は60枚のうち30枚分しか進まないため、半回転です。小さい歯車が二回転すると、大きい歯車が一回転します。", "id": "1-9-a6b146974ac9"}, {"type": "p", "text": "この回転数の比を「**減速比**」といいます。", "id": "1-9-7fd28b40b8c1"}, {"type": "p", "text": "減速比＝従動歯車の歯数÷**駆動歯車**の歯数", "id": "1-9-710aa635dfb5"}, {"type": "p", "text": "この例の**減速比**は60÷30＝2です。入力が毎分300回転なら、出力は300÷2＝毎分150回転です。回転数を求めるときは、入力回転数を減速比で割ります。", "id": "1-9-426fb77fe168"}, {"type": "p", "text": "外側の歯同士がかみ合う外歯車二個では、回転方向は逆です。一方が時計回りなら、もう一方は反時計回りになります。回転数の大小と回転方向は、別々に確認してください。", "id": "1-9-2210507dfc77"}, {"type": "sub", "text": "二段の減速比は掛け合わせる", "id": "1-9-7541870e4d54"}, {"type": "svg", "file": "1-9_two_stage_gear.svg", "caption": "A・Cは20歯、B・Dは60歯。BとCは同じ軸で同じ回転数。歯の形は模式で示す。", "id": "1-9-9f99295d5c14", "style": "figure", "_previewFile": "1-9_two_stage_gear.svg"}, {"type": "p", "text": "1段目は60÷20＝**3**、2段目も60÷20＝**3**。全体の減速比は3×3＝**9**です。段ごとの比は足さず、掛け合わせます。", "id": "1-9-62f550fb0f0d"}, {"type": "p", "text": "Aが毎分**900回転**なら、Bは900÷3＝**300回転**。Bと同じ軸のCも300回転です。Dは300÷3＝**100回転**になります。", "id": "1-9-2b24fd06fe7e"}, {"type": "p", "text": "この計算では、BとCが同じ軸に固定され、同じ回転数で回ることが条件です。歯数だけを拾うのではなく、どれが同じ軸で回り、どれとかみ合うかを先に確認しましょう。", "id": "1-9-b3fcf5c3dee7"}, {"id": "1-9-rev26-gear-reverse-q", "type": "p", "text": "**確認：** 図と同じ歯数で、Bが毎分300回転なら、AとDは毎分何回転？", "style": "question"}, {"id": "1-9-rev26-gear-reverse-a", "type": "p", "text": "**Aは900回転、Dは100回転。** A＝300×60÷20。CはBと同じ300回転なので、D＝300×20÷60。かみ合う歯車では「回転数×歯数」が等しくなります。", "style": "answer"}, {"type": "sub", "text": "歯車の種類", "id": "1-9-c2e6c81ca0fc"}, {"type": "p", "text": "「**平歯車**」は、まっすぐな歯を持ち、平行な軸同士に回転を伝えます。基本的な歯車として、まずこの形を思い浮かべてください。", "id": "1-9-d8c6f3100dee"}, {"type": "p", "text": "**はすば歯車**は、歯が斜めで、順にかみ合うため滑らかに回ります。平歯車より**大きな減速比にできる**特徴があります。一方、軸の長さ方向へ押す力（**スラスト**）が生じます。回転数の計算には歯数の比を使います。", "id": "1-9-e51b5daf8e13"}, {"type": "p", "text": "「かさ歯車」は、円錐状の形をした歯車です。交差する二本の軸の間で回転を伝えます。「**ウォーム歯車**」は、ねじに似たウォームと歯車を組み合わせ、一組で大きな減速比を得られます。ただし、摩擦による損失が比較的大きい形式です。", "id": "1-9-0a0e1cdaa4b6"}, {"type": "p", "text": "歯車の種類は、まず「軸が平行か、交差するか」「歯がまっすぐか、斜めか、ねじ状か」で見分けます。その後で用途や特徴を結び付けましょう。", "id": "1-9-e5175d94d713"}, {"id": "1-9-rev26-gear-types", "type": "table", "headers": ["種類", "形・覚える特徴"], "rows": [["**平歯車**", "まっすぐな歯。平行な軸に伝える"], ["**はすば歯車**", "斜めの歯。滑らか・大きな減速比・スラスト"], ["**かさ歯車**", "円錐の形。交差する軸に伝える"], ["**ウォーム歯車**", "ねじと歯車。一組で大きく減速できる"]], "quizTerms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"]}, {"type": "sub", "text": "軸と軸受", "id": "1-9-dd873e07f972"}, {"type": "p", "text": "「軸」は、回転を伝える棒状の部品です。「**軸受**」は、その軸を支えながら回転しやすくする部品です。軸受がないと、軸を決められた位置に保ち、滑らかに回すことが難しくなります。", "id": "1-9-6a6672d1588a"}, {"type": "img", "asset": "1-9_supplement_f18_20261023", "labels": [], "legend": [], "caption": "左は車輪と軸が一体で回り、支持部の軸受で支える例。右は軸を固定し、車輪の中心の軸受で回す例。", "id": "1-9-3294a4f5ac4a", "style": "figure", "_previewFile": "1-9_supplement_f18_20261023.png", "_width": 1472, "_height": 1068}, {"type": "img", "asset": "1-9_bearings_readable21", "caption": "軸受。受けられる荷重の種類・大きさは軸受の形式による。玉軸受の対応範囲も形式で異なる", "legend": [], "labels": [], "id": "1-9-a85f0640740e", "style": "figure", "_previewFile": "1-9_bearings_readable21.png", "_width": 2000, "_height": 1750}, {"type": "p", "text": "「平軸受」は、軸と軸受の面が滑り合う方式です。滑る面の潤滑が重要になります。「**転がり軸受**」は、玉やころを間に入れ、その転がりを利用する方式です。滑る代わりに転がして摩擦を小さくする、と考えてください。", "id": "1-9-257233d699a5"}, {"type": "p", "text": "軸に直角の向きの荷重を「**ラジアル荷重**」、軸の長さ方向の荷重を「スラスト荷重」といいます。横向きの軸に車輪が付いている例なら、車輪の重さで下向きに押されるのはラジアル荷重、軸の端を横から押すのはスラスト荷重です。軸受は、受ける力の方向に合うものを使います。", "id": "1-9-91b7e33fee65", "quizTerms": ["ラジアル荷重", "スラスト荷重"]}, {"type": "p", "text": "**円すいころ軸受**は、ラジアル荷重と、片方向のスラスト荷重を受けられます。「両方向」と覚えるのでなく、力の種類と向きを図で確かめます。", "id": "1-9-a27fe955c840"}, {"type": "img", "asset": "1-9_thrust_bearing_readable21", "caption": "スラスト軸受", "legend": [], "labels": [], "id": "1-9-5905cd7047fb", "style": "figure", "_previewFile": "1-9_thrust_bearing_readable21.png", "_width": 2000, "_height": 1750}, {"type": "p", "text": "給脂周期の代表値は、**平軸受：毎日1回程度、転がり軸受：6か月に1回程度**です。給油と点検の節で、方法と一緒に復習します。", "id": "1-9-86c9759b8817"}, {"type": "img", "asset": "1-9_supplement_f19_20261023", "labels": [], "legend": [], "caption": "円すいころ軸受はラジアル荷重と片方向のアキシアル荷重を受ける例。プランマブロックは軸受を収める軸受箱。", "id": "1-9-3b7fc7a26698", "style": "figure", "_previewFile": "1-9_supplement_f19_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "ボルトが力を伝える仕組み", "id": "1-9-3784c35a3ced"}, {"type": "p", "text": "ボルトは、部材同士をつなぐ部品です。ただし、すべてが同じ仕組みで横ずれを防ぐわけではありません。", "id": "1-9-bd85c1131fa4"}, {"type": "img", "asset": "1-9_bolts_readable21", "caption": "ボルト。引張を軸で受ける／締付けによる接触面の摩擦で滑りを止める／密着した軸で横ずれを受ける", "legend": [], "labels": [], "id": "1-9-bd1417d56648", "style": "figure", "_previewFile": "1-9_bolts_readable21.png", "_width": 1672, "_height": 941}, {"type": "p", "text": "**普通ボルト**は、接合方式に応じて、引張りやせん断などを受けます。「引張り」は長さ方向へ引き伸ばす力、「せん断」は横へずらして切ろうとする力です。", "id": "1-9-3ab055d88250"}, {"type": "p", "text": "摩擦接合に用いる**高力ボルト**は、板同士を強く締め付け、接触面の摩擦で滑りに抵抗します。板を重ねて強く押さえるとずれにくくなるように、押し付ける働きを利用します。このため、指定された締付けによって所定の軸力を与えることが重要です。", "id": "1-9-ea8fed30ee5f", "quizTerms": ["高力ボルト", "摩擦接合"]}, {"type": "p", "text": "**リーマボルト**は、精密に仕上げた穴に合わせて取り付けます。部材がずれようとすると、ボルトと穴の接触部分で押し合い、ボルトにはせん断の負担も生じます。接触面で押し合う働きを「支圧」といいます。", "id": "1-9-6645d96d140b", "quizTerms": ["リーマボルト"]}, {"type": "p", "text": "「高力ボルトの摩擦接合は接合面の摩擦、**リーマボルト**はせん断と支圧」と、力を伝える場所に注目して区別しましょう。", "id": "1-9-6e3a4140a308"}, {"type": "sub", "text": "ボルトを締めても緩まないために――座金", "id": "1-9-e404789400e6"}, {"type": "svg", "file": "1-9_washers_locking.svg", "caption": "平座金は座面を保護し、舌付き座金は舌を折り曲げて回り止めにする。", "id": "1-9-f4db742414ef", "style": "figure", "_previewFile": "1-9_washers_locking.svg"}, {"type": "p", "text": "座金（ざがね）は、ボルトやナットの座面（当たる面）と、締め付ける相手の面との間にはさむ輪です。平座金は、当たり面を保護し、面圧を広く分散させる働きが中心です。緩み止めを目的とする座金（ばね座金・**舌付き座金**など）は別にあり、次に種類を示します。", "id": "1-9-140e74158fb2"}, {"type": "p", "text": "**平座金**：当たり面が悪い所や傷つきやすい所にはさみ、面でならして支えます。", "id": "1-9-443151c0c567"}, {"type": "p", "text": "**勾配（こうばい）座金**：溝形鋼やI形鋼のように斜めの面を締めるとき、ボルトに曲げがかからないようにする座金です。", "id": "1-9-185f849ca2a5"}, {"type": "p", "text": "**ばね座金**：切り欠きのある輪のばね作用で、緩みを防ぐために使います。", "id": "1-9-f8a198c450a2"}, {"type": "p", "text": "**舌付き座金**：突き出た部分（舌）をナットなどに折り曲げて巻きつけ、回り止めにします。", "id": "1-9-7a186a4419ce"}, {"type": "sub", "text": "ナット自体で緩みを止める――緩み止め", "id": "1-9-3ad0a10395ad"}, {"type": "p", "text": "座金のほかに、ナット自体に工夫をして緩みを止めるものもあります。溝付きナットに割りピンを差す、ナットを二つ重ねる（**ダブルナット**）などの方法です。振動の多いクレーンでは、この緩み止めが大切です。", "id": "1-9-c37e55f19e6f", "quizTerms": ["割りピン"]}, {"type": "p", "text": "**ばねナット**は、ねじと同じ角度のばね鋼を**2～3巻き**して両端を結束した部品です。締めた六角ナットの上に取り付け、緩みを防ぎます。座面にはさむ「ばね座金」と区別します。", "id": "1-9-f7305bc0463f"}, {"type": "img", "asset": "1-9_supplement_f17_20261023", "labels": [], "legend": [], "caption": "ばねナットは巻いたばね鋼。六角ナットの上に取り付けて緩みを防ぐ。", "id": "1-9-667da58583c2", "style": "figure", "_previewFile": "1-9_supplement_f17_20261023.png", "_width": 1536, "_height": 1024}, {"type": "sub", "text": "回転を伝える軸と軸をつなぐ――軸継手", "id": "1-9-7152fca3a6df"}, {"type": "svg", "file": "1-9_couplings.svg", "caption": "軸継手の種類", "id": "1-9-3e09ddb3451b", "style": "figure", "_previewFile": "1-9_couplings.svg"}, {"type": "p", "text": "軸継手（じくつぎて）は、動力を伝えるために軸と軸をつなぐ部品です。大きく、2つの軸をまっすぐ一致させて固定する「固定軸継手」と、2軸の少しのずれや傾きをやわらげられる「**たわみ軸継手**」に分かれます。", "id": "1-9-d40253e51b4d", "quizTerms": ["たわみ軸継手"]}, {"type": "p", "text": "**割形軸継手**：二つ割りの円筒で軸を挟み、ボルトで固定します。軸を長さ方向へ動かさずに着脱でき、橋形クレーンの走行長軸などの低速軸に使います。2軸は一直線に合わせます。", "id": "1-9-21205886de6a"}, {"type": "p", "text": "**フランジ形固定軸継手**：2つの軸端のフランジ（つば）をリーマボルトでつなぎます。ボルトのせん断力（横ずれに耐える力）で動力を伝え、回転の速い軸（高速軸）に使います。", "id": "1-9-674ea6427831"}, {"type": "p", "text": "**フランジ形たわみ軸継手**：フランジの片側のボルト穴を大きくし、ボルトとの間にゴムのブッシュをはさみます。ゴムのたわみで、起動・停止の衝撃や2軸のずれ・傾きをやわらげ、軸の折損や軸受の発熱を防ぎます。電動機と減速機の連結によく使われます。", "id": "1-9-bb78fe066d41"}, {"type": "p", "text": "**歯車形軸継手**は歯のかみ合い、**ローラチェーン軸継手**は2個のスプロケットに掛けた2列のチェーンで動力を伝えます。どちらも、わずかな軸のずれや傾きに対応する、たわみ軸継手です。", "id": "1-9-58e35268d183"}, {"type": "img", "asset": "1-9_supplement_f20_20261023", "labels": [], "legend": [], "caption": "チェーンや歯のかみ合いで、2本の軸へ回転を伝える。", "id": "1-9-520a9fc47a1a", "style": "figure", "_previewFile": "1-9_supplement_f20_20261023.png", "_width": 1472, "_height": 1068}, {"type": "p", "text": "**自在軸継手（ユニバーサルカップリング）**：2軸が一直線上にない走行長軸などに使い、角度のついた軸どうしをつなぎます。", "id": "1-9-e5a0217196ba", "quizTerms": ["自在軸継手"]}, {"type": "p", "text": "「固定＝軸がまっすぐ」「たわみ＝少しのずれ・傾きを許す」「自在＝角度を許す」と、役割で覚えると整理できます。", "id": "1-9-aec570e8af9c"}, {"type": "sub", "text": "回転体を軸に固定する――キー", "id": "1-9-83fb64d30399"}, {"type": "svg", "file": "1-9_key.svg", "caption": "キーによる固定", "id": "1-9-09b7b565fb55", "style": "figure", "_previewFile": "1-9_key.svg"}, {"type": "p", "text": "キーは、歯車や車輪などの回転体を円い軸に固定し、軸と回転体（ボス）の相対的な回転（空回り）を止めるための角棒状の鉄片です。軸とボスの両方、または片方に「**キー溝**」を掘り、そこにキーを差し込みます。", "id": "1-9-49c354c9bad0"}, {"type": "p", "text": "勾配を付けて打ち込む「**こう配キー**」(くさびの働き)のほか、勾配のない「平行キー」もあり、すべてがくさび形というわけではありません。", "id": "1-9-10605e38b16d", "quizTerms": ["こう配キー", "平行キー"]}, {"id": "1-9-rev26-keyplate", "type": "p", "text": "**キー板（キープレート）**は、固定軸の回転や軸方向への抜け出しを防ぐ板です。軸の溝に差し込み、ボルトで固定します。歯車と軸の空回りを止めるキーとは、使う場所を区別します。"}, {"type": "sub", "text": "回転部分を覆う安全カバー", "id": "1-9-d337cc13214f"}, {"type": "img", "asset": "1-9_supplement_f21_20261023", "labels": [], "legend": [], "caption": "回転する歯車や軸継手などをガードで覆い、接触・巻き込まれを防ぐ。", "id": "1-9-d809205e7d6f", "style": "figure", "_previewFile": "1-9_supplement_f21_20261023.png", "_width": 1472, "_height": 1069}], "id": "1-9", "chapter": 1, "fields": [{"id": "1-9/2/text", "raw": "歯車は、歯をかみ合わせて回転を別の軸へ伝える部品です。電動機側から回す歯車を「**駆動歯車**」、それに回される歯車を「従動歯車」または「被動歯車」といいます。「駆動」は動かす側、「従動」は動かされる側です。", "text": "歯車は、歯をかみ合わせて回転を別の軸へ伝える部品です。電動機側から回す歯車を「駆動歯車」、それに回される歯車を「従動歯車」または「被動歯車」といいます。「駆動」は動かす側、「従動」は動かされる側です。", "terms": ["駆動歯車", "従動歯車"], "block": "1-9-2bf5a78ff490"}, {"id": "1-9/4/text", "raw": "例として、歯数30の**駆動歯車**が歯数60の従動歯車を回す場合を考えます。小さい歯車が一回転して30枚分の歯を送っても、大きい歯車は60枚のうち30枚分しか進まないため、半回転です。小さい歯車が二回転すると、大きい歯車が一回転します。", "text": "例として、歯数30の駆動歯車が歯数60の従動歯車を回す場合を考えます。小さい歯車が一回転して30枚分の歯を送っても、大きい歯車は60枚のうち30枚分しか進まないため、半回転です。小さい歯車が二回転すると、大きい歯車が一回転します。", "terms": [], "block": "1-9-a6b146974ac9"}, {"id": "1-9/5/text", "raw": "この回転数の比を「**減速比**」といいます。", "text": "この回転数の比を「減速比」といいます。", "terms": [], "block": "1-9-7fd28b40b8c1"}, {"id": "1-9/6/text", "raw": "減速比＝従動歯車の歯数÷**駆動歯車**の歯数", "text": "減速比＝従動歯車の歯数÷駆動歯車の歯数", "terms": [], "block": "1-9-710aa635dfb5"}, {"id": "1-9/7/text", "raw": "この例の**減速比**は60÷30＝2です。入力が毎分300回転なら、出力は300÷2＝毎分150回転です。回転数を求めるときは、入力回転数を減速比で割ります。", "text": "この例の減速比は60÷30＝2です。入力が毎分300回転なら、出力は300÷2＝毎分150回転です。回転数を求めるときは、入力回転数を減速比で割ります。", "terms": [], "block": "1-9-426fb77fe168"}, {"id": "1-9/8/text", "raw": "外側の歯同士がかみ合う外歯車二個では、回転方向は逆です。一方が時計回りなら、もう一方は反時計回りになります。回転数の大小と回転方向は、別々に確認してください。", "text": "外側の歯同士がかみ合う外歯車二個では、回転方向は逆です。一方が時計回りなら、もう一方は反時計回りになります。回転数の大小と回転方向は、別々に確認してください。", "terms": [], "block": "1-9-2210507dfc77"}, {"id": "1-9/11/text", "raw": "1段目は60÷20＝**3**、2段目も60÷20＝**3**。全体の減速比は3×3＝**9**です。段ごとの比は足さず、掛け合わせます。", "text": "1段目は60÷20＝3、2段目も60÷20＝3。全体の減速比は3×3＝9です。段ごとの比は足さず、掛け合わせます。", "terms": [], "block": "1-9-62f550fb0f0d"}, {"id": "1-9/12/text", "raw": "Aが毎分**900回転**なら、Bは900÷3＝**300回転**。Bと同じ軸のCも300回転です。Dは300÷3＝**100回転**になります。", "text": "Aが毎分900回転なら、Bは900÷3＝300回転。Bと同じ軸のCも300回転です。Dは300÷3＝100回転になります。", "terms": [], "block": "1-9-2b24fd06fe7e"}, {"id": "1-9/13/text", "raw": "この計算では、BとCが同じ軸に固定され、同じ回転数で回ることが条件です。歯数だけを拾うのではなく、どれが同じ軸で回り、どれとかみ合うかを先に確認しましょう。", "text": "この計算では、BとCが同じ軸に固定され、同じ回転数で回ることが条件です。歯数だけを拾うのではなく、どれが同じ軸で回り、どれとかみ合うかを先に確認しましょう。", "terms": [], "block": "1-9-b3fcf5c3dee7"}, {"id": "1-9/17/text", "raw": "「**平歯車**」は、まっすぐな歯を持ち、平行な軸同士に回転を伝えます。基本的な歯車として、まずこの形を思い浮かべてください。", "text": "「平歯車」は、まっすぐな歯を持ち、平行な軸同士に回転を伝えます。基本的な歯車として、まずこの形を思い浮かべてください。", "terms": [], "block": "1-9-d8c6f3100dee"}, {"id": "1-9/18/text", "raw": "**はすば歯車**は、歯が斜めで、順にかみ合うため滑らかに回ります。平歯車より**大きな減速比にできる**特徴があります。一方、軸の長さ方向へ押す力（**スラスト**）が生じます。回転数の計算には歯数の比を使います。", "text": "はすば歯車は、歯が斜めで、順にかみ合うため滑らかに回ります。平歯車より大きな減速比にできる特徴があります。一方、軸の長さ方向へ押す力（スラスト）が生じます。回転数の計算には歯数の比を使います。", "terms": [], "block": "1-9-e51b5daf8e13"}, {"id": "1-9/19/text", "raw": "「かさ歯車」は、円錐状の形をした歯車です。交差する二本の軸の間で回転を伝えます。「**ウォーム歯車**」は、ねじに似たウォームと歯車を組み合わせ、一組で大きな減速比を得られます。ただし、摩擦による損失が比較的大きい形式です。", "text": "「かさ歯車」は、円錐状の形をした歯車です。交差する二本の軸の間で回転を伝えます。「ウォーム歯車」は、ねじに似たウォームと歯車を組み合わせ、一組で大きな減速比を得られます。ただし、摩擦による損失が比較的大きい形式です。", "terms": [], "block": "1-9-0a0e1cdaa4b6"}, {"id": "1-9/20/text", "raw": "歯車の種類は、まず「軸が平行か、交差するか」「歯がまっすぐか、斜めか、ねじ状か」で見分けます。その後で用途や特徴を結び付けましょう。", "text": "歯車の種類は、まず「軸が平行か、交差するか」「歯がまっすぐか、斜めか、ねじ状か」で見分けます。その後で用途や特徴を結び付けましょう。", "terms": [], "block": "1-9-e5175d94d713"}, {"id": "1-9/21/rows:0:0", "raw": "**平歯車**", "text": "平歯車", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:0:1", "raw": "まっすぐな歯。平行な軸に伝える", "text": "まっすぐな歯。平行な軸に伝える", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:1:0", "raw": "**はすば歯車**", "text": "はすば歯車", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:1:1", "raw": "斜めの歯。滑らか・大きな減速比・スラスト", "text": "斜めの歯。滑らか・大きな減速比・スラスト", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:2:0", "raw": "**かさ歯車**", "text": "かさ歯車", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:2:1", "raw": "円錐の形。交差する軸に伝える", "text": "円錐の形。交差する軸に伝える", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:3:0", "raw": "**ウォーム歯車**", "text": "ウォーム歯車", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/21/rows:3:1", "raw": "ねじと歯車。一組で大きく減速できる", "text": "ねじと歯車。一組で大きく減速できる", "terms": ["減速比", "平歯車", "はすば歯車", "スラスト", "ウォーム歯車", "かさ歯車"], "block": "1-9-rev26-gear-types"}, {"id": "1-9/23/text", "raw": "「軸」は、回転を伝える棒状の部品です。「**軸受**」は、その軸を支えながら回転しやすくする部品です。軸受がないと、軸を決められた位置に保ち、滑らかに回すことが難しくなります。", "text": "「軸」は、回転を伝える棒状の部品です。「軸受」は、その軸を支えながら回転しやすくする部品です。軸受がないと、軸を決められた位置に保ち、滑らかに回すことが難しくなります。", "terms": [], "block": "1-9-6a6672d1588a"}, {"id": "1-9/26/text", "raw": "「平軸受」は、軸と軸受の面が滑り合う方式です。滑る面の潤滑が重要になります。「**転がり軸受**」は、玉やころを間に入れ、その転がりを利用する方式です。滑る代わりに転がして摩擦を小さくする、と考えてください。", "text": "「平軸受」は、軸と軸受の面が滑り合う方式です。滑る面の潤滑が重要になります。「転がり軸受」は、玉やころを間に入れ、その転がりを利用する方式です。滑る代わりに転がして摩擦を小さくする、と考えてください。", "terms": [], "block": "1-9-257233d699a5"}, {"id": "1-9/27/text", "raw": "軸に直角の向きの荷重を「**ラジアル荷重**」、軸の長さ方向の荷重を「スラスト荷重」といいます。横向きの軸に車輪が付いている例なら、車輪の重さで下向きに押されるのはラジアル荷重、軸の端を横から押すのはスラスト荷重です。軸受は、受ける力の方向に合うものを使います。", "text": "軸に直角の向きの荷重を「ラジアル荷重」、軸の長さ方向の荷重を「スラスト荷重」といいます。横向きの軸に車輪が付いている例なら、車輪の重さで下向きに押されるのはラジアル荷重、軸の端を横から押すのはスラスト荷重です。軸受は、受ける力の方向に合うものを使います。", "terms": ["ラジアル荷重", "スラスト荷重"], "block": "1-9-91b7e33fee65"}, {"id": "1-9/28/text", "raw": "**円すいころ軸受**は、ラジアル荷重と、片方向のスラスト荷重を受けられます。「両方向」と覚えるのでなく、力の種類と向きを図で確かめます。", "text": "円すいころ軸受は、ラジアル荷重と、片方向のスラスト荷重を受けられます。「両方向」と覚えるのでなく、力の種類と向きを図で確かめます。", "terms": [], "block": "1-9-a27fe955c840"}, {"id": "1-9/30/text", "raw": "給脂周期の代表値は、**平軸受：毎日1回程度、転がり軸受：6か月に1回程度**です。給油と点検の節で、方法と一緒に復習します。", "text": "給脂周期の代表値は、平軸受：毎日1回程度、転がり軸受：6か月に1回程度です。給油と点検の節で、方法と一緒に復習します。", "terms": [], "block": "1-9-86c9759b8817"}, {"id": "1-9/33/text", "raw": "ボルトは、部材同士をつなぐ部品です。ただし、すべてが同じ仕組みで横ずれを防ぐわけではありません。", "text": "ボルトは、部材同士をつなぐ部品です。ただし、すべてが同じ仕組みで横ずれを防ぐわけではありません。", "terms": [], "block": "1-9-bd85c1131fa4"}, {"id": "1-9/35/text", "raw": "**普通ボルト**は、接合方式に応じて、引張りやせん断などを受けます。「引張り」は長さ方向へ引き伸ばす力、「せん断」は横へずらして切ろうとする力です。", "text": "普通ボルトは、接合方式に応じて、引張りやせん断などを受けます。「引張り」は長さ方向へ引き伸ばす力、「せん断」は横へずらして切ろうとする力です。", "terms": [], "block": "1-9-3ab055d88250"}, {"id": "1-9/36/text", "raw": "摩擦接合に用いる**高力ボルト**は、板同士を強く締め付け、接触面の摩擦で滑りに抵抗します。板を重ねて強く押さえるとずれにくくなるように、押し付ける働きを利用します。このため、指定された締付けによって所定の軸力を与えることが重要です。", "text": "摩擦接合に用いる高力ボルトは、板同士を強く締め付け、接触面の摩擦で滑りに抵抗します。板を重ねて強く押さえるとずれにくくなるように、押し付ける働きを利用します。このため、指定された締付けによって所定の軸力を与えることが重要です。", "terms": ["高力ボルト", "摩擦接合"], "block": "1-9-ea8fed30ee5f"}, {"id": "1-9/37/text", "raw": "**リーマボルト**は、精密に仕上げた穴に合わせて取り付けます。部材がずれようとすると、ボルトと穴の接触部分で押し合い、ボルトにはせん断の負担も生じます。接触面で押し合う働きを「支圧」といいます。", "text": "リーマボルトは、精密に仕上げた穴に合わせて取り付けます。部材がずれようとすると、ボルトと穴の接触部分で押し合い、ボルトにはせん断の負担も生じます。接触面で押し合う働きを「支圧」といいます。", "terms": ["リーマボルト"], "block": "1-9-6645d96d140b"}, {"id": "1-9/38/text", "raw": "「高力ボルトの摩擦接合は接合面の摩擦、**リーマボルト**はせん断と支圧」と、力を伝える場所に注目して区別しましょう。", "text": "「高力ボルトの摩擦接合は接合面の摩擦、リーマボルトはせん断と支圧」と、力を伝える場所に注目して区別しましょう。", "terms": [], "block": "1-9-6e3a4140a308"}, {"id": "1-9/41/text", "raw": "座金（ざがね）は、ボルトやナットの座面（当たる面）と、締め付ける相手の面との間にはさむ輪です。平座金は、当たり面を保護し、面圧を広く分散させる働きが中心です。緩み止めを目的とする座金（ばね座金・**舌付き座金**など）は別にあり、次に種類を示します。", "text": "座金（ざがね）は、ボルトやナットの座面（当たる面）と、締め付ける相手の面との間にはさむ輪です。平座金は、当たり面を保護し、面圧を広く分散させる働きが中心です。緩み止めを目的とする座金（ばね座金・舌付き座金など）は別にあり、次に種類を示します。", "terms": [], "block": "1-9-140e74158fb2"}, {"id": "1-9/42/text", "raw": "**平座金**：当たり面が悪い所や傷つきやすい所にはさみ、面でならして支えます。", "text": "平座金：当たり面が悪い所や傷つきやすい所にはさみ、面でならして支えます。", "terms": [], "block": "1-9-443151c0c567"}, {"id": "1-9/43/text", "raw": "**勾配（こうばい）座金**：溝形鋼やI形鋼のように斜めの面を締めるとき、ボルトに曲げがかからないようにする座金です。", "text": "勾配（こうばい）座金：溝形鋼やI形鋼のように斜めの面を締めるとき、ボルトに曲げがかからないようにする座金です。", "terms": [], "block": "1-9-185f849ca2a5"}, {"id": "1-9/44/text", "raw": "**ばね座金**：切り欠きのある輪のばね作用で、緩みを防ぐために使います。", "text": "ばね座金：切り欠きのある輪のばね作用で、緩みを防ぐために使います。", "terms": [], "block": "1-9-f8a198c450a2"}, {"id": "1-9/45/text", "raw": "**舌付き座金**：突き出た部分（舌）をナットなどに折り曲げて巻きつけ、回り止めにします。", "text": "舌付き座金：突き出た部分（舌）をナットなどに折り曲げて巻きつけ、回り止めにします。", "terms": [], "block": "1-9-7a186a4419ce"}, {"id": "1-9/47/text", "raw": "座金のほかに、ナット自体に工夫をして緩みを止めるものもあります。溝付きナットに割りピンを差す、ナットを二つ重ねる（**ダブルナット**）などの方法です。振動の多いクレーンでは、この緩み止めが大切です。", "text": "座金のほかに、ナット自体に工夫をして緩みを止めるものもあります。溝付きナットに割りピンを差す、ナットを二つ重ねる（ダブルナット）などの方法です。振動の多いクレーンでは、この緩み止めが大切です。", "terms": ["割りピン"], "block": "1-9-c37e55f19e6f"}, {"id": "1-9/48/text", "raw": "**ばねナット**は、ねじと同じ角度のばね鋼を**2～3巻き**して両端を結束した部品です。締めた六角ナットの上に取り付け、緩みを防ぎます。座面にはさむ「ばね座金」と区別します。", "text": "ばねナットは、ねじと同じ角度のばね鋼を2～3巻きして両端を結束した部品です。締めた六角ナットの上に取り付け、緩みを防ぎます。座面にはさむ「ばね座金」と区別します。", "terms": [], "block": "1-9-f7305bc0463f"}, {"id": "1-9/52/text", "raw": "軸継手（じくつぎて）は、動力を伝えるために軸と軸をつなぐ部品です。大きく、2つの軸をまっすぐ一致させて固定する「固定軸継手」と、2軸の少しのずれや傾きをやわらげられる「**たわみ軸継手**」に分かれます。", "text": "軸継手（じくつぎて）は、動力を伝えるために軸と軸をつなぐ部品です。大きく、2つの軸をまっすぐ一致させて固定する「固定軸継手」と、2軸の少しのずれや傾きをやわらげられる「たわみ軸継手」に分かれます。", "terms": ["たわみ軸継手"], "block": "1-9-d40253e51b4d"}, {"id": "1-9/53/text", "raw": "**割形軸継手**：二つ割りの円筒で軸を挟み、ボルトで固定します。軸を長さ方向へ動かさずに着脱でき、橋形クレーンの走行長軸などの低速軸に使います。2軸は一直線に合わせます。", "text": "割形軸継手：二つ割りの円筒で軸を挟み、ボルトで固定します。軸を長さ方向へ動かさずに着脱でき、橋形クレーンの走行長軸などの低速軸に使います。2軸は一直線に合わせます。", "terms": [], "block": "1-9-21205886de6a"}, {"id": "1-9/54/text", "raw": "**フランジ形固定軸継手**：2つの軸端のフランジ（つば）をリーマボルトでつなぎます。ボルトのせん断力（横ずれに耐える力）で動力を伝え、回転の速い軸（高速軸）に使います。", "text": "フランジ形固定軸継手：2つの軸端のフランジ（つば）をリーマボルトでつなぎます。ボルトのせん断力（横ずれに耐える力）で動力を伝え、回転の速い軸（高速軸）に使います。", "terms": [], "block": "1-9-674ea6427831"}, {"id": "1-9/55/text", "raw": "**フランジ形たわみ軸継手**：フランジの片側のボルト穴を大きくし、ボルトとの間にゴムのブッシュをはさみます。ゴムのたわみで、起動・停止の衝撃や2軸のずれ・傾きをやわらげ、軸の折損や軸受の発熱を防ぎます。電動機と減速機の連結によく使われます。", "text": "フランジ形たわみ軸継手：フランジの片側のボルト穴を大きくし、ボルトとの間にゴムのブッシュをはさみます。ゴムのたわみで、起動・停止の衝撃や2軸のずれ・傾きをやわらげ、軸の折損や軸受の発熱を防ぎます。電動機と減速機の連結によく使われます。", "terms": [], "block": "1-9-bb78fe066d41"}, {"id": "1-9/56/text", "raw": "**歯車形軸継手**は歯のかみ合い、**ローラチェーン軸継手**は2個のスプロケットに掛けた2列のチェーンで動力を伝えます。どちらも、わずかな軸のずれや傾きに対応する、たわみ軸継手です。", "text": "歯車形軸継手は歯のかみ合い、ローラチェーン軸継手は2個のスプロケットに掛けた2列のチェーンで動力を伝えます。どちらも、わずかな軸のずれや傾きに対応する、たわみ軸継手です。", "terms": [], "block": "1-9-58e35268d183"}, {"id": "1-9/58/text", "raw": "**自在軸継手（ユニバーサルカップリング）**：2軸が一直線上にない走行長軸などに使い、角度のついた軸どうしをつなぎます。", "text": "自在軸継手（ユニバーサルカップリング）：2軸が一直線上にない走行長軸などに使い、角度のついた軸どうしをつなぎます。", "terms": ["自在軸継手"], "block": "1-9-e5a0217196ba"}, {"id": "1-9/59/text", "raw": "「固定＝軸がまっすぐ」「たわみ＝少しのずれ・傾きを許す」「自在＝角度を許す」と、役割で覚えると整理できます。", "text": "「固定＝軸がまっすぐ」「たわみ＝少しのずれ・傾きを許す」「自在＝角度を許す」と、役割で覚えると整理できます。", "terms": [], "block": "1-9-aec570e8af9c"}, {"id": "1-9/62/text", "raw": "キーは、歯車や車輪などの回転体を円い軸に固定し、軸と回転体（ボス）の相対的な回転（空回り）を止めるための角棒状の鉄片です。軸とボスの両方、または片方に「**キー溝**」を掘り、そこにキーを差し込みます。", "text": "キーは、歯車や車輪などの回転体を円い軸に固定し、軸と回転体（ボス）の相対的な回転（空回り）を止めるための角棒状の鉄片です。軸とボスの両方、または片方に「キー溝」を掘り、そこにキーを差し込みます。", "terms": [], "block": "1-9-49c354c9bad0"}, {"id": "1-9/63/text", "raw": "勾配を付けて打ち込む「**こう配キー**」(くさびの働き)のほか、勾配のない「平行キー」もあり、すべてがくさび形というわけではありません。", "text": "勾配を付けて打ち込む「こう配キー」(くさびの働き)のほか、勾配のない「平行キー」もあり、すべてがくさび形というわけではありません。", "terms": ["こう配キー", "平行キー"], "block": "1-9-10605e38b16d"}, {"id": "1-9/64/text", "raw": "**キー板（キープレート）**は、固定軸の回転や軸方向への抜け出しを防ぐ板です。軸の溝に差し込み、ボルトで固定します。歯車と軸の空回りを止めるキーとは、使う場所を区別します。", "text": "キー板（キープレート）は、固定軸の回転や軸方向への抜け出しを防ぐ板です。軸の溝に差し込み、ボルトで固定します。歯車と軸の空回りを止めるキーとは、使う場所を区別します。", "terms": [], "block": "1-9-rev26-keyplate"}], "candidates": [{"id": "1-9/2/text#39", "fieldID": "1-9/2/text", "block": "1-9-2bf5a78ff490", "answer": "駆動歯車", "category": "key", "prompt": "［用語？］", "start": 39, "end": 43, "context": "歯車は、歯をかみ合わせて回転を別の軸へ伝える部品です。電動機側から回す歯車を「駆動歯車」、それに回される歯車を「従動歯車」または「被動歯車」といいます。「駆動」は動かす側、「従動」は動かされる側です。", "start16": 39, "end16": 43}, {"id": "1-9/2/text#56", "fieldID": "1-9/2/text", "block": "1-9-2bf5a78ff490", "answer": "従動歯車", "category": "key", "prompt": "［用語？］", "start": 56, "end": 60, "context": "歯車は、歯をかみ合わせて回転を別の軸へ伝える部品です。電動機側から回す歯車を「駆動歯車」、それに回される歯車を「従動歯車」または「被動歯車」といいます。「駆動」は動かす側、「従動」は動かされる側です。", "start16": 56, "end16": 60}, {"id": "1-9/21/rows:0:0#0", "fieldID": "1-9/21/rows:0:0", "block": "1-9-rev26-gear-types", "answer": "平歯車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "平歯車", "start16": 0, "end16": 3}, {"id": "1-9/21/rows:1:0#0", "fieldID": "1-9/21/rows:1:0", "block": "1-9-rev26-gear-types", "answer": "はすば歯車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "はすば歯車", "start16": 0, "end16": 5}, {"id": "1-9/21/rows:1:1#12", "fieldID": "1-9/21/rows:1:1", "block": "1-9-rev26-gear-types", "answer": "減速比", "category": "key", "prompt": "［用語？］", "start": 12, "end": 15, "context": "斜めの歯。滑らか・大きな減速比・スラスト", "start16": 12, "end16": 15}, {"id": "1-9/21/rows:1:1#16", "fieldID": "1-9/21/rows:1:1", "block": "1-9-rev26-gear-types", "answer": "スラスト", "category": "key", "prompt": "［用語？］", "start": 16, "end": 20, "context": "斜めの歯。滑らか・大きな減速比・スラスト", "start16": 16, "end16": 20}, {"id": "1-9/21/rows:2:0#0", "fieldID": "1-9/21/rows:2:0", "block": "1-9-rev26-gear-types", "answer": "かさ歯車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "かさ歯車", "start16": 0, "end16": 4}, {"id": "1-9/21/rows:3:0#0", "fieldID": "1-9/21/rows:3:0", "block": "1-9-rev26-gear-types", "answer": "ウォーム歯車", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "ウォーム歯車", "start16": 0, "end16": 6}, {"id": "1-9/27/text#12", "fieldID": "1-9/27/text", "block": "1-9-91b7e33fee65", "answer": "ラジアル荷重", "category": "key", "prompt": "［用語？］", "start": 12, "end": 18, "context": "軸に直角の向きの荷重を「ラジアル荷重」、軸の長さ方向の荷重を「スラスト荷重」といいます。横向きの軸に車輪が付いている例なら、車輪の重さで下向きに押されるのはラジアル荷重、軸の端を横から押すのはスラスト荷重です。軸受は、受ける力の方向に合うものを使います。", "start16": 12, "end16": 18}, {"id": "1-9/27/text#31", "fieldID": "1-9/27/text", "block": "1-9-91b7e33fee65", "answer": "スラスト荷重", "category": "key", "prompt": "［用語？］", "start": 31, "end": 37, "context": "軸に直角の向きの荷重を「ラジアル荷重」、軸の長さ方向の荷重を「スラスト荷重」といいます。横向きの軸に車輪が付いている例なら、車輪の重さで下向きに押されるのはラジアル荷重、軸の端を横から押すのはスラスト荷重です。軸受は、受ける力の方向に合うものを使います。", "start16": 31, "end16": 37}, {"id": "1-9/36/text#0", "fieldID": "1-9/36/text", "block": "1-9-ea8fed30ee5f", "answer": "摩擦接合", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "摩擦接合に用いる高力ボルトは、板同士を強く締め付け、接触面の摩擦で滑りに抵抗します。板を重ねて強く押さえるとずれにくくなるように、押し付ける働きを利用します。このため、指定された締付けによって所定の軸力を与えることが重要です。", "start16": 0, "end16": 4}, {"id": "1-9/36/text#8", "fieldID": "1-9/36/text", "block": "1-9-ea8fed30ee5f", "answer": "高力ボルト", "category": "key", "prompt": "［用語？］", "start": 8, "end": 13, "context": "摩擦接合に用いる高力ボルトは、板同士を強く締め付け、接触面の摩擦で滑りに抵抗します。板を重ねて強く押さえるとずれにくくなるように、押し付ける働きを利用します。このため、指定された締付けによって所定の軸力を与えることが重要です。", "start16": 8, "end16": 13}, {"id": "1-9/37/text#0", "fieldID": "1-9/37/text", "block": "1-9-6645d96d140b", "answer": "リーマボルト", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "リーマボルトは、精密に仕上げた穴に合わせて取り付けます。部材がずれようとすると、ボルトと穴の接触部分で押し合い、ボルトにはせん断の負担も生じます。接触面で押し合う働きを「支圧」といいます。", "start16": 0, "end16": 6}, {"id": "1-9/47/text#39", "fieldID": "1-9/47/text", "block": "1-9-c37e55f19e6f", "answer": "割りピン", "category": "key", "prompt": "［用語？］", "start": 39, "end": 43, "context": "座金のほかに、ナット自体に工夫をして緩みを止めるものもあります。溝付きナットに割りピンを差す、ナットを二つ重ねる（ダブルナット）などの方法です。振動の多いクレーンでは、この緩み止めが大切です。", "start16": 39, "end16": 43}, {"id": "1-9/52/text#84", "fieldID": "1-9/52/text", "block": "1-9-d40253e51b4d", "answer": "たわみ軸継手", "category": "key", "prompt": "［用語？］", "start": 84, "end": 90, "context": "軸継手（じくつぎて）は、動力を伝えるために軸と軸をつなぐ部品です。大きく、2つの軸をまっすぐ一致させて固定する「固定軸継手」と、2軸の少しのずれや傾きをやわらげられる「たわみ軸継手」に分かれます。", "start16": 84, "end16": 90}, {"id": "1-9/58/text#0", "fieldID": "1-9/58/text", "block": "1-9-e5a0217196ba", "answer": "自在軸継手", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "自在軸継手（ユニバーサルカップリング）：2軸が一直線上にない走行長軸などに使い、角度のついた軸どうしをつなぎます。", "start16": 0, "end16": 5}, {"id": "1-9/63/text#11", "fieldID": "1-9/63/text", "block": "1-9-10605e38b16d", "answer": "こう配キー", "category": "key", "prompt": "［用語？］", "start": 11, "end": 16, "context": "勾配を付けて打ち込む「こう配キー」(くさびの働き)のほか、勾配のない「平行キー」もあり、すべてがくさび形
