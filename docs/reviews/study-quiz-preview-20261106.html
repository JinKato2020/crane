lock": "1-8-bd8194d72f58"}, {"id": "1-8/15/text", "raw": "電気が切れると、荷を保持する磁力を失うおそれがあります。このため、停電時に一定時間保持できるよう、**停電保護装置**を備えるものがあります。保護装置があっても、無期限に保持できるわけではありません。", "text": "電気が切れると、荷を保持する磁力を失うおそれがあります。このため、停電時に一定時間保持できるよう、停電保護装置を備えるものがあります。保護装置があっても、無期限に保持できるわけではありません。", "terms": ["停電保護装置"], "block": "1-8-9150997704f3"}, {"id": "1-8/16/text", "raw": "吸着できるかは荷の材質や温度などで変わります。鉄鋼に適したつり具であって、すべての金属を同じように吸着できるわけではありません。鋼が高温になると吸着力が低下することにも注意します。", "text": "吸着できるかは荷の材質や温度などで変わります。鉄鋼に適したつり具であって、すべての金属を同じように吸着できるわけではありません。鋼が高温になると吸着力が低下することにも注意します。", "terms": [], "block": "1-8-6659edebc0b8"}, {"id": "1-8/18/text", "raw": "**バキューム式**は、吸盤内の圧力を周囲より低くし、外側の空気の圧力で吸盤を荷に押し付けて保持する方式です。吸盤を窓ガラスに付ける仕組みに似ています。", "text": "バキューム式は、吸盤内の圧力を周囲より低くし、外側の空気の圧力で吸盤を荷に押し付けて保持する方式です。吸盤を窓ガラスに付ける仕組みに似ています。", "terms": ["バキューム式"], "block": "1-8-0204be78c419"}, {"id": "1-8/19/text", "raw": "ガラス板や金属板など、表面が滑らかで空気が漏れにくい荷に向きます。凹凸、穴、汚れなどで空気が漏れると、必要な吸着力を保てない場合があります。「板なら何でも同じようにつれる」とは考えず、表面状態と用具の適用条件を確認します。", "text": "ガラス板や金属板など、表面が滑らかで空気が漏れにくい荷に向きます。凹凸、穴、汚れなどで空気が漏れると、必要な吸着力を保てない場合があります。「板なら何でも同じようにつれる」とは考えず、表面状態と用具の適用条件を確認します。", "terms": [], "block": "1-8-7ff24e0f332f"}, {"id": "1-8/21/text", "raw": "**スプレッダ**はコンテナ専用のつり具です。四隅の隅金具にツイストロックを差し込んで回し、ロックしてつり上げます。", "text": "スプレッダはコンテナ専用のつり具です。四隅の隅金具にツイストロックを差し込んで回し、ロックしてつり上げます。", "terms": [], "block": "1-8-7ba9d095690a"}, {"id": "1-8/23/text", "raw": "フックには、つり手が1つの「**片フック**」と、2つの「両フック」があります。小さい容量のクレーンでは片フックが多く、大きい容量のものでは、荷重をバランスよく受けるために両フックが使われます。", "text": "フックには、つり手が1つの「片フック」と、2つの「両フック」があります。小さい容量のクレーンでは片フックが多く、大きい容量のものでは、荷重をバランスよく受けるために両フックが使われます。", "terms": [], "block": "1-8-115eba51ba90"}, {"id": "1-8/26/text", "raw": "**クロー**は、製鋼工場で、熱い鋼片やレールのような細長い荷をつかんで運ぶための専用のつり具です。", "text": "クローは、製鋼工場で、熱い鋼片やレールのような細長い荷をつかんで運ぶための専用のつり具です。", "terms": ["クロー"], "block": "1-8-437afba9a7e6"}], "candidates": [{"id": "1-8/5/text#52", "fieldID": "1-8/5/text", "block": "1-8-0b8cce763cd9", "answer": "外れ止め", "category": "key", "prompt": "［用語？］", "start": 52, "end": 56, "context": "図では、まずフック本体を見てください。荷の力を支えるのはこの本体です。次に、フックの入口(開口部)にある外れ止めを見ます。これが、玉掛け用ロープなどが入口から外れるのを防ぎます。", "start16": 52, "end16": 56}, {"id": "1-8/9/text#0", "fieldID": "1-8/9/text", "block": "1-8-082bca21e4a8", "answer": "グラブバケット", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "グラブバケットは、砂、砂利、石炭などのばら物をつかむつり具です。口を開いた状態で材料に下ろし、閉じてすくい取ります。箱をフックでつるのとは違い、荷そのものをバケットの中へ取り込みます。", "start16": 0, "end16": 7}, {"id": "1-8/11/text#10", "fieldID": "1-8/11/text", "block": "1-8-b0643ccd4ef9", "answer": "支持ロープ", "category": "key", "prompt": "［用語？］", "start": 10, "end": 15, "context": "複索式のグラブでは、支持ロープがバケットを支え、開閉ロープが口を動かします。支持ロープを止め、開閉ロープを巻き取ると閉じ、巻き戻すと開きます。両方を同時に操作すると、開閉状態を保ったまま上げ下げできます。電動油圧式もあります。", "start16": 10, "end16": 15}, {"id": "1-8/11/text#24", "fieldID": "1-8/11/text", "block": "1-8-b0643ccd4ef9", "answer": "開閉ロープ", "category": "key", "prompt": "［用語？］", "start": 24, "end": 29, "context": "複索式のグラブでは、支持ロープがバケットを支え、開閉ロープが口を動かします。支持ロープを止め、開閉ロープを巻き取ると閉じ、巻き戻すと開きます。両方を同時に操作すると、開閉状態を保ったまま上げ下げできます。電動油圧式もあります。", "start16": 24, "end16": 29}, {"id": "1-8/12/text#12", "fieldID": "1-8/12/text", "block": "1-8-2c7292a2d469", "answer": "スプレッダ", "category": "key", "prompt": "［用語？］", "start": 12, "end": 17, "context": "グラブはばら物をすくう、スプレッダはコンテナの四隅をロックする。荷のつかみ方を見分けましょう。", "start16": 12, "end16": 17}, {"id": "1-8/14/text#0", "fieldID": "1-8/14/text", "block": "1-8-bd8194d72f58", "answer": "リフティングマグネット", "category": "key", "prompt": "［用語？］", "start": 0, "end": 11, "context": "リフティングマグネットは、電磁石の力で鋼材や屑鉄などを吸着するつり具です。電磁石は、電気を流すことで磁力を生み出します。ここで扱う一般的なリフティングマグネットでは、直流電源を使います。", "start16": 0, "end16": 11}, {"id": "1-8/15/text#49", "fieldID": "1-8/15/text", "block": "1-8-9150997704f3", "answer": "停電保護装置", "category": "key", "prompt": "［用語？］", "start": 49, "end": 55, "context": "電気が切れると、荷を保持する磁力を失うおそれがあります。このため、停電時に一定時間保持できるよう、停電保護装置を備えるものがあります。保護装置があっても、無期限に保持できるわけではありません。", "start16": 49, "end16": 55}, {"id": "1-8/18/text#0", "fieldID": "1-8/18/text", "block": "1-8-0204be78c419", "answer": "バキューム式", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "バキューム式は、吸盤内の圧力を周囲より低くし、外側の空気の圧力で吸盤を荷に押し付けて保持する方式です。吸盤を窓ガラスに付ける仕組みに似ています。", "start16": 0, "end16": 6}, {"id": "1-8/26/text#0", "fieldID": "1-8/26/text", "block": "1-8-437afba9a7e6", "answer": "クロー", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "クローは、製鋼工場で、熱い鋼片やレールのような細長い荷をつかんで運ぶための専用のつり具です。", "start16": 0, "end16": 3}], "rounds": {"all": [["1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0"], ["1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0"], ["1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0"], ["1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12"], ["1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24"], ["1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10"], ["1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49"], ["1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0"], ["1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52"]], "key": [["1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0"], ["1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0"], ["1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0"], ["1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12"], ["1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24"], ["1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10"], ["1-8/14/text#0", "1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49"], ["1-8/5/text#52", "1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0"], ["1-8/18/text#0", "1-8/9/text#0", "1-8/26/text#0", "1-8/12/text#12", "1-8/11/text#24", "1-8/11/text#10", "1-8/15/text#49", "1-8/14/text#0", "1-8/5/text#52"]], "num": [[]]}}, {"title": "安全装置――どんな危険を防ぐのか", "blocks": [{"type": "p", "style": "lead", "text": "**上げすぎ・積みすぎ・走りすぎを防ぐ。** 安全装置は、防ぐ危険とセットで覚えます。", "id": "1-10-892e339f13ab"}, {"type": "sub", "text": "巻過防止装置", "id": "1-10-dcef684c9c71"}, {"type": "p", "text": "フックを巻き上げ続けると、上部のシーブや機械に**フックブロック**が衝突するおそれがあります。そのままロープを巻こうとすると大きな張力が生じ、損傷や落下事故につながります。巻過防止装置は、この上げすぎを防ぐ装置です。", "id": "1-10-f3ef8b2e68cb", "quizTerms": ["巻過防止装置"]}, {"type": "p", "text": "つり具が所定の上限位置に近づくと、**リミットスイッチ**が作動し、巻上げを停止させるなどの働きをします。リミットは限界という意味です。通常の運転では、運転者が適切な位置で止めることが基本で、毎回この装置に当てて止めるためのものではありません。", "id": "1-10-a2a14319dd5c"}, {"type": "img", "asset": "1-10_supplement_f23_20261023", "labels": [], "legend": [], "caption": "重錘形・ロッド形は、つり具の動きを直接検出する例。ねじ形はドラムの回転から位置を検出する例。連動部・停止回路の細部は省略。", "id": "1-10-1ff316651556", "style": "figure", "_previewFile": "1-10_supplement_f23_20261023.png", "_width": 1473, "_height": 1068}, {"type": "p", "text": "図の重錘形・ロッド形のような直働式は、**フックブロック**などの動きで直接スイッチを働かせます。重錘形では、上がってきたフックブロックが重錘を持ち上げ、その変化をスイッチへ伝えます。重錘は検出に使うおもりです。「フックがこの位置へ来た」という実際の位置を検出している、と考えましょう。", "id": "1-10-f60e7a9e5b20"}, {"type": "p", "text": "図のねじ形のような間接式は、ドラムの回転からフック位置を見積もります。ねじ形では、ドラムの回転をねじ軸へ伝え、ねじに沿って動く部品が所定の位置でスイッチを働かせます。動く部品は「**トラベラー**」と呼びます。カム形では、回転するカムでスイッチを働かせます。", "id": "1-10-33eddf4f450e"}, {"id": "1-10-3f47f48f2ee1", "type": "table", "headers": ["巻過防止装置", "位置の見方・ロープ交換後"], "rows": [["**直働式**（重錘形・ロッド形）", "フックの位置を直接検出。交換後の作動位置の再調整は不要"], ["**間接式**（ねじ形・カム形）", "ドラムの回転から位置を検出。交換後は作動位置を再調整"]], "quizTerms": ["直働式", "間接式"]}, {"type": "p", "text": "間接式は接点を組み合わせて**上限・下限**の制限に使えます。直働式の重錘形は、上がってきたフックが重錘を持ち上げるため、巻下げの下限検出には使いません。", "id": "1-10-50b40c50b224"}, {"id": "1-10-0e74cb6b16ca", "type": "table", "headers": ["巻過防止の方式", "停止後に残す間隔"], "rows": [["一般", "**0.25m以上**"], ["直働式", "**0.05m以上**"]], "quizTerms": ["0.25m以上", "0.05m以上"]}, {"type": "p", "text": "間隔は、つり具等の上面と衝突のおそれがある上部の物の下面の間で見ます。詳しい適用条件は、第2章「クレーンの使用」で確認します。", "id": "1-10-d72b3e42add6"}, {"id": "1-10-rev26-legal-link", "type": "p", "text": "第2章：使うとき・働くときの決まり", "style": "reference", "file": "2-2"}, {"type": "sub", "id": "lesson-emergency-stop", "text": "非常停止は、ふだんの停止と分ける"}, {"type": "p", "text": "**通常の停止は制御器などで行い、非常停止は危険時に動作を止めるために使います。** 非常停止や巻過防止装置を、ふだんの停止手段として毎回使うものではありません。", "id": "1-10-451574f3680e"}, {"type": "p", "text": "**非常停止の解除と、運転の再始動は別の操作。** 危険や停止原因を確認し、安全な状態と所定の始動条件を満たしてから再開します。ボタンを戻しただけで不意に動き出さないことが大切です。", "id": "1-10-940abd3f5b57"}, {"type": "sub", "text": "過負荷防止装置と傾斜角指示装置", "id": "1-10-e26659a3fe14"}, {"type": "p", "text": "過負荷は、その条件で定められた定格荷重を超える負荷です。図で見たように、ジブクレーンでは同じ荷でも作業半径が変われば過負荷になります。**過負荷防止装置**は、荷重や姿勢などからこの状態を検出し、危険な動作を停止させるなどの働きをします。機種や条件によって、表示・警報などの構成は異なります。", "id": "1-10-f3d77ea6c34f", "quizTerms": ["過負荷防止装置"]}, {"type": "p", "text": "**傾斜角指示装置**は、ジブの傾斜角を示します。運転者は角度や荷重表を確認し、今の条件でどれだけの荷をつれるかを判断します。「角度を示す装置」と「過負荷を検出して停止させる装置」は、目的が違います。", "id": "1-10-472a273ad266"}, {"type": "sub", "text": "車輪止めと緩衝装置", "id": "1-10-f721c37824af"}, {"type": "p", "text": "トロリやクレーン本体がレールの端まで進みすぎると、走路から外れるおそれがあります。端部で走り出しを防ぐ備えが**車輪止め**などです。一方、緩衝装置は、衝突したときの衝撃を和らげます。止める位置を作ることと、衝撃を吸収することを分けて考えましょう。", "id": "1-10-178c4f7c8d05"}, {"type": "svg", "file": "1-12_wheel_stop.svg", "caption": "横行レールの車輪止め。クレーン構造規格 第39条。寸法はレールの走行面を基準に測る。寸法の位置を示す模式図", "id": "1-10-311dd32b8420", "style": "figure", "_previewFile": "1-12_wheel_stop.svg"}, {"id": "1-10-466e51bbb3f8", "type": "table", "headers": ["車輪止め", "レール上面からの高さ"], "rows": [["**横行用**", "車輪直径の**1/4以上**。直径400mmなら100mm以上"], ["**走行用**", "車輪直径の**1/2以上**。直径400mmなら200mm以上"]], "quizTerms": ["1/4以上", "1/2以上"]}, {"type": "img", "asset": "1-10_supplement_f24_20261023", "labels": [], "legend": [], "caption": "車輪止めで走行を制限し、緩衝装置で衝撃を和らげる。", "id": "1-10-72412c9ed2a6", "style": "figure", "_previewFile": "1-10_supplement_f24_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "衝突防止・逸走防止・斜行防止", "id": "1-10-8faf07bf1c2d"}, {"type": "p", "text": "同じランウェイを複数のクレーンが使うと、クレーン同士が近づいて衝突する危険があります。衝突防止装置は、距離や接近を検出して停止させるなどの装置です。光や超音波、**リミットスイッチ**などを用いる方式があります。", "id": "1-10-2160b5bedd94", "quizTerms": ["衝突防止装置"]}, {"type": "img", "asset": "1-10_supplement_f25_20261023", "labels": [], "legend": [], "caption": "接近を検出して停止させ、クレーン同士の衝突を防ぐ。", "id": "1-10-1ccf56ac53b4", "style": "figure", "_previewFile": "1-10_supplement_f25_20261023.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "屋外の走行クレーンでは、運転していなくても強い風で押され、レール上を走り出すおそれがあります。この「風に押されて走り出す」危険を防ぐのが**逸走防止装置**です。レールをつかむなどして、機体の移動を抑えます。", "id": "1-10-2970cb4bb144", "quizTerms": ["逸走防止装置"]}, {"type": "p", "text": "屋外の走行クレーンでは、瞬間風速**30m/sを超える風のおそれ**があるとき、逸走防止措置を取ります。作業を続けてよい風速の上限ではありません。", "id": "1-10-fc39e56aa39e", "style": "caution", "quizTerms": ["30m/sを超える風のおそれ"]}, {"type": "p", "text": "強風で危険が予想されるときは、別に作業を中止します。", "id": "1-10-9cac1fc9992c"}, {"id": "1-10-df3a75e1508c", "type": "table", "headers": ["逸走防止装置", "固定のしかた"], "rows": [["**レールクランプ**", "走行レールを挟んで移動を抑える"], ["**アンカー**", "決められた係留位置で基礎側へ固定する"]], "quizTerms": ["レールクランプ", "アンカー"]}, {"type": "p", "text": "いずれも風で機体が走り出す逸走を防ぐもので、通常の**走行**ブレーキとは役割を分けます。", "id": "1-10-99ddedc70b43"}, {"type": "img", "asset": "1-10_supplement_f26_20261023", "labels": [], "legend": [], "caption": "レールを挟むか、地面側へ固定して、風による逸走を防ぐ。", "id": "1-10-a454eefa4fc3", "style": "figure", "_previewFile": "1-10_supplement_f26_20261023.png", "_width": 1472, "_height": 1068}, {"type": "p", "text": "**斜行防止装置**は、左右の走行がそろわずクレーンが斜めになることを抑えます。衝突は他の機械との接近、逸走は風による移動、斜行は左右の走り方のずれです。名称の「防ぐ対象」を入れ替えないようにしましょう。", "id": "1-10-b9286398e138"}, {"type": "sub", "text": "警報装置とフートスイッチ", "id": "1-10-1494dce63cb3"}, {"type": "p", "text": "**警報装置**は、周囲の作業者へクレーンの動きを知らせる装置です。ブザー、ベル、サイレンなどがあります。走行するクレーンに備えることが基本ですが、床上で運転し運転者がクレーンとともに移動するものなど、適用には条件があります。", "id": "1-10-fe1ab7a9cd5c"}, {"type": "p", "text": "**フートスイッチ**は、足で操作するスイッチです。この章で扱う運転室への通路等のものは、踏むと主回路を遮断する仕組みで、通行時の感電防止などを目的とします。足で踏んで荷を動かす一般の操作スイッチと混同しないように、どこに設けられ、何を切るのかを確認します。", "id": "1-10-e4eae3cccd15"}, {"type": "img", "asset": "1-10_supplement_f27_20261023", "labels": [], "legend": [], "caption": "通路に設ける安全床スイッチの例。床を踏むと主回路を遮断し、通行時の感電を防ぐ。", "id": "1-10-c5a03e53dad4", "style": "figure", "_previewFile": "1-10_supplement_f27_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "ゼロノッチインターロック", "id": "1-10-1625af0da24f"}, {"type": "p", "text": "操作レバーの停止位置を「ゼロ位置」、段階的な操作位置を「ノッチ」といいます。**ゼロノッチインターロック**は、レバーがゼロ位置へ戻っていないと、主電磁接触器を投入できない仕組みです。主電磁接触器は、主回路を入れたり切ったりする電気の開閉器です。", "id": "1-10-659e81f8a997", "quizTerms": ["ゼロノッチインターロック"]}, {"type": "p", "text": "例えば、レバーを**巻上げ**位置にしたまま停電し、その後に電気が戻る場面を考えてください。復旧しただけで巻上げが再開すると、周囲の人が予想しない動きになります。いったんレバーをゼロへ戻し、改めて操作する必要を設けることで、意図しない再始動を防ぎます。", "id": "1-10-280824bcf729"}, {"type": "p", "text": "「インターロック」は、所定の条件を満たさないと操作を成立させない仕組みです。停電後の危険を、ブレーキだけでなく操作回路でも防ぐ、と理解してください。", "id": "1-10-f99f22e23a90"}, {"type": "sub", "text": "速度開閉器", "id": "1-10-ff13fb7f54b7"}, {"type": "p", "text": "巻下げ速度が過大になると、荷が危険な速さで下がるおそれがあります。速度開閉器は、回転速度などを検出し、所定の速度を超えたときに非常ブレーキを働かせるなどの装置です。**巻過防止装置**が「位置」を見ているのに対し、こちらは「速度」を見ます。", "id": "1-10-fde7a2e0b6ef"}], "id": "1-10", "chapter": 1, "fields": [{"id": "1-10/2/text", "raw": "フックを巻き上げ続けると、上部のシーブや機械に**フックブロック**が衝突するおそれがあります。そのままロープを巻こうとすると大きな張力が生じ、損傷や落下事故につながります。巻過防止装置は、この上げすぎを防ぐ装置です。", "text": "フックを巻き上げ続けると、上部のシーブや機械にフックブロックが衝突するおそれがあります。そのままロープを巻こうとすると大きな張力が生じ、損傷や落下事故につながります。巻過防止装置は、この上げすぎを防ぐ装置です。", "terms": ["巻過防止装置"], "block": "1-10-f3ef8b2e68cb"}, {"id": "1-10/3/text", "raw": "つり具が所定の上限位置に近づくと、**リミットスイッチ**が作動し、巻上げを停止させるなどの働きをします。リミットは限界という意味です。通常の運転では、運転者が適切な位置で止めることが基本で、毎回この装置に当てて止めるためのものではありません。", "text": "つり具が所定の上限位置に近づくと、リミットスイッチが作動し、巻上げを停止させるなどの働きをします。リミットは限界という意味です。通常の運転では、運転者が適切な位置で止めることが基本で、毎回この装置に当てて止めるためのものではありません。", "terms": [], "block": "1-10-a2a14319dd5c"}, {"id": "1-10/5/text", "raw": "図の重錘形・ロッド形のような直働式は、**フックブロック**などの動きで直接スイッチを働かせます。重錘形では、上がってきたフックブロックが重錘を持ち上げ、その変化をスイッチへ伝えます。重錘は検出に使うおもりです。「フックがこの位置へ来た」という実際の位置を検出している、と考えましょう。", "text": "図の重錘形・ロッド形のような直働式は、フックブロックなどの動きで直接スイッチを働かせます。重錘形では、上がってきたフックブロックが重錘を持ち上げ、その変化をスイッチへ伝えます。重錘は検出に使うおもりです。「フックがこの位置へ来た」という実際の位置を検出している、と考えましょう。", "terms": [], "block": "1-10-f60e7a9e5b20"}, {"id": "1-10/6/text", "raw": "図のねじ形のような間接式は、ドラムの回転からフック位置を見積もります。ねじ形では、ドラムの回転をねじ軸へ伝え、ねじに沿って動く部品が所定の位置でスイッチを働かせます。動く部品は「**トラベラー**」と呼びます。カム形では、回転するカムでスイッチを働かせます。", "text": "図のねじ形のような間接式は、ドラムの回転からフック位置を見積もります。ねじ形では、ドラムの回転をねじ軸へ伝え、ねじに沿って動く部品が所定の位置でスイッチを働かせます。動く部品は「トラベラー」と呼びます。カム形では、回転するカムでスイッチを働かせます。", "terms": [], "block": "1-10-33eddf4f450e"}, {"id": "1-10/7/rows:0:0", "raw": "**直働式**（重錘形・ロッド形）", "text": "直働式（重錘形・ロッド形）", "terms": ["直働式", "間接式"], "block": "1-10-3f47f48f2ee1"}, {"id": "1-10/7/rows:0:1", "raw": "フックの位置を直接検出。交換後の作動位置の再調整は不要", "text": "フックの位置を直接検出。交換後の作動位置の再調整は不要", "terms": ["直働式", "間接式"], "block": "1-10-3f47f48f2ee1"}, {"id": "1-10/7/rows:1:0", "raw": "**間接式**（ねじ形・カム形）", "text": "間接式（ねじ形・カム形）", "terms": ["直働式", "間接式"], "block": "1-10-3f47f48f2ee1"}, {"id": "1-10/7/rows:1:1", "raw": "ドラムの回転から位置を検出。交換後は作動位置を再調整", "text": "ドラムの回転から位置を検出。交換後は作動位置を再調整", "terms": ["直働式", "間接式"], "block": "1-10-3f47f48f2ee1"}, {"id": "1-10/8/text", "raw": "間接式は接点を組み合わせて**上限・下限**の制限に使えます。直働式の重錘形は、上がってきたフックが重錘を持ち上げるため、巻下げの下限検出には使いません。", "text": "間接式は接点を組み合わせて上限・下限の制限に使えます。直働式の重錘形は、上がってきたフックが重錘を持ち上げるため、巻下げの下限検出には使いません。", "terms": [], "block": "1-10-50b40c50b224"}, {"id": "1-10/9/rows:0:0", "raw": "一般", "text": "一般", "terms": ["0.25m以上", "0.05m以上"], "block": "1-10-0e74cb6b16ca"}, {"id": "1-10/9/rows:0:1", "raw": "**0.25m以上**", "text": "0.25m以上", "terms": ["0.25m以上", "0.05m以上"], "block": "1-10-0e74cb6b16ca"}, {"id": "1-10/9/rows:1:0", "raw": "直働式", "text": "直働式", "terms": ["0.25m以上", "0.05m以上"], "block": "1-10-0e74cb6b16ca"}, {"id": "1-10/9/rows:1:1", "raw": "**0.05m以上**", "text": "0.05m以上", "terms": ["0.25m以上", "0.05m以上"], "block": "1-10-0e74cb6b16ca"}, {"id": "1-10/10/text", "raw": "間隔は、つり具等の上面と衝突のおそれがある上部の物の下面の間で見ます。詳しい適用条件は、第2章「クレーンの使用」で確認します。", "text": "間隔は、つり具等の上面と衝突のおそれがある上部の物の下面の間で見ます。詳しい適用条件は、第2章「クレーンの使用」で確認します。", "terms": [], "block": "1-10-d72b3e42add6"}, {"id": "1-10/13/text", "raw": "**通常の停止は制御器などで行い、非常停止は危険時に動作を止めるために使います。** 非常停止や巻過防止装置を、ふだんの停止手段として毎回使うものではありません。", "text": "通常の停止は制御器などで行い、非常停止は危険時に動作を止めるために使います。 非常停止や巻過防止装置を、ふだんの停止手段として毎回使うものではありません。", "terms": [], "block": "1-10-451574f3680e"}, {"id": "1-10/14/text", "raw": "**非常停止の解除と、運転の再始動は別の操作。** 危険や停止原因を確認し、安全な状態と所定の始動条件を満たしてから再開します。ボタンを戻しただけで不意に動き出さないことが大切です。", "text": "非常停止の解除と、運転の再始動は別の操作。 危険や停止原因を確認し、安全な状態と所定の始動条件を満たしてから再開します。ボタンを戻しただけで不意に動き出さないことが大切です。", "terms": [], "block": "1-10-940abd3f5b57"}, {"id": "1-10/16/text", "raw": "過負荷は、その条件で定められた定格荷重を超える負荷です。図で見たように、ジブクレーンでは同じ荷でも作業半径が変われば過負荷になります。**過負荷防止装置**は、荷重や姿勢などからこの状態を検出し、危険な動作を停止させるなどの働きをします。機種や条件によって、表示・警報などの構成は異なります。", "text": "過負荷は、その条件で定められた定格荷重を超える負荷です。図で見たように、ジブクレーンでは同じ荷でも作業半径が変われば過負荷になります。過負荷防止装置は、荷重や姿勢などからこの状態を検出し、危険な動作を停止させるなどの働きをします。機種や条件によって、表示・警報などの構成は異なります。", "terms": ["過負荷防止装置"], "block": "1-10-f3d77ea6c34f"}, {"id": "1-10/17/text", "raw": "**傾斜角指示装置**は、ジブの傾斜角を示します。運転者は角度や荷重表を確認し、今の条件でどれだけの荷をつれるかを判断します。「角度を示す装置」と「過負荷を検出して停止させる装置」は、目的が違います。", "text": "傾斜角指示装置は、ジブの傾斜角を示します。運転者は角度や荷重表を確認し、今の条件でどれだけの荷をつれるかを判断します。「角度を示す装置」と「過負荷を検出して停止させる装置」は、目的が違います。", "terms": [], "block": "1-10-472a273ad266"}, {"id": "1-10/19/text", "raw": "トロリやクレーン本体がレールの端まで進みすぎると、走路から外れるおそれがあります。端部で走り出しを防ぐ備えが**車輪止め**などです。一方、緩衝装置は、衝突したときの衝撃を和らげます。止める位置を作ることと、衝撃を吸収することを分けて考えましょう。", "text": "トロリやクレーン本体がレールの端まで進みすぎると、走路から外れるおそれがあります。端部で走り出しを防ぐ備えが車輪止めなどです。一方、緩衝装置は、衝突したときの衝撃を和らげます。止める位置を作ることと、衝撃を吸収することを分けて考えましょう。", "terms": [], "block": "1-10-178c4f7c8d05"}, {"id": "1-10/21/rows:0:0", "raw": "**横行用**", "text": "横行用", "terms": ["1/4以上", "1/2以上"], "block": "1-10-466e51bbb3f8"}, {"id": "1-10/21/rows:0:1", "raw": "車輪直径の**1/4以上**。直径400mmなら100mm以上", "text": "車輪直径の1/4以上。直径400mmなら100mm以上", "terms": ["1/4以上", "1/2以上"], "block": "1-10-466e51bbb3f8"}, {"id": "1-10/21/rows:1:0", "raw": "**走行用**", "text": "走行用", "terms": ["1/4以上", "1/2以上"], "block": "1-10-466e51bbb3f8"}, {"id": "1-10/21/rows:1:1", "raw": "車輪直径の**1/2以上**。直径400mmなら200mm以上", "text": "車輪直径の1/2以上。直径400mmなら200mm以上", "terms": ["1/4以上", "1/2以上"], "block": "1-10-466e51bbb3f8"}, {"id": "1-10/24/text", "raw": "同じランウェイを複数のクレーンが使うと、クレーン同士が近づいて衝突する危険があります。衝突防止装置は、距離や接近を検出して停止させるなどの装置です。光や超音波、**リミットスイッチ**などを用いる方式があります。", "text": "同じランウェイを複数のクレーンが使うと、クレーン同士が近づいて衝突する危険があります。衝突防止装置は、距離や接近を検出して停止させるなどの装置です。光や超音波、リミットスイッチなどを用いる方式があります。", "terms": ["衝突防止装置"], "block": "1-10-2160b5bedd94"}, {"id": "1-10/26/text", "raw": "屋外の走行クレーンでは、運転していなくても強い風で押され、レール上を走り出すおそれがあります。この「風に押されて走り出す」危険を防ぐのが**逸走防止装置**です。レールをつかむなどして、機体の移動を抑えます。", "text": "屋外の走行クレーンでは、運転していなくても強い風で押され、レール上を走り出すおそれがあります。この「風に押されて走り出す」危険を防ぐのが逸走防止装置です。レールをつかむなどして、機体の移動を抑えます。", "terms": ["逸走防止装置"], "block": "1-10-2970cb4bb144"}, {"id": "1-10/27/text", "raw": "屋外の走行クレーンでは、瞬間風速**30m/sを超える風のおそれ**があるとき、逸走防止措置を取ります。作業を続けてよい風速の上限ではありません。", "text": "屋外の走行クレーンでは、瞬間風速30m/sを超える風のおそれがあるとき、逸走防止措置を取ります。作業を続けてよい風速の上限ではありません。", "terms": ["30m/sを超える風のおそれ"], "block": "1-10-fc39e56aa39e"}, {"id": "1-10/28/text", "raw": "強風で危険が予想されるときは、別に作業を中止します。", "text": "強風で危険が予想されるときは、別に作業を中止します。", "terms": [], "block": "1-10-9cac1fc9992c"}, {"id": "1-10/29/rows:0:0", "raw": "**レールクランプ**", "text": "レールクランプ", "terms": ["レールクランプ", "アンカー"], "block": "1-10-df3a75e1508c"}, {"id": "1-10/29/rows:0:1", "raw": "走行レールを挟んで移動を抑える", "text": "走行レールを挟んで移動を抑える", "terms": ["レールクランプ", "アンカー"], "block": "1-10-df3a75e1508c"}, {"id": "1-10/29/rows:1:0", "raw": "**アンカー**", "text": "アンカー", "terms": ["レールクランプ", "アンカー"], "block": "1-10-df3a75e1508c"}, {"id": "1-10/29/rows:1:1", "raw": "決められた係留位置で基礎側へ固定する", "text": "決められた係留位置で基礎側へ固定する", "terms": ["レールクランプ", "アンカー"], "block": "1-10-df3a75e1508c"}, {"id": "1-10/30/text", "raw": "いずれも風で機体が走り出す逸走を防ぐもので、通常の**走行**ブレーキとは役割を分けます。", "text": "いずれも風で機体が走り出す逸走を防ぐもので、通常の走行ブレーキとは役割を分けます。", "terms": [], "block": "1-10-99ddedc70b43"}, {"id": "1-10/32/text", "raw": "**斜行防止装置**は、左右の走行がそろわずクレーンが斜めになることを抑えます。衝突は他の機械との接近、逸走は風による移動、斜行は左右の走り方のずれです。名称の「防ぐ対象」を入れ替えないようにしましょう。", "text": "斜行防止装置は、左右の走行がそろわずクレーンが斜めになることを抑えます。衝突は他の機械との接近、逸走は風による移動、斜行は左右の走り方のずれです。名称の「防ぐ対象」を入れ替えないようにしましょう。", "terms": [], "block": "1-10-b9286398e138"}, {"id": "1-10/34/text", "raw": "**警報装置**は、周囲の作業者へクレーンの動きを知らせる装置です。ブザー、ベル、サイレンなどがあります。走行するクレーンに備えることが基本ですが、床上で運転し運転者がクレーンとともに移動するものなど、適用には条件があります。", "text": "警報装置は、周囲の作業者へクレーンの動きを知らせる装置です。ブザー、ベル、サイレンなどがあります。走行するクレーンに備えることが基本ですが、床上で運転し運転者がクレーンとともに移動するものなど、適用には条件があります。", "terms": [], "block": "1-10-fe1ab7a9cd5c"}, {"id": "1-10/35/text", "raw": "**フートスイッチ**は、足で操作するスイッチです。この章で扱う運転室への通路等のものは、踏むと主回路を遮断する仕組みで、通行時の感電防止などを目的とします。足で踏んで荷を動かす一般の操作スイッチと混同しないように、どこに設けられ、何を切るのかを確認します。", "text": "フートスイッチは、足で操作するスイッチです。この章で扱う運転室への通路等のものは、踏むと主回路を遮断する仕組みで、通行時の感電防止などを目的とします。足で踏んで荷を動かす一般の操作スイッチと混同しないように、どこに設けられ、何を切るのかを確認します。", "terms": [], "block": "1-10-e4eae3cccd15"}, {"id": "1-10/38/text", "raw": "操作レバーの停止位置を「ゼロ位置」、段階的な操作位置を「ノッチ」といいます。**ゼロノッチインターロック**は、レバーがゼロ位置へ戻っていないと、主電磁接触器を投入できない仕組みです。主電磁接触器は、主回路を入れたり切ったりする電気の開閉器です。", "text": "操作レバーの停止位置を「ゼロ位置」、段階的な操作位置を「ノッチ」といいます。ゼロノッチインターロックは、レバーがゼロ位置へ戻っていないと、主電磁接触器を投入できない仕組みです。主電磁接触器は、主回路を入れたり切ったりする電気の開閉器です。", "terms": ["ゼロノッチインターロック"], "block": "1-10-659e81f8a997"}, {"id": "1-10/39/text", "raw": "例えば、レバーを**巻上げ**位置にしたまま停電し、その後に電気が戻る場面を考えてください。復旧しただけで巻上げが再開すると、周囲の人が予想しない動きになります。いったんレバーをゼロへ戻し、改めて操作する必要を設けることで、意図しない再始動を防ぎます。", "text": "例えば、レバーを巻上げ位置にしたまま停電し、その後に電気が戻る場面を考えてください。復旧しただけで巻上げが再開すると、周囲の人が予想しない動きになります。いったんレバーをゼロへ戻し、改めて操作する必要を設けることで、意図しない再始動を防ぎます。", "terms": [], "block": "1-10-280824bcf729"}, {"id": "1-10/40/text", "raw": "「インターロック」は、所定の条件を満たさないと操作を成立させない仕組みです。停電後の危険を、ブレーキだけでなく操作回路でも防ぐ、と理解してください。", "text": "「インターロック」は、所定の条件を満たさないと操作を成立させない仕組みです。停電後の危険を、ブレーキだけでなく操作回路でも防ぐ、と理解してください。", "terms": [], "block": "1-10-f99f22e23a90"}, {"id": "1-10/42/text", "raw": "巻下げ速度が過大になると、荷が危険な速さで下がるおそれがあります。速度開閉器は、回転速度などを検出し、所定の速度を超えたときに非常ブレーキを働かせるなどの装置です。**巻過防止装置**が「位置」を見ているのに対し、こちらは「速度」を見ます。", "text": "巻下げ速度が過大になると、荷が危険な速さで下がるおそれがあります。速度開閉器は、回転速度などを検出し、所定の速度を超えたときに非常ブレーキを働かせるなどの装置です。巻過防止装置が「位置」を見ているのに対し、こちらは「速度」を見ます。", "terms": [], "block": "1-10-fde7a2e0b6ef"}], "candidates": [{"id": "1-10/2/text#83", "fieldID": "1-10/2/text", "block": "1-10-f3ef8b2e68cb", "answer": "巻過防止装置", "category": "key", "prompt": "［用語？］", "start": 83, "end": 89, "context": "フックを巻き上げ続けると、上部のシーブや機械にフックブロックが衝突するおそれがあります。そのままロープを巻こうとすると大きな張力が生じ、損傷や落下事故につながります。巻過防止装置は、この上げすぎを防ぐ装置です。", "start16": 83, "end16": 89}, {"id": "1-10/7/rows:0:0#0", "fieldID": "1-10/7/rows:0:0", "block": "1-10-3f47f48f2ee1", "answer": "直働式", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "直働式（重錘形・ロッド形）", "start16": 0, "end16": 3}, {"id": "1-10/7/rows:1:0#0", "fieldID": "1-10/7/rows:1:0", "block": "1-10-3f47f48f2ee1", "answer": "間接式", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "間接式（ねじ形・カム形）", "start16": 0, "end16": 3}, {"id": "1-10/9/rows:0:1#0", "fieldID": "1-10/9/rows:0:1", "block": "1-10-0e74cb6b16ca", "answer": "0.25m以上", "category": "num", "prompt": "［数値？］", "start": 0, "end": 7, "context": "0.25m以上", "start16": 0, "end16": 7}, {"id": "1-10/9/rows:1:1#0", "fieldID": "1-10/9/rows:1:1", "block": "1-10-0e74cb6b16ca", "answer": "0.05m以上", "category": "num", "prompt": "［数値？］", "start": 0, "end": 7, "context": "0.05m以上", "start16": 0, "end16": 7}, {"id": "1-10/16/text#67", "fieldID": "1-10/16/text", "block": "1-10-f3d77ea6c34f", "answer": "過負荷防止装置", "category": "key", "prompt": "［用語？］", "start": 67, "end": 74, "context": "過負荷は、その条件で定められた定格荷重を超える負荷です。図で見たように、ジブクレーンでは同じ荷でも作業半径が変われば過負荷になります。過負荷防止装置は、荷重や姿勢などからこの状態を検出し、危険な動作を停止させるなどの働きをします。機種や条件によって、表示・警報などの構成は異なります。", "start16": 67, "end16": 74}, {"id": "1-10/21/rows:0:1#5", "fieldID": "1-10/21/rows:0:1", "block": "1-10-466e51bbb3f8", "answer": "1/4以上", "category": "num", "prompt": "［数値？］", "start": 5, "end": 10, "context": "車輪直径の1/4以上。直径400mmなら100mm以上", "start16": 5, "end16": 10}, {"id": "1-10/21/rows:1:1#5", "fieldID": "1-10/21/rows:1:1", "block": "1-10-466e51bbb3f8", "answer": "1/2以上", "category": "num", "prompt": "［数値？］", "start": 5, "end": 10, "context": "車輪直径の1/2以上。直径400mmなら200mm以上", "start16": 5, "end16": 10}, {"id": "1-10/24/text#43", "fieldID": "1-10/24/text", "block": "1-10-2160b5bedd94", "answer": "衝突防止装置", "category": "key", "prompt": "［用語？］", "start": 43, "end": 49, "context": "同じランウェイを複数のクレーンが使うと、クレーン同士が近づいて衝突する危険があります。衝突防止装置は、距離や接近を検出して停止させるなどの装置です。光や超音波、リミットスイッチなどを用いる方式があります。", "start16": 43, "end16": 49}, {"id": "1-10/26/text#68", "fieldID": "1-10/26/text", "block": "1-10-2970cb4bb144", "answer": "逸走防止装置", "category": "key", "prompt": "［用語？］", "start": 68, "end": 74, "context": "屋外の走行クレーンでは、運転していなくても強い風で押され、レール上を走り出すおそれがあります。この「風に押されて走り出す」危険を防ぐのが逸走防止装置です。レールをつかむなどして、機体の移動を抑えます。", "start16": 68, "end16": 74}, {"id": "1-10/27/text#16", "fieldID": "1-10/27/text", "block": "1-10-fc39e56aa39e", "answer": "30m/sを超える風のおそれ", "category": "num", "prompt": "［数値？］", "start": 16, "end": 30, "context": "屋外の走行クレーンでは、瞬間風速30m/sを超える風のおそれがあるとき、逸走防止措置を取ります。作業を続けてよい風速の上限ではありません。", "start16": 16, "end16": 30}, {"id": "1-10/29/rows:0:0#0", "fieldID": "1-10/29/rows:0:0", "block": "1-10-df3a75e1508c", "answer": "レールクランプ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "レールクランプ", "start16": 0, "end16": 7}, {"id": "1-10/29/rows:1:0#0", "fieldID": "1-10/29/rows:1:0", "block": "1-10-df3a75e1508c", "answer": "アンカー", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "アンカー", "start16": 0, "end16": 4}, {"id": "1-10/38/text#38", "fieldID": "1-10/38/text", "block": "1-10-659e81f8a997", "answer": "ゼロノッチインターロック", "category": "key", "prompt": "［用語？］", "start": 38, "end": 50, "context": "操作レバーの停止位置を「ゼロ位置」、段階的な操作位置を「ノッチ」といいます。ゼロノッチインターロックは、レバーがゼロ位置へ戻っていないと、主電磁接触器を投入できない仕組みです。主電磁接触器は、主回路を入れたり切ったりする電気の開閉器です。", "start16": 38, "end16": 50}], "rounds": {"all": [["1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0"], ["1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83"], ["1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5"], ["1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0"], ["1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43"], ["1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0"], ["1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0"], ["1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38"], ["1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67"], ["1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5"], ["1-10/2/text#83", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0"], ["1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16"], ["1-10/9/rows:1:1#0", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0"], ["1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/29/rows:0:0#0", "1-10/26/text#68"]], "key": [["1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43"], ["1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0"], ["1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0"], ["1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38"], ["1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67"], ["1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0"], ["1-10/7/rows:0:0#0", "1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68"], ["1-10/2/text#83", "1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0"], ["1-10/24/text#43", "1-10/7/rows:1:0#0", "1-10/29/rows:1:0#0", "1-10/38/text#38", "1-10/16/text#67", "1-10/29/rows:0:0#0", "1-10/26/text#68", "1-10/7/rows:0:0#0", "1-10/2/text#83"]], "num": [["1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0"], ["1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/21/rows:0:1#5"], ["1-10/27/text#16", "1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0"], ["1-10/21/rows:1:1#5", "1-10/9/rows:1:1#0", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16"], ["1-10/9/rows:1:1#0", "1-10/21/rows:0:1#5", "1-10/9/rows:0:1#0", "1-10/27/text#16", "1-10/21/rows:1:1#5"]]}}, {"title": "ブレーキ――止める働きと、保持する働き", "blocks": [{"type": "p", "style": "lead", "text": "ブレーキの仕事は二つ。**動きを止めること** と、**止めた荷をその位置に保つこと** です。", "id": "1-11-9f99bb9512c4"}, {"type": "sub", "text": "モーターを止めるだけでは荷を保持できない", "id": "1-11-8ff2b927daeb"}, {"type": "p", "text": "**巻上げ**中は電動機がドラムを回します。停止しても、荷は重力で下へ引かれ続けています。荷の重さがドラムを逆に回そうとするため、その回転を止めて保持する必要があります。", "id": "1-11-4a795ec5a85a", "quizTerms": ["保持"]}, {"type": "p", "text": "ブレーキには、動いているものを減速して止める「制動」と、止まった位置を保つ「保持」の働きがあります。**巻上げ**用では、荷を下へ落とさず保持することが重要です。", "id": "1-11-6ac74593249b", "quizTerms": ["制動"]}, {"type": "p", "text": "ブレーキは、摩擦材を回転部分へ押し付け、回転に抵抗します。ドラムブレーキの摩擦材を「ライニング」、**ディスクブレーキ**では「パッド」と呼びます。摩擦材が摩耗したり、油が付いて摩擦が低下したりすると、必要な制動力を得られないことがあります。", "id": "1-11-c09a64e40cc2", "quizTerms": ["ライニング"]}, {"type": "sub", "text": "形による分類と、作動方式による分類", "id": "1-11-4c38923f3bc4"}, {"type": "p", "text": "**形で分ける：** ブロック・バンド・ディスク。**動かす方法で分ける：** 電磁式・油圧式。例えば「ドラム形で電磁式」のように、二つの分類を組み合わせて呼びます。", "id": "1-11-f66a10814d9c", "style": "tip"}, {"type": "sub", "text": "ばねで制動し、電磁石で開放するブレーキ", "id": "1-11-bc25bc2119f6"}, {"type": "p", "text": "**電気が切れると、ばねで制動。通電すると、電磁石で開放。** 図の方式は、電気がなくても荷を保持できるよう、ばねがブレーキを効かせます。これを無電圧作動型といいます。", "id": "1-11-2907ea09ef58", "quizTerms": ["ばね", "無電圧作動型"]}, {"type": "img", "asset": "1-11_supplement_f28_20261023", "labels": [], "legend": [], "caption": "ばねで制動し、通電した電磁石で開放する方式の模式図。部品の形による分類と、作動方式による分類を分ける。", "id": "1-11-f6fd5af9b3ab", "style": "figure", "_previewFile": "1-11_supplement_f28_20261023.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**バンドブレーキ**は帯で締め、**ブロックブレーキ**は靴形の摩擦材を押し付けます。どちらもドラムの外周に摩擦を生みます。", "id": "1-11-798e1a08af15", "quizTerms": ["バンドブレーキ", "ブロックブレーキ"]}, {"type": "p", "text": "**ディスクブレーキ**は、円板を両側からパッドで挟みます。放熱しやすく、小形にでき、ホイストの巻上装置にも使われます。", "id": "1-11-6a224b990320"}, {"type": "img", "asset": "1-11_supplement_f30_20261023", "labels": [], "legend": [], "caption": "帯を締めて制動する。調整用ボルトは、緩めたときのすき間を均等にする。", "id": "1-11-c160afa65a21", "style": "figure", "_previewFile": "1-11_supplement_f30_20261023.png", "_width": 1536, "_height": 1024}, {"id": "1-11-rev26-band-adjust", "type": "p", "text": "**調整用ボルトは、バンドを均等に緩めるため。** 緩めた帯がドラムの一部に当たり続けないよう、すき間を調整します。", "style": "tip"}, {"id": "1-11-rev26-band-check-q", "type": "p", "text": "**確認：** バンドのすき間を調整する部品は、摩擦パッド？ 調整用ボルト？", "style": "question"}, {"id": "1-11-rev26-band-check-a", "type": "p", "text": "**調整用ボルト。** 摩擦パッドはディスクを挟む部品です。バンドでは「緩めたときに均等に離れる」と結び付けます。", "style": "answer"}, {"type": "img", "asset": "1-11_supplement_f29_20261023", "labels": [], "legend": [], "caption": "電動機で油圧を作り、押上機とリンクでブレーキを開放する代表的な方式。", "id": "1-11-53fe2f2e6fc7", "style": "figure", "_previewFile": "1-11_supplement_f29_20261023.png", "_width": 1472, "_height": 1068}, {"type": "p", "text": "足踏み操作などの油圧ブレーキでは、油漏れや空気混入があると、操作の力が十分に伝わらなくなる場合があります。油圧を使う仕組みを一つにまとめず、開放用の押上機なのか、**制動**操作の力を伝える油圧回路なのかを区別します。", "id": "1-11-0a50edd96876"}, {"type": "p", "text": "**電動油圧押上機ブレーキ：ばねで制動、油圧で開放。** 静かで衝撃が小さく、横行・走行などに使われます。停止までの時間は電磁式より長めです。**足踏み油圧式ディスクブレーキ**は、天井クレーンの走行やジブクレーンの旋回に使われます。", "id": "1-11-f5050a623914", "quizTerms": ["足踏み油圧式ディスクブレーキ", "電動油圧押上機ブレーキ"]}, {"type": "img", "asset": "1-11_supplement_f31_20261023", "labels": [], "legend": [], "caption": "足で加えた力を油圧で伝え、パッドで円板を挟んで制動する模式図。押上機ブレーキの開放動作とは区別する。", "id": "1-11-c3e43801f8fe", "style": "figure", "_previewFile": "1-11_supplement_f31_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "1.5倍は何の数値か", "id": "1-11-dd0d0ad2324f"}, {"id": "1-11-b41eaa219da1", "type": "table", "headers": ["対象", "必要な制動トルク"], "rows": [["つり上げ装置・起伏装置", "定格荷重相当の荷をつったときのトルクの**1.5倍以上（150％以上）**"]], "quizTerms": ["1.5倍以上"]}, {"type": "p", "text": "比較対象のトルクが100 N・mなら、必要な制動トルクは150 N・m以上です。「荷物を定格荷重の**1.5倍**までつってよい」という意味ではありません。1.5倍はブレーキの能力に関する数字です。", "id": "1-11-28eb19614bd5"}, {"type": "p", "text": "当該ブレーキのうち人力によらないものは、**動力**が遮断された場合に自動的に作用する構成が必要です。ただし、シリンダを用いる装置などには規格上の例外があります。横行・走行ブレーキの省略にも所定の条件があるため、「屋内で遅いからブレーキは不要」とだけ判断しません。", "id": "1-11-a3701fbbe486"}], "id": "1-11", "chapter": 1, "fields": [{"id": "1-11/2/text", "raw": "**巻上げ**中は電動機がドラムを回します。停止しても、荷は重力で下へ が十分に伝わらなくなる場合があります。油圧を使う仕組みを一つにまとめず、開放用の押上機なのか、**制動**操作の力を伝える油圧回路なのかを区別します。", "text": "足踏み操作などの油圧ブレーキでは、油漏れや空気混入があると、操作の力が十分に伝わらなくなる場合があります。油圧を使う仕組みを一つにまとめず、開放用の押上機なのか、制動操作の力を伝える油圧回路なのかを区別します。", "terms": [], "block": "1-11-0a50edd96876"}, {"id": "1-11/18/text", "raw": "**電動油圧押上機ブレーキ：ばねで制動、油圧で開放。** 静かで衝撃が小さく、横行・走行などに使われます。停止までの時間は電磁式より長めです。**足踏み油圧式ディスクブレーキ**は、天井クレーンの走行やジブクレーンの旋回に使われます。", "text": "電動油圧押上機ブレーキ：ばねで制動、油圧で開放。 静かで衝撃が小さく、横行・走行などに使われます。停止までの時間は電磁式より長めです。足踏み油圧式ディスクブレーキは、天井クレーンの走行やジブクレーンの旋回に使われます。", "terms": ["足踏み油圧式ディスクブレーキ", "電動油圧押上機ブレーキ"], "block": "1-11-f5050a623914"}, {"id": "1-11/21/rows:0:0", "raw": "つり上げ装置・起伏装置", "text": "つり上げ装置・起伏装置", "terms": ["1.5倍以上"], "block": "1-11-b41eaa219da1"}, {"id": "1-11/21/rows:0:1", "raw": "定格荷重相当の荷をつったときのトルクの**1.5倍以上（150％以上）**", "text": "定格荷重相当の荷をつったときのトルクの1.5倍以上（150％以上）", "terms": ["1.5倍以上"], "block": "1-11-b41eaa219da1"}, {"id": "1-11/22/text", "raw": "比較対象のトルクが100 N・mなら、必要な制動トルクは150 N・m以上です。「荷物を定格荷重の**1.5倍**までつってよい」という意味ではありません。1.5倍はブレーキの能力に関する数字です。", "text": "比較対象のトルクが100 N・mなら、必要な制動トルクは150 N・m以上です。「荷物を定格荷重の1.5倍までつってよい」という意味ではありません。1.5倍はブレーキの能力に関する数字です。", "terms": [], "block": "1-11-28eb19614bd5"}, {"id": "1-11/23/text", "raw": "当該ブレーキのうち人力によらないものは、**動力**が遮断された場合に自動的に作用する構成が必要です。ただし、シリンダを用いる装置などには規格上の例外があります。横行・走行ブレーキの省略にも所定の条件があるため、「屋内で遅いからブレーキは不要」とだけ判断しません。", "text": "当該ブレーキのうち人力によらないものは、動力が遮断された場合に自動的に作用する構成が必要です。ただし、シリンダを用いる装置などには規格上の例外があります。横行・走行ブレーキの省略にも所定の条件があるため、「屋内で遅いからブレーキは不要」とだけ判断しません。", "terms": [], "block": "1-11-a3701fbbe486"}], "candidates": [{"id": "1-11/2/text#69", "fieldID": "1-11/2/text", "block": "1-11-4a795ec5a85a", "answer": "保持", "category": "key", "prompt": "［用語？］", "start": 69, "end": 71, "context": "巻上げ中は電動機がドラムを回します。停止しても、荷は重力で下へ引かれ続けています。荷の重さがドラムを逆に回そうとするため、その回転を止めて保持する必要があります。", "start16": 69, "end16": 71}, {"id": "1-11/3/text#23", "fieldID": "1-11/3/text", "block": "1-11-6ac74593249b", "answer": "制動", "category": "key", "prompt": "［用語？］", "start": 23, "end": 25, "context": "ブレーキには、動いているものを減速して止める「制動」と、止まった位置を保つ「保持」の働きがあります。巻上げ用では、荷を下へ落とさず保持することが重要です。", "start16": 23, "end16": 25}, {"id": "1-11/4/text#42", "fieldID": "1-11/4/text", "block": "1-11-c09a64e40cc2", "answer": "ライニング", "category": "key", "prompt": "［用語？］", "start": 42, "end": 47, "context": "ブレーキは、摩擦材を回転部分へ押し付け、回転に抵抗します。ドラムブレーキの摩擦材を「ライニング」、ディスクブレーキでは「パッド」と呼びます。摩擦材が摩耗したり、油が付いて摩擦が低下したりすると、必要な制動力を得られないことがあります。", "start16": 42, "end16": 47}, {"id": "1-11/8/text#8", "fieldID": "1-11/8/text", "block": "1-11-2907ea09ef58", "answer": "ばね", "category": "key", "prompt": "［用語？］", "start": 8, "end": 10, "context": "電気が切れると、ばねで制動。通電すると、電磁石で開放。 図の方式は、電気がなくても荷を保持できるよう、ばねがブレーキを効かせます。これを無電圧作動型といいます。", "start16": 8, "end16": 10}, {"id": "1-11/8/text#68", "fieldID": "1-11/8/text", "block": "1-11-2907ea09ef58", "answer": "無電圧作動型", "category": "key", "prompt": "［用語？］", "start": 68, "end": 74, "context": "電気が切れると、ばねで制動。通電すると、電磁石で開放。 図の方式は、電気がなくても荷を保持できるよう、ばねがブレーキを効かせます。これを無電圧作動型といいます。", "start16": 68, "end16": 74}, {"id": "1-11/10/text#0", "fieldID": "1-11/10/text", "block": "1-11-798e1a08af15", "answer": "バンドブレーキ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "バンドブレーキは帯で締め、ブロックブレーキは靴形の摩擦材を押し付けます。どちらもドラムの外周に摩擦を生みます。", "start16": 0, "end16": 7}, {"id": "1-11/10/text#13", "fieldID": "1-11/10/text", "block": "1-11-798e1a08af15", "answer": "ブロックブレーキ", "category": "key", "prompt": "［用語？］", "start": 13, "end": 21, "context": "バンドブレーキは帯で締め、ブロックブレーキは靴形の摩擦材を押し付けます。どちらもドラムの外周に摩擦を生みます。", "start16": 13, "end16": 21}, {"id": "1-11/18/text#0", "fieldID": "1-11/18/text", "block": "1-11-f5050a623914", "answer": "電動油圧押上機ブレーキ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 11, "context": "電動油圧押上機ブレーキ：ばねで制動、油圧で開放。 静かで衝撃が小さく、横行・走行などに使われます。停止までの時間は電磁式より長めです。足踏み油圧式ディスクブレーキは、天井クレーンの走行やジブクレーンの旋回に使われます。", "start16": 0, "end16": 11}, {"id": "1-11/18/text#67", "fieldID": "1-11/18/text", "block": "1-11-f5050a623914", "answer": "足踏み油圧式ディスクブレーキ", "category": "key", "prompt": "［用語？］", "start": 67, "end": 81, "context": "電動油圧押上機ブレーキ：ばねで制動、油圧で開放。 静かで衝撃が小さく、横行・走行などに使われます。停止までの時間は電磁式より長めです。足踏み油圧式ディスクブレーキは、天井クレーンの走行やジブクレーンの旋回に使われます。", "start16": 67, "end16": 81}, {"id": "1-11/21/rows:0:1#19", "fieldID": "1-11/21/rows:0:1", "block": "1-11-b41eaa219da1", "answer": "1.5倍以上", "category": "num", "prompt": "［数値？］", "start": 19, "end": 25, "context": "定格荷重相当の荷をつったときのトルクの1.5倍以上（150％以上）", "start16": 19, "end16": 25}], "rounds": {"all": [["1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0"], ["1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19"], ["1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23"], ["1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42"], ["1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68"], ["1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69"], ["1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67"], ["1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13"], ["1-11/10/text#0", "1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8"], ["1-11/18/text#0", "1-11/21/rows:0:1#19", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0"]], "key": [["1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0"], ["1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23"], ["1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42"], ["1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68"], ["1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69"], ["1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67"], ["1-11/8/text#8", "1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13"], ["1-11/10/text#0", "1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8"], ["1-11/18/text#0", "1-11/3/text#23", "1-11/4/text#42", "1-11/8/text#68", "1-11/2/text#69", "1-11/18/text#67", "1-11/10/text#13", "1-11/8/text#8", "1-11/10/text#0"]], "num": [["1-11/21/rows:0:1#19"]]}}, {"title": "安全運転――荷を上げる前に問題を見つける", "blocks": [{"type": "p", "style": "lead", "text": "**荷・玉掛け・通り道を、動かす前に確認する。** 運転の手順に沿って安全を考えます。", "id": "1-14-1d8fef24a801"}, {"type": "sub", "text": "作業前に何を確認するか", "id": "1-14-132062fd954e"}, {"type": "p", "text": "作業を始める前に、機械の状態、荷の重さ、用具、運ぶ経路、周囲の人、合図方法を確認します。荷が空中へ上がってから、重すぎる、通れない、人がいる、ロープの掛け方が悪いと分かっても、安全に直すのは難しいためです。", "id": "1-14-492b7efec08e"}, {"type": "p", "text": "運転者と合図者の間で、誰が合図を出すか、どの合図を使うかをそろえます。運転者が荷の一部しか見えない場合もあるため、合図が不明確なまま動かさないことが基本です。", "id": "1-14-20c3be0a2222"}, {"type": "sub", "text": "フックを荷の重心の真上へ合わせる", "id": "1-14-0b9d3d6b52b5"}, {"type": "p", "text": "**重心**は、荷の重さが一つの点にまとまって働くと考えた位置です。フックをその真上に合わせると、荷を持ち上げたときの横移動や傾きを抑えやすくなります。", "id": "1-14-b1797b832a9e", "quizTerms": ["重心"]}, {"type": "p", "text": "フックが横へずれたまま巻き上げると、ロープが斜めに張り、荷が横へ引かれたり、地面を離れた瞬間にフックの下へ振れたりするおそれがあります。これが、斜めつりや横引きを避ける理由です。クレーンは、床上の荷を横へ引きずるための道具として使いません。", "id": "1-14-2b8de894818a"}, {"type": "sub", "text": "地切りで止める理由", "id": "1-14-b43a79d0fb6a"}, {"type": "p", "text": "最初はゆっくり巻き上げ、緩んでいたロープを張ります。その後、荷が地面からわずかに離れたところで停止します。床が支えていた重さがクレーンへ移り、実際の玉掛け状態や荷のバランスが分かる段階です。", "id": "1-14-4507560c9e34"}, {"type": "p", "text": "停止したら、荷が傾いていないか、用具がずれていないか、ロープやつり具に異常がないか、ブレーキで**保持**できているかを確認します。異常があれば、荷を下ろして修正します。荷を高く上げてから掛け方を直そうとするのではありません。", "id": "1-14-568ad5c4bb11"}, {"type": "p", "text": "**地切り**は「地面を離れる動作」の名称です。地切り後にいったん止めるのは、その動作を安全に確認するための手順です。用語の意味と、行うべき確認を一緒に覚えましょう。", "id": "1-14-743eddced0be", "quizTerms": ["地切り"]}, {"type": "sub", "text": "急操作をすると荷が振れる理由", "id": "1-14-7a3bff13995c"}, {"type": "p", "text": "走行や**横行**を始めると、フック上部の機械が先に動きます。荷はすぐに同じ速さで動けず、遅れて付いてきます。逆に機械を急に止めると、荷はそれまでの動きを続けようとします。このずれが荷振れを生みます。", "id": "1-14-5230715c5365"}, {"type": "p", "text": "急な加速・減速は、大きな振れや**張力**の増加を招きます。滑らかな操作で、荷の動きを見ながら運びます。振れている荷をそのまま狭い場所へ入れたり、人の近くへ運んだりしません。", "id": "1-14-a6537a4c78d0"}, {"type": "img", "asset": "1-12_sway_concept21", "caption": "動かし始めには荷が後ろに残り、止めるときには前へ進もうとする。荷の慣性が揺れにつながる。", "id": "1-14-4ecf8e760f22", "style": "figure", "_previewFile": "1-12_sway_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**巻上げロープが長いほど、振れ幅と振れの周期は大きくなります。** 周期とは、一往復に掛かる時間です。ゆっくり戻ってくる荷の動きを思い浮かべましょう。", "id": "1-14-81026ff70dd5"}, {"type": "p", "text": "**重い荷ほど慣性が大きく、動き出しにくく、止まりにくい。** 荷振れの原因となる急な加速・減速を避け、滑らかに操作します。", "id": "1-14-d2eb70099676"}, {"type": "sub", "text": "行ってはいけない操作", "id": "1-14-bc0baedf907b"}, {"type": "p", "text": "揚程が足りないからといって、**巻過防止装置**を外したり無効にしたりしません。装置を外せばフックを上げられる範囲が増えるように見えても、衝突やロープ損傷を防ぐ最後の備えを失います。", "id": "1-14-2697929ed377"}, {"type": "p", "text": "荷を人の頭上へ通さず、荷をつったまま運転位置を離れません。玉掛けロープを荷から外す際も、フックを巻き上げて無理に引き抜かないようにします。引っ掛かったロープが急に外れたり、荷やロープを傷めたりするおそれがあります。", "id": "1-14-1d929cd31988"}, {"type": "sub", "text": "床上操作式クレーンでの運転者の位置", "id": "1-14-6beb0f3a3a81"}, {"type": "p", "text": "**床上操作式**クレーンで荷を移動させるときは、運転者は荷の後方又は横の安全な位置から、荷について歩きます。荷が進む方向の前に立って案内しません。荷と周囲が見える位置を保ち、荷の下や接触・挟まれのおそれのある位置には入りません。", "id": "1-14-43487150afcf"}, {"type": "p", "text": "無線操作式は荷の移動に操作位置が拘束されない方式で、別途その機種の安全な操作手順に従います（**床上操作式**の歩き方を、無線操作でも歩きながら操作してよい許可に広げません）。", "id": "1-14-8d9b4e13f900"}, {"type": "sub", "text": "荷の振れを抑える――追いノッチとインチング", "id": "1-14-2e62cc4dec9b"}, {"type": "p", "text": "**追いノッチ**は、荷の振れに合わせた短い操作で振れを抑える方法です。発進時と停止時では、操作するタイミングが違います。", "id": "1-14-34b590a92401", "quizTerms": ["追いノッチ"]}, {"id": "1-14-04ecffc983fa", "type": "svg", "file": "1-14_notch_start_20261106.svg", "caption": "発進時：いったん停止・減速して荷を待ち、ロープが鉛直になる前に再び動かす。", "style": "figure", "_previewFile": "1-14_notch_start_20261106.svg"}, {"id": "1-14-rev26-notch-stop", "type": "svg", "file": "1-14_notch_stop_20261106.svg", "caption": "停止時：前へ進む荷が振り切れる前に、進行方向へ短く動かして切る。", "style": "figure", "_previewFile": "1-14_notch_stop_20261106.svg"}, {"id": "1-14-rev26-timing", "type": "table", "headers": ["場面", "追いノッチのタイミング"], "rows": [["**発進時**", "遅れた荷が追いつき、ロープが鉛直になる前に再び動かす"], ["**停止時**", "荷が前へ振り切れる前に入れ、直後に切る"]], "quizTerms": ["発進時", "停止時"]}, {"id": "1-14-rev26-operation-note", "type": "p", "text": "図は試験で学ぶ操作の考え方です。実際には、その機種・制御方式に対応した手順で操作します。"}, {"type": "p", "text": "**インチング**は短時間の入り切りで小刻みに動かす操作です。インバータ制御の機種では、微速で連続して動かして位置を合わせることもでき、インチングと同じ操作ではありません。速度制御のしくみは第3章「電動機の速度制御」とあわせて確認します。", "id": "1-14-533852c31f4d", "quizTerms": ["インチング"]}, {"type": "img", "asset": "1-14_supplement_f33_20261023", "labels": [], "legend": [], "caption": "切った後も少し進むため、短い操作で位置を合わせる。", "id": "1-14-1c6fdfb1b283", "style": "figure", "_previewFile": "1-14_supplement_f33_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "無線操作式クレーンの取扱い", "id": "1-14-7bbfce8c4a84"}, {"type": "p", "text": "運転室ではなく、手元の無線の送信機で操作する方式です。電池切れ・電波の混信・見通しの悪さに注意します。使わないときは、誤操作を防ぐため電源を切り、キーを抜いて保管します。", "id": "1-14-68d0fb637efe"}, {"type": "sub", "text": "クライミング式クレーンの取扱い", "id": "1-14-2ff9b4db092a"}, {"type": "p", "text": "クライミング式では、荷をつるとジブや塔がたわみ、**作業半径が大きくなる**ことがあります。つる前の半径だけで決めず、たわみを考慮した作業半径に対応する定格荷重を確認します。", "id": "1-14-43d38c9e2e13", "quizTerms": ["作業半径が大きくなる"]}], "id": "1-14", "chapter": 1, "fields": [{"id": "1-14/2/text", "raw": "作業を始める前に、機械の状態、荷の重さ、用具、運ぶ経路、周囲の人、合図方法を確認します。荷が空中へ上がってから、重すぎる、通れない、人がいる、ロープの掛け方が悪いと分かっても、安全に直すのは難しいためです。", "text": "作業を始める前に、機械の状態、荷の重さ、用具、運ぶ経路、周囲の人、合図方法を確認します。荷が空中へ上がってから、重すぎる、通れない、人がいる、ロープの掛け方が悪いと分かっても、安全に直すのは難しいためです。", "terms": [], "block": "1-14-492b7efec08e"}, {"id": "1-14/3/text", "raw": "運転者と合図者の間で、誰が合図を出すか、どの合図を使うかをそろえます。運転者が荷の一部しか見えない場合もあるため、合図が不明確なまま動かさないことが基本です。", "text": "運転者と合図者の間で、誰が合図を出すか、どの合図を使うかをそろえます。運転者が荷の一部しか見えない場合もあるため、合図が不明確なまま動かさないことが基本です。", "terms": [], "block": "1-14-20c3be0a2222"}, {"id": "1-14/5/text", "raw": "**重心**は、荷の重さが一つの点にまとまって働くと考えた位置です。フックをその真上に合わせると、荷を持ち上げたときの横移動や傾きを抑えやすくなります。", "text": "重心は、荷の重さが一つの点にまとまって働くと考えた位置です。フックをその真上に合わせると、荷を持ち上げたときの横移動や傾きを抑えやすくなります。", "terms": ["重心"], "block": "1-14-b1797b832a9e"}, {"id": "1-14/6/text", "raw": "フックが横へずれたまま巻き上げると、ロープが斜めに張り、荷が横へ引かれたり、地面を離れた瞬間にフックの下へ振れたりするおそれがあります。これが、斜めつりや横引きを避ける理由です。クレーンは、床上の荷を横へ引きずるための道具として使いません。", "text": "フックが横へずれたまま巻き上げると、ロープが斜めに張り、荷が横へ引かれたり、地面を離れた瞬間にフックの下へ振れたりするおそれがあります。これが、斜めつりや横引きを避ける理由です。クレーンは、床上の荷を横へ引きずるための道具として使いません。", "terms": [], "block": "1-14-2b8de894818a"}, {"id": "1-14/8/text", "raw": "最初はゆっくり巻き上げ、緩んでいたロープを張ります。その後、荷が地面からわずかに離れたところで停止します。床が支えていた重さがクレーンへ移り、実際の玉掛け状態や荷のバランスが分かる段階です。", "text": "最初はゆっくり巻き上げ、緩んでいたロープを張ります。その後、荷が地面からわずかに離れたところで停止します。床が支えていた重さがクレーンへ移り、実際の玉掛け状態や荷のバランスが分かる段階です。", "terms": [], "block": "1-14-4507560c9e34"}, {"id": "1-14/9/text", "raw": "停止したら、荷が傾いていないか、用具がずれていないか、ロープやつり具に異常がないか、ブレーキで**保持**できているかを確認します。異常があれば、荷を下ろして修正します。荷を高く上げてから掛け方を直そうとするのではありません。", "text": "停止したら、荷が傾いていないか、用具がずれていないか、ロープやつり具に異常がないか、ブレーキで保持できているかを確認します。異常があれば、荷を下ろして修正します。荷を高く上げてから掛け方を直そうとするのではありません。", "terms": [], "block": "1-14-568ad5c4bb11"}, {"id": "1-14/10/text", "raw": "**地切り**は「地面を離れる動作」の名称です。地切り後にいったん止めるのは、その動作を安全に確認するための手順です。用語の意味と、行うべき確認を一緒に覚えましょう。", "text": "地切りは「地面を離れる動作」の名称です。地切り後にいったん止めるのは、その動作を安全に確認するための手順です。用語の意味と、行うべき確認を一緒に覚えましょう。", "terms": ["地切り"], "block": "1-14-743eddced0be"}, {"id": "1-14/12/text", "raw": "走行や**横行**を始めると、フック上部の機械が先に動きます。荷はすぐに同じ速さで動けず、遅れて付いてきます。逆に機械を急に止めると、荷はそれまでの動きを続けようとします。このずれが荷振れを生みます。", "text": "走行や横行を始めると、フック上部の機械が先に動きます。荷はすぐに同じ速さで動けず、遅れて付いてきます。逆に機械を急に止めると、荷はそれまでの動きを続けようとします。このずれが荷振れを生みます。", "terms": [], "block": "1-14-5230715c5365"}, {"id": "1-14/13/text", "raw": "急な加速・減速は、大きな振れや**張力**の増加を招きます。滑らかな操作で、荷の動きを見ながら運びます。振れている荷をそのまま狭い場所へ入れたり、人の近くへ運んだりしません。", "text": "急な加速・減速は、大きな振れや張力の増加を招きます。滑らかな操作で、荷の動きを見ながら運びます。振れている荷をそのまま狭い場所へ入れたり、人の近くへ運んだりしません。", "terms": [], "block": "1-14-a6537a4c78d0"}, {"id": "1-14/15/text", "raw": "**巻上げロープが長いほど、振れ幅と振れの周期は大きくなります。** 周期とは、一往復に掛かる時間です。ゆっくり戻ってくる荷の動きを思い浮かべましょう。", "text": "巻上げロープが長いほど、振れ幅と振れの周期は大きくなります。 周期とは、一往復に掛かる時間です。ゆっくり戻ってくる荷の動きを思い浮かべましょう。", "terms": [], "block": "1-14-81026ff70dd5"}, {"id": "1-14/16/text", "raw": "**重い荷ほど慣性が大きく、動き出しにくく、止まりにくい。** 荷振れの原因となる急な加速・減速を避け、滑らかに操作します。", "text": "重い荷ほど慣性が大きく、動き出しにくく、止まりにくい。 荷振れの原因となる急な加速・減速を避け、滑らかに操作します。", "terms": [], "block": "1-14-d2eb70099676"}, {"id": "1-14/18/text", "raw": "揚程が足りないからといって、**巻過防止装置**を外したり無効にしたりしません。装置を外せばフックを上げられる範囲が増えるように見えても、衝突やロープ損傷を防ぐ最後の備えを失います。", "text": "揚程が足りないからといって、巻過防止装置を外したり無効にしたりしません。装置を外せばフックを上げられる範囲が増えるように見えても、衝突やロープ損傷を防ぐ最後の備えを失います。", "terms": [], "block": "1-14-2697929ed377"}, {"id": "1-14/19/text", "raw": "荷を人の頭上へ通さず、荷をつったまま運転位置を離れません。玉掛けロープを荷から外す際も、フックを巻き上げて無理に引き抜かないようにします。引っ掛かったロープが急に外れたり、荷やロープを傷めたりするおそれがあります。", "text": "荷を人の頭上へ通さず、荷をつったまま運転位置を離れません。玉掛けロープを荷から外す際も、フックを巻き上げて無理に引き抜かないようにします。引っ掛かったロープが急に外れたり、荷やロープを傷めたりするおそれがあります。", "terms": [], "block": "1-14-1d929cd31988"}, {"id": "1-14/21/text", "raw": "**床上操作式**クレーンで荷を移動させるときは、運転者は荷の後方又は横の安全な位置から、荷について歩きます。荷が進む方向の前に立って案内しません。荷と周囲が見える位置を保ち、荷の下や接触・挟まれのおそれのある位置には入りません。", "text": "床上操作式クレーンで荷を移動させるときは、運転者は荷の後方又は横の安全な位置から、荷について歩きます。荷が進む方向の前に立って案内しません。荷と周囲が見える位置を保ち、荷の下や接触・挟まれのおそれのある位置には入りません。", "terms": [], "block": "1-14-43487150afcf"}, {"id": "1-14/22/text", "raw": "無線操作式は荷の移動に操作位置が拘束されない方式で、別途その機種の安全な操作手順に従います（**床上操作式**の歩き方を、無線操作でも歩きながら操作してよい許可に広げません）。", "text": "無線操作式は荷の移動に操作位置が拘束されない方式で、別途その機種の安全な操作手順に従います（床上操作式の歩き方を、無線操作でも歩きながら操作してよい許可に広げません）。", "terms": [], "block": "1-14-8d9b4e13f900"}, {"id": "1-14/24/text", "raw": "**追いノッチ**は、荷の振れに合わせた短い操作で振れを抑える方法です。発進時と停止時では、操作するタイミングが違います。", "text": "追いノッチは、荷の振れに合わせた短い操作で振れを抑える方法です。発進時と停止時では、操作するタイミングが違います。", "terms": ["追いノッチ"], "block": "1-14-34b590a92401"}, {"id": "1-14/27/rows:0:0", "raw": "**発進時**", "text": "発進時", "terms": ["発進時", "停止時"], "block": "1-14-rev26-timing"}, {"id": "1-14/27/rows:0:1", "raw": "遅れた荷が追いつき、ロープが鉛直になる前に再び動かす", "text": "遅れた荷が追いつき、ロープが鉛直になる前に再び動かす", "terms": ["発進時", "停止時"], "block": "1-14-rev26-timing"}, {"id": "1-14/27/rows:1:0", "raw": "**停止時**", "text": "停止時", "terms": ["発進時", "停止時"], "block": "1-14-rev26-timing"}, {"id": "1-14/27/rows:1:1", "raw": "荷が前へ振り切れる前に入れ、直後に切る", "text": "荷が前へ振り切れる前に入れ、直後に切る", "terms": ["発進時", "停止時"], "block": "1-14-rev26-timing"}, {"id": "1-14/28/text", "raw": "図は試験で学ぶ操作の考え方です。実際には、その機種・制御方式に対応した手順で操作します。", "text": "図は試験で学ぶ操作の考え方です。実際には、その機種・制御方式に対応した手順で操作します。", "terms": [], "block": "1-14-rev26-operation-note"}, {"id": "1-14/29/text", "raw": "**インチング**は短時間の入り切りで小刻みに動かす操作です。インバータ制御の機種では、微速で連続して動かして位置を合わせることもでき、インチングと同じ操作ではありません。速度制御のしくみは第3章「電動機の速度制御」とあわせて確認します。", "text": "インチングは短時間の入り切りで小刻みに動かす操作です。インバータ制御の機種では、微速で連続して動かして位置を合わせることもでき、インチングと同じ操作ではありません。速度制御のしくみは第3章「電動機の速度制御」とあわせて確認します。", "terms": ["インチング"], "block": "1-14-533852c31f4d"}, {"id": "1-14/32/text", "raw": "運転室ではなく、手元の無線の送信機で操作する方式です。電池切れ・電波の混信・見通しの悪さに注意します。使わないときは、誤操作を防ぐため電源を切り、キーを抜いて保管します。", "text": "運転室ではなく、手元の無線の送信機で操作する方式です。電池切れ・電波の混信・見通しの悪さに注意します。使わないときは、誤操作を防ぐため電源を切り、キーを抜いて保管します。", "terms": [], "block": "1-14-68d0fb637efe"}, {"id": "1-14/34/text", "raw": "クライミング式では、荷をつるとジブや塔がたわみ、**作業半径が大きくなる**ことがあります。つる前の半径だけで決めず、たわみを考慮した作業半径に対応する定格荷重を確認します。", "text": "クライミング式では、荷をつるとジブや塔がたわみ、作業半径が大きくなることがあります。つる前の半径だけで決めず、たわみを考慮した作業半径に対応する定格荷重を確認します。", "terms": ["作業半径が大きくなる"], "block": "1-14-43d38c9e2e13"}], "candidates": [{"id": "1-14/5/text#0", "fieldID": "1-14/5/text", "block": "1-14-b1797b832a9e", "answer": "重心", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "重心は、荷の重さが一つの点にまとまって働くと考えた位置です。フックをその真上に合わせると、荷を持ち上げたときの横移動や傾きを抑えやすくなります。", "start16": 0, "end16": 2}, {"id": "1-14/10/text#0", "fieldID": "1-14/10/text", "block": "1-14-743eddced0be", "answer": "地切り", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "地切りは「地面を離れる動作」の名称です。地切り後にいったん止めるのは、その動作を安全に確認するための手順です。用語の意味と、行うべき確認を一緒に覚えましょう。", "start16": 0, "end16": 3}, {"id": "1-14/24/text#0", "fieldID": "1-14/24/text", "block": "1-14-34b590a92401", "answer": "追いノッチ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "追いノッチは、荷の振れに合わせた短い操作で振れを抑える方法です。発進時と停止時では、操作するタイミングが違います。", "start16": 0, "end16": 5}, {"id": "1-14/27/rows:0:0#0", "fieldID": "1-14/27/rows:0:0", "block": "1-14-rev26-timing", "answer": "発進時", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "発進時", "start16": 0, "end16": 3}, {"id": "1-14/27/rows:1:0#0", "fieldID": "1-14/27/rows:1:0", "block": "1-14-rev26-timing", "answer": "停止時", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "停止時", "start16": 0, "end16": 3}, {"id": "1-14/29/text#0", "fieldID": "1-14/29/text", "block": "1-14-533852c31f4d", "answer": "インチング", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "インチングは短時間の入り切りで小刻みに動かす操作です。インバータ制御の機種では、微速で連続して動かして位置を合わせることもでき、インチングと同じ操作ではありません。速度制御のしくみは第3章「電動機の速度制御」とあわせて確認します。", "start16": 0, "end16": 5}, {"id": "1-14/34/text#24", "fieldID": "1-14/34/text", "block": "1-14-43d38c9e2e13", "answer": "作業半径が大きくなる", "category": "key", "prompt": "［用語？］", "start": 24, "end": 34, "context": "クライミング式では、荷をつるとジブや塔がたわみ、作業半径が大きくなることがあります。つる前の半径だけで決めず、たわみを考慮した作業半径に対応する定格荷重を確認します。", "start16": 24, "end16": 34}], "rounds": {"all": [["1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0"], ["1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0"], ["1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0"], ["1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0"], ["1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0"], ["1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24"], ["1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0"]], "key": [["1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0"], ["1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0"], ["1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0"], ["1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0"], ["1-14/34/text#24", "1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0"], ["1-14/5/text#0", "1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24"], ["1-14/24/text#0", "1-14/29/text#0", "1-14/27/rows:0:0#0", "1-14/10/text#0", "1-14/27/rows:1:0#0", "1-14/34/text#24", "1-14/5/text#0"]], "num": [[]]}}, {"title": "給油と点検――動き続けるために状態を保つ", "blocks": [{"type": "p", "style": "lead", "text": "**給油は摩耗を抑えるため、点検は異常を見つけるため。** 部品の働きと結びつけて覚えます。", "id": "1-12-76f8da9092fd"}, {"type": "sub", "text": "どこへ給油するのか", "id": "1-12-cac42582e790"}, {"type": "p", "text": "**軸受**、歯車、ワイヤロープなどでは、部品同士が接触して動きます。潤滑剤は、その摩擦や摩耗を抑える働きをします。軸受や歯車では動きを滑らかにし、ワイヤロープでは素線同士の動きやさびの抑制にも関係します。", "id": "1-12-c6c8de113157"}, {"type": "p", "text": "複数の箇所へ配管を通して潤滑剤を送る方法が「**集中給油**」です。一か所から多くの給油点へ供給できるため、給油作業をまとめやすくなります。ただし、配管の詰まりなどで一部へ届かなくなる可能性があるため、供給状態の確認も必要です。", "id": "1-12-e89e8e48d6d7", "quizTerms": ["集中給油"]}, {"type": "p", "text": "油が白く濁るのは、水分が混ざった兆候の一つです。いつもの色、量、漏れ、異臭などの変化を見ることが、異常発見につながります。また、摩擦で止めるブレーキの**ライニング**やパッドに油を付けないようにします。潤滑が必要な場所と、油を付けてはいけない場所を分けましょう。", "id": "1-12-f4530e3f6ca4", "quizTerms": ["ライニング"]}, {"type": "sub", "id": "lesson-lubrication", "text": "油やグリースは、指定の種類と量を守る"}, {"type": "p", "text": "**潤滑剤は、指定の種類と量を使います。** 油やグリースを入れすぎると、かき混ぜる抵抗が増え、発熱や漏れの原因になります。", "id": "1-12-4b25df1d89e0", "quizTerms": ["グリース"]}, {"type": "p", "text": "油面計で規定の範囲にあるかを確認します。グリースは、古いものが押し出されるなど、**必要な場所へ届いたこと**を確かめます。ポンプが動いていても、配管の詰まりで届かないことがあります。", "id": "1-12-35083d8e1019", "quizTerms": ["必要な場所へ届いたこと"]}, {"type": "p", "text": "**違う種類のグリースを、性状や混和性を確認せずに混ぜません。** 増ちょう剤や基油の組合せで、硬さや潤滑性能が変わることがあります。追加給脂が不要な密封形軸受には、外から一律に押し込みません。", "id": "1-12-067d0a596092"}, {"type": "p", "text": "**粘度は、油のねばりの程度。** 温度・回転速度・荷重などに適した指定油を使います。高すぎる粘度も抵抗や発熱を増やすため、「粘度が高いほど必ずよい」は誤りです。", "id": "1-12-13fc176bd81c"}, {"id": "1-12-rev26-oil-heading", "type": "sub", "text": "減速機の油浴式――回る歯車で油を届ける"}, {"id": "1-12-rev26-oil", "type": "p", "text": "**油浴式**は、歯車の下部を油に浸し、回転ではね上げたギヤー油で歯車や軸受を潤滑します。", "quizTerms": ["油浴式"]}, {"id": "1-12-rev26-oil-figure", "type": "img", "asset": "1-12_oil_bath_20261106", "style": "figure", "caption": "歯車が油をはね上げて、かみ合う部分や軸受へ届ける。", "_previewFile": "1-12_oil_bath_20261106.png", "_width": 1536, "_height": 1024}, {"id": "1-12-rev26-oil-change", "type": "p", "text": "**密閉されていても、油の交換は必要です。** 長く使うと油が劣化し、金属粉やごみが混ざります。定期的に点検し、必要に応じて交換します。", "style": "tip"}, {"type": "sub", "text": "ワイヤロープはどこが傷みやすいか", "id": "1-12-ed829978261e"}, {"type": "p", "text": "断線、さび、摩耗、つぶれ、形くずれなどを確認します。「一本全体を眺めたから大丈夫」とせず、力や曲げを受ける場所を意識して見ます。使用できるかどうかは所定の基準で判断し、異常があるものを自己判断で使い続けません。", "id": "1-12-d94f5792af82"}, {"type": "img", "asset": "1-7_wire_reject_readable21", "caption": "ワイヤ損傷の例", "legend": [], "labels": [], "id": "1-12-7b2ddfc197e9", "style": "figure", "_previewFile": "1-7_wire_reject_readable21.png", "_width": 2000, "_height": 1450}, {"type": "sub", "text": "作業終了時", "id": "1-12-8d7843ef32ee"}, {"type": "p", "text": "荷を安全な場所へ下ろし、荷をつったまま放置しません。つり具を所定位置へ戻し、制御器を停止位置にして、指定の手順で電源を切ります。屋外では、風による逸走やジブの損傷を防ぐための措置も行います。", "id": "1-12-94a70e93ce22"}, {"type": "p", "text": "異常を見つけたら使用を中止して報告し、必要な補修や点検を行ってから再使用します。点検は、異常を記録するだけでなく、安全に使える状態へ戻すための作業につながります。", "id": "1-12-4e4833eb7ef3"}, {"type": "sub", "text": "給油のしかた――グリースの入れ方3つ", "id": "1-12-0ec072457264"}, {"type": "p", "text": "グリースの入れ方には、軸受ごとのカップに入れて人の手で押し込む「グリースカップ式」、グリースガンで差す「グリースガン式」、1か所から配管で各部へまとめて送る「**集中給油**式」があります。", "id": "1-12-0c2e81a3c9c0"}, {"type": "sub", "text": "試験で扱う給脂周期の代表値", "id": "1-12-cd801d09c4a8"}, {"type": "table", "headers": ["軸受の種類", "試験で扱う給脂周期の代表例"], "rows": [["平軸受（滑り軸受）", "毎日1回程度"], ["転がり軸受", "6か月に1回程度"]], "id": "1-12-6377b02d2261", "quizTerms": ["転がり軸受", "平軸受"]}, {"type": "p", "text": "試験では、**平軸受は毎日、転がり軸受は6か月**を逆にした選択肢に注意します。実機では、メーカーや事業場が定めた周期に従います。", "id": "1-12-e4b2ec9c836f"}, {"type": "img", "asset": "1-12_lubrication_readable21", "caption": "グリースカップ・グリースガン・集中給油。周期は上の表で確認する。", "legend": [], "labels": [], "id": "1-12-eca26bd727ed", "style": "figure", "_previewFile": "1-12_lubrication_readable21.png", "_width": 2000, "_height": 1450}, {"type": "sub", "text": "点検で見る重点", "id": "1-12-3ffa4470ad3e"}, {"type": "p", "text": "特に、**シーブを通る部分・ロープ端の取付部・エコライザシーブ付近**を確認します。逆巻きや乱巻きにも注意します。", "id": "1-12-ef8fc14ba839"}, {"type": "img", "asset": "inspection_concept21", "caption": "作業開始前・月次・年次の点検。記録や臨時点検の条件は、第2章の定期自主検査・点検を参照。", "id": "1-12-ff3b9aa4cb8c", "style": "figure", "_previewFile": "inspection_concept21.png", "_width": 1774, "_height": 887}, {"id": "1-12-rev26-inspection-link", "type": "p", "text": "第2章：定期的な検査と点検", "style": "reference", "file": "2-3"}], "id": "1-12", "chapter": 1, "fields": [{"id": "1-12/2/text", "raw": "**軸受**、歯車、ワイヤロープなどでは、部品同士が接触して動きます。潤滑剤は、その摩擦や摩耗を抑える働きをします。軸受や歯車では動きを滑らかにし、ワイヤロープでは素線同士の動きやさびの抑制にも関係します。", "text": "軸受、歯車、ワイヤロープなどでは、部品同士が接触して動きます。潤滑剤は、その摩擦や摩耗を抑える働きをします。軸受や歯車では動きを滑らかにし、ワイヤロープでは素線同士の動きやさびの抑制にも関係します。", "terms": [], "block": "1-12-c6c8de113157"}, {"id": "1-12/3/text", "raw": "複数の箇所へ配管を通して潤滑剤を送る方法が「**集中給油**」です。一か所から多くの給油点へ供給できるため、給油作業をまとめやすくなります。ただし、配管の詰まりなどで一部へ届かなくなる可能性があるため、供給状態の確認も必要です。", "text": "複数の箇所へ配管を通して潤滑剤を送る方法が「集中給油」です。一か所から多くの給油点へ供給できるため、給油作業をまとめやすくなります。ただし、配管の詰まりなどで一部へ届かなくなる可能性があるため、供給状態の確認も必要です。", "terms": ["集中給油"], "block": "1-12-e89e8e48d6d7"}, {"id": "1-12/4/text", "raw": "油が白く濁るのは、水分が混ざった兆候の一つです。いつもの色、量、漏れ、異臭などの変化を見ることが、異常発見につながります。また、摩擦で止めるブレーキの**ライニング**やパッドに油を付けないようにします。潤滑が必要な場所と、油を付けてはいけない場所を分けましょう。", "text": "油が白く濁るのは、水分が混ざった兆候の一つです。いつもの色、量、漏れ、異臭などの変化を見ることが、異常発見につながります。また、摩擦で止めるブレーキのライニングやパッドに油を付けないようにします。潤滑が必要な場所と、油を付けてはいけない場所を分けましょう。", "terms": ["ライニング"], "block": "1-12-f4530e3f6ca4"}, {"id": "1-12/6/text", "raw": "**潤滑剤は、指定の種類と量を使います。** 油やグリースを入れすぎると、かき混ぜる抵抗が増え、発熱や漏れの原因になります。", "text": "潤滑剤は、指定の種類と量を使います。 油やグリースを入れすぎると、かき混ぜる抵抗が増え、発熱や漏れの原因になります。", "terms": ["グリース"], "block": "1-12-4b25df1d89e0"}, {"id": "1-12/7/text", "raw": "油面計で規定の範囲にあるかを確認します。グリースは、古いものが押し出されるなど、**必要な場所へ届いたこと**を確かめます。ポンプが動いていても、配管の詰まりで届かないことがあります。", "text": "油面計で規定の範囲にあるかを確認します。グリースは、古いものが押し出されるなど、必要な場所へ届いたことを確かめます。ポンプが動いていても、配管の詰まりで届かないことがあります。", "terms": ["必要な場所へ届いたこと"], "block": "1-12-35083d8e1019"}, {"id": "1-12/8/text", "raw": "**違う種類のグリースを、性状や混和性を確認せずに混ぜません。** 増ちょう剤や基油の組合せで、硬さや潤滑性能が変わることがあります。追加給脂が不要な密封形軸受には、外から一律に押し込みません。", "text": "違う種類のグリースを、性状や混和性を確認せずに混ぜません。 増ちょう剤や基油の組合せで、硬さや潤滑性能が変わることがあります。追加給脂が不要な密封形軸受には、外から一律に押し込みません。", "terms": [], "block": "1-12-067d0a596092"}, {"id": "1-12/9/text", "raw": "**粘度は、油のねばりの程度。** 温度・回転速度・荷重などに適した指定油を使います。高すぎる粘度も抵抗や発熱を増やすため、「粘度が高いほど必ずよい」は誤りです。", "text": "粘度は、油のねばりの程度。 温度・回転速度・荷重などに適した指定油を使います。高すぎる粘度も抵抗や発熱を増やすため、「粘度が高いほど必ずよい」は誤りです。", "terms": [], "block": "1-12-13fc176bd81c"}, {"id": "1-12/11/text", "raw": "**油浴式**は、歯車の下部を油に浸し、回転ではね上げたギヤー油で歯車や軸受を潤滑します。", "text": "油浴式は、歯車の下部を油に浸し、回転ではね上げたギヤー油で歯車や軸受を潤滑します。", "terms": ["油浴式"], "block": "1-12-rev26-oil"}, {"id": "1-12/13/text", "raw": "**密閉されていても、油の交換は必要です。** 長く使うと油が劣化し、金属粉やごみが混ざります。定期的に点検し、必要に応じて交換します。", "text": "密閉されていても、油の交換は必要です。 長く使うと油が劣化し、金属粉やごみが混ざります。定期的に点検し、必要に応じて交換します。", "terms": [], "block": "1-12-rev26-oil-change"}, {"id": "1-12/15/text", "raw": "断線、さび、摩耗、つぶれ、形くずれなどを確認します。「一本全体を眺めたから大丈夫」とせず、力や曲げを受ける場所を意識して見ます。使用できるかどうかは所定の基準で判断し、異常があるものを自己判断で使い続けません。", "text": "断線、さび、摩耗、つぶれ、形くずれなどを確認します。「一本全体を眺めたから大丈夫」とせず、力や曲げを受ける場所を意識して見ます。使用できるかどうかは所定の基準で判断し、異常があるものを自己判断で使い続けません。", "terms": [], "block": "1-12-d94f5792af82"}, {"id": "1-12/18/text", "raw": "荷を安全な場所へ下ろし、荷をつったまま放置しません。つり具を所定位置へ戻し、制御器を停止位置にして、指定の手順で電源を切ります。屋外では、風による逸走やジブの損傷を防ぐための措置も行います。", "text": "荷を安全な場所へ下ろし、荷をつったまま放置しません。つり具を所定位置へ戻し、制御器を停止位置にして、指定の手順で電源を切ります。屋外では、風による逸走やジブの損傷を防ぐための措置も行います。", "terms": [], "block": "1-12-94a70e93ce22"}, {"id": "1-12/19/text", "raw": "異常を見つけたら使用を中止して報告し、必要な補修や点検を行ってから再使用します。点検は、異常を記録するだけでなく、安全に使える状態へ戻すための作業につながります。", "text": "異常を見つけたら使用を中止して報告し、必要な補修や点検を行ってから再使用します。点検は、異常を記録するだけでなく、安全に使える状態へ戻すための作業につながります。", "terms": [], "block": "1-12-4e4833eb7ef3"}, {"id": "1-12/21/text", "raw": "グリースの入れ方には、軸受ごとのカップに入れて人の手で押し込む「グリースカップ式」、グリースガンで差す「グリースガン式」、1か所から配管で各部へまとめて送る「**集中給油**式」があります。", "text": "グリースの入れ方には、軸受ごとのカップに入れて人の手で押し込む「グリースカップ式」、グリースガンで差す「グリースガン式」、1か所から配管で各部へまとめて送る「集中給油式」があります。", "terms": [], "block": "1-12-0c2e81a3c9c0"}, {"id": "1-12/23/rows:0:0", "raw": "平軸受（滑り軸受）", "text": "平軸受（滑り軸受）", "terms": ["転がり軸受", "平軸受"], "block": "1-12-6377b02d2261"}, {"id": "1-12/23/rows:0:1", "raw": "毎日1回程度", "text": "毎日1回程度", "terms": ["転がり軸受", "平軸受"], "block": "1-12-6377b02d2261"}, {"id": "1-12/23/rows:1:0", "raw": "転がり軸受", "text": "転がり軸受", "terms": ["転がり軸受", "平軸受"], "block": "1-12-6377b02d2261"}, {"id": "1-12/23/rows:1:1", "raw": "6か月に1回程度", "text": "6か月に1回程度", "terms": ["転がり軸受", "平軸受"], "block": "1-12-6377b02d2261"}, {"id": "1-12/24/text", "raw": "試験では、**平軸受は毎日、転がり軸受は6か月**を逆にした選択肢に注意します。実機では、メーカーや事業場が定めた周期に従います。", "text": "試験では、平軸受は毎日、転がり軸受は6か月を逆にした選択肢に注意します。実機では、メーカーや事業場が定めた周期に従います。", "terms": [], "block": "1-12-e4b2ec9c836f"}, {"id": "1-12/27/text", "raw": "特に、**シーブを通る部分・ロープ端の取付部・エコライザシーブ付近**を確認します。逆巻きや乱巻きにも注意します。", "text": "特に、シーブを通る部分・ロープ端の取付部・エコライザシーブ付近を確認します。逆巻きや乱巻きにも注意します。", "terms": [], "block": "1-12-ef8fc14ba839"}], "candidates": [{"id": "1-12/3/text#22", "fieldID": "1-12/3/text", "block": "1-12-e89e8e48d6d7", "answer": "集中給油", "category": "key", "prompt": "［用語？］", "start": 22, "end": 26, "context": "複数の箇所へ配管を通して潤滑剤を送る方法が「集中給油」です。一か所から多くの給油点へ供給できるため、給油作業をまとめやすくなります。ただし、配管の詰まりなどで一部へ届かなくなる可能性があるため、供給状態の確認も必要です。", "start16": 22, "end16": 26}, {"id": "1-12/4/text#75", "fieldID": "1-12/4/text", "block": "1-12-f4530e3f6ca4", "answer": "ライニング", "category": "key", "prompt": "［用語？］", "start": 75, "end": 80, "context": "油が白く濁るのは、水分が混ざった兆候の一つです。いつもの色、量、漏れ、異臭などの変化を見ることが、異常発見につながります。また、摩擦で止めるブレーキのライニングやパッドに油を付けないようにします。潤滑が必要な場所と、油を付けてはいけない場所を分けましょう。", "start16": 75, "end16": 80}, {"id": "1-12/6/text#21", "fieldID": "1-12/6/text", "block": "1-12-4b25df1d89e0", "answer": "グリース", "category": "key", "prompt": "［用語？］", "start": 21, "end": 25, "context": "潤滑剤は、指定の種類と量を使います。 油やグリースを入れすぎると、かき混ぜる抵抗が増え、発熱や漏れの原因になります。", "start16": 21, "end16": 25}, {"id": "1-12/7/text#40", "fieldID": "1-12/7/text", "block": "1-12-35083d8e1019", "answer": "必要な場所へ届いたこと", "category": "key", "prompt": "［用語？］", "start": 40, "end": 51, "context": "油面計で規定の範囲にあるかを確認します。グリースは、古いものが押し出されるなど、必要な場所へ届いたことを確かめます。ポンプが動いていても、配管の詰まりで届かないことがあります。", "start16": 40, "end16": 51}, {"id": "1-12/11/text#0", "fieldID": "1-12/11/text", "block": "1-12-rev26-oil", "answer": "油浴式", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "油浴式は、歯車の下部を油に浸し、回転ではね上げたギヤー油で歯車や軸受を潤滑します。", "start16": 0, "end16": 3}, {"id": "1-12/23/rows:0:0#0", "fieldID": "1-12/23/rows:0:0", "block": "1-12-6377b02d2261", "answer": "平軸受", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "平軸受（滑り軸受）", "start16": 0, "end16": 3}, {"id": "1-12/23/rows:1:0#0", "fieldID": "1-12/23/rows:1:0", "block": "1-12-6377b02d2261", "answer": "転がり軸受", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "転がり軸受", "start16": 0, "end16": 5}], "rounds": {"all": [["1-12/3/text#22", "1-12/11/text#0", "1-12/23/rows:1:0#0", "1-12/4/text#75", "1-12/23/rows:0:0#0", "1-12/7/text#40", "1-12/6/text#21"], ["1-12/11/text#0", "1-12/23/rows:1:0#0", "1-12/4/text#75", "1-12/23/rows:0:0#0", "1-12/7/text#40", "1-12/6/text#21", "1-12/3/text#22"], ["1-12/23/rows:1:0#0", "1-12/4/text#75", "1-12/23/rows:0:0#0", "1-12/7/text#40", "1-12/6/text#21", "1-12/3/text#22", "1-12/11/text#0"], ["1-12/4/text#75", "1-12/23/rows:0:0#0", "1-12/7/text#40", "1-12/6/text#21", "1-12/3/text#22", "1-12/11/text#0", "1-12/23/rows:1:0#0"], ["1-12/23/rows:0:0#0", "1-12/7/text#40", "1-12/6/text#21", "1-12/3/text#22", "1-12/11/text#0", "1-12/23/rows:1:0#0", "1-12/4/text#75"], ["1-12/7/text#40", "1-12/6/text#21", "1-12/3/text#22", "1-12/11/text#0", "1-12/23/rows:1:0#0", "1-12/4/text#75", "1-12/23/rows:0:0#0"], ["1-12/6/text#21", "1-12/3/text#22", "1-12/11/text#0", "1-12/23/rows:1:0#0", "1-12/4/text#75", "1-12/23/rows:0:0#0", "1-12/7/text#40"]], "key": [["1-
