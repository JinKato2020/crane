:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76"], ["3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110"], ["3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0"], ["3-4/2/text#50", "3-4/2/text#44", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0"], ["3-4/2/text#44", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38"], ["3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12"], ["3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0"], ["3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56"], ["3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50"], ["3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36"], ["3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53"], ["3-4/12/text#110", "3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0"]], "num": [[]]}}, {"id": "3-5", "title": "給電装置――動く本体へ電気を送る", "blocks": [{"type": "p", "text": "家庭の家電は壁のコンセントにつなげますが、クレーンは電気を使いながら動きます。**移動しても接続を保つ** のが給電装置の役割です。下の構造図を、「滑らせる・ケーブルを追従させる・回る輪でつなぐ」の3つに分けて見ます。", "style": "lead", "id": "3-5-2af6e8bf5e70"}, {"id": "3-5-3f4a4bd9755e", "type": "table", "headers": ["方式", "動く部分へどう届ける？"], "rows": [["**トロリ給電**", "導体に集電子を接触させ、移動しながら受け取る"], ["**キャブタイヤケーブル給電**", "曲げられる被覆ケーブルを、移動に合わせて支える"], ["**スリップリング給電**", "回る部分と固定部分の間を、リングとブラシでつなぐ"]], "quizTerms": ["集電子", "スリップリング給電", "ブラシ"]}, {"type": "p", "text": "内部の配線は、一般に絶縁電線を金属管（電線管）や金属ダクトに収めて、外からの損傷を防いでいます。", "id": "3-5-d16d7078e70f"}, {"type": "sub", "text": "トロリ線給電", "id": "3-5-28f64b62cd44"}, {"type": "p", "text": "**充電部** は、ここでは電圧がかかっている導体の部分です。バッテリーへ電気をためている、という意味の「充電」とは使い方が違います。**ダクト** は配線などを収める箱状の通り道です。", "id": "3-5-65fe026e7091", "quizTerms": ["充電部"]}, {"type": "p", "text": "**トロリ線**は、動くクレーンへ電気を届ける導体。接触して電気を受け取る部品が**集電子**、それを押し当てる装置が**パンタグラフ**です。集電子は、車輪で接触する**ホイール式**、すべらせる**シュー式**に分かれます。", "id": "3-5-68312658b5ca", "quizTerms": ["トロリ線", "パンタグラフ"]}, {"type": "img", "asset": "3-5_supplement_f41_20261023", "labels": [], "legend": [], "caption": "固定した導体に、動く集電子を接触させる。がいし・絶縁物で導体と支持構造を分離する。右はダクト内部を見せた切欠き図。", "id": "3-5-8a681115e198", "style": "figure", "_previewFile": "3-5_supplement_f41_20261023.png", "_width": 1473, "_height": 1068}, {"type": "p", "text": "**集電子**からクレーン本体へ電流が流れないように取り付けます。集電子には砲金（銅とすずなどの合金）・カーボン・黒鉛・特殊合金などを使います。", "id": "3-5-07716d418718"}, {"type": "p", "text": "トロリ線の材料には、**溝付硬銅トロリ線、丸硬銅トロリ線、平銅バー、アングル鋼バー、レール**などがあります。導体は、がいしなどでクレーン本体から絶縁して支えます。", "id": "3-5-8abcfd11cd47", "quizTerms": ["がいし"]}, {"type": "p", "text": "「**トロリ線**の材料」「集電子の材料」「絶縁物」を混同しないのがコツです。", "id": "3-5-4b9316eb8456"}, {"type": "p", "text": "断面の大きい銅やアルミの剛体バーを導体に使うトロリ線を**トロリバー**(剛体トロリ線)と呼びます。たわみやすい電線に対し、変形しにくい棒状の導体で集電子を受けます。", "id": "3-5-07346aab6953", "quizTerms": ["トロリバー"]}, {"type": "ul", "items": ["**イヤー式**：イヤーという吊り金物でトロリ線をつり下げ、パンタグラフで集電。**充電部が露出**し、感電のおそれがある場所での使用は危険。", "**すくい上げ式**：支えがいしで支えたトロリ線を、下から集電子ですくい上げて集電。これも**充電部が露出**。", "**トロリダクト方式**：金属ダクト内に平銅バーを絶縁物を介して取り付け、トロリシューが中を移動しながら集電。", "**絶縁トロリ線方式**：トロリ線を溝の開いた絶縁被覆で覆い、**集電子を下側から接触させて**集電。裸のトロリ線より**安全性が高い**。"], "id": "3-5-ecfd3c441d4a"}, {"type": "p", "text": "**見分けるコツ：電気を通す場所と、通さない場所。** 集電子は接触して電気を通し、がいしや絶縁カバーは不要な場所へ流れることや充電部への接触を防ぎます。トロリダクトや絶縁トロリ線も、損傷や接触による感電には注意が必要です。", "id": "3-5-b656ef0c6b83"}, {"type": "sub", "text": "キャブタイヤケーブル給電", "id": "3-5-aa0add0bddea"}, {"type": "p", "text": "**キャブタイヤケーブル** は、繰り返し動かしたり曲げたりする機器に使う、柔らかく丈夫なケーブルです。中の導体は細い金属線を多数より合わせ、外側をゴムやビニールの被覆で守ります。この1本1本の細い金属線を **素線** といいます。", "id": "3-5-1aef282ce51b", "quizTerms": ["キャブタイヤケーブル"]}, {"id": "3-5-rev26-cable-benefit", "type": "p", "text": "充電部が露出しないので**感電の危険性が低い**方式です。爆発性ガス・粉じんのおそれがある場所では、このケーブルを使った**防爆構造**の給電方式を採用します。移動するケーブルは、次の方法で支えます。"}, {"id": "3-5-b5d58c0cfb4a", "type": "table", "headers": ["ケーブルの支持方式", "動きに合わせる仕組み"], "rows": [["**カーテン式**", "小さな台車などでつり下げ、カーテンのように寄せる・広げる"], ["**ケーブル巻取式**", "ドラムで巻き取り・繰出しをする"], ["**特殊チェーン式**", "ケーブルを入れたチェーンが折り返しながら動く"], ["**ケーブルキャリア式**", "両端にケーブルホイールを持つ台車が、ガイドレール上を移動する"]]}, {"type": "img", "asset": "3-5_supplement_f42_20261023", "labels": [], "legend": [], "caption": "カーテン式・ケーブル巻取式・特殊チェーン式・ケーブルキャリア式。余るケーブルを支え、動く本体へ追従させる構造例。", "id": "3-5-12b0c6d203d9", "style": "figure", "_previewFile": "3-5_supplement_f42_20261023.png", "_width": 1473, "_height": 1068}, {"type": "img", "asset": "3-4_panel21_2", "caption": "ケーブルリール：移動に合わせてケーブルを巻き取り・繰り出す。", "id": "3-5-e1447cf7c88a", "style": "figure", "_previewFile": "3-4_panel21_2.png", "_width": 900, "_height": 920}, {"type": "sub", "id": "lesson-wire-selection", "text": "配線は、電流だけで選ばない"}, {"type": "p", "text": "**必要な電流を流せることは、配線選定の条件の一つです。** 始動時も含めた電圧降下、保護装置との協調、周囲温度、曲げ・引張りなど可動部の条件も確認します。", "id": "3-5-95cd0fd08a8a"}, {"type": "p", "text": "同じ電流でも、長い配線では電圧降下が大きくなり、動くケーブルでは機械的な損傷も考えます。「定格電流に合えば、ほかは見なくてよい」は誤りです。", "id": "3-5-d36a798adcd6"}, {"type": "sub", "text": "スリップリング給電", "id": "3-5-b29d8aa4370f"}, {"type": "p", "text": "**スリップリング給電**は、クレーンの**旋回体やケーブル巻取式のように、回転する部分**への給電に使います。電源を供給する中央の**リング**（材質は一般に砲金）と、リング面をすべって集電する**集電子（集電ブラシ）**で構成されます。", "id": "3-5-71f9986f5834"}, {"type": "img", "asset": "3-4_panel21_3", "caption": "スリップリング・ブラシ：固定側のブラシが回転側のリングに接触。各相のリングを互いに絶縁する。", "id": "3-5-754e2fac3566", "style": "figure", "_previewFile": "3-4_panel21_3.png", "_width": 900, "_height": 770}, {"type": "p", "text": "リングとブラシが接触を保つので、回転しても電気を届けられます。**リングが固定側・ブラシが回転側の場合と、その逆**があります。図はリングが回転する例です。", "id": "3-5-557a831157c0"}, {"type": "img", "asset": "3-5_rotating_contact_daily", "caption": "回転する輪に、固定側のブラシを接触させて電気を受け渡す模式図。1接点の働きを示し、回路全体や戻り側は省略。", "id": "3-5-6b5e4561dd51", "style": "figure", "_previewFile": "3-5_rotating_contact_daily.png", "_width": 1774, "_height": 887}, {"id": "3-5-rev26-rotating-q", "type": "p", "text": "**確認：** 旋回する部分へ、回転を妨げず電気を届ける方式は？", "style": "question"}, {"id": "3-5-rev26-rotating-a", "type": "p", "text": "**スリップリング給電。** リングとブラシの接触を保って給電します。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-5/1/rows:0:0", "raw": "**トロリ給電**", "text": "トロリ給電", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/1/rows:0:1", "raw": "導体に集電子を接触させ、移動しながら受け取る", "text": "導体に集電子を接触させ、移動しながら受け取る", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/1/rows:1:0", "raw": "**キャブタイヤケーブル給電**", "text": "キャブタイヤケーブル給電", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/1/rows:1:1", "raw": "曲げられる被覆ケーブルを、移動に合わせて支える", "text": "曲げられる被覆ケーブルを、移動に合わせて支える", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/1/rows:2:0", "raw": "**スリップリング給電**", "text": "スリップリング給電", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/1/rows:2:1", "raw": "回る部分と固定部分の間を、リングとブラシでつなぐ", "text": "回る部分と固定部分の間を、リングとブラシでつなぐ", "terms": ["集電子", "スリップリング給電", "ブラシ"], "block": "3-5-3f4a4bd9755e"}, {"id": "3-5/2/text", "raw": "内部の配線は、一般に絶縁電線を金属管（電線管）や金属ダクトに収めて、外からの損傷を防いでいます。", "text": "内部の配線は、一般に絶縁電線を金属管（電線管）や金属ダクトに収めて、外からの損傷を防いでいます。", "terms": [], "block": "3-5-d16d7078e70f"}, {"id": "3-5/4/text", "raw": "**充電部** は、ここでは電圧がかかっている導体の部分です。バッテリーへ電気をためている、という意味の「充電」とは使い方が違います。**ダクト** は配線などを収める箱状の通り道です。", "text": "充電部 は、ここでは電圧がかかっている導体の部分です。バッテリーへ電気をためている、という意味の「充電」とは使い方が違います。ダクト は配線などを収める箱状の通り道です。", "terms": ["充電部"], "block": "3-5-65fe026e7091"}, {"id": "3-5/5/text", "raw": "**トロリ線**は、動くクレーンへ電気を届ける導体。接触して電気を受け取る部品が**集電子**、それを押し当てる装置が**パンタグラフ**です。集電子は、車輪で接触する**ホイール式**、すべらせる**シュー式**に分かれます。", "text": "トロリ線は、動くクレーンへ電気を届ける導体。接触して電気を受け取る部品が集電子、それを押し当てる装置がパンタグラフです。集電子は、車輪で接触するホイール式、すべらせるシュー式に分かれます。", "terms": ["トロリ線", "パンタグラフ"], "block": "3-5-68312658b5ca"}, {"id": "3-5/7/text", "raw": "**集電子**からクレーン本体へ電流が流れないように取り付けます。集電子には砲金（銅とすずなどの合金）・カーボン・黒鉛・特殊合金などを使います。", "text": "集電子からクレーン本体へ電流が流れないように取り付けます。集電子には砲金（銅とすずなどの合金）・カーボン・黒鉛・特殊合金などを使います。", "terms": [], "block": "3-5-07716d418718"}, {"id": "3-5/8/text", "raw": "トロリ線の材料には、**溝付硬銅トロリ線、丸硬銅トロリ線、平銅バー、アングル鋼バー、レール**などがあります。導体は、がいしなどでクレーン本体から絶縁して支えます。", "text": "トロリ線の材料には、溝付硬銅トロリ線、丸硬銅トロリ線、平銅バー、アングル鋼バー、レールなどがあります。導体は、がいしなどでクレーン本体から絶縁して支えます。", "terms": ["がいし"], "block": "3-5-8abcfd11cd47"}, {"id": "3-5/9/text", "raw": "「**トロリ線**の材料」「集電子の材料」「絶縁物」を混同しないのがコツです。", "text": "「トロリ線の材料」「集電子の材料」「絶縁物」を混同しないのがコツです。", "terms": [], "block": "3-5-4b9316eb8456"}, {"id": "3-5/10/text", "raw": "断面の大きい銅やアルミの剛体バーを導体に使うトロリ線を**トロリバー**(剛体トロリ線)と呼びます。たわみやすい電線に対し、変形しにくい棒状の導体で集電子を受けます。", "text": "断面の大きい銅やアルミの剛体バーを導体に使うトロリ線をトロリバー(剛体トロリ線)と呼びます。たわみやすい電線に対し、変形しにくい棒状の導体で集電子を受けます。", "terms": ["トロリバー"], "block": "3-5-07346aab6953"}, {"id": "3-5/11/items:0", "raw": "**イヤー式**：イヤーという吊り金物でトロリ線をつり下げ、パンタグラフで集電。**充電部が露出**し、感電のおそれがある場所での使用は危険。", "text": "イヤー式：イヤーという吊り金物でトロリ線をつり下げ、パンタグラフで集電。充電部が露出し、感電のおそれがある場所での使用は危険。", "terms": [], "block": "3-5-ecfd3c441d4a"}, {"id": "3-5/11/items:1", "raw": "**すくい上げ式**：支えがいしで支えたトロリ線を、下から集電子ですくい上げて集電。これも**充電部が露出**。", "text": "すくい上げ式：支えがいしで支えたトロリ線を、下から集電子ですくい上げて集電。これも充電部が露出。", "terms": [], "block": "3-5-ecfd3c441d4a"}, {"id": "3-5/11/items:2", "raw": "**トロリダクト方式**：金属ダクト内に平銅バーを絶縁物を介して取り付け、トロリシューが中を移動しながら集電。", "text": "トロリダクト方式：金属ダクト内に平銅バーを絶縁物を介して取り付け、トロリシューが中を移動しながら集電。", "terms": [], "block": "3-5-ecfd3c441d4a"}, {"id": "3-5/11/items:3", "raw": "**絶縁トロリ線方式**：トロリ線を溝の開いた絶縁被覆で覆い、**集電子を下側から接触させて**集電。裸のトロリ線より**安全性が高い**。", "text": "絶縁トロリ線方式：トロリ線を溝の開いた絶縁被覆で覆い、集電子を下側から接触させて集電。裸のトロリ線より安全性が高い。", "terms": [], "block": "3-5-ecfd3c441d4a"}, {"id": "3-5/12/text", "raw": "**見分けるコツ：電気を通す場所と、通さない場所。** 集電子は接触して電気を通し、がいしや絶縁カバーは不要な場所へ流れることや充電部への接触を防ぎます。トロリダクトや絶縁トロリ線も、損傷や接触による感電には注意が必要です。", "text": "見分けるコツ：電気を通す場所と、通さない場所。 集電子は接触して電気を通し、がいしや絶縁カバーは不要な場所へ流れることや充電部への接触を防ぎます。トロリダクトや絶縁トロリ線も、損傷や接触による感電には注意が必要です。", "terms": [], "block": "3-5-b656ef0c6b83"}, {"id": "3-5/14/text", "raw": "**キャブタイヤケーブル** は、繰り返し動かしたり曲げたりする機器に使う、柔らかく丈夫なケーブルです。中の導体は細い金属線を多数より合わせ、外側をゴムやビニールの被覆で守ります。この1本1本の細い金属線を **素線** といいます。", "text": "キャブタイヤケーブル は、繰り返し動かしたり曲げたりする機器に使う、柔らかく丈夫なケーブルです。中の導体は細い金属線を多数より合わせ、外側をゴムやビニールの被覆で守ります。この1本1本の細い金属線を 素線 といいます。", "terms": ["キャブタイヤケーブル"], "block": "3-5-1aef282ce51b"}, {"id": "3-5/15/text", "raw": "充電部が露出しないので**感電の危険性が低い**方式です。爆発性ガス・粉じんのおそれがある場所では、このケーブルを使った**防爆構造**の給電方式を採用します。移動するケーブルは、次の方法で支えます。", "text": "充電部が露出しないので感電の危険性が低い方式です。爆発性ガス・粉じんのおそれがある場所では、このケーブルを使った防爆構造の給電方式を採用します。移動するケーブルは、次の方法で支えます。", "terms": [], "block": "3-5-rev26-cable-benefit"}, {"id": "3-5/16/rows:0:0", "raw": "**カーテン式**", "text": "カーテン式", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:0:1", "raw": "小さな台車などでつり下げ、カーテンのように寄せる・広げる", "text": "小さな台車などでつり下げ、カーテンのように寄せる・広げる", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:1:0", "raw": "**ケーブル巻取式**", "text": "ケーブル巻取式", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:1:1", "raw": "ドラムで巻き取り・繰出しをする", "text": "ドラムで巻き取り・繰出しをする", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:2:0", "raw": "**特殊チェーン式**", "text": "特殊チェーン式", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:2:1", "raw": "ケーブルを入れたチェーンが折り返しながら動く", "text": "ケーブルを入れたチェーンが折り返しながら動く", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:3:0", "raw": "**ケーブルキャリア式**", "text": "ケーブルキャリア式", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/16/rows:3:1", "raw": "両端にケーブルホイールを持つ台車が、ガイドレール上を移動する", "text": "両端にケーブルホイールを持つ台車が、ガイドレール上を移動する", "terms": [], "block": "3-5-b5d58c0cfb4a"}, {"id": "3-5/20/text", "raw": "**必要な電流を流せることは、配線選定の条件の一つです。** 始動時も含めた電圧降下、保護装置との協調、周囲温度、曲げ・引張りなど可動部の条件も確認します。", "text": "必要な電流を流せることは、配線選定の条件の一つです。 始動時も含めた電圧降下、保護装置との協調、周囲温度、曲げ・引張りなど可動部の条件も確認します。", "terms": [], "block": "3-5-95cd0fd08a8a"}, {"id": "3-5/21/text", "raw": "同じ電流でも、長い配線では電圧降下が大きくなり、動くケーブルでは機械的な損傷も考えます。「定格電流に合えば、ほかは見なくてよい」は誤りです。", "text": "同じ電流でも、長い配線では電圧降下が大きくなり、動くケーブルでは機械的な損傷も考えます。「定格電流に合えば、ほかは見なくてよい」は誤りです。", "terms": [], "block": "3-5-d36a798adcd6"}, {"id": "3-5/23/text", "raw": "**スリップリング給電**は、クレーンの**旋回体やケーブル巻取式のように、回転する部分**への給電に使います。電源を供給する中央の**リング**（材質は一般に砲金）と、リング面をすべって集電する**集電子（集電ブラシ）**で構成されます。", "text": "スリップリング給電は、クレーンの旋回体やケーブル巻取式のように、回転する部分への給電に使います。電源を供給する中央のリング（材質は一般に砲金）と、リング面をすべって集電する集電子（集電ブラシ）で構成されます。", "terms": [], "block": "3-5-71f9986f5834"}, {"id": "3-5/25/text", "raw": "リングとブラシが接触を保つので、回転しても電気を届けられます。**リングが固定側・ブラシが回転側の場合と、その逆**があります。図はリングが回転する例です。", "text": "リングとブラシが接触を保つので、回転しても電気を届けられます。リングが固定側・ブラシが回転側の場合と、その逆があります。図はリングが回転する例です。", "terms": [], "block": "3-5-557a831157c0"}], "candidates": [{"id": "3-5/1/rows:0:1#3", "fieldID": "3-5/1/rows:0:1", "block": "3-5-3f4a4bd9755e", "answer": "集電子", "category": "key", "prompt": "［用語？］", "start": 3, "end": 6, "context": "導体に集電子を接触させ、移動しながら受け取る", "start16": 3, "end16": 6}, {"id": "3-5/1/rows:2:0#0", "fieldID": "3-5/1/rows:2:0", "block": "3-5-3f4a4bd9755e", "answer": "スリップリング給電", "category": "key", "prompt": "［用語？］", "start": 0, "end": 9, "context": "スリップリング給電", "start16": 0, "end16": 9}, {"id": "3-5/1/rows:2:1#17", "fieldID": "3-5/1/rows:2:1", "block": "3-5-3f4a4bd9755e", "answer": "ブラシ", "category": "key", "prompt": "［用語？］", "start": 17, "end": 20, "context": "回る部分と固定部分の間を、リングとブラシでつなぐ", "start16": 17, "end16": 20}, {"id": "3-5/4/text#0", "fieldID": "3-5/4/text", "block": "3-5-65fe026e7091", "answer": "充電部", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "充電部 は、ここでは電圧がかかっている導体の部分です。バッテリーへ電気をためている、という意味の「充電」とは使い方が違います。ダクト は配線などを収める箱状の通り道です。", "start16": 0, "end16": 3}, {"id": "3-5/5/text#0", "fieldID": "3-5/5/text", "block": "3-5-68312658b5ca", "answer": "トロリ線", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "トロリ線は、動くクレーンへ電気を届ける導体。接触して電気を受け取る部品が集電子、それを押し当てる装置がパンタグラフです。集電子は、車輪で接触するホイール式、すべらせるシュー式に分かれます。", "start16": 0, "end16": 4}, {"id": "3-5/5/text#51", "fieldID": "3-5/5/text", "block": "3-5-68312658b5ca", "answer": "パンタグラフ", "category": "key", "prompt": "［用語？］", "start": 51, "end": 57, "context": "トロリ線は、動くクレーンへ電気を届ける導体。接触して電気を受け取る部品が集電子、それを押し当てる装置がパンタグラフです。集電子は、車輪で接触するホイール式、すべらせるシュー式に分かれます。", "start16": 51, "end16": 57}, {"id": "3-5/8/text#55", "fieldID": "3-5/8/text", "block": "3-5-8abcfd11cd47", "answer": "がいし", "category": "key", "prompt": "［用語？］", "start": 55, "end": 58, "context": "トロリ線の材料には、溝付硬銅トロリ線、丸硬銅トロリ線、平銅バー、アングル鋼バー、レールなどがあります。導体は、がいしなどでクレーン本体から絶縁して支えます。", "start16": 55, "end16": 58}, {"id": "3-5/10/text#27", "fieldID": "3-5/10/text", "block": "3-5-07346aab6953", "answer": "トロリバー", "category": "key", "prompt": "［用語？］", "start": 27, "end": 32, "context": "断面の大きい銅やアルミの剛体バーを導体に使うトロリ線をトロリバー(剛体トロリ線)と呼びます。たわみやすい電線に対し、変形しにくい棒状の導体で集電子を受けます。", "start16": 27, "end16": 32}, {"id": "3-5/14/text#0", "fieldID": "3-5/14/text", "block": "3-5-1aef282ce51b", "answer": "キャブタイヤケーブル", "category": "key", "prompt": "［用語？］", "start": 0, "end": 10, "context": "キャブタイヤケーブル は、繰り返し動かしたり曲げたりする機器に使う、柔らかく丈夫なケーブルです。中の導体は細い金属線を多数より合わせ、外側をゴムやビニールの被覆で守ります。この1本1本の細い金属線を 素線 といいます。", "start16": 0, "end16": 10}], "rounds": {"all": [["3-5/1/rows:2:0#0", "3-5/10/text#27", "3-5/5/text#51", "3-5/8/text#55", "3- -5/1/rows:0:1#3", "3-5/10/text#27", "3-5/5/text#51", "3-5/8/text#55", "3-5/14/text#0"], ["3-5/5/text#0", "3-5/4/text#0", "3-5/1/rows:0:1#3", "3-5/1/rows:2:0#0", "3-5/10/text#27", "3-5/5/text#51", "3-5/8/text#55", "3-5/14/text#0"], ["3-5/4/text#0", "3-5/1/rows:0:1#3", "3-5/1/rows:2:0#0", "3-5/10/text#27", "3-5/5/text#51", "3-5/8/text#55", "3-5/14/text#0", "3-5/5/text#0"], ["3-5/1/rows:0:1#3", "3-5/1/rows:2:0#0", "3-5/10/text#27", "3-5/5/text#51", "3-5/8/text#55", "3-5/14/text#0", "3-5/5/text#0", "3-5/4/text#0"]], "num": [[]]}}, {"id": "3-6", "title": "電動機の速度制御", "blocks": [{"type": "p", "text": "**速度制御** は、モーターの回る速さを調整することです。荷を地面から離す **地切り**、荷を置く **着床** のときは、急な動きによる衝撃を抑えます。走行・横行でも、緩やかな起動・停止が荷振れの抑制につながります。", "style": "lead", "id": "3-6-4b198487f3ee"}, {"type": "img", "asset": "3-6_soft_start_daily", "caption": "身近な台車で加速の違いを比べる模式図。緩始動は、急な力の変化による衝撃を抑える。", "id": "3-6-edd467c5c7b0", "style": "figure", "_previewFile": "3-6_soft_start_daily.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "回転方向の変え方", "id": "3-6-5426a222fb26"}, {"type": "ul", "items": ["**直流電動機**：界磁の向きを保って電機子電流を逆にする、または電機子電流を保って界磁の向きを逆にします。永久磁石式では、電源の＋・−を入れ換えると電機子電流が逆になります。", "**三相誘導電動機**：3線のうち2線を入れ換えると、三相の順番（相順）が逆になり、回転磁界の向きが逆になります。"], "id": "3-6-983215084d8e", "quizTerms": ["2線", "相順"]}, {"type": "svg", "file": "3-6_supplement_f43_20261023.svg", "caption": "三相のうち2本を入れ替えると、回転方向が変わる。", "id": "3-6-aebd12599f97", "style": "figure", "_previewFile": "3-6_supplement_f43_20261023.svg"}, {"type": "sub", "text": "かご形三相誘導電動機の速度制御", "id": "3-6-b472aefc9e8e"}, {"type": "p", "text": "**負荷** は、モーターにとっての「回す仕事の重さ」です。巻上げなら荷を持ち上げるために必要な回す力などが負荷になります。**定格** は、決められた条件で使うための基準値。定格電流・定格出力など、何の基準かを後ろの言葉とセットで読みます。", "id": "3-6-b99d300f3c14"}, {"id": "3-6-06579cefaa4c", "type": "table", "headers": ["方式", "変えるもの・目的"], "rows": [["**全電圧始動**", "電源電圧をそのまま加えて始動。巻上げは荷を支える大きな力が必要なので、通常この方法を使う"], ["**緩始動**", "始動時の電流や機械的な衝撃を抑える。横行・走行の荷振れを小さくする"], ["**インバーター制御**", "供給する**周波数・電圧**を変え、速度を連続的に調整する"], ["**極数変換**", "巻線を切り替えて**極数**を変え、段階的に変速する"]]}, {"id": "3-6-rev26-soft-methods", "type": "sub", "text": "ゆっくり動き始めるには"}, {"id": "3-6-rev26-soft-methods-table", "type": "table", "headers": ["項目", "意味・覚えること"], "rows": [["電気的な緩始動", "**抵抗器・リアクトル・サイリスター**などで始動電流を抑える"], ["機械的な緩始動", "**流体継手・粉体継手**などで、始動時の衝撃を吸収する"]]}, {"type": "p", "text": "緩始動の一つ「**スターデルタ始動**」は、始動時はY（スター）結線にして電動機にかかる電圧を下げて始動電流・衝撃を抑え、回り始めたらΔ（デルタ）結線に切り換えて通常運転に移ります。", "id": "3-6-156565358ff7", "quizTerms": ["スターデルタ始動"]}, {"type": "svg", "file": "3-5_star_delta.svg", "caption": "スターデルタ始動の切替", "id": "3-6-afe8102eafa2", "style": "figure", "_previewFile": "3-5_star_delta.svg"}, {"type": "sub", "id": "lesson-star-delta-third", "text": "スターデルタ始動――電流もトルクも約1/3"}, {"type": "p", "text": "同じ電源電圧で、デルタ結線による直接始動と比べます。スター結線では、各巻線にかかる電圧が **1/√3** になります。", "id": "3-6-d2daac40bf5c", "quizTerms": ["1/√3"]}, {"type": "p", "text": "**電源からの始動電流も、始動トルクも、デルタ直接始動の約1/3。** 電流を抑えられる一方、回し始める力も小さくなります。大きな始動トルクを必要とする負荷には制約があります。", "id": "3-6-41836cf6d09b", "quizTerms": ["1/3"]}, {"type": "p", "text": "**始動と速度調整を分けると整理できます。** 全電圧始動・緩始動は「動き始め方」。インバーター・極数変換などは「運転中の速さを変える方法」です。", "id": "3-6-b14bb99f55f1", "style": "tip"}, {"type": "sub", "text": "インバーターを「電気のテンポ」で考える", "id": "3-6-f9bbcdf28e9a"}, {"type": "p", "text": "**身近な場面に置き換えると、工場の送風機の回る速さを変える装置です。** 第4節の羽根を回すモデルでは、電気のテンポが変わると、追いかける磁界の速さが変わりました。次の図は、その電気を装置の中でどう作り直すかを示します。", "id": "3-6-96ae93ffd235"}, {"type": "p", "text": "**コンバーター** はここでは交流を直流に変える部分、**インバーター** は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。**VVVF** は、この「電圧と周波数を変える」という意味の略語です。", "id": "3-6-21269a52da64", "quizTerms": ["インバーター", "コンバーター", "VVVF"]}, {"type": "img", "asset": "3-6_inverter_concept", "caption": "上は電気の変換、下は周波数の比較。波は周波数を説明する模式図で、実際のPWM出力波形ではない。", "id": "3-6-0f85084f64ef", "style": "figure", "_previewFile": "3-6_inverter_concept.png", "_width": 1400, "_height": 810}, {"type": "p", "text": "**なるほど：同じ4極なら、磁界が回るテンポを半分にすると同期速度も半分。** 60Hzは1,800rpm、30Hzは900rpmです。供給電源が50Hz・60Hzでも、インバーターの出力周波数を変えられます。", "id": "3-6-6feefeb17ea8"}, {"type": "sub", "id": "lesson-regenerative-braking", "text": "電気的な制動――エネルギーはどこへ行く？"}, {"type": "p", "text": "減速時や荷の下降時には、機械側からモーターを回し、発電する状態になることがあります。**機械のエネルギーを電気へ変えて、運動を抑える** のが電気的制動の考え方です。", "id": "3-6-f69a6e69eff0"}, {"type": "p", "text": "**電源回生は電源側へ返す。抵抗制動は抵抗器で熱に変える。** 同じ電気的な減速でも、エネルギーの行先が違います。電源回生には、それに対応する装置を使います。", "id": "3-6-24b337d32926", "quizTerms": ["電源回生", "抵抗制動"]}, {"type": "p", "text": "摩擦ブレーキは、こすり合わせて運動のエネルギーを熱に変えます。渦電流ブレーキは、金属内の誘導電流と磁界の作用で回転を抑えます。", "id": "3-6-737ea9fc4a00"}, {"type": "sub", "id": "lesson-vf-control", "text": "V/f制御――周波数に合わせて電圧も調整"}, {"type": "p", "text": "**Vは電圧、fは周波数。** 一般的なV/f制御では、磁束を適切に保つため、周波数に合わせて電圧も調整します。", "id": "3-6-4121dfe6276c", "quizTerms": ["V/f"]}, {"type": "p", "text": "基本となる範囲では、**V/fの比をほぼ一定**にします。周波数を下げるとき、電圧も合わせて下げるのが基本です。低い周波数では、電圧を補う調整もあります。", "id": "3-6-f8076ecf85ed"}, {"id": "3-6-rev26-poles-heading", "type": "sub", "text": "極数を変えると、段階的に変速"}, {"id": "3-6-rev26-poles-example", "type": "p", "text": "極数変換では、極数の比が**2：1**の2種類の巻線を持つものがよく使われます。60Hzなら、4極で**1,800rpm**、8極で**900rpm**。極数2倍で同期速度は半分です。"}, {"type": "sub", "text": "巻線形三相誘導電動機の速度制御", "id": "3-6-a447aba02d74"}, {"type": "p", "text": "巻線形の回転子へ外部抵抗をつなぎ、その値を変えるのが**二次抵抗制御**。始動時は抵抗を全部入れ、順に短絡して使う抵抗を減らすと、緩やかに始動できます。", "id": "3-6-61a4862dc195", "quizTerms": ["二次抵抗制御", "巻線形"]}, {"type": "svg", "file": "3-6_supplement_f40_20261023.svg", "caption": "巻線形の二次抵抗制御。回転子の巻線を3個のスリップリング経由で外部抵抗へつなぐ。接点は抵抗を迂回する道を作る。", "id": "3-6-1153e2d8ceb1", "style": "figure", "_previewFile": "3-6_supplement_f40_20261023.svg"}, {"type": "sub", "id": "lesson-secondary-resistance", "text": "二次抵抗を増やすと、何が変わる？"}, {"type": "p", "text": "安定した電動機運転の範囲で、同じ負荷トルクを出す場合を考えます。**二次抵抗を増やすと、必要なすべりが大きくなり、実際の回転速度が低下します。**", "id": "3-6-b30b043a63c2"}, {"type": "p", "text": "**同期速度は120×周波数÷極数で決まり、二次抵抗では変わりません。** 追いかける磁界の速さと、回転子の遅れを分けます。外部の二次抵抗を接続できるのは巻線形です。", "id": "3-6-2e33b60eec39"}, {"id": "3-6-rev26-secondary-use", "type": "p", "text": "二次抵抗制御は**横行・走行・旋回**などに使います。荷重で速度が変わりやすいため、**巻下げでは別のブレーキ制御を組み合わせます**。"}, {"id": "3-6-rev26-braking-methods-heading", "type": "sub", "text": "巻下げの速度を抑える方式"}, {"type": "p", "text": "**渦電流**は、金属の中を渦状に流れる誘導電流です。電磁石で磁界を作り（**励磁**）、その中で円板が回ると、回転を妨げる力が生じます。磁極と円板は触れません。", "id": "3-6-d946bb52c743", "quizTerms": ["渦電流"]}, {"type": "img", "asset": "3-6_supplement_f44_20261023", "labels": [], "legend": [], "caption": "磁極の間を円板が動くと誘導電流が生じ、回転を妨げる力が働く。円板と磁極は接触しない。原理を示す模式図。", "id": "3-6-19b73b3e39c9", "style": "figure", "_previewFile": "3-6_supplement_f44_20261023.png", "_width": 1774, "_height": 887}, {"id": "3-6-rev26-eddy-load", "type": "p", "text": "**軽い荷はモーターで回して下げ、重い荷は自重で下がる速さをブレーキで抑えます。** 渦電流ブレーキは、ライニングなどの消耗部品がなく、制御能力に優れます。"}, {"type": "p", "text": "**電動油圧押上機** は、モーターで油の圧力を作り、棒を押し上げる装置です。ここではブレーキを操作します。**ライニング** はブレーキの摩擦材、**ドラム** はそれを押し当てる回転部分です。", "id": "3-6-12961f2d9384"}, {"id": "3-6-a9d963d41236", "type": "table", "headers": ["方式", "しくみ"], "rows": [["**電動油圧押上機ブレーキ**", "油圧の押上機で摩擦ブレーキを調整して低速にする。巻下げの回転が遅くなると、制動力を小さくする"], ["**ダイナミックブレーキ**", "巻下げ時、**一次側を交流から切り離し、直流で励磁**して制動力を得る"], ["**サイリスター一次電圧制御**", "回転数を検知し、目標と比べながら**一次側の電圧**を調整する"]]}, {"type": "p", "text": "電動油圧押上機の操作電源は、巻線形電動機の**二次側回路**につなぎます。ダイナミックブレーキで直流を加えるのは**一次側**。接続する側を区別しましょう。", "id": "3-6-d3c15ae9b815", "style": "tip"}, {"id": "3-6-9de05e7f0bd5", "type": "table", "headers": ["書籍で覚える方式", "低速の目安・使い分け"], "rows": [["**電動油圧押上機ブレーキ**", "全速の**約30％**まで／**約90kW以下**。摩耗・過熱のため使用頻度が高いものには不向き"], ["**ダイナミックブレーキ**", "全速の**約10〜70％**／**約110kW以上**。制動力が大きく、軽い荷を低速で下げられない場合がある"], ["**サイリスター一次電圧制御**", "全速の**約5％**。速度を検知して調整するため安定した低速が得られる"]]}, {"type": "sub", "text": "直流電動機の速度制御", "id": "3-6-88f3477cf348"}, {"type": "p", "text": "直流電動機の **可変電圧制御** は、電機子へ加える電圧を調整して速さを変える方式です。**発電機** は、モーターと逆に、軸を回す機械の動きから電気を作る装置。以下の2方式は、調整した直流電圧を「電子部品で作るか、発電機で作るか」が違います。", "id": "3-6-1f6f6d280ba9", "quizTerms": ["可変電圧制御"]}, {"id": "3-6-04f89a42f8a1", "type": "table", "headers": ["方式", "調整した直流電圧を作る方法"], "rows": [["**サイリスターレオナード**", "サイリスター装置で交流を直流に変え、電圧を調整。設備を小さくできる"], ["**ワードレオナード**", "三相誘導電動機で直流発電機を回す。設備費が高く、精密な速度制御を要するアンローダなどで使用"]]}, {"type": "svg", "file": "3-6_supplement_f45_20261023.svg", "caption": "直流電動機へ送る電圧を変える装置が違う。", "id": "3-6-4262c95e67a7", "style": "figure", "_previewFile": "3-6_supplement_f45_20261023.svg"}, {"id": "3-6-rev26-primary-dc-q", "type": "p", "text": "**確認：** ダイナミックブレーキは、電動機のどちら側へ、何の電源をつなぐ？", "style": "question"}, {"id": "3-6-rev26-primary-dc-a", "type": "p", "text": "**一次側へ直流電源。** 巻下げ時に一次側を交流から切り離し、直流励磁で制動力を得ます。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-6/3/items:0", "raw": "**直流電動機**：界磁の向きを保って電機子電流を逆にする、または電機子電流を保って界磁の向きを逆にします。永久磁石式では、電源の＋・−を入れ換えると電機子電流が逆になります。", "text": "直流電動機：界磁の向きを保って電機子電流を逆にする、または電機子電流を保って界磁の向きを逆にします。永久磁石式では、電源の＋・−を入れ換えると電機子電流が逆になります。", "terms": ["2線", "相順"], "block": "3-6-983215084d8e"}, {"id": "3-6/3/items:1", "raw": "**三相誘導電動機**：3線のうち2線を入れ換えると、三相の順番（相順）が逆になり、回転磁界の向きが逆になります。", "text": "三相誘導電動機：3線のうち2線を入れ換えると、三相の順番（相順）が逆になり、回転磁界の向きが逆になります。", "terms": ["2線", "相順"], "block": "3-6-983215084d8e"}, {"id": "3-6/6/text", "raw": "**負荷** は、モーターにとっての「回す仕事の重さ」です。巻上げなら荷を持ち上げるために必要な回す力などが負荷になります。**定格** は、決められた条件で使うための基準値。定格電流・定格出力など、何の基準かを後ろの言葉とセットで読みます。", "text": "負荷 は、モーターにとっての「回す仕事の重さ」です。巻上げなら荷を持ち上げるために必要な回す力などが負荷になります。定格 は、決められた条件で使うための基準値。定格電流・定格出力など、何の基準かを後ろの言葉とセットで読みます。", "terms": [], "block": "3-6-b99d300f3c14"}, {"id": "3-6/7/rows:0:0", "raw": "**全電圧始動**", "text": "全電圧始動", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:0:1", "raw": "電源電圧をそのまま加えて始動。巻上げは荷を支える大きな力が必要なので、通常この方法を使う", "text": "電源電圧をそのまま加えて始動。巻上げは荷を支える大きな力が必要なので、通常この方法を使う", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:1:0", "raw": "**緩始動**", "text": "緩始動", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:1:1", "raw": "始動時の電流や機械的な衝撃を抑える。横行・走行の荷振れを小さくする", "text": "始動時の電流や機械的な衝撃を抑える。横行・走行の荷振れを小さくする", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:2:0", "raw": "**インバーター制御**", "text": "インバーター制御", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:2:1", "raw": "供給する**周波数・電圧**を変え、速度を連続的に調整する", "text": "供給する周波数・電圧を変え、速度を連続的に調整する", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:3:0", "raw": "**極数変換**", "text": "極数変換", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/7/rows:3:1", "raw": "巻線を切り替えて**極数**を変え、段階的に変速する", "text": "巻線を切り替えて極数を変え、段階的に変速する", "terms": [], "block": "3-6-06579cefaa4c"}, {"id": "3-6/9/rows:0:0", "raw": "電気的な緩始動", "text": "電気的な緩始動", "terms": [], "block": "3-6-rev26-soft-methods-table"}, {"id": "3-6/9/rows:0:1", "raw": "**抵抗器・リアクトル・サイリスター**などで始動電流を抑える", "text": "抵抗器・リアクトル・サイリスターなどで始動電流を抑える", "terms": [], "block": "3-6-rev26-soft-methods-table"}, {"id": "3-6/9/rows:1:0", "raw": "機械的な緩始動", "text": "機械的な緩始動", "terms": [], "block": "3-6-rev26-soft-methods-table"}, {"id": "3-6/9/rows:1:1", "raw": "**流体継手・粉体継手**などで、始動時の衝撃を吸収する", "text": "流体継手・粉体継手などで、始動時の衝撃を吸収する", "terms": [], "block": "3-6-rev26-soft-methods-table"}, {"id": "3-6/10/text", "raw": "緩始動の一つ「**スターデルタ始動**」は、始動時はY（スター）結線にして電動機にかかる電圧を下げて始動電流・衝撃を抑え、回り始めたらΔ（デルタ）結線に切り換えて通常運転に移ります。", "text": "緩始動の一つ「スターデルタ始動」は、始動時はY（スター）結線にして電動機にかかる電圧を下げて始動電流・衝撃を抑え、回り始めたらΔ（デルタ）結線に切り換えて通常運転に移ります。", "terms": ["スターデルタ始動"], "block": "3-6-156565358ff7"}, {"id": "3-6/13/text", "raw": "同じ電源電圧で、デルタ結線による直接始動と比べます。スター結線では、各巻線にかかる電圧が **1/√3** になります。", "text": "同じ電源電圧で、デルタ結線による直接始動と比べます。スター結線では、各巻線にかかる電圧が 1/√3 になります。", "terms": ["1/√3"], "block": "3-6-d2daac40bf5c"}, {"id": "3-6/14/text", "raw": "**電源からの始動電流も、始動トルクも、デルタ直接始動の約1/3。** 電流を抑えられる一方、回し始める力も小さくなります。大きな始動トルクを必要とする負荷には制約があります。", "text": "電源からの始動電流も、始動トルクも、デルタ直接始動の約1/3。 電流を抑えられる一方、回し始める力も小さくなります。大きな始動トルクを必要とする負荷には制約があります。", "terms": ["1/3"], "block": "3-6-41836cf6d09b"}, {"id": "3-6/15/text", "raw": "**始動と速度調整を分けると整理できます。** 全電圧始動・緩始動は「動き始め方」。インバーター・極数変換などは「運転中の速さを変える方法」です。", "text": "始動と速度調整を分けると整理できます。 全電圧始動・緩始動は「動き始め方」。インバーター・極数変換などは「運転中の速さを変える方法」です。", "terms": [], "block": "3-6-b14bb99f55f1"}, {"id": "3-6/17/text", "raw": "**身近な場面に置き換えると、工場の送風機の回る速さを変える装置です。** 第4節の羽根を回すモデルでは、電気のテンポが変わると、追いかける磁界の速さが変わりました。次の図は、その電気を装置の中でどう作り直すかを示します。", "text": "身近な場面に置き換えると、工場の送風機の回る速さを変える装置です。 第4節の羽根を回すモデルでは、電気のテンポが変わると、追いかける磁界の速さが変わりました。次の図は、その電気を装置の中でどう作り直すかを示します。", "terms": [], "block": "3-6-96ae93ffd235"}, {"id": "3-6/18/text", "raw": "**コンバーター** はここでは交流を直流に変える部分、**インバーター** は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。**VVVF** は、この「電圧と周波数を変える」という意味の略語です。", "text": "コンバーター はここでは交流を直流に変える部分、インバーター は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。VVVF は、この「電圧と周波数を変える」という意味の略語です。", "terms": ["インバーター", "コンバーター", "VVVF"], "block": "3-6-21269a52da64"}, {"id": "3-6/20/text", "raw": "**なるほど：同じ4極なら、磁界が回るテンポを半分にすると同期速度も半分。** 60Hzは1,800rpm、30Hzは900rpmです。供給電源が50Hz・60Hzでも、インバーターの出力周波数を変えられます。", "text": "なるほど：同じ4極なら、磁界が回るテンポを半分にすると同期速度も半分。 60Hzは1,800rpm、30Hzは900rpmです。供給電源が50Hz・60Hzでも、インバーターの出力周波数を変えられます。", "terms": [], "block": "3-6-6feefeb17ea8"}, {"id": "3-6/22/text", "raw": "減速時や荷の下降時には、機械側からモーターを回し、発電する状態になることがあります。**機械のエネルギーを電気へ変えて、運動を抑える** のが電気的制動の考え方です。", "text": "減速時や荷の下降時には、機械側からモーターを回し、発電する状態になることがあります。機械のエネルギーを電気へ変えて、運動を抑える のが電気的制動の考え方です。", "terms": [], "block": "3-6-f69a6e69eff0"}, {"id": "3-6/23/text", "raw": "**電源回生は電源側へ返す。抵抗制動は抵抗器で熱に変える。** 同じ電気的な減速でも、エネルギーの行先が違います。電源回生には、それに対応する装置を使います。", "text": "電源回生は電源側へ返す。抵抗制動は抵抗器で熱に変える。 同じ電気的な減速でも、エネルギーの行先が違います。電源回生には、それに対応する装置を使います。", "terms": ["電源回生", "抵抗制動"], "block": "3-6-24b337d32926"}, {"id": "3-6/24/text", "raw": "摩擦ブレーキは、こすり合わせて運動のエネルギーを熱に変えます。渦電流ブレーキは、金属内の誘導電流と磁界の作用で回転を抑えます。", "text": "摩擦ブレーキは、こすり合わせて運動のエネルギーを熱に変えます。渦電流ブレーキは、金属内の誘導電流と磁界の作用で回転を抑えます。", "terms": [], "block": "3-6-737ea9fc4a00"}, {"id": "3-6/26/text", "raw": "**Vは電圧、fは周波数。** 一般的なV/f制御では、磁束を適切に保つため、周波数に合わせて電圧も調整します。", "text": "Vは電圧、fは周波数。 一般的なV/f制御では、磁束を適切に保つため、周波数に合わせて電圧も調整します。", "terms": ["V/f"], "block": "3-6-4121dfe6276c"}, {"id": "3-6/27/text", "raw": "基本となる範囲では、**V/fの比をほぼ一定**にします。周波数を下げるとき、電圧も合わせて下げるのが基本です。低い周波数では、電圧を補う調整もあります。", "text": "基本となる範囲では、V/fの比をほぼ一定にします。周波数を下げるとき、電圧も合わせて下げるのが基本です。低い周波数では、電圧を補う調整もあります。", "terms": [], "block": "3-6-f8076ecf85ed"}, {"id": "3-6/29/text", "raw": "極数変換では、極数の比が**2：1**の2種類の巻線を持つものがよく使われます。60Hzなら、4極で**1,800rpm**、8極で**900rpm**。極数2倍で同期速度は半分です。", "text": "極数変換では、極数の比が2：1の2種類の巻線を持つものがよく使われます。60Hzなら、4極で1,800rpm、8極で900rpm。極数2倍で同期速度は半分です。", "terms": [], "block": "3-6-rev26-poles-example"}, {"id": "3-6/31/text", "raw": "巻線形の回転子へ外部抵抗をつなぎ、その値を変えるのが**二次抵抗制御**。始動時は抵抗を全部入れ、順に短絡して使う抵抗を減らすと、緩やかに始動できます。", "text": "巻線形の回転子へ外部抵抗をつなぎ、その値を変えるのが二次抵抗制御。始動時は抵抗を全部入れ、順に短絡して使う抵抗を減らすと、緩やかに始動できます。", "terms": ["二次抵抗制御", "巻線形"], "block": "3-6-61a4862dc195"}, {"id": "3-6/34/text", "raw": "安定した電動機運転の範囲で、同じ負荷トルクを出す場合を考えます。**二次抵抗を増やすと、必要なすべりが大きくなり、実際の回転速度が低下します。**", "text": "安定した電動機運転の範囲で、同じ負荷トルクを出す場合を考えます。二次抵抗を増やすと、必要なすべりが大きくなり、実際の回転速度が低下します。", "terms": [], "block": "3-6-b30b043a63c2"}, {"id": "3-6/35/text", "raw": "**同期速度は120×周波数÷極数で決まり、二次抵抗では変わりません。** 追いかける磁界の速さと、回転子の遅れを分けます。外部の二次抵抗を接続できるのは巻線形です。", "text": "同期速度は120×周波数÷極数で決まり、二次抵抗では変わりません。 追いかける磁界の速さと、回転子の遅れを分けます。外部の二次抵抗を接続できるのは巻線形です。", "terms": [], "block": "3-6-2e33b60eec39"}, {"id": "3-6/36/text", "raw": "二次抵抗制御は**横行・走行・旋回**などに使います。荷重で速度が変わりやすいため、**巻下げでは別のブレーキ制御を組み合わせます**。", "text": "二次抵抗制御は横行・走行・旋回などに使います。荷重で速度が変わりやすいため、巻下げでは別のブレーキ制御を組み合わせます。", "terms": [], "block": "3-6-rev26-secondary-use"}, {"id": "3-6/38/text", "raw": "**渦電流**は、金属の中を渦状に流れる誘導電流です。電磁石で磁界を作り（**励磁**）、その中で円板が回ると、回転を妨げる力が生じます。磁極と円板は触れません。", "text": "渦電流は、金属の中を渦状に流れる誘導電流です。電磁石で磁界を作り（励磁）、その中で円板が回ると、回転を妨げる力が生じます。磁極と円板は触れません。", "terms": ["渦電流"], "block": "3-6-d946bb52c743"}, {"id": "3-6/40/text", "raw": "**軽い荷はモーターで回して下げ、重い荷は自重で下がる速さをブレーキで抑えます。** 渦電流ブレーキは、ライニングなどの消耗部品がなく、制御能力に優れます。", "text": "軽い荷はモーターで回して下げ、重い荷は自重で下がる速さをブレーキで抑えます。 渦電流ブレーキは、ライニングなどの消耗部品がなく、制御能力に優れます。", "terms": [], "block": "3-6-rev26-eddy-load"}, {"id": "3-6/41/text", "raw": "**電動油圧押上機** は、モーターで油の圧力を作り、棒を押し上げる装置です。ここではブレーキを操作します。**ライニング** はブレーキの摩擦材、**ドラム** はそれを押し当てる回転部分です。", "text": "電動油圧押上機 は、モーターで油の圧力を作り、棒を押し上げる装置です。ここではブレーキを操作します。ライニング はブレーキの摩擦材、ドラム はそれを押し当てる回転部分です。", "terms": [], "block": "3-6-12961f2d9384"}, {"id": "3-6/42/rows:0:0", "raw": "**電動油圧押上機ブレーキ**", "text": "電動油圧押上機ブレーキ", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/42/rows:0:1", "raw": "油圧の押上機で摩擦ブレーキを調整して低速にする。巻下げの回転が遅くなると、制動力を小さくする", "text": "油圧の押上機で摩擦ブレーキを調整して低速にする。巻下げの回転が遅くなると、制動力を小さくする", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/42/rows:1:0", "raw": "**ダイナミックブレーキ**", "text": "ダイナミックブレーキ", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/42/rows:1:1", "raw": "巻下げ時、**一次側を交流から切り離し、直流で励磁**して制動力を得る", "text": "巻下げ時、一次側を交流から切り離し、直流で励磁して制動力を得る", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/42/rows:2:0", "raw": "**サイリスター一次電圧制御**", "text": "サイリスター一次電圧制御", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/42/rows:2:1", "raw": "回転数を検知し、目標と比べながら**一次側の電圧**を調整する", "text": "回転数を検知し、目標と比べながら一次側の電圧を調整する", "terms": [], "block": "3-6-a9d963d41236"}, {"id": "3-6/43/text", "raw": "電動油圧押上機の操作電源は、巻線形電動機の**二次側回路**につなぎます。ダイナミックブレーキで直流を加えるのは**一次側**。接続する側を区別しましょう。", "text": "電動油圧押上機の操作電源は、巻線形電動機の二次側回路につなぎます。ダイナミックブレーキで直流を加えるのは一次側。接続する側を区別しましょう。", "terms": [], "block": "3-6-d3c15ae9b815"}, {"id": "3-6/44/rows:0:0", "raw": "**電動油圧押上機ブレーキ**", "text": "電動油圧押上機ブレーキ", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/44/rows:0:1", "raw": "全速の**約30％**まで／**約90kW以下**。摩耗・過熱のため使用頻度が高いものには不向き", "text": "全速の約30％まで／約90kW以下。摩耗・過熱のため使用頻度が高いものには不向き", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/44/rows:1:0", "raw": "**ダイナミックブレーキ**", "text": "ダイナミックブレーキ", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/44/rows:1:1", "raw": "全速の**約10〜70％**／**約110kW以上**。制動力が大きく、軽い荷を低速で下げられない場合がある", "text": "全速の約10〜70％／約110kW以上。制動力が大きく、軽い荷を低速で下げられない場合がある", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/44/rows:2:0", "raw": "**サイリスター一次電圧制御**", "text": "サイリスター一次電圧制御", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/44/rows:2:1", "raw": "全速の**約5％**。速度を検知して調整するため安定した低速が得られる", "text": "全速の約5％。速度を検知して調整するため安定した低速が得られる", "terms": [], "block": "3-6-9de05e7f0bd5"}, {"id": "3-6/46/text", "raw": "直流電動機の **可変電圧制御** は、電機子へ加える電圧を調整して速さを変える方式です。**発電機** は、モーターと逆に、軸を回す機械の動きから電気を作る装置。以下の2方式は、調整した直流電圧を「電子部品で作るか、発電機で作るか」が違います。", "text": "直流電動機の 可変電圧制御 は、電機子へ加える電圧を調整して速さを変える方式です。発電機 は、モーターと逆に、軸を回す機械の動きから電気を作る装置。以下の2方式は、調整した直流電圧を「電子部品で作るか、発電機で作るか」が違います。", "terms": ["可変電圧制御"], "block": "3-6-1f6f6d280ba9"}, {"id": "3-6/47/rows:0:0", "raw": "**サイリスターレオナード**", "text": "サイリスターレオナード", "terms": [], "block": "3-6-04f89a42f8a1"}, {"id": "3-6/47/rows:0:1", "raw": "サイリスター装置で交流を直流に変え、電圧を調整。設備を小さくできる", "text": "サイリスター装置で交流を直流に変え、電圧を調整。設備を小さくできる", "terms": [], "block": "3-6-04f89a42f8a1"}, {"id": "3-6/47/rows:1:0", "raw": "**ワードレオナード**", "text": "ワードレオナード", "terms": [], "block": "3-6-04f89a42f8a1"}, {"id": "3-6/47/rows:1:1", "raw": "三相誘導電動機で直流発電機を回す。設備費が高く、精密な速度制御を要するアンローダなどで使用", "text": "三相誘導電動機で直流発電機を回す。設備費が高く、精密な速度制御を要するアンローダなどで使用", "terms": [], "block": "3-6-04f89a42f8a1"}], "candidates": [{"id": "3-6/3/items:1#13", "fieldID": "3-6/3/items:1", "block": "3-6-983215084d8e", "answer": "2線", "category": "num", "prompt": "［数値？］", "start": 13, "end": 15, "context": "三相誘導電動機：3線のうち2線を入れ換えると、三相の順番（相順）が逆になり、回転磁界の向きが逆になります。", "start16": 13, "end16": 15}, {"id": "3-6/3/items:1#29", "fieldID": "3-6/3/items:1", "block": "3-6-983215084d8e", "answer": "相順", "category": "key", "prompt": "［用語？］", "start": 29, "end": 31, "context": "三相誘導電動機：3線のうち2線を入れ換えると、三相の順番（相順）が逆になり、回転磁界の向きが逆になります。", "start16": 29, "end16": 31}, {"id": "3-6/10/text#7", "fieldID": "3-6/10/text", "block": "3-6-156565358ff7", "answer": "スターデルタ始動", "category": "key", "prompt": "［用語？］", "start": 7, "end": 15, "context": "緩始動の一つ「スターデルタ始動」は、始動時はY（スター）結線にして電動機にかかる電圧を下げて始動電流・衝撃を抑え、回り始めたらΔ（デルタ）結線に切り換えて通常運転に移ります。", "start16": 7, "end16": 15}, {"id": "3-6/13/text#45", "fieldID": "3-6/13/text", "block": "3-6-d2daac40bf5c", "answer": "1/√3", "category": "num", "prompt": "［数値？］", "start": 45, "end": 49, "context": "同じ電源電圧で、デルタ結線による直接始動と比べます。スター結線では、各巻線にかかる電圧が 1/√3 になります。", "start16": 45, "end16": 49}, {"id": "3-6/14/text#27", "fieldID": "3-6/14/text", "block": "3-6-41836cf6d09b", "answer": "1/3", "category": "num", "prompt": "［数値？］", "start": 27, "end": 30, "context": "電源からの始動電流も、始動トルクも、デルタ直接始動の約1/3。 電流を抑えられる一方、回し始める力も小さくなります。大きな始動トルクを必要とする負荷には制約があります。", "start16": 27, "end16": 30}, {"id": "3-6/18/text#0", "fieldID": "3-6/18/text", "block": "3-6-21269a52da64", "answer": "コンバーター", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "コンバーター はここでは交流を直流に変える部分、インバーター は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。VVVF は、この「電圧と周波数を変える」という意味の略語です。", "start16": 0, "end16": 6}, {"id": "3-6/18/text#24", "fieldID": "3-6/18/text", "block": "3-6-21269a52da64", "answer": "インバーター", "category": "key", "prompt": "［用語？］", "start": 24, "end": 30, "context": "コンバーター はここでは交流を直流に変える部分、インバーター は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。VVVF は、この「電圧と周波数を変える」という意味の略語です。", "start16": 24, "end16": 30}, {"id": "3-6/18/text#63", "fieldID": "3-6/18/text", "block": "3-6-21269a52da64", "answer": "VVVF", "category": "key", "prompt": "［用語？］", "start": 63, "end": 67, "context": "コンバーター はここでは交流を直流に変える部分、インバーター は直流を交流に戻す部分です。戻すときに周波数と電圧を調整します。VVVF は、この「電圧と周波数を変える」という意味の略語です。", "start16": 63, "end16": 67}, {"id": "3-6/23/text#0", "fieldID": "3-6/23/text", "block": "3-6-24b337d32926", "answer": "電源回生", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "電源回生は電源側へ返す。抵抗制動は抵抗器で熱に変える。 同じ電気的な減速でも、エネルギーの行先が違います。電源回生には、それに対応する装置を使います。", "start16": 0, "end16": 4}, {"id": "3-6/23/text#12", "fieldID": "3-6/23/text", "block": "3-6-24b337d32926", "answer": "抵抗制動", "category": "key", "prompt": "［用語？］", "start": 12, "end": 16, "context": "電源回生は電源側へ返す。抵抗制動は抵抗器で熱に変える。 同じ電気的な減速でも、エネルギーの行先が違います。電源回生には、それに対応する装置を使います。", "start16": 12, "end16": 16}, {"id": "3-6/26/text#16", "fieldID": "3-6/26/text", "block": "3-6-4121dfe6276c", "answer": "V/f", "category": "key", "prompt": "［式？］", "start": 16, "end": 19, "context": "Vは電圧、fは周波数。 一般的なV/f制御では、磁束を適切に保つため、周波数に合わせて電圧も調整します。", "start16": 16, "end16": 19}, {"id": "3-6/31/text#0", "fieldID": "3-6/31/text", "block": "3-6-61a4862dc195", "answer": "巻線形", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "巻線形の回転子へ外部抵抗をつなぎ、その値を変えるのが二次抵抗制御。始動時は抵抗を全部入れ、順に短絡して使う抵抗を減らすと、緩やかに始動できます。", "start16": 0, "end16": 3}, {"id": "3-6/31/text#26", "fieldID": "3-6/31/text", "block": "3-6-61a4862dc195", "answer": "二次抵抗制御", "category": "key", "prompt": "［用語？］", "start": 26, "end": 32, "context": "巻線形の回転子へ外部抵抗をつなぎ、その値を変えるのが二次抵抗制御。始動時は抵抗を全部入れ、順に短絡して使う抵抗を減らすと、緩やかに始動できます。", "start16": 26, "end16": 32}, {"id": "3-6/38/text#0", "fieldID": "3-6/38/text", "block": "3-6-d946bb52c743", "answer": "渦電流", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "渦電流は、金属の中を渦状に流れる誘導電流です。電磁石で磁界を作り（励磁）、その中で円板が回ると、回転を妨げる力が生じます。磁極と円板は触れません。", "start16": 0, "end16": 3}, {"id": "3-6/46/text#7", "fieldID": "3-6/46/text", "block": "3-6-1f6f6d280ba9", "answer": "可変電圧制御", "category": "key", "prompt": "［用語？］", "start": 7, "end": 13, "context": "直流電動機の 可変電圧制御 は、電機子へ加える電圧を調整して速さを変える方式です。発電機 は、モーターと逆に、軸を回す機械の動きから電気を作る装置。以下の2方式は、調整した直流電圧を「電子部品で作るか、発電機で作るか」が違います。", "start16": 7, "end16": 13}], "rounds": {"all": [["3-6/18/text#0", "3-6/14/text#27", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0"], ["3-6/14/text#27", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0"], ["3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12"], ["3-6/26/text#16", "3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7"], ["3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29"], ["3-6/18/text#63", "3-6/31/text#26", "3-6/13/text#45", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/item xt#12", "3-6/10/text#7"], ["3-6/26/text#16", "3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29"], ["3-6/18/text#24", "3-6/18/text#63", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/38/text#0"], ["3-6/18/text#63", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0"], ["3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16"], ["3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24"], ["3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26"], ["3-6/23/text#0", "3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26", "3-6/31/text#0"], ["3-6/23/text#12", "3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7"], ["3-6/10/text#7", "3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0"], ["3-6/3/items:1#29", "3-6/18/text#0", "3-6/38/text#0", "3-6/26/text#16", "3-6/18/text#24", "3-6/31/text#26", "3-6/31/text#0", "3-6/46/text#7", "3-6/23/text#0", "3-6/23/text#12"]], "num": [["3-6/14/text#27", "3-6/13/text#45", "3-6/3/items:1#13"], ["3-6/13/text#45", "3-6/3/items:1#13", "3-6/14/text#27"], ["3-6/3/items:1#13", "3-6/14/text#27", "3-6/13/text#45"]]}}, {"id": "3-7", "title": "電気設備の保守――絶縁・感電対策・測定・故障", "blocks": [{"type": "p", "text": "電気は、必要な道だけに流れるようにします。**本来の道を外れないための絶縁** と、**金属外被に漏れたときの保護につなげる接地** を、役割で区別しましょう。", "style": "lead", "id": "3-7-bbbba041f2ce"}, {"type": "sub", "text": "導体・半導体・絶縁体", "id": "3-7-b94266da2b39"}, {"type": "p", "text": "**導体** は電気を通しやすい材料、**絶縁体** は通しにくい材料、**半導体** は温度などの条件で通りやすさが変わる材料です。銅線の中身が導体、外のビニール被覆が絶縁体、と実物に結び付けて考えます。", "id": "3-7-0baf6708dda6"}, {"type": "table", "headers": ["区分", "例"], "rows": [["**導体**（よく通す）", "銅・アルミニウム・鉄・鋼・ステンレス・ニクロム線・銀・鉛・**黒鉛・塩水・大地**"], ["**半導体**（中間）", "ゲルマニウム・シリコン・セレン"], ["**絶縁体**（通しにくい）", "空気・がいし・ゴム・ビニール・ポリエチレン樹脂・ガラス・**雲母**・**大理石**・磁器・セラミック・ベークライト・木材"]], "id": "3-7-8e3ae430eae2"}, {"type": "p", "text": "とくに**黒鉛・塩水・大地は導体**、**雲母・大理石・ガラス・空気・磁器は絶縁体**、という意外な例が問われます。", "id": "3-7-47c6e95bac25"}, {"type": "sub", "id": "lesson-motor-materials", "text": "材料を選ぶ理由――銅線・ニクロム・積層鉄心"}, {"type": "p", "text": "**銅は抵抗が小さいので、電流を運ぶ巻線に使います。ニクロムは抵抗が大きく、熱に強いので、抵抗器や電熱器に使います。** 同じ導体でも役目が違います。", "id": "3-7-38b3d125d4dd"}, {"type": "p", "text": "**鉄心を薄い鋼板の積層にするのは、鉄心内部の渦電流による損失を減らすため。** モーターを回す電流と、鉄心内で無駄な熱を生む電流を区別します。", "id": "3-7-cbca1c819ec4"}, {"type": "sub", "text": "絶縁・漏えい電流・絶縁抵抗", "id": "3-7-3e1546a69868"}, {"type": "p", "text": "**絶縁**は、電気が通ってはいけない場所へ流れないようにすること。わずかな漏れ電流はありますが、劣化・湿気・汚れなどで絶縁が悪くなると、漏れが増えます。", "id": "3-7-5813b7a60d67"}, {"type": "ul", "items": ["絶縁体が**湿気を帯びたり、熱（日光）で劣化したり、表面がカーボンなど導体で覆われる**と、漏えい電流が増えます。", "漏えい電流が増えると**漏電事故**になり、感電や災害の原因に。", "絶縁の良し悪しは**絶縁抵抗**で表します。"], "id": "3-7-b04af373a783"}, {"type": "p", "text": "**絶縁抵抗＝加えた電圧÷漏れ電流。** 同じ電圧なら、絶縁抵抗が大きいほど漏れる電流は小さくなります。", "emphasis": true, "id": "3-7-08e894e01308"}, {"type": "p", "text": "**メガー（絶縁抵抗計）** は、測定器から試験電圧を加えて絶縁抵抗を調べます。**同じ電圧なら、抵抗が大きいほど漏れる電流は小さい** と、オームの法則で考えられます。図の100MΩ・0.1MΩは比較例です。合否は機器の仕様・適用規定に従います。", "id": "3-7-262476294ae7"}, {"type": "p", "text": "測定は電源遮断・無電圧確認など、所定の手順で行います。", "id": "3-7-ab6df1c77e4e"}, {"type": "img", "asset": "3-6_megger_panel21_1", "caption": "絶縁抵抗が大きい場合の表示例。必ず電源を切り、無電圧を確認してから測定する。", "id": "3-7-83923f3fb4ff", "style": "figure", "_previewFile": "3-6_megger_panel21_1.png", "_width": 900, "_height": 760}, {"type": "img", "asset": "3-6_megger_panel21_2", "caption": "絶縁抵抗が低下した場合の表示例。比較用の数値であり、良否基準ではない。測定電圧・端子名は取扱説明書で確認し、測定後は所定の方法で放電する。", "id": "3-7-f8b1fbde48ff", "style": "figure", "_previewFile": "3-6_megger_panel21_2.png", "_width": 900, "_height": 660}, {"type": "sub", "id": "lesson-megger-safety", "text": "絶縁抵抗測定――電源を切っても、確認は続く"}, {"type": "p", "text": "**絶縁抵抗計は、自分で試験電圧を加える計器です。** 測定対象を停電させ、無電圧を確認します。接続された電子機器は、試験電圧で損傷する場合があるため、製造者の指示に従い必要な切離しを行います。", "id": "3-7-5afbe46167d0", "quizTerms": ["無電圧"]}, {"type": "p", "text": "**測定後にも、機器や配線に電荷が残ることがあります。** 数値を読み終えたことと、安全に触れられることは別です。測定器・機器の指定に従って放電し、安全を確認してから端子などを扱います。", "id": "3-7-e4bf62add9b4", "quizTerms": ["放電"]}, {"type": "sub", "text": "スパーク", "id": "3-7-b0bd9d1ea3c9"}, {"type": "p", "text": "**スパーク**は、大きな電圧・電流が流れている回路の電源を切るときなどに出る電気火花です。整流子とブラシの間や、接点・摺動面が汚れたり荒れたりしていると発生しやすく、回路の電圧が高いほど大きくなります。", "id": "3-7-da94c1a86d05"}, {"type": "p", "text": "熱で接点を傷めたり、飛んだ粉が**がいし**に付いて絶縁を劣化させ、漏電・短絡の原因にもなります。防ぐ注意点は次のとおりです。", "id": "3-7-0e9753d12b08"}, {"type": "ul", "items": ["ナイフスイッチで直接負荷を切らず、**接触器や遮断器を先に切って**回路に電流が流れなくなってからスイッチを切る。開閉操作は**すばやく**行う。", "ナイフスイッチは、**入れるときより切るときの方が大きなスパーク**が出る。切るときはスイッチにできるだけ近づかず、**側面から**行う。", "集電装置・制御器・接点や**スリップリング**・整流子とブラシの摺動面は、定期的に清掃し、荒れたまま使わない。"], "id": "3-7-582ed9f16758"}, {"type": "img", "asset": "3-7_supplement_f46_20261023", "labels": [], "legend": [], "caption": "通電中に接点が離れると、そのすき間に火花が生じることがある。負荷電流の遮断は、本文の手順を確認する。", "id": "3-7-6d71f507323d", "style": "figure", "_previewFile": "3-7_supplement_f46_20261023.png", "_width": 1774, "_height": 887}, {"type": "sub", "text": "接地（アース）", "id": "3-7-419419cbec41"}, {"type": "p", "text": "**外被（がいひ）** は、機器の外側を覆うケースやフレームです。絶縁が傷んで電線から金属外被へ電流が漏れると、外被に触れた人の体が電流の通り道になるおそれがあります。これが、外被の接地が必要になる理由です。", "id": "3-7-3700dd9ebc1d", "quizTerms": ["接地"]}, {"type": "p", "text": "**接地線** は、金属外被を大地につなぐ保護用の線です。漏れた電流が流れる経路をつくり、外被の電位上昇を抑えるなど、感電の危険を減らします。電流は大地で消えるのではなく、電源へ戻る回路を流れます。漏電遮断器などの保護装置と組み合わせて使います。", "id": "3-7-e3a02a0768d2", "quizTerms": ["漏電遮断器"]}, {"type": "img", "asset": "3-6_grounding_concept21", "caption": "保護接地によって、故障時の電流が流れる経路を設け、金属外被の電位上昇を抑える。接地があっても人体を流れる電流がゼロになるとは限らず、漏電遮断器などと組み合わせる。", "id": "3-7-1d592e977c7a", "style": "figure", "_previewFile": "3-6_grounding_concept21.png", "_width": 1774, "_height": 887}, {"type": "ul", "items": ["**接地経路の抵抗は小さく。** 接地線には、規定に適合する十分な太さのものを使います。", "レール・車輪を接地経路に使う方式では、外被から接地点まで **電気的につながっていること** が必要です。ボルトの緩み・塗装・汚れなどで導通が損なわれることがあります。", "**接地があっても、充電部への直接接触は危険です。** 接地は外被に漏れたときの保護であり、電気を通さなくする絶縁とは役割が違います。"], "id": "3-7-56b2bb1874ee"}, {"type": "sub", "text": "感電", "id": "3-7-c805c0252398"}, {"type": "p", "text": "感電は、人体に電流が流れて障害を受けることです。影響を大きく左右するのは、**電流の大きさと通電時間**。通る経路、交流・直流の違い、体の状態も関係します。", "id": "3-7-3bb6ebe7bb1d"}, {"id": "3-7-f8eac1fc32ef", "type": "table", "headers": ["書籍の重要ポイント", "覚える内容"], "rows": [["低い電圧での主な死亡原因", "**心室細動・呼吸停止**。心室細動は、心臓が細かく震えて血液を送れなくなる状態"], ["高い電圧での主な死亡原因", "**電気火傷**。アーク熱や、電流によるジュール熱で損傷する"], ["**安全限界：50mA・秒**", "書籍で示す数値。**電流×通電時間**で考える（影響は通電経路などによっても異なる）"], ["人体抵抗の目安", "内部（手〜足）**約500Ω**。皮膚は乾燥時**約4,000Ω**、湿潤時**約2,000Ω**"]]}, {"id": "3-7-rev26-shock-calculation", "type": "p", "text": "**計算例：人体抵抗を500Ωとして100Vが加わる場合。** 100÷500＝0.2A＝**200mA**です。問題で指定された抵抗値を使って計算します。"}, {"id": "3-7-rev26-shock-product", "type": "p", "text": "書籍の人体反応の例では、**50mAで約1秒、100mAで約0.5秒**の通電で心室細動の可能性が示されています。大きい電流ほど、短い時間でも影響が大きくなります。"}, {"type": "svg", "file": "3-7_supplement_f47_20261023.svg", "caption": "電流の大きさと通電時間の関係を示す模式図。電流の経路・電源の種類などでも影響は変わる。", "id": "3-7-639674ad2656", "style": "figure", "_previewFile": "3-7_supplement_f47_20261023.svg"}, {"type": "p", "text": "**救助は、救助する人の安全確保から。** 通電中の人へ直接触れず、安全な位置から電源を遮断し、119番通報とAEDの手配をします。", "id": "3-7-84acc7ecb04d"}, {"type": "p", "text": "安全を確保して反応・呼吸を確認し、普段どおりの呼吸がない、または判断できない場合は、119番の指示に従って**胸骨圧迫とAED**を行います。", "id": "3-7-c3b1b0de6555"}, {"type": "p", "text": "**点検・修理時の注意**：必ず電源スイッチを切り、スイッチ箱に**施錠**して「無断投入禁止」「作業中」などの表示をします。施錠できないときは**監視人**を付けます。", "id": "3-7-a961c29a8625", "quizTerms": ["監視人", "施錠"]}, {"type": "p", "text": "服装は肌の露出を避け、乾いた清潔なものとし、**絶縁手袋**・絶縁靴などの電気用絶縁保護具を着用（一般の作業用手袋・靴では同じ保護は得られません）。付近の活線には不用意に触れず、絶縁シートや絶縁管で防護します。", "id": "3-7-2859409504ca", "quizTerms": ["絶縁手袋"]}, {"type": "sub", "text": "測定機器", "id": "3-7-6c1c293723f5"}, {"type": "img", "asset": "3-7_measurement_water_daily", "caption": "水の流量計と水位差の測定で、測る場所の違いを考えるたとえ。下の電気回路図で、電流計は直列・電圧計は並列に対応させる。", "id": "3-7-2b00ca1d4d2e", "style": "figure", "_previewFile": "3-7_measurement_water_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "水道の **流量計は、水が通る道に入れます**。一方、水位の違いは **2つの水面を比べます**。電流計と電圧計も、「流れる量」か「2点の差」かによって、測る場所が変わります。", "id": "3-7-bb0058dbb6be"}, {"type": "p", "text": "**レンジ** は測れる値の範囲です。体重計にも測れる上限があるように、計器も測定範囲を選びます。**計器用変圧器** は高い電圧を計器で測れる電圧へ、**変流器** は交流の大電流を計器で測れる電流へ変える装置。**分流器** は直流の大電流の一部を分けて測るために使います。", "id": "3-7-b12fd32a3b61"}, {"type": "table", "headers": ["機器", "用途・つなぎ方"], "rows": [["**電圧計（ボルトメーター）**", "電圧の大きさを測る。回路に**並列**接続。交流高電圧は計器用変圧器で降圧して測る"], ["**電流計（アンメーター）**", "電流の大きさを測る。回路に**直列**接続。大電流は交流では変流器、直流では分流器を使う"], ["**絶縁抵抗計（メガー）**", "絶縁の良否を測る整備用携帯計器"], ["**回路計（サーキット・テスター）**", "電圧・電流・抵抗などを測る。測定値の見当が付かないときは**まず最大レンジから**。アナログ式は測定前に指針を「0」に合わせる零点調整をする"]], "id": "3-7-b496ae28e13c", "quizTerms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"]}, {"type": "img", "asset": "3-7_meters_concept", "caption": "Aは電流計、Vは電圧計。抵抗の両端の電位差をVで測り、その道の電流をAで測る。", "id": "3-7-777dba8fbd77", "style": "figure", "_previewFile": "3-7_meters_concept.png", "_width": 1400, "_height": 790}, {"type": "p", "text": "**電流計は直列、電圧計は並列。** 電流計には測る電流を通し、電圧計は測る2点の間につなぎます。", "id": "3-7-cae495578b6b", "style": "tip"}, {"type": "sub", "text": "電気装置の故障と原因", "id": "3-7-27fdbd45e49f"}, {"type": "p", "text": "懐中電灯の中で電線が切れたら、電流の道が途切れて点きません。これが **断線** の入口です。一方、必要な部品を通らず、抵抗の小さい道でつながってしまうのが **短絡（ショート）**。下の回路図では、道が「切れる」のか「余計につながる」のかを見ます。", "id": "3-7-d1c1a9017e22"}, {"type": "img", "asset": "3-7_faults_concept", "caption": "断線と短絡を、電流の通り道で見分ける。", "id": "3-7-36dea314d839", "style": "figure", "_previewFile": "3-7_faults_concept.png", "_width": 1400, "_height": 760}, {"type": "p", "text": "故障の表の用語も、役割で読みます。**過負荷** は仕事を重くかけすぎること、**過電流** は電流が大きすぎること。**過電流継電器** は電流の異常を検知して遮断などの指令を出す機器、**ヒューズ** は過大な電流で内部の金属が溶け、電流の道を切る部品です。", "id": "3-7-a53592882be2"}, {"type": "p", "text": "**溶着（ようちゃく）** は、接点が熱で溶けてくっつき、開かなくなること。**欠相（けっそう）** は三相のうち一相が途切れること、**インチング（寸動）** は短い運転を繰り返し、少しずつ位置を合わせる操作です。", "id": "3-7-965f11a91946", "quizTerms": ["欠相"]}, {"type": "p", "text": "**リミットスイッチ** は、機械が決められた位置へ来たことを検出するスイッチです。", "id": "3-7-0b33775fce90"}, {"type": "p", "text": "故障の「症状」と「原因」の組み合わせが問われます。とくに「断線」と「**過負荷**・短絡」の取り違えに注意します。", "id": "3-7-3e6d84737803"}, {"id": "3-7-e4a5fa74ca2c", "type": "table", "headers": ["症状", "考えられる原因"], "rows": [["まったく動かない", "停電・断線、電源の電圧降下が大きい、端子の緩み・外れ"], ["電動機がうなるが起動しない", "負荷が大きすぎる、電動機の故障、一次側電源回路の断線による**単相運転**、ブレーキが故障して緩まない"], ["回転数が上がらない", "負荷が大きすぎる、電源の電圧や周波数の降下が大きい、回路の一部断線・絶縁不良、電動機の故障"], ["電動機が停止しない", "**電磁接触器の主接点が溶着**している"]]}, {"id": "3-7-rev26-fault-stop", "type": "sub", "text": "停止・ブレーキの異常"}, {"id": "3-7-rev26-fault-stop-table", "type": "table", "headers": ["症状", "考えられる原因"], "rows": [["過電流継電器が作動／ヒューズ切れ", "負荷が大きすぎる、インチング（寸動）頻度が大きい、**回路の短絡**"], ["ブレーキが効かない", "ブレーキライニングの摩耗、ピン回りの摩耗"], ["振動や衝撃が起こる", "取付ボルトの緩み、軸受の摩耗など機械部分の不具合"], ["電動油圧押上機ブレーキの作動が遅い", "油量不足、負荷が大きすぎる"], ["ブレーキドラムが異常に過熱する", "電磁コイルの断線などによるブレーキの作動不良"]], "quizTerms": ["短絡", "過電流継電器"]}, {"id": "3-7-rev26-fault-contact", "type": "sub", "text": "巻過ぎ・端子・集電部の異常"}, {"id": "3-7-rev26-fault-contact-table", "type": "table", "headers": ["症状", "考えられる原因"], "rows": [["巻過防止装置が作動しない", "リミットスイッチの故障、取付ボルトの緩み"], ["配線の端子が過熱する", "締付け不足、負荷が大きすぎる"], ["集電装置の火花が激しい", "負荷が大きすぎる、集電子やトロリ線の摩耗、トロリ線の曲がり・うねり、シューの接触圧力不足"]]}, {"type": "p", "text": "同じ症状でも、原因は一つとは限りません。「停止しない＝主接点の**溶着**」などは代表的な組み合わせです。運転者が異常を認めたときは、使用をやめて所定の連絡を行い、点検・修理につなげます。", "id": "3-7-28362febe55b"}, {"type": "p", "text": "**断線と短絡の違い：** 単純な1回路が切れれば電流は止まります。短絡では負荷を通らない小さな抵抗の経路ができ、過電流のおそれがあります。三相電動機は、一相だけが切れる **欠相** で残りの相に過電流が流れることがあるため、断線の場所にも注意します。", "id": "3-7-17b93d54dbc3"}, {"id": "3-7-rev26-two-resistances-q", "type": "p", "text": "**確認：** 絶縁抵抗と接地抵抗は、それぞれ大きい方・小さい方のどちらがよい？", "style": "question"}, {"id": "3-7-rev26-two-resistances-a", "type": "p", "text": "**絶縁抵抗は大きく、接地抵抗は小さく。** 絶縁は漏らさない働き、接地は漏れた電気を流す道を作る働きです。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-7/2/text", "raw": "**導体** は電気を通しやすい材料、**絶縁体** は通しにくい材料、**半導体** は温度などの条件で通りやすさが変わる材料です。銅線の中身が導体、外のビニール被覆が絶縁体、と実物に結び付けて考えます。", "text": "導体 は電気を通しやすい材料、絶縁体 は通しにくい材料、半導体 は温度などの条件で通りやすさが変わる材料です。銅線の中身が導体、外のビニール被覆が絶縁体、と実物に結び付けて考えます。", "terms": [], "block": "3-7-0baf6708dda6"}, {"id": "3-7/3/rows:0:0", "raw": "**導体**（よく通す）", "text": "導体（よく通す）", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/3/rows:0:1", "raw": "銅・アルミニウム・鉄・鋼・ステンレス・ニクロム線・銀・鉛・**黒鉛・塩水・大地**", "text": "銅・アルミニウム・鉄・鋼・ステンレス・ニクロム線・銀・鉛・黒鉛・塩水・大地", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/3/rows:1:0", "raw": "**半導体**（中間）", "text": "半導体（中間）", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/3/rows:1:1", "raw": "ゲルマニウム・シリコン・セレン", "text": "ゲルマニウム・シリコン・セレン", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/3/rows:2:0", "raw": "**絶縁体**（通しにくい）", "text": "絶縁体（通しにくい）", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/3/rows:2:1", "raw": "空気・がいし・ゴム・ビニール・ポリエチレン樹脂・ガラス・**雲母**・**大理石**・磁器・セラミック・ベークライト・木材", "text": "空気・がいし・ゴム・ビニール・ポリエチレン樹脂・ガラス・雲母・大理石・磁器・セラミック・ベークライト・木材", "terms": [], "block": "3-7-8e3ae430eae2"}, {"id": "3-7/4/text", "raw": "とくに**黒鉛・塩水・大地は導体**、**雲母・大理石・ガラス・空気・磁器は絶縁体**、という意外な例が問われます。", "text": "とくに黒鉛・塩水・大地は導体、雲母・大理石・ガラス・空気・磁器は絶縁体、という意外な例が問われます。", "terms": [], "block": "3-7-47c6e95bac25"}, {"id": "3-7/6/text", "raw": "**銅は抵抗が小さいので、電流を運ぶ巻線に使います。ニクロムは抵抗が大きく、熱に強いので、抵抗器や電熱器に使います。** 同じ導体でも役目が違います。", "text": "銅は抵抗が小さいので、電流を運ぶ巻線に使います。ニクロムは抵抗が大きく、熱に強いので、抵抗器や電熱器に使います。 同じ導体でも役目が違います。", "terms": [], "block": "3-7-38b3d125d4dd"}, {"id": "3-7/7/text", "raw": "**鉄心を薄い鋼板の積層にするのは、鉄心内部の渦電流による損失を減らすため。** モーターを回す電流と、鉄心内で無駄な熱を生む電流を区別します。", "text": "鉄心を薄い鋼板の積層にするのは、鉄心内部の渦電流による損失を減らすため。 モーターを回す電流と、鉄心内で無駄な熱を生む電流を区別します。", "terms": [], "block": "3-7-cbca1c819ec4"}, {"id": "3-7/9/text", "raw": "**絶縁**は、電気が通ってはいけない場所へ流れないようにすること。わずかな漏れ電流はありますが、劣化・湿気・汚れなどで絶縁が悪くなると、漏れが増えます。", "text": "絶縁は、電気が通ってはいけない場所へ流れないようにすること。わずかな漏れ電流はありますが、劣化・湿気・汚れなどで絶縁が悪くなると、漏れが増えます。", "terms": [], "block": "3-7-5813b7a60d67"}, {"id": "3-7/10/items:0", "raw": "絶縁体が**湿気を帯びたり、熱（日光）で劣化したり、表面がカーボンなど導体で覆われる**と、漏えい電流が増えます。", "text": "絶縁体が湿気を帯びたり、熱（日光）で劣化したり、表面がカーボンなど導体で覆われると、漏えい電流が増えます。", "terms": [], "block": "3-7-b04af373a783"}, {"id": "3-7/10/items:1", "raw": "漏えい電流が増えると**漏電事故**になり、感電や災害の原因に。", "text": "漏えい電流が増えると漏電事故になり、感電や災害の原因に。", "terms": [], "block": "3-7-b04af373a783"}, {"id": "3-7/10/items:2", "raw": "絶縁の良し悪しは**絶縁抵抗**で表します。", "text": "絶縁の良し悪しは絶縁抵抗で表します。", "terms": [], "block": "3-7-b04af373a783"}, {"id": "3-7/11/text", "raw": "**絶縁抵抗＝加えた電圧÷漏れ電流。** 同じ電圧なら、絶縁抵抗が大きいほど漏れる電流は小さくなります。", "text": "絶縁抵抗＝加えた電圧÷漏れ電流。 同じ電圧なら、絶縁抵抗が大きいほど漏れる電流は小さくなります。", "terms": [], "block": "3-7-08e894e01308"}, {"id": "3-7/12/text", "raw": "**メガー（絶縁抵抗計）** は、測定器から試験電圧を加えて絶縁抵抗を調べます。**同じ電圧なら、抵抗が大きいほど漏れる電流は小さい** と、オームの法則で考えられます。図の100MΩ・0.1MΩは比較例です。合否は機器の仕様・適用規定に従います。", "text": "メガー（絶縁抵抗計） は、測定器から試験電圧を加えて絶縁抵抗を調べます。同じ電圧なら、抵抗が大きいほど漏れる電流は小さい と、オームの法則で考えられます。図の100MΩ・0.1MΩは比較例です。合否は機器の仕様・適用規定に従います。", "terms": [], "block": "3-7-262476294ae7"}, {"id": "3-7/13/text", "raw": "測定は電源遮断・無電圧確認など、所定の手順で行います。", "text": "測定は電源遮断・無電圧確認など、所定の手順で行います。", "terms": [], "block": "3-7-ab6df1c77e4e"}, {"id": "3-7/17/text", "raw": "**絶縁抵抗計は、自分で試験電圧を加える計器です。** 測定対象を停電させ、無電圧を確認します。接続された電子機器は、試験電圧で損傷する場合があるため、製造者の指示に従い必要な切離しを行います。", "text": "絶縁抵抗計は、自分で試験電圧を加える計器です。 測定対象を停電させ、無電圧を確認します。接続された電子機器は、試験電圧で損傷する場合があるため、製造者の指示に従い必要な切離しを行います。", "terms": ["無電圧"], "block": "3-7-5afbe46167d0"}, {"id": "3-7/18/text", "raw": "**測定後にも、機器や配線に電荷が残ることがあります。** 数値を読み終えたことと、安全に触れられることは別です。測定器・機器の指定に従って放電し、安全を確認してから端子などを扱います。", "text": "測定後にも、機器や配線に電荷が残ることがあります。 数値を読み終えたことと、安全に触れられることは別です。測定器・機器の指定に従って放電し、安全を確認してから端子などを扱います。", "terms": ["放電"], "block": "3-7-e4bf62add9b4"}, {"id": "3-7/20/text", "raw": "**スパーク**は、大きな電圧・電流が流れている回路の電源を切るときなどに出る電気火花です。整流子とブラシの間や、接点・摺動面が汚れたり荒れたりしていると発生しやすく、回路の電圧が高いほど大きくなります。", "text": "スパークは、大きな電圧・電流が流れている回路の電源を切るときなどに出る電気火花です。整流子とブラシの間や、接点・摺動面が汚れたり荒れたりしていると発生しやすく、回路の電圧が高いほど大きくなります。", "terms": [], "block": "3-7-da94c1a86d05"}, {"id": "3-7/21/text", "raw": "熱で接点を傷めたり、飛んだ粉が**がいし**に付いて絶縁を劣化させ、漏電・短絡の原因にもなります。防ぐ注意点は次のとおりです。", "text": "熱で接点を傷めたり、飛んだ粉ががいしに付いて絶縁を劣化させ、漏電・短絡の原因にもなります。防ぐ注意点は次のとおりです。", "terms": [], "block": "3-7-0e9753d12b08"}, {"id": "3-7/22/items:0", "raw": "ナイフスイッチで直接負荷を切らず、**接触器や遮断器を先に切って**回路に電流が流れなくなってからスイッチを切る。開閉操作は**すばやく**行う。", "text": "ナイフスイッチで直接負荷を切らず、接触器や遮断器を先に切って回路に電流が流れなくなってからスイッチを切る。開閉操作はすばやく行う。", "terms": [], "block": "3-7-582ed9f16758"}, {"id": "3-7/22/items:1", "raw": "ナイフスイッチは、**入れるときより切るときの方が大きなスパーク**が出る。切るときはスイッチにできるだけ近づかず、**側面から**行う。", "text": "ナイフスイッチは、入れるときより切るときの方が大きなスパークが出る。切るときはスイッチにできるだけ近づかず、側面から行う。", "terms": [], "block": "3-7-582ed9f16758"}, {"id": "3-7/22/items:2", "raw": "集電装置・制御器・接点や**スリップリング**・整流子とブラシの摺動面は、定期的に清掃し、荒れたまま使わない。", "text": "集電装置・制御器・接点やスリップリング・整流子とブラシの摺動面は、定期的に清掃し、荒れたまま使わない。", "terms": [], "block": "3-7-582ed9f16758"}, {"id": "3-7/25/text", "raw": "**外被（がいひ）** は、機器の外側を覆うケースやフレームです。絶縁が傷んで電線から金属外被へ電流が漏れると、外被に触れた人の体が電流の通り道になるおそれがあります。これが、外被の接地が必要になる理由です。", "text": "外被（がいひ） は、機器の外側を覆うケースやフレームです。絶縁が傷んで電線から金属外被へ電流が漏れると、外被に触れた人の体が電流の通り道になるおそれがあります。これが、外被の接地が必要になる理由です。", "terms": ["接地"], "block": "3-7-3700dd9ebc1d"}, {"id": "3-7/26/text", "raw": "**接地線** は、金属外被を大地につなぐ保護用の線です。漏れた電流が流れる経路をつくり、外被の電位上昇を抑えるなど、感電の危険を減らします。電流は大地で消えるのではなく、電源へ戻る回路を流れます。漏電遮断器などの保護装置と組み合わせて使います。", "text": "接地線 は、金属外被を大地につなぐ保護用の線です。漏れた電流が流れる経路をつくり、外被の電位上昇を抑えるなど、感電の危険を減らします。電流は大地で消えるのではなく、電源へ戻る回路を流れます。漏電遮断器などの保護装置と組み合わせて使います。", "terms": ["漏電遮断器"], "block": "3-7-e3a02a0768d2"}, {"id": "3-7/28/items:0", "raw": "**接地経路の抵抗は小さく。** 接地線には、規定に適合する十分な太さのものを使います。", "text": "接地経路の抵抗は小さく。 接地線には、規定に適合する十分な太さのものを使います。", "terms": [], "block": "3-7-56b2bb1874ee"}, {"id": "3-7/28/items:1", "raw": "レール・車輪を接地経路に使う方式では、外被から接地点まで **電気的につながっていること** が必要です。ボルトの緩み・塗装・汚れなどで導通が損なわれることがあります。", "text": "レール・車輪を接地経路に使う方式では、外被から接地点まで 電気的につながっていること が必要です。ボルトの緩み・塗装・汚れなどで導通が損なわれることがあります。", "terms": [], "block": "3-7-56b2bb1874ee"}, {"id": "3-7/28/items:2", "raw": "**接地があっても、充電部への直接接触は危険です。** 接地は外被に漏れたときの保護であり、電気を通さなくする絶縁とは役割が違います。", "text": "接地があっても、充電部への直接接触は危険です。 接地は外被に漏れたときの保護であり、電気を通さなくする絶縁とは役割が違います。", "terms": [], "block": "3-7-56b2bb1874ee"}, {"id": "3-7/30/text", "raw": "感電は、人体に電流が流れて障害を受けることです。影響を大きく左右するのは、**電流の大きさと通電時間**。通る経路、交流・直流の違い、体の状態も関係します。", "text": "感電は、人体に電流が流れて障害を受けることです。影響を大きく左右するのは、電流の大きさと通電時間。通る経路、交流・直流の違い、体の状態も関係します。", "terms": [], "block": "3-7-3bb6ebe7bb1d"}, {"id": "3-7/31/rows:0:0", "raw": "低い電圧での主な死亡原因", "text": "低い電圧での主な死亡原因", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:0:1", "raw": "**心室細動・呼吸停止**。心室細動は、心臓が細かく震えて血液を送れなくなる状態", "text": "心室細動・呼吸停止。心室細動は、心臓が細かく震えて血液を送れなくなる状態", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:1:0", "raw": "高い電圧での主な死亡原因", "text": "高い電圧での主な死亡原因", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:1:1", "raw": "**電気火傷**。アーク熱や、電流によるジュール熱で損傷する", "text": "電気火傷。アーク熱や、電流によるジュール熱で損傷する", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:2:0", "raw": "**安全限界：50mA・秒**", "text": "安全限界：50mA・秒", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:2:1", "raw": "書籍で示す数値。**電流×通電時間**で考える（影響は通電経路などによっても異なる）", "text": "書籍で示す数値。電流×通電時間で考える（影響は通電経路などによっても異なる）", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:3:0", "raw": "人体抵抗の目安", "text": "人体抵抗の目安", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/31/rows:3:1", "raw": "内部（手〜足）**約500Ω**。皮膚は乾燥時**約4,000Ω**、湿潤時**約2,000Ω**", "text": "内部（手〜足）約500Ω。皮膚は乾燥時約4,000Ω、湿潤時約2,000Ω", "terms": [], "block": "3-7-f8eac1fc32ef"}, {"id": "3-7/32/text", "raw": "**計算例：人体抵抗を500Ωとして100Vが加わる場合。** 100÷500＝0.2A＝**200mA**です。問題で指定された抵抗値を使って計算します。", "text": "計算例：人体抵抗を500Ωとして100Vが加わる場合。 100÷500＝0.2A＝200mAです。問題で指定された抵抗値を使って計算します。", "terms": [], "block": "3-7-rev26-shock-calculation"}, {"id": "3-7/33/text", "raw": "書籍の人体反応の例では、**50mAで約1秒、100mAで約0.5秒**の通電で心室細動の可能性が示されています。大きい電流ほど、短い時間でも影響が大きくなります。", "text": "書籍の人体反応の例では、50mAで約1秒、100mAで約0.5秒の通電で心室細動の可能性が示されています。大きい電流ほど、短い時間でも影響が大きくなります。", "terms": [], "block": "3-7-rev26-shock-product"}, {"id": "3-7/35/text", "raw": "**救助は、救助する人の安全確保から。** 通電中の人へ直接触れず、安全な位置から電源を遮断し、119番通報とAEDの手配をします。", "text": "救助は、救助する人の安全確保から。 通電中の人へ直接触れず、安全な位置から電源を遮断し、119番通報とAEDの手配をします。", "terms": [], "block": "3-7-84acc7ecb04d"}, {"id": "3-7/36/text", "raw": "安全を確保して反応・呼吸を確認し、普段どおりの呼吸がない、または判断できない場合は、119番の指示に従って**胸骨圧迫とAED**を行います。", "text": "安全を確保して反応・呼吸を確認し、普段どおりの呼吸がない、または判断できない場合は、119番の指示に従って胸骨圧迫とAEDを行います。", "terms": [], "block": "3-7-c3b1b0de6555"}, {"id": "3-7/37/text", "raw": "**点検・修理時の注意**：必ず電源スイッチを切り、スイッチ箱に**施錠**して「無断投入禁止」「作業中」などの表示をします。施錠できないときは**監視人**を付けます。", "text": "点検・修理時の注意：必ず電源スイッチを切り、スイッチ箱に施錠して「無断投入禁止」「作業中」などの表示をします。施錠できないときは監視人を付けます。", "terms": ["監視人", "施錠"], "block": "3-7-a961c29a8625"}, {"id": "3-7/38/text", "raw": "服装は肌の露出を避け、乾いた清潔なものとし、**絶縁手袋**・絶縁靴などの電気用絶縁保護具を着用（一般の作業用手袋・靴では同じ保護は得られません）。付近の活線には不用意に触れず、絶縁シートや絶縁管で防護します。", "text": "服装は肌の露出を避け、乾いた清潔なものとし、絶縁手袋・絶縁靴などの電気用絶縁保護具を着用（一般の作業用手袋・靴では同じ保護は得られません）。付近の活線には不用意に触れず、絶縁シートや絶縁管で防護します。", "terms": ["絶縁手袋"], "block": "3-7-2859409504ca"}, {"id": "3-7/41/text", "raw": "水道の **流量計は、水が通る道に入れます**。一方、水位の違いは **2つの水面を比べます**。電流計と電圧計も、「流れる量」か「2点の差」かによって、測る場所が変わります。", "text": "水道の 流量計は、水が通る道に入れます。一方、水位の違いは 2つの水面を比べます。電流計と電圧計も、「流れる量」か「2点の差」かによって、測る場所が変わります。", "terms": [], "block": "3-7-bb0058dbb6be"}, {"id": "3-7/42/text", "raw": "**レンジ** は測れる値の範囲です。体重計にも測れる上限があるように、計器も測定範囲を選びます。**計器用変圧器** は高い電圧を計器で測れる電圧へ、**変流器** は交流の大電流を計器で測れる電流へ変える装置。**分流器** は直流の大電流の一部を分けて測るために使います。", "text": "レンジ は測れる値の範囲です。体重計にも測れる上限があるように、計器も測定範囲を選びます。計器用変圧器 は高い電圧を計器で測れる電圧へ、変流器 は交流の大電流を計器で測れる電流へ変える装置。分流器 は直流の大電流の一部を分けて測るために使います。", "terms": [], "block": "3-7-b12fd32a3b61"}, {"id": "3-7/43/rows:0:0", "raw": "**電圧計（ボルトメーター）**", "text": "電圧計（ボルトメーター）", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:0:1", "raw": "電圧の大きさを測る。回路に**並列**接続。交流高電圧は計器用変圧器で降圧して測る", "text": "電圧の大きさを測る。回路に並列接続。交流高電圧は計器用変圧器で降圧して測る", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:1:0", "raw": "**電流計（アンメーター）**", "text": "電流計（アンメーター）", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:1:1", "raw": "電流の大きさを測る。回路に**直列**接続。大電流は交流では変流器、直流では分流器を使う", "text": "電流の大きさを測る。回路に直列接続。大電流は交流では変流器、直流では分流器を使う", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:2:0", "raw": "**絶縁抵抗計（メガー）**", "text": "絶縁抵抗計（メガー）", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:2:1", "raw": "絶縁の良否を測る整備用携帯計器", "text": "絶縁の良否を測る整備用携帯計器", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:3:0", "raw": "**回路計（サーキット・テスター）**", "text": "回路計（サーキット・テスター）", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/43/rows:3:1", "raw": "電圧・電流・抵抗などを測る。測定値の見当が付かないときは**まず最大レンジから**。アナログ式は測定前に指針を「0」に合わせる零点調整をする", "text": "電圧・電流・抵抗などを測る。測定値の見当が付かないときはまず最大レンジから。アナログ式は測定前に指針を「0」に合わせる零点調整をする", "terms": ["絶縁抵抗計", "メガー", "電流計", "電圧計", "計器用変圧器", "変流器", "分流器"], "block": "3-7-b496ae28e13c"}, {"id": "3-7/45/text", "raw": "**電流計は直列、電圧計は並列。** 電流計には測る電流を通し、電圧計は測る2点の間につなぎます。", "text": "電流計は直列、電圧計は並列。 電流計には測る電流を通し、電圧計は測る2点の間につなぎます。", "terms": [], "block": "3-7-cae495578b6b"}, {"id": "3-7/47/text", "raw": "懐中電灯の中で電線が切れたら、電流の道が途切れて点きません。これが **断線** の入口です。一方、必要な部品を通らず、抵抗の小さい道でつながってしまうのが **短絡（ショート）**。下の回路図では、道が「切れる」のか「余計につながる」のかを見ます。", "text": "懐中電灯の中で電線が切れたら、電流の道が途切れて点きません。これが 断線 の入口です。一方、必要な部品を通らず、抵抗の小さい道でつながってしまうのが 短絡（ショート）。下の回路図では、道が「切れる」のか「余計につながる」のかを見ます。", "terms": [], "block": "3-7-d1c1a9017e22"}, {"id": "3-7/49/text", "raw": "故障の表の用語も、役割で読みます。**過負荷** は仕事を重くかけすぎること、**過電流** は電流が大きすぎること。**過電流継電器** は電流の異常を検知して遮断などの指令を出す機器、**ヒューズ** は過大な電流で内部の金属が溶け、電流の道を切る部品です。", "text": "故障の表の用語も、役割で読みます。過負荷 は仕事を重くかけすぎること、過電流 は電流が大きすぎること。過電流継電器 は電流の異常を検知して遮断などの指令を出す機器、ヒューズ は過大な電流で内部の金属が溶け、電流の道を切る部品です。", "terms": [], "block": "3-7-a53592882be2"}, {"id": "3-7/50/text", "raw": "**溶着（ようちゃく）** は、接点が熱で溶けてくっつき、開かなくなること。**欠相（けっそう）** は三相のうち一相が途切れること、**インチング（寸動）** は短い運転を繰り返し、少しずつ位置を合わせる操作です。", "text": "溶着（ようちゃく） は、接点が熱で溶けてくっつき、開かなくなること。欠相（けっそう） は三相のうち一相が途切れること、インチング（寸動） は短い運転を繰り返し、少しずつ位置を合わせる操作です。", "terms": ["欠相"], "block": "3-7-965f11a91946"}, {"id": "3-7/51/text", "raw": "**リミットスイッチ** は、機械が決められた位置へ来たことを検出するスイッチです。", "text": "リミットスイッチ は、機械が決められた位置へ来たことを検出するスイッチです。", "terms": [], "block": "3-7-0b33775fce90"}, {"id": "3-7/52/text", "raw": "故障の「症状」と「原因」の組み合わせが問われます。とくに「断線」と「**過負荷**・短絡」の取り違えに注意します。", "text": "故障の「症状」と「原因」の組み合わせが問われます。とくに「断線」と「過負荷・短絡」の取り違えに注意します。", "terms": [], "block": "3-7-3e6d84737803"}, {"id": "3-7/53/rows:0:0", "raw": "まったく動かない", "text": "まったく動かない", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:0:1", "raw": "停電・断線、電源の電圧降下が大きい、端子の緩み・外れ", "text": "停電・断線、電源の電圧降下が大きい、端子の緩み・外れ", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:1:0", "raw": "電動機がうなるが起動しない", "text": "電動機がうなるが起動しない", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:1:1", "raw": "負荷が大きすぎる、電動機の故障、一次側電源回路の断線による**単相運転**、ブレーキが故障して緩まない", "text": "負荷が大きすぎる、電動機の故障、一次側電源回路の断線による単相運転、ブレーキが故障して緩まない", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:2:0", "raw": "回転数が上がらない", "text": "回転数が上がらない", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:2:1", "raw": "負荷が大きすぎる、電源の電圧や周波数の降下が大きい、回路の一部断線・絶縁不良、電動機の故障", "text": "負荷が大きすぎる、電源の電圧や周波数の降下が大きい、回路の一部断線・絶縁不良、電動機の故障", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:3:0", "raw": "電動機が停止しない", "text": "電動機が停止しない", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/53/rows:3:1", "raw": "**電磁接触器の主接点が溶着**している", "text": "電磁接触器の主接点が溶着している", "terms": [], "block": "3-7-e4a5fa74ca2c"}, {"id": "3-7/55/rows:0:0", "raw": "過電流継電器が作動／ヒューズ切れ", "text": "過電流継電器が作動／ヒューズ切れ", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:0:1", "raw": "負荷が大きすぎる、インチング（寸動）頻度が大きい、**回路の短絡**", "text": "負荷が大きすぎる、インチング（寸動）頻度が大きい、回路の短絡", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:1:0", "raw": "ブレーキが効かない", "text": "ブレーキが効かない", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:1:1", "raw": "ブレーキライニングの摩耗、ピン回りの摩耗", "text": "ブレーキライニングの摩耗、ピン回りの摩耗", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:2:0", "raw": "振動や衝撃が起こる", "text": "振動や衝撃が起こる", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:2:1", "raw": "取付ボルトの緩み、軸受の摩耗など機械部分の不具合", "text": "取付ボルトの緩み、軸受の摩耗など機械部分の不具合", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:3:0", "raw": "電動油圧押上機ブレーキの作動が遅い", "text": "電動油圧押上機ブレーキの作動が遅い", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:3:1", "raw": "油量不足、負荷が大きすぎる", "text": "油量不足、負荷が大きすぎる", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:4:0", "raw": "ブレーキドラムが異常に過熱する", "text": "ブレーキドラムが異常に過熱する", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/55/rows:4:1", "raw": "電磁コイルの断線などによるブレーキの作動不良", "text": "電磁コイルの断線などによるブレーキの作動不良", "terms": ["短絡", "過電流継電器"], "block": "3-7-rev26-fault-stop-table"}, {"id": "3-7/57/rows:0:0", "raw": "巻過防止装置が作動しない", "text": "巻過防止装置が作動しない", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/57/rows:0:1", "raw": "リミットスイッチの故障、取付ボルトの緩み", "text": "リミットスイッチの故障、取付ボルトの緩み", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/57/rows:1:0", "raw": "配線の端子が過熱する", "text": "配線の端子が過熱する", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/57/rows:1:1", "raw": "締付け不足、負荷が大きすぎる", "text": "締付け不足、負荷が大きすぎる", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/57/rows:2:0", "raw": "集電装置の火花が激しい", "text": "集電装置の火花が激しい", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/57/rows:2:1", "raw": "負荷が大きすぎる、集電子やトロリ線の摩耗、トロリ線の曲がり・うねり、シューの接触圧力不足", "text": "負荷が大きすぎる、集電子やトロリ線の摩耗、トロリ線の曲がり・うねり、シューの接触圧力不足", "terms": [], "block": "3-7-rev26-fault-contact-table"}, {"id": "3-7/58/text", "raw": "同じ症状でも、原因は一つとは限りません。「停止しない＝主接点の**溶着**」などは代表的な組み合わせです。運転者が異常を認めたときは、使用をやめて所定の連絡を行い、点検・修理につなげます。", "text": "同じ症状でも、原因は一つとは限りません。「停止しない＝主接点の溶着」などは代表的な組み合わせです。運転者が異常を認めたときは、使用をやめて所定の連絡を行い、点検・修理につなげます。", "terms": [], "block": "3-7-28362febe55b"}, {"id": "3-7/59/text", "raw": "**断線と短絡の違い：** 単純な1回路が切れれば電流は止まります。短絡では負荷を通らない小さな抵抗の経路ができ、過電流のおそれがあります。三相電動機は、一相だけが切れる **欠相** で残りの相に過電流が流れることがあるため、断線の場所にも注意します。", "text": "断線と短絡の違い： 単純な1回路が切れれば電流は止まります。短絡では負荷を通らない小さな抵抗の経路ができ、過電流のおそれがあります。三相電動機は、一相だけが切れる 欠相 で残りの相に過電流が流れることがあるため、断線の場所にも注意します。", "terms": [], "block": "3-7-17b93d54dbc3"}], "candidates": [{"id": "3-7/17/text#34", "fieldID": "3-7/17/text", "block": "3-7-5afbe46167d0", "answer": "無電圧", "category": "key", "prompt": "［用語？］", "start": 34, "end": 37, "context": "絶縁抵抗計は、自分で試験電圧を加える計器です。 測定対象を停電させ、無電圧を確認します。接続された電子機器は、試験電圧で損傷する場合があるため、製造者の指示に従い必要な切離しを行います。", "start16": 34, "end16": 37}, {"id": "3-7/18/text#66", "fieldID": "3-7/18/text", "block": "3-7-e4bf62add9b4", "answer": "放電", "category": "key", "prompt": "［用語？］", "start": 66, "end": 68, "context": "測定後にも、機器や配線に電荷が残ることがあります。 数値を読み終えたことと、安全に触れられることは別です。測定器・機器の指定に従って放電し、安全を確認してから端子などを扱います。", "start16": 66, "end16": 68}, {"id": "3-7/25/text#87", "fieldID": "3-7/25/text", "block": "3-7-3700dd9ebc1d", "answer": "接地", "category": "key", "prompt": "［用語？］", "start": 87, "end": 89, "context": "外被（がいひ） は、機器の外側を覆うケースやフレームです。絶縁が傷んで電線から金属外被へ電流が漏れると、外被に触れた人の体が電流の通り道になるおそれがあります。これが、外被の接地が必要になる理由です。", "start16": 87, "end16": 89}, {"id": "3-7/26/text#95", "fieldID": "3-7/26/text", "block": "3-7-e3a02a0768d2", "answer": "漏電遮断器", "category": "key", "prompt": "［用語？］", "start": 95, "end": 100, "context": "接地線 は、金属外被を大地につなぐ保護用の線です。漏れた電流が流れる経路をつくり、外被の電位上昇を抑えるなど、感電の危険を減らします。電流は大地で消えるのではなく、電源へ戻る回路を流れます。漏電遮断器などの保護装置と組み合わせて使います。", "start16": 95, "end16": 100}, {"id": "3-7/37/text#28", "fieldID": "3-7/37/text", "block": "3-7-a961c29a8625", "answer": "施錠", "category": "key", "prompt": "［用語？］", "start": 28, "end": 30, "context": "点検・修理時の注意：必ず電源スイッチを切り、スイッチ箱に施錠して「無断投入禁止」「作業中」などの表示をします。施錠できないときは監視人を付けます。", "start16": 28, "end16": 30}, {"id": "3-7/37/text#64", "fieldID": "3-7/37/text", "block": "3-7-a961c29a8625", "answer": "監視人", "category": "key", "prompt": "［用語？］", "start": 64, "end": 67, "context": "点検・修理時の注意：必ず電源スイッチを切り、スイッチ箱に施錠して「無断投入禁止」「作業中」などの表示をします。施錠できないときは監視人を付けます。", "start16": 64, "end16": 67}, {"id": "3-7/38/text#22", "fieldID": "3-7/38/text", "block": "3-7-2859409504ca", "answer": "絶縁手袋", "category": "key", "prompt": "［用語？］", "start": 22, "end": 26, "context": "服装は肌の露出を避け、乾いた清潔なものとし、絶縁手袋・絶縁靴などの電気用絶縁保護具を着用（一般の作業用手袋・靴では同じ保護は得られません）。付近の活線には不用意に触れず、絶縁シートや絶縁管で防護します。", "start16": 22, "end16": 26}, {"id": "3-7/43/rows:0:0#0", "fieldID": "3-7/43/rows:0:0", "block": "3-7-b496ae28e13c", "answer": "電圧計", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "電圧計（ボルトメーター）", "start16": 0, "end16": 3}, {"id": "3-7/43/rows:0:1#24", "fieldID": "3-7/43/rows:0:1", "block": "3-7-b496ae28e13c", "answer": "計器用変圧器", "category": "key", "prompt": "［用語？］", "start": 24, "end": 30, "context": "電圧の大きさを測る。回路に並列接続。交流高電圧は計器用変圧器で降圧して測る", "start16": 24, "end16": 30}, {"id": "3-7/43/rows:1:0#0", "fieldID": "3-7/43/rows:1:0", "block": "3-7-b496ae28e13c", "answer": "電流計", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "電流計（アンメーター）", "start16": 0, "end16": 3}, {"id": "3-7/43/rows:1:1#26", "fieldID": "3-7/43/rows:1:1", "block": "3-7-b496ae28e13c", "answer": "変流器", "category": "key", "prompt": "［用語？］", "start": 26, "end": 29, "context": "電流の大きさを測る。回路に直列接続。大電流は交流では変流器、直流では分流器を使う", "start16": 26, "end16": 29}, {"id": "3-7/43/rows:1:1#34", "fieldID": "3-7/43/rows:1:1", "block": "3-7-b496ae28e13c", "answer": "分流器", "category": "key", "prompt": "［用語？］", "start": 34, "end": 37, "context": "電流の大きさを測る。回路に直列接続。大電流は交流では変流器、直流では分流器を使う", "start16": 34, "end16": 37}, {"id": "3-7/43/rows:2:0#0", "fieldID": "3-7/43/rows:2:0", "block": "3-7-b496ae28e13c", "answer": "絶縁抵抗計", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "絶縁抵抗計（メガー）", "start16": 0, "end16": 5}, {"id": "3-7/43/rows:2:0#6", "fieldID": "3-7/43/rows:2:0", "block": "3-7-b496ae28e13c", "answer": "メガー", "category": "key", "prompt": "［用語？］", "start": 6, "end": 9, "context": "絶縁抵抗計（メガー）", "start16": 6, "end16": 9}, {"id": "3-7/50/text#34", "fieldID": "3-7/50/text", "block": "3-7-965f11a91946", "answer": "欠相", "category": "key", "prompt": "［用語？］", "start": 34, "end": 36, "context": "溶着（ようちゃく） は、接点が熱で溶けてくっつき、開かなくなること。欠相（けっそう） は三相のうち一相が途切れること、インチング（寸動） は短い運転を繰り返し、少しずつ位置を合わせる操作です。", "start16": 34, "end16": 36}, {"id": "3-7/55/rows:0:0#0", "fieldID": "3-7/55/rows:0:0", "block": "3-7-rev26-fault-stop-table", "answer": "過電流継電器", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "過電流継電器が作動／ヒューズ切れ", "start16": 0, "end16": 6}, {"id": "3-7/55/rows:0:1#28", "fieldID": "3-7/55/rows:0:1", "block": "3-7-rev26-fault-stop-table", "answer": "短絡", "category": "key", "prompt": "［用語？］", "start": 28, "end": 30, "context": "負荷が大きすぎる、インチング（寸動）頻度が大きい、回路の短絡", "start16": 28, "end16": 30}], "rounds": {"all": [["3-7/25/text#87", "3-7/37/text#28", "3-7/37/text#64", "3-7/55/rows:0:0#0", "3-7/38/text#22", "3-7/26/text#95", "3-7/43/rows:1:0#0", "3-7/43/rows:2:0#6", "3-7/43/rows:0:1#24", "3-7/50/text#34"], ["3-7/37/text#28", "3-7/37/text#64", "3-7/55/rows:0:0#0", "3-7/38/text#22", "3-7/26/text#95", "3-7/43/rows:1:0#0", "3-7/43/rows:2:0#6", "3-7/43/rows:0:1#24", "3-7/50/text#34", "3-7/17/text#34"], [
