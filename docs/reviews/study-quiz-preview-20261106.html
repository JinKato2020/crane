/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50"], ["3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37"], ["3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28"], ["3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59"], ["3-1/43/text#27", "3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13"], ["3-1/24/text#24", "3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0"], ["3-1/37/text#55", "3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0"], ["3-1/37/text#61", "3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0"], ["3-1/3/text#12", "3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14"], ["3-1/14/text#50", "3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12"], ["3-1/18/text#37", "3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27"], ["3-1/18/text#28", "3-1/21/text#59", "3-1/21/text#13", "3-1/26/text#0", "3-1/41/text#0", "3-1/29/text#0", "3-1/31/text#14", "3-1/49/text#12", "3-1/43/text#27", "3-1/24/text#24"]], "num": [["3-1/50/text#14"]]}}, {"id": "3-2", "title": "オームの法則と電気回路の計算", "blocks": [{"type": "p", "text": "計算は、**何を求めるか → 使う公式 → 数字と単位**の順に進めます。直列は一本道、並列は枝分かれ。まず回路の形を見分けましょう。", "style": "lead", "id": "3-2-1dec888a8112"}, {"type": "sub", "text": "オームの法則", "id": "3-2-9a5feed2cfe1"}, {"type": "p", "text": "この節では、温度などの条件が一定の抵抗回路を考えます。**同じ抵抗なら電圧を2倍にすると電流も2倍。同じ電圧なら抵抗を2倍にすると電流は半分。** この関係がオームの法則です。", "id": "3-2-cd1405b46f31", "quizTerms": ["オームの法則"]}, {"type": "p", "text": "**I＝V÷R　／　V＝I×R　／　R＝V÷I**", "emphasis": true, "id": "3-2-7c44a436dc54", "quizTerms": ["V÷R"]}, {"type": "p", "text": "**Iは電流〔A〕、Vは電圧〔V〕、Rは抵抗〔Ω〕** を表す記号です。3つの式は同じ関係を並べかえたもの。分かっている2つの値を入れ、残り1つを求めます。", "id": "3-2-87cf1ffc8b19"}, {"type": "p", "text": "**計算のコツ：求める単位まで書く。** 100÷50＝2だけではなく、100V÷50Ω＝2Aとすると、電圧と電流の取り違えを防げます。", "id": "3-2-e49cf0832401"}, {"type": "p", "text": "**例題1：** 電圧100V、抵抗50Ω。流れる電流は何A？", "id": "3-2-154cd7e8dd17", "style": "question"}, {"type": "p", "text": "**2A。** 電流＝電圧÷抵抗なので、100÷50＝2Aです。", "id": "3-2-b7c3a3725685", "style": "answer"}, {"type": "sub", "text": "直列接続の合成抵抗――たし算", "id": "3-2-505a2ec98141"}, {"type": "img", "asset": "3-2_pipe_paths_daily", "caption": "同じ水位差の配管で考えるたとえ。直列は1本の道に通りにくい所が続き、並列は通り道が増える。", "id": "3-2-9078d845086e", "style": "figure", "_previewFile": "3-2_pipe_paths_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**直列は、1本の道を順番に通る。並列は、途中で道が分かれる。** 配管の図でつながりをつかんでから、下の回路図へ置き換えます。管の通りにくい所が抵抗にあたります。", "id": "3-2-0532bdd9d53a"}, {"type": "p", "text": "**直列の合成抵抗：R＝R₁＋R₂。** 一列につながる抵抗を足します。20Ωと30Ωなら、20＋30＝**50Ω**です。", "id": "3-2-591faae3ba11", "quizTerms": ["合成抵抗", "R₁＋R₂"]}, {"type": "img", "asset": "3-2_series_formula_steps", "caption": "直列の公式と例題2。一本道の抵抗を足して、20Ω＋30Ω＝50Ω。", "id": "3-2-c642879a977a", "style": "figure", "_previewFile": "3-2_series_formula_steps.png", "_width": 1400, "_height": 900}, {"id": "3-2-f5c4af03b6d0", "type": "point", "items": ["直列では、どの抵抗にも**同じ電流**が流れる。", "合成抵抗は、個々の抵抗より**大きくなる**。"]}, {"type": "sub", "text": "並列接続の合成抵抗――逆数のたし算", "id": "3-2-97ca49748b9f"}, {"type": "p", "text": "**並列の合成抵抗：1/R＝1/R₁＋1/R₂。** 逆数を足して、最後にもう一度ひっくり返します。", "id": "3-2-87f7f4e3e2ec", "quizTerms": ["1/R₁＋1/R₂"]}, {"type": "img", "asset": "3-2_parallel_formula_steps", "caption": "並列の公式と例題3。各枝に同じ電圧がかかり、枝の電流を足すことから逆数の和が出てくる。", "id": "3-2-060defb159c2", "style": "figure", "_previewFile": "3-2_parallel_formula_steps.png", "_width": 1400, "_height": 1170}, {"type": "p", "text": "**逆数**は「1÷その数」。30Ωと60Ωなら、1/30＋1/60＝3/60＝1/20。したがって、合成抵抗は**20Ω**です。", "id": "3-2-690f1f4c5fa1"}, {"id": "3-2-2b9dc6f82b08", "type": "point", "items": ["並列では、各枝にかかる**電圧が同じ**。", "合成抵抗は、いちばん小さい抵抗よりも**小さくなる**。"], "quizTerms": ["電圧が同じ"]}, {"type": "p", "text": "抵抗が**2個の並列**なら、**R＝R₁×R₂÷（R₁＋R₂）**でも計算できます。30×60÷（30＋60）＝20Ω。同じ値R₀が2個なら、R₀÷2です。", "id": "3-2-2e8696702bee", "style": "tip", "quizTerms": ["R₁×R₂÷（R₁＋R₂）"]}, {"type": "sub", "text": "回路図の読み方――つながり方で見分ける", "id": "3-2-2d9fb3872b77"}, {"type": "p", "text": "**分岐** は電流の道が枝分かれする所、**両端** は考える部品の入り口側と出口側です。分岐のない一本道の抵抗には同じ電流が流れ、同じ二つの接続点につながる抵抗には同じ電圧がかかります。図の向きより、どことどこがつながるかをたどります。", "id": "3-2-4d5ca6e9a49a"}, {"type": "p", "text": "**計算の確かめ方：** 枝の電流を足すと全体の電流、直列部分の電圧を足すと電源電圧になります。この2つで、計算の取り違えに気付きやすくなります。", "id": "3-2-75f5dd6acb3f"}, {"type": "sub", "text": "直列と並列が混ざった回路――例題（試験の典型）", "id": "3-2-cfe11aa600e6"}, {"type": "p", "text": "**まず、同じ2点につながる並列部分を1個にまとめます。** 次に直列の抵抗を足します。「小さくまとめてから全体へ」がコツです。", "id": "3-2-bb6e0a90cce0"}, {"type": "p", "text": "**例題4：** 次の図の、全体の抵抗と電源から流れる電流を求めましょう。", "id": "3-2-77f5a2e2136f"}, {"type": "p", "text": "電源90V。10Ωの**抵抗**が1個、そのあとに30Ωと60Ωの並列がつながっている。", "id": "3-2-6e22d770fa6b"}, {"type": "img", "asset": "3-2_mixed_reduce_steps", "caption": "例題4の前半。上の並列部分だけを20Ωに置き換えると、10Ωと20Ωの直列になる。", "id": "3-2-9106b45ef6df", "style": "figure", "_previewFile": "3-2_mixed_reduce_steps.png", "_width": 1400, "_height": 1150}, {"type": "p", "text": "**① 並列部分：** 30×60÷（30＋60）＝**20Ω**。枝分かれ部分を1個の抵抗に置き換えます。", "id": "3-2-be749c89954b"}, {"type": "p", "text": "**② 全体：** 10Ωと20Ωが直列なので、10＋20＝**30Ω**。", "id": "3-2-65cdb4e7f209"}, {"type": "p", "text": "**③ 電源電流：** 90V÷30Ω＝**3A**。", "id": "3-2-36eaed562e21"}, {"type": "p", "text": "**各部の電圧・電流（分圧・分流）**：", "id": "3-2-2c4751cdb8e3"}, {"id": "3-2-abcd45a59389", "type": "table", "headers": ["求めるもの", "計算と結果"], "rows": [["10Ωにかかる電圧", "3A×10Ω＝**30V**"], ["並列部分の電圧", "90−30＝**60V**（両方の枝に共通）"], ["30Ωの枝の電流", "60÷30＝**2A**"], ["60Ωの枝の電流", "60÷60＝**1A**／2＋1＝3Aで全体と一致"]]}, {"type": "img", "asset": "3-2_mixed_concept", "caption": "例題4の電流と電圧。分岐の手前3Aが、30Ω側2A・60Ω側1Aに分かれる。", "id": "3-2-3156387a7836", "style": "figure", "_previewFile": "3-2_mixed_concept.png", "_width": 1400, "_height": 840}, {"type": "sub", "text": "分圧と分流の考え方", "id": "3-2-b24185405084"}, {"type": "p", "text": "**分圧は「電圧を分ける」、分流は「電流を分ける」こと。** 分けるものが違います。直列では電圧、並列では電流に注目します。", "id": "3-2-922cbfe6ffd9"}, {"id": "3-2-bac658901a44", "type": "table", "headers": ["つなぎ方", "分かれ方"], "rows": [["**直列：電圧が分かれる**", "同じ電流が通るので、抵抗が大きいほど電圧も大きい"], ["**並列：電流が分かれる**", "同じ電圧がかかるので、抵抗が小さい枝ほど電流が大きい"]], "quizTerms": ["同じ電流"]}, {"type": "p", "text": "**答えの点検：** 直列は各部分の電圧を足す、並列は枝の電流を足す。元の電源の値と合えば、計算の確かめになります。", "id": "3-2-9e718fcf3585", "style": "tip"}, {"type": "sub", "text": "電力・電力量・ジュール熱", "id": "3-2-91e5eed680cb"}, {"type": "img", "asset": "3-2_power_energy_heater_daily", "caption": "一定の電力でヒーターを使う例。中央の1,000W×1時間と、右の500W×2時間は、どちらも1,000Wh。時計は使用時間のイメージ。", "id": "3-2-e50a3c9543c7", "style": "figure", "_previewFile": "3-2_power_energy_heater_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**電力（W）は、電気エネルギーを使うペース。** ヒーターの500W・1,000Wは、その瞬間に使う電力です。同じ時間なら、1,000Wは500Wの2倍の電気エネルギーを使います。", "id": "3-2-a9a4b7d0ec9d", "quizTerms": ["電力"]}, {"type": "p", "text": "**電力量（Wh）は、使った電気エネルギーの合計。** 図の左と中央は時間が同じで、電力が2倍なら電力量も2倍。左と右は電力が同じで、時間が2倍なら電力量も2倍です。", "id": "3-2-1203837beb66", "quizTerms": ["電力量"]}, {"type": "p", "text": "**電力量＝電力×時間。** W×時間（h）ならWh、kW×時間（h）ならkWhになります。", "emphasis": true, "id": "3-2-c1bde65cf00a", "quizTerms": ["電力×時間"]}, {"type": "p", "text": "**500Wを2時間**使うと1,000Wh＝**1kWh**。**1,000Wを1時間**使う場合と、使った電気の合計は同じです。", "id": "3-2-b1a5c834369f"}, {"type": "p", "text": "**電力P＝電圧V×電流I。** 抵抗で消費される電力は、**P＝I²R＝V²/R**とも表せます。", "emphasis": true, "id": "3-2-3d72bbc539fb", "quizTerms": ["電圧V×電流I"]}, {"type": "p", "text": "**例題5：** 抵抗負荷に100Vを加え、2A流れると、電力は100×2＝**200W**。これを3時間使うと、200×3＝**600Wh（0.6kWh）**です。", "id": "3-2-7de404afa85e"}, {"type": "sub", "text": "ジュール熱：電気が熱に変わる", "id": "3-2-437523e2dec5"}, {"type": "img", "asset": "3-2_joule_heat_daily", "caption": "どちらも抵抗に電流が流れて発熱する。トースターでは加熱に利用し、モーターの巻線では熱損失になる。赤は熱、青は回転。", "id": "3-2-56f12e3649a7", "style": "figure", "_previewFile": "3-2_joule_heat_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "トースターや電気ストーブは、電流を流して発熱線を温めます。**抵抗に電流が流れて生じる熱がジュール熱** です。モーターの巻線にも抵抗があるため、回転に使われるエネルギーの一部は熱になります。", "id": "3-2-60bb5c675b70", "quizTerms": ["ジュール熱"]}, {"type": "p", "text": "**ジュール熱：Q＝I²Rt。** 時間tを秒で入れると、熱量QはJ（ジュール）になります。同じ抵抗・同じ時間なら、電流2倍で熱量は**4倍**。電流が増えると発熱が急に増える理由です。", "id": "3-2-6f9d787a7668", "quizTerms": ["I²Rt"]}, {"type": "p", "text": "交流の電動機では、電力を求めるときに**力率**も考えます。巻線の抵抗で生じるジュール熱は、電動機の損失の一つで、**銅損（どうそん）**と呼びます。", "id": "3-2-7f45fe250a6a"}, {"type": "sub", "text": "単位の接頭語", "id": "3-2-c34e1cd8a7ed"}, {"type": "p", "text": "数が大きすぎたり小さすぎたりするとき、単位の前に記号を付けて表します。", "id": "3-2-edf66ba8e0d7"}, {"type": "table", "headers": ["記号・読み", "倍率と例"], "rows": [["M（メガ）", "100万倍：1MΩ＝1,000,000Ω"], ["k（キロ）", "1,000倍：1kV＝1,000V、1kW＝1,000W"], ["m（ミリ）", "1,000分の1：1A＝1,000mA"]], "id": "3-2-4639e0100101"}, {"id": "3-2-rev26-practice-heading", "type": "sub", "text": "自分で解く：並列からまとめる"}, {"id": "3-2-rev26-practice-circuit", "type": "svg", "file": "3-2_mixed_practice_20261106.svg", "caption": "A・B間の合成抵抗を求める。200Ωと600Ωの両端が、それぞれ同じ点につながっている。", "style": "figure", "_previewFile": "3-2_mixed_practice_20261106.svg"}, {"id": "3-2-rev26-mixed-practice-q", "type": "p", "text": "**確認：** 図のA・B間の合成抵抗は？", "style": "question"}, {"id": "3-2-rev26-mixed-practice-a", "type": "p", "text": "**250Ω。** 並列は200×600÷（200＋600）＝150Ω。これと100Ωが直列なので、100＋150＝250Ωです。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-2/2/text", "raw": "この節では、温度などの条件が一定の抵抗回路を考えます。**同じ抵抗なら電圧を2倍にすると電流も2倍。同じ電圧なら抵抗を2倍にすると電流は半分。** この関係がオームの法則です。", "text": "この節では、温度などの条件が一定の抵抗回路を考えます。同じ抵抗なら電圧を2倍にすると電流も2倍。同じ電圧なら抵抗を2倍にすると電流は半分。 この関係がオームの法則です。", "terms": ["オームの法則"], "block": "3-2-cd1405b46f31"}, {"id": "3-2/3/text", "raw": "**I＝V÷R　／　V＝I×R　／　R＝V÷I**", "text": "I＝V÷R　／　V＝I×R　／　R＝V÷I", "terms": ["V÷R"], "block": "3-2-7c44a436dc54"}, {"id": "3-2/4/text", "raw": "**Iは電流〔A〕、Vは電圧〔V〕、Rは抵抗〔Ω〕** を表す記号です。3つの式は同じ関係を並べかえたもの。分かっている2つの値を入れ、残り1つを求めます。", "text": "Iは電流〔A〕、Vは電圧〔V〕、Rは抵抗〔Ω〕 を表す記号です。3つの式は同じ関係を並べかえたもの。分かっている2つの値を入れ、残り1つを求めます。", "terms": [], "block": "3-2-87cf1ffc8b19"}, {"id": "3-2/5/text", "raw": "**計算のコツ：求める単位まで書く。** 100÷50＝2だけではなく、100V÷50Ω＝2Aとすると、電圧と電流の取り違えを防げます。", "text": "計算のコツ：求める単位まで書く。 100÷50＝2だけではなく、100V÷50Ω＝2Aとすると、電圧と電流の取り違えを防げます。", "terms": [], "block": "3-2-e49cf0832401"}, {"id": "3-2/10/text", "raw": "**直列は、1本の道を順番に通る。並列は、途中で道が分かれる。** 配管の図でつながりをつかんでから、下の回路図へ置き換えます。管の通りにくい所が抵抗にあたります。", "text": "直列は、1本の道を順番に通る。並列は、途中で道が分かれる。 配管の図でつながりをつかんでから、下の回路図へ置き換えます。管の通りにくい所が抵抗にあたります。", "terms": [], "block": "3-2-0532bdd9d53a"}, {"id": "3-2/11/text", "raw": "**直列の合成抵抗：R＝R₁＋R₂。** 一列につながる抵抗を足します。20Ωと30Ωなら、20＋30＝**50Ω**です。", "text": "直列の合成抵抗：R＝R₁＋R₂。 一列につながる抵抗を足します。20Ωと30Ωなら、20＋30＝50Ωです。", "terms": ["合成抵抗", "R₁＋R₂"], "block": "3-2-591faae3ba11"}, {"id": "3-2/13/items:0", "raw": "直列では、どの抵抗にも**同じ電流**が流れる。", "text": "直列では、どの抵抗にも同じ電流が流れる。", "terms": [], "block": "3-2-f5c4af03b6d0"}, {"id": "3-2/13/items:1", "raw": "合成抵抗は、個々の抵抗より**大きくなる**。", "text": "合成抵抗は、個々の抵抗より大きくなる。", "terms": [], "block": "3-2-f5c4af03b6d0"}, {"id": "3-2/15/text", "raw": "**並列の合成抵抗：1/R＝1/R₁＋1/R₂。** 逆数を足して、最後にもう一度ひっくり返します。", "text": "並列の合成抵抗：1/R＝1/R₁＋1/R₂。 逆数を足して、最後にもう一度ひっくり返します。", "terms": ["1/R₁＋1/R₂"], "block": "3-2-87f7f4e3e2ec"}, {"id": "3-2/17/text", "raw": "**逆数**は「1÷その数」。30Ωと60Ωなら、1/30＋1/60＝3/60＝1/20。したがって、合成抵抗は**20Ω**です。", "text": "逆数は「1÷その数」。30Ωと60Ωなら、1/30＋1/60＝3/60＝1/20。したがって、合成抵抗は20Ωです。", "terms": [], "block": "3-2-690f1f4c5fa1"}, {"id": "3-2/18/items:0", "raw": "並列では、各枝にかかる**電圧が同じ**。", "text": "並列では、各枝にかかる電圧が同じ。", "terms": ["電圧が同じ"], "block": "3-2-2b9dc6f82b08"}, {"id": "3-2/18/items:1", "raw": "合成抵抗は、いちばん小さい抵抗よりも**小さくなる**。", "text": "合成抵抗は、いちばん小さい抵抗よりも小さくなる。", "terms": ["電圧が同じ"], "block": "3-2-2b9dc6f82b08"}, {"id": "3-2/19/text", "raw": "抵抗が**2個の並列**なら、**R＝R₁×R₂÷（R₁＋R₂）**でも計算できます。30×60÷（30＋60）＝20Ω。同じ値R₀が2個なら、R₀÷2です。", "text": "抵抗が2個の並列なら、R＝R₁×R₂÷（R₁＋R₂）でも計算できます。30×60÷（30＋60）＝20Ω。同じ値R₀が2個なら、R₀÷2です。", "terms": ["R₁×R₂÷（R₁＋R₂）"], "block": "3-2-2e8696702bee"}, {"id": "3-2/21/text", "raw": "**分岐** は電流の道が枝分かれする所、**両端** は考える部品の入り口側と出口側です。分岐のない一本道の抵抗には同じ電流が流れ、同じ二つの接続点につながる抵抗には同じ電圧がかかります。図の向きより、どことどこがつながるかをたどります。", "text": "分岐 は電流の道が枝分かれする所、両端 は考える部品の入り口側と出口側です。分岐のない一本道の抵抗には同じ電流が流れ、同じ二つの接続点につながる抵抗には同じ電圧がかかります。図の向きより、どことどこがつながるかをたどります。", "terms": [], "block": "3-2-4d5ca6e9a49a"}, {"id": "3-2/22/text", "raw": "**計算の確かめ方：** 枝の電流を足すと全体の電流、直列部分の電圧を足すと電源電圧になります。この2つで、計算の取り違えに気付きやすくなります。", "text": "計算の確かめ方： 枝の電流を足すと全体の電流、直列部分の電圧を足すと電源電圧になります。この2つで、計算の取り違えに気付きやすくなります。", "terms": [], "block": "3-2-75f5dd6acb3f"}, {"id": "3-2/24/text", "raw": "**まず、同じ2点につながる並列部分を1個にまとめます。** 次に直列の抵抗を足します。「小さくまとめてから全体へ」がコツです。", "text": "まず、同じ2点につながる並列部分を1個にまとめます。 次に直列の抵抗を足します。「小さくまとめてから全体へ」がコツです。", "terms": [], "block": "3-2-bb6e0a90cce0"}, {"id": "3-2/25/text", "raw": "**例題4：** 次の図の、全体の抵抗と電源から流れる電流を求めましょう。", "text": "例題4： 次の図の、全体の抵抗と電源から流れる電流を求めましょう。", "terms": [], "block": "3-2-77f5a2e2136f"}, {"id": "3-2/26/text", "raw": "電源90V。10Ωの**抵抗**が1個、そのあとに30Ωと60Ωの並列がつながっている。", "text": "電源90V。10Ωの抵抗が1個、そのあとに30Ωと60Ωの並列がつながっている。", "terms": [], "block": "3-2-6e22d770fa6b"}, {"id": "3-2/28/text", "raw": "**① 並列部分：** 30×60÷（30＋60）＝**20Ω**。枝分かれ部分を1個の抵抗に置き換えます。", "text": "① 並列部分： 30×60÷（30＋60）＝20Ω。枝分かれ部分を1個の抵抗に置き換えます。", "terms": [], "block": "3-2-be749c89954b"}, {"id": "3-2/29/text", "raw": "**② 全体：** 10Ωと20Ωが直列なので、10＋20＝**30Ω**。", "text": "② 全体： 10Ωと20Ωが直列なので、10＋20＝30Ω。", "terms": [], "block": "3-2-65cdb4e7f209"}, {"id": "3-2/30/text", "raw": "**③ 電源電流：** 90V÷30Ω＝**3A**。", "text": "③ 電源電流： 90V÷30Ω＝3A。", "terms": [], "block": "3-2-36eaed562e21"}, {"id": "3-2/31/text", "raw": "**各部の電圧・電流（分圧・分流）**：", "text": "各部の電圧・電流（分圧・分流）：", "terms": [], "block": "3-2-2c4751cdb8e3"}, {"id": "3-2/32/rows:0:0", "raw": "10Ωにかかる電圧", "text": "10Ωにかかる電圧", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:0:1", "raw": "3A×10Ω＝**30V**", "text": "3A×10Ω＝30V", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:1:0", "raw": "並列部分の電圧", "text": "並列部分の電圧", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:1:1", "raw": "90−30＝**60V**（両方の枝に共通）", "text": "90−30＝60V（両方の枝に共通）", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:2:0", "raw": "30Ωの枝の電流", "text": "30Ωの枝の電流", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:2:1", "raw": "60÷30＝**2A**", "text": "60÷30＝2A", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:3:0", "raw": "60Ωの枝の電流", "text": "60Ωの枝の電流", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/32/rows:3:1", "raw": "60÷60＝**1A**／2＋1＝3Aで全体と一致", "text": "60÷60＝1A／2＋1＝3Aで全体と一致", "terms": [], "block": "3-2-abcd45a59389"}, {"id": "3-2/35/text", "raw": "**分圧は「電圧を分ける」、分流は「電流を分ける」こと。** 分けるものが違います。直列では電圧、並列では電流に注目します。", "text": "分圧は「電圧を分ける」、分流は「電流を分ける」こと。 分けるものが違います。直列では電圧、並列では電流に注目します。", "terms": [], "block": "3-2-922cbfe6ffd9"}, {"id": "3-2/36/rows:0:0", "raw": "**直列：電圧が分かれる**", "text": "直列：電圧が分かれる", "terms": ["同じ電流"], "block": "3-2-bac658901a44"}, {"id": "3-2/36/rows:0:1", "raw": "同じ電流が通るので、抵抗が大きいほど電圧も大きい", "text": "同じ電流が通るので、抵抗が大きいほど電圧も大きい", "terms": ["同じ電流"], "block": "3-2-bac658901a44"}, {"id": "3-2/36/rows:1:0", "raw": "**並列：電流が分かれる**", "text": "並列：電流が分かれる", "terms": ["同じ電流"], "block": "3-2-bac658901a44"}, {"id": "3-2/36/rows:1:1", "raw": "同じ電圧がかかるので、抵抗が小さい枝ほど電流が大きい", "text": "同じ電圧がかかるので、抵抗が小さい枝ほど電流が大きい", "terms": ["同じ電流"], "block": "3-2-bac658901a44"}, {"id": "3-2/37/text", "raw": "**答えの点検：** 直列は各部分の電圧を足す、並列は枝の電流を足す。元の電源の値と合えば、計算の確かめになります。", "text": "答えの点検： 直列は各部分の電圧を足す、並列は枝の電流を足す。元の電源の値と合えば、計算の確かめになります。", "terms": [], "block": "3-2-9e718fcf3585"}, {"id": "3-2/40/text", "raw": "**電力（W）は、電気エネルギーを使うペース。** ヒーターの500W・1,000Wは、その瞬間に使う電力です。同じ時間なら、1,000Wは500Wの2倍の電気エネルギーを使います。", "text": "電力（W）は、電気エネルギーを使うペース。 ヒーターの500W・1,000Wは、その瞬間に使う電力です。同じ時間なら、1,000Wは500Wの2倍の電気エネルギーを使います。", "terms": ["電力"], "block": "3-2-a9a4b7d0ec9d"}, {"id": "3-2/41/text", "raw": "**電力量（Wh）は、使った電気エネルギーの合計。** 図の左と中央は時間が同じで、電力が2倍なら電力量も2倍。左と右は電力が同じで、時間が2倍なら電力量も2倍です。", "text": "電力量（Wh）は、使った電気エネルギーの合計。 図の左と中央は時間が同じで、電力が2倍なら電力量も2倍。左と右は電力が同じで、時間が2倍なら電力量も2倍です。", "terms": ["電力量"], "block": "3-2-1203837beb66"}, {"id": "3-2/42/text", "raw": "**電力量＝電力×時間。** W×時間（h）ならWh、kW×時間（h）ならkWhになります。", "text": "電力量＝電力×時間。 W×時間（h）ならWh、kW×時間（h）ならkWhになります。", "terms": ["電力×時間"], "block": "3-2-c1bde65cf00a"}, {"id": "3-2/43/text", "raw": "**500Wを2時間**使うと1,000Wh＝**1kWh**。**1,000Wを1時間**使う場合と、使った電気の合計は同じです。", "text": "500Wを2時間使うと1,000Wh＝1kWh。1,000Wを1時間使う場合と、使った電気の合計は同じです。", "terms": [], "block": "3-2-b1a5c834369f"}, {"id": "3-2/44/text", "raw": "**電力P＝電圧V×電流I。** 抵抗で消費される電力は、**P＝I²R＝V²/R**とも表せます。", "text": "電力P＝電圧V×電流I。 抵抗で消費される電力は、P＝I²R＝V²/Rとも表せます。", "terms": ["電圧V×電流I"], "block": "3-2-3d72bbc539fb"}, {"id": "3-2/45/text", "raw": "**例題5：** 抵抗負荷に100Vを加え、2A流れると、電力は100×2＝**200W**。これを3時間使うと、200×3＝**600Wh（0.6kWh）**です。", "text": "例題5： 抵抗負荷に100Vを加え、2A流れると、電力は100×2＝200W。これを3時間使うと、200×3＝600Wh（0.6kWh）です。", "terms": [], "block": "3-2-7de404afa85e"}, {"id": "3-2/48/text", "raw": "トースターや電気ストーブは、電流を流して発熱線を温めます。**抵抗に電流が流れて生じる熱がジュール熱** です。モーターの巻線にも抵抗があるため、回転に使われるエネルギーの一部は熱になります。", "text": "トースターや電気ストーブは、電流を流して発熱線を温めます。抵抗に電流が流れて生じる熱がジュール熱 です。モーターの巻線にも抵抗があるため、回転に使われるエネルギーの一部は熱になります。", "terms": ["ジュール熱"], "block": "3-2-60bb5c675b70"}, {"id": "3-2/49/text", "raw": "**ジュール熱：Q＝I²Rt。** 時間tを秒で入れると、熱量QはJ（ジュール）になります。同じ抵抗・同じ時間なら、電流2倍で熱量は**4倍**。電流が増えると発熱が急に増える理由です。", "text": "ジュール熱：Q＝I²Rt。 時間tを秒で入れると、熱量QはJ（ジュール）になります。同じ抵抗・同じ時間なら、電流2倍で熱量は4倍。電流が増えると発熱が急に増える理由です。", "terms": ["I²Rt"], "block": "3-2-6f9d787a7668"}, {"id": "3-2/50/text", "raw": "交流の電動機では、電力を求めるときに**力率**も考えます。巻線の抵抗で生じるジュール熱は、電動機の損失の一つで、**銅損（どうそん）**と呼びます。", "text": "交流の電動機では、電力を求めるときに力率も考えます。巻線の抵抗で生じるジュール熱は、電動機の損失の一つで、銅損（どうそん）と呼びます。", "terms": [], "block": "3-2-7f45fe250a6a"}, {"id": "3-2/52/text", "raw": "数が大きすぎたり小さすぎたりするとき、単位の前に記号を付けて表します。", "text": "数が大きすぎたり小さすぎたりするとき、単位の前に記号を付けて表します。", "terms": [], "block": "3-2-edf66ba8e0d7"}, {"id": "3-2/53/rows:0:0", "raw": "M（メガ）", "text": "M（メガ）", "terms": [], "block": "3-2-4639e0100101"}, {"id": "3-2/53/rows:0:1", "raw": "100万倍：1MΩ＝1,000,000Ω", "text": "100万倍：1MΩ＝1,000,000Ω", "terms": [], "block": "3-2-4639e0100101"}, {"id": "3-2/53/rows:1:0", "raw": "k（キロ）", "text": "k（キロ）", "terms": [], "block": "3-2-4639e0100101"}, {"id": "3-2/53/rows:1:1", "raw": "1,000倍：1kV＝1,000V、1kW＝1,000W", "text": "1,000倍：1kV＝1,000V、1kW＝1,000W", "terms": [], "block": "3-2-4639e0100101"}, {"id": "3-2/53/rows:2:0", "raw": "m（ミリ）", "text": "m（ミリ）", "terms": [], "block": "3-2-4639e0100101"}, {"id": "3-2/53/rows:2:1", "raw": "1,000分の1：1A＝1,000mA", "text": "1,000分の1：1A＝1,000mA", "terms": [], "block": "3-2-4639e0100101"}], "candidates": [{"id": "3-2/2/text#75", "fieldID": "3-2/2/text", "block": "3-2-cd1405b46f31", "answer": "オームの法則", "category": "key", "prompt": "［用語？］", "start": 75, "end": 81, "context": "この節では、温度などの条件が一定の抵抗回路を考えます。同じ抵抗なら電圧を2倍にすると電流も2倍。同じ電圧なら抵抗を2倍にすると電流は半分。 この関係がオームの法則です。", "start16": 75, "end16": 81}, {"id": "3-2/3/text#2", "fieldID": "3-2/3/text", "block": "3-2-7c44a436dc54", "answer": "V÷R", "category": "key", "prompt": "［式？］", "start": 2, "end": 5, "context": "I＝V÷R　／　V＝I×R　／　R＝V÷I", "start16": 2, "end16": 5}, {"id": "3-2/11/text#3", "fieldID": "3-2/11/text", "block": "3-2-591faae3ba11", "answer": "合成抵抗", "category": "key", "prompt": "［用語？］", "start": 3, "end": 7, "context": "直列の合成抵抗：R＝R₁＋R₂。 一列につながる抵抗を足します。20Ωと30Ωなら、20＋30＝50Ωです。", "start16": 3, "end16": 7}, {"id": "3-2/11/text#10", "fieldID": "3-2/11/text", "block": "3-2-591faae3ba11", "answer": "R₁＋R₂", "category": "key", "prompt": "［式？］", "start": 10, "end": 15, "context": "直列の合成抵抗：R＝R₁＋R₂。 一列につながる抵抗を足します。20Ωと30Ωなら、20＋30＝50Ωです。", "start16": 10, "end16": 15}, {"id": "3-2/15/text#12", "fieldID": "3-2/15/text", "block": "3-2-87f7f4e3e2ec", "answer": "1/R₁＋1/R₂", "category": "key", "prompt": "［式？］", "start": 12, "end": 21, "context": "並列の合成抵抗：1/R＝1/R₁＋1/R₂。 逆数を足して、最後にもう一度ひっくり返します。", "start16": 12, "end16": 21}, {"id": "3-2/18/items:0#11", "fieldID": "3-2/18/items:0", "block": "3-2-2b9dc6f82b08", "answer": "電圧が同じ", "category": "key", "prompt": "［用語？］", "start": 11, "end": 16, "context": "並列では、各枝にかかる電圧が同じ。", "start16": 11, "end16": 16}, {"id": "3-2/19/text#13", "fieldID": "3-2/19/text", "block": "3-2-2e8696702bee", "answer": "R₁×R₂÷（R₁＋R₂）", "category": "key", "prompt": "［式？］", "start": 13, "end": 26, "context": "抵抗が2個の並列なら、R＝R₁×R₂÷（R₁＋R₂）でも計算できます。30×60÷（30＋60）＝20Ω。同じ値R₀が2個なら、R₀÷2です。", "start16": 13, "end16": 26}, {"id": "3-2/36/rows:0:1#0", "fieldID": "3-2/36/rows:0:1", "block": "3-2-bac658901a44", "answer": "同じ電流", "category": "key", "prompt": "［用語？］", "start": 0, "end": 4, "context": "同じ電流が通るので、抵抗が大きいほど電圧も大きい", "start16": 0, "end16": 4}, {"id": "3-2/40/text#0", "fieldID": "3-2/40/text", "block": "3-2-a9a4b7d0ec9d", "answer": "電力", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "電力（W）は、電気エネルギーを使うペース。 ヒーターの500W・1,000Wは、その瞬間に使う電力です。同じ時間なら、1,000Wは500Wの2倍の電気エネルギーを使います。", "start16": 0, "end16": 2}, {"id": "3-2/41/text#0", "fieldID": "3-2/41/text", "block": "3-2-1203837beb66", "answer": "電力量", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "電力量（Wh）は、使った電気エネルギーの合計。 図の左と中央は時間が同じで、電力が2倍なら電力量も2倍。左と右は電力が同じで、時間が2倍なら電力量も2倍です。", "start16": 0, "end16": 3}, {"id": "3-2/42/text#4", "fieldID": "3-2/42/text", "block": "3-2-c1bde65cf00a", "answer": "電力×時間", "category": "key", "prompt": "［式？］", "start": 4, "end": 9, "context": "電力量＝電力×時間。 W×時間（h）ならWh、kW×時間（h）ならkWhになります。", "start16": 4, "end16": 9}, {"id": "3-2/44/text#4", "fieldID": "3-2/44/text", "block": "3-2-3d72bbc539fb", "answer": "電圧V×電流I", "category": "key", "prompt": "［式？］", "start": 4, "end": 11, "context": "電力P＝電圧V×電流I。 抵抗で消費される電力は、P＝I²R＝V²/Rとも表せます。", "start16": 4, "end16": 11}, {"id": "3-2/48/text#43", "fieldID": "3-2/48/text", "block": "3-2-60bb5c675b70", "answer": "ジュール熱", "category": "key", "prompt": "［用語？］", "start": 43, "end": 48, "context": "トースターや電気ストーブは、電流を流して発熱線を温めます。抵抗に電流が流れて生じる熱がジュール熱 です。モーターの巻線にも抵抗があるため、回転に使われるエネルギーの一部は熱になります。", "start16": 43, "end16": 48}, {"id": "3-2/49/text#8", "fieldID": "3-2/49/text", "block": "3-2-6f9d787a7668", "answer": "I²Rt", "category": "key", "prompt": "［式？］", "start": 8, "end": 12, "context": "ジュール熱：Q＝I²Rt。 時間tを秒で入れると、熱量QはJ（ジュール）になります。同じ抵抗・同じ時間なら、電流2倍で熱量は4倍。電流が増えると発熱が急に増える理由です。", "start16": 8, "end16": 12}], "rounds": {"all": [["3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0"], ["3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75"], ["3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0"], ["3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4"], ["3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0"], ["3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/te /41/text#0", "3-2/2/text#75", "3-2/40/text#0"], ["3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4"], ["3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0"], ["3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12"], ["3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13"], ["3-2/11/text#10", "3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2"], ["3-2/18/items:0#11", "3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4"], ["3-2/41/text#0", "3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3"], ["3-2/2/text#75", "3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8"], ["3-2/40/text#0", "3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43"], ["3-2/44/text#4", "3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10"], ["3-2/36/rows:0:1#0", "3-2/15/text#12", "3-2/19/text#13", "3-2/3/text#2", "3-2/42/text#4", "3-2/11/text#3", "3-2/49/text#8", "3-2/48/text#43", "3-2/11/text#10", "3-2/18/items:0#11"]], "num": [[]]}}, {"id": "3-3", "title": "クレーンを回す電動機（モーター）", "blocks": [{"type": "p", "style": "lead", "text": "電動機（モーター）は、**電気の力を回転に変える機械**。回る仕組みをつかんでから、種類の違いを見ます。", "id": "3-3-4ca7f4be24c5"}, {"type": "sub", "text": "電動機とは", "id": "3-3-8678b064ea8f"}, {"type": "img", "asset": "3-3_motor_jobs_daily", "caption": "モーターの回転を、巻上げや移動へ伝える模式図。青は回転、赤は荷や台車の動く向き。伝動の細部は省略。", "id": "3-3-603a4bf15e26", "style": "figure", "_previewFile": "3-3_motor_jobs_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**電動機（モーター）は、電気で軸を回し、機械を動かす装置** です。巻上げでは軸の回転を歯車などでドラムへ伝え、ロープを巻いて荷を上げます。走行・横行では車輪を回してクレーンやトロリを移動させます。モーターは、こうした動きを生む「回す役」です。", "id": "3-3-dd87459eac09"}, {"type": "p", "text": "クレーンでは、**巻上げ・横行・走行などの動作ごとに電動機**を設けます。始動・停止・逆転が多く、負荷の変化にも対応する必要があります。", "id": "3-3-4f2d34f4561e"}, {"type": "sub", "id": "lesson-motor-efficiency", "text": "効率――入れた電力の、何割が軸に出る？"}, {"type": "p", "text": "入力はモーターへ入る電力、出力は軸から取り出す仕事のペース（単位時間あたりの仕事）です。**効率＝出力÷入力×100％**。入力の一部は熱などの損失になります。", "id": "3-3-56dd57dfb189"}, {"type": "p", "text": "入力8kW、効率75％なら、出力は8×0.75＝**6kW**。残りの8−6＝**2kW**が損失です。", "id": "3-3-084c262199bf"}, {"id": "3-3-rev26-motor-efficiency", "type": "svg", "file": "3-3_motor_efficiency_20261106.svg", "caption": "入る8kWのうち、軸の仕事は6kW、熱などの損失は2kW。効率は6÷8＝75％。", "style": "figure", "_previewFile": "3-3_motor_efficiency_20261106.svg"}, {"type": "sub", "text": "回転子はなぜ回る？ まず、磁石と円板で考える", "id": "3-3-1ceaa4dca2a6"}, {"type": "img", "asset": "3-3_arago_rotor_daily", "caption": "アラゴの円板の模式図。磁石は円板に触れず、ふちに沿って動く。円板は磁石と同じ方向に、少し遅れて回る。", "id": "3-3-d107fb8d0d98", "style": "figure", "_previewFile": "3-3_arago_rotor_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "自由に回る金属円板のふちで、磁石を触れないように動かします。すると **円板も、磁石を追いかけるように回ります**。手や歯車で円板を直接動かしているわけではありません。", "id": "3-3-d69f25c33b22"}, {"type": "p", "text": "**磁界（じかい）** は、磁石の力が働く周りの空間です。磁石と円板の位置関係が変わると、円板に電流が生じます。これが **誘導電流**。この電流と磁界の作用で、円板を回す力が生まれます。「誘導」は、ここでは磁界との関係が変わって電流が生じることを表します。", "id": "3-3-52bc7681a1bb"}, {"type": "p", "text": "**モーターでは「磁石を手で回す」代わりに、三相交流で磁界を回します。** 外側の固定子は動かず、内側の回転子が回ります。円板が追いかけた相手にあたるのが回転磁界、円板にあたるのが回転子です。", "id": "3-3-cf2fb5ece376", "quizTerms": ["回転磁界"]}, {"type": "sub", "id": "lesson-induction-coil", "text": "電磁誘導――変化が電圧を生む"}, {"type": "p", "text": "**コイルを貫く磁束が変化すると、起電力（電流を流そうとする電圧）が生じます。** これが電磁誘導です。回路が閉じていれば、その起電力によって電流が流れます。", "id": "3-3-2bc4e40430eb", "quizTerms": ["電磁誘導"]}, {"type": "p", "text": "磁石が近くにあっても、磁束が変わらない状態だけで誘導起電力が続くわけではありません。また、同じ巻き方のコイルでは **流す電流を逆にするとN極・S極も逆** になります。", "id": "3-3-a6501953cc8f"}, {"type": "sub", "text": "クレーンの主役は「三相誘導電動機」", "id": "3-3-64b59eefcd5d"}, {"type": "p", "text": "交流電動機にはいくつか種類がありますが、**クレーンでは特殊な場合を除き「三相誘導電動機」**が使われます。これが本章の主役です。", "id": "3-3-68a77d03d147", "quizTerms": ["三相誘導電動機"]}, {"type": "p", "text": "**かご形・巻線形は、どちらも機械を動かすモーターの種類** です。荷を上げたり、車輪を回したりする目的は共通です。違うのは、内側の回る部分である **回転子** の作りと、始動や速さの調整の仕方です。", "id": "3-3-2ef80e4ab48e"}, {"id": "3-3-026d3c940a80", "type": "table", "headers": ["部品の名前", "位置と働き"], "rows": [["**固定子＝一次側**", "外側の動かない部分。巻線に交流を流して**回転する磁界**を作る"], ["**回転子＝二次側**", "内側の回る部分。誘導電流と磁界の働きで回り、軸へ力を伝える"]], "quizTerms": ["固定子", "回転子"]}, {"type": "p", "text": "**巻線（コイル）** は、電線を何回も巻いたものです。電流を流すと磁界ができます。三相交流でその磁界の向きを順番に変え、回る磁界を作ります。**トルク** は、軸を回そうとする力の働き。ドアを取っ手で押して回す感覚に似ています。", "id": "3-3-19478e7dee7e"}, {"type": "sub", "text": "同期速度――回転磁界の速さ", "id": "3-3-e8caae223e3e"}, {"type": "img", "asset": "3-3_sync_fan_daily", "caption": "4極の誘導電動機で羽根を回すモデル。数値は回転磁界の速さ（同期速度）で、羽根の実際の回転数ではない。波は同じ時間で周波数を比べる模式図。", "id": "3-3-90c38e6a7608", "style": "figure", "_previewFile": "3-3_sync_fan_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "扇風機のように、モーターの軸が羽根を回す場面を考えます。**同じ4極なら、周波数を30Hzから60Hzへ2倍にすると、回転子が追いかける磁界の速さも2倍**。この「追いかける相手の速さ」が同期速度です。", "id": "3-3-271436ea8756", "quizTerms": ["同期速度", "周波数"]}, {"type": "p", "text": "**同期速度** は、回転子が追いかける **回転磁界の速さ** です。**極数** は、磁界をつくるN極・S極の総数。NとSが1組なら2極、2組なら4極です。**rpm** は「1分間に何回転するか」の単位です。", "id": "3-3-22149bf96844"}, {"type": "p", "text": "**同期速度〔rpm〕＝120×周波数〔Hz〕÷極数**", "emphasis": true, "id": "3-3-06ab0cf6575c"}, {"id": "3-3-d0376735e51d", "type": "table", "headers": ["60Hzの例", "同期速度＝120×周波数÷極数"], "rows": [["**4極**", "120×60÷4＝**1,800rpm**"], ["2極", "**3,600rpm**"], ["6極", "**1,200rpm**／極数が多いほど遅い"]], "quizTerms": ["極数"]}, {"type": "sub", "text": "すべり――回転子は同期速度より少し遅れる", "id": "3-3-a669a783e29b"}, {"type": "img", "asset": "3-3_slip_train_daily", "caption": "同じ大きさの模型コースを同じ1分間で回る比較。青100周に対して赤98周なら、差2周を基準の100周で割って2％。", "id": "3-3-e7f4e6adfb98", "style": "figure", "_previewFile": "3-3_slip_train_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**すべりは、速さの差を「追いかける相手の速さ」で割った割合。** 図では100周に対して98周なので、(100−98)÷100×100＝**2％**。モーターでも、同期速度を基準にして同じように計算します。", "id": "3-3-e3afaf1b84e3", "quizTerms": ["すべり"]}, {"type": "p", "text": "負荷がかかった三相誘導電動機の回転子は、同期速度より**2〜5％ほど遅く**回ります。この遅れの割合が「すべり」。始動する直前は回転子が止まっているので、すべりは100％です。", "id": "3-3-f4d7ae1afc5d"}, {"type": "ul", "items": ["**例題7**：同期速度1,000rpmで、すべり2〜5％なら回転子の速さは？", "2％の遅れは1,000×0.02＝20rpm → 回転子は1,000−20＝**980rpm**。", "5％の遅れは1,000×0.05＝50rpm → 回転子は1,000−50＝**950rpm**。したがって **950〜980rpm**。"], "id": "3-3-f1e19c289086", "text": "**例題7：** 同期速度1,000rpmで、すべりが2〜5％。回転子は1,000×（1−0.02）〜1,000×（1−0.05）なので、**950〜980rpm**で回ります。"}, {"type": "p", "text": "模型の列車は、同じ時間の周回数から **速さの割合** をつかむためのたとえです。実際の誘導電動機では、回転磁界と回転子の速さの差によって電流が誘導され、回す力が生まれます。通常の電動機運転では、回転子が磁界より少し遅れて回ります。", "id": "3-3-8bd4142fa9a3"}, {"type": "sub", "text": "かご形・巻線形：どちらも回す役、回転子の作りが違う", "id": "3-3-92b8df3bec44"}, {"type": "p", "text": "**かご形** は、金属の棒を並べ、両端を金属の輪でつないだ回転子を使います。棒と輪が鳥かごのように見えるため、この名前です。磁界の変化で棒に電流が生じ、軸を回す力になります。構造が簡単で扱いやすく、インバーター（周波数や電圧を変える装置）で電気の周波数を変えれば速さも調整できます。", "id": "3-3-02900f99f481"}, {"type": "p", "text": "**巻線形** は、回転子にも電線を巻いたコイルを使います。そのコイルを外側の抵抗器（電流の通りにくさを持たせる部品）へつなぎ、回転子側の電流の流れ方を変えて、始動や速さを調整します。外側に「調整するためのつなぎ口」を持つモーター、と考えると入口をつかめます。", "id": "3-3-ae42f85d5672"}, {"type": "p", "text": "かご形は、巻線形に比べて**構造が簡単で扱いやすい**のが長所。従来は始動トルクが小さく速度調整範囲も狭いため小容量向けでしたが、**インバーター制御の進歩で比較的大容量にも使われます**。", "id": "3-3-48ed85639def"}, {"type": "p", "text": "構造図では、棒と輪でできた **かご形** と、コイルから外へつながる **巻線形** を見比べます。**スリップリング** は回転する導電性の輪、**ブラシ** はその輪に押し当てて電気を受け渡す接触部品です。掃除をするブラシではなく、電気の接続を保つ役です。", "id": "3-3-ec896f20b5f7"}, {"type": "table", "headers": ["種類", "構造・速度を変えるしくみ"], "rows": [["**かご形**", "回転子の導体バーを両端のリングでつなぐ。ブラシ・スリップリングがなく、構造が簡単。インバーターと組み合わせて広く速度制御できる。"], ["**巻線形**", "回転子の巻線を、スリップリングとブラシを通して外部の二次抵抗につなぐ。抵抗を変えて始動・速度を調整する。"]], "id": "3-3-4862eb6d409b", "quizTerms": ["かご形", "巻線形", "スリップリング", "ブラシ", "二次抵抗"]}, {"type": "img", "asset": "3-2_rotor_compare_panel21_1", "caption": "かご形回転子：導体バーの両端を短絡環で接続。ブラシ・スリップリングは使わない。", "id": "3-3-cc5fcce11282", "style": "figure", "_previewFile": "3-2_rotor_compare_panel21_1.png", "_width": 900, "_height": 880}, {"type": "img", "asset": "3-2_rotor_compare_panel21_2", "caption": "巻線形回転子：巻線をスリップリング・ブラシ経由で外部抵抗へ接続。交流電流は一定方向に流れ続けない。", "id": "3-3-b02a8c0c5480", "style": "figure", "_previewFile": "3-2_rotor_compare_panel21_2.png", "_width": 900, "_height": 860}, {"type": "p", "text": "**かご形も巻線形も、固定子側は巻線です。違うのは回転子の構造。** 外部抵抗へつなぐためのスリップリング・ブラシを持つのは巻線形です。", "id": "3-3-6481897cfa0e", "style": "tip"}, {"type": "sub", "text": "直流電動機", "id": "3-3-f923d74cfb1d"}, {"type": "p", "text": "直流電動機でも、電気で軸を回します。**界磁（かいじ）** は磁界をつくる役、**電機子（でんきし）** は電流と磁界の作用で回る役です。ここでは界磁巻線を使う構造を中心に学びます。", "id": "3-3-39cc171db7a3"}, {"id": "3-3-3b55d5a0893e", "type": "table", "headers": ["直流電動機の部品", "すること"], "rows": [["**界磁（固定子）**", "磁界を作る"], ["**電機子（回転子）**", "電流と磁界の働きで回転力を生む"], ["**整流子・ブラシ**", "回転中も電機子へ電流を届け、巻線の電流方向を切り替える"]], "quizTerms": ["電機子", "界磁", "整流子"]}, {"type": "img", "asset": "3-3_supplement_f36_20261023", "labels": [], "legend": [], "caption": "界磁が磁界を作り、電機子が回る。整流子とブラシが、回転する電機子へ電流を受け渡す。", "id": "3-3-dcb2512f760b", "style": "figure", "_previewFile": "3-3_supplement_f36_20261023.png", "_width": 1472, "_height": 1068}, {"type": "p", "text": "**なるほど：整流子は「回り続けるための切り替え役」。** ブラシと整流子が、回転に合わせて電機子巻線の電流の向きを切り替え、同じ回転方向の力を保ちます。", "id": "3-3-883e5fd93fa7"}, {"id": "3-3-rev26-dc-use", "type": "p", "text": "直流電動機は**精密な速度制御に優れ**、コンテナクレーンやアンローダに使われます。整流子・ブラシの保守が必要なため、近年は**インバーター制御のかご形**への置換えも進んでいます。"}, {"type": "sub", "id": "lesson-dc-series", "text": "直巻直流電動機――無負荷の高速回転に注意"}, {"type": "p", "text": "**直巻直流電動機** は、界磁巻線と電機子が直列につながる方式です。大きな始動トルクを得られる特徴があります。", "id": "3-3-38bf8a22073b", "quizTerms": ["直巻直流電動機"]}, {"type": "p", "text": "**負荷を外すと、回転速度が異常に高くなるおそれがあります。** 「負荷が軽いから安心して回せる」とは考えません。誘導電動機の同期速度の式を、そのまま直流電動機へ当てはめないことも大切です。", "id": "3-3-886d2042855e"}, {"id": "3-3-rev26-speed-slip-q", "type": "p", "text": "**確認：** 60Hz・4極、すべり5％。回転子の速さは？", "style": "question"}, {"id": "3-3-rev26-speed-slip-a", "type": "p", "text": "**1,710rpm。** 同期速度は120×60÷4＝1,800rpm。回転子は1,800×（1−0.05）＝1,710rpmです。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-3/3/text", "raw": "**電動機（モーター）は、電気で軸を回し、機械を動かす装置** です。巻上げでは軸の回転を歯車などでドラムへ伝え、ロープを巻いて荷を上げます。走行・横行では車輪を回してクレーンやトロリを移動させます。モーターは、こうした動きを生む「回す役」です。", "text": "電動機（モーター）は、電気で軸を回し、機械を動かす装置 です。巻上げでは軸の回転を歯車などでドラムへ伝え、ロープを巻いて荷を上げます。走行・横行では車輪を回してクレーンやトロリを移動させます。モーターは、こうした動きを生む「回す役」です。", "terms": [], "block": "3-3-dd87459eac09"}, {"id": "3-3/4/text", "raw": "クレーンでは、**巻上げ・横行・走行などの動作ごとに電動機**を設けます。始動・停止・逆転が多く、負荷の変化にも対応する必要があります。", "text": "クレーンでは、巻上げ・横行・走行などの動作ごとに電動機を設けます。始動・停止・逆転が多く、負荷の変化にも対応する必要があります。", "terms": [], "block": "3-3-4f2d34f4561e"}, {"id": "3-3/6/text", "raw": "入力はモーターへ入る電力、出力は軸から取り出す仕事のペース（単位時間あたりの仕事）です。**効率＝出力÷入力×100％**。入力の一部は熱などの損失になります。", "text": "入力はモーターへ入る電力、出力は軸から取り出す仕事のペース（単位時間あたりの仕事）です。効率＝出力÷入力×100％。入力の一部は熱などの損失になります。", "terms": [], "block": "3-3-56dd57dfb189"}, {"id": "3-3/7/text", "raw": "入力8kW、効率75％なら、出力は8×0.75＝**6kW**。残りの8−6＝**2kW**が損失です。", "text": "入力8kW、効率75％なら、出力は8×0.75＝6kW。残りの8−6＝2kWが損失です。", "terms": [], "block": "3-3-084c262199bf"}, {"id": "3-3/11/text", "raw": "自由に回る金属円板のふちで、磁石を触れないように動かします。すると **円板も、磁石を追いかけるように回ります**。手や歯車で円板を直接動かしているわけではありません。", "text": "自由に回る金属円板のふちで、磁石を触れないように動かします。すると 円板も、磁石を追いかけるように回ります。手や歯車で円板を直接動かしているわけではありません。", "terms": [], "block": "3-3-d69f25c33b22"}, {"id": "3-3/12/text", "raw": "**磁界（じかい）** は、磁石の力が働く周りの空間です。磁石と円板の位置関係が変わると、円板に電流が生じます。これが **誘導電流**。この電流と磁界の作用で、円板を回す力が生まれます。「誘導」は、ここでは磁界との関係が変わって電流が生じることを表します。", "text": "磁界（じかい） は、磁石の力が働く周りの空間です。磁石と円板の位置関係が変わると、円板に電流が生じます。これが 誘導電流。この電流と磁界の作用で、円板を回す力が生まれます。「誘導」は、ここでは磁界との関係が変わって電流が生じることを表します。", "terms": [], "block": "3-3-52bc7681a1bb"}, {"id": "3-3/13/text", "raw": "**モーターでは「磁石を手で回す」代わりに、三相交流で磁界を回します。** 外側の固定子は動かず、内側の回転子が回ります。円板が追いかけた相手にあたるのが回転磁界、円板にあたるのが回転子です。", "text": "モーターでは「磁石を手で回す」代わりに、三相交流で磁界を回します。 外側の固定子は動かず、内側の回転子が回ります。円板が追いかけた相手にあたるのが回転磁界、円板にあたるのが回転子です。", "terms": ["回転磁界"], "block": "3-3-cf2fb5ece376"}, {"id": "3-3/15/text", "raw": "**コイルを貫く磁束が変化すると、起電力（電流を流そうとする電圧）が生じます。** これが電磁誘導です。回路が閉じていれば、その起電力によって電流が流れます。", "text": "コイルを貫く磁束が変化すると、起電力（電流を流そうとする電圧）が生じます。 これが電磁誘導です。回路が閉じていれば、その起電力によって電流が流れます。", "terms": ["電磁誘導"], "block": "3-3-2bc4e40430eb"}, {"id": "3-3/16/text", "raw": "磁石が近くにあっても、磁束が変わらない状態だけで誘導起電力が続くわけではありません。また、同じ巻き方のコイルでは **流す電流を逆にするとN極・S極も逆** になります。", "text": "磁石が近くにあっても、磁束が変わらない状態だけで誘導起電力が続くわけではありません。また、同じ巻き方のコイルでは 流す電流を逆にするとN極・S極も逆 になります。", "terms": [], "block": "3-3-a6501953cc8f"}, {"id": "3-3/18/text", "raw": "交流電動機にはいくつか種類がありますが、**クレーンでは特殊な場合を除き「三相誘導電動機」**が使われます。これが本章の主役です。", "text": "交流電動機にはいくつか種類がありますが、クレーンでは特殊な場合を除き「三相誘導電動機」が使われます。これが本章の主役です。", "terms": ["三相誘導電動機"], "block": "3-3-68a77d03d147"}, {"id": "3-3/19/text", "raw": "**かご形・巻線形は、どちらも機械を動かすモーターの種類** です。荷を上げたり、車輪を回したりする目的は共通です。違うのは、内側の回る部分である **回転子** の作りと、始動や速さの調整の仕方です。", "text": "かご形・巻線形は、どちらも機械を動かすモーターの種類 です。荷を上げたり、車輪を回したりする目的は共通です。違うのは、内側の回る部分である 回転子 の作りと、始動や速さの調整の仕方です。", "terms": [], "block": "3-3-2ef80e4ab48e"}, {"id": "3-3/20/rows:0:0", "raw": "**固定子＝一次側**", "text": "固定子＝一次側", "terms": ["固定子", "回転子"], "block": "3-3-026d3c940a80"}, {"id": "3-3/20/rows:0:1", "raw": "外側の動かない部分。巻線に交流を流して**回転する磁界**を作る", "text": "外側の動かない部分。巻線に交流を流して回転する磁界を作る", "terms": ["固定子", "回転子"], "block": "3-3-026d3c940a80"}, {"id": "3-3/20/rows:1:0", "raw": "**回転子＝二次側**", "text": "回転子＝二次側", "terms": ["固定子", "回転子"], "block": "3-3-026d3c940a80"}, {"id": "3-3/20/rows:1:1", "raw": "内側の回る部分。誘導電流と磁界の働きで回り、軸へ力を伝える", "text": "内側の回る部分。誘導電流と磁界の働きで回り、軸へ力を伝える", "terms": ["固定子", "回転子"], "block": "3-3-026d3c940a80"}, {"id": "3-3/21/text", "raw": "**巻線（コイル）** は、電線を何回も巻いたものです。電流を流すと磁界ができます。三相交流でその磁界の向きを順番に変え、回る磁界を作ります。**トルク** は、軸を回そうとする力の働き。ドアを取っ手で押して回す感覚に似ています。", "text": "巻線（コイル） は、電線を何回も巻いたものです。電流を流すと磁界ができます。三相交流でその磁界の向きを順番に変え、回る磁界を作ります。トルク は、軸を回そうとする力の働き。ドアを取っ手で押して回す感覚に似ています。", "terms": [], "block": "3-3-19478e7dee7e"}, {"id": "3-3/24/text", "raw": "扇風機のように、モーターの軸が羽根を回す場面を考えます。**同じ4極なら、周波数を30Hzから60Hzへ2倍にすると、回転子が追いかける磁界の速さも2倍**。この「追いかける相手の速さ」が同期速度です。", "text": "扇風機のように、モーターの軸が羽根を回す場面を考えます。同じ4極なら、周波数を30Hzから60Hzへ2倍にすると、回転子が追いかける磁界の速さも2倍。この「追いかける相手の速さ」が同期速度です。", "terms": ["同期速度", "周波数"], "block": "3-3-271436ea8756"}, {"id": "3-3/25/text", "raw": "**同期速度** は、回転子が追いかける **回転磁界の速さ** です。**極数** は、磁界をつくるN極・S極の総数。NとSが1組なら2極、2組なら4極です。**rpm** は「1分間に何回転するか」の単位です。", "text": "同期速度 は、回転子が追いかける 回転磁界の速さ です。極数 は、磁界をつくるN極・S極の総数。NとSが1組なら2極、2組なら4極です。rpm は「1分間に何回転するか」の単位です。", "terms": [], "block": "3-3-22149bf96844"}, {"id": "3-3/26/text", "raw": "**同期速度〔rpm〕＝120×周波数〔Hz〕÷極数**", "text": "同期速度〔rpm〕＝120×周波数〔Hz〕÷極数", "terms": [], "block": "3-3-06ab0cf6575c"}, {"id": "3-3/27/rows:0:0", "raw": "**4極**", "text": "4極", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/27/rows:0:1", "raw": "120×60÷4＝**1,800rpm**", "text": "120×60÷4＝1,800rpm", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/27/rows:1:0", "raw": "2極", "text": "2極", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/27/rows:1:1", "raw": "**3,600rpm**", "text": "3,600rpm", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/27/rows:2:0", "raw": "6極", "text": "6極", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/27/rows:2:1", "raw": "**1,200rpm**／極数が多いほど遅い", "text": "1,200rpm／極数が多いほど遅い", "terms": ["極数"], "block": "3-3-d0376735e51d"}, {"id": "3-3/30/text", "raw": "**すべりは、速さの差を「追いかける相手の速さ」で割った割合。** 図では100周に対して98周なので、(100−98)÷100×100＝**2％**。モーターでも、同期速度を基準にして同じように計算します。", "text": "すべりは、速さの差を「追いかける相手の速さ」で割った割合。 図では100周に対して98周なので、(100−98)÷100×100＝2％。モーターでも、同期速度を基準にして同じように計算します。", "terms": ["すべり"], "block": "3-3-e3afaf1b84e3"}, {"id": "3-3/31/text", "raw": "負荷がかかった三相誘導電動機の回転子は、同期速度より**2〜5％ほど遅く**回ります。この遅れの割合が「すべり」。始動する直前は回転子が止まっているので、すべりは100％です。", "text": "負荷がかかった三相誘導電動機の回転子は、同期速度より2〜5％ほど遅く回ります。この遅れの割合が「すべり」。始動する直前は回転子が止まっているので、すべりは100％です。", "terms": [], "block": "3-3-f4d7ae1afc5d"}, {"id": "3-3/32/items:0", "raw": "**例題7**：同期速度1,000rpmで、すべり2〜5％なら回転子の速さは？", "text": "例題7：同期速度1,000rpmで、すべり2〜5％なら回転子の速さは？", "terms": [], "block": "3-3-f1e19c289086"}, {"id": "3-3/32/items:1", "raw": "2％の遅れは1,000×0.02＝20rpm → 回転子は1,000−20＝**980rpm**。", "text": "2％の遅れは1,000×0.02＝20rpm → 回転子は1,000−20＝980rpm。", "terms": [], "block": "3-3-f1e19c289086"}, {"id": "3-3/32/items:2", "raw": "5％の遅れは1,000×0.05＝50rpm → 回転子は1,000−50＝**950rpm**。したがって **950〜980rpm**。", "text": "5％の遅れは1,000×0.05＝50rpm → 回転子は1,000−50＝950rpm。したがって 950〜980rpm。", "terms": [], "block": "3-3-f1e19c289086"}, {"id": "3-3/33/text", "raw": "模型の列車は、同じ時間の周回数から **速さの割合** をつかむためのたとえです。実際の誘導電動機では、回転磁界と回転子の速さの差によって電流が誘導され、回す力が生まれます。通常の電動機運転では、回転子が磁界より少し遅れて回ります。", "text": "模型の列車は、同じ時間の周回数から 速さの割合 をつかむためのたとえです。実際の誘導電動機では、回転磁界と回転子の速さの差によって電流が誘導され、回す力が生まれます。通常の電動機運転では、回転子が磁界より少し遅れて回ります。", "terms": [], "block": "3-3-8bd4142fa9a3"}, {"id": "3-3/35/text", "raw": "**かご形** は、金属の棒を並べ、両端を金属の輪でつないだ回転子を使います。棒と輪が鳥かごのように見えるため、この名前です。磁界の変化で棒に電流が生じ、軸を回す力になります。構造が簡単で扱いやすく、インバーター（周波数や電圧を変える装置）で電気の周波数を変えれば速さも調整できます。", "text": "かご形 は、金属の棒を並べ、両端を金属の輪でつないだ回転子を使います。棒と輪が鳥かごのように見えるため、この名前です。磁界の変化で棒に電流が生じ、軸を回す力になります。構造が簡単で扱いやすく、インバーター（周波数や電圧を変える装置）で電気の周波数を変えれば速さも調整できます。", "terms": [], "block": "3-3-02900f99f481"}, {"id": "3-3/36/text", "raw": "**巻線形** は、回転子にも電線を巻いたコイルを使います。そのコイルを外側の抵抗器（電流の通りにくさを持たせる部品）へつなぎ、回転子側の電流の流れ方を変えて、始動や速さを調整します。外側に「調整するためのつなぎ口」を持つモーター、と考えると入口をつかめます。", "text": "巻線形 は、回転子にも電線を巻いたコイルを使います。そのコイルを外側の抵抗器（電流の通りにくさを持たせる部品）へつなぎ、回転子側の電流の流れ方を変えて、始動や速さを調整します。外側に「調整するためのつなぎ口」を持つモーター、と考えると入口をつかめます。", "terms": [], "block": "3-3-ae42f85d5672"}, {"id": "3-3/37/text", "raw": "かご形は、巻線形に比べて**構造が簡単で扱いやすい**のが長所。従来は始動トルクが小さく速度調整範囲も狭いため小容量向けでしたが、**インバーター制御の進歩で比較的大容量にも使われます**。", "text": "かご形は、巻線形に比べて構造が簡単で扱いやすいのが長所。従来は始動トルクが小さく速度調整範囲も狭いため小容量向けでしたが、インバーター制御の進歩で比較的大容量にも使われます。", "terms": [], "block": "3-3-48ed85639def"}, {"id": "3-3/38/text", "raw": "構造図では、棒と輪でできた **かご形** と、コイルから外へつながる **巻線形** を見比べます。**スリップリング** は回転する導電性の輪、**ブラシ** はその輪に押し当てて電気を受け渡す接触部品です。掃除をするブラシではなく、電気の接続を保つ役です。", "text": "構造図では、棒と輪でできた かご形 と、コイルから外へつながる 巻線形 を見比べます。スリップリング は回転する導電性の輪、ブラシ はその輪に押し当てて電気を受け渡す接触部品です。掃除をするブラシではなく、電気の接続を保つ役です。", "terms": [], "block": "3-3-ec896f20b5f7"}, {"id": "3-3/39/rows:0:0", "raw": "**かご形**", "text": "かご形", "terms": ["かご形", "巻線形", "スリップリング", "ブラシ", "二次抵抗"], "block": "3-3-4862eb6d409b"}, {"id": "3-3/39/rows:0:1", "raw": "回転子の導体バーを両端のリングでつなぐ。ブラシ・スリップリングがなく、構造が簡単。インバーターと組み合わせて広く速度制御できる。", "text": "回転子の導体バーを両端のリングでつなぐ。ブラシ・スリップリングがなく、構造が簡単。インバーターと組み合わせて広く速度制御できる。", "terms": ["かご形", "巻線形", "スリップリング", "ブラシ", "二次抵抗"], "block": "3-3-4862eb6d409b"}, {"id": "3-3/39/rows:1:0", "raw": "**巻線形**", "text": "巻線形", "terms": ["かご形", "巻線形", "スリップリング", "ブラシ", "二次抵抗"], "block": "3-3-4862eb6d409b"}, {"id": "3-3/39/rows:1:1", "raw": "回転子の巻線を、スリップリングとブラシを通して外部の二次抵抗につなぐ。抵抗を変えて始動・速度を調整する。", "text": "回転子の巻線を、スリップリングとブラシを通して外部の二次抵抗につなぐ。抵抗を変えて始動・速度を調整する。", "terms": ["かご形", "巻線形", "スリップリング", "ブラシ", "二次抵抗"], "block": "3-3-4862eb6d409b"}, {"id": "3-3/42/text", "raw": "**かご形も巻線形も、固定子側は巻線です。違うのは回転子の構造。** 外部抵抗へつなぐためのスリップリング・ブラシを持つのは巻線形です。", "text": "かご形も巻線形も、固定子側は巻線です。違うのは回転子の構造。 外部抵抗へつなぐためのスリップリング・ブラシを持つのは巻線形です。", "terms": [], "block": "3-3-6481897cfa0e"}, {"id": "3-3/44/text", "raw": "直流電動機でも、電気で軸を回します。**界磁（かいじ）** は磁界をつくる役、**電機子（でんきし）** は電流と磁界の作用で回る役です。ここでは界磁巻線を使う構造を中心に学びます。", "text": "直流電動機でも、電気で軸を回します。界磁（かいじ） は磁界をつくる役、電機子（でんきし） は電流と磁界の作用で回る役です。ここでは界磁巻線を使う構造を中心に学びます。", "terms": [], "block": "3-3-39cc171db7a3"}, {"id": "3-3/45/rows:0:0", "raw": "**界磁（固定子）**", "text": "界磁（固定子）", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/45/rows:0:1", "raw": "磁界を作る", "text": "磁界を作る", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/45/rows:1:0", "raw": "**電機子（回転子）**", "text": "電機子（回転子）", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/45/rows:1:1", "raw": "電流と磁界の働きで回転力を生む", "text": "電流と磁界の働きで回転力を生む", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/45/rows:2:0", "raw": "**整流子・ブラシ**", "text": "整流子・ブラシ", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/45/rows:2:1", "raw": "回転中も電機子へ電流を届け、巻線の電流方向を切り替える", "text": "回転中も電機子へ電流を届け、巻線の電流方向を切り替える", "terms": ["電機子", "界磁", "整流子"], "block": "3-3-3b55d5a0893e"}, {"id": "3-3/47/text", "raw": "**なるほど：整流子は「回り続けるための切り替え役」。** ブラシと整流子が、回転に合わせて電機子巻線の電流の向きを切り替え、同じ回転方向の力を保ちます。", "text": "なるほど：整流子は「回り続けるための切り替え役」。 ブラシと整流子が、回転に合わせて電機子巻線の電流の向きを切り替え、同じ回転方向の力を保ちます。", "terms": [], "block": "3-3-883e5fd93fa7"}, {"id": "3-3/48/text", "raw": "直流電動機は**精密な速度制御に優れ**、コンテナクレーンやアンローダに使われます。整流子・ブラシの保守が必要なため、近年は**インバーター制御のかご形**への置換えも進んでいます。", "text": "直流電動機は精密な速度制御に優れ、コンテナクレーンやアンローダに使われます。整流子・ブラシの保守が必要なため、近年はインバーター制御のかご形への置換えも進んでいます。", "terms": [], "block": "3-3-rev26-dc-use"}, {"id": "3-3/50/text", "raw": "**直巻直流電動機** は、界磁巻線と電機子が直列につながる方式です。大きな始動トルクを得られる特徴があります。", "text": "直巻直流電動機 は、界磁巻線と電機子が直列につながる方式です。大きな始動トルクを得られる特徴があります。", "terms": ["直巻直流電動機"], "block": "3-3-38bf8a22073b"}, {"id": "3-3/51/text", "raw": "**負荷を外すと、回転速度が異常に高くなるおそれがあります。** 「負荷が軽いから安心して回せる」とは考えません。誘導電動機の同期速度の式を、そのまま直流電動機へ当てはめないことも大切です。", "text": "負荷を外すと、回転速度が異常に高くなるおそれがあります。 「負荷が軽いから安心して回せる」とは考えません。誘導電動機の同期速度の式を、そのまま直流電動機へ当てはめないことも大切です。", "terms": [], "block": "3-3-886d2042855e"}], "candidates": [{"id": "3-3/13/text#73", "fieldID": "3-3/13/text", "block": "3-3-cf2fb5ece376", "answer": "回転磁界", "category": "key", "prompt": "［用語？］", "start": 73, "end": 77, "context": "モーターでは「磁石を手で回す」代わりに、三相交流で磁界を回します。 外側の固定子は動かず、内側の回転子が回ります。円板が追いかけた相手にあたるのが回転磁界、円板にあたるのが回転子です。", "start16": 73, "end16": 77}, {"id": "3-3/15/text#41", "fieldID": "3-3/15/text", "block": "3-3-2bc4e40430eb", "answer": "電磁誘導", "category": "key", "prompt": "［用語？］", "start": 41, "end": 45, "context": "コイルを貫く磁束が変化すると、起電力（電流を流そうとする電圧）が生じます。 これが電磁誘導です。回路が閉じていれば、その起電力によって電流が流れます。", "start16": 41, "end16": 45}, {"id": "3-3/18/text#35", "fieldID": "3-3/18/text", "block": "3-3-68a77d03d147", "answer": "三相誘導電動機", "category": "key", "prompt": "［用語？］", "start": 35, "end": 42, "context": "交流電動機にはいくつか種類がありますが、クレーンでは特殊な場合を除き「三相誘導電動機」が使われます。これが本章の主役です。", "start16": 35, "end16": 42}, {"id": "3-3/20/rows:0:0#0", "fieldID": "3-3/20/rows:0:0", "block": "3-3-026d3c940a80", "answer": "固定子", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "固定子＝一次側", "start16": 0, "end16": 3}, {"id": "3-3/20/rows:1:0#0", "fieldID": "3-3/20/rows:1:0", "block": "3-3-026d3c940a80", "answer": "回転子", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "回転子＝二次側", "start16": 0, "end16": 3}, {"id": "3-3/24/text#35", "fieldID": "3-3/24/text", "block": "3-3-271436ea8756", "answer": "周波数", "category": "key", "prompt": "［用語？］", "start": 35, "end": 38, "context": "扇風機のように、モーターの軸が羽根を回す場面を考えます。同じ4極なら、周波数を30Hzから60Hzへ2倍にすると、回転子が追いかける磁界の速さも2倍。この「追いかける相手の速さ」が同期速度です。", "start16": 35, "end16": 38}, {"id": "3-3/24/text#90", "fieldID": "3-3/24/text", "block": "3-3-271436ea8756", "answer": "同期速度", "category": "key", "prompt": "［用語？］", "start": 90, "end": 94, "context": "扇風機のように、モーターの軸が羽根を回す場面を考えます。同じ4極なら、周波数を30Hzから60Hzへ2倍にすると、回転子が追いかける磁界の速さも2倍。この「追いかける相手の速さ」が同期速度です。", "start16": 90, "end16": 94}, {"id": "3-3/27/rows:2:1#9", "fieldID": "3-3/27/rows:2:1", "block": "3-3-d0376735e51d", "answer": "極数", "category": "key", "prompt": "［用語？］", "start": 9, "end": 11, "context": "1,200rpm／極数が多いほど遅い", "start16": 9, "end16": 11}, {"id": "3-3/30/text#0", "fieldID": "3-3/30/text", "block": "3-3-e3afaf1b84e3", "answer": "すべり", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "すべりは、速さの差を「追いかける相手の速さ」で割った割合。 図では100周に対して98周なので、(100−98)÷100×100＝2％。モーターでも、同期速度を基準にして同じように計算します。", "start16": 0, "end16": 3}, {"id": "3-3/39/rows:0:0#0", "fieldID": "3-3/39/rows:0:0", "block": "3-3-4862eb6d409b", "answer": "かご形", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "かご形", "start16": 0, "end16": 3}, {"id": "3-3/39/rows:0:1#20", "fieldID": "3-3/39/rows:0:1", "block": "3-3-4862eb6d409b", "answer": "ブラシ", "category": "key", "prompt": "［用語？］", "start": 20, "end": 23, "context": "回転子の導体バーを両端のリングでつなぐ。ブラシ・スリップリングがなく、構造が簡単。インバーターと組み合わせて広く速度制御できる。", "start16": 20, "end16": 23}, {"id": "3-3/39/rows:0:1#24", "fieldID": "3-3/39/rows:0:1", "block": "3-3-4862eb6d409b", "answer": "スリップリング", "category": "key", "prompt": "［用語？］", "start": 24, "end": 31, "context": "回転子の導体バーを両端のリングでつなぐ。ブラシ・スリップリングがなく、構造が簡単。インバーターと組み合わせて広く速度制御できる。", "start16": 24, "end16": 31}, {"id": "3-3/39/rows:1:0#0", "fieldID": "3-3/39/rows:1:0", "block": "3-3-4862eb6d409b", "answer": "巻線形", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "巻線形", "start16": 0, "end16": 3}, {"id": "3-3/39/rows:1:1#26", "fieldID": "3-3/39/rows:1:1", "block": "3-3-4862eb6d409b", "answer": "二次抵抗", "category": "key", "prompt": "［用語？］", "start": 26, "end": 30, "context": "回転子の巻線を、スリップリングとブラシを通して外部の二次抵抗につなぐ。抵抗を変えて始動・速度を調整する。", "start16": 26, "end16": 30}, {"id": "3-3/45/rows:0:0#0", "fieldID": "3-3/45/rows:0:0", "block": "3-3-3b55d5a0893e", "answer": "界磁", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "界磁（固定子）", "start16": 0, "end16": 2}, {"id": "3-3/45/rows:1:0#0", "fieldID": "3-3/45/rows:1:0", "block": "3-3-3b55d5a0893e", "answer": "電機子", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "電機子（回転子）", "start16": 0, "end16": 3}, {"id": "3-3/45/rows:2:0#0", "fieldID": "3-3/45/rows:2:0", "block": "3-3-3b55d5a0893e", "answer": "整流子", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "整流子・ブラシ", "start16": 0, "end16": 3}, {"id": "3-3/50/text#0", "fieldID": "3-3/50/text" -3/39/rows:1:0#0", "3-3/30/text#0", "3-3/20/rows:0:0#0", "3-3/24/text#90", "3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0"], ["3-3/39/rows:1:0#0", "3-3/30/text#0", "3-3/20/rows:0:0#0", "3-3/24/text#90", "3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0"], ["3-3/30/text#0", "3-3/20/rows:0:0#0", "3-3/24/text#90", "3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:1:1#26", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0"], ["3-3/20/rows:0:0#0", "3-3/24/text#90", "3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:1:1#26", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0", "3-3/50/text#0"], ["3-3/24/text#90", "3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:1:1#26", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0", "3-3/50/text#0", "3-3/15/text#41"], ["3-3/24/text#35", "3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:1:1#26", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0", "3-3/50/text#0", "3-3/15/text#41", "3-3/45/rows:0:0#0"], ["3-3/13/text#73", "3-3/45/rows:2:0#0", "3-3/39/rows:1:1#26", "3-3/39/rows:0:1#20", "3-3/20/rows:1:0#0", "3-3/45/rows:1:0#0", "3-3/50/text#0", "3-3/15/text#41", "3-3/45/rows:0:0#0", "3-3/27/rows:2:1#9"]], "num": [[]]}}, {"id": "3-4", "title": "制御器と付属機器", "blocks": [{"type": "p", "text": "**制御器**は、運転者の「どちらへ・どの速さで動かすか」を電動機へ伝える装置です。最初に、操作の指示と、モーターを動かす大きな電流を分けて考えます。", "style": "lead", "id": "3-4-8c7610c3a0a6"}, {"type": "sub", "text": "制御器とは", "id": "3-4-3ec35349301f"}, {"type": "p", "text": "**制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置**です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "id": "3-4-42e438246886", "quizTerms": ["直接制御器", "間接制御器", "複合制御器"]}, {"id": "3-4-d50eb4cf62e3", "type": "table", "headers": ["方式", "主回路をどう動かす？"], "rows": [["**直接制御**", "手で動かす制御器が、主回路の接点を直接切り替える"], ["**間接制御**", "小さな操作電流で指示し、電磁接触器が主回路を切り替える"], ["**半間接制御**", "巻線形の一次側は間接、二次側は直接。2方式を組み合わせる"]], "quizTerms": ["電磁接触器"]}, {"type": "sub", "text": "直接制御器（ドラム形）", "id": "3-4-e53e63e5201b"}, {"type": "p", "text": "**回路** は電流の通り道、**主回路** はモーターを動かす電流の道、**操作回路** は動作を指示するための道です。回路を **閉じる** と電流が流れ、**開く** と途切れます。**接点** は、その開け閉めを行う金属の接触部分です。", "id": "3-4-12a6ced2b784"}, {"type": "p", "text": "**直接制御器** は、ハンドルを動かして、モーターの主回路を直接つないだり切ったりする装置です。回る側の金属片が **セグメント**、それに触れる固定側の接触部品が **固定フィンガー**。この組み合わせで電流の道を切り替えます。", "id": "3-4-217abebb075c", "quizTerms": ["固定フィンガー", "セグメント"]}, {"type": "img", "asset": "3-4_supplement_f37_20261023", "labels": [], "legend": [], "caption": "ハンドルと一緒に接点部分が回り、主回路を切り替える。", "id": "3-4-da6050a9e6dc", "style": "figure", "_previewFile": "3-4_supplement_f37_20261023.png", "_width": 1472, "_height": 1069}, {"type": "p", "text": "電動機の容量が大きくなると、接点も大きくなり、操作が重くなります。**直接制御器は大容量に不向き**です。", "id": "3-4-683f83e156c8"}, {"type": "sub", "text": "間接制御器", "id": "3-4-b75884d9837a"}, {"type": "img", "asset": "3-4_indirect_door_daily", "caption": "役割を分けるためのたとえ。手で動かす扉と、ボタンで駆動装置へ指示する扉を比較。制御器そのものの配線図ではない。", "id": "3-4-1fc8e2024004", "style": "figure", "_previewFile": "3-4_indirect_door_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**ボタンを押す人は、扉を動かす力を直接出していません。** 駆動装置へ指示を送り、実際の力仕事を任せています。間接制御も、操作する回路と、モーターを動かす主回路の役割を分けます。カム形・エンコーダー形は間接制御です。", "id": "3-4-36fda0256b40"}, {"type": "p", "text": "**間接制御器** は、操作用の小さな電流で、別の電動スイッチへ指示を出す装置です。その電動スイッチが **電磁接触器**。コイルに通電して電磁石にし、接点を動かして主回路を開閉します。ハンドルの動きをスイッチへ伝える形のついた部品を **カム** といいます。", "id": "3-4-ebb565fd47f2", "quizTerms": ["カム"]}, {"id": "3-4-ec55261c3310", "type": "table", "headers": ["間接制御の特徴", "理由・できること"], "rows": [["**小型・軽量、操作が軽い**", "制御器が扱う電流が小さい"], ["**自動運転に向く**", "シーケンサーで、条件と順番に従って指示を出せる"], ["加速・減速を自動化できる", "急な操作でも、回路が電動機への負担を抑える"], ["設備費", "直接制御より高い"]]}, {"type": "img", "asset": "3-4_supplement_f38_20261023", "labels": [], "legend": [], "caption": "カムでスイッチを動かし、接触器へ指令を送る。", "id": "3-4-920924c11853", "style": "figure", "_previewFile": "3-4_supplement_f38_20261023.png", "_width": 1472, "_height": 1068}, {"type": "p", "text": "**電磁石は、電流で働かせる磁石。** コイルに電流を流すと鉄片を引き寄せ、その動きで接点をくっつけます。操作用の小さな電流で、主回路のスイッチを動かせる理由です。", "id": "3-4-6579fecf776d"}, {"type": "img", "asset": "3-4_contactor_motion_daily", "caption": "電磁接触器の動きの模式図。電流を流してコイルを電磁石にすると鉄片が引かれ、接点が閉じる。主回路と操作回路の配線は省略。", "id": "3-4-2969c6c6cedd", "style": "figure", "_previewFile": "3-4_contactor_motion_daily.png", "_width": 1774, "_height": 887}, {"type": "img", "asset": "3-3_control_protection_panel21_3", "caption": "電磁接触器：コイルで主接点を操作する。", "id": "3-4-81e1c42a8df6", "style": "figure", "_previewFile": "3-3_control_protection_panel21_3.png", "_width": 900, "_height": 300}, {"type": "sub", "text": "複合制御器（半間接制御）", "id": "3-4-f1510d5fc19d"}, {"type": "p", "text": "巻線形の**一次側は大きな電流を扱うので間接制御、二次側は比較的小さな電流なので直接制御**。これが複合制御器（半間接制御器）です。", "id": "3-4-ae859a39c857"}, {"type": "sub", "text": "操作ハンドルの構造とノッチ", "id": "3-4-abf297eccbc7"}, {"type": "p", "text": "**エンコーダー** は、ハンドルや軸がどの位置にあるか、どれだけ回ったかを電気信号に変える部品です。「今どの位置か」を制御装置へ知らせる役です。", "id": "3-4-fe8b8a5733be", "quizTerms": ["エンコーダー"]}, {"type": "table", "headers": ["名称", "操作方法"], "rows": [["クランクハンドル式", "水平方向にハンドルを回して操作"], ["レバーハンドル式", "縦方向にハンドルを操作"], ["ユニバーサル制御器", "1つのハンドルを前後左右・斜めに動かし、2つの制御器を同時／単独で操作できる"]], "id": "3-4-35b14024acba"}, {"type": "p", "text": "ハンドルの刻みを**ノッチ（ハンドルの段階ごとの位置）**といい、停止位置を**0ノッチ**とし、そこから1ノッチ、2ノッチと数えます。試験では「レバーハンドル式＝縦方向」「ユニバーサル＝1本で2個の制御器」が問われます。", "id": "3-4-5c79940454b7"}, {"type": "img", "asset": "3-4_supplement_f39_20261023", "labels": [], "legend": [], "caption": "クランクハンドルは水平に回し、レバーハンドルは縦に動かす。下の目盛はノッチの数え方の例で、0が停止位置。", "id": "3-4-28fe0b457f55", "style": "figure", "_previewFile": "3-4_supplement_f39_20261023.png", "_width": 1473, "_height": 1068}, {"type": "p", "text": "無線操作用は**間接制御器の一種**。正転・逆転を同時に押せない仕組みや、1段押しで低速、2段押しで高速になるものがあります。切替開閉器で**機上運転へ切り替えられるもの**もあります。", "id": "3-4-8b39f50d2663"}, {"type": "sub", "id": "lesson-pendant", "text": "ペンダントスイッチ――押すと動き、離すと止まる"}, {"type": "p", "text": "**ペンダントスイッチは、押している間だけ動作し、離すと止まる構造** とします。手を離した後も操作指令が残り続けないことが大切です。", "id": "3-4-4c9cb282dfe8"}, {"type": "p", "text": "位置を検出するリミットスイッチや、危険時に使う非常停止とは役割が違います。名前よりも、何をすると動作が変わるかで区別しましょう。", "id": "3-4-d97833b4a41c"}, {"type": "sub", "text": "制御器による制御（運転操作）", "id": "3-4-14e0a3754aad"}, {"type": "p", "text": "**制動**は動きを抑えること、**惰走**は駆動を止めたあとも勢いで進むことです。停止操作は、次の2つを区別します。", "id": "3-4-50a69a2da181"}, {"id": "3-4-1d91e75395bb", "type": "table", "headers": ["操作", "働きと注意点"], "rows": [["**逆相制動（プラギング）**", "回転中に逆向きの操作をして減速する。機械・電気への負担が大きいので、できるだけ避ける。やむを得ない場合は**1ノッチ**、コースチングがある場合は**2ノッチ**で行う"], ["**コースチングノッチ**", "横行・走行などの**第1ノッチ**。電動機は無通電、ブレーキだけ通電して緩める。惰走して減速し、**0ノッチでブレーキをかける**"]], "quizTerms": ["ノッチ", "惰走"]}, {"id": "3-4-rev26-coasting", "type": "svg", "file": "3-4_coasting_20261106.svg", "caption": "コースチングノッチを備えた横行・走行の停止操作。モーターとブレーキを分けて見る。", "style": "figure", "_previewFile": "3-4_coasting_20261106.svg"}, {"type": "sub", "id": "lesson-notch-no-acceleration", "text": "ノッチを進めても加速しないとき"}, {"type": "p", "text": "**加速しないまま、ノッチを飛ばして最終位置まで進めません。** 過負荷、電圧低下、ブレーキの開放不良などの異常があるかもしれません。", "id": "3-4-e943f5fa2d5f"}, {"type": "p", "text": "各段で加速を確かめ、異常なら停止して原因を確認します。加速しないのに進め続けると、過電流などにつながります。", "id": "3-4-b8ab4799bed6"}, {"type": "sub", "text": "付属機器と保護装置", "id": "3-4-b52db9ee0bba"}, {"id": "3-4-01f9d4c8faa7", "type": "table", "headers": ["機器", "役割"], "rows": [["**抵抗器**", "特殊鉄板・鋳鉄などの抵抗体を格子状に組み、絶縁して支える。巻線形・直流電動機の速度制御に使う"], ["**共用保護盤**", "外から来た電力を各制御盤へ分配する。主配線用遮断器・主電磁接触器・電源表示灯などを収める"], ["**制御盤**", "電磁接触器・電流計・加速継電器などを収め、指示に従って電動機を動かす"], ["**サイリスター**", "小さな信号で電流を通し始める時点を調整し、電圧や電力を制御する半導体部品"]]}, {"type": "img", "asset": "3-3_control_protection_panel21_1", "caption": "共用保護盤：電力を分配し、主配線用遮断器・主電磁接触器などで各回路を保護する。", "id": "3-4-1b2385aab869", "style": "figure", "_previewFile": "3-3_control_protection_panel21_1.png", "_width": 900, "_height": 380}, {"id": "3-4-rev26-panel-size", "type": "p", "text": "大容量では、**巻上げ用・走行用などの制御盤**を分けます。小容量では共用保護盤に収める場合もあります。制御盤には、シーケンサーやインバーター・サイリスター装置を組み込むものもあります。"}, {"id": "3-4-rev26-resistor-hot", "type": "p", "text": "抵抗器は運転中に**約350℃**になることがあります。**近くに可燃物を置かない**ことが重要です。", "style": "caution"}, {"id": "3-4-rev26-switch-order-heading", "type": "sub", "text": "電源を入れる順序・切る順序"}, {"id": "3-4-rev26-switch-order", "type": "table", "headers": ["項目", "意味・覚えること"], "rows": [["**運転を始める**", "主配線用遮断器を入れる → 主電磁接触器を閉じる"], ["**運転を終える**", "主電磁接触器を開く → 主配線用遮断器を切る"]]}, {"id": "3-4-rev26-zero-heading", "type": "sub", "text": "ゼロノッチ：全部が停止位置か確認"}, {"id": "3-4-rev26-zero-definition", "type": "p", "text": "**全部のハンドルが0ノッチ（停止位置）にないと、主電磁接触器を入れられない**仕組みが、ゼロノッチインターロックです。意図しない再始動を防ぎます。"}, {"type": "img", "asset": "3-4_zero_handles_daily", "caption": "3本の操作レバーが停止位置にある条件を比べる。錠の絵は投入を許す・止める働きのたとえで、実物の施錠方法ではない。ほかの保護条件は省略。", "id": "3-4-7911909131b7", "style": "figure", "_previewFile": "3-4_zero_handles_daily.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "**覚え方：入れる前に、全部ゼロ。** 電源を入れ直すとき、ハンドルが動作位置に残っていないかを確認する仕組みです。", "id": "3-4-716b81ed0a25", "style": "tip"}, {"id": "3-4-65cba01e4e3d", "type": "p", "text": "電動機の構造は「電動機」の節で確認できます。", "style": "reference", "file": "3-3"}, {"type": "sub", "id": "lesson-protection-roles", "text": "指令・開閉・保護を分ける"}, {"type": "p", "text": "**主幹制御器が指令 → 電磁接触器が主回路を開閉。** 接触器は電磁石で閉じ、重力やばねで開きます。", "id": "3-4-81c7e659c6d7", "quizTerms": ["主幹制御器"]}, {"type": "p", "text": "**サーマルリレー（熱動継電器）**は、主に過負荷による過電流を検出します。一般的なバイメタル式は、電流による熱で金属が曲がる性質を利用します。", "id": "3-4-aec2d88dd9fb", "quizTerms": ["バイメタル式"]}, {"type": "p", "text": "サーマルリレー自体で主電流を遮断するのではなく、接点の信号で電磁接触器などを開放します。短絡電流の保護は、適合するヒューズや遮断器が受け持ちます。", "id": "3-4-bfe6ccb2212c"}, {"type": "p", "text": "**ヒューズが切れた、保護装置が作動したときは原因を調べます。** 原因を除かず、ヒューズ容量や設定電流を大きくして運転を続けません。指定の容量・特性・遮断能力に適合させます。", "id": "3-4-b25c374f215e"}, {"type": "table", "headers": ["項目", "考え方"], "rows": [["配線用遮断器", "過負荷・短絡で自動遮断。原因を確認し、所定の手順で手動復帰する"], ["漏電遮断器", "漏電を検出して遮断する。接地や点検時の電源遮断の代わりではない"], ["サーマルリレー", "持続的な過電流によるモーターの過負荷を検出し、接触器などへ停止を指令する"], ["ヒューズ", "過電流で溶断して回路を切る。原因を除去し、適合するものへ交換する"]], "id": "3-4-a9d3d6053b86", "quizTerms": ["サーマルリレー"]}, {"type": "img", "asset": "3-3_control_protection_panel21_2", "caption": "遮断器：回路の開閉・保護。", "id": "3-4-07af76b42691", "style": "figure", "_previewFile": "3-3_control_protection_panel21_2.png", "_width": 900, "_height": 300}, {"type": "sub", "id": "lesson-contactor-voltage", "text": "接触器が、うまく吸い付かないとき"}, {"type": "p", "text": "電磁接触器のコイルには、定められた電圧が必要です。**コイル電圧が大幅に低下すると、吸引力が不足し、確実に閉じられなくなることがあります。**", "id": "3-4-c25a3eb0f48f"}, {"type": "p", "text": "接点が小刻みに開閉する**チャタリング**は、振動・発熱・接点損傷の原因です。点検は電源を適切に遮断して行います。", "id": "3-4-ce56e7fb455d", "quizTerms": ["チャタリング"]}, {"id": "3-4-rev26-coast-test-q", "type": "p", "text": "**確認：** コースチングノッチでは、モーターとブレーキはどうなっている？", "style": "question"}, {"id": "3-4-rev26-coast-test-a", "type": "p", "text": "**モーターは無通電。ブレーキは通電して緩んでいます。** 勢いで走りながら減速し、0ノッチでブレーキをかけます。", "style": "answer"}], "chapter": 3, "fields": [{"id": "3-4/2/text", "raw": "**制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置**です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "text": "制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "terms": ["直接制御器", "間接制御器", "複合制御器"], "block": "3-4-42e438246886"}, {"id": "3-4/3/rows:0:0", "raw": "**直接制御**", "text": "直接制御", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/3/rows:0:1", "raw": "手で動かす制御器が、主回路の接点を直接切り替える", "text": "手で動かす制御器が、主回路の接点を直接切り替える", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/3/rows:1:0", "raw": "**間接制御**", "text": "間接制御", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/3/rows:1:1", "raw": "小さな操作電流で指示し、電磁接触器が主回路を切り替える", "text": "小さな操作電流で指示し、電磁接触器が主回路を切り替える", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/3/rows:2:0", "raw": "**半間接制御**", "text": "半間接制御", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/3/rows:2:1", "raw": "巻線形の一次側は間接、二次側は直接。2方式を組み合わせる", "text": "巻線形の一次側は間接、二次側は直接。2方式を組み合わせる", "terms": ["電磁接触器"], "block": "3-4-d50eb4cf62e3"}, {"id": "3-4/5/text", "raw": "**回路** は電流の通り道、**主回路** はモーターを動かす電流の道、**操作回路** は動作を指示するための道です。回路を **閉じる** と電流が流れ、**開く** と途切れます。**接点** は、その開け閉めを行う金属の接触部分です。", "text": "回路 は電流の通り道、主回路 はモーターを動かす電流の道、操作回路 は動作を指示するための道です。回路を 閉じる と電流が流れ、開く と途切れます。接点 は、その開け閉めを行う金属の接触部分です。", "terms": [], "block": "3-4-12a6ced2b784"}, {"id": "3-4/6/text", "raw": "**直接制御器** は、ハンドルを動かして、モーターの主回路を直接つないだり切ったりする装置です。回る側の金属片が **セグメント**、それに触れる固定側の接触部品が **固定フィンガー**。この組み合わせで電流の道を切り替えます。", "text": "直接制御器 は、ハンドルを動かして、モーターの主回路を直接つないだり切ったりする装置です。回る側の金属片が セグメント、それに触れる固定側の接触部品が 固定フィンガー。この組み合わせで電流の道を切り替えます。", "terms": ["固定フィンガー", "セグメント"], "block": "3-4-217abebb075c"}, {"id": "3-4/8/text", "raw": "電動機の容量が大きくなると、接点も大きくなり、操作が重くなります。**直接制御器は大容量に不向き**です。", "text": "電動機の容量が大きくなると、接点も大きくなり、操作が重くなります。直接制御器は大容量に不向きです。", "terms": [], "block": "3-4-683f83e156c8"}, {"id": "3-4/11/text", "raw": "**ボタンを押す人は、扉を動かす力を直接出していません。** 駆動装置へ指示を送り、実際の力仕事を任せています。間接制御も、操作する回路と、モーターを動かす主回路の役割を分けます。カム形・エンコーダー形は間接制御です。", "text": "ボタンを押す人は、扉を動かす力を直接出していません。 駆動装置へ指示を送り、実際の力仕事を任せています。間接制御も、操作する回路と、モーターを動かす主回路の役割を分けます。カム形・エンコーダー形は間接制御です。", "terms": [], "block": "3-4-36fda0256b40"}, {"id": "3-4/12/text", "raw": "**間接制御器** は、操作用の小さな電流で、別の電動スイッチへ指示を出す装置です。その電動スイッチが **電磁接触器**。コイルに通電して電磁石にし、接点を動かして主回路を開閉します。ハンドルの動きをスイッチへ伝える形のついた部品を **カム** といいます。", "text": "間接制御器 は、操作用の小さな電流で、別の電動スイッチへ指示を出す装置です。その電動スイッチが 電磁接触器。コイルに通電して電磁石にし、接点を動かして主回路を開閉します。ハンドルの動きをスイッチへ伝える形のついた部品を カム といいます。", "terms": ["カム"], "block": "3-4-ebb565fd47f2"}, {"id": "3-4/13/rows:0:0", "raw": "**小型・軽量、操作が軽い**", "text": "小型・軽量、操作が軽い", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:0:1", "raw": "制御器が扱う電流が小さい", "text": "制御器が扱う電流が小さい", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:1:0", "raw": "**自動運転に向く**", "text": "自動運転に向く", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:1:1", "raw": "シーケンサーで、条件と順番に従って指示を出せる", "text": "シーケンサーで、条件と順番に従って指示を出せる", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:2:0", "raw": "加速・減速を自動化できる", "text": "加速・減速を自動化できる", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:2:1", "raw": "急な操作でも、回路が電動機への負担を抑える", "text": "急な操作でも、回路が電動機への負担を抑える", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:3:0", "raw": "設備費", "text": "設備費", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/13/rows:3:1", "raw": "直接制御より高い", "text": "直接制御より高い", "terms": [], "block": "3-4-ec55261c3310"}, {"id": "3-4/15/text", "raw": "**電磁石は、電流で働かせる磁石。** コイルに電流を流すと鉄片を引き寄せ、その動きで接点をくっつけます。操作用の小さな電流で、主回路のスイッチを動かせる理由です。", "text": "電磁石は、電流で働かせる磁石。 コイルに電流を流すと鉄片を引き寄せ、その動きで接点をくっつけます。操作用の小さな電流で、主回路のスイッチを動かせる理由です。", "terms": [], "block": "3-4-6579fecf776d"}, {"id": "3-4/19/text", "raw": "巻線形の**一次側は大きな電流を扱うので間接制御、二次側は比較的小さな電流なので直接制御**。これが複合制御器（半間接制御器）です。", "text": "巻線形の一次側は大きな電流を扱うので間接制御、二次側は比較的小さな電流なので直接制御。これが複合制御器（半間接制御器）です。", "terms": [], "block": "3-4-ae859a39c857"}, {"id": "3-4/21/text", "raw": "**エンコーダー** は、ハンドルや軸がどの位置にあるか、どれだけ回ったかを電気信号に変える部品です。「今どの位置か」を制御装置へ知らせる役です。", "text": "エンコーダー は、ハンドルや軸がどの位置にあるか、どれだけ回ったかを電気信号に変える部品です。「今どの位置か」を制御装置へ知らせる役です。", "terms": ["エンコーダー"], "block": "3-4-fe8b8a5733be"}, {"id": "3-4/22/rows:0:0", "raw": "クランクハンドル式", "text": "クランクハンドル式", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/22/rows:0:1", "raw": "水平方向にハンドルを回して操作", "text": "水平方向にハンドルを回して操作", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/22/rows:1:0", "raw": "レバーハンドル式", "text": "レバーハンドル式", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/22/rows:1:1", "raw": "縦方向にハンドルを操作", "text": "縦方向にハンドルを操作", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/22/rows:2:0", "raw": "ユニバーサル制御器", "text": "ユニバーサル制御器", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/22/rows:2:1", "raw": "1つのハンドルを前後左右・斜めに動かし、2つの制御器を同時／単独で操作できる", "text": "1つのハンドルを前後左右・斜めに動かし、2つの制御器を同時／単独で操作できる", "terms": [], "block": "3-4-35b14024acba"}, {"id": "3-4/23/text", "raw": "ハンドルの刻みを**ノッチ（ハンドルの段階ごとの位置）**といい、停止位置を**0ノッチ**とし、そこから1ノッチ、2ノッチと数えます。試験では「レバーハンドル式＝縦方向」「ユニバーサル＝1本で2個の制御器」が問われます。", "text": "ハンドルの刻みをノッチ（ハンドルの段階ごとの位置）といい、停止位置を0ノッチとし、そこから1ノッチ、2ノッチと数えます。試験では「レバーハンドル式＝縦方向」「ユニバーサル＝1本で2個の制御器」が問われます。", "terms": [], "block": "3-4-5c79940454b7"}, {"id": "3-4/25/text", "raw": "無線操作用は**間接制御器の一種**。正転・逆転を同時に押せない仕組みや、1段押しで低速、2段押しで高速になるものがあります。切替開閉器で**機上運転へ切り替えられるもの**もあります。", "text": "無線操作用は間接制御器の一種。正転・逆転を同時に押せない仕組みや、1段押しで低速、2段押しで高速になるものがあります。切替開閉器で機上運転へ切り替えられるものもあります。", "terms": [], "block": "3-4-8b39f50d2663"}, {"id": "3-4/27/text", "raw": "**ペンダントスイッチは、押している間だけ動作し、離すと止まる構造** とします。手を離した後も操作指令が残り続けないことが大切です。", "text": "ペンダントスイッチは、押している間だけ動作し、離すと止まる構造 とします。手を離した後も操作指令が残り続けないことが大切です。", "terms": [], "block": "3-4-4c9cb282dfe8"}, {"id": "3-4/28/text", "raw": "位置を検出するリミットスイッチや、危険時に使う非常停止とは役割が違います。名前よりも、何をすると動作が変わるかで区別しましょう。", "text": "位置を検出するリミットスイッチや、危険時に使う非常停止とは役割が違います。名前よりも、何をすると動作が変わるかで区別しましょう。", "terms": [], "block": "3-4-d97833b4a41c"}, {"id": "3-4/30/text", "raw": "**制動**は動きを抑えること、**惰走**は駆動を止めたあとも勢いで進むことです。停止操作は、次の2つを区別します。", "text": "制動は動きを抑えること、惰走は駆動を止めたあとも勢いで進むことです。停止操作は、次の2つを区別します。", "terms": [], "block": "3-4-50a69a2da181"}, {"id": "3-4/31/rows:0:0", "raw": "**逆相制動（プラギング）**", "text": "逆相制動（プラギング）", "terms": ["ノッチ", "惰走"], "block": "3-4-1d91e75395bb"}, {"id": "3-4/31/rows:0:1", "raw": "回転中に逆向きの操作をして減速する。機械・電気への負担が大きいので、できるだけ避ける。やむを得ない場合は**1ノッチ**、コースチングがある場合は**2ノッチ**で行う", "text": "回転中に逆向きの操作をして減速する。機械・電気への負担が大きいので、できるだけ避ける。やむを得ない場合は1ノッチ、コースチングがある場合は2ノッチで行う", "terms": ["ノッチ", "惰走"], "block": "3-4-1d91e75395bb"}, {"id": "3-4/31/rows:1:0", "raw": "**コースチングノッチ**", "text": "コースチングノッチ", "terms": ["ノッチ", "惰走"], "block": "3-4-1d91e75395bb"}, {"id": "3-4/31/rows:1:1", "raw": "横行・走行などの**第1ノッチ**。電動機は無通電、ブレーキだけ通電して緩める。惰走して減速し、**0ノッチでブレーキをかける**", "text": "横行・走行などの第1ノッチ。電動機は無通電、ブレーキだけ通電して緩める。惰走して減速し、0ノッチでブレーキをかける", "terms": ["ノッチ", "惰走"], "block": "3-4-1d91e75395bb"}, {"id": "3-4/34/text", "raw": "**加速しないまま、ノッチを飛ばして最終位置まで進めません。** 過負荷、電圧低下、ブレーキの開放不良などの異常があるかもしれません。", "text": "加速しないまま、ノッチを飛ばして最終位置まで進めません。 過負荷、電圧低下、ブレーキの開放不良などの異常があるかもしれません。", "terms": [], "block": "3-4-e943f5fa2d5f"}, {"id": "3-4/35/text", "raw": "各段で加速を確かめ、異常なら停止して原因を確認します。加速しないのに進め続けると、過電流などにつながります。", "text": "各段で加速を確かめ、異常なら停止して原因を確認します。加速しないのに進め続けると、過電流などにつながります。", "terms": [], "block": "3-4-b8ab4799bed6"}, {"id": "3-4/37/rows:0:0", "raw": "**抵抗器**", "text": "抵抗器", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:0:1", "raw": "特殊鉄板・鋳鉄などの抵抗体を格子状に組み、絶縁して支える。巻線形・直流電動機の速度制御に使う", "text": "特殊鉄板・鋳鉄などの抵抗体を格子状に組み、絶縁して支える。巻線形・直流電動機の速度制御に使う", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:1:0", "raw": "**共用保護盤**", "text": "共用保護盤", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:1:1", "raw": "外から来た電力を各制御盤へ分配する。主配線用遮断器・主電磁接触器・電源表示灯などを収める", "text": "外から来た電力を各制御盤へ分配する。主配線用遮断器・主電磁接触器・電源表示灯などを収める", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:2:0", "raw": "**制御盤**", "text": "制御盤", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:2:1", "raw": "電磁接触器・電流計・加速継電器などを収め、指示に従って電動機を動かす", "text": "電磁接触器・電流計・加速継電器などを収め、指示に従って電動機を動かす", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:3:0", "raw": "**サイリスター**", "text": "サイリスター", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/37/rows:3:1", "raw": "小さな信号で電流を通し始める時点を調整し、電圧や電力を制御する半導体部品", "text": "小さな信号で電流を通し始める時点を調整し、電圧や電力を制御する半導体部品", "terms": [], "block": "3-4-01f9d4c8faa7"}, {"id": "3-4/39/text", "raw": "大容量では、**巻上げ用・走行用などの制御盤**を分けます。小容量では共用保護盤に収める場合もあります。制御盤には、シーケンサーやインバーター・サイリスター装置を組み込むものもあります。", "text": "大容量では、巻上げ用・走行用などの制御盤を分けます。小容量では共用保護盤に収める場合もあります。制御盤には、シーケンサーやインバーター・サイリスター装置を組み込むものもあります。", "terms": [], "block": "3-4-rev26-panel-size"}, {"id": "3-4/40/text", "raw": "抵抗器は運転中に**約350℃**になることがあります。**近くに可燃物を置かない**ことが重要です。", "text": "抵抗器は運転中に約350℃になることがあります。近くに可燃物を置かないことが重要です。", "terms": [], "block": "3-4-rev26-resistor-hot"}, {"id": "3-4/42/rows:0:0", "raw": "**運転を始める**", "text": "運転を始める", "terms": [], "block": "3-4-rev26-switch-order"}, {"id": "3-4/42/rows:0:1", "raw": "主配線用遮断器を入れる → 主電磁接触器を閉じる", "text": "主配線用遮断器を入れる → 主電磁接触器を閉じる", "terms": [], "block": "3-4-rev26-switch-order"}, {"id": "3-4/42/rows:1:0", "raw": "**運転を終える**", "text": "運転を終える", "terms": [], "block": "3-4-rev26-switch-order"}, {"id": "3-4/42/rows:1:1", "raw": "主電磁接触器を開く → 主配線用遮断器を切る", "text": "主電磁接触器を開く → 主配線用遮断器を切る", "terms": [], "block": "3-4-rev26-switch-order"}, {"id": "3-4/44/text", "raw": "**全部のハンドルが0ノッチ（停止位置）にないと、主電磁接触器を入れられない**仕組みが、ゼロノッチインターロックです。意図しない再始動を防ぎます。", "text": "全部のハンドルが0ノッチ（停止位置）にないと、主電磁接触器を入れられない仕組みが、ゼロノッチインターロックです。意図しない再始動を防ぎます。", "terms": [], "block": "3-4-rev26-zero-definition"}, {"id": "3-4/46/text", "raw": "**覚え方：入れる前に、全部ゼロ。** 電源を入れ直すとき、ハンドルが動作位置に残っていないかを確認する仕組みです。", "text": "覚え方：入れる前に、全部ゼロ。 電源を入れ直すとき、ハンドルが動作位置に残っていないかを確認する仕組みです。", "terms": [], "block": "3-4-716b81ed0a25"}, {"id": "3-4/49/text", "raw": "**主幹制御器が指令 → 電磁接触器が主回路を開閉。** 接触器は電磁石で閉じ、重力やばねで開きます。", "text": "主幹制御器が指令 → 電磁接触器が主回路を開閉。 接触器は電磁石で閉じ、重力やばねで開きます。", "terms": ["主幹制御器"], "block": "3-4-81c7e659c6d7"}, {"id": "3-4/50/text", "raw": "**サーマルリレー（熱動継電器）**は、主に過負荷による過電流を検出します。一般的なバイメタル式は、電流による熱で金属が曲がる性質を利用します。", "text": "サーマルリレー（熱動継電器）は、主に過負荷による過電流を検出します。一般的なバイメタル式は、電流による熱で金属が曲がる性質を利用します。", "terms": ["バイメタル式"], "block": "3-4-aec2d88dd9fb"}, {"id": "3-4/51/text", "raw": "サーマルリレー自体で主電流を遮断するのではなく、接点の信号で電磁接触器などを開放します。短絡電流の保護は、適合するヒューズや遮断器が受け持ちます。", "text": "サーマルリレー自体で主電流を遮断するのではなく、接点の信号で電磁接触器などを開放します。短絡電流の保護は、適合するヒューズや遮断器が受け持ちます。", "terms": [], "block": "3-4-bfe6ccb2212c"}, {"id": "3-4/52/text", "raw": "**ヒューズが切れた、保護装置が作動したときは原因を調べます。** 原因を除かず、ヒューズ容量や設定電流を大きくして運転を続けません。指定の容量・特性・遮断能力に適合させます。", "text": "ヒューズが切れた、保護装置が作動したときは原因を調べます。 原因を除かず、ヒューズ容量や設定電流を大きくして運転を続けません。指定の容量・特性・遮断能力に適合させます。", "terms": [], "block": "3-4-b25c374f215e"}, {"id": "3-4/53/rows:0:0", "raw": "配線用遮断器", "text": "配線用遮断器", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:0:1", "raw": "過負荷・短絡で自動遮断。原因を確認し、所定の手順で手動復帰する", "text": "過負荷・短絡で自動遮断。原因を確認し、所定の手順で手動復帰する", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:1:0", "raw": "漏電遮断器", "text": "漏電遮断器", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:1:1", "raw": "漏電を検出して遮断する。接地や点検時の電源遮断の代わりではない", "text": "漏電を検出して遮断する。接地や点検時の電源遮断の代わりではない", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:2:0", "raw": "サーマルリレー", "text": "サーマルリレー", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:2:1", "raw": "持続的な過電流によるモーターの過負荷を検出し、接触器などへ停止を指令する", "text": "持続的な過電流によるモーターの過負荷を検出し、接触器などへ停止を指令する", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:3:0", "raw": "ヒューズ", "text": "ヒューズ", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/53/rows:3:1", "raw": "過電流で溶断して回路を切る。原因を除去し、適合するものへ交換する", "text": "過電流で溶断して回路を切る。原因を除去し、適合するものへ交換する", "terms": ["サーマルリレー"], "block": "3-4-a9d3d6053b86"}, {"id": "3-4/56/text", "raw": "電磁接触器のコイルには、定められた電圧が必要です。**コイル電圧が大幅に低下すると、吸引力が不足し、確実に閉じられなくなることがあります。**", "text": "電磁接触器のコイルには、定められた電圧が必要です。コイル電圧が大幅に低下すると、吸引力が不足し、確実に閉じられなくなることがあります。", "terms": [], "block": "3-4-c25a3eb0f48f"}, {"id": "3-4/57/text", "raw": "接点が小刻みに開閉する**チャタリング**は、振動・発熱・接点損傷の原因です。点検は電源を適切に遮断して行います。", "text": "接点が小刻みに開閉するチャタリングは、振動・発熱・接点損傷の原因です。点検は電源を適切に遮断して行います。", "terms": ["チャタリング"], "block": "3-4-ce56e7fb455d"}], "candidates": [{"id": "3-4/2/text#44", "fieldID": "3-4/2/text", "block": "3-4-42e438246886", "answer": "直接制御器", "category": "key", "prompt": "［用語？］", "start": 44, "end": 49, "context": "制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "start16": 44, "end16": 49}, {"id": "3-4/2/text#50", "fieldID": "3-4/2/text", "block": "3-4-42e438246886", "answer": "間接制御器", "category": "key", "prompt": "［用語？］", "start": 50, "end": 55, "context": "制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "start16": 50, "end16": 55}, {"id": "3-4/2/text#56", "fieldID": "3-4/2/text", "block": "3-4-42e438246886", "answer": "複合制御器", "category": "key", "prompt": "［用語？］", "start": 56, "end": 61, "context": "制御器は、電動機に「正転・停止・逆転」や「速度」の指令を与える装置です。制御のやり方で、直接制御器・間接制御器・複合制御器に大きく分かれます。", "start16": 56, "end16": 61}, {"id": "3-4/3/rows:1:1#12", "fieldID": "3-4/3/rows:1:1", "block": "3-4-d50eb4cf62e3", "answer": "電磁接触器", "category": "key", "prompt": "［用語？］", "start": 12, "end": 17, "context": "小さな操作電流で指示し、電磁接触器が主回路を切り替える", "start16": 12, "end16": 17}, {"id": "3-4/6/text#54", "fieldID": "3-4/6/text", "block": "3-4-217abebb075c", "answer": "セグメント", "category": "key", "prompt": "［用語？］", "start": 54, "end": 59, "context": "直接制御器 は、ハンドルを動かして、モーターの主回路を直接つないだり切ったりする装置です。回る側の金属片が セグメント、それに触れる固定側の接触部品が 固定フィンガー。この組み合わせで電流の道を切り替えます。", "start16": 54, "end16": 59}, {"id": "3-4/6/text#76", "fieldID": "3-4/6/text", "block": "3-4-217abebb075c", "answer": "固定フィンガー", "category": "key", "prompt": "［用語？］", "start": 76, "end": 83, "context": "直接制御器 は、ハンドルを動かして、モーターの主回路を直接つないだり切ったりする装置です。回る側の金属片が セグメント、それに触れる固定側の接触部品が 固定フィンガー。この組み合わせで電流の道を切り替えます。", "start16": 76, "end16": 83}, {"id": "3-4/12/text#110", "fieldID": "3-4/12/text", "block": "3-4-ebb565fd47f2", "answer": "カム", "category": "key", "prompt": "［用語？］", "start": 110, "end": 112, "context": "間接制御器 は、操作用の小さな電流で、別の電動スイッチへ指示を出す装置です。その電動スイッチが 電磁接触器。コイルに通電して電磁石にし、接点を動かして主回路を開閉します。ハンドルの動きをスイッチへ伝える形のついた部品を カム といいます。", "start16": 110, "end16": 112}, {"id": "3-4/21/text#0", "fieldID": "3-4/21/text", "block": "3-4-fe8b8a5733be", "answer": "エンコーダー", "category": "key", "prompt": "［用語？］", "start": 0, "end": 6, "context": "エンコーダー は、ハンドルや軸がどの位置にあるか、どれだけ回ったかを電気信号に変える部品です。「今どの位置か」を制御装置へ知らせる役です。", "start16": 0, "end16": 6}, {"id": "3-4/31/rows:0:1#53", "fieldID": "3-4/31/rows:0:1", "block": "3-4-1d91e75395bb", "answer": "ノッチ", "category": "key", "prompt": "［用語？］", "start": 53, "end": 56, "context": "回転中に逆向きの操作をして減速する。機械・電気への負担が大きいので、できるだけ避ける。やむを得ない場合は1ノッチ、コースチングがある場合は2ノッチで行う", "start16": 53, "end16": 56}, {"id": "3-4/31/rows:1:1#36", "fieldID": "3-4/31/rows:1:1", "block": "3-4-1d91e75395bb", "answer": "惰走", "category": "key", "prompt": "［用語？］", "start": 36, "end": 38, "context": "横行・走行などの第1ノッチ。電動機は無通電、ブレーキだけ通電して緩める。惰走して減速し、0ノッチでブレーキをかける", "start16": 36, "end16": 38}, {"id": "3-4/49/text#0", "fieldID": "3-4/49/text", "block": "3-4-81c7e659c6d7", "answer": "主幹制御器", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "主幹制御器が指令 → 電磁接触器が主回路を開閉。 接触器は電磁石で閉じ、重力やばねで開きます。", "start16": 0, "end16": 5}, {"id": "3-4/50/text#38", "fieldID": "3-4/50/text", "block": "3-4-aec2d88dd9fb", "answer": "バイメタル式", "category": "key", "prompt": "［用語？］", "start": 38, "end": 44, "context": "サーマルリレー（熱動継電器）は、主に過負荷による過電流を検出します。一般的なバイメタル式は、電流による熱で金属が曲がる性質を利用します。", "start16": 38, "end16": 44}, {"id": "3-4/53/rows:2:0#0", "fieldID": "3-4/53/rows:2:0", "block": "3-4-a9d3d6053b86", "answer": "サーマルリレー", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "サーマルリレー", "start16": 0, "end16": 7}, {"id": "3-4/57/text#11", "fieldID": "3-4/57/text", "block": "3-4-ce56e7fb455d", "answer": "チャタリング", "category": "key", "prompt": "［用語？］", "start": 11, "end": 17, "context": "接点が小刻みに開閉するチャタリングは、振動・発熱・接点損傷の原因です。点検は電源を適切に遮断して行います。", "start16": 11, "end16": 17}], "rounds": {"all": [["3-4/53/rows:2:0#0", "3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11"], ["3-4/50/text#38", "3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54"], ["3-4/3/rows:1:1#12", "3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76"], ["3-4/49/text#0", "3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110"], ["3-4/2/text#56", "3-4/2/text#50", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:2:0#0"], ["3-4/2/text#50", "3-4/2/text#44", "3-4/31/rows:1:1#36", "3-4/31/rows:0:1#53", "3-4/21/text#0", "3-4/57/text#11", "3-4/6/text#54", "3-4/6/text#76", "3-4/12/text#110", "3-4/53/rows:
