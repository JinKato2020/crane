<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材の暗記クイズ・表示確認</title>
<style>
*{box-sizing:border-box} :root{--bg:#f4f6f9;--card:#fff;--fg:#1a1d22;--muted:#5a6472;--line:#d6dbe3;--key:#185a92;--pale:#e5edf4;--hole:#d1e0ec;--size:16px}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--size)/1.8 -apple-system,BlinkMacSystemFont,"Yu Gothic UI",sans-serif}
body.dark{--bg:#0c0e12;--card:#191d25;--fg:#eef1f6;--muted:#9aa4b4;--line:#2a303c;--key:#8cc9ff;--pale:#172534;--hole:#203c56}
body.large{--size:25px} button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--key);outline-offset:3px}
.lab{max-width:640px;margin:auto;padding:12px 16px;font-size:14px;background:var(--card);border-bottom:1px solid var(--line)}
.lab p{font-size:12px;color:var(--muted);margin:0}.lab select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.lab .options{display:flex;gap:14px;flex-wrap:wrap}.lab label{min-height:44px;display:flex;align-items:center;gap:5px}
main{max-width:640px;margin:auto;padding:22px 20px 32px}h1{font-size:1.3em;line-height:1.65;padding-left:14px;border-left:4px solid #e08a00;margin:10px 0 20px}
h2{font-size:1.18em;border-left:4px solid var(--key);padding-left:12px;margin:32px 0 14px;line-height:1.6}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;background:var(--card)}
.quiz-card{border-color:color-mix(in srgb,var(--key) 22%,var(--bg));background:var(--pale)}
.toggle-row{display:flex;align-items:center;gap:12px;justify-content:space-between}.toggle-row strong{display:block;font-size:1.06em}.muted{color:var(--muted)}
.sub{font-size:.94em;line-height:1.6}.hint{font-size:.81em;color:var(--muted);margin-bottom:0}.category{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.category select{color:var(--key);background:var(--card);border:1px solid var(--line);padding:6px;min-height:44px;max-width:100%;border-radius:8px}
.switch{appearance:none;min-width:52px;width:52px;height:32px;border-radius:20px;background:var(--line);position:relative;margin:0;cursor:pointer}
.switch:before{content:"";position:absolute;left:3px;top:3px;border-radius:100%;width:26px;height:26px;background:white;box-shadow:0 1px 4px #0002}
.switch:checked{background:var(--key)}.switch:checked:before{left:23px}.switch-label{min-height:44px;display:flex;align-items:center}
.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}.paragraph{margin:16px 0}strong{color:var(--key)}
.blank{display:inline;padding:2px 3px;border:0;border-radius:4px;background:var(--hole);color:var(--key);font-weight:700;font-size:inherit;line-height:inherit;white-space:normal;text-decoration:underline;text-underline-offset:3px}
.blank.revealed{background:var(--pale);text-decoration:none}
table{width:100%;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin:18px 0;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:13px 14px;overflow-wrap:anywhere}th{background:var(--pale);font-size:.84em;color:var(--muted)}td{font-size:.94em;border-top:1px solid var(--line)}tr:nth-child(even){background:color-mix(in srgb,var(--pale) 40%,var(--card))}
.number{background:var(--pale);border:0}.number .label{color:var(--muted);font-weight:600;font-size:.88em}.number .value{font-size:1.35em;font-weight:700;margin-top:9px}
.figure img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:white;border-radius:10px}.figure small{display:block;color:var(--muted);font-size:.81em;line-height:1.6;margin-top:8px}
ul{padding-left:22px}li{margin-bottom:12px}.point{background:var(--pale)}.tip,.caution,.lead{background:var(--pale);border:0}.lead .text{font-size:1.12em;font-weight:600}.tag{font-size:.81em;font-weight:bold;color:var(--key);margin-bottom:10px}
details{padding:16px;background:var(--pale);border-radius:12px;margin:18px 0}summary{min-height:44px;align-content:center;color:var(--key);font-weight:600;cursor:pointer}details[open] summary{margin-bottom:12px}
#toolbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);padding:4px 16px 12px;background:var(--card);border-top:1px solid var(--line);z-index:10}
.toolbar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.count{color:var(--key);font-size:.94em;font-weight:600;font-variant-numeric:tabular-nums}
.end{background:none;color:var(--muted);border:0;min-height:44px;min-width:44px;padding:0}
.actions{display:flex;gap:10px}.actions button{border:0;border-radius:12px;min-height:48px;padding:8px 10px;line-height:1.5;font-weight:600}.primary{flex:1;background:var(--key);color:var(--bg)}.secondary{background:var(--pale);color:var(--key);font-size:.94em}

</style>

<script>
const sections=[{"title": "クレーンとは何か――「つり上げる」と「水平に運ぶ」", "blocks": [{"type": "p", "style": "lead", "text": "**動力でつり上げる ＋ 水平に運ぶ。** クレーンを判断するときは、この二つを確かめます。", "id": "1-1-39a0d0d253e9"}, {"type": "sub", "text": "クレーンを判断する二つの条件", "id": "1-1-cf7c091abacb"}, {"type": "p", "text": "クレーンかどうかを考えるときは、二つの動作を確認します。一つ目は、電動機などの**動力**で荷をつり上げること。二つ目は、つり上げた荷を水平に運ぶことです。水平とは、上下ではなく横の方向を指します。移動式クレーンとデリックは、法令上、別の区分として扱います。", "id": "1-1-b8603cfbb9cf", "quizTerms": ["動力", "水平"]}, {"type": "p", "text": "「**動力**」は機械が生み出す力です。電動機は電気の力で回転する機械で、モーターとも呼びます。荷をつり上げる動作には、このような動力が必要です。人が手でチェーンを引いて持ち上げるだけの装置は、この条件を満たしません。", "id": "1-1-e0cd100918d4"}, {"type": "p", "text": "一方、水平に運ぶ動作まで動力で行う必要はありません。例えば、電動ホイストで荷をつり上げ、そのホイストを人が押してレールに沿って移動させる装置も、ほかの条件を満たせばクレーンです。「持ち上げるのは動力、横へ運ぶのは**人力**でもよい」と分けて理解してください。", "id": "1-1-34c4825b88b8", "quizTerms": ["人力"]}, {"type": "p", "text": "上下にしか動かせず、荷を水平に運べない装置は、持ち上げる能力があってもこの定義のクレーンには当たりません。また、定義上、**巻下げ**に動力を使うことは必須条件ではありません。ただし、これは機械を分類するための説明です。荷を自由に落下させてよいという運転上の許可ではありません。", "id": "1-1-8d474c6a1001"}, {"type": "sub", "text": "クレーン・移動式クレーン・デリックの違い", "id": "1-1-6552387962bf"}, {"type": "p", "text": "工場の高い位置に設けたレールに沿って動く**天井クレーン**は、クレーンの代表例です。クレーン自体がレール上を動くことはありますが、不特定の場所へ自走して移動する機械とは区別します。", "id": "1-1-b64856c8925e"}, {"type": "p", "text": "移動式クレーンは、原動機を内蔵し、不特定の場所に移動できる機械です。道路を移動して現場で荷をつるクレーン車を思い浮かべると理解しやすいでしょう。「移動」という名前だけで判断せず、機械の構造と移動の仕方を見ます。", "id": "1-1-5cecf1383cf2"}, {"type": "p", "text": "デリックは、マストと呼ぶ柱、またはブームと呼ぶうでを持ち、別に設置した原動機からワイヤロープを介して操作する装置です。詳しいデリックの知識はクレーン限定の試験範囲から除かれますが、クレーンとの区分は押さえておきましょう。", "id": "1-1-bf14b24527e9"}, {"type": "img", "asset": "1-1_supplement_f01_20261023", "labels": [], "legend": [], "caption": "同じ「つって運ぶ」機械でも、構造によって区分が違う。", "id": "1-1-93ac6fe55502", "style": "figure", "_previewFile": "1-1_supplement_f01_20261023.png", "_width": 1473, "_height": 1068}, {"type": "sub", "text": "0.5 t未満は「クレーンではない」という意味ではない", "id": "1-1-efc0d7b18cbf"}, {"type": "p", "text": "0.5 tは**500 kg**です。つり上げ荷重が0.5 t未満のクレーンは、クレーン等安全規則の適用対象から除かれます。ただし、機械そのものがクレーンではなくなるわけではありません。", "id": "1-1-75d156d9e221", "quizTerms": ["つり上げ荷重", "0.5 t未満"]}, {"type": "p", "text": "ここで比較するのは、その日に運んだ荷の重さではなく、機械の能力を表す「つり上げ荷重」です。能力が1 tのクレーンで100 kgの荷を運んでも、「**500 kg**未満だから規則の対象外」とはなりません。また、「未満」には500 kgちょうどを含みません。", "id": "1-1-ef83aad4dce3"}, {"type": "p", "text": "確認するポイントは、クレーンの定義と、安全規則が適用される範囲を別々に判断することです。", "id": "1-1-8ecb28296737"}], "id": "1-1", "chapter": 1, "fields": [{"id": "1-1/2/text", "raw": "クレーンかどうかを考えるときは、二つの動作を確認します。一つ目は、電動機などの**動力**で荷をつり上げること。二つ目は、つり上げた荷を水平に運ぶことです。水平とは、上下ではなく横の方向を指します。移動式クレーンとデリックは、法令上、別の区分として扱います。", "text": "クレーンかどうかを考えるときは、二つの動作を確認します。一つ目は、電動機などの動力で荷をつり上げること。二つ目は、つり上げた荷を水平に運ぶことです。水平とは、上下ではなく横の方向を指します。移動式クレーンとデリックは、法令上、別の区分として扱います。", "terms": ["動力", "水平"], "block": "1-1-b8603cfbb9cf"}, {"id": "1-1/3/text", "raw": "「**動力**」は機械が生み出す力です。電動機は電気の力で回転する機械で、モーターとも呼びます。荷をつり上げる動作には、このような動力が必要です。人が手でチェーンを引いて持ち上げるだけの装置は、この条件を満たしません。", "text": "「動力」は機械が生み出す力です。電動機は電気の力で回転する機械で、モーターとも呼びます。荷をつり上げる動作には、このような動力が必要です。人が手でチェーンを引いて持ち上げるだけの装置は、この条件を満たしません。", "terms": [], "block": "1-1-e0cd100918d4"}, {"id": "1-1/4/text", "raw": "一方、水平に運ぶ動作まで動力で行う必要はありません。例えば、電動ホイストで荷をつり上げ、そのホイストを人が押してレールに沿って移動させる装置も、ほかの条件を満たせばクレーンです。「持ち上げるのは動力、横へ運ぶのは**人力**でもよい」と分けて理解してください。", "text": "一方、水平に運ぶ動作まで動力で行う必要はありません。例えば、電動ホイストで荷をつり上げ、そのホイストを人が押してレールに沿って移動させる装置も、ほかの条件を満たせばクレーンです。「持ち上げるのは動力、横へ運ぶのは人力でもよい」と分けて理解してください。", "terms": ["人力"], "block": "1-1-34c4825b88b8"}, {"id": "1-1/5/text", "raw": "上下にしか動かせず、荷を水平に運べない装置は、持ち上げる能力があってもこの定義のクレーンには当たりません。また、定義上、**巻下げ**に動力を使うことは必須条件ではありません。ただし、これは機械を分類するための説明です。荷を自由に落下させてよいという運転上の許可ではありません。", "text": "上下にしか動かせず、荷を水平に運べない装置は、持ち上げる能力があってもこの定義のクレーンには当たりません。また、定義上、巻下げに動力を使うことは必須条件ではありません。ただし、これは機械を分類するための説明です。荷を自由に落下させてよいという運転上の許可ではありません。", "terms": [], "block": "1-1-8d474c6a1001"}, {"id": "1-1/7/text", "raw": "工場の高い位置に設けたレールに沿って動く**天井クレーン**は、クレーンの代表例です。クレーン自体がレール上を動くことはありますが、不特定の場所へ自走して移動する機械とは区別します。", "text": "工場の高い位置に設けたレールに沿って動く天井クレーンは、クレーンの代表例です。クレーン自体がレール上を動くことはありますが、不特定の場所へ自走して移動する機械とは区別します。", "terms": [], "block": "1-1-b64856c8925e"}, {"id": "1-1/8/text", "raw": "移動式クレーンは、原動機を内蔵し、不特定の場所に移動できる機械です。道路を移動して現場で荷をつるクレーン車を思い浮かべると理解しやすいでしょう。「移動」という名前だけで判断せず、機械の構造と移動の仕方を見ます。", "text": "移動式クレーンは、原動機を内蔵し、不特定の場所に移動できる機械です。道路を移動して現場で荷をつるクレーン車を思い浮かべると理解しやすいでしょう。「移動」という名前だけで判断せず、機械の構造と移動の仕方を見ます。", "terms": [], "block": "1-1-5cecf1383cf2"}, {"id": "1-1/9/text", "raw": "デリックは、マストと呼ぶ柱、またはブームと呼ぶうでを持ち、別に設置した原動機からワイヤロープを介して操作する装置です。詳しいデリックの知識はクレーン限定の試験範囲から除かれますが、クレーンとの区分は押さえておきましょう。", "text": "デリックは、マストと呼ぶ柱、またはブームと呼ぶうでを持ち、別に設置した原動機からワイヤロープを介して操作する装置です。詳しいデリックの知識はクレーン限定の試験範囲から除かれますが、クレーンとの区分は押さえておきましょう。", "terms": [], "block": "1-1-bf14b24527e9"}, {"id": "1-1/12/text", "raw": "0.5 tは**500 kg**です。つり上げ荷重が0.5 t未満のクレーンは、クレーン等安全規則の適用対象から除かれます。ただし、機械そのものがクレーンではなくなるわけではありません。", "text": "0.5 tは500 kgです。つり上げ荷重が0.5 t未満のクレーンは、クレーン等安全規則の適用対象から除かれます。ただし、機械そのものがクレーンではなくなるわけではありません。", "terms": ["つり上げ荷重", "0.5 t未満"], "block": "1-1-75d156d9e221"}, {"id": "1-1/13/text", "raw": "ここで比較するのは、その日に運んだ荷の重さではなく、機械の能力を表す「つり上げ荷重」です。能力が1 tのクレーンで100 kgの荷を運んでも、「**500 kg**未満だから規則の対象外」とはなりません。また、「未満」には500 kgちょうどを含みません。", "text": "ここで比較するのは、その日に運んだ荷の重さではなく、機械の能力を表す「つり上げ荷重」です。能力が1 tのクレーンで100 kgの荷を運んでも、「500 kg未満だから規則の対象外」とはなりません。また、「未満」には500 kgちょうどを含みません。", "terms": [], "block": "1-1-ef83aad4dce3"}, {"id": "1-1/14/text", "raw": "確認するポイントは、クレーンの定義と、安全規則が適用される範囲を別々に判断することです。", "text": "確認するポイントは、クレーンの定義と、安全規則が適用される範囲を別々に判断することです。", "terms": [], "block": "1-1-8ecb28296737"}], "candidates": [{"id": "1-1/2/text#39", "fieldID": "1-1/2/text", "block": "1-1-b8603cfbb9cf", "answer": "動力", "category": "key", "prompt": "［用語？］", "start": 39, "end": 41, "context": "クレーンかどうかを考えるときは、二つの動作を確認します。一つ目は、電動機などの動力で荷をつり上げること。二つ目は、つり上げた荷を水平に運ぶことです。水平とは、上下ではなく横の方向を指します。移動式クレーンとデリックは、法令上、別の区分として扱います。", "start16": 39, "end16": 41}, {"id": "1-1/2/text#64", "fieldID": "1-1/2/text", "block": "1-1-b8603cfbb9cf", "answer": "水平", "category": "key", "prompt": "［用語？］", "start": 64, "end": 66, "context": "クレーンかどうかを考えるときは、二つの動作を確認します。一つ目は、電動機などの動力で荷をつり上げること。二つ目は、つり上げた荷を水平に運ぶことです。水平とは、上下ではなく横の方向を指します。移動式クレーンとデリックは、法令上、別の区分として扱います。", "start16": 64, "end16": 66}, {"id": "1-1/4/text#106", "fieldID": "1-1/4/text", "block": "1-1-34c4825b88b8", "answer": "人力", "category": "key", "prompt": "［用語？］", "start": 106, "end": 108, "context": "一方、水平に運ぶ動作まで動力で行う必要はありません。例えば、電動ホイストで荷をつり上げ、そのホイストを人が押してレールに沿って移動させる装置も、ほかの条件を満たせばクレーンです。「持ち上げるのは動力、横へ運ぶのは人力でもよい」と分けて理解してください。", "start16": 106, "end16": 108}, {"id": "1-1/12/text#15", "fieldID": "1-1/12/text", "block": "1-1-75d156d9e221", "answer": "つり上げ荷重", "category": "key", "prompt": "［用語？］", "start": 15, "end": 21, "context": "0.5 tは500 kgです。つり上げ荷重が0.5 t未満のクレーンは、クレーン等安全規則の適用対象から除かれます。ただし、機械そのものがクレーンではなくなるわけではありません。", "start16": 15, "end16": 21}, {"id": "1-1/12/text#22", "fieldID": "1-1/12/text", "block": "1-1-75d156d9e221", "answer": "0.5 t未満", "category": "num", "prompt": "［数値？］", "start": 22, "end": 29, "context": "0.5 tは500 kgです。つり上げ荷重が0.5 t未満のクレーンは、クレーン等安全規則の適用対象から除かれます。ただし、機械そのものがクレーンではなくなるわけではありません。", "start16": 22, "end16": 29}], "rounds": {"all": [["1-1/4/text#106", "1-1/2/text#39", "1-1/2/text#64", "1-1/12/text#22", "1-1/12/text#15"], ["1-1/2/text#39", "1-1/2/text#64", "1-1/12/text#22", "1-1/12/text#15", "1-1/4/text#106"], ["1-1/2/text#64", "1-1/12/text#22", "1-1/12/text#15", "1-1/4/text#106", "1-1/2/text#39"], ["1-1/12/text#22", "1-1/12/text#15", "1-1/4/text#106", "1-1/2/text#39", "1-1/2/text#64"], ["1-1/12/text#15", "1-1/4/text#106", "1-1/2/text#39", "1-1/2/text#64", "1-1/12/text#22"]], "key": [["1-1/4/text#106", "1-1/2/text#39", "1-1/2/text#64", "1-1/12/text#15"], ["1-1/2/text#39", "1-1/2/text#64", "1-1/12/text#15", "1-1/4/text#106"], ["1-1/2/text#64", "1-1/12/text#15", "1-1/4/text#106", "1-1/2/text#39"], ["1-1/12/text#15", "1-1/4/text#106", "1-1/2/text#39", "1-1/2/text#64"]], "num": [["1-1/12/text#22"]]}}, {"title": "全体の形と動き――どの部分が動いているのか", "blocks": [{"type": "p", "style": "lead", "text": "**走行は橋全体、横行は橋の上の台車、巻上げはフック。** どの部分が動くかで区別します。", "id": "1-3-c1115c929fc4"}, {"type": "sub", "text": "天井クレーンを「動く橋」として見る", "id": "1-3-f6fb0a7830b2"}, {"type": "p", "text": "工場の両側に、高い位置のレールがあると考えてください。その二本のレールをまたぐように、長い桁が架かっています。この桁を「**ガーダ**」といいます。ガーダの両端を支え、車輪でレール上を動く部分が「サドル」です。", "id": "1-3-45e0b41157f7", "quizTerms": ["サドル"]}, {"type": "p", "text": "ガーダの上には、荷をつる装置を載せた小さな台車があります。この台車が「**トロリ**」です。トロリからワイヤロープが下がり、その先のフックに荷を掛けます。つまり、大きな橋の上を小さな台車が動き、その台車から荷がつられている形です。", "id": "1-3-e7655746ca7a"}, {"type": "svg", "file": "1-3.svg", "caption": "上下・横行・走行・起伏・旋回。矢印の向きと、動く部分を対応させる。", "id": "1-3-2b73d7fdb4a2", "style": "figure", "_previewFile": "1-3.svg"}, {"id": "1-3-rev26-motions", "type": "table", "headers": ["運動", "どこが動く？"], "rows": [["**巻上げ・巻下げ**", "フックや荷が上下する"], ["**横行**", "トロリがガーダなどに沿って動く"], ["**走行**", "クレーン全体が走行レールに沿って動く"], ["**起伏**", "ジブを起こす・伏せる"], ["**旋回**", "ジブなどが旋回中心のまわりに回る"]], "quizTerms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"]}, {"type": "p", "text": "図は、まずフックと荷を見てください。これが上下する動きが巻上げ・巻下げです。次に、ガーダ上のトロリを見ます。トロリだけがガーダに沿って動くのが横行です。最後に、ガーダと両端のサドルを一体として見ます。この大きな橋全体が、左右の**走行レール**に沿って動くのが走行です。", "id": "1-3-209ac4b154a6"}, {"type": "p", "text": "横行も走行も荷を横へ運ぶ動きですが、動く機械の範囲が違います。「横に動くから横行」と判断せず、「**トロリ**が動くのか、クレーン全体が動くのか」で見分けましょう。", "id": "1-3-c6ad14519021"}, {"type": "sub", "text": "巻上げ・巻下げ", "id": "1-3-605e22c3d30a"}, {"type": "p", "text": "荷やつり具を上へ動かすのが**巻上げ**、下へ動かすのが巻下げです。ロープ式では、ドラムという円筒にロープを巻き取るとフックが上がり、ロープを払い出すとフックが下がります。", "id": "1-3-560960cedd22", "quizTerms": ["ドラム"]}, {"type": "p", "text": "上げる動きと下げる動きの両方を担当していても、装置の名称はまとめて「巻上装置」と呼びます。「巻上装置だから下げることはできない」という意味ではありません。", "id": "1-3-991f2b430c08"}, {"type": "sub", "text": "横行と走行", "id": "1-3-c0da18ca9ceb"}, {"type": "p", "text": "横行は、トロリやホイストがガーダなどの走路に沿って移動する動きです。天井クレーンでは、工場を横切る向きに台車が動く場面を考えると分かりやすいでしょう。**ケーブルクレーン**では、塔の間に張った主索に沿ってトロリが横行します。", "id": "1-3-634baf3d0ab8"}, {"type": "p", "text": "走行は、クレーン全体が走行路に沿って移動する動きです。一般的な**天井クレーン**では、横行と走行の向きは直角になります。ただし、これはその形式の配置です。すべてのクレーンに共通する定義として「必ず直角」と覚えるのではなく、動く対象で区別してください。", "id": "1-3-c73a8c6f92fc"}, {"type": "sub", "text": "起伏と旋回", "id": "1-3-0720af5c7fce"}, {"type": "p", "text": "クレーンのうでに当たる部分を「ジブ」といいます。ジブを付け根から起こしたり伏せたりする動きが「**起伏**」です。人が腕を前に出して、その腕を上げ下げする様子に似ています。ジブを起こすと傾斜角が大きくなり、伏せると小さくなります。", "id": "1-3-e64a2332dcea"}, {"type": "p", "text": "「**旋回**」は、旋回中心のまわりでジブなどの向きを変える動きです。腕を上げ下げするのが起伏、体ごと向きを変えるようにうでを回すのが旋回、と区別すると理解しやすくなります。", "id": "1-3-f479b6638bf5"}, {"type": "p", "text": "巻上げ・巻下げ、横行、走行、起伏、旋回が基本の五つの運動です。すべてのクレーンが五つを全部行うわけではありません。例えば、一般的な**天井クレーン**の基本は巻上げ・巻下げ、横行、走行です。", "id": "1-3-6ea433fc9e0b"}], "id": "1-3", "chapter": 1, "fields": [{"id": "1-3/2/text", "raw": "工場の両側に、高い位置のレールがあると考えてください。その二本のレールをまたぐように、長い桁が架かっています。この桁を「**ガーダ**」といいます。ガーダの両端を支え、車輪でレール上を動く部分が「サドル」です。", "text": "工場の両側に、高い位置のレールがあると考えてください。その二本のレールをまたぐように、長い桁が架かっています。この桁を「ガーダ」といいます。ガーダの両端を支え、車輪でレール上を動く部分が「サドル」です。", "terms": ["サドル"], "block": "1-3-45e0b41157f7"}, {"id": "1-3/3/text", "raw": "ガーダの上には、荷をつる装置を載せた小さな台車があります。この台車が「**トロリ**」です。トロリからワイヤロープが下がり、その先のフックに荷を掛けます。つまり、大きな橋の上を小さな台車が動き、その台車から荷がつられている形です。", "text": "ガーダの上には、荷をつる装置を載せた小さな台車があります。この台車が「トロリ」です。トロリからワイヤロープが下がり、その先のフックに荷を掛けます。つまり、大きな橋の上を小さな台車が動き、その台車から荷がつられている形です。", "terms": [], "block": "1-3-e7655746ca7a"}, {"id": "1-3/5/rows:0:0", "raw": "**巻上げ・巻下げ**", "text": "巻上げ・巻下げ", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:0:1", "raw": "フックや荷が上下する", "text": "フックや荷が上下する", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:1:0", "raw": "**横行**", "text": "横行", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:1:1", "raw": "トロリがガーダなどに沿って動く", "text": "トロリがガーダなどに沿って動く", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:2:0", "raw": "**走行**", "text": "走行", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:2:1", "raw": "クレーン全体が走行レールに沿って動く", "text": "クレーン全体が走行レールに沿って動く", "terms": ["ガーダ", "トロリ", "横行", "走行", "起伏", "旋回"], "block": "1-3-rev26-motions"}, {"id": "1-3/5/rows:3: "category": "key", "prompt": "［用語？］", "start": 4, "end": 7, "context": "トロリがガーダなどに沿って動く", "start16": 4, "end16": 7}, {"id": "1-3/5/rows:2:0#0", "fieldID": "1-3/5/rows:2:0", "block": "1-3-rev26-motions", "answer": "走行", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "走行", "start16": 0, "end16": 2}, {"id": "1-3/5/rows:3:0#0", "fieldID": "1-3/5/rows:3:0", "block": "1-3-rev26-motions", "answer": "起伏", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "起伏", "start16": 0, "end16": 2}, {"id": "1-3/5/rows:4:0#0", "fieldID": "1-3/5/rows:4:0", "block": "1-3-rev26-motions", "answer": "旋回", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "旋回", "start16": 0, "end16": 2}, {"id": "1-3/9/text#37", "fieldID": "1-3/9/text", "block": "1-3-560960cedd22", "answer": "ドラム", "category": "key", "prompt": "［用語？］", "start": 37, "end": 40, "context": "荷やつり具を上へ動かすのが巻上げ、下へ動かすのが巻下げです。ロープ式では、ドラムという円筒にロープを巻き取るとフックが上がり、ロープを払い出すとフックが下がります。", "start16": 37, "end16": 40}], "rounds": {"all": [["1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94"], ["1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0"], ["1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0"], ["1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:1:1#0", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:1:0#0", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4"], ["1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0"]], "key": [["1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94"], ["1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0"], ["1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0"], ["1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:1:1#0", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:1:0#0", "1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37"], ["1-3/5/rows:2:0#0", "1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4"], ["1-3/2/text#94", "1-3/5/rows:4:0#0", "1-3/5/rows:3:0#0", "1-3/9/text#37", "1-3/5/rows:1:1#4", "1-3/5/rows:2:0#0"]], "num": [[]]}}, {"title": "基本用語――荷重・距離・角度を分けて読む", "blocks": [{"type": "p", "style": "lead", "text": "**つり上げ荷重は機械の能力、定格荷重はその条件でつれる荷の上限。** 名前の似た二つを分けて覚えます。", "id": "1-2-5fe41143fad5"}, {"type": "sub", "text": "つり上げ荷重と定格荷重", "id": "1-2-96062aafe700"}, {"type": "p", "text": "荷をつっている機械には、荷そのものの重さに加えて、フックや**グラブバケット**などのつり具の重さも掛かります。「つり上げ荷重」は、そのクレーンの構造や材料に応じて負荷できる最大の荷重を表す用語で、つり具の重量に相当する荷重を含めて考えます。", "id": "1-2-fe29ebf0fe2f", "quizTerms": ["つり上げ荷重"]}, {"type": "p", "text": "「定格荷重」は、その条件で負荷できる最大荷重から、フックや**グラブバケット**などのつり具の重量に相当する荷重を差し引いた値です。ジブのないクレーンでは、次の関係になります。", "id": "1-2-eaad95d820e4", "quizTerms": ["定格荷重"]}, {"type": "p", "text": "定格荷重＝**つり上げ荷重**－つり具の重量に相当する荷重", "id": "1-2-8a16221bd33c"}, {"type": "svg", "file": "1-2_lifting_load.svg", "caption": "つり上げ荷重と定格荷重", "id": "1-2-009c83cc7f78", "style": "figure", "_previewFile": "1-2_lifting_load.svg"}, {"type": "p", "text": "ジブを持たないクレーンで、つり上げ荷重が**10.0 t**、つり具分が**0.5 t**なら、定格荷重は10.0−0.5＝**9.5 t**です。図と同じ数値で、つり具分を引いて確かめます。", "id": "1-2-70775bc19db7"}, {"type": "p", "text": "この9.5 tには、荷物のほかに玉掛け用ロープや補助つり具の負担も数えます。能力を確認するときは、**荷物だけの重さで判断しない**ことが大切です。", "id": "1-2-34ae5e33e370"}, {"type": "sub", "text": "ジブクレーンは、姿勢によって定格荷重が変わる", "id": "1-2-ed0777881095"}, {"type": "p", "text": "長い棒の先に重い物を付けて持つと、体から遠くなるほど支えにくくなります。**ジブクレーン**も、荷をつる位置が旋回中心から遠くなると、ジブや機体に作用する負担が変わります。", "id": "1-2-e734a02d6338"}, {"type": "p", "text": "そのため、**ジブクレーン**の定格荷重は、ジブの長さや角度、トロリの位置などの条件に応じて決まります。機械の最大能力を示す数字と、今の姿勢でつってよい数字は同じとは限りません。現在の条件に対応する荷重表で定格荷重を確認します。", "id": "1-2-c8aedd83e4ce"}, {"type": "svg", "file": "1-2_radius_overload.svg", "caption": "作業半径と過負荷。数値は説明用の例。機械の姿勢は模式。実際の機種・ジブ長さ・姿勢に対応した定格荷重表を確認する", "id": "1-2-e739a3c591c4", "style": "figure", "_previewFile": "1-2_radius_overload.svg"}, {"type": "p", "text": "図は、同じ8 tの荷をつる二つの条件を比べています。**作業半径**15 mでは定格荷重10 tなので、8 tはその範囲内です。一方、作業半径35 mでは定格荷重5 tなので、同じ8 tでも過負荷です。", "id": "1-2-f49aff93dfb4"}, {"type": "p", "text": "荷の重さが変わらなくても、機械の使い方が変われば能力の範囲を超えることがあります。図の荷重曲線は説明用の例で、すべての**ジブクレーン**がこの数値になるわけではありません。", "id": "1-2-983983d6060e"}, {"type": "sub", "text": "定格速度", "id": "1-2-f1f48d6f0307"}, {"type": "p", "text": "「定格速度」は、**定格荷重**に相当する荷をつって運動させるときの、それぞれの最高速度です。巻上げ、横行、走行などは別々の動きなので、速度もそれぞれに定められます。", "id": "1-2-04e642d579a6", "quizTerms": ["定格速度"]}, {"type": "p", "text": "空のフックで動かしたときの速さを見て、その値を**定格速度**と決めるのではありません。「どの荷重条件で、どの運動を行うときの速度か」を確認します。", "id": "1-2-5eda4bc1ee21"}, {"type": "sub", "text": "スパンと揚程", "id": "1-2-e9a99cd75e0d"}, {"type": "p", "text": "スパンは**走行レールの中心間**の距離で、クレーン全体がまたぐ幅を表します。トロリが横行する側のレールや車輪の間隔(ゲージ)、ガーダ材料の端から端までの長さとは別物なので、どの寸法を指しているかを読み分けます。", "id": "1-2-aba9917752d0", "quizTerms": ["走行レールの中心間"]}, {"type": "p", "text": "「**揚程**」は、つり具を有効に上げ下げできる上限位置から下限位置までの垂直距離です。今のフックが床から何mの高さにあるかを表す言葉ではありません。フックが動ける上下の範囲を表します。", "id": "1-2-152de1f8c6f4", "quizTerms": ["揚程"]}, {"type": "p", "text": "**スパン**は横の距離、揚程は縦の距離です。どちらも「長さ」ですが、測る方向と両端の位置が違います。", "id": "1-2-32c377eb63c1"}, {"type": "svg", "file": "1-2_supplement_f02_20261023.svg", "caption": "スパンは走行レールの中心間、揚程はつり具の上限から下限まで。同じ部分の位置を比べる。", "id": "1-2-a7e5395a3345", "style": "figure", "_previewFile": "1-2_supplement_f02_20261023.svg"}, {"type": "sub", "text": "作業半径とジブ傾斜角", "id": "1-2-7c8f021ebaea"}, {"type": "p", "text": "「**作業半径**」は、旋回中心からつり上げ装置の中心までの水平距離です。ジブの斜めの長さではありません。荷をつる位置が、旋回中心から横方向にどれだけ離れているかを表します。", "id": "1-2-4cddf2f6fd21", "quizTerms": ["作業半径"]}, {"type": "p", "text": "「**ジブ傾斜角**」は、ジブの中心線と水平面のなす角です。鉛直線との角度ではなく、水平を基準に測ります。", "id": "1-2-54c3a229e03d", "quizTerms": ["ジブ傾斜角"]}, {"type": "svg", "file": "1-2_jib_radius.svg", "caption": "ジブ傾斜角と作業半径", "id": "1-2-3baa6281d600", "style": "figure", "_previewFile": "1-2_jib_radius.svg"}, {"type": "p", "text": "左右の図は、同じ長さのジブを別の角度にした例です。左のようにジブを起こすと、先端は上へ移り、横へ張り出す距離は短くなります。そのため、傾斜角は大きく、**作業半径**は小さくなります。右のようにジブを伏せると、先端が横へ遠くなり、傾斜角は小さく、作業半径は大きくなります。", "id": "1-2-be634a8c9c90"}, {"type": "p", "text": "同じジブ長さなら、**起こすと半径が小さくなり、伏せると大きくなります**。まずこの関係を図でつかみましょう。", "id": "1-2-a3feaff78159"}, {"type": "sub", "text": "寄り・インチング・地切り・キャンバ", "id": "1-2-915a02e2126b"}, {"type": "p", "text": "「寄り」は、トロリをガーダの端へできるだけ寄せたときのつり具の横行停止位置と、近い側の**走行レール**中心との最小水平距離です（天井クレーンでは、走行レール中心とつり具中心との最小水平距離）。壁ぎわの荷にフックをどこまで近づけられるかを考える際の用語です。", "id": "1-2-103bea0ef107", "quizTerms": ["寄り"]}, {"type": "p", "text": "**スパン**がクレーンのまたぐ幅なのに対し、寄りは端付近でどこまで近づけるかを表します。", "id": "1-2-49fc658c6257"}, {"type": "p", "text": "「**インチング**」は、制御器や押しボタンを短い時間ずつ操作して、小刻みに動かす運転です。フックの位置を少し合わせたいときの微小な移動をイメージしてください。低速で長く動かし続けることと、短い操作を断続的に行うことは区別します。", "id": "1-2-6d78ce0e1871", "quizTerms": ["インチング"]}, {"type": "p", "text": "「**地切り**」は、巻上げによって荷が地面から離れることです。床が支えていた荷を、クレーンが支える状態へ移る瞬間です。少し離れたところでいったん止め、荷の傾きや玉掛け状態、ブレーキの保持状態などを確認します。", "id": "1-2-76203b3ba55f", "quizTerms": ["地切り"]}, {"type": "p", "text": "「**キャンバ**」は、ガーダにあらかじめ付けておく上向きのそりです。荷をつると桁は下へたわむので、その変形を考慮して上向きのそりを設けます。荷をつっても全くたわまない、という意味ではありません。", "id": "1-2-130b8aa6fdc3", "quizTerms": ["キャンバ"]}, {"type": "img", "asset": "1-2_camber_concept21", "caption": "キャンバは無負荷時の上向きのそり。荷をつると、荷重によってはりが下向きにたわむ。", "id": "1-2-e57a172e3586", "style": "figure", "_previewFile": "1-2_camber_concept21.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "「玉掛け」は、荷をつるための用具をフックに掛けたり外したりする作業です。クレーンを運転する資格と、玉掛け作業に必要な資格・教育は別です。運転士免許を持っているだけで、すべての玉掛け作業を行えるわけではありません。", "id": "1-2-c54211758d74"}, {"type": "sub", "text": "ランウェイと走行レールのちがい", "id": "1-2-72ef220485a9"}, {"type": "p", "text": "「走行レール」は、クレーン全体が走るためにしかれた1本のレールそのものを指します。いっぽう「**ランウェイ**」は、その走行レールを支える受け桁・レール・継ぎ目・固定ボルトなどをまとめた、走行のための軌道全体を指す言葉です。", "id": "1-2-56c638f2fb7f", "quizTerms": ["ランウェイ"]}, {"type": "p", "text": "試験では、1本のレールの話か、支える構造まで含めた軌道全体の話かを区別して問われることがあります。「レール」という語が出たら、どちらを指しているか読み分けましょう。", "id": "1-2-8f71aceb2183"}, {"type": "img", "asset": "1-2_runway_rail_readable21", "caption": "ランウェイと走行レール。赤の細長い部材＝走行レール　｜　受け桁・支持・継目・固定部を含む範囲＝ランウェイ", "legend": [], "labels": [], "id": "1-2-e4111c2e5ac2", "style": "figure", "_previewFile": "1-2_runway_rail_readable21.png", "_width": 2000, "_height": 1450}, {"type": "sub", "text": "形式によって変わる作業範囲", "id": "1-2-a09c3accf748"}, {"type": "svg", "file": "1-2_supplement_f03_20261023.svg", "caption": "荷のつり位置が動ける範囲の模式図。固定ジブの実際の範囲は旋回制限・作業半径などで決まる。", "id": "1-2-8d699d07a661", "style": "figure", "_previewFile": "1-2_supplement_f03_20261023.svg"}, {"type": "sub", "id": "lesson-radius-projection", "text": "応用：ジブの長さから作業半径を求める"}, {"id": "1-2-rev26-projection", "type": "svg", "file": "1-2_radius_projection_20261106.svg", "caption": "2mと、ジブの水平分5mを足す。角度は水平面から測る。", "style": "figure", "_previewFile": "1-2_radius_projection_20261106.svg"}, {"type": "p", "text": "斜めの長さから水平の長さを求める割合が**cos（コサイン）**です。ここでは、問題で与えられたcos60°＝0.5を使います。10mのジブの水平分は、10×0.5＝5mです。", "id": "1-2-0911e666aa5d"}, {"type": "p", "text": "**作業半径＝支点までの水平距離＋ジブの水平分**。旋回中心とジブの付け根がずれていれば、その距離も足します。", "id": "1-2-586b36b681ab"}, {"type": "p", "text": "図では、旋回中心から支点まで2m、ジブ長10m、傾斜角60°です。作業半径は2＋10×0.5＝**7m**。角度は水平面から測ります。", "id": "1-2-e2d7f9876e98"}], "id": "1-2", "chapter": 1, "fields": [{"id": "1-2/2/text", "raw": "荷をつっている機械には、荷そのものの重さに加えて、フックや**グラブバケット**などのつり具の重さも掛かります。「つり上げ荷重」は、そのクレーンの構造や材料に応じて負荷できる最大の荷重を表す用語で、つり具の重量に相当する荷重を含めて考えます。", "text": "荷をつっている機械には、荷そのものの重さに加えて、フックやグラブバケットなどのつり具の重さも掛かります。「つり上げ荷重」は、そのクレーンの構造や材料に応じて負荷できる最大の荷重を表す用語で、つり具の重量に相当する荷重を含めて考えます。", "terms": ["つり上げ荷重"], "block": "1-2-fe29ebf0fe2f"}, {"id": "1-2/3/text", "raw": "「定格荷重」は、その条件で負荷できる最大荷重から、フックや**グラブバケット**などのつり具の重量に相当する荷重を差し引いた値です。ジブのないクレーンでは、次の関係になります。", "text": "「定格荷重」は、その条件で負荷できる最大荷重から、フックやグラブバケットなどのつり具の重量に相当する荷重を差し引いた値です。ジブのないクレーンでは、次の関係になります。", "terms": ["定格荷重"], "block": "1-2-eaad95d820e4"}, {"id": "1-2/4/text", "raw": "定格荷重＝**つり上げ荷重**－つり具の重量に相当する荷重", "text": "定格荷重＝つり上げ荷重－つり具の重量に相当する荷重", "terms": [], "block": "1-2-8a16221bd33c"}, {"id": "1-2/6/text", "raw": "ジブを持たないクレーンで、つり上げ荷重が**10.0 t**、つり具分が**0.5 t**なら、定格荷重は10.0−0.5＝**9.5 t**です。図と同じ数値で、つり具分を引いて確かめます。", "text": "ジブを持たないクレーンで、つり上げ荷重が10.0 t、つり具分が0.5 tなら、定格荷重は10.0−0.5＝9.5 tです。図と同じ数値で、つり具分を引いて確かめます。", "terms": [], "block": "1-2-70775bc19db7"}, {"id": "1-2/7/text", "raw": "この9.5 tには、荷物のほかに玉掛け用ロープや補助つり具の負担も数えます。能力を確認するときは、**荷物だけの重さで判断しない**ことが大切です。", "text": "この9.5 tには、荷物のほかに玉掛け用ロープや補助つり具の負担も数えます。能力を確認するときは、荷物だけの重さで判断しないことが大切です。", "terms": [], "block": "1-2-34ae5e33e370"}, {"id": "1-2/9/text", "raw": "長い棒の先に重い物を付けて持つと、体から遠くなるほど支えにくくなります。**ジブクレーン**も、荷をつる位置が旋回中心から遠くなると、ジブや機体に作用する負担が変わります。", "text": "長い棒の先に重い物を付けて持つと、体から遠くなるほど支えにくくなります。ジブクレーンも、荷をつる位置が旋回中心から遠くなると、ジブや機体に作用する負担が変わります。", "terms": [], "block": "1-2-e734a02d6338"}, {"id": "1-2/10/text", "raw": "そのため、**ジブクレーン**の定格荷重は、ジブの長さや角度、トロリの位置などの条件に応じて決まります。機械の最大能力を示す数字と、今の姿勢でつってよい数字は同じとは限りません。現在の条件に対応する荷重表で定格荷重を確認します。", "text": "そのため、ジブクレーンの定格荷重は、ジブの長さや角度、トロリの位置などの条件に応じて決まります。機械の最大能力を示す数字と、今の姿勢でつってよい数字は同じとは限りません。現在の条件に対応する荷重表で定格荷重を確認します。", "terms": [], "block": "1-2-c8aedd83e4ce"}, {"id": "1-2/12/text", "raw": "図は、同じ8 tの荷をつる二つの条件を比べています。**作業半径**15 mでは定格荷重10 tなので、8 tはその範囲内です。一方、作業半径35 mでは定格荷重5 tなので、同じ8 tでも過負荷です。", "text": "図は、同じ8 tの荷をつる二つの条件を比べています。作業半径15 mでは定格荷重10 tなので、8 tはその範囲内です。一方、作業半径35 mでは定格荷重5 tなので、同じ8 tでも過負荷です。", "terms": [], "block": "1-2-f49aff93dfb4"}, {"id": "1-2/13/text", "raw": "荷の重さが変わらなくても、機械の使い方が変われば能力の範囲を超えることがあります。図の荷重曲線は説明用の例で、すべての**ジブクレーン**がこの数値になるわけではありません。", "text": "荷の重さが変わらなくても、機械の使い方が変われば能力の範囲を超えることがあります。図の荷重曲線は説明用の例で、すべてのジブクレーンがこの数値になるわけではありません。", "terms": [], "block": "1-2-983983d6060e"}, {"id": "1-2/15/text", "raw": "「定格速度」は、**定格荷重**に相当する荷をつって運動させるときの、それぞれの最高速度です。巻上げ、横行、走行などは別々の動きなので、速度もそれぞれに定められます。", "text": "「定格速度」は、定格荷重に相当する荷をつって運動させるときの、それぞれの最高速度です。巻上げ、横行、走行などは別々の動きなので、速度もそれぞれに定められます。", "terms": ["定格速度"], "block": "1-2-04e642d579a6"}, {"id": "1-2/16/text", "raw": "空のフックで動かしたときの速さを見て、その値を**定格速度**と決めるのではありません。「どの荷重条件で、どの運動を行うときの速度か」を確認します。", "text": "空のフックで動かしたときの速さを見て、その値を定格速度と決めるのではありません。「どの荷重条件で、どの運動を行うときの速度か」を確認します。", "terms": [], "block": "1-2-5eda4bc1ee21"}, {"id": "1-2/18/text", "raw": "スパンは**走行レールの中心間**の距離で、クレーン全体がまたぐ幅を表します。トロリが横行する側のレールや車輪の間隔(ゲージ)、ガーダ材料の端から端までの長さとは別物なので、どの寸法を指しているかを読み分けます。", "text": "スパンは走行レールの中心間の距離で、クレーン全体がまたぐ幅を表します。トロリが横行する側のレールや車輪の間隔(ゲージ)、ガーダ材料の端から端までの長さとは別物なので、どの寸法を指しているかを読み分けます。", "terms": ["走行レールの中心間"], "block": "1-2-aba9917752d0"}, {"id": "1-2/19/text", "raw": "「**揚程**」は、つり具を有効に上げ下げできる上限位置から下限位置までの垂直距離です。今のフックが床から何mの高さにあるかを表す言葉ではありません。フックが動ける上下の範囲を表します。", "text": "「揚程」は、つり具を有効に上げ下げできる上限位置から下限位置までの垂直距離です。今のフックが床から何mの高さにあるかを表す言葉ではありません。フックが動ける上下の範囲を表します。", "terms": ["揚程"], "block": "1-2-152de1f8c6f4"}, {"id": "1-2/20/text", "raw": "**スパン**は横の距離、揚程は縦の距離です。どちらも「長さ」ですが、測る方向と両端の位置が違います。", "text": "スパンは横の距離、揚程は縦の距離です。どちらも「長さ」ですが、測る方向と両端の位置が違います。", "terms": [], "block": "1-2-32c377eb63c1"}, {"id": "1-2/23/text", "raw": "「**作業半径**」は、旋回中心からつり上げ装置の中心までの水平距離です。ジブの斜めの長さではありません。荷をつる位置が、旋回中心から横方向にどれだけ離れているかを表します。", "text": "「作業半径」は、旋回中心からつり上げ装置の中心までの水平距離です。ジブの斜めの長さではありません。荷をつる位置が、旋回中心から横方向にどれだけ離れているかを表します。", "terms": ["作業半径"], "block": "1-2-4cddf2f6fd21"}, {"id": "1-2/24/text", "raw": "「**ジブ傾斜角**」は、ジブの中心線と水平面のなす角です。鉛直線との角度ではなく、水平を基準に測ります。", "text": "「ジブ傾斜角」は、ジブの中心線と水平面のなす角です。鉛直線との角度ではなく、水平を基準に測ります。", "terms": ["ジブ傾斜角"], "block": "1-2-54c3a229e03d"}, {"id": "1-2/26/text", "raw": "左右の図は、同じ長さのジブを別の角度にした例です。左のようにジブを起こすと、先端は上へ移り、横へ張り出す距離は短くなります。そのため、傾斜角は大きく、**作業半径**は小さくなります。右のようにジブを伏せると、先端が横へ遠くなり、傾斜角は小さく、作業半径は大きくなります。", "text": "左右の図は、同じ長さのジブを別の角度にした例です。左のようにジブを起こすと、先端は上へ移り、横へ張り出す距離は短くなります。そのため、傾斜角は大きく、作業半径は小さくなります。右のようにジブを伏せると、先端が横へ遠くなり、傾斜角は小さく、作業半径は大きくなります。", "terms": [], "block": "1-2-be634a8c9c90"}, {"id": "1-2/27/text", "raw": "同じジブ長さなら、**起こすと半径が小さくなり、伏せると大きくなります**。まずこの関係を図でつかみましょう。", "text": "同じジブ長さなら、起こすと半径が小さくなり、伏せると大きくなります。まずこの関係を図でつかみましょう。", "terms": [], "block": "1-2-a3feaff78159"}, {"id": "1-2/29/text", "raw": "「寄り」は、トロリをガーダの端へできるだけ寄せたときのつり具の横行停止位置と、近い側の**走行レール**中心との最小水平距離です（天井クレーンでは、走行レール中心とつり具中心との最小水平距離）。壁ぎわの荷にフックをどこまで近づけられるかを考える際の用語です。", "text": "「寄り」は、トロリをガーダの端へできるだけ寄せたときのつり具の横行停止位置と、近い側の走行レール中心との最小水平距離です（天井クレーンでは、走行レール中心とつり具中心との最小水平距離）。壁ぎわの荷にフックをどこまで近づけられるかを考える際の用語です。", "terms": ["寄り"], "block": "1-2-103bea0ef107"}, {"id": "1-2/30/text", "raw": "**スパン**がクレーンのまたぐ幅なのに対し、寄りは端付近でどこまで近づけるかを表します。", "text": "スパンがクレーンのまたぐ幅なのに対し、寄りは端付近でどこまで近づけるかを表します。", "terms": [], "block": "1-2-49fc658c6257"}, {"id": "1-2/31/text", "raw": "「**インチング**」は、制御器や押しボタンを短い時間ずつ操作して、小刻みに動かす運転です。フックの位置を少し合わせたいときの微小な移動をイメージしてください。低速で長く動かし続けることと、短い操作を断続的に行うことは区別します。", "text": "「インチング」は、制御器や押しボタンを短い時間ずつ操作して、小刻みに動かす運転です。フックの位置を少し合わせたいときの微小な移動をイメージしてください。低速で長く動かし続けることと、短い操作を断続的に行うことは区別します。", "terms": ["インチング"], "block": "1-2-6d78ce0e1871"}, {"id": "1-2/32/text", "raw": "「**地切り**」は、巻上げによって荷が地面から離れることです。床が支えていた荷を、クレーンが支える状態へ移る瞬間です。少し離れたところでいったん止め、荷の傾きや玉掛け状態、ブレーキの保持状態などを確認します。", "text": "「地切り」は、巻上げによって荷が地面から離れることです。床が支えていた荷を、クレーンが支える状態へ移る瞬間です。少し離れたところでいったん止め、荷の傾きや玉掛け状態、ブレーキの保持状態などを確認します。", "terms": ["地切り"], "block": "1-2-76203b3ba55f"}, {"id": "1-2/33/text", "raw": "「**キャンバ**」は、ガーダにあらかじめ付けておく上向きのそりです。荷をつると桁は下へたわむので、その変形を考慮して上向きのそりを設けます。荷をつっても全くたわまない、という意味ではありません。", "text": "「キャンバ」は、ガーダにあらかじめ付けておく上向きのそりです。荷をつると桁は下へたわむので、その変形を考慮して上向きのそりを設けます。荷をつっても全くたわまない、という意味ではありません。", "terms": ["キャンバ"], "block": "1-2-130b8aa6fdc3"}, {"id": "1-2/35/text", "raw": "「玉掛け」は、荷をつるための用具をフックに掛けたり外したりする作業です。クレーンを運転する資格と、玉掛け作業に必要な資格・教育は別です。運転士免許を持っているだけで、すべての玉掛け作業を行えるわけではありません。", "text": "「玉掛け」は、荷をつるための用具をフックに掛けたり外したりする作業です。クレーンを運転する資格と、玉掛け作業に必要な資格・教育は別です。運転士免許を持っているだけで、すべての玉掛け作業を行えるわけではありません。", "terms": [], "block": "1-2-c54211758d74"}, {"id": "1-2/37/text", "raw": "「走行レール」は、クレーン全体が走るためにしかれた1本のレールそのものを指します。いっぽう「**ランウェイ**」は、その走行レールを支える受け桁・レール・継ぎ目・固定ボルトなどをまとめた、走行のための軌道全体を指す言葉です。", "text": "「走行レール」は、クレーン全体が走るためにしかれた1本のレールそのものを指します。いっぽう「ランウェイ」は、その走行レールを支える受け桁・レール・継ぎ目・固定ボルトなどをまとめた、走行のための軌道全体を指す言葉です。", "terms": ["ランウェイ"], "block": "1-2-56c638f2fb7f"}, {"id": "1-2/38/text", "raw": "試験では、1本のレールの話か、支える構造まで含めた軌道全体の話かを区別して問われることがあります。「レール」という語が出たら、どちらを指しているか読み分けましょう。", "text": "試験では、1本のレールの話か、支える構造まで含めた軌道全体の話かを区別して問われることがあります。「レール」という語が出たら、どちらを指しているか読み分けましょう。", "terms": [], "block": "1-2-8f71aceb2183"}, {"id": "1-2/44/text", "raw": "斜めの長さから水平の長さを求める割合が**cos（コサイン）**です。ここでは、問題で与えられたcos60°＝0.5を使います。10mのジブの水平分は、10×0.5＝5mです。", "text": "斜めの長さから水平の長さを求める割合がcos（コサイン）です。ここでは、問題で与えられたcos60°＝0.5を使います。10mのジブの水平分は、10×0.5＝5mです。", "terms": [], "block": "1-2-0911e666aa5d"}, {"id": "1-2/45/text", "raw": "**作業半径＝支点までの水平距離＋ジブの水平分**。旋回中心とジブの付け根がずれていれば、その距離も足します。", "text": "作業半径＝支点までの水平距離＋ジブの水平分。旋回中心とジブの付け根がずれていれば、その距離も足します。", "terms": [], "block": "1-2-586b36b681ab"}, {"id": "1-2/46/text", "raw": "図では、旋回中心から支点まで2m、ジブ長10m、傾斜角60°です。作業半径は2＋10×0.5＝**7m**。角度は水平面から測ります。", "text": "図では、旋回中心から支点まで2m、ジブ長10m、傾斜角60°です。作業半径は2＋10×0.5＝7m。角度は水平面から測ります。", "terms": [], "block": "1-2-e2d7f9876e98"}], "candidates": [{"id": "1-2/2/text#53", "fieldID": "1-2/2/text", "block": "1-2-fe29ebf0fe2f", "answer": "つり上げ荷重", "category": "key", "prompt": "［用語？］", "start": 53, "end": 59, "context": "荷をつっている機械には、荷そのものの重さに加えて、フックやグラブバケットなどのつり具の重さも掛かります。「つり上げ荷重」は、そのクレーンの構造や材料に応じて負荷できる最大の荷重を表す用語で、つり具の重量に相当する荷重を含めて考えます。", "start16": 53, "end16": 59}, {"id": "1-2/3/text#1", "fieldID": "1-2/3/text", "block": "1-2-eaad95d820e4", "answer": "定格荷重", "category": "key", "prompt": "［用語？］", "start": 1, "end": 5, "context": "「定格荷重」は、その条件で負荷できる最大荷重から、フックやグラブバケットなどのつり具の重量に相当する荷重を差し引いた値です。ジブのないクレーンでは、次の関係になります。", "start16": 1, "end16": 5}, {"id": "1-2/15/text#1", "fieldID": "1-2/15/text", "block": "1-2-04e642d579a6", "answer": "定格速度", "category": "key", "prompt": "［用語？］", "start": 1, "end": 5, "context": "「定格速度」は、定格荷重に相当する荷をつって運動させるときの、それぞれの最高速度です。巻上げ、横行、走行などは別々の動きなので、速度もそれぞれに定められます。", "start16": 1, "end16": 5}, {"id": "1-2/18/text#4", "fieldID": "1-2/18/text", "block": "1-2-aba9917752d0", "answer": "走行レールの中心間", "category": "key", "prompt": "［用語？］", "start": 4, "end": 13, "context": "スパンは走行レールの中心間の距離で、クレーン全体がまたぐ幅を表します。トロリが横行する側のレールや車輪の間隔(ゲージ)、ガーダ材料の端から端までの長さとは別物なので、どの寸法を指しているかを読み分けます。", "start16": 4, "end16": 13}, {"id": "1-2/19/text#1", "fieldID": "1-2/19/text", "block": "1-2-152de1f8c6f4", "answer": "揚程", "category": "key", "prompt": "［用語？］", "start": 1, "end": 3, "context": "「揚程」は、つり具を有効に上げ下げできる上限位置から下限位置までの垂直距離です。今のフックが床から何mの高さにあるかを表す言葉ではありません。フックが動ける上下の範囲を表します。", "start16": 1, "end16": 3}, {"id": "1-2/23/text#1", "fieldID": "1-2/23/text", "block": "1-2-4cddf2f6fd21", "answer": "作業半径", "category": "key", "prompt": "［用語？］", "start": 1, "end": 5, "context": "「作業半径」は、旋回中心からつり上げ装置の中心までの水平距離です。ジブの斜めの長さではありません。荷をつる位置が、旋回中心から横方向にどれだけ離れているかを表します。", "start16": 1, "end16": 5}, {"id": "1-2/24/text#1", "fieldID": "1-2/24/text", "block": "1-2-54c3a229e03d", "answer": "ジブ傾斜角", "category": "key", "prompt": "［用語？］", "start": 1, "end": 6, "context": "「ジブ傾斜角」は、ジブの中心線と水平面のなす角です。鉛直線との角度ではなく、水平を基準に測ります。", "start16": 1, "end16": 6}, {"id": "1-2/29/text#1", "fieldID": "1-2/29/text", "block": "1-2-103bea0ef107", "answer": "寄り", "category": "key", "prompt": "［用語？］", "start": 1, "end": 3, "context": "「寄り」は、トロリをガーダの端へできるだけ寄せたときのつり具の横行停止位置と、近い側の走行レール中心との最小水平距離です（天井クレーンでは、走行レール中心とつり具中心との最小水平距離）。壁ぎわの荷にフックをどこまで近づけられるかを考える際の用語です。", "start16": 1, "end16": 3}, {"id": "1-2/31/text#1", "fieldID": "1-2/31/text", "block": "1-2-6d78ce0e1871", "answer": "インチング", "category": "key", "prompt": "［用語？］", "start": 1, "end": 6, "context": "「インチング」は、制御器や押しボタンを短い時間ずつ操作して、小刻みに動かす運転です。フックの位置を少し合わせたいときの微小な移動をイメージしてください。低速で長く動かし続けることと、短い操作を断続的に行うことは区別します。", "start16": 1, "end16": 6}, {"id": "1-2/32/text#1", "fieldID": "1-2/32/text", "block": "1-2-76203b3ba55f", "answer": "地切り", "category": "key", "prompt": "［用語？］", "start": 1, "end": 4, "context": "「地切り」は、巻上げによって荷が地面から離れることです。床が支えていた荷を、クレーンが支える状態へ移る瞬間です。少し離れたところでいったん止め、荷の傾きや玉掛け状態、ブレーキの保持状態などを確認します。", "start16": 1, "end16": 4}, {"id": "1-2/33/text#1", "fieldID": "1-2/33/text", "block": "1-2-130b8aa6fdc3", "answer": "キャンバ", "category": "key", "prompt": "［用語？］", "start": 1, "end": 5, "context": "「キャンバ」は、ガーダにあらかじめ付けておく上向きのそりです。荷をつると桁は下へたわむので、その変形を考慮して上向きのそりを設けます。荷をつっても全くたわまない、という意味ではありません。", "start16": 1, "end16": 5}, {"id": "1-2/37/text#46", "fieldID": "1-2/37/text", "block": "1-2-56c638f2fb7f", "answer": "ランウェイ", "category": "key", "prompt": "［用語？］", "start": 46, "end": 51, "context": "「走行レール」は、クレーン全体が走るためにしかれた1本のレールそのものを指します。いっぽう「ランウェイ」は、その走行レールを支える受け桁・レール・継ぎ目・固定ボルトなどをまとめた、走行のための軌道全体を指す言葉です。", "start16": 46, "end16": 51}], "rounds": {"all": [["1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1"], ["1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4"], ["1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1"], ["1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1"], ["1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1"], ["1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1"], ["1-2/19/text#1", "1-2/15/text#1", "1-2/37/tex text#1", "1-2/32/text#1"], ["1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1"], ["1-2/15/text#1", "1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1"], ["1-2/37/text#46", "1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53"], ["1-2/3/text#1", "1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1"], ["1-2/18/text#4", "1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1"], ["1-2/24/text#1", "1-2/33/text#1", "1-2/29/text#1", "1-2/32/text#1", "1-2/23/text#1", "1-2/31/text#1", "1-2/2/text#53", "1-2/19/text#1", "1-2/15/text#1", "1-2/37/text#46"]], "num": [[]]}}, {"title": "クレーンの種類――形・走路・荷のつかみ方で覚える", "blocks": [{"type": "p", "style": "lead", "text": "**形・走る場所・荷のつかみ方** を見れば、種類を整理できます。まず図で違いをつかみましょう。", "id": "1-4-9e835e99f685"}, {"type": "sub", "text": "天井クレーン", "id": "1-4-3ca713209bc0"}, {"type": "p", "text": "**天井クレーン**は、工場などの高い位置に設けた走行レールに沿って動く形式です。図のように、ガーダが工場の幅をまたぎ、その上をトロリが横行します。巻上げ・巻下げ、横行、走行を組み合わせて、工場内の広い範囲へ荷を運びます。", "id": "1-4-33cc3f54a4be"}, {"type": "img", "asset": "1-4_crane_types_readable21", "caption": "クレーンの種類。外観と基本機能を示す模式図。能力・機構・設置方法は用途と機種により異なる", "legend": [], "labels": [], "id": "1-4-e9eebcbb17e0", "style": "figure", "_previewFile": "1-4_crane_types_readable21.png", "_width": 2000, "_height": 1450}, {"type": "p", "text": "「**クラブトロリ式**」は、巻上げ装置と横行装置を載せた台車がガーダ上を自走する形式です。「ホイスト式」は、まとまった小形の巻上装置であるホイストを使います。ホイスト自体の説明は、後の作動装置の節で学びます。", "id": "1-4-873eb15ed027", "quizTerms": ["クラブトロリ式", "ホイスト式"]}, {"type": "p", "text": "「**ロープトロリ式**」は、巻上げや横行を駆動する装置を台車に載せず、別の場所からロープで台車やつり具を動かします。見分けるときは、台車の上に駆動装置があるかを確認してください。", "id": "1-4-383d1f90f998", "quizTerms": ["ロープトロリ式"]}, {"type": "p", "text": "製鉄所で溶けた鋼の入った鍋を扱うものは、**レードルクレーン**、または溶鋼鍋クレーンと呼びます。天井クレーンのうち、扱う荷に応じた特殊な形式です。", "id": "1-4-f8667607359d", "quizTerms": ["レードルクレーン"]}, {"type": "img", "asset": "1-4_supplement_f04_20261023", "labels": [], "legend": [], "caption": "溶けた金属を運ぶクレーンは、高温の荷に対応する。", "id": "1-4-26b6a8b46c1a", "style": "figure", "_previewFile": "1-4_supplement_f04_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "ジブクレーン", "id": "1-4-54e2140444a2"}, {"type": "p", "text": "**ジブクレーン**は、ジブといううでを使って荷をつる形式です。「塔形」は、高い塔の上にジブを設けます。「高脚・門形」は高い脚で支え、「片脚・半門形」は片側を建物などで支える形式です。港の岸壁や造船所などで使われます。", "id": "1-4-4549ac714fed"}, {"type": "p", "text": "「低床」は、低い架台の上に旋回する部分を設けた形式です。「**ポスト形**」は、固定された柱のまわりでジブが旋回します。ポストは柱を意味します。形式名を読むときは、ジブだけでなく、その下で何が支えているかも見ましょう。", "id": "1-4-8346b5351aee"}, {"type": "p", "text": "クライミング方法の代表例には、マストを継ぎ足して設置高さを上げる**マストクライミング**方式と、建物の床などを利用するフロアクライミング方式があります。名称と「何を利用して高さを変えるか」を対応づけて覚えます。", "id": "1-4-45114adc80d7", "quizTerms": ["マストクライミング方式", "フロアクライミング方式"]}, {"type": "p", "text": "クライミング作業は所定の手順・体制で行うもので、運転士だけで無条件に行える作業ではありません。", "id": "1-4-fd4888ea4356"}, {"type": "img", "asset": "1-4_supplement_f06_20261023", "labels": [], "legend": [], "caption": "マストを継ぎ足す方式と、建物の床を支えに上がる方式。違いを示す模式図で、組立・上昇手順は省略。", "id": "1-4-bd1515ae4569", "style": "figure", "_previewFile": "1-4_supplement_f06_20261023.png", "_width": 1774, "_height": 887}, {"type": "p", "text": "「つち形」は、高い塔の上に水平なジブを設け、そのジブ上をトロリが横行する形式です。横に長い部分と縦の塔の組合せが、つちの形に似ているため、**ハンマーヘッド**形とも呼びます。", "id": "1-4-5d86e4443c7b"}, {"type": "p", "text": "**引込みクレーン**は、ジブを動かしても荷がほぼ水平に移動する形式です。仕組みは、この節の「引込みクレーン」で比べます。", "id": "1-4-6b226e902c37", "quizTerms": ["引込みクレーン"]}, {"type": "p", "text": "「壁クレーン」は、壁や柱に取り付けて比較的小さな範囲で荷を扱うものです。**天井クレーン**とは別の高さや範囲で働き、補助的に使う場合もあります。", "id": "1-4-ea4d19e187b9", "quizTerms": ["壁クレーン"]}, {"type": "img", "asset": "1-4_supplement_f05_20261023", "labels": [], "legend": [], "caption": "高脚・低床・ポスト形・つち形・壁クレーン。ジブを下から支える構造を見る。", "id": "1-4-8f81e6269ab4", "style": "figure", "_previewFile": "1-4_supplement_f05_20261023.png", "_width": 1122, "_height": 1402}, {"type": "sub", "text": "橋形クレーン", "id": "1-4-a2f9495ab45c"}, {"type": "p", "text": "橋形クレーンは、長いガーダに脚を付け、その脚が地上や床上のレールを走る形式です。**天井クレーン**が建物の高い走行路に支えられるのに対し、橋形クレーンは自分の脚で桁を支える、と比べると理解しやすくなります。", "id": "1-4-bc94cb86e586"}, {"type": "p", "text": "脚の外へ張り出したガーダを**カンチレバー**といいます。走行レールの外側にも荷を運べます。船の出入りを妨げないよう、カンチレバーを起こせる形式もあります。", "id": "1-4-870f6579cff9", "quizTerms": ["カンチレバー"]}, {"type": "sub", "text": "アンローダ", "id": "1-4-b111a9561be6"}, {"type": "p", "text": "アンローダは、船から石炭や鉱石などを陸へ下ろすための機械です。石炭や鉱石のように、箱に入れずまとめて扱う荷を「ばら物」といいます。**グラブバケット**でつかみ取る方式などがあります。", "id": "1-4-f6842e4a3ec0", "quizTerms": ["アンローダ"]}, {"type": "p", "text": "多くのアンローダでは、すくったばら物を**ホッパ（受入れ容器）**へ落とし、**コンベヤ**で運びます。「船→グラブ→ホッパ→コンベヤ」の順に荷を追うと、役割が分かります。", "id": "1-4-efb96f7d311a"}, {"type": "sub", "text": "ケーブルクレーン", "id": "1-4-ee862a12d42c"}, {"type": "p", "text": "**ケーブルクレーン**は、二つの塔の間に張った太いロープを走路として、その上をトロリが横行する形式です。この荷を支える主なロープを「主索」または「メインロープ」といいます。", "id": "1-4-f619eeca465c", "quizTerms": ["メインロープ"]}, {"type": "p", "text": "天井クレーンのトロリが鋼製のガーダ上を動くのに対し、**ケーブルクレーン**のトロリは主索に沿って動きます。谷をまたぐダム工事など、大きな範囲へ資材を運ぶ場面で使われます。", "id": "1-4-62001081aa9c"}, {"type": "sub", "text": "テルハ", "id": "1-4-f881e3677519"}, {"type": "p", "text": "**テルハ**は、固定されたI形鋼などの走路につったホイストで、荷の上げ下げと横行を行う形式です。ホイストは走路に沿って動きますが、その走路全体が別のレール上を走行するわけではありません。", "id": "1-4-5715db497eb7", "quizTerms": ["テルハ"]}, {"type": "p", "text": "**天井クレーン**との違いは、クレーン全体の走行がないことです。「テルハは全く移動しない」ではなく、「横行はするが、全体の走行はしない」と覚えましょう。鉄道の線路をまたぐものは「跨線テルハ」と呼びます。", "id": "1-4-a9c9eba3ac14"}, {"type": "sub", "text": "スタッカークレーン", "id": "1-4-b5f476382302"}, {"type": "p", "text": "**スタッカークレーン**は、倉庫の棚へ荷を入れたり取り出したりする機械です。フォークなどの荷を受ける部分が、ガイドフレームに沿って上下します。", "id": "1-4-a2ff7ff773d6", "quizTerms": ["スタッカークレーン"]}, {"type": "p", "text": "**スタッカー式**には運転室がフォークなどと一緒に昇降するものがあり、**荷昇降式**では荷を載せる部分が昇降します。名前だけでなく、何が上下するかを見分けます。", "id": "1-4-b6dff0203938"}, {"type": "img", "asset": "1-4_supplement_f08_20261023", "labels": [], "legend": [], "caption": "走路と荷を出し入れする部分の位置を見分ける。", "id": "1-4-40fd693b7f2a", "style": "figure", "_previewFile": "1-4_supplement_f08_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "引込みクレーン――ジブを動かしても荷が水平に動く", "id": "1-4-ae48580714b6"}, {"type": "p", "text": "ジブクレーンの仲間に「**引込みクレーン**」があります。ふつうのジブは、起こしたり伏せたりすると、荷の高さも一緒に上下してしまいます。引込みクレーンは、リンク（棒のつながり）やロープのしくみで、ジブを動かしても荷の高さがほとんど変わらず、荷が水平に近い線の上を移動するようにつくられています。", "id": "1-4-743992e308f6"}, {"type": "p", "text": "荷を手前に寄せる動きを「引込み」、遠くへ出す動きを「押出し」といい、あわせて「引込み・押出し」と呼びます。港で**ばら物**をあつかうクレーンなどに使われます。", "id": "1-4-74773dc41d1f"}, {"type": "img", "asset": "1-4_supplement_f07_20261023", "labels": [], "legend": [], "caption": "ジブの形やロープの使い方を変え、荷の高さの変化を抑える。", "id": "1-4-b4f3799d8ee0", "style": "figure", "_previewFile": "1-4_supplement_f07_20261023.png", "_width": 1472, "_height": 1069}, {"id": "1-4-rev26-luffing-types", "type": "table", "headers": ["方式", "水平を保つ仕組みの目印"], "rows": [["**ダブルリンク式**", "3つのジブを組み合わせたリンクの動き"], ["**スイングレバー式**", "起伏に合わせてレバーが回り、ロープを繰り出す"], ["**ロープバランス式**", "起伏に合わせた巻上げロープの繰出し"], ["**テンションロープ式**", "補助ジブと、その支持ロープの組合せ"]]}, {"type": "sub", "text": "ホイストの横行方式――普通形とダブルレール形", "id": "1-4-a598c428ea55"}, {"type": "p", "text": "ワイヤロープ式ホイストには、走路から懸垂して横行する普通形（サスペンション式）と、2本の横行レールの上に載って横行するダブルレール形（**トップランニング式**）があります。ここで比べているのは、ホイストの横行時の支持方式です。", "id": "1-4-b6062d5ef9f4", "quizTerms": ["トップランニング式", "サスペンション式"]}, {"type": "p", "text": "なお、天井クレーン全体の走行方式にもサスペンション式・**トップランニング式**という名称が使われます。その場合に見るのは、サドルが走行レールに懸垂するか、走行レール上に載るかであり、ホイストの横行方式とは区別します。", "id": "1-4-8c6bdb86d6c6"}, {"type": "img", "asset": "1-4_supplement_f10_20261023", "labels": [], "legend": [], "caption": "下からぶら下がるか、上のレールに乗るかが違う。", "id": "1-4-60286b435232", "style": "figure", "_previewFile": "1-4_supplement_f10_20261023.png", "_width": 1472, "_height": 1068}], "id": "1-4", "chapter": 1, "fields": [{"id": "1-4/2/text", "raw": "**天井クレーン**は、工場などの高い位置に設けた走行レールに沿って動く形式です。図のように、ガーダが工場の幅をまたぎ、その上をトロリが横行します。巻上げ・巻下げ、横行、走行を組み合わせて、工場内の広い範囲へ荷を運びます。", "text": "天井クレーンは、工場などの高い位置に設けた走行レールに沿って動く形式です。図のように、ガーダが工場の幅をまたぎ、その上をトロリが横行します。巻上げ・巻下げ、横行、走行を組み合わせて、工場内の広い範囲へ荷を運びます。", "terms": [], "block": "1-4-33cc3f54a4be"}, {"id": "1-4/4/text", "raw": "「**クラブトロリ式**」は、巻上げ装置と横行装置を載せた台車がガーダ上を自走する形式です。「ホイスト式」は、まとまった小形の巻上装置であるホイストを使います。ホイスト自体の説明は、後の作動装置の節で学びます。", "text": "「クラブトロリ式」は、巻上げ装置と横行装置を載せた台車がガーダ上を自走する形式です。「ホイスト式」は、まとまった小形の巻上装置であるホイストを使います。ホイスト自体の説明は、後の作動装置の節で学びます。", "terms": ["クラブトロリ式", "ホイスト式"], "block": "1-4-873eb15ed027"}, {"id": "1-4/5/text", "raw": "「**ロープトロリ式**」は、巻上げや横行を駆動する装置を台車に載せず、別の場所からロープで台車やつり具を動かします。見分けるときは、台車の上に駆動装置があるかを確認してください。", "text": "「ロープトロリ式」は、巻上げや横行を駆動する装置を台車に載せず、別の場所からロープで台車やつり具を動かします。見分けるときは、台車の上に駆動装置があるかを確認してください。", "terms": ["ロープトロリ式"], "block": "1-4-383d1f90f998"}, {"id": "1-4/6/text", "raw": "製鉄所で溶けた鋼の入った鍋を扱うものは、**レードルクレーン**、または溶鋼鍋クレーンと呼びます。天井クレーンのうち、扱う荷に応じた特殊な形式です。", "text": "製鉄所で溶けた鋼の入った鍋を扱うものは、レードルクレーン、または溶鋼鍋クレーンと呼びます。天井クレーンのうち、扱う荷に応じた特殊な形式です。", "terms": ["レードルクレーン"], "block": "1-4-f8667607359d"}, {"id": "1-4/9/text", "raw": "**ジブクレーン**は、ジブといううでを使って荷をつる形式です。「塔形」は、高い塔の上にジブを設けます。「高脚・門形」は高い脚で支え、「片脚・半門形」は片側を建物などで支える形式です。港の岸壁や造船所などで使われます。", "text": "ジブクレーンは、ジブといううでを使って荷をつる形式です。「塔形」は、高い塔の上にジブを設けます。「高脚・門形」は高い脚で支え、「片脚・半門形」は片側を建物などで支える形式です。港の岸壁や造船所などで使われます。", "terms": [], "block": "1-4-4549ac714fed"}, {"id": "1-4/10/text", "raw": "「低床」は、低い架台の上に旋回する部分を設けた形式です。「**ポスト形**」は、固定された柱のまわりでジブが旋回します。ポストは柱を意味します。形式名を読むときは、ジブだけでなく、その下で何が支えているかも見ましょう。", "text": "「低床」は、低い架台の上に旋回する部分を設けた形式です。「ポスト形」は、固定された柱のまわりでジブが旋回します。ポストは柱を意味します。形式名を読むときは、ジブだけでなく、その下で何が支えているかも見ましょう。", "terms": [], "block": "1-4-8346b5351aee"}, {"id": "1-4/11/text", "raw": "クライミング方法の代表例には、マストを継ぎ足して設置高さを上げる**マストクライミング**方式と、建物の床などを利用するフロアクライミング方式があります。名称と「何を利用して高さを変えるか」を対応づけて覚えます。", "text": "クライミング方法の代表例には、マストを継ぎ足して設置高さを上げるマストクライミング方式と、建物の床などを利用するフロアクライミング方式があります。名称と「何を利用して高さを変えるか」を対応づけて覚えます。", "terms": ["マストクライミング方式", "フロアクライミング方式"], "block": "1-4-45114adc80d7"}, {"id": "1-4/12/text", "raw": "クライミング作業は所定の手順・体制で行うもので、運転士だけで無条件に行える作業ではありません。", "text": "クライミング作業は所定の手順・体制で行うもので、運転士だけで無条件に行える作業ではありません。", "terms": [], "block": "1-4-fd4888ea4356"}, {"id": "1-4/14/text", "raw": "「つち形」は、高い塔の上に水平なジブを設け、そのジブ上をトロリが横行する形式です。横に長い部分と縦の塔の組合せが、つちの形に似ているため、**ハンマーヘッド**形とも呼びます。", "text": "「つち形」は、高い塔の上に水平なジブを設け、そのジブ上をトロリが横行する形式です。横に長い部分と縦の塔の組合せが、つちの形に似ているため、ハンマーヘッド形とも呼びます。", "terms": [], "block": "1-4-5d86e4443c7b"}, {"id": "1-4/15/text", "raw": "**引込みクレーン**は、ジブを動かしても荷がほぼ水平に移動する形式です。仕組みは、この節の「引込みクレーン」で比べます。", "text": "引込みクレーンは、ジブを動かしても荷がほぼ水平に移動する形式です。仕組みは、この節の「引込みクレーン」で比べます。", "terms": ["引込みクレーン"], "block": "1-4-6b226e902c37"}, {"id": "1-4/16/text", "raw": "「壁クレーン」は、壁や柱に取り付けて比較的小さな範囲で荷を扱うものです。**天井クレーン**とは別の高さや範囲で働き、補助的に使う場合もあります。", "text": "「壁クレーン」は、壁や柱に取り付けて比較的小さな範囲で荷を扱うものです。天井クレーンとは別の高さや範囲で働き、補助的に使う場合もあります。", "terms": ["壁クレーン"], "block": "1-4-ea4d19e187b9"}, {"id": "1-4/19/text", "raw": "橋形クレーンは、長いガーダに脚を付け、その脚が地上や床上のレールを走る形式です。**天井クレーン**が建物の高い走行路に支えられるのに対し、橋形クレーンは自分の脚で桁を支える、と比べると理解しやすくなります。", "text": "橋形クレーンは、長いガーダに脚を付け、その脚が地上や床上のレールを走る形式です。天井クレーンが建物の高い走行路に支えられるのに対し、橋形クレーンは自分の脚で桁を支える、と比べると理解しやすくなります。", "terms": [], "block": "1-4-bc94cb86e586"}, {"id": "1-4/20/text", "raw": "脚の外へ張り出したガーダを**カンチレバー**といいます。走行レールの外側にも荷を運べます。船の出入りを妨げないよう、カンチレバーを起こせる形式もあります。", "text": "脚の外へ張り出したガーダをカンチレバーといいます。走行レールの外側にも荷を運べます。船の出入りを妨げないよう、カンチレバーを起こせる形式もあります。", "terms": ["カンチレバー"], "block": "1-4-870f6579cff9"}, {"id": "1-4/22/text", "raw": "アンローダは、船から石炭や鉱石などを陸へ下ろすための機械です。石炭や鉱石のように、箱に入れずまとめて扱う荷を「ばら物」といいます。**グラブバケット**でつかみ取る方式などがあります。", "text": "アンローダは、船から石炭や鉱石などを陸へ下ろすための機械です。石炭や鉱石のように、箱に入れずまとめて扱う荷を「ばら物」といいます。グラブバケットでつかみ取る方式などがあります。", "terms": ["アンローダ"], "block": "1-4-f6842e4a3ec0"}, {"id": "1-4/23/text", "raw": "多くのアンローダでは、すくったばら物を**ホッパ（受入れ容器）**へ落とし、**コンベヤ**で運びます。「船→グラブ→ホッパ→コンベヤ」の順に荷を追うと、役割が分かります。", "text": "多くのアンローダでは、すくったばら物をホッパ（受入れ容器）へ落とし、コンベヤで運びます。「船→グラブ→ホッパ→コンベヤ」の順に荷を追うと、役割が分かります。", "terms": [], "block": "1-4-efb96f7d311a"}, {"id": "1-4/25/text", "raw": "**ケーブルクレーン**は、二つの塔の間に張った太いロープを走路として、その上をトロリが横行する形式です。この荷を支える主なロープを「主索」または「メインロープ」といいます。", "text": "ケーブルクレーンは、二つの塔の間に張った太いロープを走路として、その上をトロリが横行する形式です。この荷を支える主なロープを「主索」または「メインロープ」といいます。", "terms": ["メインロープ"], "block": "1-4-f619eeca465c"}, {"id": "1-4/26/text", "raw": "天井クレーンのトロリが鋼製のガーダ上を動くのに対し、**ケーブルクレーン**のトロリは主索に沿って動きます。谷をまたぐダム工事など、大きな範囲へ資材を運ぶ場面で使われます。", "text": "天井クレーンのトロリが鋼製のガーダ上を動くのに対し、ケーブルクレーンのトロリは主索に沿って動きます。谷をまたぐダム工事など、大きな範囲へ資材を運ぶ場面で使われます。", "terms": [], "block": "1-4-62001081aa9c"}, {"id": "1-4/28/text", "raw": "**テルハ**は、固定されたI形鋼などの走路につったホイストで、荷の上げ下げと横行を行う形式です。ホイストは走路に沿って動きますが、その走路全体が別のレール上を走行するわけではありません。", "text": "テルハは、固定されたI形鋼などの走路につったホイストで、荷の上げ下げと横行を行う形式です。ホイストは走路に沿って動きますが、その走路全体が別のレール上を走行するわけではありません。", "terms": ["テルハ"], "block": "1-4-5715db497eb7"}, {"id": "1-4/29/text", "raw": "**天井クレーン**との違いは、クレーン全体の走行がないことです。「テルハは全く移動しない」ではなく、「横行はするが、全体の走行はしない」と覚えましょう。鉄道の線路をまたぐものは「跨線テルハ」と呼びます。", "text": "天井クレーンとの違いは、クレーン全体の走行がないことです。「テルハは全く移動しない」ではなく、「横行はするが、全体の走行はしない」と覚えましょう。鉄道の線路をまたぐものは「跨線テルハ」と呼びます。", "terms": [], "block": "1-4-a9c9eba3ac14"}, {"id": "1-4/31/text", "raw": "**スタッカークレーン**は、倉庫の棚へ荷を入れたり取り出したりする機械です。フォークなどの荷を受ける部分が、ガイドフレームに沿って上下します。", "text": "スタッカークレーンは、倉庫の棚へ荷を入れたり取り出したりする機械です。フォークなどの荷を受ける部分が、ガイドフレームに沿って上下します。", "terms": ["スタッカークレーン"], "block": "1-4-a2ff7ff773d6"}, {"id": "1-4/32/text", "raw": "**スタッカー式**には運転室がフォークなどと一緒に昇降するものがあり、**荷昇降式**では荷を載せる部分が昇降します。名前だけでなく、何が上下するかを見分けます。", "text": "スタッカー式には運転室がフォークなどと一緒に昇降するものがあり、荷昇降式では荷を載せる部分が昇降します。名前だけでなく、何が上下するかを見分けます。", "terms": [], "block": "1-4-b6dff0203938"}, {"id": "1-4/35/text", "raw": "ジブクレーンの仲間に「**引込みクレーン**」があります。ふつうのジブは、起こしたり伏せたりすると、荷の高さも一緒に上下してしまいます。引込みクレーンは、リンク（棒のつながり）やロープのしくみで、ジブを動かしても荷の高さがほとんど変わらず、荷が水平に近い線の上を移動するようにつくられています。", "text": "ジブクレーンの仲間に「引込みクレーン」があります。ふつうのジブは、起こしたり伏せたりすると、荷の高さも一緒に上下してしまいます。引込みクレーンは、リンク（棒のつながり）やロープのしくみで、ジブを動かしても荷の高さがほとんど変わらず、荷が水平に近い線の上を移動するようにつくられています。", "terms": [], "block": "1-4-743992e308f6"}, {"id": "1-4/36/text", "raw": "荷を手前に寄せる動きを「引込み」、遠くへ出す動きを「押出し」といい、あわせて「引込み・押出し」と呼びます。港で**ばら物**をあつかうクレーンなどに使われます。", "text": "荷を手前に寄せる動きを「引込み」、遠くへ出す動きを「押出し」といい、あわせて「引込み・押出し」と呼びます。港でばら物をあつかうクレーンなどに使われます。", "terms": [], "block": "1-4-74773dc41d1f"}, {"id": "1-4/38/rows:0:0", "raw": "**ダブルリンク式**", "text": "ダブルリンク式", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:0:1", "raw": "3つのジブを組み合わせたリンクの動き", "text": "3つのジブを組み合わせたリンクの動き", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:1:0", "raw": "**スイングレバー式**", "text": "スイングレバー式", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:1:1", "raw": "起伏に合わせてレバーが回り、ロープを繰り出す", "text": "起伏に合わせてレバーが回り、ロープを繰り出す", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:2:0", "raw": "**ロープバランス式**", "text": "ロープバランス式", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:2:1", "raw": "起伏に合わせた巻上げロープの繰出し", "text": "起伏に合わせた巻上げロープの繰出し", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:3:0", "raw": "**テンションロープ式**", "text": "テンションロープ式", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/38/rows:3:1", "raw": "補助ジブと、その支持ロープの組合せ", "text": "補助ジブと、その支持ロープの組合せ", "terms": [], "block": "1-4-rev26-luffing-types"}, {"id": "1-4/40/text", "raw": "ワイヤロープ式ホイストには、走路から懸垂して横行する普通形（サスペンション式）と、2本の横行レールの上に載って横行するダブルレール形（**トップランニング式**）があります。ここで比べているのは、ホイストの横行時の支持方式です。", "text": "ワイヤロープ式ホイストには、走路から懸垂して横行する普通形（サスペンション式）と、2本の横行レールの上に載って横行するダブルレール形（トップランニング式）があります。ここで比べているのは、ホイストの横行時の支持方式です。", "terms": ["トップランニング式", "サスペンション式"], "block": "1-4-b6062d5ef9f4"}, {"id": "1-4/41/text", "raw": "なお、天井クレーン全体の走行方式にもサスペンション式・**トップランニング式**という名称が使われます。その場合に見るのは、サドルが走行レールに懸垂するか、走行レール上に載るかであり、ホイストの横行方式とは区別します。", "text": "なお、天井クレーン全体の走行方式にもサスペンション式・トップランニング式という名称が使われます。その場合に見るのは、サドルが走行レールに懸垂するか、走行レール上に載るかであり、ホイストの横行方式とは区別します。", "terms": [], "block": "1-4-8c6bdb86d6c6"}], "candidates": [{"id": "1-4/4/text#1", "fieldID": "1-4/4/text", "block": "1-4-873eb15ed027", "answer": "クラブトロリ式", "category": "key", "prompt": "［用語？］", "start": 1, "end": 8, "context": "「クラブトロリ式」は、巻上げ装置と横行装置を載せた台車がガーダ上を自走する形式です。「ホイスト式」は、まとまった小形の巻上装置であるホイストを使います。ホイスト自体の説明は、後の作動装置の節で学びます。", "start16": 1, "end16": 8}, {"id": "1-4/4/text#43", "fieldID": "1-4/4/text", "block": "1-4-873eb15ed027", "answer": "ホイスト式", "category": "key", "prompt": "［用語？］", "start": 43, "end": 48, "context": "「クラブトロリ式」は、巻上げ装置と横行装置を載せた台車がガーダ上を自走する形式です。「ホイスト式」は、まとまった小形の巻上装置であるホイストを使います。ホイスト自体の説明は、後の作動装置の節で学びます。", "start16": 43, "end16": 48}, {"id": "1-4/5/text#1", "fieldID": "1-4/5/text", "block": "1-4-383d1f90f998", "answer": "ロープトロリ式", "category": "key", "prompt": "［用語？］", "start": 1, "end": 8, "context": "「ロープトロリ式」は、巻上げや横行を駆動する装置を台車に載せず、別の場所からロープで台車やつり具を動かします。見分けるときは、台車の上に駆動装置があるかを確認してください。", "start16": 1, "end16": 8}, {"id": "1-4/6/text#20", "fieldID": "1-4/6/text", "block": "1-4-f8667607359d", "answer": "レードルクレーン", "category": "key", "prompt": "［用語？］", "start": 20, "end": 28, "context": "製鉄所で溶けた鋼の入った鍋を扱うものは、レードルクレーン、または溶鋼鍋クレーンと呼びます。天井クレーンのうち、扱う荷に応じた特殊な形式です。", "start16": 20, "end16": 28}, {"id": "1-4/11/text#32", "fieldID": "1-4/11/text", "block": "1-4-45114adc80d7", "answer": "マストクライミング方式", "category": "key", "prompt": "［用語？］", "start": 32, "end": 43, "context": "クライミング方法の代表例には、マストを継ぎ足して設置高さを上げるマストクライミング方式と、建物の床などを利用するフロアクライミング方式があります。名称と「何を利用して高さを変えるか」を対応づけて覚えます。", "start16": 32, "end16": 43}, {"id": "1-4/11/text#56", "fieldID": "1-4/11/text", "block": "1-4-45114adc80d7", "answer": "フロアクライミング方式", "category": "key", "prompt": "［用語？］", "start": 56, "end": 67, "context": "クライミング方法の代表例には、マストを継ぎ足して設置高さを上げるマストクライミング方式と、建物の床などを利用するフロアクライミング方式があります。名称と「何を利用して高さを変えるか」を対応づけて覚えます。", "start16": 56, "end16": 67}, {"id": "1-4/15/text#0", "fieldID": "1-4/15/text", "block": "1-4-6b226e902c37", "answer": "引込みクレーン", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "引込みクレーンは、ジブを動かしても荷がほぼ水平に移動する形式です。仕組みは、この節の「引込みクレーン」で比べます。", "start16": 0, "end16": 7}, {"id": "1-4/16/text#1", "fieldID": "1-4/16/text", "block": "1-4-ea4d19e187b9", "answer": "壁クレーン", "category": "key", "prompt": "［用語？］", "start": 1, "end": 6, "context": "「壁クレーン」は、壁や柱に取り付けて比較的小さな範囲で荷を扱うものです。天井クレーンとは別の高さや範囲で働き、補助的に使う場合もあります。", "start16": 1, "end16": 6}, {"id": "1-4/20/text#13", "fieldID": "1-4/20/text", "block": "1-4-870f6579cff9", "answer": "カンチレバー", "category": "key", "prompt": "［用語？］", "start": 13, "end": 19, "context": "脚の外へ張り出したガーダをカンチレバーといいます。走行レールの外側にも荷を運べます。船の出入りを妨げないよう、カンチレバーを起こせる形式もあります。", "start16": 13, "end16": 19}, {"id": "1-4/22/text#0", "fieldID": "1-4/22/text", "block": "1-4-f6842e4a3ec0", "answer": "アンローダ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 5, "context": "アンローダは、船から石炭や鉱石などを陸へ下ろすための機械です。石炭や鉱石のように、箱に入れずまとめて扱う荷を「ばら物」といいます。グラブバケットでつかみ取る方式などがあります。", "start16": 0, "end16": 5}, {"id": "1-4/25/text#70", "fieldID": "1-4/25/text", "block": "1-4-f619eeca465c", "answer": "メインロープ", "category": "key", "prompt": "［用語？］", "start": 70, "end": 76, "context": "ケーブルクレーンは、二つの塔の間に張った太いロープを走路として、その上をトロリが横行する形式です。この荷を支える主なロープを「主索」または「メインロープ」といいます。", "start16": 70, "end16": 76}, {"id": "1-4/28/text#0", "fieldID": "1-4/28/text", "block": "1-4-5715db497eb7", "answer": "テルハ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "テルハは、固定されたI形鋼などの走路につったホイストで、荷の上げ下げと横行を行う形式です。ホイストは走路に沿って動きますが、その走路全体が別のレール上を走行するわけではありません。", "start16": 0, "end16": 3}, {"id": "1-4/31/text#0", "fieldID": "1-4/31/text", "block": "1-4-a2ff7ff773d6", "answer": "スタッカークレーン", "category": "key", "prompt": "［用語？］", "start": 0, "end": 9, "context": "スタッカークレーンは、倉庫の棚へ荷を入れたり取り出したりする機械です。フォークなどの荷を受ける部分が、ガイドフレームに沿って上下します。", "start16": 0, "end16": 9}, {"id": "1-4/40/text#30", "fieldID": "1-4/40/text", "block": "1-4-b6062d5ef9f4", "answer": "サスペンション式", "category": "key", "prompt": "［用語？］", "start": 30, "end": 38, "context": "ワイヤロープ式ホイストには、走路から懸垂して横行する普通形（サスペンション式）と、2本の横行レールの上に載って横行するダブルレール形（トップランニング式）があります。ここで比べているのは、ホイストの横行時の支持方式です。", "start16": 30, "end16": 38}, {"id": "1-4/40/text#67", "fieldID": "1-4/40/text", "block": "1-4-b6062d5ef9f4", "answer": "トップランニング式", "category": "key", "prompt": "［用語？］", "start": 67, "end": 76, "context": "ワイヤロープ式ホイストには、走路から懸垂して横行する普通形（サスペンション式）と、2本の横行レールの上に載って横行するダブルレール形（トップランニング式）があります。ここで比べているのは、ホイストの横行時の支持方式です。", "start16": 67, "end16": 76}], "rounds": {"all": [["1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0"], ["1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1"], ["1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0"], ["1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1"], ["1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20"], ["1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70"], ["1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0"], ["1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32"], ["1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56"], ["1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43"], ["1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/te /6/text#20", "1-4/25/text#70", "1-4/31/text#0"], ["1-4/5/text#1", "1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32"], ["1-4/28/text#0", "1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56"], ["1-4/15/text#0", "1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43"], ["1-4/16/text#1", "1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30"], ["1-4/22/text#0", "1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67"], ["1-4/4/text#1", "1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13"], ["1-4/6/text#20", "1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1"], ["1-4/25/text#70", "1-4/31/text#0", "1-4/11/text#32", "1-4/11/text#56", "1-4/4/text#43", "1-4/40/text#30", "1-4/40/text#67", "1-4/20/text#13", "1-4/5/text#1", "1-4/28/text#0"]], "num": [[]]}}, {"title": "荷を支える骨組み――力が伝わる道を追う", "blocks": [{"type": "p", "style": "lead", "text": "荷の重さは、ロープから骨組みへ伝わります。**どの部材が荷を支えているか** を追いかけましょう。", "id": "1-5-4d6d24b6342c"}, {"type": "sub", "text": "構造部分とは", "id": "1-5-f752647ad008"}, {"type": "p", "text": "荷をつると、荷の重さはフックからロープへ、ロープからトロリへ、トロリからガーダへ伝わります。さらに、ガーダからサドルと車輪、**走行レール**、建物や基礎へ伝わります。荷を支える力が途中で途切れないように、各部分がつながっています。", "id": "1-5-3e522167ecbb"}, {"type": "p", "text": "こうした荷重を受けて支える部分が「構造部分」です。天井クレーンならガーダ、サドル、トロリフレームなど、橋形クレーンならガーダと脚などが該当します。**ケーブルクレーン**では、主索も荷を支える構造部分です。鉄の棒や板だけが構造部分とは限りません。", "id": "1-5-2a896e08d285", "quizTerms": ["主索"]}, {"type": "svg", "file": "1-5_overhead_parts.svg", "caption": "天井クレーン主要部品", "id": "1-5-d34713191b90", "style": "figure", "_previewFile": "1-5_overhead_parts.svg"}, {"id": "1-5-rev26-structure", "type": "table", "headers": ["部材", "形と役割"], "rows": [["**ガーダ**", "トロリや荷を支える長い桁"], ["**サドル**", "ガーダの両端を支え、走行車輪を備える。代表例は鋼板を接合した箱形"], ["**橋形クレーンの脚**", "ガーダを下から支える。軽く強くするため、箱形や鋼管などを使う"]], "quizTerms": ["ガーダ", "サドル"]}, {"type": "p", "text": "ガーダ・サドル・トロリフレームなどが、試験でいう**構造部分**です。階段や運転室は、この区分には含めません。", "id": "1-5-67618327ff0e"}, {"type": "p", "text": "荷を支える材料の内部には、引っ張られる、押される、曲げられるなどの負担が生じます。その負担を単位面積あたりで表す量を「**応力**」といいます。ここでは、荷重を受けると材料の内部にも負担が生じる、という意味を理解すれば十分です。", "id": "1-5-7423c6bd6e6a"}, {"type": "sub", "text": "ガーダの形が違う理由", "id": "1-5-c7d541a91f35"}, {"type": "p", "text": "**ガーダ**は、荷を受けて曲がろうとする長い桁です。同じ量の鋼材でも、材料をどこへ配置するかで曲がりにくさが変わります。そのため、単に太い板にするだけでなく、断面や骨組みの形を工夫します。", "id": "1-5-38848278705b"}, {"type": "img", "asset": "1-5_girder_sections_readable21", "caption": "ガーダの構造比較。特徴：トラスは軽量化しやすい。I・プレートは曲げ、ボックスはねじりへの抵抗を確保しやすい。 強さは寸法・材質・接合・荷重条件で決まる。断面形式だけで優劣を断定しない", "legend": [], "labels": [], "id": "1-5-129117155cd5", "style": "figure", "_previewFile": "1-5_girder_sections_readable21.png", "_width": 2000, "_height": 1450}, {"type": "p", "text": "「**トラスガーダ**」は、細長い部材を三角形に組み合わせた骨組みです。三角形は形を保ちやすく、部材の引張りや圧縮を利用して荷を支えます。軽量化しながら強さを確保する構造に使われます。", "id": "1-5-c8cc5882064d", "quizTerms": ["トラスガーダ"]}, {"type": "p", "text": "「Iビームガーダ」は、切り口がIの形をした鋼材を使います。「**プレートガーダ**」は、鋼板を組み合わせて桁を作ります。上下の板などを離して配置することで、曲げに抵抗しやすくします。", "id": "1-5-c27bdb4510fc", "quizTerms": ["プレートガーダ"]}, {"type": "p", "text": "**ボックスガーダ**は、鋼板を箱形につないだ桁です。水平力やねじれにも強く、補桁を必要としません。", "id": "1-5-b9eeb75b1833", "quizTerms": ["ボックスガーダ"]}, {"type": "p", "text": "**トラスガーダ**は主桁と補桁を組み合わせます。Iビームガーダやプレートガーダは、補桁なしで使う場合もあります。断面の形と、補桁の要否を結び付けます。", "id": "1-5-918b39bc9b86"}, {"type": "sub", "id": "lesson-girder-parts", "text": "フランジとウェブ――板の役割を分ける"}, {"type": "p", "text": "I形の桁を横から見ると、上下の横板が **フランジ**、その間の縦板が **ウェブ** です。プレートガーダは、こうした鋼板を接合して作ります。", "id": "1-5-b4d7e52a88c8", "quizTerms": ["フランジ", "ウェブ"]}, {"type": "p", "text": "**フランジは主に曲げによる引張り・圧縮を、ウェブは主にせん断力を受け持つ** と整理します。トラスは板で囲う代わりに、主材と斜材などの骨組みで支えます。", "id": "1-5-5a84dca9d51b"}, {"type": "sub", "id": "lesson-girder-count", "text": "桁が1本か2本か――シングルとダブル"}, {"type": "p", "text": "**シングルガーダ形は主桁が1本、ダブルガーダ形は主桁が2本。** 一般に、大きなつり上げ荷重や長いスパンにはダブルガーダ形が用いられます。", "id": "1-5-f9d2ee15bedd"}, {"type": "p", "text": "「桁の本数」と「断面の形」は別の分類です。シングル／ダブルと、Iビーム／プレート／ボックスを混ぜて覚えないようにします。", "id": "1-5-1ad34e8f91c8"}, {"type": "sub", "text": "カンチレバー――脚の外への張出し", "id": "1-5-39ca3e76845c"}, {"type": "img", "asset": "1-5_supplement_f09_20261023", "labels": [], "legend": [], "caption": "脚の外まで張り出した桁の部分がカンチレバー。", "id": "1-5-6f602c5d215c", "style": "figure", "_previewFile": "1-5_supplement_f09_20261023.png", "_width": 1472, "_height": 1069}, {"type": "sub", "text": "剛脚と揺脚", "id": "1-5-d59920c43e53"}, {"type": "p", "text": "**橋形クレーン**の長いガーダは、気温が上がると伸び、下がると縮みます。左右の脚をどちらも完全に固めると、その伸び縮みを妨げて、余分な力が生じることがあります。", "id": "1-5-eebbe74ad703"}, {"type": "p", "text": "**剛脚は垂直荷重と水平荷重、揺脚は垂直荷重を受ける**と整理します。揺脚はガーダとの連結部を動ける構造にし、ガーダの伸縮やたわみに対応します。", "id": "1-5-6dc93ffb3804", "quizTerms": ["剛脚", "揺脚"]}, {"type": "img", "asset": "1-5_rigid_pin_legs_readable21", "caption": "剛脚は垂直・水平荷重、揺脚は垂直荷重を受ける、という試験での整理。", "legend": [], "labels": [], "id": "1-5-4213accb2ea1", "style": "figure", "_previewFile": "1-5_rigid_pin_legs_readable21.png", "_width": 1536, "_height": 1024}, {"id": "1-5-bbc1af2db77c", "type": "point", "items": ["**剛脚：上下と横を支える。**", "**揺脚：上下を支え、ガーダの変形に対応する。**"]}, {"type": "sub", "text": "トロリとホイスト", "id": "1-5-735785f20040"}, {"type": "p", "text": "トロリは、荷をつる装置を横へ運ぶ台車です。「クラブトロリ」は、巻上げと横行の駆動装置を載せています。「ロープトロリ」は、それらを台車に載せず、別の場所からロープで動かします。「**セミロープトロリ**」は、巻上げ・横行の一方の駆動装置を台車に載せ、もう一方をロープで行う形式です。", "id": "1-5-8f482198ca9a", "quizTerms": ["セミロープトロリ"]}, {"type": "img", "asset": "1-5_trolley_types_readable21", "caption": "トロリの種類。巻上装置を台車に搭載／外部の巻上装置からロープを導く／運転室を台車に設ける", "legend": [], "labels": [], "id": "1-5-e3ea4a74be1f", "style": "figure", "_previewFile": "1-5_trolley_types_readable21.png", "_width": 2000, "_height": 1450}, {"type": "p", "text": "「**マントロリ**」は、運転室が付いたトロリです。運転者も台車とともに移動します。クラブやロープという分類は駆動装置の配置、マンという名称は運転室の有無に着目したものなので、分類の観点にも注意します。", "id": "1-5-ed33739ecb65", "quizTerms": ["マントロリ"]}, {"type": "p", "text": "**ホイスト**は、電動機・減速機・巻上げ部分・ブレーキなどを小さくまとめた装置です。この章では、**巻上装置と横行装置を一体化したもの**を基本形として覚えます。ロープ式はドラム、チェーン式はロードシーブを使います。", "id": "1-5-6d5286ad1f9e"}], "id": "1-5", "chapter": 1, "fields": [{"id": "1-5/2/text", "raw": "荷をつると、荷の重さはフックからロープへ、ロープからトロリへ、トロリからガーダへ伝わります。さらに、ガーダからサドルと車輪、**走行レール**、建物や基礎へ伝わります。荷を支える力が途中で途切れないように、各部分がつながっています。", "text": "荷をつると、荷の重さはフックからロープへ、ロープからトロリへ、トロリからガーダへ伝わります。さらに、ガーダからサドルと車輪、走行レール、建物や基礎へ伝わります。荷を支える力が途中で途切れないように、各部分がつながっています。", "terms": [], "block": "1-5-3e522167ecbb"}, {"id": "1-5/3/text", "raw": "こうした荷重を受けて支える部分が「構造部分」です。天井クレーンならガーダ、サドル、トロリフレームなど、橋形クレーンならガーダと脚などが該当します。**ケーブルクレーン**では、主索も荷を支える構造部分です。鉄の棒や板だけが構造部分とは限りません。", "text": "こうした荷重を受けて支える部分が「構造部分」です。天井クレーンならガーダ、サドル、トロリフレームなど、橋形クレーンならガーダと脚などが該当します。ケーブルクレーンでは、主索も荷を支える構造部分です。鉄の棒や板だけが構造部分とは限りません。", "terms": ["主索"], "block": "1-5-2a896e08d285"}, {"id": "1-5/5/rows:0:0", "raw": "**ガーダ**", "text": "ガーダ", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/5/rows:0:1", "raw": "トロリや荷を支える長い桁", "text": "トロリや荷を支える長い桁", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/5/rows:1:0", "raw": "**サドル**", "text": "サドル", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/5/rows:1:1", "raw": "ガーダの両端を支え、走行車輪を備える。代表例は鋼板を接合した箱形", "text": "ガーダの両端を支え、走行車輪を備える。代表例は鋼板を接合した箱形", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/5/rows:2:0", "raw": "**橋形クレーンの脚**", "text": "橋形クレーンの脚", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/5/rows:2:1", "raw": "ガーダを下から支える。軽く強くするため、箱形や鋼管などを使う", "text": "ガーダを下から支える。軽く強くするため、箱形や鋼管などを使う", "terms": ["ガーダ", "サドル"], "block": "1-5-rev26-structure"}, {"id": "1-5/6/text", "raw": "ガーダ・サドル・トロリフレームなどが、試験でいう**構造部分**です。階段や運転室は、この区分には含めません。", "text": "ガーダ・サドル・トロリフレームなどが、試験でいう構造部分です。階段や運転室は、この区分には含めません。", "terms": [], "block": "1-5-67618327ff0e"}, {"id": "1-5/7/text", "raw": "荷を支える材料の内部には、引っ張られる、押される、曲げられるなどの負担が生じます。その負担を単位面積あたりで表す量を「**応力**」といいます。ここでは、荷重を受けると材料の内部にも負担が生じる、という意味を理解すれば十分です。", "text": "荷を支える材料の内部には、引っ張られる、押される、曲げられるなどの負担が生じます。その負担を単位面積あたりで表す量を「応力」といいます。ここでは、荷重を受けると材料の内部にも負担が生じる、という意味を理解すれば十分です。", "terms": [], "block": "1-5-7423c6bd6e6a"}, {"id": "1-5/9/text", "raw": "**ガーダ**は、荷を受けて曲がろうとする長い桁です。同じ量の鋼材でも、材料をどこへ配置するかで曲がりにくさが変わります。そのため、単に太い板にするだけでなく、断面や骨組みの形を工夫します。", "text": "ガーダは、荷を受けて曲がろうとする長い桁です。同じ量の鋼材でも、材料をどこへ配置するかで曲がりにくさが変わります。そのため、単に太い板にするだけでなく、断面や骨組みの形を工夫します。", "terms": [], "block": "1-5-38848278705b"}, {"id": "1-5/11/text", "raw": "「**トラスガーダ**」は、細長い部材を三角形に組み合わせた骨組みです。三角形は形を保ちやすく、部材の引張りや圧縮を利用して荷を支えます。軽量化しながら強さを確保する構造に使われます。", "text": "「トラスガーダ」は、細長い部材を三角形に組み合わせた骨組みです。三角形は形を保ちやすく、部材の引張りや圧縮を利用して荷を支えます。軽量化しながら強さを確保する構造に使われます。", "terms": ["トラスガーダ"], "block": "1-5-c8cc5882064d"}, {"id": "1-5/12/text", "raw": "「Iビームガーダ」は、切り口がIの形をした鋼材を使います。「**プレートガーダ**」は、鋼板を組み合わせて桁を作ります。上下の板などを離して配置することで、曲げに抵抗しやすくします。", "text": "「Iビームガーダ」は、切り口がIの形をした鋼材を使います。「プレートガーダ」は、鋼板を組み合わせて桁を作ります。上下の板などを離して配置することで、曲げに抵抗しやすくします。", "terms": ["プレートガーダ"], "block": "1-5-c27bdb4510fc"}, {"id": "1-5/13/text", "raw": "**ボックスガーダ**は、鋼板を箱形につないだ桁です。水平力やねじれにも強く、補桁を必要としません。", "text": "ボックスガーダは、鋼板を箱形につないだ桁です。水平力やねじれにも強く、補桁を必要としません。", "terms": ["ボックスガーダ"], "block": "1-5-b9eeb75b1833"}, {"id": "1-5/14/text", "raw": "**トラスガーダ**は主桁と補桁を組み合わせます。Iビームガーダやプレートガーダは、補桁なしで使う場合もあります。断面の形と、補桁の要否を結び付けます。", "text": "トラスガーダは主桁と補桁を組み合わせます。Iビームガーダやプレートガーダは、補桁なしで使う場合もあります。断面の形と、補桁の要否を結び付けます。", "terms": [], "block": "1-5-918b39bc9b86"}, {"id": "1-5/16/text", "raw": "I形の桁を横から見ると、上下の横板が **フランジ**、その間の縦板が **ウェブ** です。プレートガーダは、こうした鋼板を接合して作ります。", "text": "I形の桁を横から見ると、上下の横板が フランジ、その間の縦板が ウェブ です。プレートガーダは、こうした鋼板を接合して作ります。", "terms": ["フランジ", "ウェブ"], "block": "1-5-b4d7e52a88c8"}, {"id": "1-5/17/text", "raw": "**フランジは主に曲げによる引張り・圧縮を、ウェブは主にせん断力を受け持つ** と整理します。トラスは板で囲う代わりに、主材と斜材などの骨組みで支えます。", "text": "フランジは主に曲げによる引張り・圧縮を、ウェブは主にせん断力を受け持つ と整理します。トラスは板で囲う代わりに、主材と斜材などの骨組みで支えます。", "terms": [], "block": "1-5-5a84dca9d51b"}, {"id": "1-5/19/text", "raw": "**シングルガーダ形は主桁が1本、ダブルガーダ形は主桁が2本。** 一般に、大きなつり上げ荷重や長いスパンにはダブルガーダ形が用いられます。", "text": "シングルガーダ形は主桁が1本、ダブルガーダ形は主桁が2本。 一般に、大きなつり上げ荷重や長いスパンにはダブルガーダ形が用いられます。", "terms": [], "block": "1-5-f9d2ee15bedd"}, {"id": "1-5/20/text", "raw": "「桁の本数」と「断面の形」は別の分類です。シングル／ダブルと、Iビーム／プレート／ボックスを混ぜて覚えないようにします。", "text": "「桁の本数」と「断面の形」は別の分類です。シングル／ダブルと、Iビーム／プレート／ボックスを混ぜて覚えないようにします。", "terms": [], "block": "1-5-1ad34e8f91c8"}, {"id": "1-5/24/text", "raw": "**橋形クレーン**の長いガーダは、気温が上がると伸び、下がると縮みます。左右の脚をどちらも完全に固めると、その伸び縮みを妨げて、余分な力が生じることがあります。", "text": "橋形クレーンの長いガーダは、気温が上がると伸び、下がると縮みます。左右の脚をどちらも完全に固めると、その伸び縮みを妨げて、余分な力が生じることがあります。", "terms": [], "block": "1-5-eebbe74ad703"}, {"id": "1-5/25/text", "raw": "**剛脚は垂直荷重と水平荷重、揺脚は垂直荷重を受ける**と整理します。揺脚はガーダとの連結部を動ける構造にし、ガーダの伸縮やたわみに対応します。", "text": "剛脚は垂直荷重と水平荷重、揺脚は垂直荷重を受けると整理します。揺脚はガーダとの連結部を動ける構造にし、ガーダの伸縮やたわみに対応します。", "terms": ["剛脚", "揺脚"], "block": "1-5-6dc93ffb3804"}, {"id": "1-5/27/items:0", "raw": "**剛脚：上下と横を支える。**", "text": "剛脚：上下と横を支える。", "terms": [], "block": "1-5-bbc1af2db77c"}, {"id": "1-5/27/items:1", "raw": "**揺脚：上下を支え、ガーダの変形に対応する。**", "text": "揺脚：上下を支え、ガーダの変形に対応する。", "terms": [], "block": "1-5-bbc1af2db77c"}, {"id": "1-5/29/text", "raw": "トロリは、荷をつる装置を横へ運ぶ台車です。「クラブトロリ」は、巻上げと横行の駆動装置を載せています。「ロープトロリ」は、それらを台車に載せず、別の場所からロープで動かします。「**セミロープトロリ**」は、巻上げ・横行の一方の駆動装置を台車に載せ、もう一方をロープで行う形式です。", "text": "トロリは、荷をつる装置を横へ運ぶ台車です。「クラブトロリ」は、巻上げと横行の駆動装置を載せています。「ロープトロリ」は、それらを台車に載せず、別の場所からロープで動かします。「セミロープトロリ」は、巻上げ・横行の一方の駆動装置を台車に載せ、もう一方をロープで行う形式です。", "terms": ["セミロープトロリ"], "block": "1-5-8f482198ca9a"}, {"id": "1-5/31/text", "raw": "「**マントロリ**」は、運転室が付いたトロリです。運転者も台車とともに移動します。クラブやロープという分類は駆動装置の配置、マンという名称は運転室の有無に着目したものなので、分類の観点にも注意します。", "text": "「マントロリ」は、運転室が付いたトロリです。運転者も台車とともに移動します。クラブやロープという分類は駆動装置の配置、マンという名称は運転室の有無に着目したものなので、分類の観点にも注意します。", "terms": ["マントロリ"], "block": "1-5-ed33739ecb65"}, {"id": "1-5/32/text", "raw": "**ホイスト**は、電動機・減速機・巻上げ部分・ブレーキなどを小さくまとめた装置です。この章では、**巻上装置と横行装置を一体化したもの**を基本形として覚えます。ロープ式はドラム、チェーン式はロードシーブを使います。", "text": "ホイストは、電動機・減速機・巻上げ部分・ブレーキなどを小さくまとめた装置です。この章では、巻上装置と横行装置を一体化したものを基本形として覚えます。ロープ式はドラム、チェーン式はロードシーブを使います。", "terms": [], "block": "1-5-6d5286ad1f9e"}], "candidates": [{"id": "1-5/3/text#84", "fieldID": "1-5/3/text", "block": "1-5-2a896e08d285", "answer": "主索", "category": "key", "prompt": "［用語？］", "start": 84, "end": 86, "context": "こうした荷重を受けて支える部分が「構造部分」です。天井クレーンならガーダ、サドル、トロリフレームなど、橋形クレーンならガーダと脚などが該当します。ケーブルクレーンでは、主索も荷を支える構造部分です。鉄の棒や板だけが構造部分とは限りません。", "start16": 84, "end16": 86}, {"id": "1-5/5/rows:0:0#0", "fieldID": "1-5/5/rows:0:0", "block": "1-5-rev26-structure", "answer": "ガーダ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "ガーダ", "start16": 0, "end16": 3}, {"id": "1-5/5/rows:1:0#0", "fieldID": "1-5/5/rows:1:0", "block": "1-5-rev26-structure", "answer": "サドル", "category": "key", "prompt": "［用語？］", "start": 0, "end": 3, "context": "サドル", "start16": 0, "end16": 3}, {"id": "1-5/11/text#1", "fieldID": "1-5/11/text", "block": "1-5-c8cc5882064d", "answer": "トラスガーダ", "category": "key", "prompt": "［用語？］", "start": 1, "end": 7, "context": "「トラスガーダ」は、細長い部材を三角形に組み合わせた骨組みです。三角形は形を保ちやすく、部材の引張りや圧縮を利用して荷を支えます。軽量化しながら強さを確保する構造に使われます。", "start16": 1, "end16": 7}, {"id": "1-5/12/text#30", "fieldID": "1-5/12/text", "block": "1-5-c27bdb4510fc", "answer": "プレートガーダ", "category": "key", "prompt": "［用語？］", "start": 30, "end": 37, "context": "「Iビームガーダ」は、切り口がIの形をした鋼材を使います。「プレートガーダ」は、鋼板を組み合わせて桁を作ります。上下の板などを離して配置することで、曲げに抵抗しやすくします。", "start16": 30, "end16": 37}, {"id": "1-5/13/text#0", "fieldID": "1-5/13/text", "block": "1-5-b9eeb75b1833", "answer": "ボックスガーダ", "category": "key", "prompt": "［用語？］", "start": 0, "end": 7, "context": "ボックスガーダは、鋼板を箱形につないだ桁です。水平力やねじれにも強く、補桁を必要としません。", "start16": 0, "end16": 7}, {"id": "1-5/16/text#19", "fieldID": "1-5/16/text", "block": "1-5-b4d7e52a88c8", "answer": "フランジ", "category": "key", "prompt": "［用語？］", "start": 19, "end": 23, "context": "I形の桁を横から見ると、上下の横板が フランジ、その間の縦板が ウェブ です。プレートガーダは、こうした鋼板を接合して作ります。", "start16": 19, "end16": 23}, {"id": "1-5/16/text#32", "fieldID": "1-5/16/text", "block": "1-5-b4d7e52a88c8", "answer": "ウェブ", "category": "key", "prompt": "［用語？］", "start": 32, "end": 35, "context": "I形の桁を横から見ると、上下の横板が フランジ、その間の縦板が ウェブ です。プレートガーダは、こうした鋼板を接合して作ります。", "start16": 32, "end16": 35}, {"id": "1-5/25/text#0", "fieldID": "1-5/25/text", "block": "1-5-6dc93ffb3804", "answer": "剛脚", "category": "key", "prompt": "［用語？］", "start": 0, "end": 2, "context": "剛脚は垂直荷重と水平荷重、揺脚は垂直荷重を受けると整理します。揺脚はガーダとの連結部を動ける構造にし、ガーダの伸縮やたわみに対応します。", "start16": 0, "end16": 2}, {"id": "1-5/25/text#13", "fieldID": "1-5/25/text", "block": "1-5-6dc93ffb3804", "answer": "揺脚", "category": "key", "prompt": "［用語？］", "start": 13, "end": 15, "context": "剛脚は垂直荷重と水平荷重、揺脚は垂直荷重を受けると整理します。揺脚はガーダとの連結部を動ける構造にし、ガーダの伸縮やたわみに対応します。", "start16": 13, "end16": 15}, {"id": "1-5/29/text#88", "fieldID": "1-5/29/text", "block": "1-5-8f482198ca9a", "answer": "セミロープトロリ", "category": "key", "prompt": "［用語？］", "start": 88, "end": 96, "context": "トロリは、荷をつる装置を横へ運ぶ台車です。「クラブトロリ」は、巻上げと横行の駆動装置を載せています。「ロープトロリ」は、それらを台車に載せず、別の場所からロープで動かします。「セミロープトロリ」は、巻上げ・横行の一方の駆動装置を台車に載せ、もう一方をロープで行う形式です。", "start16": 88, "end16": 96}, {"id": "1-5/31/text#1", "fieldID": "1-5/31/text", "block": "1-5-ed33739ecb65", "answer": "マントロリ", "category": "key", "prompt": "［用語？］", "start": 1, "end": 6, "context": "「マントロリ」は、運転室が付いたトロリです。運転者も台車とともに移動します。クラブやロープという分類は駆動装置の配置、マンという名称は運転室の有無に着目したものなので、分類の観点にも注意します。", "start16": 1, "end16": 6}], "rounds": {"all": [["1-5/25/text#13", "1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/text#84", "1-5/13/text#0"], ["1-5/29/text#88", "1-5/11/text#1", "1-5/12/text#30", "1-5/25/text#0", "1-5/16/text#32", "1-5/16/text#19", "1-5/5/rows:1:0#0", "1-5/3/tex
