<text x="450.000" y="583.000" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="23.4" fill="#C82D2D" font-weight="600">V = (2.0 × 1.0 − 0.4 × 0.5) × 0.05 = 0.09 m³</text>
<text x="450.000" y="618.000" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="23.4" fill="#C82D2D" font-weight="600">m = 0.09 × 7.8 t = 702 kg</text>
