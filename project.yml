name: CraneExam
options:
  bundleIdPrefix: com.safa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
settings:
  base:
    # ここがバージョンの唯一の採番源(CIはこの2値を読んで使う)。手動で管理する。
    #   MARKETING_VERSION      = 表示バージョン(例 1.0.1)
    #   CURRENT_PROJECT_VERSION = ビルド番号(例 2001)。※再ビルド時は必ず増やす
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2001"
targets:
  CraneExam:
    type: application
    platform: iOS
    sources:
      - path: CraneExam
    dependencies:
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safa.crane
        PRODUCT_NAME: CraneExam
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: "クレーン試験対策"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
