<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#102d4d"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137ac0"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ce343b"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="86" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="52" font-weight="500" text-anchor="middle">円柱を2本づり：体積 → 重さ → 1本の張力</text><text x="800" y="844" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">左右が均等に支える条件で計算する。つり角度60°、張力係数1.16。</text><path d="M200 450 V650 C200 700 560 700 560 650 V450" fill="#e8edf1" stroke="#102d4d" stroke-width="4"/><ellipse cx="380" cy="450" rx="180" ry="45" fill="#e8edf1" stroke="#102d4d" stroke-width="4"/><path d="M200 450 L380 180" fill="none" stroke="#137ac0" stroke-width="6"/><path d="M560 450 L380 180" fill="none" stroke="#137ac0" stroke-width="6"/><circle cx="380" cy="180" r="14" fill="white" stroke="#102d4d" stroke-width="4"/><path d="M350 225 Q380 250 410 225" fill="none" stroke="#102d4d" stroke-width="3"/><text x="380" y="285" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="middle">60°</text><text x="100" y="565" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="start">4 m</text><text x="380" y="750" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="middle">直径 1 m</text><text x="470" y="300" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">各ロープ 約41.0 kN</text><text x="760" y="260" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">体積：0.5² × 3.14 × 4 = 3.14 m³</text><text x="760" y="370" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">質量：3.14 × 2.3 = 7.222 t</text><text x="760" y="480" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">重さ：7.222 × 9.8 = 70.7756 kN</text><text x="760" y="590" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">1本：70.7756 ÷ 2 × 1.16</text><text x="760" y="650" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">　　　≒ 41.0 kN</text></svg>