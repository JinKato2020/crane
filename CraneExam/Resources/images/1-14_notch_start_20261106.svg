<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="1000" height="1120" role="img" aria-label="発進時：遅れた荷を待つ"><title>発進時：遅れた荷を待つ</title><rect width="1000" height="1120" fill="white" /><text x="500" y="75" font-size="47" font-weight="600" fill="#173650" text-anchor="middle" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">発進時：遅れた荷を待つ</text><rect x="30" y="130" width="940" height="260" rx="18" fill="#f3f7fa" /><text x="65" y="178" font-size="38" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">1  動き始め</text><line x1="110" y1="230" x2="550" y2="230" stroke="#a2b6c6" stroke-width="7" stroke-linecap="round" /><rect x="302" y="190" width="96" height="48" rx="7" fill="#c9dce8" stroke="#38546b" stroke-width="4" /><circle cx="323" cy="235" r="9" fill="#38546b" /><circle cx="377" cy="235" r="9" fill="#38546b" /><line x1="350" y1="242" x2="265" y2="345" stroke="#38546b" stroke-width="5" stroke-linecap="round" /><rect x="228" y="345" width="74" height="38" rx="4" fill="#e9c48f" stroke="#6e5840" stroke-width="3" /><line x1="350" y1="250" x2="350" y2="340" stroke="#a2b6c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><text x="620" y="240" font-size="42" font-weight="600" fill="#257dae" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">運転する</text><text x="620" y="294" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">台車が先に動く</text><text x="620" y="342" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">荷は後ろに残る</text><line x1="490" y1="200" x2="570" y2="200" stroke="#257dae" stroke-width="6" stroke-linecap="round" /><polygon points="570,200 553.7919521576518,207.82937961400214 553.7919521576518,192.17062038599786" fill="#257dae" /><rect x="30" y="420" width="940" height="260" rx="18" fill="#f3f7fa" /><text x="65" y="468" font-size="38" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">2  いったん待つ</text><line x1="110" y1="520" x2="550" y2="520" stroke="#a2b6c6" stroke-width="7" stroke-linecap="round" /><rect x="302" y="480" width="96" height="48" rx="7" fill="#c9dce8" stroke="#38546b" stroke-width="4" /><circle cx="323" cy="525" r="9" fill="#38546b" /><circle cx="377" cy="525" r="9" fill="#38546b" /><line x1="350" y1="532" x2="320" y2="635" stroke="#38546b" stroke-width="5" stroke-linecap="round" /><rect x="283" y="635" width="74" height="38" rx="4" fill="#e9c48f" stroke="#6e5840" stroke-width="3" /><line x1="350" y1="540" x2="350" y2="630" stroke="#a2b6c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><text x="620" y="530" font-size="42" font-weight="600" fill="#257dae" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">停止・減速</text><text x="620" y="584" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">荷が追いつく</text><text x="620" y="632" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">鉛直になる前…</text><line x1="365" y1="652" x2="445" y2="652" stroke="#c96534" stroke-width="6" stroke-linecap="round" /><polygon points="445,652 428.7919521576518,659.8293796140022 428.7919521576518,644.1706203859978" fill="#c96534" /><rect x="30" y="710" width="940" height="260" rx="18" fill="#f3f7fa" /><text x="65" y="758" font-size="38" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">3  荷に合わせる</text><line x1="110" y1="810" x2="550" y2="810" stroke="#a2b6c6" stroke-width="7" stroke-linecap="round" /><rect x="362" y="770" width="96" height="48" rx="7" fill="#c9dce8" stroke="#38546b" stroke-width="4" /><circle cx="383" cy="815" r="9" fill="#38546b" /><circle cx="437" cy="815" r="9" fill="#38546b" /><line x1="410" y1="822" x2="410" y2="925" stroke="#38546b" stroke-width="5" stroke-linecap="round" /><rect x="373" y="925" width="74" height="38" rx="4" fill="#e9c48f" stroke="#6e5840" stroke-width="3" /><line x1="410" y1="830" x2="410" y2="920" stroke="#a2b6c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><text x="620" y="820" font-size="42" font-weight="600" fill="#257dae" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">再び運転</text><text x="620" y="874" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">進行方向へ動かし</text><text x="620" y="922" font-size="35" font-weight="600" fill="#173650" text-anchor="start" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">振れを抑える</text><line x1="490" y1="780" x2="570" y2="780" stroke="#257dae" stroke-width="6" stroke-linecap="round" /><polygon points="570,780 553.7919521576518,787.8293796140022 553.7919521576518,772.1706203859978" fill="#257dae" /><text x="500" y="1060" font-size="40" font-weight="600" fill="#173650" text-anchor="middle" font-family="-apple-system, Hiragino Sans, Meiryo, sans-serif">青：台車の操作　橙：荷の動き</text></svg>