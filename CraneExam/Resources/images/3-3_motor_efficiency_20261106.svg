<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-label="入った電力を、仕事と損失に分ける"><title>入った電力を、仕事と損失に分ける</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="#2d769c"/></marker></defs><rect width="1000" height="820" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">入った電力を、仕事と損失に分ける</text><text x="500" y="135" font-size="30" fill="#718390" text-anchor="middle" font-weight="500">全部が軸の仕事になるわけではない</text><text x="100" y="240" font-size="38" fill="#203d53" text-anchor="start" font-weight="700">入力 8kW</text><rect x="100" y="270" width="800" height="95" rx="14" fill="#e4eff5" stroke="#2d769c" stroke-width="2"/><text x="500" y="331" font-size="32" fill="#2d769c" text-anchor="middle" font-weight="500">電気で受け取る</text><path d="M500,390 L500,440" fill="none" stroke="#2d769c" stroke-width="5" marker-end="url(#arrow)"/><rect x="100" y="480" width="600" height="120" rx="14" fill="#e4eff5" stroke="#2d769c" stroke-width="2"/><rect x="700" y="480" width="200" height="120" rx="14" fill="#faf0df" stroke="#ba8033" stroke-width="2"/><text x="400" y="530" font-size="36" fill="#2d769c" text-anchor="middle" font-weight="700">出力 6kW</text><text x="400" y="575" font-size="30" fill="#2d769c" text-anchor="middle" font-weight="500">軸を回す仕事</text><text x="800" y="530" font-size="32" fill="#ba8033" text-anchor="middle" font-weight="700">損失</text><text x="800" y="575" font-size="34" fill="#ba8033" text-anchor="middle" font-weight="700">2kW</text><text x="800" y="655" font-size="28" fill="#ba8033" text-anchor="middle" font-weight="500">熱などへ</text><text x="500" y="754" font-size="38" fill="#203d53" text-anchor="middle" font-weight="700">効率 ＝ 6 ÷ 8 × 100 ＝ 75％</text></g></svg>
