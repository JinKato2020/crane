<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" role="img" aria-label="惰走して減速 → ブレーキで停止"><title>惰走して減速 → ブレーキで停止</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="#2d769c"/></marker></defs><rect width="1000" height="980" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">惰走して減速 → ブレーキで停止</text><text x="500" y="130" font-size="29" fill="#718390" text-anchor="middle" font-weight="500">コースチングを備えた横行・走行の例</text><rect x="65" y="190" width="870" height="190" rx="14" fill="#fafbfc" stroke="#d4dfe6" stroke-width="2"/><text x="95" y="240" font-size="35" fill="#203d53" text-anchor="start" font-weight="700">動かしている</text><text x="95" y="293" font-size="31" fill="#2d769c" text-anchor="start" font-weight="500">モーター：通電</text><text x="505" y="293" font-size="31" fill="#ba8033" text-anchor="start" font-weight="500">ブレーキ：緩む</text><text x="95" y="345" font-size="31" fill="#203d53" text-anchor="start" font-weight="500">駆動する力で進む</text><path d="M500,395 L500,415" fill="none" stroke="#2d769c" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="430" width="870" height="190" rx="14" fill="#f1f6f8" stroke="#d4dfe6" stroke-width="2"/><text x="95" y="480" font-size="35" fill="#203d53" text-anchor="start" font-weight="700">1ノッチへ戻す</text><text x="95" y="533" font-size="31" fill="#2d769c" text-anchor="start" font-weight="500">モーター：無通電</text><text x="505" y="533" font-size="31" fill="#ba8033" text-anchor="start" font-weight="500">ブレーキ：緩む</text><text x="95" y="585" font-size="31" fill="#203d53" text-anchor="start" font-weight="500">惰走し、少しずつ減速</text><path d="M500,635 L500,655" fill="none" stroke="#2d769c" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="670" width="870" height="190" rx="14" fill="#fafbfc" stroke="#d4dfe6" stroke-width="2"/><text x="95" y="720" font-size="35" fill="#203d53" text-anchor="start" font-weight="700">0ノッチへ戻す</text><text x="95" y="773" font-size="31" fill="#2d769c" text-anchor="start" font-weight="500">モーター：無通電</text><text x="505" y="773" font-size="31" fill="#ba8033" text-anchor="start" font-weight="500">ブレーキ：かかる</text><text x="95" y="825" font-size="31" fill="#203d53" text-anchor="start" font-weight="500">ブレーキで停止する</text><text x="500" y="925" font-size="31" fill="#2d769c" text-anchor="middle" font-weight="700">1ノッチでは、ブレーキだけ通電して緩める。</text></g></svg>
