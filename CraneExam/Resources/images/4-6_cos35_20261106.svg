<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 885" role="img" aria-label="cosは「上向きに働く割合」"><title>cosは「上向きに働く割合」</title><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#2d769c"/></marker><marker id="red" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#b74b42"/></marker><marker id="gold" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#ba8033"/></marker></defs><rect width="1000" height="885" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">cosは「上向きに働く割合」</text><text x="500" y="132" font-size="30" fill="#718390" text-anchor="middle" font-weight="500">cos35°＝0.82なら、張力の82％が上向き</text><path d="M93.44915313862111,465 L265,220" fill="none" stroke="#203d53" stroke-width="5"/><path d="M265,220 L436.5508468613789,465" fill="none" stroke="#203d53" stroke-width="5"/><rect x="70" y="470" width="390" height="90" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><text x="265" y="527" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">荷の重量 W</text><path d="M265,220 V465" stroke="#718390" stroke-width="2" stroke-dasharray="8 7"/><path d="M207.64,301.92 A100,100 0 0 0 322.36,301.92" stroke="#ba8033" fill="none" stroke-width="3"/><text x="265" y="353" font-size="31" fill="#ba8033" text-anchor="middle" font-weight="500">70°</text><text x="265" y="615" font-size="32" fill="#203d53" text-anchor="middle" font-weight="700">片側は35°</text><path d="M610,520 L785.0518845524274,270" fill="none" stroke="#ba8033" stroke-width="6" marker-end="url(#gold)"/><path d="M610,520 L610,270" fill="none" stroke="#2d769c" stroke-width="5" marker-end="url(#arrow)"/><path d="M610,270 H785.0518845524274" stroke="#718390" stroke-width="2" stroke-dasharray="8 7"/><path d="M610,435 A85,85 0 0 1 658.75,450.37" stroke="#718390" fill="none" stroke-width="2"/><text x="650" y="390" font-size="28" fill="#203d53" text-anchor="middle" font-weight="500">35°</text><text x="700" y="235" font-size="32" fill="#ba8033" text-anchor="start" font-weight="500">張力 T</text><text x="590" y="340" font-size="28" fill="#2d769c" text-anchor="end" font-weight="500">上向き</text><text x="590" y="382" font-size="32" fill="#2d769c" text-anchor="end" font-weight="500">0.82T</text><text x="750" y="615" font-size="30" fill="#2d769c" text-anchor="middle" font-weight="500">上向きの力＝W÷2</text><rect x="65" y="680" width="870" height="145" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><text x="500" y="737" font-size="33" fill="#203d53" text-anchor="middle" font-weight="700">必要な上向きの力を0.82で割る</text><text x="500" y="788" font-size="35" fill="#203d53" text-anchor="middle" font-weight="500">T＝（W÷2）÷0.82</text></g></svg>
