<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" role="img" aria-label="偶力：2つの力でハンドルを回す"><title>偶力：2つの力でハンドルを回す</title><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#2d769c"/></marker><marker id="red" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#b74b42"/></marker><marker id="gold" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#ba8033"/></marker></defs><rect width="1000" height="770" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">偶力：2つの力でハンドルを回す</text><text x="500" y="130" font-size="30" fill="#718390" text-anchor="middle" font-weight="500">左右の力が、どちらも時計回りに働く</text><circle cx="500" cy="400" r="185" fill="#f8fafb" stroke="#203d53" stroke-width="13"/><path d="M315,400 L685,400" fill="none" stroke="#718390" stroke-width="10"/><path d="M500,400 L500,570" fill="none" stroke="#718390" stroke-width="10"/><circle cx="500" cy="400" r="22" fill="#203d53"/><path d="M285,430 L285,230" fill="none" stroke="#2d769c" stroke-width="7" marker-end="url(#arrow)"/><text x="190" y="350" font-size="32" fill="#2d769c" text-anchor="middle" font-weight="500">同じ力</text><path d="M715,370 L715,570" fill="none" stroke="#2d769c" stroke-width="7" marker-end="url(#arrow)"/><text x="815" y="460" font-size="32" fill="#2d769c" text-anchor="middle" font-weight="500">同じ力</text><path d="M444,305 A110,110 0 0 1 603,365" stroke="#ba8033" stroke-width="6" fill="none" marker-end="url(#gold)"/><text x="500" y="700" font-size="35" fill="#203d53" text-anchor="middle" font-weight="700">合力は0。でも、回す働きは残る。</text></g></svg>
