<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#102d4d"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137ac0"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ce343b"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="86" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="52" font-weight="500" text-anchor="middle">4本づり：1本の張力から必要な破断荷重へ</text><text x="800" y="844" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">4本が均等に負担する条件。各ロープは鉛直から45°、張力係数1.41。</text><text x="350" y="190" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">向かい合う2本の断面</text><path d="M350 260 L350 580" fill="none" stroke="#102d4d" stroke-width="3" stroke-dasharray="10 9"/><path d="M100 510 L350 260 L600 510" fill="none" stroke="#137ac0" stroke-width="6"/><rect x="100" y="510" width="500" height="110" rx="4" fill="#e8edf1" stroke="#102d4d" stroke-width="4"/><text x="350" y="583" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="middle">荷の質量 36 t</text><path d="M350 315 Q380 315 393 303" fill="none" stroke="#102d4d" stroke-width="3"/><text x="395" y="363" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="start">45°</text><text x="110" y="700" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" text-anchor="start">図の奥にも2本。合計4本で支える。</text><text x="760" y="270" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">① 1本の張力</text><text x="760" y="335" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">36 ÷ 4 × 9.8 × 1.41</text><text x="760" y="400" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">= 124.362 kN</text><text x="760" y="520" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">② 安全係数6に必要な破断荷重</text><text x="760" y="590" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">124.362 × 6</text><text x="760" y="655" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">= 746.172 ≒ 746.2 kN</text></svg>