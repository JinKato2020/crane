<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1900" viewBox="0 0 1680 1900" role="img" aria-labelledby="title desc">
<title id="title">第4章 重さが分かると、支え方と負担が分かる</title>
<desc id="desc">荷の重さを「力」に直して考える。つり合い、動き、ロープ、部材の強さはつながっている。。× 密度。× 重力加速度 g。荷に働く、下向きの力。つり合わない力が動きを変える。力と、回す働きがつり合う。衝撃・繰返しも負担になる。必要な力と引く距離を考える。張力を分力に分けて考える。ロープや部材に働く力を、強さと照らす</desc>
