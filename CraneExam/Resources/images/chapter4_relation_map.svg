<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2200" viewBox="0 0 3400 2200" role="img" aria-labelledby="title desc">
<title id="title">第4章 クレーンの運転のために必要な力学に関する知識のマインドマップ</title>
<desc id="desc">中心から6本の枝が伸び、重さと力、つり合いと安定、動きの変化、材料への負担、ロープの選定、滑車と仕事へ分かれます。</desc>
<metadata>{&quot;chapter&quot;: 4, &quot;sectionReferences&quot;: [&quot;4-0&quot;, &quot;4-1&quot;, &quot;4-2&quot;, &quot;4-3&quot;, &quot;4-4&quot;, &quot;4-5&quot;, &quot;4-6&quot;, &quot;4-7&quot;]}</metadata>
<rect width="3400" height="2200" fill="white"/>
<g font-family="Meiryo, sans-serif" fill="#233C50" stroke-linecap="round" stroke-linejoin="round">
<text x="1700" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#233C50">第4章  クレーンの運転のために必要な力学に関する知識</text>
<text x="1700" y="128" text-anchor="middle" font-size="30" font-weight="500" fill="#647B8C">中心から外へ、役割としくみのつながりをたどる</text>
<path d="M 1510 1100 C 1440 1100 1450 430 1390 430 L 1080 430" fill="none" stroke="#326F9B" stroke-width="17" opacity="1"/>
<text x="1090" y="402" text-anchor="start" font-size="48" font-weight="700" fill="#326F9B">重さと力</text>
<path d="M 1080 430 C 1025 430 1040 220 990 220 L 740 220" fill="none" stroke="#326F9B" stroke-width="7" opacity="0.85"/>
<text x="755" y="202" text-anchor="start" font-size="36" font-weight="700" fill="#326F9B">質量と重量</text>
<path d="M 740 220 C 690 220 695 188.0 640 188.0 L 90 188.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="174.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">質量kg × 重力加速度 → 重量N</text>
<path d="M 740 220 C 690 220 695 252.0 640 252.0 L 90 252.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="238.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">月でも質量は同じ、重量は違う</text>
<path d="M 1080 430 C 1025 430 1040 440 990 440 L 740 440" fill="none" stroke="#326F9B" stroke-width="7" opacity="0.85"/>
<text x="755" y="422" text-anchor="start" font-size="36" font-weight="700" fill="#326F9B">体積から質量</text>
<path d="M 740 440 C 690 440 695 408.0 640 408.0 L 90 408.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="394.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">形から体積 → 密度を掛ける</text>
<path d="M 740 440 C 690 440 695 472.0 640 472.0 L 90 472.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="458.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">中空なら外側の体積−内側の体積</text>
<path d="M 1080 430 C 1025 430 1040 660 990 660 L 740 660" fill="none" stroke="#326F9B" stroke-width="7" opacity="0.85"/>
<text x="755" y="642" text-anchor="start" font-size="36" font-weight="700" fill="#326F9B">力の三要素</text>
