<text x="64" y="72" text-anchor="start" font-size="24" font-weight="700" fill="#286897">第4章  /  全体のつながり</text>
<text x="64" y="139" text-anchor="start" font-size="46" font-weight="700" fill="#19374C">重さが分かると、支え方と負担が分かる</text>
<text x="64" y="188" text-anchor="start" font-size="26" font-weight="400" fill="#506777">荷の重さを「力」に直して考える。つり合い、動き、ロープ、部材の強さはつながっている。</text>
<text x="64" y="1862" text-anchor="start" font-size="22" font-weight="400" fill="#506777">まず働く力を描く。その後に「静かに支えるか」「動かすか」「何が力を受けるか」を考える。</text>
<rect x="64" y="270" width="400" height="207" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 294H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="337" text-anchor="start" font-size="28" font-weight="700" fill="#286897">形から、体積を求める</text>
<text x="88" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">中空なら「外側－内側」</text>
<text x="88" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">形に合った体積の式を使う</text>
<rect x="640" y="270" width="400" height="207" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M664 294H705" stroke="#286897" stroke-width="5"/>
<text x="664" y="337" text-anchor="start" font-size="32" font-weight="700" fill="#286897">質量 m〔kg〕</text>
<text x="664" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">物そのものの量</text>
<text x="664" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">地球でも月でも同じ</text>
<rect x="1216" y="270" width="400" height="207" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1240 294H1281" stroke="#286897" stroke-width="5"/>
<text x="1240" y="337" text-anchor="start" font-size="32" font-weight="700" fill="#286897">重量 W〔N〕</text>
<text x="1240" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">重力によって下向きに働く力</text>
<text x="1240" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">W＝m×g</text>
<rect x="600" y="640" width="480" height="244" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M624 664H665" stroke="#286897" stroke-width="5"/>
<text x="624" y="707" text-anchor="start" font-size="32" font-weight="700" fill="#286897">働く力を描く</text>
<text x="624" y="748" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">大きさ・向き・作用点を確かめる</text>
<text x="624" y="783" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">複数の力 → 1つの合力にまとめる</text>
<text x="624" y="818" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">1つの力 → 向き別の分力に分ける</text>
<rect x="64" y="1050" width="440" height="281" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1074H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="1117" text-anchor="start" font-size="32" font-weight="700" fill="#286897">動きと抵抗</text>
<text x="88" y="1158" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">加速度＝速度の変化÷時間</text>
<text x="88" y="1193" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">慣性：元の運動状態を保つ性質</text>
<text x="88" y="1228" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">円運動には中心向きの力が必要</text>
<text x="88" y="1263" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">摩擦は滑る動きを妨げる</text>
<rect x="1176" y="1050" width="440" height="281" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1200 1074H1241" stroke="#287E70" stroke-width="5"/>
<text x="1200" y="1117" text-anchor="start" font-size="32" font-weight="700" fill="#287E70">静かに支える</text>
<text x="1200" y="1158" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">合力もモーメントの合計も0</text>
<text x="1200" y="1193" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">モーメント＝力×垂直な腕の長さ</text>
<text x="1200" y="1228" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷は重心の真上からつる</text>
<text x="1200" y="1263" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">置いた物は重心と支持面で安定</text>
<rect x="64" y="1505" width="440" height="281" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1529H129" stroke="#9B6B27" stroke-width="5"/>
<text x="88" y="1572" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">部材が受ける負担</text>
<text x="88" y="1613" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">引張り・圧縮・曲げ・ねじりなど</text>
<text x="88" y="1648" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">引張応力＝引張荷重÷断面積</text>
<text x="88" y="1683" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">縦ひずみ＝伸び÷もとの長さ</text>
<text x="88" y="1718" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">弾性：戻る／塑性：変形が残る</text>
<text x="88" y="1753" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">繰返す負担で疲労が進む</text>
<rect x="620" y="1505" width="440" height="281" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M644 1529H685" stroke="#286897" stroke-width="5"/>
<text x="644" y="1572" text-anchor="start" font-size="32" font-weight="700" fill="#286897">滑車・仕事</text>
<text x="644" y="1613" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">定滑車は引く向きを変える</text>
<text x="644" y="1648" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">動滑車はロープで力を分担する</text>
<text x="644" y="1683" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">小さい力で長く引く（理想条件）</text>
<text x="644" y="1718" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">仕事＝力×その向きの移動距離</text>
<text x="644" y="1753" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">動力＝仕事÷時間</text>
<rect x="1176" y="1505" width="440" height="281" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1200 1529H1241" stroke="#287E70" stroke-width="5"/>
<text x="1200" y="1572" text-anchor="start" font-size="32" font-weight="700" fill="#287E70">玉掛けロープ</text>
<text x="1200" y="1613" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">左右対称の2本で静かにつると</text>
<text x="1200" y="1648" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">縦の分力＝片側で荷の重さの半分</text>
<text x="1200" y="1683" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">同じ荷なら開くほど張力が増す</text>
<text x="1200" y="1718" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">張力・モード係数で荷重を計算</text>
<text x="1200" y="1753" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">安全係数で強さの余裕を確認</text>
</g></svg>
