ot;w&quot;: 440, &quot;h&quot;: 281, &quot;title&quot;: &quot;静かに支える&quot;, &quot;lines&quot;: [&quot;合力もモーメントの合計も0&quot;, &quot;モーメント＝力×垂直な腕の長さ&quot;, &quot;荷は重心の真上からつる&quot;, &quot;置いた物は重心と支持面で安定&quot;], &quot;color&quot;: &quot;#287E70&quot;, &quot;refs&quot;: [&quot;4-1&quot;, &quot;4-3&quot;]}, {&quot;id&quot;: &quot;stress&quot;, &quot;x&quot;: 64, &quot;y&quot;: 1505, &quot;w&quot;: 440, &quot;h&quot;: 281, &quot;title&quot;: &quot;部材が受ける負担&quot;, &quot;lines&quot;: [&quot;引張り・圧縮・曲げ・ねじりなど&quot;, &quot;引張応力＝引張荷重÷断面積&quot;, &quot;縦ひずみ＝伸び÷もとの長さ&quot;, &quot;弾性：戻る／塑性：変形が残る&quot;, &quot;繰返す負担で疲労が進む&quot;], &quot;color&quot;: &quot;#9B6B27&quot;, &quot;refs&quot;: [&quot;4-5&quot;]}, {&quot;id&quot;: &quot;pulley&quot;, &quot;x&quot;: 620, &quot;y&quot;: 1505, &quot;w&quot;: 440, &quot;h&quot;: 281, &quot;title&quot;: &quot;滑車・仕事&quot;, &quot;lines&quot;: [&quot;定滑車は引く向きを変える&quot;, &quot;動滑車はロープで力を分担する&quot;, &quot;小さい力で長く引く（理想条件）&quot;, &quot;仕事＝力×その向きの移動距離&quot;, &quot;動力＝仕事÷時間&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;4-7&quot;]}, {&quot;id&quot;: &quot;sling&quot;, &quot;x&quot;: 1176, &quot;y&quot;: 1505, &quot;w&quot;: 440, &quot;h&quot;: 281, &quot;title&quot;: &quot;玉掛けロープ&quot;, &quot;lines&quot;: [&quot;左右対称の2本で静かにつると&quot;, &quot;縦の分力＝片側で荷の重さの半分&quot;, &quot;同じ荷なら開くほど張力が増す&quot;, &quot;張力・モード係数で荷重を計算&quot;, &quot;安全係数で強さの余裕を確認&quot;], &quot;color&quot;: &quot;#287E70&quot;, &quot;refs&quot;: [&quot;4-6&quot;]}], &quot;relationships&quot;: [{&quot;source&quot;: &quot;volume&quot;, &quot;target&quot;: &quot;mass&quot;, &quot;relation&quot;: &quot;× 密度&quot;, &quot;points&quot;: [[464, 374], [640, 374]], &quot;dashed&quot;: false}, {&quot;source&quot;: &quot;mass&quot;, &quot;target&quot;: &quot;weight&quot;, &quot;relation&quot;: &quot;× 重力加速度 g&quot;, &quot;points&quot;: [[1040, 374], [1216, 374]], &quot;dashed&quot;: false}, {&quot;source&quot;: &quot;weight&quot;, &quot;target&quot;: &quot;force&quot;, &quot;relation&quot;