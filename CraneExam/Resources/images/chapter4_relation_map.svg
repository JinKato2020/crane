<text x="108" y="646.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">大きさ・向き・作用点</text>
<path d="M 1510 1100 C 1440 1100 1450 1090 1390 1090 L 1080 1090" fill="none" stroke="#527D94" stroke-width="17" opacity="1"/>
<text x="1090" y="1062" text-anchor="start" font-size="48" font-weight="700" fill="#527D94">つり合いと安定</text>
<path d="M 1080 1090 C 1025 1090 1040 880 990 880 L 740 880" fill="none" stroke="#527D94" stroke-width="7" opacity="0.85"/>
<text x="755" y="862" text-anchor="start" font-size="36" font-weight="700" fill="#527D94">合力と分力</text>
