<text x="88" y="1078" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">車輪・走路・支柱など</text>
<text x="88" y="1113" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">を介して支える</text>
