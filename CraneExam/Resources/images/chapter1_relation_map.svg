<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480">
<rect width="2000" height="1480" fill="#fff"/>
<g font-family="Meiryo, sans-serif" fill="#20374B">
<text x="1000" y="72" font-size="62" font-weight="700" text-anchor="middle" fill="#20374B">第1章｜クレーンのつながり</text>
<text x="1000" y="119" font-size="34" font-weight="500" text-anchor="middle" fill="#586C7C">部品の名前を、荷が動く仕組みと結びつける</text>
<path d="M 755 660 C 680 660, 715 260, 640 260" stroke="#2D6685" stroke-width="6" fill="none" opacity=".55"/><circle cx="640" cy="260" r="7" fill="#2D6685"/>
<path d="M 755 700 C 680 700, 715 510, 640 510" stroke="#3B7286" stroke-width="6" fill="none" opacity=".55"/><circle cx="640" cy="510" r="7" fill="#3B7286"/>
<path d="M 755 740 C 680 740, 715 760, 640 760" stroke="#37775C" stroke-width="6" fill="none" opacity=".55"/><circle cx="640" cy="760" r="7" fill="#37775C"/>
<path d="M 755 780 C 680 780, 715 1010, 640 1010" stroke="#4B776C" stroke-width="6" fill="none" opacity=".55"/><circle cx="640" cy="1010" r="7" fill="#4B776C"/>
<path d="M 755 820 C 680 820, 715 1260, 640 1260" stroke="#526D8D" stroke-width="6" fill="none" opacity=".55"/><circle cx="640" cy="1260" r="7" fill="#526D8D"/>
<path d="M 1245 660 C 1320 660, 1285 260, 1360 260" stroke="#9C6A24" stroke-width="6" fill="none" opacity=".55"/><circle cx="1360" cy="260" r="7" fill="#9C6A24"/>
<path d="M 1245 700 C 1320 700, 1285 510, 1360 510" stroke="#8B7135" stroke-width="6" fill="none" opacity=".55"/><circle cx="1360" cy="510" r="7" fill="#8B7135"/>
<path d="M 1245 740 C 1320 740, 1285 760, 1360 760" stroke="#89616C" stroke-width="6" fill="none" opacity=".55"/><circle cx="1360" cy="760" r="7" fill="#89616C"/>
<path d="M 1245 780 C 1320 780, 1285 1010, 1360 1010" stroke="#9A5E4D" stroke-width="6" fill="none" opacity=".55"/><circle cx="1360" cy="1010" r="7" fill="#9A5E4D"/>
<path d="M 1245 820 C 1320 820, 1285 1260, 1360 1260" stroke="#68754D" stroke-width="6" fill="none" opacity=".55"/><circle cx="1360" cy="1260" r="7" fill="#68754D"/>
<rect x="40" y="150" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="40" y="172" width="7" height="42" rx="3" fill="#2D6685"/>
<text x="66" y="201" font-size="43" font-weight="700" text-anchor="start" fill="#2D6685">形と動き</text>
<text x="66" y="251" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">天井・橋形・ジブ・ケーブル</text>
<text x="66" y="296" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">走行＝全体、横行＝トロリ</text>
<text x="66" y="341" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">巻上げ・起伏・旋回も区別</text>
<rect x="40" y="400" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="40" y="422" width="7" height="42" rx="3" fill="#3B7286"/>
<text x="66" y="451" font-size="43" font-weight="700" text-anchor="start" fill="#3B7286">能力と作業の条件</text>
<text x="66" y="501" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">定格荷重＝条件ごとの荷の上限</text>
<text x="66" y="546" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">作業半径＝旋回中心〜荷（水平）</text>
<text x="66" y="591" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">揚程＝つり具が上下できる範囲</text>
<rect x="40" y="650" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="40" y="672" width="7" height="42" rx="3" fill="#37775C"/>
<text x="66" y="701" font-size="43" font-weight="700" text-anchor="start" fill="#37775C">骨組み：天井の例</text>
<text x="66" y="751" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">荷 → ロープ・つり具 → トロリ</text>
<text x="66" y="796" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">→ ガーダ → サドル・車輪</text>
<text x="66" y="841" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">→ 走行レール → 建物・基礎</text>
<rect x="40" y="900" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="40" y="922" width="7" height="42" rx="3" fill="#4B776C"/>
<text x="66" y="951" font-size="43" font-weight="700" text-anchor="start" fill="#4B776C">ワイヤロープの構造</text>
<text x="66" y="1001" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">素線 → ストランド → ロープ</text>
<text x="66" y="1046" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">心綱のまわりにより合わせる</text>
<text x="66" y="1091" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">普通より／ラングよりを区別</text>
<rect x="40" y="1150" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="40" y="1172" width="7" height="42" rx="3" fill="#526D8D"/>
<text x="66" y="1201" font-size="43" font-weight="700" text-anchor="start" fill="#526D8D">荷に合わせるつり具</text>
<text x="66" y="1251" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">フック＝玉掛け用具を掛ける</text>
<text x="66" y="1296" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">バケット＝砂・鉱石などをつかむ</text>
<text x="66" y="1341" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">磁石＝磁性のある鋼材を扱う</text>
<rect x="1360" y="150" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="1360" y="172" width="7" height="42" rx="3" fill="#9C6A24"/>
<text x="1386" y="201" font-size="43" font-weight="700" text-anchor="start" fill="#9C6A24">荷を動かす装置</text>
<text x="1386" y="251" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">電動機 → 減速機 → ドラム</text>
<text x="1386" y="296" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">ドラムがロープを巻き取る</text>
<text x="1386" y="341" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">ロープ → つり具 → 荷が動く</text>
<rect x="1360" y="400" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="1360" y="422" width="7" height="42" rx="3" fill="#8B7135"/>
<text x="1386" y="451" font-size="43" font-weight="700" text-anchor="start" fill="#8B7135">回転を伝え・支える</text>
<text x="1386" y="501" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">歯車・軸・継手・キーで伝える</text>
<text x="1386" y="546" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">軸受は、回る軸を支える</text>
<text x="1386" y="591" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">ボルト・座金・ナットで締結</text>
<rect x="1360" y="650" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="1360" y="672" width="7" height="42" rx="3" fill="#89616C"/>
<text x="1386" y="701" font-size="43" font-weight="700" text-anchor="start" fill="#89616C">止める・保持する</text>
<text x="1386" y="751" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">ブレーキで減速し、停止する</text>
<text x="1386" y="796" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">停止後も、荷をその場に保つ</text>
<text x="1386" y="841" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">止め方と保持の仕組みを学ぶ</text>
<rect x="1360" y="900" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="1360" y="922" width="7" height="42" rx="3" fill="#9A5E4D"/>
<text x="1386" y="951" font-size="43" font-weight="700" text-anchor="start" fill="#9A5E4D">危険を防いで運転</text>
<text x="1386" y="1001" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">巻過ぎ・過負荷・逸走を防ぐ</text>
<text x="1386" y="1046" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">重心・玉掛け・周囲を確認</text>
<text x="1386" y="1091" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">ゆっくり地切りして状態を見る</text>
<rect x="1360" y="1150" width="600" height="220" rx="22" fill="#F8FAFC" stroke="#D9E2E9" stroke-width="2"/><rect x="1360" y="1172" width="7" height="42" rx="3" fill="#68754D"/>
<text x="1386" y="1201" font-size="43" font-weight="700" text-anchor="start" fill="#68754D">状態を保つ・調べる</text>
<text x="1386" y="1251" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">給油で摩擦と摩耗を抑える</text>
<text x="1386" y="1296" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">点検で損傷・異常を見つける</text>
<text x="1386" y="1341" font-size="36" font-weight="500" text-anchor="start" fill="#20374B">作業前・月次・年次を区別</text>
<rect x="755" y="590" width="490" height="360" rx="36" fill="#F0F4F8" stroke="#BDCAD6" stroke-width="3"/>
<text x="1000" y="650" font-size="56" font-weight="700" text-anchor="middle" fill="#20374B">クレーン</text>
<text x="1000" y="699" font-size="31" font-weight="600" text-anchor="middle" fill="#20374B">動力でつり上げ、水平に運ぶ</text>
<g fill="none" stroke="#35516A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M825 889V760H1175V889M825 775H1175"/><path d="M980 761H1030V785H980Z" fill="#E4AF57"/><path d="M1005 785V829Q1025 849 1005 861Q989 866 987 849"/><path d="M868 901H1132" stroke="#ADBCC8" stroke-width="5"/></g><path d="M948 746H1060M1050 737L1060 746L1050 755" fill="none" stroke="#2E7AA2" stroke-width="6" stroke-linecap="round"/><path d="M1048 806V854M1040 846L1048 854L1056 846" fill="none" stroke="#AD634A" stroke-width="6" stroke-linecap="round"/>
<text x="1000" y="1438" font-size="37" font-weight="600" text-anchor="middle" fill="#20374B">全体像をつかむ → 部品の役割を知る → 安全な運転・点検につなげる</text>
</g>
</svg>
