<text x="506" y="1078" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ガーダ・ジブなど</text>
<text x="506" y="1113" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷重を支える構造</text>
<rect x="900" y="970" width="300" height="207" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M924 994H965" stroke="#287E70" stroke-width="5"/>
<text x="924" y="1037" text-anchor="start" font-size="30" font-weight="700" fill="#287E70">機械の支持部</text>
<text x="924" y="1078" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ドラム・シーブなどの</text>
<text x="924" y="1113" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">軸や支持部で受ける</text>
<rect x="1318" y="970" width="298" height="207" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1342 994H1383" stroke="#287E70" stroke-width="5"/>
<text x="1342" y="1037" text-anchor="start" font-size="30" font-weight="700" fill="#287E70">ロープ・シーブ</text>
<text x="1342" y="1078" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ロープに張力が働く</text>
<text x="1342" y="1113" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">シーブで向きを変える</text>
<rect x="64" y="1315" width="1552" height="150" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1339H129" stroke="#287E70" stroke-width="5"/>
<text x="88" y="1382" text-anchor="start" font-size="32" font-weight="700" fill="#287E70">形が変わると、支え方と動ける方向が変わる</text>
<text x="88" y="1423" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">天井クレーン・橋形クレーン・ジブクレーンなどを、この2つの道で見比べよう。</text>
