<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1550" viewBox="0 0 1680 1550" role="img" aria-labelledby="title desc">
<title id="title">第1章 クレーンは、どうやって荷を動かす？</title>
<desc id="desc">青は「動かす道」、緑は「重さを支える道」。同じ装置を、2つの役割から見る。。回転。回転。巻取り。巻上げ前に確認。停止・保持・制限。状態を確認。荷重を伝える。荷重。荷重。荷重。機種ごとに形が変わる</desc>
