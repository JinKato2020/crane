<text x="108" y="394.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">巻上げ・巻下げ＝荷が上下</text>
<path d="M 740 440 C 690 440 695 472.0 640 472.0 L 90 472.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="458.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">横行＝トロリ ／ 走行＝全体</text>
