<text x="64" y="72" text-anchor="start" font-size="24" font-weight="700" fill="#286897">第1章  /  全体のつながり</text>
<text x="64" y="139" text-anchor="start" font-size="46" font-weight="700" fill="#19374C">クレーンは、どうやって荷を動かす？</text>
<text x="64" y="188" text-anchor="start" font-size="26" font-weight="400" fill="#506777">青は「動かす道」、緑は「重さを支える道」。同じ装置を、2つの役割から見る。</text>
<text x="64" y="1512" text-anchor="start" font-size="22" font-weight="400" fill="#506777">実線＝動き・力が伝わる道　／　破線＝安全を保つ働き・しくみの補足</text>
<rect x="64" y="250" width="420" height="175" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 274H129" stroke="#9B6B27" stroke-width="5"/>
<text x="88" y="317" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">運転前の確認</text>
<text x="88" y="358" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷・作業範囲・合図を確認</text>
<text x="88" y="393" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">定格荷重などの能力を守る</text>
<rect x="620" y="250" width="440" height="175" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M644 274H685" stroke="#9B6B27" stroke-width="5"/>
<text x="644" y="317" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">ブレーキ・安全装置</text>
<text x="644" y="358" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">停止・保持／巻過ぎの防止など</text>
<text x="644" y="393" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">それぞれが違う危険を防ぐ</text>
<rect x="1196" y="250" width="420" height="175" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1220 274H1261" stroke="#9B6B27" stroke-width="5"/>
<text x="1220" y="317" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">点検・給油</text>
<text x="1220" y="358" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">摩耗・断線・ゆるみを見つける</text>
<text x="1220" y="393" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">動く部分の状態を保つ</text>
<rect x="64" y="570" width="300" height="180" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 594H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="637" text-anchor="start" font-size="30" font-weight="700" fill="#286897">電動機</text>
<text x="88" y="678" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">回転を生む</text>
<rect x="482" y="570" width="300" height="180" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
