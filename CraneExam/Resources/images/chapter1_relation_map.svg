<text x="755" y="202" text-anchor="start" font-size="36" font-weight="700" fill="#326F9B">クレーンの形</text>
<path d="M 740 220 C 690 220 695 188.0 640 188.0 L 90 188.0" fill="none" stroke="#326F9B" stroke-width="3" opacity="0.55"/>
<text x="108" y="174.0" text-anchor="start" font-size="32" font-weight="500" fill="#233C50">天井・橋形</text>
