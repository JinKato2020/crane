<text x="506" y="713" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">回転速度を変える</text>
<rect x="900" y="570" width="300" height="180" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M924 594H965" stroke="#286897" stroke-width="5"/>
<text x="924" y="637" text-anchor="start" font-size="30" font-weight="700" fill="#286897">ドラム</text>
<text x="924" y="678" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ロープを巻き取る</text>
<rect x="1318" y="570" width="298" height="180" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
