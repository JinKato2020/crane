<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2200" viewBox="0 0 3400 2200" role="img" aria-labelledby="title desc">
<title id="title">第1章 クレーンのマインドマップ</title>
<desc id="desc">中心のクレーンから、姿と動き、能力と範囲、荷を支える、荷を動かす、止める・守る、点検・手入れの6本の枝が伸び、部品と役割へ分かれます。</desc>
<metadata>{&quot;chapter&quot;: 1, &quot;sectionReferences&quot;: [&quot;1-1&quot;, &quot;1-10&quot;, &quot;1-11&quot;, &quot;1-12&quot;, &quot;1-13&quot;, &quot;1-14&quot;, &quot;1-2&quot;, &quot;1-3&quot;, &quot;1-4&quot;, &quot;1-5&quot;, &quot;1-6&quot;, &quot;1-7&quot;, &quot;1-8&quot;, &quot;1-9&quot;]}</metadata>
