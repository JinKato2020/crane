<text x="1342" y="678" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ロープ・つり具を介し</text>
<text x="1342" y="713" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷が上がる・下がる</text>
<text x="64" y="898" text-anchor="start" font-size="28" font-weight="700" fill="#287E70">荷の重さは、ロープから骨組み、建物や地盤へ伝わる</text>
