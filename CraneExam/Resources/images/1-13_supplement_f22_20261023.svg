amily="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="36" font-weight="500" text-anchor="middle">大きい D</text><text x="800" y="755" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">D：ロープ中心が通る円の直径　　d：ロープ径（両図で同じ）</text></svg>