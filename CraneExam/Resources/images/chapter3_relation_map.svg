<text x="64" y="72" text-anchor="start" font-size="24" font-weight="700" fill="#286897">第3章  /  全体のつながり</text>
<text x="64" y="139" text-anchor="start" font-size="46" font-weight="700" fill="#19374C">電気が届く → 回る → 荷が動く</text>
<text x="64" y="188" text-anchor="start" font-size="26" font-weight="400" fill="#506777">電気の公式も、回転子も、制御も。「荷を動かす流れ」のどこに関わるかで整理する。</text>
<text x="64" y="1862" text-anchor="start" font-size="22" font-weight="400" fill="#506777">実線＝電気・動き・しくみのつながり　／　破線＝安全を保つための働き</text>
<rect x="64" y="270" width="700" height="281" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 294H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="337" text-anchor="start" font-size="32" font-weight="700" fill="#286897">電流は、電圧と抵抗で決まる</text>
<text x="88" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電圧は押し流す働き、抵抗は流れにくさ</text>
<text x="88" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">I＝V÷R：他の条件が同じなら</text>
<text x="88" y="448" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電圧を上げると電流↑／抵抗を増やすと電流↓</text>
<text x="88" y="483" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">直列：抵抗を足す　並列：全体の抵抗は小さくなる</text>
<rect x="1090" y="270" width="526" height="281" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1114 294H1155" stroke="#286897" stroke-width="5"/>
<text x="1114" y="337" text-anchor="start" font-size="32" font-weight="700" fill="#286897">電力と電力量</text>
<text x="1114" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電力：電気を使う勢い〔W〕</text>
<text x="1114" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">直流では P＝V×I</text>
<text x="1114" y="448" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電力量＝電力×時間〔Whなど〕</text>
<text x="1114" y="483" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">ジュール熱：電流が流れて生じる熱</text>
<rect x="64" y="775" width="300" height="244" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 799H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="842" text-anchor="start" font-size="30" font-weight="700" fill="#286897">電源・給電</text>
<text x="88" y="883" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">トロリ線やケーブル</text>
<text x="88" y="918" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">などで、動く本体や</text>
<text x="88" y="953" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">回転部へ電気を渡す</text>
<rect x="482" y="775" width="300" height="244" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M506 799H547" stroke="#286897" stroke-width="5"/>
<text x="506" y="842" text-anchor="start" font-size="30" font-weight="700" fill="#286897">制御器</text>
<text x="506" y="883" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">操作の指令に合わせ</text>
<text x="506" y="918" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電動機を運転する</text>
<text x="506" y="953" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">直接制御／間接制御</text>
<rect x="900" y="775" width="300" height="244" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M924 799H965" stroke="#287E70" stroke-width="5"/>
<text x="924" y="842" text-anchor="start" font-size="30" font-weight="700" fill="#287E70">電動機</text>
<text x="924" y="883" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">電気を使って</text>
<text x="924" y="918" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">軸を回す</text>
<rect x="1318" y="775" width="298" height="244" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1342 799H1383" stroke="#287E70" stroke-width="5"/>
<text x="1342" y="842" text-anchor="start" font-size="28" font-weight="700" fill="#287E70">巻上げ装置・荷</text>
<text x="1342" y="883" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">機械に回転を伝え</text>
<text x="1342" y="918" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷を動かす</text>
<rect x="64" y="1215" width="500" height="244" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1239H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="1282" text-anchor="start" font-size="30" font-weight="700" fill="#286897">速さ・回転方向を変える</text>
<text x="88" y="1323" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">インバーター：周波数を変える</text>
<text x="88" y="1358" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">巻線形：二次抵抗でも調整</text>
<text x="88" y="1393" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">回転方向：三相のうち2本を入替え</text>
<rect x="760" y="1215" width="856" height="281" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M784 1239H825" stroke="#287E70" stroke-width="5"/>
<text x="784" y="1282" text-anchor="start" font-size="32" font-weight="700" fill="#287E70">電動機の中では、何が起きる？</text>
<text x="784" y="1323" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">三相交流が、回転する磁界をつくる</text>
<text x="784" y="1358" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">回転子に誘導電流 → 磁界との作用で回す力が生まれる</text>
<text x="784" y="1393" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">かご形・巻線形：回転子の構造が違う</text>
<text x="784" y="1428" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">通常の電動運転では、回転子は磁界より少し遅く回る</text>
<rect x="64" y="1650" width="1552" height="150" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1674H129" stroke="#9B6B27" stroke-width="5"/>
<text x="88" y="1717" text-anchor="start" font-size="32" font-weight="700" fill="#9B6B27">この流れを、安全に保つ</text>
<text x="88" y="1758" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">絶縁で漏電を防ぐ。接地や保護装置で異常に備える。測定・点検で劣化や異常を見つける。</text>
</g></svg>
