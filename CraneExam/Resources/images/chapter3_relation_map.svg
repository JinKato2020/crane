<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1900" viewBox="0 0 1680 1900" role="img" aria-labelledby="title desc">
<title id="title">第3章 電気が届く → 回る → 荷が動く</title>
<desc id="desc">電気の公式も、回転子も、制御も。「荷を動かす流れ」のどこに関わるかで整理する。。電圧と電流から求める。流れる電気の基本。電気。電気。回転。動きの調整につながる。回転を生むしくみ。給電から電動機までを保護</desc>
<metadata>{&quot;chapter&quot;: 3, &quot;design&quot;: &quot;labelled-relationships-v2&quot;, &quot;sectionReferences&quot;: [&quot;3-0&quot;, &quot;3-1&quot;, &quot;3-2&quot;, &quot;3-3&quot;, &quot;3-4&quot;, &quot;3-5&quot;, &quot;3-6&quot;, &quot;3-7&quot;], &quot;nodes&quot;: [{&quot;id&quot;: &quot;basics&quot;, &quot;x&quot;: 64, &quot;y&quot;: 270, &quot;w&quot;: 700, &quot;h&quot;: 281, &quot;title&quot;: &quot;電流は、電圧と抵抗で決まる&quot;, &quot;lines&quot;: [&quot;電圧は押し流す働き、抵抗は流れにくさ&quot;, &quot;I＝V÷R：他の条件が同じなら&quot;, &quot;電圧を上げると電流↑／抵抗を増やすと電流↓&quot;, &quot;直列：抵抗を足す　並列：全体の抵抗は小さくなる&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;3-0&quot;, &quot;3-1&quot;, &quot;3-2&quot;]}, {&quot;id&quot;: &quot;energy&quot;, &quot;x&quot;: 1090, &quot;y&quot;: 270, &quot;w&quot;: 526, &quot;h&quot;: 281, &quot;title&quot;: &quot;電力と電力量&quot;, &quot;lines&quot;: [&quot;電力：電気を使う勢い〔W〕&quot;, &quot;直流では P＝V×I&quot;, &quot;電力量＝電力×時間〔Whなど〕&quot;, &quot;ジュール熱：電流が流れて生じる熱&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;3-2&quot;]}, {&quot;id&quot;: &quot;supply&quot;, &quot;x&quot;: 64, &quot;y&quot;: 775, &quot;w&quot;: 300, &quot;h&quot;: 244, &quot;title&quot;: &quot;電源・給電&quot;, &quot;lines&quot;: [&quot;トロリ線やケーブル&quot;, &quot;などで、動く本体や&quot;, &quot;回転部へ電気を渡す&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;3-5&quot;]}, {&quot;id&quot;: &quot;control&quot;, &quot;x&quot;: 482, &quot;y&quot;: 775, &quot;w&quot;: 300, &quot;h&quot;: 244, &quot;title&quot;: &quot;制御器&quot;, &quot;lines&quot;: [&quot;操作の指令に合わせ&quot;, &quot;電動機を運転する&quot;, &quot;直接制御／間接制御&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;3-4&quot;]}, {&quot;id&quot;: &quot;motor&quot;, &quot;x&quot;: 900, &quot;y&quot;: 775, &quot;w&quot;: 300, &quot;h&quot;: 244, &quot;title&quot;: &quot;電動機&quot;, &quot;lines&quot;: [&quot;電気を使って&quot;, &quot;軸を回す&quot;], &quot;color&quot;: &quot;#287E70&quot;, &quot;refs&quot;: [&quot;3-3&