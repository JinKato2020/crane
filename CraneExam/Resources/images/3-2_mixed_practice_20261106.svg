<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-label="合成抵抗を、自分で求めよう"><title>合成抵抗を、自分で求めよう</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="#2d769c"/></marker></defs><rect width="1000" height="840" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">合成抵抗を、自分で求めよう</text><text x="500" y="130" font-size="30" fill="#718390" text-anchor="middle" font-weight="500">まず、枝分かれしている部分をまとめる</text><text x="90" y="365" font-size="36" fill="#203d53" text-anchor="start" font-weight="700">A</text><text x="910" y="365" font-size="36" fill="#203d53" text-anchor="start" font-weight="700">B</text><path d="M100,405 L190,405" fill="none" stroke="#203d53" stroke-width="4"/><path d="M320,405 L440,405" fill="none" stroke="#203d53" stroke-width="4"/><path d="M440,270 L440,540" fill="none" stroke="#203d53" stroke-width="4"/><path d="M800,270 L800,540" fill="none" stroke="#203d53" stroke-width="4"/><path d="M800,405 L915,405" fill="none" stroke="#203d53" stroke-width="4"/><path d="M440,270 L550,270" fill="none" stroke="#203d53" stroke-width="4"/><path d="M680,270 L800,270" fill="none" stroke="#203d53" stroke-width="4"/><rect x="550" y="246" width="130" height="48" fill="#edf2f5" stroke="#203d53" stroke-width="3"/><path d="M440,540 L550,540" fill="none" stroke="#203d53" stroke-width="4"/><path d="M680,540 L800,540" fill="none" stroke="#203d53" stroke-width="4"/><rect x="550" y="516" width="130" height="48" fill="#edf2f5" stroke="#203d53" stroke-width="3"/><rect x="190" y="381" width="130" height="48" fill="#edf2f5" stroke="#203d53" stroke-width="3"/><circle cx="100" cy="405" r="6" fill="#203d53"/><circle cx="440" cy="405" r="6" fill="#203d53"/><circle cx="800" cy="405" r="6" fill="#203d53"/><circle cx="915" cy="405" r="6" fill="#203d53"/><text x="255" y="355" font-size="36" fill="#203d53" text-anchor="middle" font-weight="700">100Ω</text><text x="615" y="220" font-size="36" fill="#203d53" text-anchor="middle" font-weight="700">200Ω</text><text x="615" y="605" font-size="36" fill="#203d53" text-anchor="middle" font-weight="700">600Ω</text><rect x="70" y="685" width="860" height="100" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><text x="500" y="746" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">200Ω と 600Ω は並列。100Ω はその外側。</text></g></svg>
