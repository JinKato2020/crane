<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#102d4d"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137ac0"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ce343b"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="86" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="52" font-weight="500" text-anchor="middle">応力−ひずみ曲線：降伏の現れ方は材料で違う</text><text x="800" y="844" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">軟鋼には明瞭な降伏が現れる。材料によっては、はっきりした降伏がない。</text><text x="420" y="200" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="middle">軟鋼の例</text><path d="M170 690 L680 690" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><path d="M170 690 L170 280" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><text x="420" y="760" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">ひずみ</text><text x="80" y="300" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">応力</text><text x="1180" y="200" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="middle">明瞭な降伏がない材料の例</text><path d="M930 690 L1440 690" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><path d="M930 690 L930 280" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><text x="1180" y="760" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">ひずみ</text><text x="840" y="300" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">応力</text><path d="M170 690 L310 415 L340 440 L420 440 C500 365 550 340 605 355 L650 395" fill="none" stroke="#137ac0" stroke-width="6"/><path d="M360 435 L430 300" fill="none" stroke="#ce343b" stroke-width="3"/><text x="330" y="270" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">降伏の区間</text><path d="M930 690 C980 585 1000 475 1055 425 C1130 355 1240 325 1340 365 L1410 420" fill="none" stroke="#137ac0" stroke-width="6"/></svg>