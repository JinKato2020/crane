<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-label="例題5：支点からの距離で比べる"><title>例題5：支点からの距離で比べる</title><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#2d769c"/></marker><marker id="red" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#b74b42"/></marker><marker id="gold" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#ba8033"/></marker></defs><rect width="1000" height="810" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">例題5：支点からの距離で比べる</text><text x="500" y="132" font-size="30" fill="#718390" text-anchor="middle" font-weight="500">長さは、すべて支点Oから読み直す</text><path d="M150,220 L850,220" fill="none" stroke="#718390" stroke-width="2"/><path d="M150,211 L150,229" fill="none" stroke="#718390" stroke-width="2"/><path d="M850,211 L850,229" fill="none" stroke="#718390" stroke-width="2"/><text x="500.0" y="204" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">A〜C：70cm</text><path d="M150,310 L500,310" fill="none" stroke="#718390" stroke-width="2"/><path d="M150,301 L150,319" fill="none" stroke="#718390" stroke-width="2"/><path d="M500,301 L500,319" fill="none" stroke="#718390" stroke-width="2"/><text x="325.0" y="294" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">35cm</text><path d="M500,310 L850,310" fill="none" stroke="#718390" stroke-width="2"/><path d="M500,301 L500,319" fill="none" stroke="#718390" stroke-width="2"/><path d="M850,301 L850,319" fill="none" stroke="#718390" stroke-width="2"/><text x="675.0" y="294" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">70−35＝35cm</text><path d="M500,395 L700,395" fill="none" stroke="#718390" stroke-width="2"/><path d="M500,386 L500,404" fill="none" stroke="#718390" stroke-width="2"/><path d="M700,386 L700,404" fill="none" stroke="#718390" stroke-width="2"/><text x="600.0" y="379" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">20cm</text><path d="M150,450 L850,450" fill="none" stroke="#203d53" stroke-width="10"/><circle cx="150" cy="450" r="6" fill="#203d53"/><text x="150" y="493" font-size="30" fill="#203d53" text-anchor="middle" font-weight="700">A</text><circle cx="500" cy="450" r="6" fill="#203d53"/><text x="500" y="435" font-size="30" fill="#203d53" text-anchor="middle" font-weight="700">O</text><circle cx="700" cy="450" r="6" fill="#203d53"/><text x="700" y="493" font-size="30" fill="#203d53" text-anchor="middle" font-weight="700">B</text><circle cx="850" cy="450" r="6" fill="#203d53"/><text x="850" y="493" font-size="30" fill="#203d53" text-anchor="middle" font-weight="700">C</text><path d="M500,455 L470,525 L530,525 Z" fill="#d8e4eb" stroke="#203d53" stroke-width="3"/><text x="500" y="565" font-size="30" fill="#203d53" text-anchor="middle" font-weight="500">支点</text><path d="M150,510 L150,615" fill="none" stroke="#2d769c" stroke-width="5" marker-end="url(#arrow)"/><text x="150" y="662" font-size="35" fill="#2d769c" text-anchor="middle" font-weight="700">30kg</text><path d="M700,510 L700,615" fill="none" stroke="#ba8033" stroke-width="5" marker-end="url(#gold)"/><text x="700" y="662" font-size="35" fill="#ba8033" text-anchor="middle" font-weight="700">p kg</text><path d="M850,510 L850,615" fill="none" stroke="#2d769c" stroke-width="5" marker-end="url(#arrow)"/><text x="850" y="662" font-size="35" fill="#2d769c" text-anchor="middle" font-weight="700">10kg</text><text x="500" y="745" font-size="31" fill="#203d53" text-anchor="middle" font-weight="500">右端の10kgの腕は、70cmではなく35cm。</text></g></svg>
