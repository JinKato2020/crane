<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">スターデルタ始動の結線</title><desc id="desc">始動時は3本の巻線の一端を共通点へつなぐスター結線。通常運転は巻線を三角形につなぐデルタ結線。同じ電源でデルタで直接始動する場合と比べ、スター始動の電源電流と始動トルクは約3分の1。</desc>
<rect width="900" height="760" rx="18" fill="white"/>
<style>text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#213b50}.heading{font-size:38px;font-weight:700}.sub{font-size:32px;font-weight:700}.label{font-size:28px}.note{font-size:26px;fill:#536776}.wire{fill:none;stroke:#324e60;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="450" y="64" text-anchor="middle" class="heading">同じ3つの巻線を、つなぎ替える</text>
<text x="235" y="146" text-anchor="middle" class="sub">始動時：Y（スター）</text>
<text x="665" y="146" text-anchor="middle" class="sub">通常運転：Δ（デルタ）</text>
<path class="wire" transform="translate(125 230) rotate(45.0)" d="M0 0 H37.78174593052023 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H155.56349186104046"/>
<circle cx="125" cy="230" r="5" fill="#324e60"/>
<path class="wire" transform="translate(345 230) rotate(135.0)" d="M0 0 H37.78174593052023 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H155.56349186104046"/>
<circle cx="345" cy="230" r="5" fill="#324e60"/>
<path class="wire" transform="translate(235 460) rotate(-90.0)" d="M0 0 H20.0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H120.0"/>
<circle cx="235" cy="460" r="5" fill="#324e60"/>
<circle cx="235" cy="340" r="5" fill="#324e60"/>
<text x="125" y="212" text-anchor="middle" class="label">L1</text>
<text x="345" y="212" text-anchor="middle" class="label">L2</text>
<text x="235" y="500" text-anchor="middle" class="label">L3</text>
<path class="wire" d="M235 340 L325 350"/>
<text x="335" y="360" text-anchor="start" class="label">共通点</text>
<path class="wire" transform="translate(665 224) rotate(118.03116787125155)" d="M0 0 H82.35297299207731 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H244.70594598415462"/>
<path class="wire" transform="translate(550 440) rotate(0.0)" d="M0 0 H75.0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H230.0"/>
<path class="wire" transform="translate(780 440) rotate(-118.03116787125155)" d="M0 0 H82.35297299207731 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H244.70594598415462"/>
<circle cx="665" cy="224" r="5" fill="#324e60"/>
<circle cx="550" cy="440" r="5" fill="#324e60"/>
<circle cx="780" cy="440" r="5" fill="#324e60"/>
<path class="wire" d="M665 224 L665 190"/>
<text x="665" y="180" text-anchor="middle" class="label">L1</text>
<path class="wire" d="M550 440 L510 440"/>
<text x="503" y="451" text-anchor="end" class="label">L2</text>
<path class="wire" d="M780 440 L820 440"/>
<text x="828" y="451" text-anchor="start" class="label">L3</text>
<text x="235" y="555" text-anchor="middle" class="note">巻線の一端を、1か所に集める</text>
<text x="665" y="555" text-anchor="middle" class="note">巻線を、三角形につなぐ</text>
<path d="M434 325 H470 M460 314 L473 325 L460 336" class="wire"/>
<text x="450" y="655" text-anchor="middle" class="sub">Y始動では、電源電流・始動トルクは約1/3</text>
<text x="450" y="705" text-anchor="middle" class="note">Δで直接始動する場合と比較。図は接続の原理。</text>
</svg>
