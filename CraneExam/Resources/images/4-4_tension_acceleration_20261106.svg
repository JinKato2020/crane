<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-label="ロープの負担は「加速度」で変わる"><title>ロープの負担は「加速度」で変わる</title><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#2d769c"/></marker><marker id="red" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#b74b42"/></marker><marker id="gold" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16" fill="#ba8033"/></marker></defs><rect width="1000" height="840" fill="white"/><g font-family="Meiryo, sans-serif"><text x="500" y="76" font-size="40" fill="#203d53" text-anchor="middle" font-weight="700">ロープの負担は「加速度」で変わる</text><text x="500" y="132" font-size="29" fill="#718390" text-anchor="middle" font-weight="500">同じ荷をつる。下向きの重力は変わらない</text><text x="190" y="205" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">上向きに加速</text><rect x="110" y="390" width="160" height="100" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><path d="M190,375 L190,225" fill="none" stroke="#2d769c" stroke-width="6" marker-end="url(#arrow)"/><text x="218" y="320" font-size="27" fill="#2d769c" text-anchor="start" font-weight="500">張力</text><path d="M190,505 L190,605" fill="none" stroke="#b74b42" stroke-width="6" marker-end="url(#red)"/><text x="218" y="565" font-size="27" fill="#b74b42" text-anchor="start" font-weight="500">重量</text><text x="190" y="685" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">張力 ＞ 重量</text><text x="500" y="205" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">加速度0</text><rect x="420" y="390" width="160" height="100" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><path d="M500,375 L500,275" fill="none" stroke="#2d769c" stroke-width="6" marker-end="url(#arrow)"/><text x="528" y="320" font-size="27" fill="#2d769c" text-anchor="start" font-weight="500">張力</text><path d="M500,505 L500,605" fill="none" stroke="#b74b42" stroke-width="6" marker-end="url(#red)"/><text x="528" y="565" font-size="27" fill="#b74b42" text-anchor="start" font-weight="500">重量</text><text x="500" y="685" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">張力 ＝ 重量</text><text x="810" y="205" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">下向きに加速</text><rect x="730" y="390" width="160" height="100" rx="14" fill="#f0f5f8" stroke="#d4dfe6" stroke-width="2"/><path d="M810,375 L810,325" fill="none" stroke="#2d769c" stroke-width="6" marker-end="url(#arrow)"/><text x="838" y="320" font-size="27" fill="#2d769c" text-anchor="start" font-weight="500">張力</text><path d="M810,505 L810,605" fill="none" stroke="#b74b42" stroke-width="6" marker-end="url(#red)"/><text x="838" y="565" font-size="27" fill="#b74b42" text-anchor="start" font-weight="500">重量</text><text x="810" y="685" font-size="31" fill="#203d53" text-anchor="middle" font-weight="700">張力 ＜ 重量</text><text x="500" y="775" font-size="31" fill="#203d53" text-anchor="middle" font-weight="500">巻下げを減速するときも、加速度は上向き。</text></g></svg>
