<text x="835" y="1550" text-anchor="middle" font-size="22" font-weight="700" fill="#286897">設備や使用状況が変わる</text>
<text x="64" y="72" text-anchor="start" font-size="24" font-weight="700" fill="#286897">第2章  /  全体のつながり</text>
<text x="64" y="139" text-anchor="start" font-size="46" font-weight="700" fill="#19374C">法令は「いつ、何をするか」でつなぐ</text>
<text x="64" y="188" text-anchor="start" font-size="26" font-weight="400" fill="#506777">準備して使い始め、点検しながら使い続ける。異常や変更があれば、対応が必要。</text>
<text x="64" y="1632" text-anchor="start" font-size="22" font-weight="400" fill="#506777">具体的な数字は「対象・条件・以上／未満」と一緒に本文で確認。図は手続きの関係を示す。</text>
<rect x="64" y="270" width="400" height="207" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 294H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="337" text-anchor="start" font-size="30" font-weight="700" fill="#286897">クレーンを区分する</text>
<text x="88" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">つり上げ荷重・種類を確認</text>
<text x="88" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">操作方式も資格の区分に関係</text>
<rect x="620" y="270" width="420" height="207" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M644 294H685" stroke="#286897" stroke-width="5"/>
<text x="644" y="337" text-anchor="start" font-size="30" font-weight="700" fill="#286897">製造・設置の手続き</text>
<text x="644" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">対象に応じた許可・届出</text>
<text x="644" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">使い始める前に所定の検査</text>
<rect x="1196" y="270" width="420" height="244" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1220 294H1261" stroke="#286897" stroke-width="5"/>
<text x="1220" y="337" text-anchor="start" font-size="28" font-weight="700" fill="#286897">使用開始の条件を整える</text>
<text x="1220" y="378" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">検査証の対象なら取得</text>
<text x="1220" y="413" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">設備・設置場所の基準も確認</text>
<text x="1220" y="448" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">作業開始前の点検も実施</text>
<rect x="64" y="690" width="420" height="244" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 714H129" stroke="#9B6B27" stroke-width="5"/>
<text x="88" y="757" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">資格と用具を確認</text>
<text x="88" y="798" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">運転と玉掛けの資格は別</text>
<text x="88" y="833" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">荷に合う玉掛用具を選ぶ</text>
<text x="88" y="868" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">損傷・強度などの基準を守る</text>
<rect x="1196" y="690" width="420" height="244" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1220 714H1261" stroke="#287E70" stroke-width="5"/>
<text x="1220" y="757" text-anchor="start" font-size="30" font-weight="700" fill="#287E70">安全に使う</text>
<text x="1220" y="798" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">定格荷重などの能力を守る</text>
<text x="1220" y="833" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">合図・立入禁止・運転位置</text>
<text x="1220" y="868" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">強風などで危険なら作業中止</text>
<rect x="1196" y="1190" width="420" height="281" rx="20" fill="#EEF7F4" stroke="#D8E3E9" stroke-width="2"/>
<path d="M1220 1214H1261" stroke="#287E70" stroke-width="5"/>
<text x="1220" y="1257" text-anchor="start" font-size="28" font-weight="700" fill="#287E70">点検・検査を繰り返す</text>
<text x="1220" y="1298" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">作業開始前・月次・年次</text>
<text x="1220" y="1333" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">暴風・地震の後も条件に応じ実施</text>
<text x="1220" y="1368" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">定期検査・暴風後等の記録は3年</text>
<text x="1220" y="1403" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">作業開始前点検は保存規定外</text>
<rect x="650" y="1190" width="370" height="207" rx="20" fill="#FBF6EB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M674 1214H715" stroke="#9B6B27" stroke-width="5"/>
<text x="674" y="1257" text-anchor="start" font-size="30" font-weight="700" fill="#9B6B27">直ちに補修</text>
<text x="674" y="1298" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">異常を放置しない</text>
<text x="674" y="1333" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">補修して安全を確かめる</text>
<rect x="64" y="1190" width="420" height="318" rx="20" fill="#F0F6FB" stroke="#D8E3E9" stroke-width="2"/>
<path d="M88 1214H129" stroke="#286897" stroke-width="5"/>
<text x="88" y="1257" text-anchor="start" font-size="28" font-weight="700" fill="#286897">更新・変更・休止・廃止</text>
<text x="88" y="1298" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">検査証の更新には性能検査</text>
<text x="88" y="1333" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">設備の変更 → 所定の手続き</text>
<text x="88" y="1368" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">検査証の期限を超える休止</text>
<text x="88" y="1403" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">→ 再開時に使用再開検査</text>
<text x="88" y="1438" text-anchor="start" font-size="24" font-weight="400" fill="#19374C">廃止など → 検査証を返還</text>
</g></svg>
