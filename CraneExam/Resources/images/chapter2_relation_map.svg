<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1670" viewBox="0 0 1680 1670" role="img" aria-labelledby="title desc">
<title id="title">第2章 法令は「いつ、何をするか」でつなぐ</title>
<desc id="desc">準備して使い始め、点検しながら使い続ける。異常や変更があれば、対応が必要。。対象で決まる。準備を整える。運転資格の区分も確認。人と用具の条件も満たす。条件が整ってから使用。使い続ける間も確認。異常あり。補修・安全確認後に使用。設備や使用状況が変わる</desc>
<metadata>{&quot;chapter&quot;: 2, &quot;design&quot;: &quot;labelled-relationships-v2&quot;, &quot;sectionReferences&quot;: [&quot;2-0&quot;, &quot;2-1&quot;, &quot;2-2&quot;, &quot;2-3&quot;, &quot;2-4&quot;, &quot;2-5&quot;, &quot;2-6&quot;], &quot;nodes&quot;: [{&quot;id&quot;: &quot;classify&quot;, &quot;x&quot;: 64, &quot;y&quot;: 270, &quot;w&quot;: 400, &quot;h&quot;: 207, &quot;title&quot;: &quot;クレーンを区分する&quot;, &quot;lines&quot;: [&quot;つり上げ荷重・種類を確認&quot;, &quot;操作方式も資格の区分に関係&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;2-0&quot;, &quot;2-1&quot;, &quot;2-6&quot;]}, {&quot;id&quot;: &quot;install&quot;, &quot;x&quot;: 620, &quot;y&quot;: 270, &quot;w&quot;: 420, &quot;h&quot;: 207, &quot;title&quot;: &quot;製造・設置の手続き&quot;, &quot;lines&quot;: [&quot;対象に応じた許可・届出&quot;, &quot;使い始める前に所定の検査&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;2-1&quot;]}, {&quot;id&quot;: &quot;ready&quot;, &quot;x&quot;: 1196, &quot;y&quot;: 270, &quot;w&quot;: 420, &quot;h&quot;: 244, &quot;title&quot;: &quot;使用開始の条件を整える&quot;, &quot;lines&quot;: [&quot;検査証の対象なら取得&quot;, &quot;設備・設置場所の基準も確認&quot;, &quot;作業開始前の点検も実施&quot;], &quot;color&quot;: &quot;#286897&quot;, &quot;refs&quot;: [&quot;2-1&quot;, &quot;2-3&quot;]}, {&quot;id&quot;: &quot;people&quot;, &quot;x&quot;: 64, &quot;y&quot;: 690, &quot;w&quot;: 420, &quot;h&quot;: 244, &quot;title&quot;: &quot;資格と用具を確認&quot;, &quot;lines&quot;: [&quot;運転と玉掛けの資格は別&quot;, &quot;荷に合う玉掛用具を選ぶ&quot;, &quot;損傷・強度などの基準を守る&quot;], &quot;color&quot;: &quot;#9B6B27&quot;, &quot;refs&quot;: [&quot;2-5&quot;, &quot;2-6&quot;]}, {&quot;id&quot;: &quot;use&quot;, &quot;x&quot;: 1196, &quot;y&quot;: 690, &quot;w&quot;: 420, &quot;h&quot;: 244, &quot;title&quot;: &quot;安全に使う&quot;, &quot;lines&quot;: [&quot;定格荷重などの能力を守る&quot;, &quot;合図・立入禁止・運転位置&quot;, &quot;強風などで危険なら作業中止&quot;], &quot;color&quot;: &quot;#287E70&quot;, &quot;refs&quot;: [&quot;2-2&quot;]}, {&quot;id&quot;: &quot;inspect&quot;, &quot;