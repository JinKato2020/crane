<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#102d4d"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137ac0"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ce343b"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="86" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="52" font-weight="500" text-anchor="middle">感電の影響は「電流」と「時間」で変わる</text><text x="800" y="844" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">電流が大きく、通電時間が長いほど、人体への影響は大きくなりやすい。</text><path d="M280 700 L1300 700" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><path d="M280 700 L280 200" fill="none" stroke="#102d4d" stroke-width="4" marker-end="url(#a0)"/><text x="800" y="775" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="34" font-weight="500" text-anchor="middle">人体を流れる電流　小 → 大</text><text x="85" y="350" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="start">通電時間</text><text x="145" y="420" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">長</text><text x="145" y="675" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">短</text><path d="M480 590 L1120 290" fill="none" stroke="#ce343b" stroke-width="14" marker-end="url(#a2)"/><text x="850" y="235" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="34" font-weight="500" text-anchor="middle">影響が大きくなりやすい</text><text x="850" y="630" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" text-anchor="middle">関係を示す模式図（数値の境界線ではない）</text></svg>