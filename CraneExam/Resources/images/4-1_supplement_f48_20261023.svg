<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#102d4d"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137ac0"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ce343b"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="86" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="52" font-weight="500" text-anchor="middle">3つ以上の力も、矢印を順につなぐ</text><text x="800" y="844" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="middle">矢印の先に次の矢印を移す。最初から最後へ結ぶ矢印が合力。</text><text x="400" y="190" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="34" font-weight="500" text-anchor="middle">もとの3つの力</text><text x="1130" y="190" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="34" font-weight="500" text-anchor="middle">順につないだ図</text><path d="M350 580 L630 580" fill="none" stroke="#137ac0" stroke-width="6" marker-end="url(#a1)"/><path d="M350 580 L350 370" fill="none" stroke="#102d4d" stroke-width="6" marker-end="url(#a0)"/><path d="M350 580 L210 580" fill="none" stroke="#102d4d" stroke-width="6" marker-end="url(#a0)"/><text x="480" y="630" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">4 N</text><text x="365" y="400" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">3 N</text><text x="190" y="635" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">2 N</text><path d="M900 650 L1180 650" fill="none" stroke="#137ac0" stroke-width="6" marker-end="url(#a1)"/><path d="M1180 650 L1180 440" fill="none" stroke="#102d4d" stroke-width="6" marker-end="url(#a0)"/><path d="M1180 440 L1040 440" fill="none" stroke="#102d4d" stroke-width="6" marker-end="url(#a0)"/><path d="M900 650 L1040 440" fill="none" stroke="#ce343b" stroke-width="7" marker-end="url(#a2)"/><text x="1020" y="710" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">4 N</text><text x="1210" y="550" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">3 N</text><text x="1070" y="400" fill="#102d4d" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start">2 N</text><text x="900" y="470" fill="#ce343b" font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="34" font-weight="500" text-anchor="start">合力</text></svg>