name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  testflight:
    runs-on: macos-26
    env:
      SCHEME: CraneExam
      BUNDLE_ID: com.safa.crane
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read version (project.yml が唯一の採番源)
        run: |
          VER=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          BLD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "BLD=$BLD" >> "$GITHUB_ENV"
          # GitHub Actions の先頭(通知)とサマリに必ず v{VER} ({BLD}) を表示
          echo "::notice title=Version::v$VER ($BLD)"
          echo "## 🏷️ v$VER ($BLD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        run: xcodegen generate

      # --- 手動署名(JLPTアプリと同じ実績ある方式に合わせる)---
      - name: Setup signing keychain
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_PWD_CLEAN=$(printf '%s' "$CERT_PWD" | tr -d '\r\n[:space:]')
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "tempkeychain" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "tempkeychain" "$KEYCHAIN_PATH"
          printf '%s' "$CERT_B64" | base64 --decode > cert.p12
          if [ ! -s cert.p12 ]; then echo "::error::Decoded .p12 is empty"; exit 1; fi
          echo "::notice::cert.p12 size: $(wc -c < cert.p12) bytes"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PWD_CLEAN" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "tempkeychain" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          rm cert.p12

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_CRANE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -o - -)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "::notice::Provisioning profile UUID: $PROFILE_UUID"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm profile.mobileprovision

      - name: Apply manual signing to app target
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          TEAM_ID=$(printf '%s' "$TEAM" | tr -d '\r\n[:space:]')
          ruby -rxcodeproj -e 'nil' 2>/dev/null || gem install xcodeproj --no-document
          cat > "$RUNNER_TEMP/appsign.rb" <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open("CraneExam.xcodeproj")
          app = proj.targets.find { |t| t.name == 'CraneExam' } ||
                proj.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          abort "app target not found" unless app
          app.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_UUID']
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          end
          proj.save
          puts "Manual signing applied to '#{app.name}'"
          RUBY
          TEAM_ID="$TEAM_ID" ruby "$RUNNER_TEMP/appsign.rb"

      - name: Archive (manual signed)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CraneExam.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CraneExam.xcarchive" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BLD"

      - name: Write ExportOptions.plist
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          TEAM_ID=$(printf '%s' "$TEAM" | tr -d '\r\n[:space:]')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CraneExam.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then echo "::error::IPA export failed"; exit 1; fi
          echo "::notice::IPA created: $IPA_PATH"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "::notice::Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app --file "$IPA_PATH" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/.appstoreconnect

      # GitHub側にも必ず v{VER} ({BLD}) をタイトルとして残す(タグ＋リリース)。
      # バージョンは project.yml で手動管理。再ビルド時は CURRENT_PROJECT_VERSION を必ず増やすこと。
      - name: Tag & Release (GitHub タイトル = v{VER} ({BLD}))
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER+$BLD"
          TITLE="v$VER ($BLD)"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --title "$TITLE" --target "$GITHUB_SHA" \
              --notes "TestFlight build $TITLE (bundle $BUNDLE_ID)"
          fi
          echo "::notice title=Released::$TITLE"

      - name: Save IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraneExam-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
